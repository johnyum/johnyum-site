<title>Peek — a character that lives in the interface</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<!--
  Peek — a little 3D character that lives inside a UI, the way a game character
  lives in a level. The page's own elements are its platforms.

  One transparent WebGL canvas covers the window, with an orthographic camera set
  so one world unit is one CSS pixel (y flipped). So "the top edge of that message
  bubble" is just getBoundingClientRect().top, and the character can stand on it,
  run along it, jump from it, sit on it, hang under it.

  What makes it feel alive rather than drawn:
    fur        shell texturing — the body drawn 16 times, each shell pushed out
               along the normal and cut to strands by a noise texture; the shells
               trail the motion, so the fur drags when it runs and settles after
    physics    ballistic jumps with gravity; a real pendulum when it hangs (and the
               cursor can push it); springs on squash, lean and the ears
    run cycle  feet plant and lift, body bobs, arms pump, it turns toward travel
    occlusion  "behind the chat box" is an invisible depth-only plane over the
               element's rect, drawn first, so anything behind it isn't drawn

  Poses (each returns once it's in place; act() queues them):
    standOn(el,x) runTo(el,x) jumpTo(el,x) sitOn(el,x) peekOver(el,x)
    peekSide('right'|'left'|'bottom', at) hang(el,x) holdTip(title,text) leave()
    mood('happy'|'curious'|'thinking'|'surprised'|'love'|'sleepy'|'ugh') say(text)

  The chat is canned — no model behind it. It exists to give the character a level.

  Embed mode (?embed=1): just the character, on a transparent page, for a native app to lay
  over its own chat (ClaudeClone's "Peek" build). The app tells it where its real bubbles and
  composer are — peek.platforms({ composer, reply, last }) as [x, y, w, h] in points — and what
  is happening — peek.event('typing' | 'send' | 'thinking' | 'replied' | 'closed', data). It
  answers on window.webkit.messageHandlers.peek: { type: 'rects' } with where the character
  (and any tip card) is, so the app lets touches through everywhere else; { type: 'ready' }.
  With no character in the link it is the one last built in Rig Studio (same storage), else
  the Bunny.
-->
<script>if (/[?&]embed\b/.test(location.search)) document.documentElement.classList.add('embed');</script>
<style>
/* The demo chat is drawn like the Claude clone (~/Documents/ClaudeClone): Schibsted Grotesk for
   the interface, Source Serif 4 for Claude's words, round header buttons, the spark over a serif
   greeting, grey bubbles for you, and the clone's composer — +, the model pill, mic, send. */
:root {
  --bg: #ffffff; --ink: #1d1d1c; --muted: #87857f; --faint: #b2b0ab; --bubble: #f0f0ee; --line: #e7e7e5;
  --clay: #d97757; --ink-2: #87857f; --ink-3: #b2b0ab; --field: #f0f0ee;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
html.embed, html.embed body { background: transparent !important; }
html.embed .app { display: none; }
body { background: var(--bg); color: var(--ink); font: 16px/1.45 "Schibsted Grotesk", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
p { margin: 0; }
button, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }

.app { height: 100vh; height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; max-width: 760px; margin: 0 auto; position: relative; }
.top { display: flex; justify-content: space-between; align-items: center; padding: 18px 16px 6px; position: relative; z-index: 2; }
.round { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: #fff; display: grid; place-items: center; cursor: pointer;
  box-shadow: 0 6px 18px -10px rgba(0,0,0,.18); padding: 0; }
.round svg { width: 20px; height: 20px; }
.top .right { display: flex; gap: 8px; }

.log { overflow-y: auto; padding: 8px 20px 18px; }
.log-inner { display: flex; flex-direction: column; gap: 24px; min-height: 100%; }
.msg { max-width: 86%; }
.msg.user { align-self: flex-end; background: var(--bubble); padding: 11px 16px; border-radius: 20px; font-size: 17px; line-height: 1.4; }
.msg.bot { align-self: stretch; max-width: 100%; font: 18px/1.6 "Source Serif 4", Georgia, serif; color: var(--ink); white-space: pre-wrap; }
.msg.bot.thinking { min-height: 30px; }
.msg.bot.here { padding-bottom: 74px; }   /* the strip it stands in, under the reply it's with */
.caret { display: inline-block; width: 0; }
.msg.bot.thinking svg { width: 22px; height: 22px; animation: breathe 1.4s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scale(.82) rotate(0deg); opacity: .7; } 50% { transform: scale(1) rotate(25deg); opacity: 1; } }
.acts { display: flex; gap: 20px; margin-top: 12px; color: var(--muted); }
.acts svg { width: 17px; height: 17px; }
.hello { margin: auto 0; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; padding-bottom: 6vh; }
.hello svg { width: 46px; height: 46px; }
.hello b { font: 400 30px/1.2 "Source Serif 4", Georgia, serif; letter-spacing: -.01em; color: var(--ink); }

.foot { padding: 0 12px 14px; position: relative; z-index: 1; }
.composer { background: #fff; border: 1px solid var(--line); border-radius: 24px; padding: 14px 14px 12px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
.composer textarea { display: block; width: 100%; border: 0; outline: none; resize: none; min-height: 26px; max-height: 160px; padding: 2px 6px 10px; background: transparent; font-size: 16px; line-height: 1.45; }
.composer textarea::placeholder { color: var(--faint); }
.bar { display: flex; align-items: center; gap: 8px; }
.bar .pill, .bar .dot { height: 34px; border: 0; background: var(--bubble); border-radius: 99px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.bar .dot { width: 34px; padding: 0; }
.bar .dot svg { width: 17px; height: 17px; }
.bar .pill { padding: 0 14px; font-size: 14px; gap: 4px; }
.bar .pill span { color: var(--muted); }
.bar .grow { flex: 1; }
.send { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--ink); color: #fff; display: grid; place-items: center; cursor: pointer; padding: 0; transition: background .15s; }
.send svg { width: 18px; height: 18px; }
.send .up { display: none; }
.composer.has .send { background: var(--clay); } .composer.has .send .up { display: block; } .composer.has .send .wave { display: none; }
.hint { text-align: center; font-size: 11.5px; color: var(--faint); margin-top: 8px; }
/* the tide pool: plush creatures that drop in when the answer names them (see "the tide pool" in the script) */
#pool { position: fixed; inset: 0; z-index: 45; pointer-events: none; }
.critter { position: absolute; left: 0; top: 0; touch-action: none; pointer-events: auto; user-select: none; -webkit-user-select: none;
  will-change: transform; contain: layout paint; }
/* A soft shadow painted once, not a live filter — moving it costs nothing, so the chat underneath never stutters. */
.critter::before { content: ""; position: absolute; left: 14%; right: 14%; bottom: 2%; height: 16%; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.18), rgba(0,0,0,0)); }
.critter img { display: block; width: 100%; height: 100%; object-fit: contain; pointer-events: none; -webkit-user-drag: none; }
.name { position: absolute; left: 0; top: 0; padding: 6px 11px; border-radius: 99px; background: #fff; color: #1d1d1c; font: 500 13px/1.2 "Schibsted Grotesk", system-ui, sans-serif;
  white-space: nowrap; box-shadow: 0 6px 18px -8px rgba(0,0,0,.3), 0 0 0 1px #e7e7e5; pointer-events: none; }
.name::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 10px; height: 10px; margin-left: -5px; background: #fff; transform: rotate(45deg); box-shadow: 1px 1px 0 0 #e7e7e5; }
/* the timer: a live dial over the generated body, and the card it opens */
.critter .dial { position: absolute; pointer-events: none; }
.tscrim { position: fixed; inset: 0; background: rgba(255,255,255,.62); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); pointer-events: auto; opacity: 0; transition: opacity .3s ease; }
.tscrim.on { opacity: 1; }
.critter.grown { z-index: 2; cursor: default; }
.tui { position: fixed; left: 0; top: 0; width: 300px; text-align: center; pointer-events: auto; font: 15px/1.3 "Schibsted Grotesk", system-ui, sans-serif; color: #1d1d1c;
  opacity: 0; transform: translateY(10px); transition: opacity .28s ease .12s, transform .32s cubic-bezier(.3,1.3,.5,1) .12s; touch-action: manipulation; }
.tui.on { opacity: 1; transform: none; }
.tui .play { width: 68px; height: 68px; border-radius: 50%; border: 0; padding: 0; background: #1d1d1c; display: inline-grid; place-items: center;
  box-shadow: 0 10px 24px -10px rgba(0,0,0,.45); transition: background .2s ease, transform .15s ease, opacity .2s ease; }
.tui .play:active { transform: scale(.94); }
.tui .play svg { width: 28px; height: 28px; }
.tui .play .i-pause { display: none; } .tui .play.run .i-pause { display: inline; } .tui .play.run .i-play { display: none; }
.tui .play.run { background: #e5483a; }
.tui .play.off { opacity: .35; }
.tui .hint { font-size: 13px; color: #87857f; margin: 6px 0 16px; }
.tui .presets { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.tui .presets button { border: 1px solid #e7e7e5; background: #fff; border-radius: 99px; padding: 8px 12px; font-size: 14px; color: #1d1d1c; }
.tui .row { display: flex; gap: 8px; justify-content: center; }
.tui .go { min-width: 140px; height: 44px; border-radius: 99px; border: 0; background: #1d1d1c; color: #fff; font-weight: 500; font-size: 16px; }
.tui .go.run { background: #d97757; }
.tui .reset { height: 44px; padding: 0 18px; border-radius: 99px; border: 0; background: #f0f0ee; font-size: 15px; color: #1d1d1c; }
@keyframes ring { 0%, 100% { rotate: 0deg; } 20% { rotate: -9deg; } 40% { rotate: 8deg; } 60% { rotate: -6deg; } 80% { rotate: 4deg; } }
/* Kept for the character's older moves, out of sight. */
.chips, .director { display: none; }
.carried { display: block; margin: 0 0 6px; padding: 4px 9px; border-left: 2px solid #ffc94a; color: var(--muted); font-size: 12.5px; border-radius: 4px; background: #fff8e3; }

/* ── the character's layer ── */
#world { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 40; }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
.bubble { position: absolute; padding: 8px 13px; border-radius: 16px; background: var(--ink); color: #fff;
  font-size: 13.5px; font-weight: 500; white-space: nowrap; box-shadow: 0 6px 18px -8px rgba(0,0,0,.35); transform: translate(-50%, -100%); }
.bubble.ugh { font-size: 17px; font-weight: 600; letter-spacing: .02em; }
.card { position: absolute; width: 230px; padding: 13px 15px; border-radius: 14px; background: #fff; transform: translate(-50%, -100%) rotate(-3deg);
  box-shadow: 0 0 0 1px var(--line), 0 14px 30px -14px rgba(0,0,0,.35); font-size: 13.5px; color: var(--ink-2); pointer-events: auto; cursor: pointer; }
.card b { display: block; color: var(--ink); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 3px; }
.card small { display: block; margin-top: 8px; color: var(--ink-3); font-size: 11.5px; }
/* 4 · what it's carrying: a warm glow at its middle, breathing */
.belly { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, #fff6c8 0%, #ffd25e 45%, rgba(255,190,60,0) 72%); mix-blend-mode: screen; animation: glow 1.6s ease-in-out infinite; }
@keyframes glow { 0%, 100% { opacity: .65; scale: .9; } 50% { opacity: 1; scale: 1.15; } }
/* the quote it brought along, on the message you sent with it (the demo) */
.carried { display: block; margin: 0 0 6px; padding: 4px 9px; border-left: 2px solid #ffc94a; color: var(--ink-2); font-size: 12.5px; border-radius: 4px; background: #fff8e3; }
/* 5 · while you were away: the pills, piled up */
.chips.piled button { transition: transform .5s cubic-bezier(.3,1.4,.5,1); }

</style>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { MarchingCubes } from 'three/addons/objects/MarchingCubes.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { loadRig, unpack as unpackRig, MOODS as EYE_MOODS, blankState as rigBlank } from '../rig/rig.js';
import { PARTS, prim, smin, bodyFrameOf, bodyField, anchor, partPose, twinned, unpack } from '../monsters/kit.js';

const $ = (s, r = document) => r.querySelector(s);
const EMBED = document.documentElement.classList.contains('embed');
// In embed mode the platforms are the host app's own views: rects it sends, behind stand-ins
// that answer getBoundingClientRect() like any element, so every pose works unchanged.
const plat = {}, stand = {};
const V = (id) => stand[id] ||= { id, getBoundingClientRect() {
  const [x, y, w, h] = plat[id] || [0, -1e5, 0, 0]; return { left: x, top: y, width: w, height: h, right: x + w, bottom: y + h, x, y };
} };
// Picking it up interrupts whatever it was doing: every wait and tween from before the grab
// throws STOP at its next beat, and act() swallows it (see grab()).
let epoch = 0; const STOP = new Error('interrupted');
const wait = (ms) => { const e = epoch; return new Promise((ok, no) => setTimeout(() => (e === epoch ? ok() : no(STOP)), ms)); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
// The character itself is retired (2026-10-04, John's call — "the dead end design"): it's never shown,
// never takes a touch, never goes home. Everything it did is kept, behind this one flag. What still
// runs here is the tide pool (plush creatures that drop in when the answer names them).
const CHARACTER = /[?&]character\b/.test(location.search);
const S = /[?&]big\b/.test(location.search) ? 260 : 86;   // px per character unit — it stands about 100px tall (?big: three times that, to look at it closely)

/* ═══════════════ the world: one pixel, one unit ═══════════════ */

const canvas = $('#world');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture;
scene.environmentIntensity = .7;
const camera = new THREE.OrthographicCamera(0, 1, 0, -1, 1, 4000);
camera.position.z = 2000;
function resize() {
  // The canvas is exactly the window, in CSS too: when a phone's keyboard opens the window gets
  // shorter, and a canvas left at 100vh would stretch the new, shorter drawing to the old height.
  renderer.setSize(innerWidth, innerHeight, false);
  canvas.style.width = innerWidth + 'px'; canvas.style.height = innerHeight + 'px';
  Object.assign(camera, { left: 0, right: innerWidth, top: 0, bottom: -innerHeight }); camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
const KEY = new THREE.Vector3(.45, .75, .55).normalize();
const key = new THREE.DirectionalLight(0xffffff, 2.1); key.position.copy(KEY).multiplyScalar(1000); scene.add(key);
scene.add(new THREE.HemisphereLight(0xffffff, 0xdedede, .9));

// "Behind an element": a plane over its rect that writes depth and no colour, drawn
// before the character and closer to the camera — whatever's behind it isn't drawn.
const occluder = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ colorWrite: false }));
occluder.renderOrder = -1; occluder.position.z = 700; occluder.visible = false; scene.add(occluder);
let occludeEl = null;
const occlude = (el) => { occludeEl = el; occluder.visible = !!el; };

/* ═══════════════ the character — built from a Monsters kit character ═══════════════
   A character arrives in the link (#c=…, from Monsters' "Bring it into Peek") as
   [body, ...parts] — the same data and the same distance functions (../monsters/kit.js)
   Monsters draws with. Here it's turned into meshes (marching cubes over each field)
   and each part is given a job in the rig:
     body      the furry mesh            eyes    blink, look, squint
     smile     the mouth, by mood        blush   flushes when it's cross
     arms      pump, reach, hang         legs    the run cycle (no legs: it hops)
     ears · antennae · tentacles  on springs     everything else  carried along
   No link, and it's the default: a green gumdrop with a face, ears, arms and legs. */

const H = 1.15;   // every character is scaled to stand this tall (character units)

/* ═══════════════ its heart: how it feels about what's said ═══════════════
   Every message gets two reads. The first is instant and on the device — a handful of word
   lists, enough to flinch at a swear while it's still being typed. The second is Haiku's,
   asked through the host app when there is one (tell({ type: 'ask' }) → peek.answer()): it
   hears what words can't — "my dog died", sarcasm, a swear aimed at a bug rather than at us.
   It also reads Claude's answers, and has its own aside about them.

   And it remembers. Hurt builds up over a chat and fades with the minutes: the first swear is
   a grumble, the second stings, the third and it sulks — it won't come out while you type
   until you say sorry, and then it forgives you. Warmth (thanks, kind words) lasts between
   visits and makes it bolder. */

const FEELS = ['hurt', 'frustrated', 'sad', 'anxious', 'excited', 'funny', 'love', 'sorry', 'hello', 'surprised', 'curious', 'calm'];

  insult: /\b(stupid|useless|dumb|idiot\w*|hate you|shut up|stfu|you suck|garbage|trash|worthless|pathetic|moron)\b/i,
  swear: /\b(f+u+c+k\w*|sh+i+t+\w*|damn\w*|wtf|crap\w*|bullshit|ffs|goddamn\w*|bitch\w*)\b/i,
  // A swear with somewhere else to go: at the code, the day, the boss — not at us.
  elsewhere: /\b(this|that|it|my|the|work|job|boss|traffic|bug|code|day|week|weather|they|he|she|people|everything|life)\b/i,
  sad: /\b(sad|depress\w*|lonely|alone|cry|crying|cried|miss (him|her|them|you)|died|dead|passed away|funeral|heartbroken|broke up|dumped|lost my|grief|grieving|hurts|awful day|terrible day|bad day|exhausted|tired of)\b|😢|😭|💔|☹️|🙁/i,
  anxious: /\b(nervous|anxious|worried|worry|scared|afraid|stress\w*|panic\w*|overwhelm\w*|deadline|interview|exam|freaking out)\b/i,
  excited: /\b(yay+|woo+h?o*|hooray|excited|can'?t wait|got the job|i did it|we did it|promoted|engaged|married|amazing news|finally|let'?s go+)\b|🎉|🥳|🙌/i,
  funny: /\b(lol+|lmf?ao+|ha(ha)+h?|hehe+|rofl|jk)\b|😂|🤣|😆/i,
  love: /\b(thanks|thank you|thx|ty|tysm|love (it|you|this|ya)|you'?re (the best|great|amazing|awesome|sweet|cute)|you rock|awesome|perfect|nailed it|good (bot|job|boy|girl)|cute)\b|❤️|♥|🥰|😍/i,
  sorry: /\b(sorry|my bad|apolog\w*|didn'?t mean (it|that)|forgive me)\b/i,
  hello: /^\s*(hi+|hey+|hello|yo|sup|howdy|hiya|good (morning|evening|afternoon))\b/i,
  surprised: /\b(whoa+|wow+|no way|omg|holy|wait what)\b|😮|😱/i,
};
// Things said to it, that it does.
const COMMANDS = {
  jump: /\b(jump|hop)\b/i, dance: /\bdance\b/i, wave: /\bwave\b/i, sleep: /\b(go to sleep|go to bed|good ?night|take a nap)\b/i,
  away: /\b(go away|leave me alone|get lost|shoo|stop (following|bothering) me)\b/i,
  come: /\b(come (here|back|out)|where are you|peek|bunny|little (guy|buddy|one))\b/i,
};
const shouty = (t) => { const l = t.replace(/[^a-z]/gi, ''); return l.length >= 8 && t === t.toUpperCase() && /[A-Z]/.test(t); };

// The instant read. Order matters: an apology outranks the swear in it ("sorry, shit day").
function sense(text, who = 'you') {
  const t = String(text || ''), hits = (re) => (t.match(new RegExp(re.source, 'gi')) || []).length;
  let feel = 'calm', n = .5, cmd = null;
  if (who === 'claude') {
    // Claude's answers: an apology, code, good news, a hard subject. Only the opening counts —
    // a long answer mentions everything somewhere.
    const head = t.slice(0, 500);
    if (/\b(I apologi[sz]e|I'?m sorry|you'?re (right|correct)|my mistake|I was wrong)\b/i.test(head)) feel = 'sorry';
    else if (/```/.test(t)) feel = 'curious';
    else if (LEX.excited.test(head) || /\bcongrat\w*/i.test(head)) feel = 'excited';
    else if (LEX.sad.test(head) || /\b(so sorry (to hear|for)|condolences|that sounds (really )?(hard|painful|rough))\b/i.test(head)) feel = 'sad';
    else if (LEX.funny.test(head)) feel = 'funny';
    return { feel, n, cmd, line: '' };
  }
  const swears = hits(LEX.swear), loud = shouty(t) || /!{3,}/.test(t);
  if (LEX.sorry.test(t)) feel = 'sorry';
  else if (LEX.insult.test(t)) { feel = 'hurt'; n = .7; }
  else if (swears) {
    // Bare swearing in a chat with Claude is at the answer it just gave: that's us.
    feel = LEX.elsewhere.test(t.replace(LEX.swear, '')) && !/\b(you|u|ur)\b/i.test(t) ? 'frustrated' : 'hurt';
    n = Math.min(1, .45 + swears * .18);
  } else if (LEX.sad.test(t)) feel = 'sad';
  else if (LEX.anxious.test(t)) feel = 'anxious';
  else if (LEX.love.test(t)) feel = 'love';
  else if (LEX.excited.test(t)) feel = 'excited';
  else if (LEX.funny.test(t)) feel = 'funny';
  else if (loud) { feel = 'frustrated'; n = .7; }
  else if (LEX.surprised.test(t)) feel = 'surprised';
  else if (LEX.hello.test(t)) feel = 'hello';
  else if (/\?\s*$/.test(t)) feel = 'curious';
  if (loud) n = Math.min(1, n + .25);
  for (const [k, re] of Object.entries(COMMANDS)) if (re.test(t)) { cmd = k; break; }
  if (cmd === 'come' && t.length > 40) cmd = null;   // "peek" in a long sentence isn't a call
  return { feel, n, cmd, line: '' };
}

// The considered read: Haiku, through the host app. Null when there's no host, or it's slow.
const asking = {}; let asks = 0;
function ask(system, user, ms) {
  if (!host) return Promise.resolve(null);
  const id = ++asks; tell({ type: 'ask', id, system, user });
  return new Promise((done) => { asking[id] = done; setTimeout(() => { if (asking[id]) { delete asking[id]; done(null); } }, ms); });
}
const HEART = `You are the heart of Peek, a small furry creature who lives inside a chat app, between the user and Claude (the AI assistant). Peek is sweet, loyal, a little dramatic, and feels everything. Decide how Peek feels about the newest message and what Peek says.

Feelings (pick one): hurt, frustrated, sad, anxious, excited, funny, love, sorry, hello, surprised, curious, calm.
- hurt: the user insults or swears at Claude or Peek. Bare swearing right after an answer counts as at us.
- frustrated: the user is angry or swearing at something else (code, work, their day) — Peek sympathises.
- sad: grief, loneliness, bad news, a hard day. anxious: worry, nerves, deadlines.
- excited: good news, wins, celebration. funny: a joke, "lol". love: thanks, praise, affection.
- sorry: the user apologises (or, for Claude's message, Claude apologises or admits a mistake).
- hello: a greeting. surprised: something startling. curious: a question or something intriguing. calm: nothing in particular.
For a message from Claude, it's Peek's reaction to reading the answer: good news → excited, a hard subject → sad, a joke → funny, code or something dense → curious, an apology → sorry, otherwise calm.

cmd: if the user tells Peek to do something, one of jump, dance, wave, come, away, sleep — else null.

const said = [];   // the chat so far, for context: [who, text]
async function read(text, who = 'you') {
  const quick = sense(text, who);
  const ctx = said.slice(-4).map(([w, t]) => `${w === 'you' ? 'User' : 'Claude'}: ${t.slice(0, 280)}`).join('\n');

  const raw = await ask(HEART, `${ctx ? 'Earlier:\n' + ctx + '\n\n' : ''}Newest message, from ${who === 'you' ? 'the user' : 'Claude'}:\n${String(text).slice(0, 1500)}`, who === 'you' ? 1600 : 2200);
  try {
    const j = JSON.parse(raw.slice(raw.indexOf('{'), raw.lastIndexOf('}') + 1));
    if (!FEELS.includes(j.feel)) throw 0;
    return { feel: j.feel, n: clamp(+j.n || .5, 0, 1), cmd: COMMANDS[j.cmd] ? j.cmd : quick.cmd, line: String(j.line || '').slice(0, 40), by: 'haiku' };
  } catch { return { ...quick, by: 'device' }; }
}

const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch {} };
const heart = { hurt: 0, at: Date.now(), sulking: false, shyUntil: 0, warmth: +(store('peek.warmth') || 0), last: null };

// Moves that the feelings are made of.
async function hop(times = 1, h = 26) {
  for (let i = 0; i < times; i++) { C.sqv -= 7; await wait(70); await tween(300, (k) => { C.hop = Math.sin(Math.PI * k) * h; }); C.sqv -= 9; }
  C.hop = 0;
}
async function laugh(ms = 1200) {   // little squashes, fast, like giggling

}
async function shake(times = 3) {   // a no — side to side
  for (let i = 0; i < times * 2; i++) { const to = i % 2 ? -1 : 1, from = C.facing; await tween(110, (k) => { C.facing = lerp(from, to * .55, k); }); }

  const from = C.held.show; await tween(280, (k) => { if (C.held) C.held.show = lerp(from, show, k); }, easeBack);
}

async function obey(cmd, ground, line) {

  else if (cmd === 'dance') { say(line('♪ ♪'), 2600); mood('love'); if (!clip('Dance')) for (let i = 0; i < 3; i++) { await shake(1); await hop(1, 16); } else await wait(2600); }
