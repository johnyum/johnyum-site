<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>John Yum — Prototype</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    background: #fff;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* the video sits centred and fills ~85% of the viewport in whichever
     dimension binds first, keeping its own aspect ratio — never edge to edge */
  .viewer {
    max-width: 85vw;
    max-height: 85vh;
    width: auto;
    height: auto;
    border-radius: 16px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.18), 0 2px 8px rgba(0, 0, 0, 0.06);
    background: #000;
    display: block;
    outline: none;
  }
</style>
</head>
<body>
  <video class="viewer" controls playsinline preload="metadata">
    <source src="prototype.mp4" type="video/mp4">
    Your browser can't play this video.
  </video>
</body>
</html>
