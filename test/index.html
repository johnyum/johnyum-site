<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>John Yum — Prototype</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    background: #fff;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* Fill ~85% of whichever dimension binds first, holding the video's 16:9
     aspect. Sizing via aspect-ratio + a computed width so it's correct the
     instant the page loads (not dependent on the video's metadata). */
  .viewer {
    aspect-ratio: 16 / 9;
    width: min(85vw, calc(85vh * 16 / 9));
    height: auto;
    display: block;
    border-radius: 16px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.18), 0 2px 8px rgba(0, 0, 0, 0.06);
    background: #000;
    object-fit: cover;
    outline: none;
  }
</style>
</head>
<body>
  <video class="viewer" controls playsinline preload="metadata" poster="poster.jpg">
    <source src="prototype.mp4" type="video/mp4">
    Your browser can't play this video.
  </video>
</body>
</html>
