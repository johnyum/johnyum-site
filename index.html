<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>John Yum</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    background: #fff;
    color: #111;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
    cursor: text;
  }
  /* real input, visually hidden — it owns focus and the mobile keyboard */
  #key {
    position: fixed;
    width: 1px; height: 1px;
    opacity: 0;
    border: 0; padding: 0;
  }
  #line {
    display: flex;
    align-items: center;
    gap: 0.16em;
    font-size: clamp(4rem, 12vw, 10rem);
    user-select: none;
    transition: opacity 0.45s ease;
  }
  #line.gone { opacity: 0; }
  #dots {
    display: flex;
    align-items: center;
    gap: 0.16em;
  }
  #dots i {
    width: 0.16em;
    height: 0.16em;
    border-radius: 50%;
    background: #a3a3a3;
  }
  #dots:empty { display: none; }
  #caret {
    width: 0.035em;
    min-width: 2px;
    height: 1.05em;
    background: #111;
    animation: blink 1.06s step-end infinite;
  }
  /* caret holds solid while typing, like a real text field */
  #line.typing #caret { animation: none; opacity: 1; }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
  @keyframes shake {
    20% { transform: translateX(-0.12em); }
    40% { transform: translateX(0.1em); }
    60% { transform: translateX(-0.07em); }
    80% { transform: translateX(0.05em); }
  }
  #line.shake { animation: shake 0.35s ease; }
  body.unlocked #line { display: none; }
  #pile {
    position: fixed; inset: 0;
    overflow: hidden;
    display: none;
    pointer-events: none;
  }
  body.unlocked #pile { display: block; }
  #pile img {
    position: absolute; left: 0; top: 0;
    will-change: transform;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: auto;
    cursor: pointer;
  }
  /* soft veil between the pile and a lifted card */
  #pile::after {
    content: "";
    position: absolute; inset: 0;
    background: rgba(255, 255, 255, 0.82);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
    z-index: 1;
  }
  body.zoomcard #pile::after { opacity: 1; pointer-events: auto; }
  #pile img.zoom { z-index: 2; cursor: zoom-out; }
  @media (prefers-reduced-motion: reduce) {
    #pile img { transition: none !important; }
  }
  @media (prefers-reduced-motion: reduce) {
    #caret { animation: none; }
    #line.shake { animation: none; }
  }
</style>
</head>
<body>
  <input id="key" type="password" autocomplete="off" spellcheck="false" aria-label="Password">
  <div id="line" aria-hidden="true"><span id="dots"></span><span id="caret"></span></div>
  <div id="pile" aria-hidden="true"></div>
  <script>
  (() => {
    const PASSWORD = 'KnockKnock'; // client-side only: a curtain, not a lock
    const key = document.getElementById('key');
    const line = document.getElementById('line');
    const dots = document.getElementById('dots');
    let typingTimer;

    function focusKey() {
      if (!document.body.classList.contains('unlocked')) key.focus();
    }
    focusKey();
    addEventListener('pointerdown', () => setTimeout(focusKey, 0));
    key.addEventListener('blur', () => setTimeout(focusKey, 50));

    key.addEventListener('input', () => {
      dots.innerHTML = '<i></i>'.repeat(key.value.length);
      line.classList.add('typing');
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => line.classList.remove('typing'), 600);
    });

    key.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      if (key.value === PASSWORD) {
        key.value = '';
        key.blur();
        line.classList.add('gone');
        setTimeout(() => {
          document.body.classList.add('unlocked');
          // blank stage — the work showcase mounts here
          dispatchEvent(new CustomEvent('unlocked'));
        }, 450);
      } else {
        key.value = '';
        dots.innerHTML = '';
        line.classList.add('shake');
        line.addEventListener('animationend', () => line.classList.remove('shake'), { once: true });
      }
    });
  })();
  </script>
  <script>
  // After the knock: the calendar sketches rain down and pile up.
  // Axis-aligned physics with a 4px force field — cards never touch.
  (() => {
    const DIR = 'img/Calendar_Sketches/';
    const SKETCHES = [
      "Component 100-1.png", "Component 100.png", "Component 101-1.png",
      "Component 101.png", "Component 102.png", "Component 92-1.png",
      "Component 92-10.png", "Component 92-11.png", "Component 92-12.png",
      "Component 92-13.png", "Component 92-14.png", "Component 92-2.png",
      "Component 92-3.png", "Component 92-4.png", "Component 92-5.png",
      "Component 92-6.png", "Component 92-7.png", "Component 92-8.png",
      "Component 92-9.png", "Component 92.png", "Component 93.png",
      "Component 94.png", "Component 95.png", "Component 96.png",
      "Component 97.png", "Component 98.png", "Component 99.png",
      "Group 3.png"
    ];
    const ASPECT = 1840 / 900;
    const GAP = 4;        // the invisible force field
    const GRAV = 0.45;
    const REST = 0.18;    // bounce
    const MAXV = 22;
    const pile = document.getElementById('pile');
    let bodies = [], raf = null, calmFrames = 0, frames = 0, zoomed = null;

    // warm the image cache while the visitor is still at the door
    addEventListener('load', () => setTimeout(() => {
      for (const f of SKETCHES) { const im = new Image(); im.src = DIR + encodeURIComponent(f); }
    }, 600));

    addEventListener('unlocked', start, { once: true });

    function start() {
      const W = innerWidth, H = innerHeight;
      // size cards so the settled pile covers roughly half the viewport
      const w = Math.max(44, Math.min(120, Math.sqrt((W * H * 0.42) / (SKETCHES.length * ASPECT))));
      const h = w * ASPECT;
      const order = [...SKETCHES].sort(() => Math.random() - 0.5);
      bodies = order.map((f, i) => {
        const el = document.createElement('img');
        el.src = DIR + encodeURIComponent(f);
        el.alt = '';
        el.style.width = w + 'px';
        el.style.height = h + 'px';
        pile.appendChild(el);
        return {
          el, w, h,
          x: GAP + w / 2 + Math.random() * (W - w - GAP * 2),
          y: -h / 2 - i * (h * 0.35 + Math.random() * h * 0.25),
          vx: (Math.random() - 0.5) * 1.2,
          vy: 0,
          rot: (Math.random() - 0.5) * 7,
          spin: (Math.random() - 0.5) * 0.5,
          rest: false
        };
      });
      calmFrames = 0;
      frames = 0;
      if (!raf) raf = requestAnimationFrame(step);
    }

    function collide(a, b) {
      // tilted cards get a wider field so rotation can never cause overlap
      const pad = GAP + ((Math.abs(a.rot) > 0.5 || Math.abs(b.rot) > 0.5) ? 8 : 0);
      const dx = b.x - a.x;
      const px = (a.w + b.w) / 2 + pad - Math.abs(dx);
      if (px <= 0) return;
      const dy = b.y - a.y;
      const py = (a.h + b.h) / 2 + pad - Math.abs(dy);
      if (py <= 0) return;
      if (px < py) {
        const s = dx < 0 ? -1 : 1;
        a.x -= s * px / 2; b.x += s * px / 2;
        const rv = b.vx - a.vx;
        if (rv * s < 0) { const imp = -(1 + REST) * rv / 2; a.vx -= imp; b.vx += imp; }
      } else {
        const s = dy < 0 ? -1 : 1;
        a.y -= s * py / 2; b.y += s * py / 2;
        const rv = b.vy - a.vy;
        if (rv * s < 0) { const imp = -(1 + REST) * rv / 2; a.vy -= imp; b.vy += imp; }
        a.vx *= 0.95; b.vx *= 0.95;          // landing friction
        // upper card is supported; if it overhangs its support it tips
        // sideways and slides off instead of growing a tower
        const upper = s > 0 ? a : b, lower = s > 0 ? b : a;
        upper.rest = true;
        const off = upper.x - lower.x;
        if (Math.abs(off) > upper.w * 0.3) upper.vx += off * 0.015;
      }
    }

    function step() {
      const W = innerWidth, H = innerHeight;
      const SUB = 2;
      for (let s = 0; s < SUB; s++) {
        for (const b of bodies) {
          b.vy += GRAV / SUB;
          if (b.vy > MAXV) b.vy = MAXV;
          b.x += b.vx / SUB;
          b.y += b.vy / SUB;
          b.rest = false;
        }
        for (const b of bodies) {
          const hw = b.w / 2, hh = b.h / 2;
          if (b.x < hw + GAP) { b.x = hw + GAP; b.vx = Math.abs(b.vx) * REST; }
          if (b.x > W - hw - GAP) { b.x = W - hw - GAP; b.vx = -Math.abs(b.vx) * REST; }
          if (b.y > H - hh) {
            b.y = H - hh;
            if (b.vy > 0) b.vy = Math.abs(b.vy) < 1.2 ? 0 : -b.vy * REST;
            b.vx *= 0.9;
            b.rest = true;
          }
        }
        for (let it = 0; it < 3; it++) {
          for (let i = 0; i < bodies.length; i++) {
            for (let j = i + 1; j < bodies.length; j++) collide(bodies[i], bodies[j]);
          }
        }
      }
      let maxSpeed = 0;
      for (const b of bodies) {
        if (b === zoomed) continue; // a lifted card is the transition's to move
        if (b.rest) {
          b.rot *= 0.82;                      // straighten as it settles
          if (Math.abs(b.rot) < 0.05) b.rot = 0;
          if (Math.abs(b.vx) < 0.05) b.vx = 0;
          if (Math.abs(b.vy) < 0.05) b.vy = 0;
        } else {
          b.rot += b.spin;
        }
        const sp = Math.abs(b.vx) + Math.abs(b.vy);
        if (sp > maxSpeed) maxSpeed = sp;
        b.el.style.transform =
          `translate(${(b.x - b.w / 2).toFixed(2)}px, ${(b.y - b.h / 2).toFixed(2)}px) rotate(${b.rot.toFixed(2)}deg)`;
      }
      calmFrames = maxSpeed < 0.12 ? calmFrames + 1 : 0;
      frames++;
      // asleep, or out of patience with the last micro-creeper — freeze
      if (calmFrames > 30 || frames > 1500) {
        for (const b of bodies) { b.vx = 0; b.vy = 0; }
        raf = null;
        return;
      }
      raf = requestAnimationFrame(step);
    }

    // a resize wakes the pile so cards re-settle inside the new walls
    addEventListener('resize', () => {
      if (bodies.length && !raf) { calmFrames = 0; raf = requestAnimationFrame(step); }
    });

    // tap a card: it lifts out of the pile to full size; tap again,
    // the veil, or Escape and it glides back to its spot
    const EASE = 'transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1)';

    function zoom(b) {
      zoomed = b;
      document.body.classList.add('zoomcard');
      const s = Math.min((innerWidth * 0.82) / b.w, (innerHeight * 0.88) / b.h);
      b.el.classList.add('zoom');
      b.el.style.transition = EASE;
      b.el.style.transform =
        `translate(${innerWidth / 2 - b.w / 2}px, ${innerHeight / 2 - b.h / 2}px) scale(${s.toFixed(4)})`;
    }

    function unzoom() {
      const b = zoomed;
      zoomed = null;
      document.body.classList.remove('zoomcard');
      b.el.style.transition = EASE;
      b.el.style.transform =
        `translate(${(b.x - b.w / 2).toFixed(2)}px, ${(b.y - b.h / 2).toFixed(2)}px) rotate(${b.rot.toFixed(2)}deg)`;
      setTimeout(() => {
        if (zoomed !== b) { b.el.style.transition = ''; b.el.classList.remove('zoom'); }
      }, 500);
    }

    pile.addEventListener('click', e => {
      const el = e.target.closest('img');
      if (!el) { if (zoomed) unzoom(); return; }
      const b = bodies.find(x => x.el === el);
      if (!b) return;
      if (zoomed === b) { unzoom(); return; }
      if (zoomed) unzoom();
      zoom(b);
    });
    addEventListener('keydown', e => {
      if (e.key === 'Escape' && zoomed) unzoom();
    });
  })();
  </script>
</body>
</html>
