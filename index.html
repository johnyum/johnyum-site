<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>John Yum</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    background: #fff;
    color: #111;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
    cursor: text;
  }
  /* real input, visually hidden — it owns focus and the mobile keyboard */
  #key {
    position: fixed;
    width: 1px; height: 1px;
    opacity: 0;
    border: 0; padding: 0;
  }
  #line {
    display: flex;
    align-items: center;
    gap: 0.16em;
    font-size: clamp(4rem, 12vw, 10rem);
    user-select: none;
    transition: opacity 0.45s ease;
  }
  #line.gone { opacity: 0; }
  #dots {
    display: flex;
    align-items: center;
    gap: 0.16em;
  }
  #dots i {
    width: 0.16em;
    height: 0.16em;
    border-radius: 50%;
    background: #a3a3a3;
  }
  #dots:empty { display: none; }
  #caret {
    width: 0.035em;
    min-width: 2px;
    height: 1.05em;
    background: #111;
    animation: blink 1.06s step-end infinite;
  }
  /* caret holds solid while typing, like a real text field */
  #line.typing #caret { animation: none; opacity: 1; }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
  @keyframes shake {
    20% { transform: translateX(-0.12em); }
    40% { transform: translateX(0.1em); }
    60% { transform: translateX(-0.07em); }
    80% { transform: translateX(0.05em); }
  }
  #line.shake { animation: shake 0.35s ease; }
  body.unlocked #line { display: none; }
  #pile {
    position: fixed; inset: 0;
    overflow: hidden;
    display: none;
    pointer-events: none;
  }
  body.unlocked #pile { display: block; }
  #pile img {
    position: absolute; left: 0; top: 0;
    will-change: transform;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: auto;
    cursor: pointer;
  }
  @media (prefers-reduced-motion: reduce) {
    #caret { animation: none; }
    #line.shake { animation: none; }
  }
</style>
</head>
<body>
  <input id="key" type="password" autocomplete="off" spellcheck="false" aria-label="Password">
  <div id="line" aria-hidden="true"><span id="dots"></span><span id="caret"></span></div>
  <div id="pile" aria-hidden="true"></div>
  <script>
  (() => {
    const PASSWORD = 'KnockKnock'; // client-side only: a curtain, not a lock
    const key = document.getElementById('key');
    const line = document.getElementById('line');
    const dots = document.getElementById('dots');
    let typingTimer;

    function focusKey() {
      if (!document.body.classList.contains('unlocked')) key.focus();
    }
    focusKey();
    addEventListener('pointerdown', () => setTimeout(focusKey, 0));
    key.addEventListener('blur', () => setTimeout(focusKey, 50));

    key.addEventListener('input', () => {
      dots.innerHTML = '<i></i>'.repeat(key.value.length);
      line.classList.add('typing');
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => line.classList.remove('typing'), 600);
    });

    key.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      if (key.value === PASSWORD) {
        key.value = '';
        key.blur();
        line.classList.add('gone');
        setTimeout(() => {
          document.body.classList.add('unlocked');
          // blank stage — the work showcase mounts here
          dispatchEvent(new CustomEvent('unlocked'));
        }, 450);
      } else {
        key.value = '';
        dots.innerHTML = '';
        line.classList.add('shake');
        line.addEventListener('animationend', () => line.classList.remove('shake'), { once: true });
      }
    });
  })();
  </script>
  <script>
  // After the knock: the calendar sketches rain down and pack the whole
  // page, some leaking off the edges. Live physics the entire time —
  // hover inflates a phone and its neighbours shuffle aside; tap parks
  // it centre stage as an immovable body the pile flows around.
  // A 4px force field keeps every card from ever touching another.
  (() => {
    const DIR = 'img/Calendar_Sketches/';
    const SKETCHES = [
      "Component 100-1.png", "Component 100.png", "Component 101-1.png",
      "Component 101.png", "Component 102.png", "Component 92-1.png",
      "Component 92-10.png", "Component 92-11.png", "Component 92-12.png",
      "Component 92-13.png", "Component 92-14.png", "Component 92-2.png",
      "Component 92-3.png", "Component 92-4.png", "Component 92-5.png",
      "Component 92-6.png", "Component 92-7.png", "Component 92-8.png",
      "Component 92-9.png", "Component 92.png", "Component 93.png",
      "Component 94.png", "Component 95.png", "Component 96.png",
      "Component 97.png", "Component 98.png", "Component 99.png",
      "Group 3.png"
    ];
    const ASPECT = 1840 / 900;
    const GAP = 4;          // the invisible force field
    const GRAV = 0.45;
    const REST = 0.18;      // bounce
    const MAXV = 22;
    const HOVER_S = 1.3;    // hovered phones grow 30%
    const pile = document.getElementById('pile');
    let bodies = [], pending = [], nextDrop = 0;
    let raf = null, calmFrames = 0, frames = 0;
    let hovered = null, opened = null, leak = 0;

    // warm the image cache while the visitor is still at the door
    addEventListener('load', () => setTimeout(() => {
      for (const f of SKETCHES) { const im = new Image(); im.src = DIR + encodeURIComponent(f); }
    }, 600));

    addEventListener('unlocked', start, { once: true });

    function start() {
      const W = innerWidth, H = innerHeight;
      // size cards to slightly overfill the page, so the settled pile
      // packs edge to edge with a few phones poking past the sides
      const w = Math.max(60, Math.min(240, Math.sqrt((W * H * 1.12) / (SKETCHES.length * ASPECT))));
      const h = w * ASPECT;
      leak = w * 0.35;
      const order = [...SKETCHES].sort(() => Math.random() - 0.5);
      // every phone waits above the screen; step() pours them in one by one
      pending = order.map(f => {
        const el = document.createElement('img');
        el.src = DIR + encodeURIComponent(f);
        el.alt = '';
        el.style.width = w + 'px';
        el.style.height = h + 'px';
        el.style.transform = `translate(${W / 2 - w / 2}px, ${-2 * h}px)`;
        pile.appendChild(el);
        return {
          el, w, h,
          x: W / 2, y: -2 * h,
          vx: 0, vy: 0, rot: 0, spin: 0, e: REST,
          scale: 1, target: 1, kin: false, rest: false
        };
      });
      bodies = [];
      nextDrop = 0;
      wake();
    }

    function wake() {
      calmFrames = 0;
      frames = 0;
      if (!raf) raf = requestAnimationFrame(step);
    }

    // inverse mass: an opened card is immovable, a hovered card is heavy
    function im(b) { return b.kin ? 0 : (b === hovered ? 0.35 : 1); }

    function collide(a, b) {
      // tilted cards get a wider field so rotation can never cause overlap
      const pad = GAP + ((Math.abs(a.rot) > 0.5 || Math.abs(b.rot) > 0.5) ? 8 : 0);
      const aw = a.w * a.scale, ah = a.h * a.scale;
      const bw = b.w * b.scale, bh = b.h * b.scale;
      const dx = b.x - a.x;
      const px = (aw + bw) / 2 + pad - Math.abs(dx);
      if (px <= 0) return;
      const dy = b.y - a.y;
      const py = (ah + bh) / 2 + pad - Math.abs(dy);
      if (py <= 0) return;
      const ia = im(a), ib = im(b), tot = ia + ib;
      if (!tot) return;
      const e = Math.max(a.e, b.e);
      if (px < py) {
        const s = dx < 0 ? -1 : 1;
        a.x -= s * px * (ia / tot); b.x += s * px * (ib / tot);
        const rv = b.vx - a.vx;
        if (rv * s < 0) {
          const j = -(1 + e) * rv * s / tot;
          a.vx -= j * ia * s; b.vx += j * ib * s;
        }
      } else {
        const s = dy < 0 ? -1 : 1;
        a.y -= s * py * (ia / tot); b.y += s * py * (ib / tot);
        const rv = b.vy - a.vy;
        if (rv * s < 0) {
          const j = -(1 + e) * rv * s / tot;
          a.vy -= j * ia * s; b.vy += j * ib * s;
        }
        a.vx *= 0.95; b.vx *= 0.95;          // landing friction
        // the upper card is supported; overhanging cards tip sideways and
        // flow off like water instead of growing towers or arching over
        // voids — and everything slides off an opened card
        const upper = s > 0 ? a : b, lower = s > 0 ? b : a;
        upper.rest = true;
        const off = upper.x - lower.x;
        if (lower.kin) upper.vx += (off || (Math.random() - 0.5)) * 0.03;
        else if (Math.abs(off) > upper.w * 0.22) upper.vx += off * 0.02;
      }
    }

    function step() {
      const W = innerWidth, H = innerHeight;
      const SUB = 2;
      let busy = false;

      // the pour: a few splashy droplets first, then a steady fill
      if (pending.length && frames >= nextDrop) {
        const b = pending.shift();
        const splashy = bodies.length < 5;
        b.x = W * (0.1 + 0.8 * Math.random());
        b.y = -b.h;
        b.vx = (Math.random() - 0.5) * (splashy ? 9 : 2.5);
        b.vy = splashy ? 4 + Math.random() * 6 : 2 + Math.random() * 3;
        b.rot = (Math.random() - 0.5) * 7;
        b.spin = (Math.random() - 0.5) * (splashy ? 1.2 : 0.5);
        b.e = splashy ? 0.5 : REST;
        bodies.push(b);
        nextDrop = frames + (splashy ? 7 : 16);
      }
      if (pending.length) busy = true;

      for (let s = 0; s < SUB; s++) {
        for (const b of bodies) {
          if (b.kin) {
            // an opened card glides to centre stage and parks there
            b.x += (W / 2 - b.x) * 0.07;
            b.y += (H / 2 - b.y) * 0.07;
            b.vx = 0; b.vy = 0;
          } else {
            b.vy += GRAV / SUB;
            if (b.vy > MAXV) b.vy = MAXV;
            b.x += b.vx / SUB;
            b.y += b.vy / SUB;
          }
          b.rest = false;
        }
        for (const b of bodies) {
          if (b.kin) continue;
          // side walls sit a little past the screen so phones leak out
          const hw = b.w * b.scale / 2, hh = b.h * b.scale / 2;
          if (b.x < hw - leak) { b.x = hw - leak; b.vx = Math.abs(b.vx) * b.e; }
          if (b.x > W - hw + leak) { b.x = W - hw + leak; b.vx = -Math.abs(b.vx) * b.e; }
          if (b.y > H - hh) {
            b.y = H - hh;
            if (b.vy > 0) b.vy = Math.abs(b.vy) < 1.2 ? 0 : -b.vy * b.e;
            b.vx *= 0.94;
            b.rest = true;
          }
        }
        for (let it = 0; it < 3; it++) {
          for (let i = 0; i < bodies.length; i++) {
            for (let j = i + 1; j < bodies.length; j++) collide(bodies[i], bodies[j]);
          }
        }
      }
      let maxSpeed = 0;
      for (const b of bodies) {
        b.scale += (b.target - b.scale) * 0.18;
        if (Math.abs(b.scale - b.target) > 0.003) busy = true; else b.scale = b.target;
        if (b.kin) {
          busy = true;
          b.rot *= 0.8;
        } else if (b.rest) {
          b.rot *= 0.82;                      // straighten as it settles
          if (b.e > REST) b.e = Math.max(REST, b.e * 0.97); // splashiness wears off
          if (Math.abs(b.rot) < 0.05) b.rot = 0;
          if (Math.abs(b.vx) < 0.05) b.vx = 0;
          if (Math.abs(b.vy) < 0.05) b.vy = 0;
        } else {
          b.rot += b.spin;
        }
        const sp = Math.abs(b.vx) + Math.abs(b.vy);
        if (sp > maxSpeed) maxSpeed = sp;
        b.el.style.zIndex = b === opened ? 3 : (b.scale > 1.02 ? 2 : '');
        b.el.style.transform =
          `translate(${(b.x - b.w / 2).toFixed(2)}px, ${(b.y - b.h / 2).toFixed(2)}px) ` +
          `rotate(${b.rot.toFixed(2)}deg) scale(${b.scale.toFixed(4)})`;
      }
      calmFrames = (maxSpeed < 0.12 && !busy) ? calmFrames + 1 : 0;
      frames++;
      // asleep, or out of patience with the last micro-creeper — freeze
      if (calmFrames > 30 || frames > 2400) {
        for (const b of bodies) { b.vx = 0; b.vy = 0; }
        raf = null;
        return;
      }
      raf = requestAnimationFrame(step);
    }

    // hover: that phone grows and the pile makes room
    pile.addEventListener('mouseover', e => {
      const el = e.target.closest('img');
      if (!el) return;
      const b = bodies.find(x => x.el === el);
      if (!b || b === opened) return;
      if (hovered && hovered !== opened) hovered.target = 1;
      hovered = b;
      b.target = HOVER_S;
      wake();
    });
    pile.addEventListener('mouseout', e => {
      const el = e.target.closest('img');
      if (!el) return;
      const b = bodies.find(x => x.el === el);
      if (b && b === hovered) {
        if (b !== opened) b.target = 1;
        hovered = null;
        wake();
      }
    });

    // tap: the phone parks centre stage and the pile parts around it;
    // tap it again (or another phone, or Escape) to fold it back in
    function open(b) {
      opened = b;
      if (hovered === b) hovered = null;
      b.kin = true;
      b.target = Math.min((innerWidth * 0.8) / b.w, (innerHeight * 0.86) / b.h);
      b.el.style.cursor = 'zoom-out';
      wake();
    }
    function close(b) {
      opened = null;
      b.kin = false;
      b.target = 1;
      b.el.style.cursor = '';
      wake();
    }
    pile.addEventListener('click', e => {
      const el = e.target.closest('img');
      if (!el) { if (opened) close(opened); return; }
      const b = bodies.find(x => x.el === el);
      if (!b) return;
      if (opened === b) { close(b); return; }
      if (opened) close(opened);
      open(b);
    });
    addEventListener('keydown', e => {
      if (e.key === 'Escape' && opened) close(opened);
    });

    // a resize wakes the pile so cards re-settle inside the new walls
    addEventListener('resize', () => { if (bodies.length) wake(); });
  })();
  </script>
</body>
</html>
