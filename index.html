<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>John Yum</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    background: #fff;
    color: #111;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
    cursor: text;
  }
  /* real input, visually hidden — it owns focus and the mobile keyboard */
  #key {
    position: fixed;
    width: 1px; height: 1px;
    opacity: 0;
    border: 0; padding: 0;
  }
  #line {
    display: flex;
    align-items: center;
    gap: 0.16em;
    font-size: clamp(4rem, 12vw, 10rem);
    user-select: none;
    transition: opacity 0.45s ease;
  }
  #line.gone { opacity: 0; }
  #dots {
    display: flex;
    align-items: center;
    gap: 0.16em;
  }
  #dots i {
    width: 0.16em;
    height: 0.16em;
    border-radius: 50%;
    background: #a3a3a3;
  }
  #dots:empty { display: none; }
  #caret {
    width: 0.035em;
    min-width: 2px;
    height: 1.05em;
    background: #111;
    animation: blink 1.06s step-end infinite;
  }
  /* caret holds solid while typing, like a real text field */
  #line.typing #caret { animation: none; opacity: 1; }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
  @keyframes shake {
    20% { transform: translateX(-0.12em); }
    40% { transform: translateX(0.1em); }
    60% { transform: translateX(-0.07em); }
    80% { transform: translateX(0.05em); }
  }
  #line.shake { animation: shake 0.35s ease; }
  body.unlocked #line { display: none; }
  #pile {
    position: fixed; inset: 0;
    overflow: hidden;
    display: none;
    pointer-events: none;
  }
  body.unlocked #pile { display: block; }
  #pile img {
    position: absolute; left: 0; top: 0;
    will-change: transform;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: auto;
    cursor: grab;
    touch-action: none;
  }
  @media (prefers-reduced-motion: reduce) {
    #caret { animation: none; }
    #line.shake { animation: none; }
  }
</style>
</head>
<body>
  <input id="key" type="password" autocomplete="off" spellcheck="false" aria-label="Password">
  <div id="line" aria-hidden="true"><span id="dots"></span><span id="caret"></span></div>
  <div id="pile" aria-hidden="true"></div>
  <script>
  (() => {
    const PASSWORD = 'KnockKnock'; // client-side only: a curtain, not a lock
    const key = document.getElementById('key');
    const line = document.getElementById('line');
    const dots = document.getElementById('dots');
    let typingTimer;

    function focusKey() {
      if (!document.body.classList.contains('unlocked')) key.focus();
    }
    focusKey();
    addEventListener('pointerdown', () => setTimeout(focusKey, 0));
    key.addEventListener('blur', () => setTimeout(focusKey, 50));

    key.addEventListener('input', () => {
      dots.innerHTML = '<i></i>'.repeat(key.value.length);
      line.classList.add('typing');
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => line.classList.remove('typing'), 600);
    });

    key.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      if (key.value === PASSWORD) {
        key.value = '';
        key.blur();
        line.classList.add('gone');
        setTimeout(() => {
          document.body.classList.add('unlocked');
          // blank stage — the work showcase mounts here
          dispatchEvent(new CustomEvent('unlocked'));
        }, 450);
      } else {
        key.value = '';
        dots.innerHTML = '';
        line.classList.add('shake');
        line.addEventListener('animationend', () => line.classList.remove('shake'), { once: true });
      }
    });
  })();
  </script>
  <script src="js/matter.min.js"></script>
  <script>
  // After the knock: the calendar sketches pour in under a real rigid-body
  // engine (Matter.js) — true rotation, torque, friction — so phones tumble
  // and lie exactly how thrown things lie. Each physics body is 2px larger
  // than its image on every side: the invisible 4px force field.
  (() => {
    if (!window.Matter) return;
    const { Engine, World, Bodies, Body, Events, Mouse, MouseConstraint, Sleeping } = Matter;
    const DIR = 'img/Calendar_Sketches/';
    const SKETCHES = [
      "Component 100-1.png", "Component 100.png", "Component 101-1.png",
      "Component 101.png", "Component 102.png", "Component 92-1.png",
      "Component 92-10.png", "Component 92-11.png", "Component 92-12.png",
      "Component 92-13.png", "Component 92-14.png", "Component 92-2.png",
      "Component 92-3.png", "Component 92-4.png", "Component 92-5.png",
      "Component 92-6.png", "Component 92-7.png", "Component 92-8.png",
      "Component 92-9.png", "Component 92.png", "Component 93.png",
      "Component 94.png", "Component 95.png", "Component 96.png",
      "Component 97.png", "Component 98.png", "Component 99.png",
      "Group 3.png"
    ];
    const ASPECT = 1840 / 900;
    const PAD = 2;            // half the 4px force field, on every side
    const HOVER_S = 1.3;
    const pile = document.getElementById('pile');

    let engine = null, mouseCon = null;
    let cards = [], pendingCards = [], walls = [];
    let opened = null, hovered = null, downInfo = null;
    let frames = 0, nextDrop = 0, leak = 0;

    // warm the image cache while the visitor is still at the door
    addEventListener('load', () => setTimeout(() => {
      for (const f of SKETCHES) { const im = new Image(); im.src = DIR + encodeURIComponent(f); }
    }, 600));

    addEventListener('unlocked', start, { once: true });

    function makeWalls(W, H) {
      const t = 400;
      for (const w of walls) World.remove(engine.world, w);
      walls = [
        Bodies.rectangle(W / 2, H + t / 2, W * 3, t, { isStatic: true }),
        Bodies.rectangle(-leak - t / 2, H / 2 - H, t, H * 4, { isStatic: true }),
        Bodies.rectangle(W + leak + t / 2, H / 2 - H, t, H * 4, { isStatic: true })
      ];
      World.add(engine.world, walls);
    }

    function start() {
      const W = innerWidth, H = innerHeight;
      engine = Engine.create({ enableSleeping: true });
      engine.gravity.y = 0.45;   // floaty

      const baseW = Math.max(52, Math.min(200, Math.sqrt((W * H * 0.72) / (SKETCHES.length * ASPECT))));
      leak = baseW * 0.35;
      makeWalls(W, H);

      const order = [...SKETCHES].sort(() => Math.random() - 0.5);
      pendingCards = order.map(f => {
        const w = baseW * (0.85 + 0.3 * Math.random());
        const h = w * ASPECT;
        const el = document.createElement('img');
        el.src = DIR + encodeURIComponent(f);
        el.alt = '';
        el.style.width = w + 'px';
        el.style.height = h + 'px';
        el.style.transform = `translate(${W / 2 - w / 2}px, ${-2 * h}px)`;
        pile.appendChild(el);
        return { el, w, h };
      });

      // grabbing is a real spring constraint: cards dangle and swing from
      // wherever you pick them up, and fly when you let go
      const mouse = Mouse.create(document.body);
      mouseCon = MouseConstraint.create(engine, {
        mouse,
        constraint: { stiffness: 0.12, damping: 0.1 }
      });
      World.add(engine.world, mouseCon);

      Events.on(mouseCon, 'mousedown', () => {
        downInfo = {
          body: mouseCon.body,
          x: mouse.position.x, y: mouse.position.y,
          t: performance.now()
        };
      });
      Events.on(mouseCon, 'mouseup', () => {
        if (!downInfo) return;
        const moved = Math.hypot(mouse.position.x - downInfo.x, mouse.position.y - downInfo.y);
        if (moved < 8 && performance.now() - downInfo.t < 400) {
          handleTap(downInfo.body ? cards.find(c => c.body === downInfo.body) : null);
        }
        downInfo = null;
      });

      // anything perched on an opened card gets nudged until it slides off
      Events.on(engine, 'collisionActive', e => {
        if (!opened) return;
        for (const pair of e.pairs) {
          const other =
            pair.bodyA === opened.body ? pair.bodyB :
            pair.bodyB === opened.body ? pair.bodyA : null;
          if (other && !other.isStatic) {
            const dx = other.position.x - opened.body.position.x;
            Body.applyForce(other, other.position,
              { x: (dx >= 0 ? 1 : -1) * 0.0009 * other.mass, y: 0 });
          }
        }
      });

      requestAnimationFrame(step);
    }

    function spawnNext() {
      const def = pendingCards.shift();
      const splashy = cards.length < 5;
      const body = Bodies.rectangle(
        innerWidth * (0.12 + 0.76 * Math.random()), -def.h,
        def.w + PAD * 2, def.h + PAD * 2,
        {
          restitution: splashy ? 0.5 : 0.22,
          friction: 0.35,
          frictionStatic: 0.5,
          frictionAir: 0.012,
          angle: (Math.random() - 0.5) * 0.3,
          chamfer: { radius: Math.min(10, def.w * 0.08) }
        }
      );
      Body.setVelocity(body, {
        x: (Math.random() - 0.5) * (splashy ? 9 : 2.5),
        y: splashy ? 2 + Math.random() * 3 : 1 + Math.random() * 1.5
      });
      Body.setAngularVelocity(body, (Math.random() - 0.5) * (splashy ? 0.12 : 0.05));
      World.add(engine.world, body);
      cards.push({ ...def, body, scale: 1, target: 1 });
      nextDrop = frames + (splashy ? 10 : 22);
    }

    function handleTap(card) {
      if (!card) { if (opened) close(opened); return; }
      if (card === opened) { close(card); return; }
      if (opened) close(opened);
      open(card);
    }
    function open(card) {
      opened = card;
      if (hovered === card) hovered = null;
      card.target = Math.min((innerWidth * 0.8) / card.w, (innerHeight * 0.86) / card.h);
      Body.setStatic(card.body, true);
      card.el.style.cursor = 'zoom-out';
    }
    function close(card) {
      opened = null;
      card.target = 1;
      Body.setStatic(card.body, false);
      Sleeping.set(card.body, false);
      card.el.style.cursor = '';
    }

    function step() {
      frames++;
      if (pendingCards.length && frames >= nextDrop) spawnNext();

      // an opened card glides to centre stage and straightens for reading
      if (opened) {
        const b = opened.body;
        Body.setPosition(b, {
          x: b.position.x + (innerWidth / 2 - b.position.x) * 0.09,
          y: b.position.y + (innerHeight / 2 - b.position.y) * 0.09
        });
        Body.setAngle(b, b.angle * 0.85);
      }

      // ease scales (hover growth / open fit) — scaling wakes neighbours
      for (const c of cards) {
        if (Math.abs(c.target - c.scale) > 0.002) {
          const ns = c.scale + (c.target - c.scale) * 0.18;
          Body.scale(c.body, ns / c.scale, ns / c.scale);
          c.scale = ns;
          Sleeping.set(c.body, false);
        } else if (c.scale !== c.target) {
          Body.scale(c.body, c.target / c.scale, c.target / c.scale);
          c.scale = c.target;
        }
      }

      Engine.update(engine, 1000 / 60);

      const dragBody = mouseCon && mouseCon.body;
      for (const c of cards) {
        const b = c.body;
        c.el.style.zIndex =
          c === opened ? 3 :
          (b === dragBody || c.scale > 1.02) ? 2 : '';
        c.el.style.transform =
          `translate(${(b.position.x - c.w / 2).toFixed(2)}px, ${(b.position.y - c.h / 2).toFixed(2)}px) ` +
          `rotate(${b.angle.toFixed(4)}rad) scale(${c.scale.toFixed(4)})`;
      }
      requestAnimationFrame(step);
    }

    // hover: that phone grows and the pile makes room
    pile.addEventListener('mouseover', e => {
      const el = e.target.closest('img');
      if (!el) return;
      const c = cards.find(x => x.el === el);
      if (!c || c === opened || (mouseCon && mouseCon.body === c.body)) return;
      if (hovered && hovered !== opened) hovered.target = 1;
      hovered = c;
      c.target = HOVER_S;
    });
    pile.addEventListener('mouseout', e => {
      const el = e.target.closest('img');
      if (!el) return;
      const c = cards.find(x => x.el === el);
      if (c && c === hovered) {
        if (c !== opened) c.target = 1;
        hovered = null;
      }
    });

    addEventListener('keydown', e => {
      if (e.key === 'Escape' && opened) close(opened);
    });

    // a resize moves the walls and wakes the pile so it re-settles
    addEventListener('resize', () => {
      if (!engine) return;
      makeWalls(innerWidth, innerHeight);
      for (const c of cards) Sleeping.set(c.body, false);
    });
  })();
  </script>
</body>
</html>
