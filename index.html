<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>John Yum</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    background: #fff;
    color: #111;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
    cursor: text;
  }
  /* top-bar: three pills always centred */
  #wm-bar {
    position: fixed;
    top: 16px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0;
    z-index: 100;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  body.zoomcard #wm-bar { opacity: 0; }
  #wordmark, .wm-pill, .chip {
    padding: 8px 18px;
    background: rgba(255, 255, 255, 0.72);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border-radius: 999px;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 400;
    font-size: 14px;
    line-height: 1;
    letter-spacing: -0.01em;
    color: #111;
    white-space: nowrap;
    pointer-events: none;
    user-select: none;
  }
  .wm-pill {
    pointer-events: none;
    cursor: pointer;
    min-width: 0; max-width: 0;
    padding-left: 0; padding-right: 0;
    margin-left: 0;
    overflow: hidden; opacity: 0;
    transition: max-width 0.65s cubic-bezier(0.4,0,0.2,1),
                padding-left 0.65s cubic-bezier(0.4,0,0.2,1),
                padding-right 0.65s cubic-bezier(0.4,0,0.2,1),
                margin-left 0.65s cubic-bezier(0.4,0,0.2,1),
                opacity 0.45s ease 0.25s;
  }
  body.unlocked .wm-pill {
    pointer-events: auto;
    max-width: 200px; padding-left: 18px; padding-right: 18px;
    margin-left: 8px; opacity: 1;
  }
  /* chapter chips — pinned to the bottom with the same 16px inset as the top
     wordmark bar. They live only on the film (over the video), NOT on the pile.
     Each jumps the film to a timecode. */
  #chapter-bar {
    position: fixed;
    bottom: 16px;
    left: 0; right: 0;
    display: none;
    justify-content: center;
    align-items: center;
    gap: 8px;
    z-index: 100;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  body.playing #chapter-bar { display: flex; }
  .chip {
    border: 0;
    cursor: pointer;
    pointer-events: auto;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.45s ease 0.2s, transform 0.45s cubic-bezier(0.4,0,0.2,1) 0.2s, background 0.15s ease;
  }
  body.playing .chip { opacity: 1; transform: translateY(0); }
  .chip:hover { background: rgba(255, 255, 255, 0.92); }
  .chip:active { background: rgba(235, 235, 235, 0.92); }
  .chip-t { margin-left: 8px; opacity: 0.45; font-variant-numeric: tabular-nums; }
  /* real input, visually hidden — it owns focus and the mobile keyboard */
  #key {
    position: fixed;
    width: 1px; height: 1px;
    opacity: 0;
    border: 0; padding: 0;
  }
  #line {
    display: flex;
    align-items: center;
    gap: 0.16em;
    font-size: clamp(4rem, 12vw, 10rem);
    user-select: none;
    transition: opacity 0.45s ease;
  }
  #line.gone { opacity: 0; }
  #dots {
    display: flex;
    align-items: center;
    gap: 0.16em;
  }
  #dots i {
    width: 0.16em;
    height: 0.16em;
    border-radius: 50%;
    background: #a3a3a3;
  }
  #dots i.sel { background: #0a84ff; }
  #caret {
    width: 0.035em;
    min-width: 2px;
    height: 1.05em;
    background: #111;
    animation: blink 1.06s step-end infinite;
  }
  /* caret holds solid while typing, like a real text field */
  #line.typing #caret { animation: none; opacity: 1; }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
  @keyframes shake {
    20% { transform: translateX(-0.12em); }
    40% { transform: translateX(0.1em); }
    60% { transform: translateX(-0.07em); }
    80% { transform: translateX(0.05em); }
  }
  #line.shake { animation: shake 0.35s ease; }
  body.unlocked #line { display: none; }
  #pile {
    position: fixed; inset: 0;
    overflow: hidden;
    display: none;
    pointer-events: none;
  }
  body.unlocked #pile { display: block; }
  /* the locked play-button anchor — dead centre, above the pile. The work
     bounces off a matching static circle in the physics world. */
  #playbtn {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 96px; height: 96px;
    display: none;                 /* only in the unlocked pile view */
    place-items: center;
    color: #111;
    z-index: 19;                   /* above pile cards, below the zoom-card veil (20) */
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.25s ease;
    -webkit-tap-highlight-color: transparent;
  }
  #playbtn svg { width: 96px; height: 96px; display: block; }
  body.unlocked #playbtn { display: grid; }
  #playbtn:hover { transform: translate(-50%, -50%) scale(1.06); }
  #playbtn:active { transform: translate(-50%, -50%) scale(0.94); }
  body.zoomcard #playbtn { opacity: 0; pointer-events: none; }
  /* tapping play drains the pile — the button fades out as the work pours away */
  body.draining #playbtn { opacity: 0; pointer-events: none; transform: translate(-50%, -50%) scale(0.6); }
  /* the film stage: full-screen white, fades up once the work has drained */
  #videostage {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    background: #fff;
    z-index: 60;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }
  body.playing #videostage { opacity: 1; pointer-events: auto; }
  body.playing #pile, body.playing #playbtn { display: none; }
  #videostage video {
    width: 1280px; max-width: 92vw; max-height: 86vh; height: auto;
    display: block; background: transparent;   /* white on white — no frame, no shadow */
  }
  /* native controls tweaked for a white page: drop the dark gradient scrim and
     flip the light icons to dark so they read on white (WebKit/Chrome + Safari) */
  #videostage video::-webkit-media-controls-panel { background: transparent; }
  #videostage video::-webkit-media-controls-enclosure { filter: invert(1) hue-rotate(180deg); }
  /* drop the sliding volume bar — it expands the mute button into a lopsided pill
     on hover. The mute toggle stays; system/OS volume still works. */
  #videostage video::-webkit-media-controls-volume-slider { display: none; }
  /* a soft translucent circle behind each control icon, always on (the native
     hover circle made permanent). Small fixed size + margin so the circles stay
     tight and never touch — safe now that the volume slider (which used to expand
     the mute button) is hidden. (colour is pre-inversion: 0.20 white → ~0.20
     black grey once the enclosure filter flips it.) */
  #videostage video::-webkit-media-controls-play-button,
  #videostage video::-webkit-media-controls-mute-button,
  #videostage video::-webkit-media-controls-fullscreen-button {
    background-color: rgba(255, 255, 255, 0.20);
    border-radius: 50%;
    width: 30px; height: 30px; min-width: 30px;
    padding: 4px;
    margin: 0 6px;
    box-sizing: content-box;
  }
  #videoclose {
    position: fixed; top: 20px; right: 20px;
    width: 44px; height: 44px; border: 0; border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(255, 255, 255, 0.7);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    backdrop-filter: blur(16px) saturate(150%);
    box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.08), 0 6px 22px rgba(0, 0, 0, 0.12);
    color: #1d1d1f; cursor: pointer; z-index: 61;
    transition: transform 0.15s ease;
  }
  #videoclose:active { transform: scale(0.92); }
  #videoclose svg { width: 20px; height: 20px; }
  #pile .card {
    position: absolute; left: 0; top: 0;
    will-change: transform;
    transform: translateZ(0);
  }
  #pile .card img {
    display: block;
    width: 100%; height: 100%;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: auto;
    cursor: grab;
    touch-action: none;
  }
  /* the filenames live in their own flat layer so they stay horizontal
     and readable no matter how the phone beneath them is lying */
  #labels {
    position: absolute; inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 21;
  }
  #labels span {
    position: absolute; left: 0; top: 0;
    font-size: 14px;            /* matches the "John Yum" wordmark */
    line-height: 1;
    font-weight: 400;           /* book weight */
    letter-spacing: -0.01em;
    color: #111;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  /* when a design is centre stage, the pile behind frosts into white glass */
  #pile::after {
    content: "";
    position: absolute; inset: 0;
    background: rgba(255, 255, 255, 0.94);
    -webkit-backdrop-filter: blur(32px) saturate(80%);
    backdrop-filter: blur(32px) saturate(80%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.45s ease;
    z-index: 20;
  }
  body.zoomcard #pile::after { opacity: 1; pointer-events: auto; }
  /* in single-phone mode, the whole page is a tap target to go back */
  body.zoomcard { cursor: zoom-out; }
  /* prev/next project arrows — white glass circles on the main page;
     they animate away when a project is opened centre stage */
  .nav {
    position: fixed;
    top: 50%;
    width: 54px; height: 54px;
    border: 0; border-radius: 50%;
    display: grid; place-items: center;
    color: #1d1d1f;
    background: rgba(255, 255, 255, 0.45);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    backdrop-filter: blur(16px) saturate(150%);
    box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.7), 0 6px 22px rgba(0, 0, 0, 0.12);
    cursor: pointer;
    z-index: 110;
    opacity: 0;
    pointer-events: none;
    transform: translateY(-50%) scale(0.94);
    transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.2s ease;
  }
  #navPrev { left: 48px; }
  #navNext { right: 48px; }
  /* arrows only appear when a card is open */
  body.zoomcard .nav { opacity: 1; pointer-events: auto; transform: translateY(-50%) scale(1); }
  .nav:hover { background: rgba(255, 255, 255, 0.62); }
  .nav:active { transform: translateY(-50%) scale(0.9); }
  .nav svg { width: 22px; height: 22px; display: block; }
  @media (prefers-reduced-motion: reduce) { .nav { transition: opacity 0.25s ease; } }
  .nav { touch-action: manipulation; }
  /* touch-only close button — bottom-centre, 24px up from the edge. Same glass
     as the arrows. display:none on desktop (pointer:fine) so the web version is
     untouched; on touch devices it fades in whenever a design is open. */
  #navClose {
    position: fixed;
    bottom: 24px; left: 50%;
    width: 44px; height: 44px;
    border: 0; border-radius: 50%;
    display: none;
    place-items: center;
    color: #1d1d1f;
    background: rgba(255, 255, 255, 0.45);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    backdrop-filter: blur(16px) saturate(150%);
    box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.7), 0 6px 22px rgba(0, 0, 0, 0.12);
    z-index: 120;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transform: translateX(-50%);
    touch-action: manipulation;
    transition: opacity 0.3s ease;
  }
  #navClose:active { transform: translateX(-50%) scale(0.92); }
  #navClose svg { width: 20px; height: 20px; display: block; }
  /* touch devices OR narrow viewports (phones); the wide desktop never matches.
     All three controls — prev · close · next — sit in ONE centred row at the
     bottom, every circle the same 54px size as the arrows. */
  @media (pointer: coarse), (max-width: 768px) {
    .nav, #navClose {
      top: auto;
      bottom: 24px;
      width: 54px; height: 54px;
    }
    #navClose { display: grid; }
    #navClose svg { width: 22px; height: 22px; }
    /* row layout: ←  ✕  →  with 16px gaps (70px centre-to-centre for 54px circles) */
    #navPrev  { left: 50%; right: auto; transform: translateX(calc(-50% - 70px)) scale(0.94); }
    #navNext  { left: 50%; right: auto; transform: translateX(calc(-50% + 70px)) scale(0.94); }
    body.zoomcard #navPrev  { transform: translateX(calc(-50% - 70px)) scale(1); }
    body.zoomcard #navNext  { transform: translateX(calc(-50% + 70px)) scale(1); }
    body.zoomcard #navClose { opacity: 1; pointer-events: auto; }
    #navPrev:active  { transform: translateX(calc(-50% - 70px)) scale(0.9); }
    #navNext:active  { transform: translateX(calc(-50% + 70px)) scale(0.9); }
  }
  /* the open design sits crisp above the glass with a soft neutral lift */
  #pile .card.opened { filter: drop-shadow(0 24px 60px rgba(60, 60, 64, 0.22)); }
  @media (prefers-reduced-motion: reduce) {
    #caret { animation: none; }
    #line.shake { animation: none; }
  }
</style>
</head>
<body>
  <div id="wm-bar">
    <div id="wordmark">John Yum</div>
    <div class="wm-pill">yum@johnyum.com</div>
  </div>
  <input id="key" type="password" autocomplete="off" autocapitalize="off" enterkeyhint="go" spellcheck="false" aria-label="Password">
  <div id="line" aria-hidden="true"><span id="dots"><span id="caret"></span></span></div>
  <div id="pile" aria-hidden="true"></div>
  <a id="playbtn" href="/test" aria-label="Play film">
    <svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="40" fill="#111"/><path d="M33 25 L59 40 L33 55 Z" fill="#fff"/></svg>
  </a>
  <div id="chapter-bar">
    <button class="chip" data-t="0">Intro</button>
    <button class="chip" data-t="37">Host Calendar</button>
    <button class="chip" data-t="120">Sketches</button>
    <button class="chip" data-t="180">Transportation</button>
  </div>
  <div id="videostage" aria-hidden="true">
    <video width="1954" height="1080" controls playsinline preload="none" poster="img/Videos/Portfolio_2-poster.jpg"
           controlslist="nodownload noplaybackrate noremoteplayback" disablepictureinpicture>
      <source src="img/Videos/Portfolio_2.mp4" type="video/mp4">
    </video>
    <button id="videoclose" aria-label="Back to work">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5L19 19M19 5L5 19"/></svg>
    </button>
  </div>
  <button class="nav" id="navPrev" aria-label="Previous project">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
  </button>
  <button class="nav" id="navNext" aria-label="Next project">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
  </button>
  <button id="navClose" aria-label="Close design">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
  </button>
  <script>
  (() => {
    const PASSWORD = 'KnockKnock'; // client-side only: a curtain, not a lock
    const key = document.getElementById('key');
    const line = document.getElementById('line');
    const dots = document.getElementById('dots');
    const caret = document.getElementById('caret');
    let typingTimer;

    function focusKey() {
      // don't re-grab focus once the right password is in ('gone' = unlocking) —
      // that's what let the mobile keyboard pop straight back up after Enter.
      if (!document.body.classList.contains('unlocked') && !line.classList.contains('gone')) key.focus();
    }
    focusKey();
    // synchronous focus inside the gesture, so mobile taps summon the keyboard
    addEventListener('pointerdown', focusKey);
    addEventListener('click', focusKey);
    key.addEventListener('blur', () => setTimeout(focusKey, 50));

    // mobile: the on-screen keyboard shrinks the visual viewport. Lift the
    // password line so the blinking caret stays centred in the space ABOVE the
    // keyboard instead of hiding behind it. Inert on desktop (no keyboard →
    // viewport never shrinks → transform stays empty).
    if (window.visualViewport) {
      const vv = window.visualViewport;
      const liftLine = () => {
        if (document.body.classList.contains('unlocked')) { line.style.transform = ''; return; }
        const kb = window.innerHeight - vv.height - vv.offsetTop;   // keyboard height
        line.style.transform = kb > 90 ? `translateY(${Math.round(-kb / 2)}px)` : '';
      };
      vv.addEventListener('resize', liftLine);
      vv.addEventListener('scroll', liftLine);
    }

    // the hidden input is a real text field — arrows, select-all, cut,
    // everything native works. This just draws its state: one dot per
    // character, selection in blue, the caret exactly where it is.
    function renderLine(active) {
      const len = key.value.length;
      const s = key.selectionStart ?? len, e = key.selectionEnd ?? len;
      const caretAt = key.selectionDirection === 'backward' ? s : e;
      let html = '';
      for (let i = 0; i < len; i++) html += i >= s && i < e ? '<i class="sel"></i>' : '<i></i>';
      dots.innerHTML = html;
      caret.style.display = s !== e ? 'none' : '';
      dots.insertBefore(caret, dots.children[caretAt] || null);
      if (active) {
        line.classList.add('typing');
        clearTimeout(typingTimer);
        typingTimer = setTimeout(() => line.classList.remove('typing'), 600);
      }
    }
    key.addEventListener('input', () => renderLine(true));
    key.addEventListener('keyup', () => renderLine(true));
    key.addEventListener('select', () => renderLine(false));
    document.addEventListener('selectionchange', () => {
      if (document.activeElement === key) renderLine(false);
    });

    key.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      if (key.value === PASSWORD) {
        key.value = '';
        line.classList.add('gone');
        // iOS keeps the keyboard up after a bare blur() called from the input's
        // own keydown. Making the field readonly (+ disabled) first forces
        // WebKit to actually dismiss it. 'gone' stops focusKey re-grabbing it.
        key.readOnly = true;
        key.blur();
        setTimeout(() => {
          document.body.classList.add('unlocked');
          key.disabled = true;   // belt-and-suspenders: nothing can re-summon the keyboard
          // blank stage — the work showcase mounts here
          dispatchEvent(new CustomEvent('unlocked'));
        }, 450);
      } else {
        key.value = '';
        renderLine(false);
        line.classList.add('shake');
        line.addEventListener('animationend', () => line.classList.remove('shake'), { once: true });
      }
    });
  })();

  document.querySelectorAll('.wm-pill').forEach(pill => {
    pill.addEventListener('click', e => {
      e.stopPropagation();
      const text = pill.textContent.trim();
      if (pill._copying) return;
      pill._copying = true;
      navigator.clipboard.writeText(text).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
      });
      const orig = pill.textContent;
      pill.textContent = 'Copied';
      setTimeout(() => { pill.textContent = orig; pill._copying = false; }, 1400);
    });
  });

  </script>
  <script src="js/matter.min.js"></script>
  <script>
  // After the knock: the calendar sketches pour in under a real rigid-body
  // engine (Matter.js) — true rotation, torque, friction — so phones tumble
  // and lie exactly how thrown things lie. Each physics body is 2px larger
  // than its image on every side: the invisible 4px force field.
  (() => {
    if (!window.Matter) return;
    const { Engine, World, Bodies, Body, Events, Mouse, MouseConstraint, Sleeping } = Matter;
    const DIR = 'img/Fresh_Work/';
    // bump when the image files change — forces browsers past any cached copies
    const IMGV = '?v=2';
    // Memory-constrained phones load a SMALLER image set (the m/ subfolder, ≤900px)
    // so the total decoded image memory stays well under iOS Safari's budget —
    // that budget being blown by the huge originals is what blanked the designs in
    // the carousel. Desktop loads the full-quality set. Aspect ratios are identical,
    // so card sizing is unaffected. The manifest always lives in the main folder.
    const IS_MOBILE = matchMedia('(pointer: coarse)').matches || innerWidth < 820;
    const IMGDIR = DIR + (IS_MOBILE ? 'm/' : '');
    // The pile is whatever PNGs the manifest lists — so just rename/add/
    // remove files in img/Fresh_Work and regenerate manifest.json;
    // no code changes needed. (Regenerate: from that folder run
    //   python3 -c "import os,json;open('manifest.json','w').write(json.dumps(sorted(f for f in os.listdir('.') if f.lower().endswith('.png'))))" )
    let SKETCHES = [], DIMS = {};
    const sketchesReady = fetch(DIR + 'manifest.json', { cache: 'no-store' })
      .then(r => r.ok ? r.json() : [])
      .then(list => {
        SKETCHES = Array.isArray(list) ? list : [];
        // preload every image to get natural dimensions before physics starts
        // (Fresh_Work has phone, iPad and web screenshots — all different aspects)
        return Promise.all(SKETCHES.map(f => new Promise(res => {
          const img = new Image();
          img.onload  = () => { DIMS[f] = { w: img.naturalWidth, h: img.naturalHeight }; res(); };
          img.onerror = () => { DIMS[f] = { w: 900, h: 1840 }; res(); };
          img.src = IMGDIR + encodeURIComponent(f) + IMGV;
        })));
      })
      .catch(() => {});
    const PAD = 2.5;          // half the ~5px force field, on every side
    const HOVER_S = 1.18;   // a hovered phone grows just slightly
    const pile = document.getElementById('pile');
    const MAX_TILT = Math.PI * 0.306; // 55° max lean either side

    // the descriptor above each phone is just its filename — name a file
    // "Booking calendar.png" and that's what shows. Underscores become
    // spaces so snake_case names read cleanly too.
    function labelFor(f) {
      return f.replace(/\.png$/i, '').replace(/_/g, ' ').replace(/\s+/g, ' ').trim();
    }

    let engine = null, mouseCon = null, labelLayer = null;
    let cards = [], pendingCards = [], walls = [];
    let opened = null, closing = null, downInfo = null, mousePos = null;
    let frames = 0, nextDrop = 0, leak = 0, openedAt = 0, cursorIdx = -1;
    let lastW = 0, lastH = 0;   // viewport at last (re)build/resize — for live re-scaling
    // once the whole pile has been still for a beat we STOP simulating it
    // entirely (a frozen engine cannot jitter). Any interaction wakes it.
    let pileAsleep = false, calmFrames = 0;
    function wakePile() { pileAsleep = false; calmFrames = 0; }
    let draining = false, videoOpen = false;   // play button → drain the pile → show the film
    let _resetZoom = null;   // set up by the carousel touch model; clears a card's pinch-zoom

    // a card sits exactly where its body is — no lens, so a phone's size
    // is never changed by what its neighbours are doing
    function cardView(c) {
      return { x: c.body.position.x, y: c.body.position.y, s: c.scale };
    }

    // build the pile once unlocked AND the manifest + dims have loaded
    addEventListener('unlocked', () => sketchesReady.then(start), { once: true });

    function makeWalls(W, H) {
      const t = 400;
      const reach = leak;
      for (const w of walls) World.remove(engine.world, w);
      walls = [];

      // side walls
      walls.push(
        Bodies.rectangle(-reach - t / 2, H / 2 - H, t, H * 4, { isStatic: true }),
        Bodies.rectangle(W + reach + t / 2, H / 2 - H, t, H * 4, { isStatic: true })
      );

      // wavy floor: sine-wave segments so phones come to rest at gentle angles
      const totalW = W + reach * 2;
      const N = 20;
      const segW = totalW / N;
      // Gentle wave (≈10° max slope): cards grip where they land instead of
      // sliding downhill, and lean variety comes from propping against each
      // other. Same floor for every card.
      const amp = 9;    // wave height — bigger = more lean variation
      const freq = 2.5; // waves across the screen
      const k = (freq * 2 * Math.PI) / totalW;
      for (let i = 0; i < N; i++) {
        const cx = -reach + (i + 0.5) * segW;
        const cy = H + amp * Math.sin(k * cx) + t / 2;
        const angle = Math.atan(amp * k * Math.cos(k * cx));
        walls.push(Bodies.rectangle(cx, cy, segW + 2, t, {
          isStatic: true, angle,
          friction: 0.4, frictionStatic: 0.5, restitution: 0  // low grip: cards slide along & pack
        }));
      }

      // the play button is a LOCKED anchor at dead centre: a static circle the
      // falling work bounces off and piles around. Radius 60 = the 96px button
      // (radius 48) + a 12px invisible buffer so devices never touch the icon.
      // Recreated here so it re-centres on resize.
      walls.push(Bodies.circle(W / 2, H / 2, 60, {
        isStatic: true, restitution: 0.5, friction: 0.2
      }));

      World.add(engine.world, walls);
    }

    function start() {
      const W = innerWidth, H = innerHeight;
      lastW = W; lastH = H;
      engine = Engine.create({
        // sleeping is ON: once a card stops moving it sleeps and is no longer
        // integrated — that is what makes a resting pile DEAD STILL (zero
        // jitter). Anything that must move again (a drag, a hover-grow, a
        // neighbour landing on it) wakes only the bodies it touches.
        enableSleeping: true,
        positionIterations: 16,   // resolve the dense pile faster → settles sooner
        velocityIterations: 10
      });
      engine.gravity.y = 1.0;   // strong enough to drag cards down INTO the gaps and pack tight

      // base area for a phone; iPad and web scale up proportionally to
      // their real-world footprint (iPad ≈ 1.6×, web/landscape ≈ 2.2×).
      // This scales with W*H, so the pile fills the SAME fraction of the
      // screen on a phone, an iPad, or a big monitor — no absolute px cap.
      const targetArea = (W * H * 0.42) / Math.max(1, SKETCHES.length);
      const refW = Math.max(40, Math.min(140, Math.sqrt(targetArea * (900 / 1840))));
      leak = refW * 0.55; // cards can poke out but ≥40% stays visible
      makeWalls(W, H);

      // size by aspect ratio only — NO special-casing for any card. Everything
      // is one and the same: phone portrait, iPad-ish, or landscape/web.
      //   aspect < 0.58 → tall phone portrait
      //   0.58–1.0      → iPad-ish (squarish)
      //   > 1.0         → landscape / web
      function deviceScale(d) {
        const r = d.w / d.h;
        if (r > 1.0)  return 2.2;   // landscape web screenshot
        if (r > 0.58) return 1.6;   // iPad portrait
        return 1.0;                  // phone portrait
      }

      // PURELY a size hint — these two render 1.4× their natural size. Same
      // physics as everything else; only their geometry is bigger. (Now that
      // there's no px cap their base size is already larger, so this multiplier
      // is smaller than before but lands them at a similar prominent size.)
      function sizeBoost(name) {
        const n = name.toLowerCase();
        return (n.includes('trip creator') || (n.includes('calendar') && n.includes('web'))) ? 1.4 : 1;
      }

      labelLayer = document.createElement('div');
      labelLayer.id = 'labels';
      pile.appendChild(labelLayer);

      // one shuffled queue, no reordering — every card drops in random order
      const order = [...SKETCHES].sort(() => Math.random() - 0.5);
      pendingCards = order.map(f => {
        const d = DIMS[f] || { w: 900, h: 1840 };
        const sc = deviceScale(d);
        const name = labelFor(f);
        const boost = sizeBoost(name);
        const w = Math.max(40, Math.sqrt(targetArea * sc * sc * d.w / d.h)) * boost;  // no px cap → scales with viewport
        const h = w * (d.h / d.w);
        const el = document.createElement('div');
        el.className = 'card';
        el.style.width = w + 'px';
        el.style.height = h + 'px';
        el.style.transform = `translate(${W / 2 - w / 2}px, ${-2 * h}px)`;
        const img = document.createElement('img');
        img.src = IMGDIR + encodeURIComponent(f) + IMGV;
        img.alt = name;
        el.appendChild(img);
        pile.appendChild(el);
        // descriptor lives in the flat overlay; positioned each frame
        const label = document.createElement('span');
        label.textContent = name; // whatever the file is named shows here
        labelLayer.appendChild(label);
        return { el, w, h, label };
      });

      // grabbing is a real spring constraint: cards dangle and swing from
      // wherever you pick them up, and fly when you let go
      const mouse = Mouse.create(document.body);
      mouseCon = MouseConstraint.create(engine, {
        mouse,
        constraint: { stiffness: 0.12, damping: 0.1 }
      });
      // no auto-pick: under the lens, what you see isn't where bodies are,
      // so grabbing is assigned manually from the DOM hit (lens-correct)
      mouseCon.collisionFilter.mask = 0;
      World.add(engine.world, mouseCon);

      pile.addEventListener('pointerdown', e => {
        const el = e.target.closest('.card');
        if (!el) return;
        const c = cards.find(x => x.el === el);
        if (!c || c === opened || c.body.isStatic) return;
        const v = cardView(c);
        mouseCon.constraint.pointB = { x: (e.clientX - v.x) / v.s, y: (e.clientY - v.y) / v.s };
        mouseCon.constraint.pointA = { x: e.clientX, y: e.clientY };
        mouseCon.constraint.angleB = c.body.angle; // without this the solver rotates pointB by NaN
        mouseCon.constraint.bodyB = c.body;
        mouseCon.body = c.body;
        Sleeping.set(c.body, false);
        wakePile();   // grabbing a card needs live physics again
      });

      Events.on(mouseCon, 'mousedown', () => {
        if (mouseCon.body) Sleeping.set(mouseCon.body, false);  // wake whatever you grabbed
        downInfo = {
          body: mouseCon.body,
          x: mouse.position.x, y: mouse.position.y,
          t: performance.now()
        };
      });
      Events.on(mouseCon, 'mouseup', () => {
        if (!downInfo) return;
        const moved = Math.hypot(mouse.position.x - downInfo.x, mouse.position.y - downInfo.y);
        if (moved < 8 && performance.now() - downInfo.t < 400) {
          handleTap(downInfo.body ? cards.find(c => c.body === downInfo.body) : null);
        }
        downInfo = null;
      });

      // anything perched on an opened card gets nudged until it slides off
      Events.on(engine, 'collisionActive', e => {
        if (!opened) return;
        for (const pair of e.pairs) {
          const other =
            pair.bodyA === opened.body ? pair.bodyB :
            pair.bodyB === opened.body ? pair.bodyA : null;
          if (other && !other.isStatic) {
            const dx = other.position.x - opened.body.position.x;
            Body.applyForce(other, other.position,
              { x: (dx >= 0 ? 1 : -1) * 0.0009 * other.mass, y: 0 });
          }
        }
      });

      requestAnimationFrame(step);
    }

    function spawnNext() {
      const def = pendingCards.shift();

      // EVERY card enters the same way: anywhere across the width, with a little
      // sideways drift and tumble so the pile scatters naturally. No exceptions.
      const spawnX     = innerWidth * (0.14 + 0.72 * Math.random());
      const spawnVx    = (Math.random() - 0.5) * 1.4;   // gentle sideways drift
      const spawnSpin  = (Math.random() - 0.5) * 0.05;  // a little tumble
      const startAngle = (Math.random() - 0.5) * 0.28;  // enters slightly cocked

      const body = Bodies.rectangle(
        spawnX, -def.h * 0.6,
        def.w + PAD * 2, def.h + PAD * 2,
        {
          // ONE material for every card — zero bounce, LOW friction so cards
          // slide over each other and settle DOWN into the gaps instead of
          // grabbing and hanging where they first touch.
          restitution:    0,
          friction:       0.18,
          frictionStatic: 0.25,
          frictionAir:    0.008,    // very light damping — keep sliding until truly settled
          density:        0.0012,
          angle:          startAngle,
          chamfer: { radius: Math.min(10, def.w * 0.08) }
        }
      );
      // bigger slop = tolerate a hair of overlap instead of fighting it (key
      // anti-jitter knob); sleep sooner than Matter's default so it goes still fast
      body.slop = 1.2;
      body.sleepThreshold = 20;

      Body.setVelocity(body, { x: spawnVx, y: 1.2 });
      Body.setAngularVelocity(body, spawnSpin);
      World.add(engine.world, body);
      cards.push({ ...def, body, scale: 1, target: 1 });
      nextDrop = frames + 12;                            // even cadence, no burst
      wakePile();                                        // a new card needs the engine running
    }

    function handleTap(card) {
      wakePile();   // opening / closing / sliding all move bodies → need live physics
      if (closing && !closing.slideDir) finishClose();
      if (!card) { if (opened) close(opened); return; }
      if (card === opened) { close(card); return; }
      if (opened) close(opened);
      open(card);
    }
    // fromDir: 1 = slide in from right, -1 = from left, 0/undefined = lerp from pile
    function open(card, fromDir) {
      opened = card;
      openedAt = performance.now();
      cursorIdx = cards.indexOf(card);
      card.home = { x: card.body.position.x, y: card.body.position.y, angle: card.body.angle };
      card.target = Math.min((innerWidth * 0.8) / card.w, (innerHeight * 0.86) / card.h);
      Body.setStatic(card.body, true);
      card.body.isSensor = true;
      if (fromDir) {
        // jump to full opened scale immediately so no scaling happens during slide
        if (card.scale !== card.target) {
          Body.scale(card.body, card.target / card.scale, card.target / card.scale);
          card.scale = card.target;
        }
        const sw = card.w * card.target;
        const sx = fromDir > 0 ? innerWidth + sw : -sw;
        Body.setPosition(card.body, { x: sx, y: innerHeight / 2 });
        Body.setAngle(card.body, 0);
      }
      card.slideOpened = fromDir || 0;
      card.el.style.cursor = 'zoom-out';
      card.el.classList.add('opened');
      card.label.style.opacity = '1';
      document.body.classList.add('zoomcard');
    }
    // toDir: 1 = slide out right, -1 = slide out left, 0/undefined = return to pile
    function close(card, toDir, keepVeil) {
      if (_resetZoom) _resetZoom(false);   // clear any pinch-zoom on the outgoing card (opened still set here)
      opened = null;
      closing = card;
      closing.slideDir = toDir || 0;
      card.target = toDir ? card.scale : 1; // directional: no scale change during slide
      card.el.style.cursor = '';
      card.label.style.opacity = '0';
      if (!keepVeil) document.body.classList.remove('zoomcard');
    }
    function finishClose() {
      if (!closing) return;
      const b = closing.body, h = closing.home;
      Body.setPosition(b, { x: h.x, y: h.y });
      Body.setAngle(b, h.angle);
      if (closing.scale !== 1) {
        Body.scale(b, 1 / closing.scale, 1 / closing.scale);
        closing.scale = closing.target = 1;
      }
      b.isSensor = false;
      Body.setStatic(b, false);
      Sleeping.set(b, false);
      closing.el.classList.remove('opened');
      closing = null;
    }

    function step() {
      frames++;
      // freeze only while a design is FULLY open; the close animation runs
      // live so the hover comes back the instant you tap to dismiss it
      const frozen = !!opened;
      if (!frozen && !closing && pendingCards.length && frames >= nextDrop) spawnNext();

      // an opened card is a static ghost that lerps to centre over the veil.
      // When it's sliding in during a swipe/cycle it rushes in FAST (0.2) so it
      // covers the centre before the outgoing card has left — no blank flash.
      // Opening straight from the pile keeps the gentler 0.085 fly-in.
      if (opened) {
        const b = opened.body;
        const k = opened.slideOpened ? 0.2 : 0.085;
        Body.setPosition(b, {
          x: b.position.x + (innerWidth / 2 - b.position.x) * k,
          y: b.position.y + (innerHeight / 2 - b.position.y) * k
        });
        Body.setAngle(b, b.angle * 0.88);
      }

      if (closing) {
        const b = closing.body;
        if (closing.slideDir) {
          // slide off screen then snap back to pile hole (use scaled width for clearance)
          const csw = closing.w * closing.scale;
          const tx = closing.slideDir > 0 ? innerWidth + csw : -csw;
          Body.setPosition(b, {
            x: b.position.x + (tx - b.position.x) * 0.1,   // outgoing lingers (slower) so it covers centre until the incoming arrives
            y: b.position.y + (innerHeight / 2 - b.position.y) * 0.1
          });
          Body.setAngle(b, b.angle * 0.9);
          if (Math.abs(b.position.x - tx) < 15) finishClose();
        } else {
          // return to its exact hole in the pile
          const h = closing.home;
          Body.setPosition(b, {
            x: b.position.x + (h.x - b.position.x) * 0.12,
            y: b.position.y + (h.y - b.position.y) * 0.12
          });
          Body.setAngle(b, b.angle + (h.angle - b.angle) * 0.12);
          if (Math.hypot(h.x - b.position.x, h.y - b.position.y) < 1.5 &&
              Math.abs(closing.scale - 1) < 0.01) finishClose();
        }
      }

      const draggedBody = mouseCon && mouseCon.body;

      // which phone is under the cursor right now — re-hit-tested every
      // frame so a parked cursor keeps its phone grown. Never the opened,
      // closing, or dragged one.
      let hoverCard = null;
      if (mousePos && !opened && pendingCards.length === 0) {
        const hit = document.elementFromPoint(mousePos.x, mousePos.y);
        const wrap = hit && hit.closest ? hit.closest('.card') : null;
        if (wrap && wrap.parentElement === pile) {
          const c = cards.find(x => x.el === wrap);
          if (c && c !== closing && c.body !== draggedBody) hoverCard = c;
        }
      }

      if (hoverCard) wakePile();   // any hover needs live physics for the grow

      // hover grows ONLY that phone, a little. Every other phone keeps its
      // own size — the growth just leans on them through real physics.
      for (const c of cards) {
        if (c === opened || c === closing) continue; // size managed by open/close
        c.target = c === hoverCard ? HOVER_S : 1;
      }

      // ease each card toward its size — a real Body.scale, so the solver
      // resolves the new overlap by nudging neighbours aside
      for (const c of cards) {
        if (c.scale === c.target) continue;
        let ns = c.scale + (c.target - c.scale) * 0.2;
        if (Math.abs(c.target - ns) < 0.002) ns = c.target;
        Body.scale(c.body, ns / c.scale, ns / c.scale);
        c.scale = ns;
        Sleeping.set(c.body, false);
      }

      // wake the phones a growing hover is about to lean on
      if (hoverCard) {
        const hx = hoverCard.body.position.x, hy = hoverCard.body.position.y;
        const r2 = (hoverCard.w * 2.4) * (hoverCard.w * 2.4);
        for (const o of cards) {
          const dx = o.body.position.x - hx, dy = o.body.position.y - hy;
          if (dx * dx + dy * dy < r2) Sleeping.set(o.body, false);
        }
      }

      // Run physics ONLY while the pile is awake (and no card is fully open).
      // Once everything has been still for a beat we set pileAsleep and skip
      // Engine.update entirely — a frozen engine is, by definition, jitter-free.
      if (!frozen && !pileAsleep && !videoOpen) {
        // two half-steps per frame: bodies travel half as far between
        // solver passes, so penetration never gets a chance to build
        Engine.update(engine, 1000 / 120);
        Engine.update(engine, 1000 / 120);

        let maxMotion = 0;
        for (const c of cards) {
          const b = c.body;
          if (b.isStatic || b.isSleeping) continue;   // asleep = at rest, leave it be
          // the hovered phone is held still so it stays under the cursor —
          // it still grows and pushes, it just doesn't drift off
          if (c === hoverCard) { Body.setVelocity(b, { x: 0, y: 0 }); Body.setAngularVelocity(b, 0); continue; }
          // one speed cap for everything (larger only while you're dragging it)
          const cap = draining ? 70 : (b === draggedBody ? 24 : 11);
          const v = b.velocity;
          const sp = Math.hypot(v.x, v.y);
          if (sp > cap) Body.setVelocity(b, { x: v.x / sp * cap, y: v.y / sp * cap });
          // soft tilt clamp — normalize to [-π, π], then damp angular
          // velocity when past the max lean rather than hard-zeroing it
          let a = b.angle % (2 * Math.PI);
          if (a > Math.PI) a -= 2 * Math.PI;
          else if (a < -Math.PI) a += 2 * Math.PI;
          if (Math.abs(a) > MAX_TILT) {
            Body.setAngle(b, Math.sign(a) * MAX_TILT);
            Body.setAngularVelocity(b, b.angularVelocity * 0.25);
          }
          maxMotion = Math.max(maxMotion, sp, Math.abs(b.angularVelocity) * 40);
        }

        // settle detector. While nothing is dropping / dragged / hovered:
        //  • freeze only once the busiest body is REALLY still (tight threshold
        //    so it can't freeze mid-settle, leaving floating gaps) for ~½ s.
        //  • hard fallback after ~8 s so it always ends up dead still eventually.
        const quiet = pendingCards.length === 0 && !closing && !draggedBody && !hoverCard;
        if (quiet) {
          calmFrames++;
          if (maxMotion < 0.12 ? calmFrames > 35 : calmFrames > 480) pileAsleep = true;
        } else {
          calmFrames = 0;
        }
      }

      // render: each card sits exactly where its body is, at its own size
      for (const c of cards) {
        const b = c.body;
        c.el.style.zIndex =
          c === opened ? 30 :
          c === closing ? 29 :          // outgoing sits just under the incoming during a cycle
          b === draggedBody ? 20 :
          c === hoverCard ? 15 : Math.round(c.scale * 12);
        if (c === opened || c === closing) {
          // The opened/closing card is rendered at its REAL pixel size (element
          // sized to the display dimensions, scale 1) instead of CSS-scaling a
          // tiny pile element up ~7×. That keeps the image crisp AND avoids iOS
          // Safari blanking a hard-scaled compositing layer (the bug that made
          // phone-shaped designs vanish in the carousel).
          const dw = c.w * c.scale, dh = c.h * c.scale;
          if (c.el._dw !== dw) { c.el.style.width = dw + 'px'; c.el.style.height = dh + 'px'; c.el._dw = dw; }
          c.el.style.transform =
            `translate(${(b.position.x - dw / 2).toFixed(2)}px, ${(b.position.y - dh / 2).toFixed(2)}px) ` +
            `rotate(${b.angle.toFixed(4)}rad)`;
        } else {
          if (c.el._dw != null) { c.el.style.width = c.w + 'px'; c.el.style.height = c.h + 'px'; c.el._dw = null; }
          c.el.style.transform =
            `translate(${(b.position.x - c.w / 2).toFixed(2)}px, ${(b.position.y - c.h / 2).toFixed(2)}px) ` +
            `rotate(${b.angle.toFixed(4)}rad) scale(${c.scale.toFixed(4)})`;
        }
      }

      // descriptor: when a card is open it lives at the top pill bar position
      // (top:16 + padding:8 = 24px → same text baseline as the three pills).
      // While closing back to pile it stays at bottom; opacity hides it anyway.
      const active = opened || closing;
      if (active) {
        if (opened) {
          active.label.style.transform =
            `translate(${(innerWidth / 2).toFixed(1)}px, 24px) translate(-50%, 0)`;
        } else {
          active.label.style.transform =
            `translate(${(innerWidth / 2).toFixed(1)}px, ${(innerHeight - 20).toFixed(1)}px) translate(-50%, -100%)`;
        }
      }

      requestAnimationFrame(step);
    }

    // just track the pointer; step() hit-tests it each frame to decide
    // which phone (if any) is hovered
    addEventListener('mousemove', e => { mousePos = { x: e.clientX, y: e.clientY }; });
    document.documentElement.addEventListener('mouseleave', () => { mousePos = null; });

    // cycle while a card is open — old slides out, new slides in
    function cycleSlide(dir) {
      if (!cards.length) return;
      wakePile();
      if (closing) finishClose();
      cursorIdx = (cursorIdx + dir + cards.length) % cards.length;
      const next = cards[cursorIdx];
      if (next === opened) return;
      if (opened) close(opened, -dir, true); // slide out opposite direction, keep veil
      open(next, dir);
    }

    // pick a random visible card from the pile and slide it centre
    function openRandom(dir) {
      if (!cards.length) return;
      wakePile();
      if (closing) finishClose();
      const W = innerWidth, H = innerHeight;
      const pool = cards.filter(c =>
        c !== opened && c !== closing &&
        c.body.position.x > -c.w && c.body.position.x < W + c.w &&
        c.body.position.y > -c.h && c.body.position.y < H + c.h
      );
      if (!pool.length) return;
      const pick = pool[Math.floor(Math.random() * pool.length)];
      cursorIdx = cards.indexOf(pick);
      if (opened) close(opened, -dir, true);
      open(pick, dir);
    }

    // ===== play button → drain the pile, then roll the film =====
    // Tapping play OPENS THE BOTTOM: the floor + centre anchor are removed and
    // gravity spikes, so all the work pours out the bottom of the screen. Once
    // it's drained, the film fades up.
    function drainPile() {
      if (draining || videoOpen) return;
      draining = true;
      document.body.classList.add('draining');   // the play button fades out
      wakePile();
      for (let i = 2; i < walls.length; i++) World.remove(engine.world, walls[i]);  // keep the 2 side walls, drop the floor + anchor
      engine.gravity.y = 3.4;
      for (const c of cards) {
        if (c.body.isStatic) continue;
        Sleeping.set(c.body, false);
        Body.setVelocity(c.body, { x: c.body.velocity.x * 0.5, y: 9 + Math.random() * 6 });
      }
      setTimeout(showVideo, 1250);   // ~the time it takes the work to clear the bottom
    }
    const videostage = document.getElementById('videostage');
    const filmEl = videostage ? videostage.querySelector('video') : null;
    function showVideo() {
      videoOpen = true;
      document.body.classList.add('playing');    // reveals the film stage, hides the pile
      // playback was already kicked off in the tap gesture (below); just make sure.
      if (filmEl && filmEl.paused) filmEl.play().catch(() => {});
    }
    function closeVideo() {
      if (!videoOpen) return;
      if (filmEl) filmEl.pause();
      videoOpen = false;
      document.body.classList.remove('playing', 'draining');
      // re-pour the pile: restore the floor + anchor, reset gravity, drop every
      // card back in from above.
      makeWalls(innerWidth, innerHeight);
      engine.gravity.y = 1.0;
      draining = false;
      for (const c of cards) {
        Body.setPosition(c.body, { x: innerWidth * (0.14 + 0.72 * Math.random()), y: -c.h - Math.random() * innerHeight * 0.6 });
        Body.setAngle(c.body, (Math.random() - 0.5) * 0.28);
        Body.setVelocity(c.body, { x: (Math.random() - 0.5) * 1.4, y: 1.5 });
        Body.setAngularVelocity(c.body, (Math.random() - 0.5) * 0.05);
        Sleeping.set(c.body, false);
      }
      wakePile();
    }
    // Start the film at `t` seconds, INSIDE the user gesture so the autoplay policy
    // lets it play with sound. preload="none" means metadata isn't loaded yet, so the
    // seek has to wait for loadedmetadata; play() triggers that load. The film runs
    // hidden while the pile drains, then showVideo() reveals it already at the mark.
    function startFilm(t) {
      if (!filmEl) return;
      const seek = () => { try { filmEl.currentTime = t || 0; } catch (_) {} };
      if (filmEl.readyState >= 1) seek();
      else filmEl.addEventListener('loadedmetadata', seek, { once: true });
      filmEl.play().catch(() => {});
    }
    // Open the film at a timecode: seek+play now, and if we're still in the pile,
    // drain it first. If the film is already open, this just jumps to the chapter.
    function openFilmAt(t) {
      startFilm(t);
      if (!videoOpen && !draining) drainPile();
    }
    const playbtn = document.getElementById('playbtn');
    if (playbtn) playbtn.addEventListener('click', e => { e.preventDefault(); openFilmAt(0); });
    const fmtTime = s => Math.floor(s / 60) + ':' + String(Math.round(s % 60)).padStart(2, '0');
    document.querySelectorAll('#chapter-bar .chip').forEach(chip => {
      const t = parseFloat(chip.dataset.t) || 0;
      // append the timecode to the label (built from data-t so they never drift)
      chip.innerHTML = chip.textContent.trim() + '<span class="chip-t">' + fmtTime(t) + '</span>';
      chip.addEventListener('click', e => { e.preventDefault(); openFilmAt(t); });
    });
    const videoclose = document.getElementById('videoclose');
    if (videoclose) videoclose.addEventListener('click', e => { e.stopPropagation(); closeVideo(); });

    const navPrev = document.getElementById('navPrev');
    const navNext = document.getElementById('navNext');
    const navClose = document.getElementById('navClose');
    // iOS Safari can swallow synthetic clicks on fixed overlay buttons over a
    // backdrop-filter veil. Bind the action on touchend directly (preventDefault
    // kills the ghost click AND stops the window swipe/close handlers from also
    // firing), with click kept as the mouse/desktop path. `handled` stops the
    // touch path from double-firing via the ghost click.
    function onTap(el, fn) {
      if (!el) return;
      let handled = false;
      el.addEventListener('touchend', e => {
        handled = true;
        e.preventDefault();
        e.stopPropagation();
        fn();
        setTimeout(() => { handled = false; }, 500);
      }, { passive: false });
      el.addEventListener('click', e => {
        e.stopPropagation();
        if (handled) return;
        fn();
      });
    }
    onTap(navPrev, () => cycleSlide(-1));
    onTap(navNext, () => cycleSlide(1));
    onTap(navClose, () => { if (opened) close(opened); });

    addEventListener('keydown', e => {
      if (!document.body.classList.contains('unlocked')) return;
      if (e.key === 'Escape') { if (opened) close(opened); }
      else if (e.key === 'ArrowLeft')  { opened ? cycleSlide(-1) : openRandom(-1); }
      else if (e.key === 'ArrowRight') { opened ? cycleSlide(1)  : openRandom(1);  }
    });

    // ===== carousel touch model (mobile) =====
    //  • pinch (2 fingers) zooms AND pans the open design, and STAYS put when
    //    you release (no snap-back) — pinch back near 1× to reset.
    //  • while zoomed, a one-finger drag pans (see the left/right of the design).
    //  • when NOT zoomed, a one-finger horizontal swipe cycles next/prev.
    //  • navigating or closing always resets the zoom.
    // The zoom/pan is applied to the IMAGE inside the card (the card frame is
    // positioned every frame by the physics render, so the image transform is a
    // separate, independent layer).
    let _tx = 0, _ty = 0, _swiped = false;
    let zoom = 1, panX = 0, panY = 0;
    let _p0x = 0, _p0y = 0, _pbX = 0, _pbY = 0;   // one-finger pan start/base
    function zImg() { return opened ? opened.el.querySelector('img') : null; }
    function applyZoom() { const im = zImg(); if (im) { im.style.transition = 'none'; im.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + zoom + ')'; } }
    function resetZoom(animate) {
      const im = zImg();
      if (im) { im.style.transition = animate ? 'transform 0.3s cubic-bezier(0.2,0.8,0.2,1)' : 'none'; im.style.transform = ''; }
      zoom = 1; panX = 0; panY = 0;
    }
    // expose so cycleSlide/close can clear the zoom on the outgoing card
    _resetZoom = resetZoom;

    // pinch via iOS Safari gesture events (scale + the gesture-centre for pan)
    // _multiTouch latches TRUE the moment a 2nd finger (or a gesture) appears and
    // only clears once EVERY finger is up. A swipe is processed solely on the
    // final lift and only if the whole gesture was single-finger — so a pinch
    // (zoom in OR out) can never be mistaken for a swipe, no matter what order
    // iOS fires gestureend vs touchend.
    let _multiTouch = false;
    if ('ongesturestart' in window) {
      let bz = 1, bpx = 0, bpy = 0, gx = 0, gy = 0;
      addEventListener('gesturestart', e => {
        if (!opened) return; e.preventDefault(); _multiTouch = true;
        bz = zoom; bpx = panX; bpy = panY; gx = e.clientX; gy = e.clientY;
      }, { passive: false });
      addEventListener('gesturechange', e => {
        if (!opened || !_multiTouch) return; e.preventDefault();
        zoom = Math.max(1, Math.min(5, bz * e.scale));
        panX = bpx + (e.clientX - gx); panY = bpy + (e.clientY - gy);
        applyZoom();
      }, { passive: false });
      addEventListener('gestureend', e => {
        e.preventDefault();
        if (zoom <= 1.05) resetZoom(true);   // pinched back out → snap fully clean
        // NOTE: do NOT clear _multiTouch here — the trailing touchend(s) own that,
        // so a late touchend can't be read as a swipe.
      }, { passive: false });
    }

    addEventListener('touchstart', e => {
      if (e.touches.length > 1) { _multiTouch = true; return; }   // 2+ fingers → pinch, never a swipe
      if (!_multiTouch) {                                         // fresh single-finger gesture
        _tx = e.touches[0].clientX; _ty = e.touches[0].clientY; _swiped = false;
        _p0x = _tx; _p0y = _ty; _pbX = panX; _pbY = panY;         // seed one-finger pan
      }
    }, { passive: true });

    // one-finger pan while zoomed (non-passive so we can stop native scrolling)
    addEventListener('touchmove', e => {
      if (opened && zoom > 1 && !_multiTouch && e.touches.length === 1) {
        panX = _pbX + (e.touches[0].clientX - _p0x);
        panY = _pbY + (e.touches[0].clientY - _p0y);
        applyZoom();
        e.preventDefault();
      }
    }, { passive: false });

    addEventListener('touchend', e => {
      if (e.touches.length > 0) return;            // wait until ALL fingers are up
      const wasMulti = _multiTouch; _multiTouch = false;
      if (wasMulti) return;                        // gesture involved 2+ fingers → not a swipe
      if (!document.body.classList.contains('unlocked') || !opened) return;
      if (zoom > 1) return;                        // zoomed → that one-finger move was a pan
      const dx = e.changedTouches[0].clientX - _tx;
      const dy = e.changedTouches[0].clientY - _ty;
      // horizontal, far enough, and more sideways than vertical → swipe to cycle
      if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.4) {
        _swiped = true;
        cycleSlide(dx < 0 ? 1 : -1);
      } else if (dy > 70 && dy > Math.abs(dx) * 1.4) {
        // clear DOWNWARD swipe → dismiss back to the pile
        _swiped = true;
        close(opened);
      }
    }, { passive: true });

    // in single-phone mode a TAP anywhere (or the X) returns to the cluster —
    // but a swipe must NOT close (it navigates). Decoupled from the physics
    // tap-handler (the engine is frozen while a design is open); the 250ms
    // guard skips the very click that opened the card.
    addEventListener('click', e => {
      if (e.target && e.target.closest && e.target.closest('.nav, #navClose')) return; // buttons handle themselves
      if (_swiped) { _swiped = false; return; }   // that gesture was a swipe → keep viewing
      if (opened && zoom > 1) { resetZoom(true); return; }   // tap while zoomed → zoom back out, stay in the carousel
      if (opened && performance.now() - openedAt > 250) close(opened);
    });

    // a resize re-scales the whole pile to the new viewport — cards GROW when
    // the window grows and shrink when it shrinks — then moves the walls and
    // wakes the pile so it re-settles into the new space.
    addEventListener('resize', () => {
      if (!engine || !lastW || !lastH) return;
      const nw = innerWidth, nh = innerHeight;
      if (nw < 200 || nh < 200) return;   // ignore transient/degenerate sizes (mobile can briefly report ~0)
      // ONLY re-scale on a real WIDTH change (desktop resize / device rotation).
      // Mobile browsers fire resize constantly as the URL bar hides/shows — that
      // is a height-only change and must NOT rescale the pile (it was zeroing
      // the cards). On a height-only change just keep the floor under the pile.
      if (Math.abs(nw - lastW) < 4) { lastH = nh; makeWalls(nw, nh); wakePile(); return; }
      const fx = nw / lastW, fy = nh / lastH;
      let fs = Math.sqrt(fx * fy);
      if (!isFinite(fs) || fs <= 0) { lastW = nw; lastH = nh; return; }
      fs = Math.max(0.5, Math.min(2, fs));   // clamp per-event so one bad value can never nuke the pile
      leak *= fs;
      for (const c of cards) {
        c.w *= fs; c.h *= fs;
        c.el.style.width = c.w + 'px';
        c.el.style.height = c.h + 'px';
        Body.scale(c.body, fs, fs);
        Body.setPosition(c.body, { x: c.body.position.x * fx, y: c.body.position.y * fy });
        Sleeping.set(c.body, false);
      }
      lastW = nw; lastH = nh;
      makeWalls(nw, nh);
      wakePile();
    });
  })();
  </script>
</body>
</html>
