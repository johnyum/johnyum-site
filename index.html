<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>John Yum</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    background: #fff;
    color: #111;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
    cursor: text;
  }
  /* real input, visually hidden — it owns focus and the mobile keyboard */
  #key {
    position: fixed;
    width: 1px; height: 1px;
    opacity: 0;
    border: 0; padding: 0;
  }
  #line {
    display: flex;
    align-items: center;
    gap: 0.16em;
    font-size: clamp(4rem, 12vw, 10rem);
    user-select: none;
    transition: opacity 0.45s ease;
  }
  #line.gone { opacity: 0; }
  #dots {
    display: flex;
    align-items: center;
    gap: 0.16em;
  }
  #dots i {
    width: 0.16em;
    height: 0.16em;
    border-radius: 50%;
    background: #a3a3a3;
  }
  #dots i.sel { background: #0a84ff; }
  #caret {
    width: 0.035em;
    min-width: 2px;
    height: 1.05em;
    background: #111;
    animation: blink 1.06s step-end infinite;
  }
  /* caret holds solid while typing, like a real text field */
  #line.typing #caret { animation: none; opacity: 1; }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
  @keyframes shake {
    20% { transform: translateX(-0.12em); }
    40% { transform: translateX(0.1em); }
    60% { transform: translateX(-0.07em); }
    80% { transform: translateX(0.05em); }
  }
  #line.shake { animation: shake 0.35s ease; }
  body.unlocked #line { display: none; }
  #pile {
    position: fixed; inset: 0;
    overflow: hidden;
    display: none;
    pointer-events: none;
  }
  body.unlocked #pile { display: block; }
  #pile img {
    position: absolute; left: 0; top: 0;
    will-change: transform;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: auto;
    cursor: grab;
    touch-action: none;
  }
  @media (prefers-reduced-motion: reduce) {
    #caret { animation: none; }
    #line.shake { animation: none; }
  }
</style>
</head>
<body>
  <input id="key" type="password" autocomplete="off" spellcheck="false" aria-label="Password">
  <div id="line" aria-hidden="true"><span id="dots"><span id="caret"></span></span></div>
  <div id="pile" aria-hidden="true"></div>
  <script>
  (() => {
    const PASSWORD = 'KnockKnock'; // client-side only: a curtain, not a lock
    const key = document.getElementById('key');
    const line = document.getElementById('line');
    const dots = document.getElementById('dots');
    const caret = document.getElementById('caret');
    let typingTimer;

    function focusKey() {
      if (!document.body.classList.contains('unlocked')) key.focus();
    }
    focusKey();
    // synchronous focus inside the gesture, so mobile taps summon the keyboard
    addEventListener('pointerdown', focusKey);
    addEventListener('click', focusKey);
    key.addEventListener('blur', () => setTimeout(focusKey, 50));

    // the hidden input is a real text field — arrows, select-all, cut,
    // everything native works. This just draws its state: one dot per
    // character, selection in blue, the caret exactly where it is.
    function renderLine(active) {
      const len = key.value.length;
      const s = key.selectionStart ?? len, e = key.selectionEnd ?? len;
      const caretAt = key.selectionDirection === 'backward' ? s : e;
      let html = '';
      for (let i = 0; i < len; i++) html += i >= s && i < e ? '<i class="sel"></i>' : '<i></i>';
      dots.innerHTML = html;
      caret.style.display = s !== e ? 'none' : '';
      dots.insertBefore(caret, dots.children[caretAt] || null);
      if (active) {
        line.classList.add('typing');
        clearTimeout(typingTimer);
        typingTimer = setTimeout(() => line.classList.remove('typing'), 600);
      }
    }
    key.addEventListener('input', () => renderLine(true));
    key.addEventListener('keyup', () => renderLine(true));
    key.addEventListener('select', () => renderLine(false));
    document.addEventListener('selectionchange', () => {
      if (document.activeElement === key) renderLine(false);
    });

    key.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      if (key.value === PASSWORD) {
        key.value = '';
        key.blur();
        line.classList.add('gone');
        setTimeout(() => {
          document.body.classList.add('unlocked');
          // blank stage — the work showcase mounts here
          dispatchEvent(new CustomEvent('unlocked'));
        }, 450);
      } else {
        key.value = '';
        renderLine(false);
        line.classList.add('shake');
        line.addEventListener('animationend', () => line.classList.remove('shake'), { once: true });
      }
    });
  })();
  </script>
  <script src="js/matter.min.js"></script>
  <script>
  // After the knock: the calendar sketches pour in under a real rigid-body
  // engine (Matter.js) — true rotation, torque, friction — so phones tumble
  // and lie exactly how thrown things lie. Each physics body is 2px larger
  // than its image on every side: the invisible 4px force field.
  (() => {
    if (!window.Matter) return;
    const { Engine, World, Bodies, Body, Events, Mouse, MouseConstraint, Sleeping } = Matter;
    const DIR = 'img/Calendar_Sketches/';
    const SKETCHES = [
      "Component 100-1.png", "Component 100.png", "Component 101-1.png",
      "Component 101.png", "Component 102.png", "Component 123.png",
      "Component 124.png", "Component 2.png", "Component 6.png",
      "Component 92-1.png", "Component 92-10.png", "Component 92-11.png",
      "Component 92-12.png", "Component 92-13.png", "Component 92-14.png",
      "Component 92-2.png", "Component 92-3.png", "Component 92-4.png",
      "Component 92-5.png", "Component 92-6.png", "Component 92-7.png",
      "Component 92-8.png", "Component 92-9.png", "Component 92.png",
      "Component 93.png", "Component 94.png", "Component 95.png",
      "Component 96.png", "Component 97.png", "Component 98.png",
      "Component 99.png", "Group 2147237272.png", "Group 2147237277.png",
      "Group 2147237308.png", "Group 2147237319.png", "Group 2147237320.png",
      "Group 2147237322.png", "Group 2147237328.png", "Group 2147237329.png",
      "Group 2147237330.png", "Group 3.png", "Villa_Mayana_Mobile.png"
    ];
    const ASPECT = 1840 / 900;
    const PAD = 2.5;          // half the ~5px force field, on every side
    const HOVER_S = 1.3;
    const pile = document.getElementById('pile');

    let engine = null, mouseCon = null;
    let cards = [], pendingCards = [], walls = [];
    let opened = null, downInfo = null, mousePos = null;
    let frames = 0, nextDrop = 0, leak = 0, baseW0 = 0;
    let lensA = 0, FR = 260;
    const A0 = HOVER_S - 1;

    // where the lens puts a card on screen: magnified near the cursor,
    // displaced outward by the integral of the scale field
    function lensView(c) {
      const b = c.body;
      let x = b.position.x, y = b.position.y, s = c.scale;
      if (lensA > 0.004 && mousePos && c !== opened) {
        const dx = x - mousePos.x, dy = y - mousePos.y;
        const d = Math.hypot(dx, dy);
        const u = Math.max(0, 1 - d / FR);
        if (u > 0) s = c.scale * (1 + lensA * A0 * u * u * (3 - 2 * u));
        const shift = lensA * A0 * FR * (0.5 - u * u * u + (u * u * u * u) / 2);
        if (d > 0.5) { x += (dx / d) * shift; y += (dy / d) * shift; }
      }
      return { x, y, s };
    }

    // warm the image cache while the visitor is still at the door
    addEventListener('load', () => setTimeout(() => {
      for (const f of SKETCHES) { const im = new Image(); im.src = DIR + encodeURIComponent(f); }
    }, 600));

    addEventListener('unlocked', start, { once: true });

    function makeWalls(W, H, wide) {
      // when a design is centre stage the side walls fly outward, so the
      // pile is free to spill far past the edges of the screen
      const t = 400;
      const reach = leak + (wide ? W * 0.3 : 0);
      for (const w of walls) World.remove(engine.world, w);
      walls = [
        Bodies.rectangle(W / 2, H + t / 2, W * 4, t, { isStatic: true }),
        Bodies.rectangle(-reach - t / 2, H / 2 - H, t, H * 4, { isStatic: true }),
        Bodies.rectangle(W + reach + t / 2, H / 2 - H, t, H * 4, { isStatic: true })
      ];
      World.add(engine.world, walls);
    }

    function start() {
      const W = innerWidth, H = innerHeight;
      engine = Engine.create({
        enableSleeping: true,
        positionIterations: 14,   // strong non-penetration solving
        velocityIterations: 10
      });
      engine.gravity.y = 0.45;   // floaty

      const baseW = Math.max(40, Math.min(150, Math.sqrt((W * H * 0.62) / (SKETCHES.length * ASPECT))));
      baseW0 = baseW;
      FR = baseW * 2.6;
      leak = baseW * 0.8; // phones live well past the screen edges
      makeWalls(W, H);

      const order = [...SKETCHES].sort(() => Math.random() - 0.5);
      // uniform size — only interaction (hover/open) changes a phone's scale
      pendingCards = order.map(f => {
        const w = baseW;
        const h = w * ASPECT;
        const el = document.createElement('img');
        el.src = DIR + encodeURIComponent(f);
        el.alt = '';
        el.style.width = w + 'px';
        el.style.height = h + 'px';
        el.style.transform = `translate(${W / 2 - w / 2}px, ${-2 * h}px)`;
        pile.appendChild(el);
        return { el, w, h };
      });

      // grabbing is a real spring constraint: cards dangle and swing from
      // wherever you pick them up, and fly when you let go
      const mouse = Mouse.create(document.body);
      mouseCon = MouseConstraint.create(engine, {
        mouse,
        constraint: { stiffness: 0.12, damping: 0.1 }
      });
      // no auto-pick: under the lens, what you see isn't where bodies are,
      // so grabbing is assigned manually from the DOM hit (lens-correct)
      mouseCon.collisionFilter.mask = 0;
      World.add(engine.world, mouseCon);

      pile.addEventListener('pointerdown', e => {
        const el = e.target.closest('img');
        if (!el) return;
        const c = cards.find(x => x.el === el);
        if (!c || c === opened || c.body.isStatic) return;
        const v = lensView(c);
        mouseCon.constraint.pointB = { x: (e.clientX - v.x) / v.s, y: (e.clientY - v.y) / v.s };
        mouseCon.constraint.pointA = { x: e.clientX, y: e.clientY };
        mouseCon.constraint.angleB = c.body.angle; // without this the solver rotates pointB by NaN
        mouseCon.constraint.bodyB = c.body;
        mouseCon.body = c.body;
        Sleeping.set(c.body, false);
      });

      Events.on(mouseCon, 'mousedown', () => {
        downInfo = {
          body: mouseCon.body,
          x: mouse.position.x, y: mouse.position.y,
          t: performance.now()
        };
      });
      Events.on(mouseCon, 'mouseup', () => {
        if (!downInfo) return;
        const moved = Math.hypot(mouse.position.x - downInfo.x, mouse.position.y - downInfo.y);
        if (moved < 8 && performance.now() - downInfo.t < 400) {
          handleTap(downInfo.body ? cards.find(c => c.body === downInfo.body) : null);
        }
        downInfo = null;
      });

      // anything perched on an opened card gets nudged until it slides off
      Events.on(engine, 'collisionActive', e => {
        if (!opened) return;
        for (const pair of e.pairs) {
          const other =
            pair.bodyA === opened.body ? pair.bodyB :
            pair.bodyB === opened.body ? pair.bodyA : null;
          if (other && !other.isStatic) {
            const dx = other.position.x - opened.body.position.x;
            Body.applyForce(other, other.position,
              { x: (dx >= 0 ? 1 : -1) * 0.0009 * other.mass, y: 0 });
          }
        }
      });

      requestAnimationFrame(step);
    }

    function spawnNext() {
      const def = pendingCards.shift();
      const splashy = cards.length < 5;
      const body = Bodies.rectangle(
        innerWidth * (0.12 + 0.76 * Math.random()), -def.h,
        def.w + PAD * 2, def.h + PAD * 2,
        {
          restitution: splashy ? 0.5 : 0.22,
          friction: 0.35,
          frictionStatic: 0.5,
          frictionAir: 0.012,
          angle: (Math.random() - 0.5) * 0.3,
          chamfer: { radius: Math.min(10, def.w * 0.08) }
        }
      );
      Body.setVelocity(body, {
        x: (Math.random() - 0.5) * (splashy ? 9 : 2.5),
        y: splashy ? 2 + Math.random() * 3 : 1 + Math.random() * 1.5
      });
      Body.setAngularVelocity(body, (Math.random() - 0.5) * (splashy ? 0.12 : 0.05));
      World.add(engine.world, body);
      cards.push({ ...def, body, scale: 1, target: 1 });
      nextDrop = frames + (splashy ? 10 : 13);
    }

    function handleTap(card) {
      if (!card) { if (opened) close(opened); return; }
      if (card === opened) { close(card); return; }
      if (opened) close(opened);
      open(card);
    }
    function open(card) {
      opened = card;
      card.target = Math.min((innerWidth * 0.8) / card.w, (innerHeight * 0.86) / card.h);
      Body.setStatic(card.body, true);
      card.el.style.cursor = 'zoom-out';
      makeWalls(innerWidth, innerHeight, true); // let the pile break the frame
      for (const c of cards) Sleeping.set(c.body, false);
    }
    function close(card) {
      opened = null;
      card.target = 1;
      Body.setStatic(card.body, false);
      Sleeping.set(card.body, false);
      card.el.style.cursor = '';
      makeWalls(innerWidth, innerHeight, false); // walls come home, pile refills
      for (const c of cards) Sleeping.set(c.body, false);
    }

    function step() {
      frames++;
      if (pendingCards.length && frames >= nextDrop) spawnNext();

      // an opened card is static and simply lerps to centre — perfectly
      // smooth by construction. It slides OVER the pile (it renders on
      // top) while the phones beneath are ushered out of its destination
      if (opened) {
        const b = opened.body;
        Body.setPosition(b, {
          x: b.position.x + (innerWidth / 2 - b.position.x) * 0.085,
          y: b.position.y + (innerHeight / 2 - b.position.y) * 0.085
        });
        Body.setAngle(b, b.angle * 0.88);
        const tw = opened.w * opened.target, th = opened.h * opened.target;
        for (const c of cards) {
          if (c === opened) continue;
          const o = c.body;
          // everything in the destination footprint gets walked out
          // sideways — down is the floor, so horizontal is the way out
          const dx = o.position.x - innerWidth / 2, dy = o.position.y - innerHeight / 2;
          if (Math.abs(dx) < tw / 2 + c.w / 2 + 30 && Math.abs(dy) < th / 2 + c.h / 2 + 30) {
            Body.applyForce(o, o.position, {
              x: (dx >= 0 ? 1 : -1) * 0.005 * o.mass,
              y: dy < 0 ? -0.001 * o.mass : 0
            });
            Sleeping.set(o, false);
          }
        }
      }

      const draggedBody = mouseCon && mouseCon.body;

      // ease scales — a phone only grows into room that actually exists:
      // if it's already pressed against a neighbour it waits for the pile
      // to make space, and each step is capped below the force field
      for (const c of cards) {
        if (Math.abs(c.scale - c.target) < 0.0005) continue;
        let ns = c.scale + (c.target - c.scale) * 0.18;
        if (ns > c.scale) {
          let capPx = 2.5;
          if (c !== opened) {
            // growing IS how a phone makes room — it may press gently
            // while the field has margin, and pauses when it's spent.
            // The opened card is exempt: it expands steadily and the
            // solver squeezes anything beneath it out to the sides.
            const others = cards.filter(x => x !== c).map(x => x.body);
            let worst = 0;
            for (const hit of Matter.Query.collides(c.body, others)) {
              if (hit.depth > worst) worst = hit.depth;
            }
            if (worst > 4) { Sleeping.set(c.body, false); continue; }
            capPx = worst === 0 ? 3.5 : 1.2;
          }
          const maxNs = c.scale * (1 + capPx / (c.h * c.scale / 2));
          if (ns > maxNs) ns = maxNs;
        }
        if (Math.abs(c.target - ns) < 0.002) ns = c.target;
        Body.scale(c.body, ns / c.scale, ns / c.scale);
        c.scale = ns;
        Sleeping.set(c.body, false);
      }

      // two half-steps per frame: bodies travel half as far between solver
      // passes, so penetration never gets a chance to build
      Engine.update(engine, 1000 / 120);
      Engine.update(engine, 1000 / 120);

      // a universal speed limit: no card may ever move faster than the
      // solver can clear penetration, so nothing can bury into anything.
      // A dragged card gets more headroom for responsiveness.
      for (const c of cards) {
        const b = c.body;
        if (b.isStatic) continue;
        const cap = b === draggedBody ? 24 : 5;
        const v = b.velocity;
        const sp = Math.hypot(v.x, v.y);
        if (sp > cap) Body.setVelocity(b, { x: v.x / sp * cap, y: v.y / sp * cap });
      }

      // the hover fisheye is a pure visual lens over the physics: cards
      // magnify under the cursor and the displacement field is the exact
      // integral of the scale field, so spacing always stretches at least
      // as fast as cards grow — overlap is impossible by construction.
      // Bodies never move, so the pile stays perfectly calm.
      lensA += (((mousePos && !opened) ? 1 : 0) - lensA) * 0.14;
      for (const c of cards) {
        const b = c.body;
        const v = lensView(c);
        // bigger phones stack visually on top, the opened one above all
        c.el.style.zIndex =
          c === opened ? 30 :
          b === draggedBody ? 20 : Math.round(v.s * 10);
        c.el.style.transform =
          `translate(${(v.x - c.w / 2).toFixed(2)}px, ${(v.y - c.h / 2).toFixed(2)}px) ` +
          `rotate(${b.angle.toFixed(4)}rad) scale(${v.s.toFixed(4)})`;
      }
      requestAnimationFrame(step);
    }

    // the fisheye follows the pointer
    addEventListener('mousemove', e => { mousePos = { x: e.clientX, y: e.clientY }; });
    document.documentElement.addEventListener('mouseleave', () => { mousePos = null; });

    addEventListener('keydown', e => {
      if (e.key === 'Escape' && opened) close(opened);
    });

    // a resize moves the walls and wakes the pile so it re-settles
    addEventListener('resize', () => {
      if (!engine) return;
      makeWalls(innerWidth, innerHeight, !!opened);
      for (const c of cards) Sleeping.set(c.body, false);
    });
  })();
  </script>
</body>
</html>
