<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Saving an overlapping repeat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face { font-family: "Cereal"; src: url(/multi/Font_Cereal/AirbnbCerealVF_Wght.ttf) format("truetype"); font-weight: 100 900; }
body { margin: 0; }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #222222; font-family: Cereal, 'Helvetica Neue', sans-serif; position: relative; overflow: hidden;">
  <div style="padding: 60px 16px 0; display: flex; flex-direction: column; gap: 16px; opacity: 0.45;">
    <h1 style="margin: 0; padding: 0 8px; font-size: 32px; font-weight: 600;">November</h1>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px;">
      <sc-for list="{{cells}}" as="c" hint-placeholder-count="14">
        <div style="{{c.style}}"><span style="font-size: 14px; font-weight: 600;">{{c.day}}</span><span style="font-size: 12px;">{{c.price}}</span></div>
      </sc-for>
    </div>
  </div>
  <div style="position: absolute; left: 8px; right: 8px; bottom: 8px; height: 560px; border-radius: 36px; background: #222222; color: #FFFFFF; box-sizing: border-box; padding: 28px 20px 20px; display: flex; flex-direction: column; gap: 18px;">
    <div style="display: flex; flex-direction: column; gap: 4px; text-align: center;">
      <span style="font-size: 13px; color: #B0B0B0;">Repeat settings</span>
      <span style="font-size: 20px; font-weight: 600;">Save as</span>
    </div>
    <label for="rname" style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 16px; background: rgba(255,255,255,0.07);">
      <span style="font-size: 12px; color: #B0B0B0;">Name</span>
      <input id="rname" value="Thanksgiving week" style="border: 0; background: transparent; color: #FFFFFF; font: 500 17px Cereal, sans-serif; padding: 0; outline: none;">
    </label>
    <div style="display: flex; gap: 12px; justify-content: center;">
      <sc-for list="{{swatches}}" as="s" hint-placeholder-count="7">
        <span style="{{s.style}}"></span>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; padding: 0 4px;">
      <span style="font-size: 15px; font-weight: 500;">Every year · Nov 23 – 29</span>
      <span style="font-size: 14px; color: #B0B0B0;">+30% price · 1 listing</span>
    </div>
    <div style="display: flex; gap: 12px; padding: 14px 16px; border-radius: 16px; background: rgba(255,255,255,0.07); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);">
      <span style="width: 10px; height: 10px; border-radius: 5px; background: #F09A55; margin-top: 5px; flex: none;"></span>
      <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;">
        <span style="font-size: 15px; font-weight: 500;">Overlaps Fall foliage on 7 nights</span>
        <span style="font-size: 14px; line-height: 19px; color: #C8C8C8;">Thanksgiving week wins there because it's shorter.</span>
        <button style="align-self: flex-start; border: 0; background: transparent; color: #FFFFFF; padding: 4px 0; font: 600 14px Cereal, sans-serif; text-decoration: underline; text-underline-offset: 3px;">Use Fall foliage instead</button>
      </div>
    </div>
    <div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between;">
      <button aria-label="Back" style="width: 48px; height: 48px; border-radius: 24px; border: 0; background: rgba(255,255,255,0.14); display: grid; place-items: center;">
        <svg width="12" height="12" viewBox="0 0 12 12"><path d="M8 1L3 6l5 5" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </button>
      <button style="height: 52px; padding: 0 36px; border-radius: 26px; border: 0; background: #FFFFFF; color: #222222; font: 600 17px Cereal, sans-serif;">Save</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var base = 'height: 62px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; box-sizing: border-box;';
    var cells = [];
    for (var d = 22; d <= 35; d++) {
      if (d > 30) { cells.push({ day: '', price: '', style: base }); continue; }
      var wd = (d - 1) % 7, normal = (wd === 0 || wd === 5 || wd === 6) ? 429 : 390;
      var sel = d >= 23 && d <= 29;
      cells.push({ day: String(d), price: '$' + Math.round(normal * (sel ? 1.3 : 1.15)), style: base + (sel ? ' background: #222222; color: #FFFFFF;' : ' background: #FCEBDD;') });
    }
    var colors = ['#7E4AA6', '#D9692A', '#2F7DBF', '#1F8A5E', '#C2306B', '#8A7A2E', '#5C5C5C'];
    var swatches = colors.map(function (c, i) { return { style: 'width: 26px; height: 26px; border-radius: 13px; background: ' + c + ';' + (i === 0 ? ' box-shadow: 0 0 0 2px #222222, 0 0 0 4px #FFFFFF;' : '') }; });
    return { cells: cells, swatches: swatches };
  }
}
</script>
</body>
</html>
