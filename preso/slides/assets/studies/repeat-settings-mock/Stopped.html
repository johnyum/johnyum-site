<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>After stopping Thanksgiving week</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face { font-family: "Cereal"; src: url(/multi/Font_Cereal/AirbnbCerealVF_Wght.ttf) format("truetype"); font-weight: 100 900; }
body { margin: 0; }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #222222; font-family: Cereal, 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; padding: 60px 16px 24px; gap: 16px; position: relative; overflow: hidden;">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 8px;">
    <h1 style="margin: 0; font-size: 32px; font-weight: 600;">November</h1>
    <button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 0; background: #F7F7F7; font: 500 15px Cereal, sans-serif; color: #222222;">Today</button>
  </div>
  <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; font-size: 11px; color: #6A6A6A; text-align: center;">
    <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px;">
    <sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
      <div style="{{c.style}}">
        <span style="font-size: 14px; font-weight: 600;">{{c.day}}</span>
        <span style="font-size: 12px; font-variant-numeric: tabular-nums;">{{c.price}}</span>
      </div>
    </sc-for>
  </div>
  <div style="display: flex; align-items: center; gap: 12px; padding: 0 8px; font-size: 13px; color: #6A6A6A;">
    <span style="width: 14px; height: 14px; border-radius: 4px; background: #FCEBDD; box-shadow: inset 0 0 0 1.5px #D9692A; flex: none;"></span>
    <span>Fall foliage · +15% · now on all 92 nights</span>
  </div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 32px; display: flex; align-items: center; gap: 12px; padding: 14px 16px 14px 20px; border-radius: 20px; background: #222222; color: #FFFFFF; box-shadow: 0 12px 30px rgba(0,0,0,0.22);">
    <div style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0;">
      <span style="font-size: 15px; font-weight: 500;">Stopped Thanksgiving week</span>
      <span style="font-size: 13px; color: #C8C8C8;">Fall foliage applies to Nov 23 – 29 again</span>
    </div>
    <button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 0; background: rgba(255,255,255,0.14); color: #FFFFFF; font: 600 14px Cereal, sans-serif;">Undo</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var base = 'height: 62px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; box-sizing: border-box;';
    var cells = [];
    for (var d = 1; d <= 35; d++) {
      if (d > 30) { cells.push({ day: '', price: '', style: base }); continue; }
      var wd = (d - 1) % 7, normal = (wd === 0 || wd === 5 || wd === 6) ? 429 : 390;
      var back = d >= 23 && d <= 29;
      cells.push({ day: String(d), price: '$' + Math.round(normal * 1.15), style: base + ' background: #FCEBDD;' + (back ? ' box-shadow: inset 0 0 0 1.5px #D9692A;' : ' box-shadow: inset 0 0 0 1px #F0C3A0;') });
    }
    return { cells: cells };
  }
}
</script>
</body>
</html>
