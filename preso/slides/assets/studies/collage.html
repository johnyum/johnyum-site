<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The experiments</title>
<!-- THE COLLAGE (John, 2026-10-07: "one page, like a collage of these experiments — the calendar cell animations put closer
     together, then right of it the fluid graph studies, the repeat settings studies and the demand-driving event studies").
     Not pages in windows: the PIECES, live, pulled close. Each study is still its own page in an iframe (same origin), but on load
     a stylesheet is dropped into it that pulls the spacing closer and sizes the big rigs to their column — THE PAGE'S OWN UI STAYS
     (John: "make it look more like the original HTML you built for me": titles, section heads, descriptions, controls, Replay
     buttons) — and the frame is sized to the page, so nothing scrolls inside. The cell animations are replayed on a loop so the
     left is never still. One board, three columns: the cells; the graph studies; the Repeat screens over the event cards. Scaled
     to fit whatever shows it, no border round it. -->
<style>
  html, body { margin: 0; background: #fff; }
  html { overflow-x: hidden; }
  #board { position: absolute; left: 0; top: 0; transform-origin: 0 0; transition: transform .8s cubic-bezier(.22,1,.36,1); }
  #lane { position: absolute; left: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  #lane::-webkit-scrollbar { display: none; }
  #strip { position: relative; transform-origin: 0 0; }
  .blk { position: absolute; }
  .blk iframe { display: block; border: 0; background: #fff; }
  .build .shot { position: relative; overflow: hidden; border-radius: 14px; box-shadow: 0 0 0 1px rgba(0,0,0,.08); background: #fff; }
  .build .shot iframe { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .build .cap { margin-top: 8px; font: 12px/1.3 'IBM Plex Mono', ui-monospace, monospace; color: #717171; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @font-face { font-family: 'IBM Plex Mono'; src: url(/preso/fonts/IBMPlexMono-Regular.woff2) format('woff2'); }
</style>
</head>
<body>
<div id="board"></div>
<div id="lane"><div id="strip"></div></div>
<script>
(() => {
  const V = '2026-10-07m';   // bump when a study page changes: the frames are fetched with it, so the browser can't hand back an old copy
  const GAP = 56, BW = 2700;   // ONE SPACE (John, 2026-10-07: "the same spacing between as the padding on the edges"): the board's side padding and the gaps between panels are the same value, scaled together   // three columns across (John, 2026-10-07: back to the board that fitted the stage, each piece ~30% bigger — so the top runs a little past one screen and scrolls; the builds a single row beneath, panning)
  // THE ORIGINAL UI STAYS (John, 2026-10-07: "make it look more like the original HTML you built for me"): each page keeps its
  // titles, section heads, descriptions, controls and buttons — the stylesheet dropped in only pulls the spacing closer and
  // sizes the big rigs to their column. Rows: the cells beside the graph studies; the Repeat screens; the event cards.
  // ONE TYPE SCALE (John, 2026-10-07: "make sure all the content is perfectly top aligned and consistent typography"): for the
  // three pages of the second screen the same rules, in board px over the page's zoom — Cereal throughout, the h1 at 24/1.15 with
  // no padding above it, the sub at 13, section heads at 16, captions at 12 — so their tops and their type line up
  const TYPE = (z) => `
        body { padding: 0 !important; font-family: 'Cereal', -apple-system, sans-serif !important; }
        .wrap, .page { padding: 0 !important; max-width: none !important; margin: 0 !important; }
        h1 { font: 600 ${(24 / z).toFixed(2)}px/1.15 'Cereal', sans-serif !important; letter-spacing: 0 !important; margin: 0 0 ${(8 / z).toFixed(2)}px !important; }
        .sub, .lede, .sec-note, body > p { font-size: ${(13 / z).toFixed(2)}px !important; line-height: 1.45 !important; color: #6A6A6A !important; margin: 0 0 ${(20 / z).toFixed(2)}px !important; max-width: none !important; }
        h2, .sec-h h2, .concept h2 { font: 600 ${(16 / z).toFixed(2)}px/1.2 'Cereal', sans-serif !important; margin: 0 0 ${(6 / z).toFixed(2)}px !important; }
        .sec-h .num { font-size: ${(11 / z).toFixed(2)}px !important; }
        figcaption, .tcap, .cap, .pill-lbl, .col-lbl { font: 500 ${(12 / z).toFixed(2)}px/1.3 'Cereal', sans-serif !important; color: #6A6A6A !important; }`;
  const BLOCKS = [
    // THE SQUIGGLY DATES (John, 2026-10-07: "take all the squiggly date studies and move them into calendar cell animation —
    // the same grid, all their animations first"): 00-squiggly-dates.html, the cell-system page's opportunity cells alone (its own
    // code, so every ring and reel keeps its keyframes; replayed by cloning every 3.2s), four across, stacked above the cells page
    { id: 'squig', src: '00-squiggly-dates.html', w: 880, css: `
        html, body { background: #fff !important; }
        body { padding: 8px 0 0 !important; zoom: .735; }
        .wrap { max-width: none !important; padding: 0 !important; }
        h1 { display: none !important; }   /* the cells page above carries the title now */
        .sqh { margin-top: 0 !important; }
        .sqrow:nth-child(n+3) { display: none !important; }   /* the first two rows only — A Raise and B Last-minute (John, 2026-10-07: "remove the last two rows of squiggly") */` },
    { id: 'cells', src: '01-cell-animations.html', w: 880, css: `
        body { padding: 0 !important; zoom: .735; }
        h1 { font: 600 32.65px/1.15 'Cereal', sans-serif !important; letter-spacing: 0 !important; margin: 0 0 10.9px !important; }   /* 24 board-px, Cereal 600 — one header across the six (John) */
        .lede { margin-bottom: 10px !important; } .toolbar { margin-bottom: 14px !important; }   /* 1.3 → .98 → .735: twice "25% smaller" (John, 2026-10-07); the grid still runs edge to edge, so only the type and the cells shrink */
        h1 { font-size: 32.7px !important; font-weight: 600 !important; margin-bottom: 2px !important; }   /* 24 board-px: one header size across the board (John) */
        .lede { margin-bottom: 10px !important; }
        .toolbar { margin-bottom: 14px !important; }
        h2 { margin: 0 0 2px !important; padding-top: 0 !important; border-top: 0 !important; }
        /* A PROPER GRID (John, 2026-10-07: "make the width of the cells consistent — the 4-up edge to edge with the date cell in it,
           the rest on a proper grid structure"): one four-column grid across the page; each heading a full-width row; every demo one
           cell of it, its stage the cell's full width; the wide one (the shimmer sweep, six dates) across the whole row */
        .flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-flow: dense; gap: 22px 14px; margin-top: 8px; align-items: start; }
        /* SECTIONS PACK (John, 2026-10-07: "put more on each row — 3, then 2 to the right"): a section spans as many of the four
           columns as it has demos (the wide one all four) and sits in the same grid, dense, so a one-demo section slots in beside a
           three-demo one; its heading sits over its own demos */
        .flow section { display: grid; grid-template-columns: repeat(var(--n, 1), minmax(0, 1fr)); grid-column: span var(--n, 1); gap: 10px 14px; min-width: 0; }
        .flow section h2 { grid-column: 1 / -1; margin: 0 !important; }
        .row { display: contents !important; }
        .demo { width: auto !important; min-width: 0; }
        .demo .stage { width: 100% !important; }
        .demo.wide { grid-column: 1 / -1; } .demo.wide .stage { width: 100% !important; }`,
      loop: 3200,   // continuously animating (John): every demo replayed as soon as its last run is done, staggered, so something is always moving
      // the page is nine headings each over a row: wrapped into sections that flow side by side (John: closer together)
      shape: (d) => { const flow = d.createElement('div'); flow.className = 'flow'; const hs = [...d.querySelectorAll('h2')]; if (!hs.length) return; hs[0].parentNode.insertBefore(flow, hs[0]); for (const h of hs) { const sec = d.createElement('section'); const row = h.nextElementSibling; sec.append(h); if (row && row.classList.contains('row')) sec.append(row); const n = row ? Math.min(4, [...row.querySelectorAll('.demo')].reduce((a, x) => a + (x.classList.contains('wide') ? 4 : 1), 0)) || 1 : 1; sec.style.setProperty('--n', n); flow.append(sec); } } },
    // THE QUICK ACTIONS (John, 2026-10-07: "find the studies for the zig zag pills and quick actions" — the zigzag pills are the
    // graph page's study 01, straight line + pills; the quick actions are this page's Modal lifecycle: the floating pill through a
    // whole session, idle → scanning → results → applying → applied, and the result pills). Under the cells, where the column has room
    { id: 'cellsys', src: '03-cell-system.html', w: 880, css: TYPE(.72) + `
        html, body { background: #fff !important; }
        body { zoom: .72; }
        .opp .cells-col, .core .ring-dot { display: none !important; }   /* the squiggly cells moved to the cell page (John): the modal, chip and decisions stay */
        /* THE PILLS, WIDER AND EQUAL (John, 2026-10-07): every quick-action pill one width — flex, full width of the column up to
           760 — its body stretching so the buttons sit at one place on every pill; the scanning circle stays a circle */
        .pill:not(.circle) { display: flex !important; width: 100% !important; max-width: 760px; box-sizing: border-box; }
        .pill:not(.circle) .body { flex: 1 1 auto; min-width: 0; }
        .pill.circle .wand, .pill.circle svg { width: 30px !important; height: 30px !important; }   /* the scanning circle's wand sized to sit inside it, not fill it (John) */`,
      // the Modal lifecycle (the quick-action pill through a session) first (John, 2026-10-07: "move up the modal lifecycle to the top")
      // …and the Default cells section removed (John: "remove the default cells")
      shape: (d) => { const h = [...d.querySelectorAll('h2, h3, .sec-h')].find((x) => /modal lifecycle/i.test(x.textContent)); if (!h) return; const sec = h.closest('.section, section') || h.parentElement; const first = [...d.querySelectorAll('.section, section')].find((x) => x !== sec && !x.contains(sec)); if (sec && first && first.parentElement === sec.parentElement) sec.parentElement.insertBefore(sec, first);
        const dh = [...d.querySelectorAll('h2')].find((x) => /default cells/i.test(x.textContent)); const ds = dh && (dh.closest('.section, section') || dh.parentElement); if (ds) ds.remove(); } },
    { id: 'graph', src: '02-graph-studies.html', w: 880, css: `
        html, body { background: #fff !important; }   /* the page's own grey-100 was the scrim behind the header (John) */
        body { zoom: .86; }
        .page { max-width: none !important; padding: 0 !important; }
        .page > h1 { font: 600 27.9px/1.15 'Cereal', sans-serif !important; letter-spacing: 0 !important; margin: 0 0 9.3px !important; }
        .page > .sub { margin-bottom: 14px !important; font-size: 13px !important; }
        .controls { position: static !important; margin-bottom: 16px !important; padding: 0 !important; gap: 14px 18px !important; background: transparent !important; border: 0 !important; border-radius: 0 !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; box-shadow: none !important; }   /* no grey panel behind the controls (John) */
        .study { padding: 16px 18px 16px !important; margin-bottom: 14px !important; }
        .study-desc { font-size: 12px !important; }
        .stage { overflow: hidden !important; zoom: .58; }
        .hero-wrap svg { max-height: 340px; }`,
      // THE PLAY (John, 2026-10-07: "all the bells and whistles that can be playing, play it — for the grid play the first slider
      // start to finish slowly, like 5 seconds, and land there"): the waviness slider run from its minimum to its maximum over
      // five seconds, eased, each step dispatched as the page's own input event so every graph follows; it stays at the end
      play: (d, w) => { const r = d.getElementById('rngAmp'); if (!r) return; const lo = +r.min, hi = +r.max, t0 = performance.now(), T = 5000; r.value = lo; r.dispatchEvent(new w.Event('input', { bubbles: true }));
        const step = (t) => { const k = Math.min(1, (t - t0) / T), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; r.value = Math.round(lo + (hi - lo) * e); r.dispatchEvent(new w.Event('input', { bubbles: true })); if (k < 1) w.requestAnimationFrame(step); }; setTimeout(() => w.requestAnimationFrame(step), 1200); } },
    { id: 'repeat', src: '07-repeat-settings-mock.html', w: 880, css: TYPE(1) + `
        body { background: #fff !important; }
        .row { gap: 12px !important; padding: 0 !important; overflow: visible !important; }
        h2 { margin: 18px 0 10px !important; }
        figure { width: 166px; }
        figcaption { margin-bottom: 8px !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        iframe { width: 390px !important; height: 844px !important; transform: scale(.42); transform-origin: 0 0; margin-bottom: calc(-844px * .58); margin-right: calc(-390px * .58); border-radius: 36px !important; box-shadow: 0 4px 16px rgba(0,0,0,.08) !important; }` },
    // THE SIXTH (John, 2026-10-07: "choose one of the studies that's most interesting that's not one of these"; the chat-to-dates
    // motion was tried and "sucks"): the tip cards — six phone takes on how the chat can serve a tip
    { id: 'tips', src: '04-tip-cards.html', w: 880, css: TYPE(.72) + `
        html, body { background: #fff !important; }
        body { zoom: .72; }` },
    { id: 'events', src: 'proto/event_gallery.html', w: 880, css: `
        body { padding: 0 !important; background: #fff !important; zoom: .8; }
        h1 { font: 600 30px/1.15 'Cereal', sans-serif !important; letter-spacing: 0 !important; margin: 0 0 10px !important; }
        h2 { margin: 14px 0 8px !important; }
        .grid { grid-template-columns: repeat(4, 1fr) !important; gap: 8px !important; }
        .card { padding: 8px 10px !important; gap: 10px !important; border-radius: 12px !important; }
        .card:hover { transform: none !important; }
        .icons, .ic { width: 48px !important; height: 48px !important; flex-basis: 48px !important; }
        .sec { width: 22px !important; height: 22px !important; }
        .nm { font-size: 13px !important; } .dt { font-size: 11.5px !important; }` },
  ];
  // SIX-UP, THREE IN VIEW (John, 2026-10-07: "each in its own row, six across; I can only see three, and when I tap next the first
  // three animate left and the next three animate in — a single unit of six"): one strip of six panels, each a page in its own
  // column of 880; the stage shows three; a step slides the strip by three, eased
  const ORDER = [['cells', 'squig'], ['graph'], ['events'], ['cellsys'], ['repeat'], ['tips']], PW = 880, VIEW = 3;   // the Seasonality graph in the middle, the clay icons third (John, 2026-10-07: "put clay icon back and bring seasonality back to middle")   // the clay icons second, the Seasonality graph third (John, 2026-10-07: "switch seasonality graph and icons")   // the clay icons third, the Quick Action System fourth (John, 2026-10-07: "switch quick actions with the clay icons")   // the squigglies at the bottom of the cell panel (John, 2026-10-07: "at the bottom, not the top")   // the events fourth (John) — the first of the second three   // a panel is a column of one or more pages
  // THE BUILDS (John, 2026-10-07: "more builds — the zig zag line build, the quick actions row build — and whatever more calendar
  // prototype versions I made"): rows of the whole builds, live, nothing injected but a line that hides the prototype's welcome
  // card and dev bar — the first calendar rebuilt from Figma (June, its quick-actions sheet); thirteen versions of /multi from its
  // git history, July 2 to October 3 (proto/builds/multi-<date>.html, their fonts and art pointed at /multi/); /multi2, the
  // collaborative build; the squiggly-line states (the dev bar's Wavy / Animated / Filled indicator styles, switched on after
  // load); the wide quick-action pill (a cell tapped after load, so the pill is up); and the web app with the quick-actions row
  // and Repeat (/recurrence, ?preso=1). Captioned with the date and the commit's own words.
  const QUIET = '#welcomeOverlay, .welcome-overlay, .dev-bar { display: none !important; }';
  // the later builds boot off the welcome card's Get started (it picks the host and draws the board) — so it's pressed, not just hidden
  const calm = (d) => { try { const ov = d.getElementById('welcomeOverlay'); if (ov) { const go = [...ov.querySelectorAll('button')].find((b) => /get started|start|continue|ok/i.test(b.innerText)); if (go) go.click(); setTimeout(() => ov.remove(), 900); }
    // the builds from July 29 on open on their Today tab: the Calendar tab is pressed so the board shows
    setTimeout(() => { const cal = [...d.querySelectorAll('button, a, [role="tab"], .tab, .nav-item')].find((x) => x.innerText && x.innerText.trim() === 'Calendar' && x.getBoundingClientRect().width > 0); if (cal) cal.click(); }, 700); } catch (_) {} };
  const tips = (d) => { const b = [...d.querySelectorAll('#magicPill button, #magicAction button, .magic-pill button')].find((x) => /show tips|^tips|opportunit/i.test(x.innerText)); if (b) b.click(); };
  const style = (d, which) => { calm(d); setTimeout(() => tips(d), 1600); setTimeout(() => { const b = d.querySelector(`.ind-opt[data-ind="${which}"]`); if (b) b.click(); if (which === 'default') { const f = [...d.querySelectorAll('.dev-bar button')].find((x) => /filled/i.test(x.innerText)); if (f && d.body.classList.contains('ind-filled')) f.click(); } }, 3400); };
  const tapCell = (d, w) => { calm(d); setTimeout(() => tap(d, w), 1600); };
  const tap = (d, w) => { const cards = [...d.querySelectorAll('#gridRows .price-card')].filter((c) => !/booked|blocked|past/.test(c.className)); const c = cards[6] || cards[0]; if (!c) return; const r = c.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2; for (const t of ['pointerdown', 'mousedown', 'pointerup', 'mouseup', 'click']) c.dispatchEvent(new w.PointerEvent(t, { bubbles: true, cancelable: true, pointerId: 1, pointerType: 'mouse', isPrimary: true, clientX: x, clientY: y, button: 0, buttons: t.endsWith('down') ? 1 : 0 })); try { w.renderMagicPill(); } catch (_) {} };
  const M = (date, cap, extra) => ({ src: `proto/builds/multi-${date}.html`, W: 1600, H: 900, s: .52, cap: `${date} · ${cap}`, css: QUIET, after: (d) => calm(d), ...extra });
  const BUILDS = [
    { src: '/calendar.html', W: 430, H: 932, s: .5, cap: '2026-06-12 · the first calendar, rebuilt from Figma — its quick-actions sheet' },
    M('2026-07-02', 'the first deploy of the multi-host calendar'), M('2026-07-03', 'small / medium / pro hosts, the Opportunities optimizer'), M('2026-07-05', 'opportunity cards with the $ upside'),
    M('2026-07-07', 'the board returns quietly — the rings before the wavy line'), M('2026-07-09', 'the price reel rolls down'), M('2026-07-12', 'the Kyber build intaken'),
    M('2026-07-14', 'the airchat build — settings, search, the on/off toggle'), M('2026-07-19', 'the dev redesign — the ⋯ menu, Bookings, tips when grouped'), M('2026-07-29', 'the new build, with its icons'),
    M('2026-07-29', 'the squiggly line — the Wavy indicator', { after: (d) => style(d, 'wavy') }), M('2026-07-29', 'the Animated indicator', { after: (d) => style(d, 'animated') }), M('2026-07-29', 'the Default indicator — the ring, unfilled', { after: (d) => style(d, 'default') }),
    M('2026-08-11', 'the August build'), M('2026-09-09', 'the Aug 19 build — Messages, the guest-pill asks'),
    { src: '/multi2/', W: 1600, H: 900, s: .52, cap: '2026-09-08 · the collaborative build (/multi2)', css: QUIET, after: (d) => calm(d) },
    M('2026-09-20', 'a calendar-only variant, one uplift format'), M('2026-10-03', 'today — the wide quick-action pill, a cell tapped', { after: (d, w) => tapCell(d, w) }),
    { src: '/recurrence/?preso=1', W: 430, H: 932, s: .5, cap: '2026-10 · the web app — the quick-actions row and Repeat (/recurrence)' },
  ];
  const SHOW_BUILDS = false;   // HELD (John, 2026-10-07: "hold on the calendars for now — just the studies"): the builds row stays in the code and on disk, off
  const board = document.getElementById('board'), strip = document.getElementById('strip'), lane = document.getElementById('lane');
  const builds = (SHOW_BUILDS ? BUILDS : []).map((b) => {
    const el = document.createElement('div'); el.className = 'blk build'; const w = Math.round(b.W * b.s), h = Math.round(b.H * b.s);
    el.innerHTML = `<div class="shot" style="width:${w}px;height:${h}px"><iframe src="${b.src}" title="${b.cap}" loading="lazy" style="width:${b.W}px;height:${b.H}px;transform:scale(${b.s})"></iframe></div><div class="cap">${b.cap}</div>`;
    strip.append(el);
    el.querySelector('iframe').addEventListener('load', (e) => { try { const d = e.target.contentDocument, win = e.target.contentWindow; if (b.css) { const st = d.createElement('style'); st.textContent = b.css; d.head.append(st); } if (b.after) setTimeout(() => b.after(d, win), 1800); } catch (_) {} });
    return { ...b, el, w, h: h + 28 };
  });
  const frames = BLOCKS.map((b) => {
    const el = document.createElement('div'); el.className = 'blk'; el.id = 'blk-' + b.id;
    el.innerHTML = `<iframe src="${b.src}?v=${V}" title="${b.id}" scrolling="no" style="width:${b.w}px;height:200px"></iframe>`;   // versioned, so a retitled study isn't served from cache
    board.append(el); b.el = el; b.frame = el.querySelector('iframe'); b.h = 200;
    b.frame.addEventListener('load', () => {
      const d = b.frame.contentDocument; const st = d.createElement('style'); st.textContent = b.css; d.head.append(st);
      if (b.shape) b.shape(d);
      d.documentElement.style.overflow = 'hidden'; d.body.style.overflow = 'hidden';
      // the page's own height, re-read a few times while its fonts and pictures land
      const measure = () => { const h = Math.ceil(d.documentElement.scrollHeight); if (h !== b.h) { b.h = h; b.frame.style.height = h + 'px'; layout(); } };
      [50, 300, 800, 1600, 3000].forEach((t) => setTimeout(measure, t));
      if (b.play) setTimeout(() => b.play(d, b.frame.contentWindow), 1500);
      if (b.loop) { const replay = () => { const bs = [...d.querySelectorAll('.demo .replay')]; bs.forEach((x, i) => setTimeout(() => x.click(), i * 90)); }; setTimeout(replay, 1200); setInterval(replay, b.loop); }
    });
    return b;
  });
  // the six in one row, top-aligned; the board scaled so three panels fill the viewport's width; its height the tallest panel's
  // (the page scrolls); the step slides the whole strip
  let step = 0;
  const layout = () => {
    let x = GAP, H = 0;
    for (const col of ORDER) { let y = 0; for (const id of col) { const b = frames.find((f) => f.id === id); b.el.style.left = x + 'px'; b.el.style.top = y + 'px'; y += b.h + GAP; } x += PW + GAP; H = Math.max(H, y - GAP); }
    const W = x, VW = VIEW * PW + (VIEW + 1) * GAP, s = innerWidth / VW, dx = step * VIEW * (PW + GAP);   // the edge padding is a gap too
    board.style.width = W + 'px'; board.style.height = H + 'px'; board.style.transform = `scale(${s.toFixed(4)}) translateX(${-dx}px)`;
    let bx = 0, bh = 0; for (const b of builds) { b.el.style.left = bx + 'px'; b.el.style.top = '0px'; bx += b.w + GAP; bh = Math.max(bh, b.h); }
    strip.style.width = (bx - GAP) + 'px'; strip.style.height = bh + 'px'; strip.style.transform = `scale(${s.toFixed(4)})`;
    lane.style.display = builds.length ? '' : 'none';
    lane.style.top = Math.ceil(H * s + GAP * s) + 'px'; lane.style.height = Math.ceil(bh * s) + 'px'; lane.style.width = Math.ceil((bx - GAP) * s) + 'px';
    document.body.style.height = Math.ceil((H + (builds.length ? GAP + bh : 0)) * s) + 'px';
  };
  const STEPS = Math.ceil(ORDER.length / VIEW);
  window.__collage = {
    steps: STEPS, state: () => step,
    go: (n, instant) => { const to = Math.max(0, Math.min(STEPS - 1, n | 0)); if (to === step && !instant) return false; step = to; if (instant) { board.style.transition = 'none'; layout(); requestAnimationFrame(() => board.style.transition = ''); } else layout(); return true; },
  };
  // the pan: the strip drifts left at a walking pace, back to the start when it reaches the end; a hand on it stops it
  let hold = false; lane.addEventListener('pointerenter', () => hold = true); lane.addEventListener('pointerleave', () => hold = false);
  const pan = () => { if (!hold) { const max = lane.scrollWidth - lane.clientWidth; lane.scrollLeft = lane.scrollLeft >= max - 1 ? 0 : lane.scrollLeft + 0.6; } requestAnimationFrame(pan); };
  requestAnimationFrame(pan);
  layout(); addEventListener('resize', layout);
})();
</script>
</body>
</html>
