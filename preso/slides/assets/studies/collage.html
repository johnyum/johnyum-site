<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The experiments</title>
<!-- THE COLLAGE (John, 2026-10-07: "one page, like a collage of these experiments — the calendar cell animations put closer
     together, then right of it the fluid graph studies, the repeat settings studies and the demand-driving event studies").
     Not pages in windows: the PIECES, live, pulled close. Each study is still its own page in an iframe (same origin), but on load
     a stylesheet is dropped into it that pulls the spacing closer and sizes the big rigs to their column — THE PAGE'S OWN UI STAYS
     (John: "make it look more like the original HTML you built for me": titles, section heads, descriptions, controls, Replay
     buttons) — and the frame is sized to the page, so nothing scrolls inside. The cell animations are replayed on a loop so the
     left is never still. One board, three columns: the cells; the graph studies; the Repeat screens over the event cards. Scaled
     to fit whatever shows it, no border round it. -->
<style>
  html, body { margin: 0; background: #fff; overflow: hidden; height: 100%; }
  #board { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .blk { position: absolute; }
  .blk iframe { display: block; border: 0; background: #fff; }
  @font-face { font-family: 'IBM Plex Mono'; src: url(/preso/fonts/IBMPlexMono-Regular.woff2) format('woff2'); }
</style>
</head>
<body>
<div id="board"></div>
<script>
(() => {
  const GAP = 40;
  // THE ORIGINAL UI STAYS (John, 2026-10-07: "make it look more like the original HTML you built for me"): each page keeps its
  // titles, section heads, descriptions, controls and buttons — the stylesheet dropped in only pulls the spacing closer and
  // sizes the big rigs to their column. Three columns: the cells; the graph studies; the Repeat screens over the event cards.
  const BLOCKS = [
    { id: 'cells', src: '01-cell-animations.html', w: 820, col: 0, css: `
        body { padding: 8px 0 0 !important; }
        h1 { font-size: 22px !important; margin-bottom: 2px !important; }
        .lede { margin-bottom: 10px !important; }
        .toolbar { margin-bottom: 14px !important; }
        h2 { margin: 0 0 2px !important; padding-top: 0 !important; border-top: 0 !important; }
        .row { margin-top: 10px !important; gap: 16px 14px !important; }
        .flow { display: flex; flex-wrap: wrap; gap: 26px 32px; align-items: flex-start; margin-top: 8px; }
        .flow section { width: max-content; max-width: 100%; }`,
      loop: 8000,
      // the page is nine headings each over a row: wrapped into sections that flow side by side (John: closer together)
      shape: (d) => { const flow = d.createElement('div'); flow.className = 'flow'; const hs = [...d.querySelectorAll('h2')]; if (!hs.length) return; hs[0].parentNode.insertBefore(flow, hs[0]); for (const h of hs) { const sec = d.createElement('section'); const row = h.nextElementSibling; sec.append(h); if (row && row.classList.contains('row')) sec.append(row); flow.append(sec); } } },
    { id: 'graph', src: '02-graph-studies.html', w: 760, col: 1, css: `
        body { zoom: .88; }
        .page { max-width: none !important; padding: 8px 0 0 !important; }
        .page > h1 { font-size: 22px !important; }
        .page > .sub { margin-bottom: 14px !important; font-size: 13px !important; }
        .controls { position: static !important; margin-bottom: 16px !important; padding: 12px 16px !important; gap: 14px 18px !important; }
        .study { padding: 16px 18px 16px !important; margin-bottom: 14px !important; }
        .study-desc { font-size: 12px !important; }
        .stage { overflow: hidden !important; zoom: .56; }
        .hero-wrap svg { max-height: 340px; }` },
    { id: 'repeat', src: '07-repeat-settings-mock.html', w: 1000, col: 2, css: `
        body { padding: 8px 0 0 !important; background: #fff !important; }
        h1 { font-size: 22px !important; margin-bottom: 14px !important; }
        .row { gap: 14px !important; padding: 0 !important; overflow: visible !important; }
        figure { width: 188px; }
        figcaption { font-size: 11px !important; margin-bottom: 6px !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        iframe { width: 390px !important; height: 844px !important; transform: scale(.48); transform-origin: 0 0; margin-bottom: calc(-844px * .52); margin-right: calc(-390px * .52); border-radius: 36px !important; box-shadow: 0 4px 16px rgba(0,0,0,.08) !important; }` },
    { id: 'events', src: 'proto/event_gallery.html', w: 1000, col: 2, css: `
        body { padding: 8px 0 0 !important; background: #fff !important; zoom: .82; }
        h1 { font-size: 22px !important; }
        h2 { margin: 16px 0 8px !important; }
        .grid { grid-template-columns: repeat(4, 1fr) !important; gap: 8px !important; }
        .card { padding: 8px 10px !important; gap: 10px !important; border-radius: 12px !important; }
        .card:hover { transform: none !important; }
        .icons, .ic { width: 44px !important; height: 44px !important; flex-basis: 44px !important; }
        .sec { width: 20px !important; height: 20px !important; }
        .nm { font-size: 12.5px !important; } .dt { font-size: 11px !important; }` },
  ];
  const board = document.getElementById('board');
  const frames = BLOCKS.map((b) => {
    const el = document.createElement('div'); el.className = 'blk'; el.id = 'blk-' + b.id;
    el.innerHTML = `<iframe src="${b.src}" title="${b.id}" scrolling="no" style="width:${b.w}px;height:200px"></iframe>`;
    board.append(el); b.el = el; b.frame = el.querySelector('iframe'); b.h = 200;
    b.frame.addEventListener('load', () => {
      const d = b.frame.contentDocument; const st = d.createElement('style'); st.textContent = b.css; d.head.append(st);
      if (b.shape) b.shape(d);
      d.documentElement.style.overflow = 'hidden'; d.body.style.overflow = 'hidden';
      // the page's own height, re-read a few times while its fonts and pictures land
      const measure = () => { const h = Math.ceil(d.documentElement.scrollHeight); if (h !== b.h) { b.h = h; b.frame.style.height = h + 'px'; layout(); } };
      [50, 300, 800, 1600, 3000].forEach((t) => setTimeout(measure, t));
      if (b.loop) { const replay = () => { const bs = [...d.querySelectorAll('.demo .replay')]; bs.forEach((x, i) => setTimeout(() => x.click(), i * 90)); }; setTimeout(replay, 1200); setInterval(replay, b.loop); }
    });
    return b;
  });
  // three columns, each stacked top-down; the board as wide as the columns and as tall as the tallest, fitted to the viewport
  const layout = () => {
    const cols = [0, 1, 2].map((c) => frames.filter((b) => b.col === c));
    let x = 0, H = 0;
    for (const col of cols) { let y = 0; const w = Math.max(...col.map((b) => b.w)); for (const b of col) { b.el.style.left = x + 'px'; b.el.style.top = y + 'px'; y += b.h + GAP; } H = Math.max(H, y - GAP); x += w + GAP; }
    const W = x - GAP;
    board.style.width = W + 'px'; board.style.height = H + 'px';
    const s = Math.min(innerWidth / W, innerHeight / H);
    board.style.transform = `translate(${Math.round((innerWidth - W * s) / 2)}px, ${Math.round((innerHeight - H * s) / 2)}px) scale(${s.toFixed(4)})`;
  };
  layout(); addEventListener('resize', layout);
})();
</script>
</body>
</html>
