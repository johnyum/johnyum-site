<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The calendar's side studies</title>
<!-- EVERY SIDE STUDY ON ONE PAGE (John, 2026-10-07: "put ALL the side things into one huge HTML file — rows and rows of these
     studies next to each other, neatly placed by section"). Each study is THE PAGE ITSELF, live in a window scaled down to sit in a
     row (a desktop page at 560 wide, a phone at 215), scrolled and worked inside its window; the option sheets at the end are
     pictures. Calendar only (John, 2026-10-07: "remove anything not calendar related" — the Peek tests, the EOB, the fee email, the
     Claude icons compare and their option sheets came out). Sections in the order the work happened. Served from the site, so the icons, Cereal and the deck's mono come from
     where the site already keeps them (/multi/, /preso/fonts/). -->
<style>
  @font-face { font-family: 'IBM Plex Mono'; src: url(/preso/fonts/IBMPlexMono-Regular.woff2) format('woff2'); font-weight: 400; }
  html, body { margin: 0; background: #fff; }
  body { padding: 48px 64px 96px; font-family: 'IBM Plex Mono', ui-monospace, monospace; color: #111; }
  h1 { font-size: 12px; font-weight: 400; letter-spacing: .04em; text-transform: uppercase; color: #6b7280; margin: 0 0 8px; }
  .sec { margin: 56px 0 20px; padding-bottom: 10px; border-bottom: 1px solid #e5e7eb; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: #374151; display: flex; justify-content: space-between; }
  .sec span { color: #9ca3af; }
  .row { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
  .it { flex: none; }
  .win { position: relative; overflow: hidden; border-radius: 12px; box-shadow: 0 0 0 1px rgba(0,0,0,.08); background: #fff; }
  .win iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; background: #fff; }
  .win img { display: block; width: 100%; height: auto; }
  .cap { font-size: 11px; color: #6b7280; margin-top: 8px; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<h1>The calendar's side studies · everything built on the side, live</h1>
<script>
(() => {
  // a window: [kind, src, label] — kind sets the page's natural size and how wide it sits in the row
  const KIND = {
    page:  { W: 1200, H: 1000, w: 560 },   // a desktop study, 1200 wide as it was drawn, shown at 560 — scrolls inside
    wide:  { W: 1200, H: 1000, w: 1144 },  // the same, across the whole row
    phone: { W: 390,  H: 844,  w: 215 },   // a phone screen
    doc:   { W: 900,  H: 1160, w: 378 },   // a printed page
  };
  const SECTIONS = [
    ['Calendar studies', 'calendar-mocks · the models, the graph, the deck, the motion', [
      ['page', '01-cell-animations.html', 'cell animations · odometer, discount split, min nights, last-minute reel, apply, scan, select'],
      ['page', '02-graph-studies.html', 'opportunities graph · five models with live controls'],
      ['page', '03-cell-system.html', 'cell & opportunity system · every cell state, every modal'],
      ['page', '04-tip-cards.html', 'tip cards · six ways the chat can serve a tip'],
      ['page', '05-chat-to-dates-motion.html', 'chat to dates · seven motion pairs, now vs proposed'],
      ['page', '06-repeat-settings-review.html', 'repeat settings · the overlap review'],
    ]],
    ['Repeat settings · the mock', 'five screens', [
      ['phone', 'repeat-settings-mock/Main.html', '1 · the calendar: specific wins'],
      ['phone', 'repeat-settings-mock/Save.html', '2 · saving an overlapping repeat'],
      ['phone', 'repeat-settings-mock/Night.html', '3 · tapping a night'],
      ['phone', 'repeat-settings-mock/Settings.html', '4 · settings › repeat'],
      ['phone', 'repeat-settings-mock/Stopped.html', '5 · after stopping Thanksgiving week'],
    ]],
    ['The July prototype · icons and opportunities', 'Multi_Cal_Protototype · the review pages', [
      ['page', 'proto/event_gallery.html', 'event gallery · the demand-driving events as clay icons'],
      ['page', 'proto/icons_review.html', 'icon review · seasonal system, every candidate side by side'],
      ['page', 'proto/icons_matrix.html', 'icon matrix · one row per place, the seasons across'],
      ['page', 'proto/master_icons.html', 'master icons · the set as shipped'],
      ['page', 'proto/opps_modal_gallery.html', 'opportunity modals · price, min nights, last minute'],
      ['page', 'proto/pshot_preview.html', 'price-shot candidates · sun, thermometer, ice cream, popsicle'],
      ['page', 'proto/xmas_anim_preview.html', 'the Christmas tree · its animation'],
    ]],
    ['The iOS build · walkthrough', 'multi-host-calendar-ios', [
      ['wide', 'walkthrough/index.html', 'walkthrough · calendar, stay sheet, inbox, thread, today'],
    ]],
    ['Icon sheets', 'the pictures the icon decisions were made from', [
      ['img', 'sheets/iterations-sheet.webp', 'the iterations sheet', 378],
      ['img', 'sheets/holidays-sheet.webp', 'the holidays sheet', 560],
      ['img', 'sheets/proto-event-contact-sheet.webp', 'event icons · contact sheet', 560],
      ['img', 'sheets/proto-holiday-contact-sheet.webp', 'holiday icons · contact sheet', 560],
      ['img', 'sheets/proto-holiday-pairs.webp', 'holiday pairs', 378],
    ]],
  ];
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  let html = '';
  for (const [title, sub, items] of SECTIONS) {
    html += `<div class="sec">${esc(title)}<span>${esc(sub)}</span></div><div class="row">`;
    for (const it of items) {
      const [kind, src, label, w0] = it;
      if (kind === 'img') { html += `<div class="it" style="width:${w0}px"><div class="win"><img src="${src}" alt="" loading="lazy"></div><div class="cap">${esc(label)}</div></div>`; continue; }
      const k = KIND[kind], s = k.w / k.W, h = Math.round(k.H * s);
      html += `<div class="it" style="width:${k.w}px"><div class="win" style="width:${k.w}px;height:${h}px"><iframe src="${src}" title="${esc(label)}" loading="lazy" style="width:${k.W}px;height:${k.H}px;transform:scale(${s})"></iframe></div><div class="cap" title="${esc(label)}">${esc(label)}</div></div>`;
    }
    html += '</div>';
  }
  document.body.insertAdjacentHTML('beforeend', html);
})();
</script>
</body>
</html>
