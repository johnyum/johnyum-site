<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cell &amp; Opportunity System — Multi-Host Calendar</title>
<style>
@font-face { font-family:'Cereal'; src:url(/multi/Font_Cereal/AirbnbCerealVF_Wght.ttf) format('truetype'); font-weight:100 900; font-style:normal; }
:root{
  --grey-100:#F7F7F7; --grey-200:#EBEBEB; --grey-300:#DDDDDD; --grey-400:#C2C2C2; --grey-500:#B0B0B0;
  --grey-600:#8C8C8C; --grey-700:#717171; --ink:#222;
  --green:#038026; --green-700:#117C35; --green-wash:rgba(48,209,88,0.12); --green-chk:#30D158;
  --orange:#BE4900; --orange-wash:rgba(235,97,0,0.12); --orange-chk:#EB6100;
}
*{box-sizing:border-box;}
body{ margin:0; font-family:'Cereal',sans-serif; color:var(--ink); background:#F4F4F5; -webkit-font-smoothing:antialiased; }
.wrap{ max-width:1200px; margin:0 auto; padding:44px 36px 160px; }
h1{ font-size:32px; font-weight:600; margin:0 0 6px; letter-spacing:-.01em; }
.sub{ font-size:15px; color:var(--grey-700); line-height:1.55; margin:0; max-width:820px; }

/* ── top: core spec + colour legend, sticky so it's always readable ── */
.core{ position:sticky; top:0; z-index:20; margin:22px -36px 0; padding:16px 36px; background:rgba(244,244,245,.9);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--grey-300); display:flex; flex-wrap:wrap; gap:10px 26px; align-items:center; }
.core .grp{ display:flex; align-items:center; gap:9px; font-size:13px; }
.core .lbl{ font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--grey-600); margin-right:2px; }
.core .dot{ width:15px; height:15px; border-radius:5px; display:inline-block; flex-shrink:0; }
.core .ring-dot{ width:16px; height:16px; border:2px solid var(--grey-400); border-radius:5px; display:inline-block; }
.core b{ font-weight:600; }
.core .rule{ width:100%; font-size:12.5px; color:var(--grey-700); }
.core .rule b{ color:var(--ink); }

/* ── sections ── */
.section{ margin-top:44px; }
.sec-h{ display:flex; align-items:baseline; gap:12px; margin:0 0 4px; }
.sec-h h2{ font-size:19px; font-weight:600; margin:0; }
.sec-h .num{ font-size:13px; font-weight:700; color:var(--grey-500); }
.sec-note{ font-size:13.5px; color:var(--grey-700); margin:0 0 18px; max-width:840px; line-height:1.5; }

/* ── opportunity block: modal on the left, all cell states on the right ── */
.opp{ background:#fff; border:1px solid var(--grey-300); border-radius:20px; padding:22px 24px; margin-bottom:20px; }
.opp-top{ display:flex; align-items:center; gap:12px; margin-bottom:16px; }
.opp-top .name{ font-size:16px; font-weight:600; }
.chip{ font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; padding:3px 9px; border-radius:999px; }
.chip.green{ background:#E6F2E9; color:var(--green); } .chip.orange{ background:#FBEADD; color:var(--orange); }
.chip.grey{ background:var(--grey-200); color:var(--grey-700); }
.opp-top .playrow{ margin-left:auto; }
.opp-body{ display:grid; grid-template-columns:340px 1fr; gap:26px; align-items:start; }
@media(max-width:960px){ .opp-body{ grid-template-columns:1fr; } }
.modal-col .col-lbl, .cells-col .col-lbl{ font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--grey-600); margin:0 0 12px; }
.cells{ display:flex; flex-wrap:wrap; gap:20px; }

/* ── a cell tile: the cell on a stage + play button + caption ── */
.tile{ width:132px; cursor:pointer; }
.stage{ position:relative; height:118px; display:flex; align-items:center; justify-content:center;
  background:var(--grey-100); border-radius:16px; transition:outline .1s ease, background .1s ease; outline:2px solid transparent; outline-offset:2px; }
.tile:hover .stage{ outline-color:var(--grey-400); }
.tile:active .stage{ background:var(--grey-200); }
.tile.copied .stage{ outline-color:var(--green); }
.pill.copyable{ cursor:pointer; }
.pill.copied{ outline:2px solid var(--green-chk); outline-offset:3px; }
#_toast{ position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(10px); background:var(--ink); color:#fff;
  font-size:13px; font-weight:500; padding:10px 16px; border-radius:999px; opacity:0; pointer-events:none; z-index:100;
  transition:opacity .18s ease, transform .18s ease; box-shadow:0 6px 24px rgba(0,0,0,.25); }
#_toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
.tcap{ font-size:13px; font-weight:600; margin:10px 0 2px; }
.tspec{ font-size:12px; color:var(--grey-700); line-height:1.4; }
.tspec .k{ color:var(--ink); font-weight:500; }
.playall{ font-size:12px; font-weight:600; color:var(--ink); background:#fff; border:1px solid var(--grey-300);
  border-radius:999px; padding:7px 14px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
.playall:hover{ background:var(--grey-100); }

/* ── decision callout ── */
.decide{ margin:16px 0 0; padding:12px 16px; background:#FFF8E6; border:1px solid #F3E2B0; border-radius:12px;
  font-size:13px; color:#6B5307; line-height:1.5; }
.decide b{ color:#4A390A; }

/* ═══ THE CELL — 104×96, 12px radius, 14px type, 2px between lines (the CORE) ═══ */
.cell{ position:relative; width:104px; height:96px; border:1px solid var(--grey-300); border-radius:12px; background:#fff;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
.cell .pv{ font-size:14px; line-height:18px; color:var(--ink); }
.cell .sub2{ font-size:14px; line-height:18px; color:var(--grey-700); height:18px; }
.cell .sub2 s{ color:var(--ink); margin-right:4px; }
.cell .sub2 .nw{ color:var(--green); }
.cell .date{ position:absolute; bottom:8px; left:9px; font-size:12px; color:var(--grey-500); }
/* default variants */
.cell.past .pv{ color:var(--grey-400); }
.cell.blocked{ background:var(--grey-100); border-color:var(--grey-200); }
.cell.blocked .pv{ text-decoration:line-through; text-decoration-color:var(--ink); }
.cell.closedwin,.cell.minclosed{ background:#F2F2F2; border-color:#E8E8E8; }
.cell.closedwin .pv,.cell.minclosed .pv{ text-decoration:line-through; text-decoration-color:var(--grey-600); color:var(--grey-600); }
.cell .tip{ position:absolute; bottom:calc(100% + 6px); left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
  font-size:12px; white-space:nowrap; padding:6px 10px; border-radius:8px; opacity:0; transition:opacity .15s; pointer-events:none; }
.cell:hover .tip{ opacity:1; }
.cell.xmark::before,.cell.xmark::after{ content:''; position:absolute; top:50%; left:50%; width:13px; height:1.5px; border-radius:2px; background:var(--grey-600); }
.cell.xmark::before{ transform:translate(-50%,-50%) rotate(45deg); } .cell.xmark::after{ transform:translate(-50%,-50%) rotate(-45deg); }
.cell.disc-green .pv,.cell.disc-green .sub2{ color:var(--green); }
.cell.disc-orange .pv,.cell.disc-orange .sub2{ color:var(--orange); }
/* booked pill */
.bk{ width:118px; height:56px; border-radius:16px; background:var(--ink); display:flex; align-items:center; gap:8px; padding:0 12px 0 5px; }
.bk .av{ width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg,#666,#333); flex-shrink:0; }
.bk .nm{ color:#fff; font-size:14px; }

/* ── wavy ring ── */
.ring{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
.ring path{ fill:none; stroke-width:1; stroke-linecap:round; stroke-linejoin:round; }
.ring .wfill{ stroke:none; }

/* ── the rolling price reel (odometer) ── */
.reel{ height:18px; line-height:18px; overflow:hidden; display:inline-block; vertical-align:bottom; }
.reel .strip{ display:block; }
.reel i{ display:block; height:18px; font-size:14px; font-style:normal; }
.reel .old{ color:var(--ink); } .reel .new.g{ color:var(--green); } .reel .new.o{ color:var(--orange); }
.strip.up{ transform:translateY(-18px); }   /* rest shows NEW (bottom child) */
.strip.down{ transform:translateY(0); }      /* rest shows NEW (top child) */
.cell.anim .strip.up{ animation:rollUp .85s cubic-bezier(.16,1,.3,1) both; }
.cell.anim .strip.down{ animation:rollDown 1s cubic-bezier(.16,1,.3,1) 1.25s both; }
@keyframes rollUp{ from{transform:translateY(0);} to{transform:translateY(-18px);} }
@keyframes rollDown{ from{transform:translateY(-18px);} to{transform:translateY(0);} }
/* the "-N%" line counts in first, before the price drops (lower plays) */
.cell .pct{ font-size:14px; line-height:18px; height:18px; color:var(--grey-700); }
.cell.anim .pct{ animation:fadeUp .5s cubic-bezier(.22,1,.36,1) .15s both; }
/* struck-old line + min line reveal */
.cell.anim .revsub{ animation:fadeUp .45s ease .45s both; }
@keyframes fadeUp{ from{opacity:0; transform:translateY(-3px);} to{opacity:1; transform:translateY(0);} }
/* APPLIED commit — wash fades in, ring settles, price recenters */
.cell.applied .ring .wfill{ opacity:1; }
.cell.applied.anim .ring .wfill{ animation:washIn .5s ease both; }
.cell.applied.anim .ring .wpath{ animation:strokePulse .5s ease both; }
@keyframes washIn{ from{opacity:0;} to{opacity:1;} }
@keyframes strokePulse{ 0%{opacity:.4;} 100%{opacity:1;} }
/* untapped: gentle ring breathe on play */
.cell.untapped.anim .ring{ animation:breathe .9s ease both; }
@keyframes breathe{ 0%{opacity:.25;} 60%{opacity:1;} 100%{opacity:1;} }

/* ═══ THE PILL / MODAL ═══ */
.pill{ display:inline-flex; align-items:center; gap:14px; background:#0F0F0F; border-radius:999px; padding:10px 12px; color:#fff; }
.pill .nav{ width:48px; height:48px; border-radius:50%; background:#333; display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0; }
.pill .nav svg{ width:22px; height:22px; }
.pill .body{ min-width:190px; padding:0 2px; }
.pill .hd{ font-size:15px; font-weight:600; }
.pill .mg{ font-size:12px; color:var(--grey-500); margin-top:3px; }
.pill .mg .hl{ color:var(--green-chk); } .pill .mg .hl.lo{ color:#F3A86A; }
.pill .cta{ display:inline-flex; align-items:center; gap:8px; height:48px; padding:0 22px; border-radius:999px; background:transparent; border:1px solid var(--grey-700); color:#fff; font-size:15px; font-weight:500; flex-shrink:0; cursor:pointer; } /* outlined ghost — matches the real Apply */
.pill .cta-solid{ background:#fff; color:#0F0F0F; border:0; font-weight:600; } /* white pill — idle Opportunities / Automate groups */
.pill .cta .wand{ width:20px; height:20px; }
.pill .check{ min-width:112px; height:48px; border-radius:999px; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
.pill .check.g{ border:1.5px solid var(--green-chk); color:var(--green-chk); background:rgba(48,209,88,.14); }
.pill .check.o{ border:1.5px solid var(--orange-chk); color:var(--orange-chk); background:rgba(235,97,0,.14); }
.pill .check svg{ width:24px; height:24px; }
.pill .done{ min-width:96px; height:48px; border-radius:24px; background:#fff; color:#0F0F0F; font-size:15px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
.pill .x{ width:32px; height:32px; border-radius:50%; background:#333; color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
.pill.circle{ width:72px; height:72px; border-radius:50%; padding:0; justify-content:center; }
.pill .dots{ display:inline-flex; gap:6px; } .pill .dots i{ width:7px; height:7px; border-radius:50%; background:#fff; display:block; animation:dotp 1s ease infinite; }
.pill .dots i:nth-child(2){ animation-delay:.15s; } .pill .dots i:nth-child(3){ animation-delay:.3s; }
@keyframes dotp{ 0%,100%{opacity:.3;} 50%{opacity:1;} }
.pill-lbl{ font-size:12px; font-weight:600; color:var(--grey-700); margin:0 0 8px; }
.pill-stack{ display:flex; flex-direction:column; gap:18px; }
.pill-item .cap{ font-size:12.5px; color:var(--grey-700); margin:8px 0 0; max-width:520px; line-height:1.45; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Calendar cell animations</h1>
  <h2 class="sqh">0 · Squiggly dates</h2>
  <p class="sec-note">Every opportunity cell, its four states across — untapped, selected, applied, subdued — the wavy ring breathing, the price reeling. The cells replay on a loop.</p>
  <div id="sq"></div>
  <div hidden id="secDefault"></div><div hidden id="secOpps"></div><div hidden id="secPill"></div>
</div>
<style>
  .sqrow { margin: 0 0 18px; }
  .sqname { font-size: 13px; font-weight: 700; color: #222; margin: 0 0 8px; }
  .cells.sq { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .cells.sq .tile { width: auto; min-width: 0; }
  .cells.sq .tile .stage { width: 100%; }
  .sqh { font: 600 18px 'Cereal', sans-serif; margin: 10px 0 2px; }
</style>
<script>
/* ── wavy ring (real sineRingPath from the app) ─────────────────────────────── */
function sineRingPath(w,h,amp,phase,N){const inset=2,rc=11,W=w-2*inset,H=h-2*inset;const sh=W-2*rc,sv=H-2*rc,qa=Math.PI*rc/2,P=2*sh+2*sv+4*qa;const k=N*2*Math.PI/P;const pt=s=>{if(s<sh)return[inset+rc+s,inset,0,-1];s-=sh;if(s<qa){const a=-Math.PI/2+s/rc,cx=w-inset-rc,cy=inset+rc;return[cx+rc*Math.cos(a),cy+rc*Math.sin(a),Math.cos(a),Math.sin(a)];}s-=qa;if(s<sv)return[w-inset,inset+rc+s,1,0];s-=sv;if(s<qa){const a=s/rc,cx=w-inset-rc,cy=h-inset-rc;return[cx+rc*Math.cos(a),cy+rc*Math.sin(a),Math.cos(a),Math.sin(a)];}s-=qa;if(s<sh)return[w-inset-rc-s,h-inset,0,1];s-=sh;if(s<qa){const a=Math.PI/2+s/rc,cx=inset+rc,cy=h-inset-rc;return[cx+rc*Math.cos(a),cy+rc*Math.sin(a),Math.cos(a),Math.sin(a)];}s-=qa;if(s<sv)return[inset,h-inset-rc-s,-1,0];s-=sv;const a=Math.PI+s/rc,cx=inset+rc,cy=inset+rc;return[cx+rc*Math.cos(a),cy+rc*Math.sin(a),Math.cos(a),Math.sin(a)];};let d='';const step=2,n=Math.ceil(P/step);for(let i=0;i<=n;i++){const s=Math.min(i*step,P-.01);const[x,y,nx,ny]=pt(s);const o=amp*Math.sin(k*s+phase);d+=(i?'L':'M')+(x+nx*o).toFixed(1)+' '+(y+ny*o).toFixed(1);}return d+'Z';}
function ringSVG(stroke,fill){const w=104,h=96,ns='http://www.w3.org/2000/svg';const svg=document.createElementNS(ns,'svg');svg.setAttribute('class','ring');svg.setAttribute('viewBox','0 0 '+w+' '+h);const d=sineRingPath(w,h,2,0,Math.max(6,Math.round((2*(w-26)+2*(h-26))/12)));const f=document.createElementNS(ns,'path');f.setAttribute('class','wfill');f.setAttribute('d',d);f.setAttribute('fill',fill||'transparent');svg.appendChild(f);const p=document.createElementNS(ns,'path');p.setAttribute('class','wpath');p.setAttribute('d',d);p.setAttribute('stroke',stroke);svg.appendChild(p);return svg;}

const PLAYICON='<svg viewBox="0 0 12 12" fill="currentColor"><path d="M2 1.5v9l8-4.5z"/></svg>';
const WAND='<svg class="wand" viewBox="0 0 16 16" fill="none"><path fill="#fff" d="M12.2 2.86l.94.93c.39.39.39 1.02 0 1.41L3.2 15.14a1 1 0 01-1.41 0l-.93-.93a1 1 0 010-1.42L10.79 2.86a1 1 0 011.42 0zM8.5 6.85L1.85 13.5l.65.65 6.65-6.65-.65-.65z"/><path fill="#30D158" d="M14 7l.5 1 1 .5-1 .5-.5 1-.5-1-1-.5 1-.5.5-1z"/></svg>';
const WAND_DARK=WAND.replace('fill="#fff"','fill="#0F0F0F"'); /* dark-body wand for white (solid) buttons */
const CHECK='<svg viewBox="0 -960 960 960" fill="currentColor"><path d="M382-240 154-468l57-57 171 171 367-367 57 57-424 424Z"/></svg>';
const CHEV_L='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 6 9 12 15 18"/></svg>';
const CHEV_R='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 6 15 12 9 18"/></svg>';

/* tap anything → copy its name (so the user can point at an exact state) */
function toast(msg){ let t=document.getElementById('_toast'); if(!t){ t=document.createElement('div'); t.id='_toast'; document.body.appendChild(t); } t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1500); }
function copyName(name,el){ let ok=false;
  try{ const ta=document.createElement('textarea'); ta.value=name; ta.style.cssText='position:fixed;opacity:0;top:0'; document.body.appendChild(ta); ta.select(); ok=document.execCommand('copy'); ta.remove(); }catch(e){}
  if(!ok && navigator.clipboard){ try{ navigator.clipboard.writeText(name); ok=true; }catch(e){} }
  toast((ok?'Copied: ':'Name: ')+'“'+name+'”');
  if(el){ el.classList.add('copied'); setTimeout(()=>el.classList.remove('copied'),650); } }
function tile(parent,cap,spec,cell,name){ const t=document.createElement('div'); t.className='tile'; t.dataset.name=name||cap;
  const st=document.createElement('div'); st.className='stage'; st.appendChild(cell); t.appendChild(st);
  const c=document.createElement('div'); c.className='tcap'; c.textContent=cap; t.appendChild(c);
  const s=document.createElement('div'); s.className='tspec'; s.innerHTML=spec; t.appendChild(s);
  t.addEventListener('click',()=>copyName(t.dataset.name,t)); parent.appendChild(t); return cell; }

/* ── generic cell builders ── */
function baseCell(cls,inner,ring){ const c=document.createElement('div'); c.className='cell '+(cls||''); if(ring) c.appendChild(ring); c.insertAdjacentHTML('beforeend',inner); return c; }
function reel(dir,oldV,newV,newCls){ return '<span class="reel"><span class="strip '+dir+'">'+
  (dir==='up' ? '<i class="old">'+oldV+'</i><i class="new '+newCls+'">'+newV+'</i>' : '<i class="new '+newCls+'">'+newV+'</i><i class="old">'+oldV+'</i>')+'</span></span>'; }

/* ═══ DEFAULT CELLS ═══ */
const D=document.getElementById('secDefault');
tile(D,'Open','Available night. <span class="k">Black</span> price, grey-300 border.',baseCell('','<span class="pv">$331</span><span class="date">14</span>'));
tile(D,'Open · min badge','Price + <span class="k">min N</span> below, 2px gap, both 14px.',baseCell('','<span class="pv">$331</span><span class="sub2">min 3</span><span class="date">14</span>'));
tile(D,'Booked','Guest stay: dark pill + avatar + name.',(()=>{const w=document.createElement('div');w.className='bk';w.innerHTML='<span class="av"></span><span class="nm">Henry</span>';return w;})());
tile(D,'Host-blocked','Struck price, <span class="k">black</span> strike.',baseCell('blocked','<span class="pv">$331</span><span class="date">14</span>'));
tile(D,'Min-closed','Gap &lt; minimum. Grey, struck; hover → “Min N nights”.',baseCell('minclosed','<span class="pv">$205</span><span class="tip">Min 5 nights</span><span class="date">14</span>'));
tile(D,'Beyond window','Not open yet: grey, struck grey.',baseCell('closedwin','<span class="pv">$429</span><span class="date">14</span>'));
tile(D,'Adv notice / prep','Rule-blocked: centered ✕; hover names the rule.',baseCell('xmark','<span class="tip">Adv notice</span>'));
tile(D,'Past','Faded grey, non-interactive.',baseCell('past','<span class="pv">$331</span><span class="date">14</span>'));
tile(D,'Applied last-minute','Committed discount → <span class="k">orange</span> $. Hover → “10% discount”.',baseCell('disc-orange','<span class="pv">$248</span><span class="tip">10% discount</span><span class="date">14</span>'));
tile(D,'Applied promotion','Try-promotions → orange $ + persistent orange “−N%”.',baseCell('disc-orange','<span class="pv">$248</span><span class="sub2">−15%</span><span class="date">14</span>'));
tile(D,'Gap-exception open','3+ night stranded gap re-opened: <span class="k">min 7̶ 3</span> (old struck black, new green).',baseCell('','<span class="pv">$276</span><span class="sub2">min <s>7</s><span class="nw">3</span></span><span class="date">14</span>'));

/* ═══ OPPORTUNITY BLOCKS ═══ */
const OPPS=document.getElementById('secOpps'); const SQ=document.getElementById('sq');

/* pill builders */
function resultPill(hd,mg,ctaLabel,lo){ const p=document.createElement('div'); p.className='pill';
  p.innerHTML='<span class="nav">'+CHEV_L+'</span><div class="body"><div class="hd">'+hd+'</div>'+(mg?'<div class="mg">'+mg+'</div>':'')+
  '</div><span class="cta">'+WAND+(ctaLabel||'Apply')+'</span><span class="nav">'+CHEV_R+'</span><span class="x">✕</span>'; return p; }

function oppBlock({name,short,chip,chipCls,pill,cells,decide}){
  // SQUIGGLY DATES (John, 2026-10-07): the opportunity cells alone — one row per opportunity, its four states across — on the cell
  // page's four-column grid; the modal, the chip and the decisions stay on the cell & opportunity system page
  const row=document.createElement('div'); row.className='sqrow'; row.innerHTML='<div class="sqname">'+name+'</div>';
  const grid=document.createElement('div'); grid.className='cells sq'; row.appendChild(grid); SQ.appendChild(row);
  cells.forEach(c=> tile(grid,c.cap,c.spec,c.cell, short+' · '+c.cap) );
}

/* A · RAISE — event / holiday (GREEN) */
oppBlock({ name:'A · Raise — Event & Holiday', short:'Raise', chip:'GREEN · earn more', chipCls:'green',
  pill:resultPill('Price tip: Comic-Con','San Diego · Jul 21–27 · <span class="hl">+23% premium</span>','Apply'),
  cells:[
    {cap:'Untapped', spec:'Quiet <span class="k">grey-400</span> ring · <span class="k">green</span> price · no split.',
