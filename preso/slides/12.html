<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12</title>
<!-- CALENDAR — the chapter title, straight after the price-display modal.
     It said "Host Calendar"; just "Calendar" now (John, 2026-10-01). The deck's
     section nav still calls the chapter Host calendar.

     AS BIG AS HELLO! (John, 2026-10-01), and set the way 01 sets it: Anton,
     with the word's measured INK as the SVG viewBox, fitted into Hello!'s own
     box — 92vw wide, the stage's height less the deck's chrome (76px clear of
     the kicker and the counter). preserveAspectRatio does the fitting, so the
     word is as big as the box allows in whichever direction runs out first:
     a short word fills it as Hello! does, a long one is held by the width and
     never cut off. See 01.html for why the ink and not a font-size.

     No build. The deck pushes it in from the right. -->
<style>
  @font-face {
    font-family: "Anton";
    src: url("../fonts/Anton.woff2") format("woff2");
    font-weight: 400;
    font-display: block;
  }
  html, body { margin: 0; height: 100%; background: #fff; color: #111; overflow: hidden; }
  .slide { height: 100%; display: grid; place-items: center; }
  h1 { margin: 0; display: block; width: 92vw; height: calc(100vh - 152px); }
  h1 svg { display: block; width: 100%; height: 100%; }
  h1 text {
    font-family: "Anton", "Helvetica Neue", sans-serif;
    font-weight: 400;
    letter-spacing: -0.02em;   /* -2%, as Hello! */
    fill: #111;
  }
</style>
</head>
<body>
  <div class="slide">
    <h1><svg id="word" role="img" aria-label="Calendar"
             preserveAspectRatio="xMidYMid meet" viewBox="0 0 100 100">
      <text x="0" y="0" font-size="100">Calendar</text>
    </svg></h1>
  </div>
<script>
(() => {
  // 01's fit, word for word: the ink box from canvas (it works while parked)
  const svg = document.getElementById('word');
  const WORD = 'Calendar';
  function fit() {
    const c = document.createElement('canvas').getContext('2d');
    c.font = '400 100px Anton, sans-serif';
    try { c.letterSpacing = '-0.02em'; } catch (_) {}
    const m = c.measureText(WORD);
    const l = m.actualBoundingBoxLeft, r = m.actualBoundingBoxRight;
    const a = m.actualBoundingBoxAscent, d = m.actualBoundingBoxDescent;
    const w = l + r, h = a + d;
    if (!(w > 0 && h > 0)) return false;
    svg.setAttribute('viewBox', (-l) + ' ' + (-a) + ' ' + w + ' ' + h);
    return true;
  }
  fit();
  // Anton is font-display: block, so the first read can land on nothing.
  if (document.fonts && document.fonts.ready) {
    document.fonts.load('400 100px Anton').catch(() => {}).then(() => fit());
    document.fonts.ready.then(fit).catch(() => {});
  }
})();
</script>
</body>
</html>
