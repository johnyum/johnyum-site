<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12</title>
<!-- HOST CALENDAR — the chapter title, straight after the price-display modal.

     THE EXPLAINER SIZE, like Luxe (090) and Host Setup (09f0). This was Anton
     at 14vw, the announcing size the deck opened its chapters with; it is now
     Special Gothic Condensed One at clamp(16px, 6.1vh, 62px) — the same face
     and clamp 10c and 11cut set their copy in, and the size the other two
     project titles are in. All three chapter titles now read the same, which
     is the point: they name the thing and get out of the way.

     Height-driven, so it holds its proportion against the stage rather than
     the window's width, and a two-word title no longer needs its own sizing
     argument.

     No build, no script. The deck pushes it in from the right and on to the
     calendar. -->
<style>
  @font-face {
    font-family: "Special Gothic Condensed One";
    src: url("../fonts/SpecialGothicCondensedOne.woff2") format("woff2");
    font-weight: 400;
    font-display: block;
  }
  html, body {
    margin: 0; height: 100%;
    background: #fff; color: #111;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .slide { height: 100%; display: grid; place-items: center; }
  .pm { text-align: center; }
  h1 {
    margin: 0;
    font-family: "Special Gothic Condensed One", "Helvetica Neue", sans-serif;
    font-weight: 400;
    font-size: clamp(32px, 12.2vh, 124px);   /* Host only fee's size (John, 2026-09-30) — the two case studies' titles match */
    line-height: 1.06;
    letter-spacing: -0.01em;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="pm">
      <h1>Host Calendar</h1>
    </div>
  </div>
</body>
</html>
