<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>06a</title>
<!-- THE RECEIPT — the first thing shipped at Airbnb, and still in the product
     eleven years later. Comes straight after the Airbnb logo card (06) and
     before the work list (07), so the deck opens the company on the smallest
     possible artefact rather than on a portfolio of them.

     The deck pushes it in from the right in the usual way. No build: it is one
     document, held, while the story is told over it.

     Sized off HEIGHT, not width. It is a portrait page, so height is what
     decides whether the line items are legible from the back of a room. 84vh
     puts it at roughly 700px wide on a 1600 stage, which holds "Your receipt
     from Airbnb" and the total.

     The asset is 2185x2373, converted from the JP2 John exported and cropped
     to its own content. Do NOT re-render this from the PDF with sips:
     --resampleWidth rasterises at the default DPI and then UPSCALES the
     bitmap, so asking for 3600 gives a bigger, equally soft image. There is no
     real PDF rasteriser on this machine (no poppler, PyMuPDF, Quartz bindings
     or ghostscript), which is why the export is the source of truth here.

     No caption. Slides 03 through 05 are images alone and this belongs with
     them — the eleven-years line is the presenter's to say. -->
<style>
  html, body {
    margin: 0; height: 100%;
    background: #fff;
    overflow: hidden;
  }
  .slide { height: 100%; display: grid; place-items: center; }
  .slide img {
    max-height: 84vh;
    max-width: 70vw;
    width: auto; height: auto;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
    /* A sheet of paper on a white stage. Without this the page has no edge —
       the receipt's own background is white and it dissolves into the slide.
       Three drops, the same shape slide 09's window uses: a hairline to find
       the edge, a close one for contact, a wide one for lift. */
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, 0.02),
      0 4px 8px rgba(0, 0, 0, 0.08),
      0 12px 30px rgba(0, 0, 0, 0.14);
  }
</style>
</head>
<body>
  <div class="slide">
    <img src="assets/receipt.webp" width="2185" height="2373"
         alt="An Airbnb receipt: three nights in Santa Rosa, price breakdown and payment, totalling $3,245.01">
  </div>
</body>
</html>
