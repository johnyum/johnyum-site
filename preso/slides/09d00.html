<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09d00</title>
<!-- HOST ONLY FEE — the title card for the fee work that follows. Back in after the speed-run cards went (John,
     2026-09-30), at twice the size, and labelled Case Study 1: the projects before it are a run-through, this is the
     first one told in full.

     THE EXPLAINER SIZE, the same as Luxe (090), Host Setup (09f0) and Host
     Calendar (12): Special Gothic Condensed One at clamp(16px, 6.1vh, 62px),
     the face and clamp 10c set its copy in. All four chapter titles read the
     same, which is the point — they name the thing and get out of the way.
     Height-driven, so a title holds its proportion against the stage rather
     than the window's width and a two-word one needs no sizing argument of
     its own.

     EVERY PROJECT OPENS THE SAME WAY NOW. The card first, then whatever the
     project opens on — here, the cleaning-fee tweets. The two with an artefact to open
     on used to go straight to it, which made them look like a continuation of
     the project before rather than the start of a new one.

     No script, nothing to reveal. The deck pushes it in from the right. -->
<style>
  @font-face {
    font-family: "Special Gothic Condensed One";
    src: url("../fonts/SpecialGothicCondensedOne.woff2") format("woff2");
    font-weight: 400;
    font-display: block;
  }
  html, body {
    margin: 0; height: 100%;
    background: #fff; color: #111;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .slide { height: 100%; display: grid; place-items: center; }
  .pm { text-align: center; }
  h1 {
    margin: 0;
    font-family: "Special Gothic Condensed One", "Helvetica Neue", sans-serif;
    font-weight: 400;
    font-size: clamp(32px, 12.2vh, 124px);   /* twice the explainer size (John, 2026-09-30: "make the type bigger") */
    line-height: 1.06;
    letter-spacing: -0.01em;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../fonts/IBMPlexMono-Regular.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: block;
  }
  /* "Case Study 1" over the title, in the deck's mono at 12 — the grey of every other mono label. OPTICALLY CENTRED
     (John, 2026-09-30: the title looked too low): the label hangs off the title rather than sitting in the block that
     gets centred, so the TITLE is what sits on the middle line, and the pair is then lifted 3% of the stage — the eye
     reads a centred thing as low, the way a picture is hung a little above the middle of a wall. */
  .pm { position: relative; transform: translateY(-3vh); }
  .kick {
    position: absolute; left: 0; right: 0; bottom: calc(100% + 16px);
    margin: 0;
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-size: 12px; line-height: 1; color: #8C8C8C;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="pm">
      <p class="kick">Case Study 1</p>
      <h1>Host only fee</h1>
    </div>
  </div>
</body>
</html>
