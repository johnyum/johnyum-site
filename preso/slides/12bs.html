<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12bs</title>
<!-- THE BLAND FORK OF 12B (John, 2026-09-30) — "keep the current one as well". The same sheet of studies and the same
     live phone; the calendar inside it runs 13.html?simple=1, which lands every beat instantly with all motion off, leaves
     the four motion studies out, and writes minimum nights onto nothing but the editor. It stops at the custom promotion
     closing — the original's #22.18 — and hands the deck on.

     Only the calendar is bland. The sheet sliding to the phone and the phone growing in are the deck presenting the work
     rather than the work, and are left as they are in 12b.

     This file is a copy of 12b with the iframe's src changed and one addition, the two-up at #23.4 (the phone left, the
     verdict on the right). A fix to 12b's wrapper wants making here too.
-->
<!-- THE CALENDAR STUDIES — every calendar style tried, in three neat rows.

     Sits between the "Airbnb hosts manage…" line (12a) and the live build (13).
     The 28 phones in assets/Calendar/ stand in three rows of 9 / 10 / 9, in
     the order of John's reference board. The deck pushes the whole sheet in
     from the right like any slide.

     THE LAST PHONE IS THE REAL THING. The middle row's tenth slot is not a
     picture: it is slide 13 — the live Host Calendar in its drawn iPhone —
     loaded here in an iframe the size of the whole viewport and scaled down
     until its phone sits exactly in the slot. So it comes in with the sheet,
     already running.

     THE BUILD — one tap, two movements
       1  the whole rigid sheet slides LEFT until the live phone is smack in
          the centre of the frame (it is already on the centre row, so this is
          a pure horizontal shift), and the other 27 fade to nothing over the
          same slide — gone by the time the live phone lands;
       2  THEN the live phone grows to full size where it stands — its
          transform simply animates back to none, which IS slide 13's layout.
       From then on this slide is the live build: the deck's 13.html is not in
       the manifest, it only lives here, and the taps forward to its beats.
       The phone is tappable — picking a night brings up the preso's quick
       actions — so the slide declares presoInteractive: the deck's tap zones
       shrink to the 32px edge rails and left/right, the clicker and the rails
       drive the build.

     SIZING: the sheet is taller than the frame ON PURPOSE. The rows are sized
     so that three of them plus their gutters come to 100vh + 20% of a phone,
     and the sheet is centred — so the top row loses its top 10% above the
     frame and the bottom row its bottom 10% below it, and the studies fill
     the space instead of floating in it. HEIGHT alone sets the size: on a
     wide screen the ten-phone middle row runs a little past both edges, which
     is the reference board's edge-to-edge look, not a bug. -->
<style>
  :root {
    --gap: 1vw;                                   /* gutter between phones */
    --rowgap: 1.6vh;
    --crop: 0.1;                                  /* of a phone, off the top row's top and the bottom row's bottom */
    /* three rows + two gutters = 100vh + 2·crop·h  →  h = (100vh − 2·gutter) / (3 − 2·crop) */
    --h-fill: calc((100vh - 2 * var(--rowgap)) / (3 - 2 * var(--crop)));
    --h: var(--h-fill);
    --w: calc(var(--h) * 450 / 920);
  }
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  #sheet {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    gap: var(--rowgap);
    --dx: 0px;                                    /* set by JS: how far left puts the live phone on centre */
    transform-origin: 50% 50%;
    transition: transform 720ms cubic-bezier(0.16, 1, 0.3, 1), opacity 720ms ease;
  }
  /* 1: the sheet slides as one rigid thing and fades out on the way — the
     other 27 are gone by the time the live phone lands on centre. (The live
     phone is not in the sheet, so it rides the slide at full opacity.) */
  body.shift #sheet { transform: translateX(var(--dx)); opacity: 0; }
  .row { display: flex; gap: var(--gap); justify-content: center; flex: none; }
  .phone { width: var(--w); height: var(--h); flex: none; }
  .phone img { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }

  /* the live build: a whole-viewport iframe of 13.html, scaled down so its
     centred phone lands in the last slot; on the tap the transform goes to
     none and it is simply slide 13 */
  .live {
    position: fixed; left: 0; top: 0;
    width: 100vw; height: 100vh;
    border: 0; display: block;
    background: transparent;
    transform-origin: 50% 50%;
    z-index: 5;
  }
  body.shift .live, body.grown .live { transition: transform 720ms cubic-bezier(0.16, 1, 0.3, 1); }
  @media (prefers-reduced-motion: reduce) {
    #sheet, body.shift .live, body.grown .live { transition: none; }
  }

  /* THE TWO-UP AT #23.4 (John, 2026-09-30). Once the custom promotion is Cancelled the phone moves left, as if it were
     the left one of a pair, and where the right one would stand is the verdict on this version: two ✓ and three ⨉, in
     the mono at 18, left-aligned, the block centred on that missing phone. JS sets --side (how far left) and places #notes. */
  body.grown.side .live { transform: translateX(var(--side, 0px)) !important; }
  body.grown .live { transition: transform 720ms cubic-bezier(0.16, 1, 0.3, 1); }
  body.snap .live, body.snap #notes, body.snap #notes li { transition: none !important; }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../fonts/IBMPlexMono-Regular.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: block;
  }
  #notes {
    position: fixed; top: 50%; left: 0; z-index: 6;
    transform: translate(-50%, -50%);
    margin: 0; padding: 0; list-style: none;
    display: flex; flex-direction: column;
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-size: 18px; line-height: 24px; color: #111; text-align: left;
    pointer-events: none;
  }
  #notes li {
    display: flex; align-items: flex-start; gap: 12px;
    opacity: 0; transform: translateX(24px);
    transition: opacity 320ms ease, transform 520ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  /* 16 between lines, as a margin rather than a gap, so a line that is not in yet can take none (see body.xs) */
  #notes li + li { margin-top: 16px; }
  #notes li.x { max-height: 24px; transition: opacity 320ms ease, transform 520ms cubic-bezier(0.16, 1, 0.3, 1), max-height 520ms cubic-bezier(0.16, 1, 0.3, 1), margin-top 520ms cubic-bezier(0.16, 1, 0.3, 1); }
  #notes svg { flex: none; width: 24px; height: 24px; fill: #111; }
  /* THE ARROW AND THE CROSS-OUTS (John, 2026-09-30). The arrow points at the critique being answered — on the RIGHT of
     the words, pointing back at them, the same 12 from them as the ⨉ is on the left, sliding in from the right:
       dark  "Too dark" is pointed at (the black picks, then their switch to stroked)
       tdx   "Too dark" is crossed out; pta  the arrow moves to "No price tips" (the wand and its sheet)
       ptx   the tips are applied — the ✓s in the cells: "No price help" is crossed out
       trim  the arrow moves down to "No holidays" (the run to November)
       hol   the holidays have popped in: "No holidays" is crossed out too, and the arrow goes
       ev    the arrow comes on at "No popular events" (the run to February)
       evd   the events have popped in: "No popular events" is crossed out, and the arrow goes
     A cross-out is drawn left to right, from just before the ⨉ to 6 past the words (4 more on the right than the left,
     so it reads as centred on the line), and nothing moves: an arrow that goes keeps its place in the layout. */
  #notes svg.ptr {
    opacity: 0; transform: translateX(12px);
    transition: opacity 260ms ease, transform 420ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  body.dark #notes li.td svg.ptr, body.pta #notes li.pt svg.ptr, body.trim #notes li.nh svg.ptr, body.ev #notes li.ne svg.ptr, body.lca #notes li.lc svg.ptr { opacity: 1; transform: none; }
  body.tdx #notes li.td svg.ptr, body.ptx #notes li.pt svg.ptr, body.hol #notes li.nh svg.ptr, body.evd #notes li.ne svg.ptr { opacity: 0; transform: none; }
  #notes li.td span, #notes li.pt span, #notes li.nh span, #notes li.ne span { position: relative; }
  #notes li.td span::after, #notes li.pt span::after, #notes li.nh span::after, #notes li.ne span::after {
    content: ""; position: absolute; left: -38px; right: -6px; top: 50%; height: 2px; margin-top: -1px;
    background: #111; transform: scaleX(0); transform-origin: 0 50%;
    transition: transform 420ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  body.tdx #notes li.td span::after, body.ptx #notes li.pt span::after, body.hol #notes li.nh span::after, body.evd #notes li.ne span::after { transform: scaleX(1); }
  body.snap #notes svg.ptr, body.snap #notes li span::after { transition: none; }
  #notes svg.ok { fill: #008A05; }             /* Airbnb's own success green and error red, the calendar's colours */
  #notes svg.no { fill: #C13515; }
  /* in after the phone has started moving, one after another; out all at once */
  body.side #notes li { opacity: 1; transform: none; }
  /* the ⨉s wait for their own tap (body.xs): the ✓ come in alone, the ⨉s after, each line already in its place */
  /* CENTRED AT EACH STAGE (John, 2026-09-30). Until their tap the ⨉ lines take no height at all — no line, no margin — so
     the two ✓ come in centred on their own; on the tap each ⨉ line opens to its height as it fades in, and the list, centred
     on its middle, grows from there, the ✓ riding up into place. (Width is kept throughout: nothing moves sideways.) */
  body:not(.xs) #notes li.x { opacity: 0; transform: translateX(24px); max-height: 0; margin-top: 0; overflow: hidden; }
  body.side #notes li:nth-child(1) { transition-delay: 260ms; }
  body.side #notes li:nth-child(2) { transition-delay: 330ms; }
  body.side #notes li:nth-child(3) { transition-delay: 400ms; }
  body.side #notes li:nth-child(4) { transition-delay: 470ms; }
  body.side #notes li:nth-child(5) { transition-delay: 540ms; }
  body.side #notes li:nth-child(6) { transition-delay: 610ms; }
  body.side #notes li:nth-child(7) { transition-delay: 680ms; }
  body.side #notes li:nth-child(8) { transition-delay: 750ms; }
</style>
</head>

<script>
(() => {
  window.presoInteractive = true;   // nights are tappable; navigation lives on the rails and the keys
  const live = document.getElementById('live'), slot = document.getElementById('slot'), sheet = document.getElementById('sheet');
  const STAMP = new URLSearchParams(location.search).get('v') || Date.now().toString(36);
  // THE SIMPLE FORK (?simple=1), now running on through the events and holidays (John, 2026-09-30) — the scroll to
  // Christmas, then on to Indian Wells and its week picked — with corner dots in place of the icons. The original's first
  // 19 beats less the 4 motion studies the fork leaves out is 15, so ?until=15 hands the deck on from there.
  live.src = '13.html?embed=1&simple=1&until=29&v=' + STAMP;   // ends on the 20% (John, 2026-09-30: Indian Wells is off the path — the deck goes on to the large multi-calendar)   // 17: the fork's own three extra beats (the run carried on to the 30th, the black picks switched to stroked, the close and the run to November) less the Christmas stop it skips
  const SHIFT_MS = 720;                      // movement 1's length; movement 2 starts as it lands
  const GROW_MS = 800;                       // movement 2's length; the arrows stay ours until the phone has landed
  let state = 0, timer = 0, landed = false, restoreTo = -1;  // 0 in the sheet · 1 sliding to centre · 2 grown (13 drives, once landed)
  const grown = () => state === 2;
  // 13's phone is min(80vh, 1080px) tall, centred in its viewport — which is
  // this one. In the sheet the live frame is translated so that centre lands
  // on the slot; sliding puts the slot's column on the frame's centre line,
  // so the live frame's translate loses its x and the sheet gains --dx.
  // The slot is measured with the sheet's transform switched OFF for the read
  // (no transition, restored at once, the browser never paints it): once the
  // sheet is sliding or shrinking, a rect read through it is scaled and shifted
  // and every number below goes wrong.
  let geo = null;
  function measure() {
    const t = sheet.style.transform, tr = sheet.style.transition;
    sheet.style.transition = 'none'; sheet.style.transform = 'none';
    const r = slot.getBoundingClientRect();
    sheet.style.transform = t; void sheet.offsetWidth; sheet.style.transition = tr;
    geo = { cx: r.left + r.width / 2, cy: r.top + r.height / 2, s: r.height / Math.min(innerHeight * 0.8, 1080) };
    sheet.style.setProperty('--dx', (innerWidth / 2 - geo.cx).toFixed(2) + 'px');
  }
  function place() {
    if (!geo) measure();
    const { cx, cy, s } = geo;
    if (state === 0) live.style.transform = `translate(${(cx - innerWidth / 2).toFixed(2)}px, ${(cy - innerHeight / 2).toFixed(2)}px) scale(${s.toFixed(5)})`;
    else if (state === 1) live.style.transform = `translate(0px, ${(cy - innerHeight / 2).toFixed(2)}px) scale(${s.toFixed(5)})`;
    else live.style.transform = 'none';
  }
  place();
  addEventListener('resize', () => { measure(); place(); });
  // once grown, the taps are 13's: its own build steps until it says it is out
  const inner = fn => { try { const f = live.contentWindow[fn]; return f ? f() : false; } catch (_) { return false; } };
  // A TAP DURING THE MOVE IS KEPT, not lost (John, 2026-09-22): arrows that land while the sheet slides or the phone grows
  // used to be swallowed — the deck looked frozen for two seconds. They queue, and fire into the build the moment it lands.
  let queued = 0;
  function grow() { state = 2; landed = false; document.body.classList.add('grown'); place(); setTimeout(() => { landed = true; while (queued > 0) { queued--; inner('presoNext'); } try { window.top.dispatchEvent(new Event('presostate')); } catch (_) {} }, GROW_MS); }   // and the deck's URL catches up with the beats that fired on landing
  window.presoNext = () => {
    if (grown()) { if (landed) return inner('presoNext'); queued++; return true; }   // during the grow-in: kept for the landing
    if (state === 1) { queued++; return true; }   // still sliding: movement 2 is already scheduled; the tap waits for it
    state = 1; document.body.classList.add('shift'); place();
    timer = setTimeout(grow, SHIFT_MS + 40);
    return true;
  };
  // the deck's GO: the sheet gone and the live phone grown with no motion, then 13 to its last beat once it is there
  window.presoEnd = () => {
    clearTimeout(timer); state = 2; landed = true;
    sheet.style.transition = 'none'; live.style.transition = 'none';
    document.body.classList.add('shift', 'grown'); place(); void live.offsetWidth;
    sheet.style.transition = ''; live.style.transition = '';
    const go = () => { let f = null; try { f = live.contentWindow && live.contentWindow.presoEnd; } catch (_) {} if (f) f(); else setTimeout(go, 100); };
    go();
  };
  // the deck's URL carries this slide's progress: 0 = the sheet, 1 + beat = the grown phone at that beat (John, 2026-09-22)
  window.presoState = () => { if (state === 0) return 0; let n = 0; try { const f = live.contentWindow.presoAt; n = f ? f() : 0; } catch (_) {} return 1 + n; };   // sliding counts as grown: a refresh mid-slide lands on the phone
  window.presoRestore = n => {
    if (!n) return;
    snapNext = true; restoreTo = n - 1;
    clearTimeout(timer); state = 2; landed = true;
    sheet.style.transition = 'none'; live.style.transition = 'none';
    document.body.classList.add('shift', 'grown'); place(); void live.offsetWidth;
    sheet.style.transition = ''; live.style.transition = '';
    const go = () => { let f = null; try { f = live.contentWindow && live.contentWindow.presoGo; } catch (_) {} if (f) f(n - 1); else setTimeout(go, 100); };
    go();
  };
  // THE TWO-UP. Which beat 13 is on decides it, so it follows every way of getting there — a tap, a step back, a
  // jump on load — by watching rather than by being told. 13's phone is min(80vh, 1080) tall at 900:1840, centred.
  const SIDE_AT = 13;                        // 13's beats applied once the custom promotion is Cancelled (#22.14)
  const COLLAPSE_MS = 950;                   // Cancel's press (340) + the quick actions folding back (550), and a breath
  let lastAt = -1, holdUntil = 0;
  const TIPS_AT = 17;                        // the tap after the switch (#22.17): Too dark crossed out, the arrow on No price tips, the wand and the price-tips sheet
  const EV_AT = 22;                          // the tap after (#22.18): the arrow on "No popular events", February, the events, Modernism Week
  // #22.24 the Modernism Week price sheet, on the iOS pad · #22.25 the iOS pad swapped for the custom keypad
  // #22.25 the swap brings Try $745 and Done in with the custom keypad · #22.26 Try $745 tapped, the price rolling up to it
  const HOME_AT = 26;                        // #22.27: the quick actions close and the calendar goes home — the arrow on Lacked Context
  // #22.28 the header tucked up, the 11th–18th picked
  // #22.29 the knob to 20%, the nights at their 20%-off prices
  const IW_AT = 29;                          // the LAST beat the fork plays (the 20%): the verdict stays up to the end. (Indian Wells, which this once named, is no longer played.)                          // the tap after (#22.18): on down to Indian Wells, its week picked — stroked now; the list stays
  const TMODE_AT = 18;                       // the tap after the sheet (#22.19): Try now, price-tips mode; No price tips crossed out once the tips are on
  // #22.20 the tipped nights picked and the Price tip sheet up · #22.21 Apply tips, ✓ in the cells (the full build's own beats)
  const APPLY_AT = 20;
  const TRIM_AT = 21;                        // the tap after (#22.17): "Too dark" folds out of the list, the quick actions close, on to Thanksgiving
  const FLIP_AT = 16;                        // the tap after (#22.16): the black picks flip to the stroked ones — the verdict stays up
  const XS_AT = 14;                          // the tap after (#22.15): the ⨉s come in under the two ✓
  const DARK_AT = 15;                        // the next tap (#22.15): the run carried on to the 30th — and an arrow at "Too dark"
  const notes = document.getElementById('notes');
  let side = false, snapNext = true;   // the first placement (a load or a jump) lands without moving
  function layoutSide() {
    // a pair of phones: the real one steps left by half a phone and half the gap, and the list stands centred where
    // the right one would be (back to the first layout, John, 2026-09-30)
    const w = Math.min(innerHeight * 0.8, 1080) * 900 / 1840, gap = w * 0.3, off = (w + gap) / 2;
    document.body.style.setProperty('--side', (-off).toFixed(1) + 'px');
    const cx = innerWidth / 2 + off;
    notes.style.left = cx.toFixed(1) + 'px';
    notes.style.maxWidth = Math.max(240, 2 * (innerWidth - cx) - 48).toFixed(0) + 'px';
  }
  function syncSide() {
    let at = -1; try { const f = live.contentWindow.presoAt; at = f ? f() : -1; } catch (_) {}
    if (restoreTo >= 0) { if (at !== restoreTo) return; restoreTo = -1; }   // a jump: wait for 13 to arrive, then land there
    // THE COLLAPSE FIRST (John, 2026-09-30). Arriving live from the promotion, the Cancel is pressed (340ms) and the
    // quick actions then fold back (the card's 550ms transitions): the phone and the list wait for that to finish, so
    // the two moves read one after the other rather than at once. Only on that live step forward — a jump or a step
    // back lands straight away.
    if (at === SIDE_AT && lastAt === SIDE_AT - 1 && !side && !snapNext) {
      if (!holdUntil) holdUntil = performance.now() + COLLAPSE_MS;
      if (performance.now() < holdUntil) return;
    }
    holdUntil = 0; lastAt = at;
    const want = state === 2 && landed && at >= SIDE_AT && at <= IW_AT;
    const dark = state === 2 && landed && at >= DARK_AT && at <= IW_AT;
    const trim = state === 2 && landed && at >= TRIM_AT && at <= IW_AT;
    const tdx = state === 2 && landed && at >= TIPS_AT && at <= IW_AT;   // Too dark crossed out
    if (trim !== document.body.classList.contains('trim')) { if (snapNext) document.body.classList.add('snap'); document.body.classList.toggle('trim', trim); }
    // what 13 is showing, from the flag it keeps on the app's root: 'hol' — the holidays are in, "No holidays" is answered;
    // 'all' — the events are in too, "No popular events" is answered
    let marks = ''; try { marks = live.contentWindow.document.querySelector('iframe').contentDocument.documentElement.dataset.marks || ''; } catch (_) {}
    const flag = (c, on) => { if (on !== document.body.classList.contains(c)) { if (snapNext) document.body.classList.add('snap'); document.body.classList.toggle(c, on); } };
    let tips = false; try { tips = live.contentWindow.document.querySelector('iframe').contentDocument.documentElement.dataset.applied === '1'; } catch (_) {}   // the tips APPLIED — the ✓s in the cells
    flag('xs', state === 2 && landed && at >= XS_AT && at <= IW_AT);
    flag('tdx', tdx);
    flag('pta', tdx);                                     // the arrow on No price tips...
    flag('ptx', tdx && (at > APPLY_AT || (at === APPLY_AT && tips)));   // ...until the ✓s are in (Apply tips): crossed out
    flag('hol', trim && (marks === 'hol' || marks === 'all'));
    flag('ev', state === 2 && landed && at >= EV_AT && at <= IW_AT);
    flag('lca', state === 2 && landed && at >= HOME_AT && at <= IW_AT);
    flag('evd', state === 2 && landed && at >= EV_AT && at <= IW_AT && marks === 'all');
    if (dark !== document.body.classList.contains('dark')) { if (snapNext) document.body.classList.add('snap'); document.body.classList.toggle('dark', dark); }
    if (want === side && !snapNext) return;
    if (snapNext) document.body.classList.add('snap');
    side = want; layoutSide(); document.body.classList.toggle('side', want);
    if (snapNext) { void document.body.offsetWidth; requestAnimationFrame(() => document.body.classList.remove('snap')); setTimeout(() => document.body.classList.remove('snap'), 60); snapNext = false; }
  }
  setInterval(syncSide, 120);
  addEventListener('resize', layoutSide);
  window.presoPrev = () => {
    if (state === 0) return false;
    if (queued > 0) { queued--; return true; }   // a queued forward tap is simply taken back
    if (grown() && !landed) return true;     // same during the grow-in
    if (grown() && inner('presoPrev')) return true;   // 13 stepped back a beat
    clearTimeout(timer);                     // 13 is at its start (or we never got there): back into the sheet
    state = 0; document.body.classList.remove('grown', 'shift'); place();
    return true;
  };
})();
</script>
