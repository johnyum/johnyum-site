<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>01</title>
<!-- Slide template. Duplicate this file per slide (02.html, 03.html …), build
     anything in it — the deck shows it full-bleed; the viewport is the slide.
     Self-contained: inline CSS/JS only, like every page in this repo.
     The 'Work 2026' kicker + counter are DECK chrome (../index.html), not the
     slide's. A slide that tap-steps its own builds defines window.presoNext /
     presoPrev (return true = consumed, false = deck advances) — see the deck.

     Deck typefaces (self-hosted in preso/fonts/, OFL):
       'Anton'                        — the headline face (one weight, 400)
       'IBM Plex Mono'                — SECONDARY type: labels, captions, annotations
                                        (400 + italic, 500, 700)
       'Special Gothic Condensed One' — alternate display face (one weight, 400)
       'Instrument Sans'              — supporting text; VARIABLE: weight 400–700,
                                        width 75%–100% (font-stretch), + italic
     font-display: block — a deck must never flash fallback type mid-present. -->
<style>
  @font-face {
    font-family: "Anton";
    src: url("../fonts/Anton.woff2") format("woff2");
    font-weight: 400;
    font-display: block;
  }
  @font-face {
    font-family: "Special Gothic Condensed One";
    src: url("../fonts/SpecialGothicCondensedOne.woff2") format("woff2");
    font-weight: 400;
    font-display: block;
  }
  @font-face {
    font-family: "Instrument Sans";
    src: url("../fonts/InstrumentSans-VF.woff2") format("woff2");
    font-weight: 400 700;
    font-stretch: 75% 100%;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "Instrument Sans";
    src: url("../fonts/InstrumentSans-Italic-VF.woff2") format("woff2");
    font-weight: 400 700;
    font-stretch: 75% 100%;
    font-style: italic;
    font-display: block;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../fonts/IBMPlexMono-Regular.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: block;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../fonts/IBMPlexMono-Italic.woff2") format("woff2");
    font-weight: 400; font-style: italic; font-display: block;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../fonts/IBMPlexMono-Medium.woff2") format("woff2");
    font-weight: 500; font-style: normal; font-display: block;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../fonts/IBMPlexMono-Bold.woff2") format("woff2");
    font-weight: 700; font-style: normal; font-display: block;
  }

  html, body {
    margin: 0; height: 100%;
    background: #fff; color: #111;
    font-family: "Instrument Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .slide {
    height: 100%;
    display: grid;
    place-items: center;
  }
  /* the headline voice — swap the family here to try the alternates:
     "Anton"  |  "Special Gothic Condensed One" */
  h1 {
    font-family: "Anton", "Helvetica Neue", sans-serif;
    font-weight: 400;
    font-size: clamp(128px, 24vw, 320px);
    line-height: 1;
    letter-spacing: 0;
    text-transform: uppercase;
    margin: 0;
  }
  /* the secondary voice — labels, captions, annotations */
  .mono, code, kbd, samp {
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
</style>
</head>
<body>
  <div class="slide">
    <h1>Hi,</h1>
  </div>
</body>
</html>
