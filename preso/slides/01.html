<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>01</title>
<!-- Slide template. Duplicate this file per slide (02.html, 03.html …), build
     anything in it — the deck shows it full-bleed; the viewport is the slide.
     Self-contained: inline CSS/JS only, like every page in this repo.
     The 'Work 2026' kicker + counter are DECK chrome (../index.html), not the
     slide's. A slide that tap-steps its own builds defines window.presoNext /
     presoPrev (return true = consumed, false = deck advances) — see the deck.

     Deck typefaces (self-hosted in preso/fonts/, OFL):
       'Anton'                        — the headline face (one weight, 400)
       'IBM Plex Mono'                — SECONDARY type: labels, captions, annotations
                                        (400 + italic, 500, 700)
       'Special Gothic Condensed One' — alternate display face (one weight, 400)
       'Instrument Sans'              — supporting text; VARIABLE: weight 400–700,
                                        width 75%–100% (font-stretch), + italic
     font-display: block — a deck must never flash fallback type mid-present. -->
<style>
  @font-face {
    font-family: "Anton";
    src: url("../fonts/Anton.woff2") format("woff2");
    font-weight: 400;
    font-display: block;
  }
  @font-face {
    font-family: "Special Gothic Condensed One";
    src: url("../fonts/SpecialGothicCondensedOne.woff2") format("woff2");
    font-weight: 400;
    font-display: block;
  }
  @font-face {
    font-family: "Instrument Sans";
    src: url("../fonts/InstrumentSans-VF.woff2") format("woff2");
    font-weight: 400 700;
    font-stretch: 75% 100%;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "Instrument Sans";
    src: url("../fonts/InstrumentSans-Italic-VF.woff2") format("woff2");
    font-weight: 400 700;
    font-stretch: 75% 100%;
    font-style: italic;
    font-display: block;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../fonts/IBMPlexMono-Regular.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: block;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../fonts/IBMPlexMono-Italic.woff2") format("woff2");
    font-weight: 400; font-style: italic; font-display: block;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../fonts/IBMPlexMono-Medium.woff2") format("woff2");
    font-weight: 500; font-style: normal; font-display: block;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../fonts/IBMPlexMono-Bold.woff2") format("woff2");
    font-weight: 700; font-style: normal; font-display: block;
  }

  html, body {
    margin: 0; height: 100%;
    background: #fff; color: #111;
    font-family: "Instrument Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .slide {
    height: 100%;
    display: grid;
    place-items: center;
  }
  /* HELLO! FILLS THE STAGE, and stops at the deck's chrome. index.html puts
     #kicker at top:32px and #counter at bottom:32px, both 12px on a
     line-height of 1, so the chrome owns the first and last 44px. 76px of
     clearance leaves 32px of air between the word and each of them — enough
     that they read as separate things rather than a near miss. */
  h1 {
    margin: 0;
    display: block;
    width: 92vw;
    height: calc(100vh - 152px);
  }
  h1 svg { display: block; width: 100%; height: 100%; }
  h1 text {
    font-family: "Anton", "Helvetica Neue", sans-serif;
    font-weight: 400;
    letter-spacing: -0.02em;   /* -2% */
    fill: #111;
  }
  /* the headline voice — swap the family here to try the alternates:
     "Anton"  |  "Special Gothic Condensed One" */
  h1 {
    font-family: "Anton", "Helvetica Neue", sans-serif;
    font-weight: 400;
    font-size: clamp(128px, 24vw, 320px);
    line-height: 1;
    letter-spacing: -0.02em;   /* -2% */
    margin: 0;
  }
  /* the secondary voice — labels, captions, annotations */
  .mono, code, kbd, samp {
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
</style>
</head>
<body>
  <div class="slide">
    <h1><svg id="hello" role="img" aria-label="Hello!"
             preserveAspectRatio="xMidYMid meet" viewBox="0 0 100 100">
      <text x="0" y="0" font-size="100">Hello!</text>
    </svg></h1>
  </div>
<script>
(() => {
  // THE VIEWBOX IS THE WORD'S INK, MEASURED. A font-size cannot fill a box on
  // its own: the em box carries ascender and descender room this word does not
  // use — "Hello!" has no descender at all — so type sized to the box always
  // sits high in it with a band of nothing underneath. Measuring the actual
  // ink and making THAT the viewBox hands the fitting to preserveAspectRatio,
  // which lands it exactly, centred, at any stage size, with no magic number
  // for the cap height and no second guess about the baseline.
  //
  // canvas rather than a DOM measurement because it reports the ink box
  // directly — actualBoundingBox* is the painted extent, not the line box —
  // and because it works while the deck has the slide PARKED, where a layout
  // read measures zero and requestAnimationFrame never runs.
  const svg = document.getElementById('hello');
  const t = svg.querySelector('text');
  const WORD = 'Hello!';

  function fit() {
    const c = document.createElement('canvas').getContext('2d');
    c.font = '400 100px Anton, sans-serif';
    try { c.letterSpacing = '-0.02em'; } catch (_) {}   // match the CSS; ignored where unsupported
    const m = c.measureText(WORD);
    const l = m.actualBoundingBoxLeft, r = m.actualBoundingBoxRight;
    const a = m.actualBoundingBoxAscent, d = m.actualBoundingBoxDescent;
    const w = l + r, h = a + d;
    if (!(w > 0 && h > 0)) return false;
    // the text sits with its baseline on the origin, so the ink runs from
    // -left to +right across and -ascent to +descent down.
    svg.setAttribute('viewBox', (-l) + ' ' + (-a) + ' ' + w + ' ' + h);
    return true;
  }

  fit();
  // Anton is font-display: block, so the first read can land on nothing.
  if (document.fonts && document.fonts.ready) {
    document.fonts.load('400 100px Anton').catch(() => {}).then(() => fit());
    document.fonts.ready.then(fit).catch(() => {});
  }
})();
</script>
</body>
</html>
