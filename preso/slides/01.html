<!-- Slide template. Duplicate this file per slide (02.html, 03.html …), build
     anything in it — the deck shows it full-bleed; the viewport is the slide.
     Self-contained: inline CSS/JS only, like every page in this repo. -->
<style>
  html, body {
    margin: 0; height: 100%;
    background: #fff; color: #111;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    letter-spacing: -0.01em;
    overflow: hidden;
  }
  .slide {
    height: 100%;
    display: grid;
    place-items: center;
  }
  h1 { font-size: 48px; font-weight: 500; margin: 0; }
</style>
</head>
<body>
  <div class="slide">
    <h1>John Yum</h1>
  </div>
