<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>01</title>
<!-- Slide template. Duplicate this file per slide (02.html, 03.html …), build
     anything in it — the deck shows it full-bleed; the viewport is the slide.
     Self-contained: inline CSS/JS only, like every page in this repo.
     The 'Work 2026' kicker + counter are DECK chrome (../index.html), not the
     slide's. A slide that tap-steps its own builds defines window.presoNext /
     presoPrev (return true = consumed, false = deck advances) — see the deck.

     Deck typefaces (self-hosted in preso/fonts/, OFL):
       'Anton'                        — the headline face (one weight, 400)
       'IBM Plex Mono'                — SECONDARY type: labels, captions, annotations
                                        (400 + italic, 500, 700)
       'Special Gothic Condensed One' — alternate display face (one weight, 400)
       'Instrument Sans'              — supporting text; VARIABLE: weight 400–700,
                                        width 75%–100% (font-stretch), + italic
     font-display: block — a deck must never flash fallback type mid-present. -->
<style>
  @font-face {
    font-family: "Anton";
    src: url("../fonts/Anton.woff2") format("woff2");
    font-weight: 400;
    font-display: block;
  }
  @font-face {
    font-family: "Special Gothic Condensed One";
    src: url("../fonts/SpecialGothicCondensedOne.woff2") format("woff2");
    font-weight: 400;
    font-display: block;
  }
  @font-face {
    font-family: "Instrument Sans";
    src: url("../fonts/InstrumentSans-VF.woff2") format("woff2");
    font-weight: 400 700;
    font-stretch: 75% 100%;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "Instrument Sans";
    src: url("../fonts/InstrumentSans-Italic-VF.woff2") format("woff2");
    font-weight: 400 700;
    font-stretch: 75% 100%;
    font-style: italic;
    font-display: block;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../fonts/IBMPlexMono-Regular.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: block;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../fonts/IBMPlexMono-Italic.woff2") format("woff2");
    font-weight: 400; font-style: italic; font-display: block;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../fonts/IBMPlexMono-Medium.woff2") format("woff2");
    font-weight: 500; font-style: normal; font-display: block;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../fonts/IBMPlexMono-Bold.woff2") format("woff2");
    font-weight: 700; font-style: normal; font-display: block;
  }

  html, body {
    margin: 0; height: 100%;
    background: #000; color: #fff;   /* INVERSE (John, 2026-10-01): black, Hello! in white; presoDark turns the deck's chrome white */
    font-family: "Instrument Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .slide {
    height: 100%;
    display: grid;
    place-items: center;
  }
  /* HELLO! FILLS THE STAGE, and stops at the deck's chrome. index.html puts
     #kicker at top:32px and #counter at bottom:32px, both 12px on a
     line-height of 1, so the chrome owns the first and last 44px. 76px of
     clearance leaves 32px of air between the word and each of them — enough
     that they read as separate things rather than a near miss. */
  h1 {
    margin: 0;
    display: block;
    width: 92vw;
    height: calc(100vh - 152px);
  }
  h1 svg { display: block; width: 100%; height: 100%; }
  h1 text {
    font-family: "Anton", "Helvetica Neue", sans-serif;
    font-weight: 400;
    letter-spacing: -0.02em;   /* -2% */
    fill: #fff;
  }
  /* the headline voice — swap the family here to try the alternates:
     "Anton"  |  "Special Gothic Condensed One" */
  h1 {
    font-family: "Anton", "Helvetica Neue", sans-serif;
    font-weight: 400;
    font-size: clamp(128px, 24vw, 320px);
    line-height: 1;
    letter-spacing: -0.02em;   /* -2% */
    margin: 0;
  }
  /* the secondary voice — labels, captions, annotations */
  .mono, code, kbd, samp {
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
</style>
</head>
<body>
  <div class="slide">
    <h1><svg id="hello" role="img" aria-label="Hello!"
             preserveAspectRatio="xMidYMid meet" viewBox="0 0 100 100">
      <text x="0" y="0" font-size="100">Hello!</text>
    </svg></h1>
  </div>
<script>
(() => {
  // THE VIEWBOX IS THE WORD'S INK, MEASURED. A font-size cannot fill a box on
  // its own: the em box carries ascender and descender room this word does not
  // use — "Hello!" has no descender at all — so type sized to the box always
  // sits high in it with a band of nothing underneath. Measuring the actual
  // ink and making THAT the viewBox hands the fitting to preserveAspectRatio,
  // which lands it exactly, centred, at any stage size, with no magic number
  // for the cap height and no second guess about the baseline.
  //
  // canvas rather than a DOM measurement because it reports the ink box
  // directly — actualBoundingBox* is the painted extent, not the line box —
  // and because it works while the deck has the slide PARKED, where a layout
  // read measures zero and requestAnimationFrame never runs.
  const svg = document.getElementById('hello');
  const t = svg.querySelector('text');
  const WORD = 'Hello!';
  window.presoDark = true;   // the deck's kicker and section names go white over this slide

  function fit() {
    const c = document.createElement('canvas').getContext('2d');
    c.font = '400 100px Anton, sans-serif';
    try { c.letterSpacing = '-0.02em'; } catch (_) {}   // match the CSS; ignored where unsupported
    const m = c.measureText(WORD);
    const l = m.actualBoundingBoxLeft, r = m.actualBoundingBoxRight;
    const a = m.actualBoundingBoxAscent, d = m.actualBoundingBoxDescent;
    const w = l + r, h = a + d;
    if (!(w > 0 && h > 0)) return false;
    // the text sits with its baseline on the origin, so the ink runs from
    // -left to +right across and -ascent to +descent down.
    svg.setAttribute('viewBox', (-l) + ' ' + (-a) + ' ' + w + ' ' + h);
    return true;
  }

  fit();
  // Anton is font-display: block, so the first read can land on nothing.
  if (document.fonts && document.fonts.ready) {
    document.fonts.load('400 100px Anton').catch(() => {}).then(() => { fit(); build(); });
    document.fonts.ready.then(() => { fit(); build(); }).catch(() => {});
  }

  // ── THE PARTICLES (John, 2026-10-01) ─────────────────────────────────────────────────────────────────────────────
  // A HALFTONE THAT RIPPLES. The word is a field of white dots — a halftone of itself, sampled off its own glyphs,
  // and it stays one, moving or still. Hover, and the dots under the cursor swell softly (it was
  // a magnifying lens that bulged the print; too much, John said — the ripple stays, the cursor is quiet). Moving drops ripples that run out
  // across the whole word, each crest lifting the dots outward and growing them as it passes. Leave, and the
  // swell relaxes and the rings die away into the still halftone.
  //
  // White, and round, only (John's two rules). Nothing is pushed out of the way, so nothing opens up: a first pass
  // that shoved particles off the cursor left a black hole in the word, and was thrown out. Every dot's place is
  // WORKED OUT each frame from where it lives — the lens and the rings are functions of distance, not forces — so the
  // word can never jam, tear or leave a gap, and it costs one path and one fill a frame.
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas = document.createElement('canvas');
  canvas.style.cssText = 'position:fixed;inset:0;pointer-events:none';
  const ctx = canvas.getContext('2d');
  let dots = [], bbox = null, raf = null, built = false, dpr = 1;
  let font = '', ox = 0, oy = 0, gap = 6, LENS = 120, unit = 1;
  // the lens: where it is, where it is heading, how strong it is
  const lens = { x: 0, y: 0, tx: 0, ty: 0, k: 0, on: false };
  let rings = [], lastRing = 0, lastX = 0, lastY = 0;

  function setupText(c) {
    c.font = font;
    try { c.letterSpacing = '-0.02em'; } catch (_) {}
    c.textAlign = 'left'; c.textBaseline = 'alphabetic';
    c.fillStyle = '#fff';
  }

  // where the SVG put the word: its viewBox is the ink, fitted by xMidYMid meet
  function placement() {
    const r = svg.getBoundingClientRect();
    const vb = svg.viewBox.baseVal;
    if (!(r.width > 0 && r.height > 0 && vb && vb.width > 0)) return null;
    const k = Math.min(r.width / vb.width, r.height / vb.height);
    const offX = r.left + (r.width - vb.width * k) / 2, offY = r.top + (r.height - vb.height * k) / 2;
    return { k, x: offX - vb.x * k, y: offY - vb.y * k, ink: { left: offX, top: offY, right: offX + vb.width * k, bottom: offY + vb.height * k } };
  }

  function build() {
    if (REDUCED) return;
    const pl = placement();
    if (!pl) return;                                     // parked: measures zero — the ResizeObserver comes back
    dpr = Math.min(devicePixelRatio || 1, 2);
    const W = innerWidth, H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const fontPx = 100 * pl.k;
    font = `400 ${fontPx}px Anton, sans-serif`;
    ox = pl.x; oy = pl.y;
    unit = fontPx / 400;                                 // everything below is tuned on a 400px word
    gap = Math.max(4, Math.round(fontPx / 70));          // ~70 dots up the height of a letter (twice as many was tried, and dropped)
    LENS = 110 * unit;

    const off = document.createElement('canvas');
    off.width = W * dpr; off.height = H * dpr;
    const o = off.getContext('2d', { willReadFrequently: true });
    o.setTransform(dpr, 0, 0, dpr, 0, 0);
    setupText(o);
    o.fillText(WORD, ox, oy);
    const ink = pl.ink;
    bbox = { left: ink.left, top: ink.top, right: ink.right, bottom: ink.bottom };
    const data = o.getImageData(0, 0, off.width, off.height).data;
    dots = [];
    for (let y = ink.top + gap / 2; y < ink.bottom; y += gap)
      for (let x = ink.left + gap / 2; x < ink.right; x += gap) {
        const a = data[(((y * dpr) | 0) * off.width + ((x * dpr) | 0)) * 4 + 3];
        // a halftone: the dot's size carries the glyph's coverage, so the edges are smaller dots, not jaggies
        if (a > 24) dots.push({ x, y, r: gap * 0.44 * Math.sqrt(a / 255) });
      }
    if (!built) { document.body.appendChild(canvas); t.style.fill = 'transparent'; built = true; }   // the SVG stays for the reader
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    drawRest();
  }

  // AT REST IT STAYS DOTS (John, 2026-10-01: "keep it at the particle state, not the vector Hello!") — the still
  // halftone is the slide; the solid word is never drawn.
  function drawRest() { draw(0, false); }

  function tick(now) {
    const s = now / 1000;
    // the lens eases after the cursor and in and out of being
    lens.x += (lens.tx - lens.x) * 0.22; lens.y += (lens.ty - lens.y) * 0.22;
    lens.k += ((lens.on ? 1 : 0) - lens.k) * (lens.on ? 0.14 : 0.08);
    rings = rings.filter(r => s - r.t < 1.8);
    if (!(lens.on || lens.k > 0.004 || rings.length)) { raf = null; lens.k = 0; drawRest(); return; }
    draw(s, true);
    raf = requestAnimationFrame(tick);
  }

  function draw(s, moving) {
    const R = LENS, NUDGE = 5 * unit, SWELL = 0.4;
    const SPEED = 520 * unit, WAVE = 46 * unit, LIFT = 9 * unit;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    for (let i = 0; i < dots.length; i++) {
      const p = dots[i];
      let x = p.x, y = p.y, sc = 1;
      // ripples: a travelling crest, damped with age, held to a band around its front
      if (moving) for (let j = 0; j < rings.length; j++) {
        const g = rings[j], age = s - g.t;
        const dx = x - g.x, dy = y - g.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
        const front = d - SPEED * age, band = Math.exp(-(front * front) / (WAVE * WAVE * 1.4));
        if (band < 0.01) continue;
        const w = Math.sin(front / WAVE * Math.PI) * band * g.a * Math.exp(-age * 1.6);
        x += dx / d * w * LIFT; y += dy / d * w * LIFT; sc *= 1 + 0.45 * Math.max(0, w);
      }
      // the cursor: a soft swell, not a lens — the dots under it grow a little and lean a touch away, smoothly
      // falling off to nothing at R (John: "keep the ripple but give me a more subtle cursor")
      if (moving && lens.k > 0.004) {
        const dx = x - lens.x, dy = y - lens.y, d2 = dx * dx + dy * dy;
        if (d2 < R * R) {
          const f = 1 - d2 / (R * R), w = f * f * lens.k;   // smooth bump, 1 at the centre
          const d = Math.sqrt(d2) || 1;
          x += dx / d * w * NUDGE; y += dy / d * w * NUDGE; sc *= 1 + SWELL * w;
        }
      }
      const r = p.r * sc;
      ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, 6.2832);
    }
    ctx.fill();
  }

  function wake() { if (!raf) raf = requestAnimationFrame(tick); }
  function pointer(x, y) {
    if (!built) return;
    if (x === null) { lens.on = false; return; }
    const pad = LENS * 0.6;
    const near = !!bbox && x > bbox.left - pad && x < bbox.right + pad && y > bbox.top - pad && y < bbox.bottom + pad;
    if (near && !lens.on) { lens.x = x; lens.y = y; }    // the lens opens where the cursor is, not sliding in from the last place
    lens.on = near; lens.tx = x; lens.ty = y;
    if (near) {
      // a ring every so often while moving, stronger the faster
      const now = performance.now() / 1000, mv = Math.hypot(x - lastX, y - lastY);
      if (now - lastRing > 0.11 && mv > 2) {
        rings.push({ x, y, t: now, a: Math.min(1, 0.35 + mv / (60 * unit)) });
        if (rings.length > 10) rings.shift();
        lastRing = now;
      }
      wake();
    } else if (lens.k > 0.004 || rings.length) wake();
    lastX = x; lastY = y;
  }
  window.presoPointer = pointer;                         // the deck hands the cursor over its tap rails
  if (window === window.top) {                           // on its own, outside the deck
    addEventListener('mousemove', e => pointer(e.clientX, e.clientY));
    document.documentElement.addEventListener('mouseleave', () => pointer(null, null));
  }
  let rt = 0;
  new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(() => { fit(); build(); }, 150); }).observe(document.body);
})();
</script>
</body>
</html>
