<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12c</title>
<!-- THE BIG WEB BUILD (John, 2026-09-22). After the four-up: the desktop Multi-Host Calendar — /multi/, the web app the iOS
     replica was made from — live and tappable, in a bounding box at a fixed 0.66 scale — its window as wide as the stage allows — 40 clear of the deck's type above and below, 32 of the edges. No build here: the deck
     pushes straight through. -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  .box { position: relative; flex: none; width: 1920px; height: 900px; transform-origin: center; border-radius: 32px; overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 24px 60px rgba(0,0,0,.14); background: #fff; }
  .box iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; opacity: 0; transition: opacity .25s ease; }   /* unseen until it stands pristine: the build boots on its own default first */
  .box iframe.ready { opacity: 1; }
</style>
</head>
<body>
  <div class="stage"><div class="box" id="box"><iframe id="app" title="Multi-Host Calendar — the web build"></iframe></div></div>
<script>
(() => {
  window.presoInteractive = true;   // the calendar is the product: tappable; the rails and the keys drive the deck
  const v = new URLSearchParams(location.search).get('v');
  const app = document.getElementById('app');
  app.src = '/multi/' + (v ? '?v=' + v : '');
  // THE BOX KEEPS ITS DISTANCE from the deck's own type: 40 under the kicker ("John Yum · Work") and 40 above the counter
  // ("16 / 16") — read from the deck itself, so the band the box fills is exactly what those two leave (John, 2026-09-22).
  const box = document.getElementById('box');
  const fit = () => {
    let top = 56, bottom = innerHeight - 56;
    try { const pd = window.parent.document, k = pd.getElementById('kicker'), c = pd.getElementById('counter'); if (k) top = k.getBoundingClientRect().bottom + 40; if (c) bottom = c.getBoundingClientRect().top - 40; } catch (_) {}
    // 32 at the sides too: the box is 1920 wide (John, 2026-09-22: a wider window shows more dates and rows) scaled to the width less 64, and as TALL as the band leaves — the web app
    // fills whatever height it is given — so the 32 above and below always hold, whatever the stage's shape
    // THE SCALE IS FIXED (John, 2026-09-22): the build always shows at 0.66 — a touch larger than the Claude pane's 0.55, which read small on a big Chrome window (John) — where it looked
    // right — and its WINDOW grows with the screen instead: as wide as the stage less 64 and as tall as the band leave, both
    // divided by the scale. A wider screen shows more dates and rows, never bigger cells; the 40 above and below and the 32 at
    // the sides always hold.
    const S = 0.66, bandH = Math.max(200, bottom - top);
    box.style.width = ((innerWidth - 64) / S).toFixed(1) + 'px';
    box.style.height = (bandH / S).toFixed(1) + 'px';
    box.style.transform = `translateY(${((top + bottom) / 2 - innerHeight / 2).toFixed(1)}px) scale(${S})`;
  };
  fit(); addEventListener('resize', fit); setTimeout(fit, 300);

  // THE FLOW (John, 2026-09-22). The web build opens PRISTINE — its own New Host mode: every night at base rate, no bookings,
  // so no guest pills and none of a guest's questions — 32 homes, ungrouped; its dev bar and its tips pill put away. The beats
  // below step it on.
  const W = () => app.contentWindow;
  app.addEventListener('load', () => {
    const w = W(), d = w.document;
    const seal = d.createElement('style');
    d.body.classList.add('preso-no-tips');   // the Tips button waits for its beat
    seal.textContent = '#devBar{display:none!important}' + 'body.preso-no-tips #magicPill{display:none!important}'
      // THE PRESO'S OWN DENSITY (John, 2026-09-22): the 32-home rows 56 → 48 here only — the build at /multi/ is untouched. The
      // cell is 100% of its row and the pill centres geometrically, so card, pill, thumbnail column and the Pricing/Availability
      // rows all follow, per the build's own row-height contract.
      + 'body.host-pro:not(.settings-mode):not(.avail-mode):not(.super-collapse-2) .price-row{height:48px}'
      + 'body.host-pro:not(.super-collapse-2) .thumb-row{height:48px}'
      + 'body.host-pro .settings-row{height:48px}'
      // the beats' own looks: a menu item's press, and the guests' entrance
      + '.tb-menu-item.pressing{background:var(--grey-200,#e8e8e8)}.ma-action.pressing,.ma-price.pressing,#priceMenuApply.pressing,.magic-cta.pressing,#magicPill [data-magic].pressing,#lmUpsellOn.pressing{opacity:.6}'
      // no guest's question in this build: the "Kofi is asking…" bubbles and their unread dots stay away (John, 2026-09-22)
      + '.bp-ask{display:none!important}.bp-unread{display:none!important}.booking-face.has-ask::after{display:none!important}'
      // and no season-wand toggle — the empty green circle left of Apply on an event's or season's opportunity (John, 2026-09-22)
      + '.mopp-wandbtn{display:none!important}'
      + '@keyframes preso-pill-in{from{opacity:0;transform:translateY(-50%) scale(.92)}to{opacity:1;transform:translateY(-50%) scale(1)}}'
      + 'body.preso-pills-in .booking-pill{animation:preso-pill-in .5s cubic-bezier(.2,.8,.2,1) both}';
    d.head.appendChild(seal);
    // 32 homes, ungrouped, New Host: the pro tier, the city groups off, then the fresh sheet (John, 2026-09-22)
    try { w.switchHost('pro', true); } catch (_) {}
    try { w.autoGroupByCity(false); } catch (_) {}
    try { w.setDataMode('none', true); } catch (_) {}
    // ON TODAY, INSTANTLY. The build's own scrollCalendarToToday always glides (it is the Today button's), and a glide queued
    // while this pane stood hidden played out as the slide came in — the "weird animation". The boot's own instant landing is
    // used instead (a straight scrollLeft), and the glide is replaced for this copy so nothing in it ever slides to today.
    const landToday = () => { try { w.eval("gridWrap.scrollLeft = Math.max(0, (rowOffsets[calStartDi()] || 0) - GRID_GUTTER); gridWrap.scrollTop = 0;"); } catch (_) {} };
    try { w.scrollCalendarToToday = landToday; } catch (_) {}
    setTimeout(landToday, 60);
    // ONLY THE PRISTINE STATE IS EVER SEEN (John, 2026-09-22): the build boots on its own default — twelve homes, guests in — and
    // is switched over here; it stays unseen until that has landed, then fades in standing at 32 homes, base rate, no pills.
    setTimeout(() => { try { w.setDataMode('none', true); w.autoGroupByCity(false); } catch (_) {} landToday(); requestAnimationFrame(() => requestAnimationFrame(() => { landToday(); app.classList.add('ready'); })); }, 260);
    // the deck's keys keep working with focus inside the build
    const NAV = new Set(['ArrowRight', 'ArrowLeft', 'ArrowUp', 'ArrowDown', ' ', 'Enter', 'PageUp', 'PageDown', 'Home', 'End', 'f', 'F']);
    // CAPTURED, and stopped: the build has arrow keys of its own (they page the dates), and with focus inside the frame a
    // clicker press was driving both — the deck AND the calendar. The deck's keys never reach the build now (John, 2026-09-22).
    // ALWAYS — even with one of the build's inputs focused (the Price menu focuses its field as it opens, and that once left the
    // clicker dead from that beat on): nothing in this flow is typed by the presenter, so every deck key goes up (John, 2026-09-22).
    w.addEventListener('keydown', e => { if (!NAV.has(e.key) || !e.isTrusted) return; e.preventDefault(); e.stopImmediatePropagation(); window.top.dispatchEvent(new KeyboardEvent('keydown', { key: e.key, code: e.code, bubbles: true })); }, true);
  });

  // THE BEATS (John, 2026-09-22). Each has a forward (live, or instant for a replay) and a back. They call the build's own
  // functions, so every step is the product's own state change.
  const ev = (w, code) => { try { return w.eval(code); } catch (_) { return undefined; } };
  const BEATS = [
    // 1 — the ⋯ menu, opened; Group, taken: the rows re-sort into their cities with the build's own FLIP — tiles trading
    //     places round by round — and NOT its thinking dots (applyGroupingLive, not animateGroupsByCity)
    { fwd: (w, instant) => {
        const d = w.document, menu = d.getElementById('tbMenu');
        if (instant) { ev(w, "groups.length = 0; smartGroups().forEach(g => groups.push(g)); saveGroups(); renderGroups(); applyGroupsToCalendar();"); return; }
        d.getElementById('tbMoreBtn').click();                                   // the menu drops
        setTimeout(() => { const item = d.querySelector('[data-more="grouping"]'); if (item) item.classList.add('pressing'); }, 700);
        setTimeout(() => { menu.classList.remove('open'); d.getElementById('tbMoreBtn').setAttribute('aria-expanded', 'false'); ev(w, "applyGroupingLive()"); }, 900);
      },
      back: w => { ev(w, "groups.length = 0; groups.push({ name: 'Group 1', members: [] }); saveGroups(); renderGroups(); applyGroupsToCalendar();"); } },
    // 2 — the guests come in: bookings on (the build's own toggle), every pill fading up into its row
    { fwd: (w, instant) => {
        const d = w.document, bk = d.getElementById('devBookings');
        if (!instant) { d.body.classList.add('preso-pills-in'); setTimeout(() => d.body.classList.remove('preso-pills-in'), 1400); }
        bk.checked = true; bk.dispatchEvent(new w.Event('change'));
      },
      back: w => { const d = w.document, bk = d.getElementById('devBookings'); bk.checked = false; bk.dispatchEvent(new w.Event('change')); } },
    // 3 — a big swath of nights, selected: the first ten homes across the next two weeks, the rectangle growing a column at a
    //     time like a drag (the build's own selectRange: rows in their visual order, the open nights only), then its bar
    { fwd: (w, instant) => {
        const pick = k => ev(w, `(() => { const order = [...document.querySelectorAll('#gridRows .price-row')].map(r => +r.dataset.li); const a = { li: order[0], di: todayDi + 1 }, b = { li: order[Math.min(9, order.length - 1)], di: todayDi + 1 + ${k} }; selectRange(a, b); selAnchor = a; })()`);
        if (instant) { pick(13); return; }
        for (let k = 0; k <= 13; k++) setTimeout(() => pick(k), 120 + k * 45);
      },
      back: w => { ev(w, "clearSelection()"); } },
    // 4 — Availability, tapped (its menu drops); then Price, tapped (its menu takes over); then $250 typed into it, a digit at a
    //     time — the build applies each keystroke live, every selected night rolling from $200 to $250
    { fwd: (w, instant) => {
        const d = w.document;
        if (instant) { ev(w, "selectedLiDi().forEach(({ li, di }) => { priceOverride[li][di] = 250; }); refreshCalendarPrices();"); return; }
        const press = sel => { const b = d.querySelector(sel); if (b) { b.classList.add('pressing'); setTimeout(() => b.classList.remove('pressing'), 440); } };
        setTimeout(() => { press('#maPill [data-act="edit-avail"]'); }, 0);
        setTimeout(() => ev(w, "openAvailMenu()"), 130);
        setTimeout(() => { press('#maPill [data-act="edit-price"]'); }, 1400);
        setTimeout(() => ev(w, "openPriceMenu()"), 1530);
        const inp = () => d.getElementById('priceMenuInput'), set = Object.getOwnPropertyDescriptor(w.HTMLInputElement.prototype, 'value').set;
        ['2', '25', '250'].forEach((v, i) => setTimeout(() => { const el = inp(); if (!el) return; set.call(el, '$' + v); el.dispatchEvent(new w.Event('input', { bubbles: true })); if (i === 2) setTimeout(() => { try { el.blur(); } catch (_) {} }, 200); }, 2300 + i * 160));   // and the field lets go once the figure is in
      },
      back: w => { ev(w, "closePriceMenu(); closeAvailMenu(); selectedLiDi().forEach(({ li, di }) => { delete priceOverride[li][di]; }); refreshCalendarPrices();"); } },
    // 5 — Save, tapped: the price menu closes and the selection lets go, the bar folding away; a beat after it has gone, the Tips
    //     button comes in at the bottom middle with its own pop
    { fwd: (w, instant) => {
        const d = w.document;
        const tips = () => { d.body.classList.remove('preso-no-tips'); try { w._oppWandEnter = true; w.renderMagicPill(); } catch (_) {} };
        if (instant) { ev(w, "closePriceMenu(); clearSelection();"); tips(); return; }
        const b = d.getElementById('priceMenuApply'); if (b) { b.classList.add('pressing'); setTimeout(() => b.classList.remove('pressing'), 440); }
        setTimeout(() => ev(w, "closePriceMenu(); clearSelection();"), 130);
        setTimeout(tips, 130 + 900);
      },
      back: w => { const d = w.document; d.body.classList.add('preso-no-tips'); ev(w, "(() => { const order = [...document.querySelectorAll('#gridRows .price-row')].map(r => +r.dataset.li); selectRange({ li: order[0], di: todayDi + 1 }, { li: order[Math.min(9, order.length - 1)], di: todayDi + 14 }); })()"); } },
    // 6 — Tips, tapped: the build's own scan — the cells' stroke sweeps left to right, three dots in the button — and then its
    //     first opportunity
    { fwd: (w, instant) => {
        const d = w.document, btn = d.querySelector('#magicPill [data-magic="go"]');
        if (instant || !btn) { ev(w, "startOptimize()"); return; }
        btn.classList.add('pressing'); setTimeout(() => btn.classList.remove('pressing'), 440);
        setTimeout(() => btn.click(), 130);
      },
      back: w => { ev(w, "exitOptimize()"); } },
    // 7 — Apply, tapped: the last-minute discount goes on and the build's own "Automate last-minute discounts" modal rises;
    //     Turn on, tapped; the modal does its work and goes; a beat; then the › right of the check, the next opportunity
    { fwd: (w, instant) => {
        const d = w.document, press = el => { if (el) { el.classList.add('pressing'); setTimeout(() => el.classList.remove('pressing'), 440); } };
        const when = (cond, then, ms = 8000) => { const t0 = Date.now(); const tick = () => { if (cond()) then(); else if (Date.now() - t0 < ms) setTimeout(tick, 80); else then(); }; tick(); };
        const overlay = () => d.getElementById('lmUpsellOverlay'), up = () => overlay() && overlay().classList.contains('visible');
        const apply = d.querySelector('#magicPill [data-magic="apply"]'); press(apply);
        setTimeout(() => { if (apply) apply.click(); }, 130);
        when(up, () => setTimeout(() => {                                             // the modal is up: a beat, then Turn on
          const on = d.getElementById('lmUpsellOn'); press(on); setTimeout(() => { if (on) on.click(); }, 130);
          when(() => !up(), () => setTimeout(() => {                                    // it has done its work and gone: a beat, then ›
            const next = d.querySelector('#magicPill [data-magic="next"]'); press(next); setTimeout(() => { if (next) next.click(); }, 130);
          }, instant ? 0 : 900));
        }, instant ? 0 : 700));
      },
      back: w => { ev(w, "exitOptimize(); startOptimize();"); } },
    // 8 — the golf tournament's curve, taken by its ⇕ handle: dragged UP until the pill reads +115%, held a beat, brought back
    //     DOWN to +65%, let go; then Apply. The drag is the build's own — pointer events on its master dot, 320px to 100%.
    { fwd: (w, instant) => {
        const d = w.document, press = el => { if (el) { el.classList.add('pressing'); setTimeout(() => el.classList.remove('pressing'), 440); } };
        const dot = () => d.querySelector('.ribbon-master-dot'), pct = () => { const p = d.querySelector('.ribbon-master-dot .rmd-pct'); return p ? parseInt(p.textContent.replace(/[^\d-]/g, ''), 10) : NaN; };
        const applyBtn = () => d.querySelector('#magicPill [data-magic="apply"]');
        if (instant) { const b = applyBtn(); if (b) b.click(); return; }
        let x = 0, y = 0;
        const pe = (type, target, extra) => target.dispatchEvent(new w.PointerEvent(type, Object.assign({ bubbles: true, cancelable: true, pointerId: 1, pointerType: 'mouse', isPrimary: true, clientX: x, clientY: y, button: 0, buttons: 1 }, extra || {})));
        // THE RIBBON REBUILDS ITSELF after the fly-in and as the band scrolls, so the handle is taken only once it has stood
        // still, and taken AGAIN, fresh, if the number stops answering the drag (the old handle was replaced under it)
        const grab = () => { const el = dot(); if (!el) return false; const r = el.getBoundingClientRect(); x = r.left + r.width / 2; y = r.top + r.height / 2; pe('pointerdown', el); return true; };
        const STEP = 3, TICK = 16;   // 3px a frame: ~1% a frame, the numbers counting as it goes
        const glide = (want, dir, then) => { let last = NaN, still = 0, n = 0; const tick = () => {
          const v = pct(); if (isNaN(v) || (dir < 0 ? v >= want : v <= want) || ++n > 600) { then(); return; }
          if (v === last) { if (++still > 12) { pe('pointerup', w, { buttons: 0 }); grab(); still = 0; } } else still = 0; last = v;
          y += dir * STEP; pe('pointermove', w, { buttons: 1 }); setTimeout(tick, TICK); }; tick(); };
        const finish = () => { pe('pointerup', w, { buttons: 0 }); setTimeout(() => { const b = applyBtn(); press(b); setTimeout(() => { if (b) b.click(); }, 130); }, 700); };
        // wait for the handle to stand still (its number unchanged for 400ms), then go
        let seen = NaN, t0 = Date.now(); const ready = () => { const v = pct(); if (!isNaN(v) && v === seen) { if (!grab()) { finish(); return; } glide(115, -1, () => setTimeout(() => glide(65, 1, finish), 900)); return; } seen = v; if (Date.now() - t0 < 12000) setTimeout(ready, 400); else finish(); };
        setTimeout(ready, 400);
      },
      back: w => { ev(w, "exitOptimize(); startOptimize();"); } },
    // 9 — Turn on, tapped, for Automate events and holidays: the build's sweep runs behind the modal, then it goes
    { fwd: (w, instant) => {
        const d = w.document, on = () => d.getElementById('lmUpsellOn'), up = () => { const o = d.getElementById('lmUpsellOverlay'); return !!(o && o.classList.contains('visible')); };
        // a tap that lands while the drag before is still running: wait for the modal to be up (up to 15s), then Turn on
        const t0 = Date.now(); const go = () => { if (!up() && Date.now() - t0 < 15000) { setTimeout(go, 120); return; } const b = on(); if (!b) return; if (instant) { b.click(); return; } b.classList.add('pressing'); setTimeout(() => b.classList.remove('pressing'), 440); setTimeout(() => b.click(), 130); };
        go();
      },
      back: w => { const d = w.document, o = d.getElementById('lmUpsellOverlay'); if (o) o.classList.add('visible'); } },
  ];
  let at = 0, pendingRestore = 0;   // a restore asked for before the build stands ready waits for it, and is applied before any tap
  const runTo = n => { for (; at < Math.min(n, BEATS.length); at++) { const b = BEATS[at]; try { b.fwd(W(), true); } catch (e) { console.warn('beat failed', e); } } };
  const settleRestore = () => { if (pendingRestore && app.classList.contains('ready')) { const n = pendingRestore; pendingRestore = 0; runTo(n); } };
  // a beat that throws must never freeze the deck: the step is counted whatever happened inside it
  const safe = fn => { try { fn(); } catch (e) { console.warn('beat failed', e); } };
  window.presoNext = () => { settleRestore(); if (at >= BEATS.length) return false; const b = BEATS[at]; at++; safe(() => b.fwd(W(), false)); return true; };
  window.presoPrev = () => { settleRestore(); if (at <= 0) return false; at--; safe(() => BEATS[at].back(W())); return true; };
  window.presoEnd = () => { settleRestore(); runTo(BEATS.length); };
  window.presoState = () => Math.max(at, pendingRestore);
  window.presoRestore = n => { pendingRestore = n; settleRestore(); };
  app.addEventListener('load', () => { const tick = () => { if (app.classList.contains('ready')) settleRestore(); else setTimeout(tick, 60); }; tick(); });
})();
</script>
</body>
</html>
