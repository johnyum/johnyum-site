<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12c</title>
<!-- EVERY DATE CELL — one screen, just the cells.

     Between the live build's Zoe beat (12b) and its return (12d): a white sheet of every state a date cell can be in,
     six by six, with the moving ones looping. The cells are the app's own — the sampler page the calendar serves at
     /multical/?sampler=1 renders the real DayCell with the real stylesheet — framed here and scaled to fill the stage.
     No build: the deck pushes straight through. -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .stage { position: fixed; inset: 0; display: grid; place-items: center; }
  /* the sampler page lays out 6 × 6 at 560 wide by 1080 tall; scaled so that fits with room */
  .sheet { position: relative; width: 560px; height: 1080px; transform: scale(var(--s, 1)); transform-origin: center; }
  .sheet iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
</style>
</head>
<body>
  <div class="stage"><div class="sheet" id="sheet"><iframe id="cells" title="Every date cell"></iframe></div></div>
<script>
(() => {
  const v = new URLSearchParams(location.search).get('v');
  document.getElementById('cells').src = '/multical/?sampler=1&preso=1&today=2026-09-09' + (v ? '&v=' + v : '');
  const sheet = document.getElementById('sheet');
  const fit = () => sheet.style.setProperty('--s', Math.min(innerWidth * 0.9 / 560, innerHeight * 0.92 / 1080).toFixed(4));
  fit(); addEventListener('resize', fit);
})();
</script>
</body>
</html>
