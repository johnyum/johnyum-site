<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12c</title>
<!-- THE BIG WEB BUILD (John, 2026-09-22). After the four-up: the desktop Multi-Host Calendar — /multi/, the web app the iOS
     replica was made from — live and tappable, in a bounding box at a fixed 0.66 scale — its window as wide as the stage allows — 40 clear of the deck's type above and below, 32 of the edges. No build here: the deck
     pushes straight through. -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  .box { position: relative; flex: none; width: 1920px; height: 900px; transform-origin: center; border-radius: 32px; overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 24px 60px rgba(0,0,0,.14); background: #fff; }
  .box iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; opacity: 0; transition: opacity .25s ease; }   /* unseen until it stands pristine: the build boots on its own default first */
  .box iframe.ready { opacity: 1; }
</style>
</head>
<body>
  <div class="stage"><div class="box" id="box"><iframe id="app" title="Multi-Host Calendar — the web build"></iframe></div></div>
<script>
(() => {
  window.presoInteractive = true;   // the calendar is the product: tappable; the rails and the keys drive the deck
  const v = new URLSearchParams(location.search).get('v');
  const app = document.getElementById('app');
  app.src = '/multi/' + (v ? '?v=' + v : '');
  // THE BOX KEEPS ITS DISTANCE from the deck's own type: 40 under the kicker ("John Yum · Work") and 40 above the counter
  // ("16 / 16") — read from the deck itself, so the band the box fills is exactly what those two leave (John, 2026-09-22).
  const box = document.getElementById('box');
  const fit = () => {
    let top = 56, bottom = innerHeight - 56;
    try { const pd = window.parent.document, k = pd.getElementById('kicker'), c = pd.getElementById('counter'); if (k) top = k.getBoundingClientRect().bottom + 40; if (c) bottom = c.getBoundingClientRect().top - 40; } catch (_) {}
    // 32 at the sides too: the box is 1920 wide (John, 2026-09-22: a wider window shows more dates and rows) scaled to the width less 64, and as TALL as the band leaves — the web app
    // fills whatever height it is given — so the 32 above and below always hold, whatever the stage's shape
    // THE SCALE IS FIXED (John, 2026-09-22): the build always shows at 0.66 — a touch larger than the Claude pane's 0.55, which read small on a big Chrome window (John) — where it looked
    // right — and its WINDOW grows with the screen instead: as wide as the stage less 64 and as tall as the band leave, both
    // divided by the scale. A wider screen shows more dates and rows, never bigger cells; the 40 above and below and the 32 at
    // the sides always hold.
    const S = 0.66, bandH = Math.max(200, bottom - top);
    box.style.width = ((innerWidth - 64) / S).toFixed(1) + 'px';
    box.style.height = (bandH / S).toFixed(1) + 'px';
    box.style.transform = `translateY(${((top + bottom) / 2 - innerHeight / 2).toFixed(1)}px) scale(${S})`;
  };
  fit(); addEventListener('resize', fit); setTimeout(fit, 300);

  // THE FLOW (John, 2026-09-22). The web build opens PRISTINE — its own New Host mode: every night at base rate, no bookings,
  // so no guest pills and none of a guest's questions — 32 homes, ungrouped; its dev bar and its tips pill put away. The beats
  // below step it on.
  const W = () => app.contentWindow;
  app.addEventListener('load', () => {
    const w = W(), d = w.document;
    const seal = d.createElement('style');
    seal.textContent = '#devBar{display:none!important}' + '#magicPill{display:none!important}'
      // THE PRESO'S OWN DENSITY (John, 2026-09-22): the 32-home rows 56 → 48 here only — the build at /multi/ is untouched. The
      // cell is 100% of its row and the pill centres geometrically, so card, pill, thumbnail column and the Pricing/Availability
      // rows all follow, per the build's own row-height contract.
      + 'body.host-pro:not(.settings-mode):not(.avail-mode):not(.super-collapse-2) .price-row{height:48px}'
      + 'body.host-pro:not(.super-collapse-2) .thumb-row{height:48px}'
      + 'body.host-pro .settings-row{height:48px}'
      // the beats' own looks: a menu item's press, and the guests' entrance
      + '.tb-menu-item.pressing{background:var(--grey-200,#e8e8e8)}'
      + '@keyframes preso-pill-in{from{opacity:0;transform:translateY(-50%) scale(.92)}to{opacity:1;transform:translateY(-50%) scale(1)}}'
      + 'body.preso-pills-in .booking-pill{animation:preso-pill-in .5s cubic-bezier(.2,.8,.2,1) both}';
    d.head.appendChild(seal);
    // 32 homes, ungrouped, New Host: the pro tier, the city groups off, then the fresh sheet (John, 2026-09-22)
    try { w.switchHost('pro', true); } catch (_) {}
    try { w.autoGroupByCity(false); } catch (_) {}
    try { w.setDataMode('none', true); } catch (_) {}
    // ON TODAY, INSTANTLY. The build's own scrollCalendarToToday always glides (it is the Today button's), and a glide queued
    // while this pane stood hidden played out as the slide came in — the "weird animation". The boot's own instant landing is
    // used instead (a straight scrollLeft), and the glide is replaced for this copy so nothing in it ever slides to today.
    const landToday = () => { try { w.eval("gridWrap.scrollLeft = Math.max(0, (rowOffsets[calStartDi()] || 0) - GRID_GUTTER); gridWrap.scrollTop = 0;"); } catch (_) {} };
    try { w.scrollCalendarToToday = landToday; } catch (_) {}
    setTimeout(landToday, 60);
    // ONLY THE PRISTINE STATE IS EVER SEEN (John, 2026-09-22): the build boots on its own default — twelve homes, guests in — and
    // is switched over here; it stays unseen until that has landed, then fades in standing at 32 homes, base rate, no pills.
    setTimeout(() => { try { w.setDataMode('none', true); w.autoGroupByCity(false); } catch (_) {} landToday(); requestAnimationFrame(() => requestAnimationFrame(() => { landToday(); app.classList.add('ready'); })); }, 260);
    // the deck's keys keep working with focus inside the build
    const NAV = new Set(['ArrowRight', 'ArrowLeft', 'ArrowUp', 'ArrowDown', ' ', 'Enter', 'PageUp', 'PageDown', 'Home', 'End', 'f', 'F']);
    w.addEventListener('keydown', e => { if (!NAV.has(e.key) || !e.isTrusted) return; const el = d.activeElement; if (el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName))) return; e.preventDefault(); window.top.dispatchEvent(new KeyboardEvent('keydown', { key: e.key, code: e.code, bubbles: true })); });
  });

  // THE BEATS (John, 2026-09-22). Each has a forward (live, or instant for a replay) and a back. They call the build's own
  // functions, so every step is the product's own state change.
  const ev = (w, code) => { try { return w.eval(code); } catch (_) { return undefined; } };
  const BEATS = [
    // 1 — the ⋯ menu, opened; Group, taken: the rows re-sort into their cities with the build's own FLIP — tiles trading
    //     places round by round — and NOT its thinking dots (applyGroupingLive, not animateGroupsByCity)
    { fwd: (w, instant) => {
        const d = w.document, menu = d.getElementById('tbMenu');
        if (instant) { ev(w, "groups.length = 0; smartGroups().forEach(g => groups.push(g)); saveGroups(); renderGroups(); applyGroupsToCalendar();"); return; }
        d.getElementById('tbMoreBtn').click();                                   // the menu drops
        setTimeout(() => { const item = d.querySelector('[data-more="grouping"]'); if (item) item.classList.add('pressing'); }, 700);
        setTimeout(() => { menu.classList.remove('open'); d.getElementById('tbMoreBtn').setAttribute('aria-expanded', 'false'); ev(w, "applyGroupingLive()"); }, 900);
      },
      back: w => { ev(w, "groups.length = 0; groups.push({ name: 'Group 1', members: [] }); saveGroups(); renderGroups(); applyGroupsToCalendar();"); } },
    // 2 — the guests come in: bookings on (the build's own toggle), every pill fading up into its row
    { fwd: (w, instant) => {
        const d = w.document, bk = d.getElementById('devBookings');
        if (!instant) { d.body.classList.add('preso-pills-in'); setTimeout(() => d.body.classList.remove('preso-pills-in'), 1400); }
        bk.checked = true; bk.dispatchEvent(new w.Event('change'));
      },
      back: w => { const d = w.document, bk = d.getElementById('devBookings'); bk.checked = false; bk.dispatchEvent(new w.Event('change')); } },
  ];
  let at = 0;
  window.presoNext = () => { if (at >= BEATS.length) return false; BEATS[at].fwd(W(), false); at++; return true; };
  window.presoPrev = () => { if (at <= 0) return false; at--; BEATS[at].back(W()); return true; };
  window.presoEnd = () => { for (; at < BEATS.length; at++) BEATS[at].fwd(W(), true); };
  window.presoState = () => at;
  window.presoRestore = n => { const go = () => { if (app.classList.contains('ready')) { for (; at < Math.min(n, BEATS.length); at++) BEATS[at].fwd(W(), true); } else setTimeout(go, 100); }; go(); };
})();
</script>
</body>
</html>
