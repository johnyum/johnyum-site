<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12c</title>
<!-- THE BIG WEB BUILD (John, 2026-09-22). After the four-up: the desktop Multi-Host Calendar — /multi/, the web app the iOS
     replica was made from — live and tappable, in a 1440 × 900 bounding box scaled to fit the stage. No build here: the deck
     pushes straight through. -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  .box { position: relative; flex: none; width: 1440px; height: 900px; transform: scale(var(--s, 1)); transform-origin: center; border-radius: 32px; overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 24px 60px rgba(0,0,0,.14); background: #fff; }
  .box iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
</style>
</head>
<body>
  <div class="stage"><div class="box" id="box"><iframe id="app" title="Multi-Host Calendar — the web build"></iframe></div></div>
<script>
(() => {
  window.presoInteractive = true;   // the calendar is the product: tappable; the rails and the keys drive the deck
  const v = new URLSearchParams(location.search).get('v');
  document.getElementById('app').src = '/multi/' + (v ? '?v=' + v : '');
  const box = document.getElementById('box');
  const fit = () => box.style.setProperty('--s', Math.min(innerWidth * 0.92 / 1440, innerHeight * 0.92 / 900).toFixed(4));
  fit(); addEventListener('resize', fit);
})();
</script>
</body>
</html>
