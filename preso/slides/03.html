<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>03</title>
<!-- Nike lookbook spread — lands centre on the deck's push. -->
<style>
  html, body {
    margin: 0; height: 100%;
    background: #fff; color: #111;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .slide {
    height: 100%;
    display: grid;
    place-items: center;
  }
  .slide img {
    max-width: 88vw;
    max-height: 72vh;
    width: auto; height: auto;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }
</style>
</head>
<body>
  <div class="slide">
    <img src="assets/nike-lookbook.webp" alt="Nike lookbook — Hunger cover, product spread, Seleção stadium spread">
  </div>
</body>
