<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12d1</title>
<!-- THE DESIGN SYSTEM — one sheet of every piece the calendars are built from.

     Straight after the multi calendar's two-up (12c; the native phone alone, 12d, came out of the running order 2026-10-03 — it
     still plays inside 12c's duo) and before Lesson 3: the pieces come out of the product and stand on a white
     sheet, numbered — the date cells in every state (the moving ones looping), the guest pills on both calendars, the
     drawn events and holidays, one specimen from each view at its true size, and the chrome.

     They are the app's OWN components under the app's OWN stylesheet: the sheet is the calendar served at
     /multical/?sampler=1, which renders the real DayCell, the real .spill, the real .lrow — framed here and scaled to
     fill the stage. Nothing is redrawn, so nothing can drift from the build.

     No build of its own: the deck pushes straight through. -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  /* flex, not grid: the sheet is taller than the frame before its scale, and a grid row grows to hold it — flex keeps its centre on the frame's */
  .stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  /* the sheet lays itself out at its own size; JS below reads that size and scales the box to the stage */
  .sheet { position: relative; flex: none; width: 2280px; height: 1380px; transform: scale(var(--s, 1)); transform-origin: center; opacity: 0; transition: opacity .35s; }
  .sheet.ready { opacity: 1; }
  .sheet iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
</style>
</head>
<body>
  <div class="stage"><div class="sheet" id="sheet"><iframe id="cells" title="The design system"></iframe></div></div>
<script>
(() => {
  const v = new URLSearchParams(location.search).get('v');
  const frame = document.getElementById('cells'), sheet = document.getElementById('sheet');
  frame.src = '/multical/?sampler=1&preso=1&today=2026-09-09' + (v ? '&v=' + v : '');
  let W = 2280, H = 1380;
  // THE SHEET KEEPS ITS DISTANCE from the deck's own type: 40 under the kicker ("John Yum · Work") and 40 above the
  // section nav, the same clearance the web build's box keeps (12c).
  const band = () => {
    let top = 0, bottom = innerHeight;
    try { const pd = window.parent.document, k = pd.getElementById('kicker'), c = pd.getElementById('counter');
          if (k) top = k.getBoundingClientRect().bottom + 40; if (c) bottom = c.getBoundingClientRect().top - 40; } catch (_) {}
    return Math.max(200, bottom - top);
  };
  const fit = () => { const s = Math.min((innerWidth - 64) / W, band() / H); if (s > 0) sheet.style.setProperty('--s', s.toFixed(4)); };
  fit(); addEventListener('resize', fit);
  // THE SHEET SIZES ITSELF. Its width comes from the sections' own content, so rather than hold a number here that
  // would drift the moment a specimen is added, the box takes the size the sheet reports and re-takes it while the
  // drawn marks and the guests' faces land (they can widen a row). Measured for two seconds, then left alone.
  const measure = () => {
    let d; try { d = frame.contentDocument; } catch (_) { return false; }
    const el = d && d.querySelector('.ds'); if (!el) return false;
    const r = el.getBoundingClientRect(); if (!r.width || !r.height) return false;
    if (Math.abs(r.width - W) > 1 || Math.abs(r.height - H) > 1) {
      W = Math.round(r.width); H = Math.round(r.height);
      sheet.style.width = W + 'px'; sheet.style.height = H + 'px'; fit();
    }
    return true;
  };
  const t0 = Date.now();
  const tick = () => { const got = measure(); if (got) sheet.classList.add('ready'); if (Date.now() - t0 < 14000) setTimeout(tick, 120); };
  frame.addEventListener('load', tick); setTimeout(tick, 300);
  // ...and for good: pieces land in it after the first seconds (the requests, the Repeat cells, the quick actions)
  frame.addEventListener('load', () => { const go = () => { const el = frame.contentDocument && frame.contentDocument.querySelector('.ds'); if (!el) { setTimeout(go, 150); return; } new frame.contentWindow.ResizeObserver(() => measure()).observe(el); }; go(); });
  // UPDATED TO TODAY'S COMPONENTS (John, 2026-10-03: "go back to that one but update it with newer components… remove the
  // secondary type everywhere"). The sheet is the app's own sampler, so it is dressed from here rather than rebuilt:
  //  · no words at all — no labels, no section titles: only the components;
  //  · every pick STROKED, the selection the product ships, never the black fill: each phone is given the sampler's own
  //    `origsel` (the black is only drawn on a phone without it), and the cell that existed only to show the stroked pick
  //    beside the black one goes, now that every pick is stroked;
  //  · the guests' stays stay BLACK, the main pill as the product draws it (John, 2026-10-03), and beside them the two the
  //    sampler never had: a request to book and a stay the host cancelled — lifted from the live calendar, below;
  //  · the multi board's homes in real photos rather than grey squares.
  frame.addEventListener('load', () => {
    const d = frame.contentDocument;
    const st = d.createElement('style');
    const HOMES = ['1564013799919-ab600027ffc6', '1600596542815-ffad4c1539a9', '1568605114967-8130f3a36994'];
    st.textContent = '.ds-label{display:none!important}'
      + '.sampler-item[data-dup]{display:none!important}'
      + '[data-grey]{display:none!important}'   // no grey pride heart (John, 2026-10-03): neither the past mark nor the past cell that carries it
      // no section titles either: pure components (John, 2026-10-03)
      + '.ds-sec h2{display:none!important}'
      // GUEST PILLS, the main ones only, one size (John, 2026-10-03: "get rid of dupes… all the pill sizes the same… I don't
      // need middle cells or end cells"): the month's check-in (the board's black pill is the main one), carrying on, past
      // and the week's tail go; every pill left but the snapped two stands at the board's 176 x 40
      + '.ds-grid.pills [data-hide]{display:none!important}'
      + '.ds-grid.pills .ds-art:not(:has(.snapped)){width:176px!important}'
      + '.ds-grid.pills .ds-pillbox:not(:has(.snapped)){height:40px!important}'
      + '.ds-grid.pills :is(.spill,.pill):not(.snapped){width:176px!important;height:40px!important;border-radius:20px!important}'
      + HOMES.map((h, i) => `.ds-thumbrow .ds-thumb:nth-child(${i + 1}){background:url("https://images.unsplash.com/photo-${h}?w=120&h=120&fit=crop&q=80") center/cover!important}`).join('');
    d.head.appendChild(st);
    const stroke = () => d.querySelectorAll('.sampler-item').forEach(it => {
      if (/original/.test((it.querySelector('.ds-label') || {}).textContent || '')) { it.dataset.dup = 1; return; }
      if (!it.classList.contains('origsel')) it.classList.add('origsel');
      const ph = it.querySelector('.phone'); if (ph && !ph.classList.contains('origsel')) ph.classList.add('origsel');
    });
    stroke(); new frame.contentWindow.MutationObserver(stroke).observe(d.body, { childList: true, subtree: true });
    const grey = () => d.querySelectorAll('.ds-spec, .sampler-item').forEach(e => { const l = ((e.querySelector('.ds-label') || {}).textContent || '').trim(); if (/^Past(, icon)?$/.test(l)) e.dataset.grey = 1; });
    grey(); setTimeout(grey, 600);
    addKinds(d).catch(e => console.error("[12d1 addKinds]", e));
  });
  // THE REQUEST TO BOOK AND THE CANCELLED STAY. The sampler has neither, so the live calendar is run unseen, given one of
  // each (its model's addStay, as slide 13 gives them), and the two pills it draws are lifted into the sampler's Guest pills
  // group — inside shallow clones of the ancestors they hang from, so the app's own rules for them still land.
  async function addKinds(d) {
    const live = document.createElement('iframe');
    Object.assign(live.style, { position: 'fixed', left: '0', top: '0', width: '430px', height: '932px', border: '0', opacity: '0', pointerEvents: 'none', zIndex: '-1' });
    live.src = '/multical/?preso=1&today=2026-09-09' + (v ? '&v=' + v : ''); document.body.appendChild(live);
    const until = async (fn, ms = 12000) => { const t = Date.now(); while (Date.now() - t < ms) { try { const x = fn(); if (x) return x; } catch (_) {} await new Promise(r => setTimeout(r, 80)); } return null; };
    const m = await until(() => live.contentWindow.__model); if (!m) return;
    const I = dd => m.fx.index({ y: 2026, m: 9, d: dd }), base = { listing: 0, extraGuests: 0, checkIn: '3:00 PM', checkOut: '11:00 AM', nightly: [], earnings: 0 };
    m.addStay({ ...base, startIndex: I(23), nights: 3, guest: 'Daniel', avatarURL: '', kind: 'request', initials: 'DR' });
    m.addStay({ ...base, startIndex: I(27), nights: 2, guest: 'Priya', avatarURL: '', kind: 'cancelled' });
    // THE REPEAT COLOURS (John, 2026-10-03: "add the recurrence colored cells to the date cells"): a rule in every colour of
    // the palette, a night each from the 10th, each carrying a different setting — price up, price down, a minimum, a maximum,
    // closed, a check-in rule, a fixed price, up with a minimum. YEARLY rules on a one-night range: a weekly rule ignores its
    // range and would repeat on its weekdays all year.
    const SET = [{ pricePct: 20 }, { pricePct: -15 }, { minNights: 3 }, { maxNights: 7 }, { blocked: true }, { checkInDays: new Set([1, 2, 3, 4, 5, 6, 7]) }, { price: 650 }, { pricePct: 35, minNights: 2 }];
    SET.forEach((x, i) => { const n = I(10 + i); try { m.applyRepeat({ id: 'r' + i, weekly: false, days: new Set(), start: n, end: n, mdays: new Set(), listings: [0], price: null, pricePct: null, blocked: null, minNights: null, maxNights: null, checkInDays: new Set(), checkOutDays: new Set(), cancellation: null, name: 'r' + i, colorIndex: i, enabled: true, ...x }); } catch (_) {} });
    m.setRecurQA(true);
    const L = live.contentDocument;
    const pills = await until(() => { const ps = [...L.querySelectorAll('.spill')].filter(p => p.getBoundingClientRect().width > 60 && /Daniel|Cancelled/.test(p.textContent)); return ps.length >= 2 && m.repeatColorNights && m.repeatColorNights.get(0) && m.repeatColorNights.get(0).size >= 8 && ps; });
    const grid = d.querySelector('.ds-grid.pills'); if (!pills || !grid) return;
    await new Promise(r => setTimeout(r, 500));
    const after = grid.children[1] || null;
    pills.sort((a, z) => /Daniel/.test(a.textContent) ? -1 : 1).forEach(p => {
      const r = p.getBoundingClientRect(), W = 176, chain = [];   // at the board pill's 176 x 40, the one size every pill here takes
      for (let e = p.parentElement; e && e !== L.body; e = e.parentElement) chain.unshift(e);
      const spec = d.createElement('div'); spec.className = 'ds-spec';
      const art = d.createElement('div'); art.className = 'ds-art'; art.style.width = W + 'px'; spec.appendChild(art);
      let cur = art;
      chain.forEach(e => { const c = e.cloneNode(false); c.removeAttribute('id'); c.style.cssText += ';position:static!important;transform:none!important;width:auto!important;height:auto!important;margin:0!important;padding:0!important;overflow:visible!important;display:block!important;inset:auto!important;min-height:0!important;background:transparent!important;box-shadow:none!important;border:0!important'; cur.appendChild(c); cur = c; });
      const c = p.cloneNode(true); c.style.cssText += ';position:relative!important;left:auto!important;top:auto!important;width:' + W + 'px!important;height:40px!important;border-radius:20px!important;transform:none!important';   // (lifted mid-entrance it can read short)
      c.querySelectorAll('img[src]').forEach(i => { i.src = new URL(i.getAttribute('src'), L.baseURI).href; });
      cur.appendChild(c);
      grid.insertBefore(spec, after);
      spec.dataset.kind = /Daniel/.test(p.textContent) ? 'req' : 'cancel';
    });
    // two more requests to book, so the disc's colours show: Purple and Orange beside Daniel's Blue — the build's own
    // label colours
    const req = grid.querySelector('[data-kind="req"]');
    if (req) [['Maya', 'MK', '#E6E2FB', '#7A6CE8'], ['Leo', 'LT', '#FBE5CC', '#DD6B0E']].reverse().forEach(([n, ini, bg, ink]) => {
      const c = req.cloneNode(true); c.dataset.kind = 'req';
      const i = c.querySelector('.initials'), nm = c.querySelector('.name');
      if (i) { i.textContent = ini; i.style.background = bg; i.style.color = ink; }
      if (nm) nm.textContent = n;
      req.after(c);
    });
    // the duplicates and the in-between pieces go
    grid.querySelectorAll('.ds-spec').forEach(sp => { if (/^Month · (check-in|carries on|past|week's tail)$/.test(((sp.querySelector('.ds-label') || {}).textContent || '').trim())) sp.dataset.hide = 1; });
    // in order: the board's three (the black main pill, past, stepped back), pressed, the requests, cancelled, then the two snapped
    const boardDefault = [...grid.children].find(e => /Board · default/.test(e.textContent || '') || (e.querySelector && [...e.querySelectorAll('.ds-label')].some(l => /Board · default/.test(l.textContent))));
    const pressed = [...grid.querySelectorAll(':scope > .ds-spec')].find(sp => /Month · pressed/.test((sp.querySelector('.ds-label') || {}).textContent || ''));
    const kinds = [...grid.querySelectorAll(':scope > [data-kind]')].sort((a, z) => (a.dataset.kind === 'cancel') - (z.dataset.kind === 'cancel'));
    if (boardDefault) { let at = boardDefault; [pressed, ...kinds].forEach(e => { if (e) { at.after(e); at = e; } }); grid.prepend(boardDefault); }
    // the eight coloured nights, into the end of the Date cells grid, each in a sampler item of its own
    const cellsGrid = d.querySelector('.ds-grid.cells');
    const sept = [...L.querySelectorAll('.grid')].find(g => { const r = g.getBoundingClientRect(); return r.bottom > 100 && r.top < 700; });
    if (cellsGrid && sept) SET.forEach((x, i) => {
      const c = [...sept.querySelectorAll('.dcell')].find(e => (e.querySelector('.date') || {}).textContent === String(10 + i)); if (!c) return;
      const r = c.getBoundingClientRect(), chain = [];
      for (let e = c.parentElement; e && e !== L.body; e = e.parentElement) chain.unshift(e);
      const item = d.createElement('div'); item.className = 'sampler-item origsel';
      let cur = item;
      chain.forEach(e => { const k = e.cloneNode(false); k.removeAttribute('id'); k.style.cssText += ';position:static!important;transform:none!important;width:auto!important;height:auto!important;margin:0!important;padding:0!important;overflow:visible!important;display:block!important;inset:auto!important;min-height:0!important;background:transparent!important;box-shadow:none!important;border:0!important'; cur.appendChild(k); cur = k; });
      const k = c.cloneNode(true); k.style.cssText += ';position:relative!important;left:auto!important;top:auto!important;width:' + r.width + 'px!important;height:' + r.height + 'px!important;transform:none!important';
      cur.appendChild(k); cellsGrid.appendChild(item);
    });
    // QUICK ACTIONS, piece by piece (John, 2026-10-03: "break them out to individual pieces under the events and holidays"):
    // the cards a pick raises, then Repeat's, each on its own, in a group of their own under the events
    m.setRecurQA(false); m.setOrigSel(true);
    m.setSelectedNights(new Set([I(19), I(20), I(21)]));
    await new Promise(r => setTimeout(r, 1400));
    const evSec = d.querySelector('.ds-grid.marks') && d.querySelector('.ds-grid.marks').closest('.ds-sec');
    const qa = d.createElement('section'); qa.className = 'ds-sec';
    const qaGrid = d.createElement('div'); qaGrid.style.cssText = 'display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;max-width:600px';
    qa.appendChild(qaGrid); if (evSec) evSec.after(qa);
    const shellChain = (el, stop) => { const ch = []; for (let e = el.parentElement; e && e !== stop; e = e.parentElement) ch.unshift(e); return ch; };
    const NEUTRAL = ';position:static!important;transform:none!important;translate:none!important;width:auto!important;height:auto!important;margin:0!important;padding:0!important;overflow:visible!important;display:block!important;inset:auto!important;min-height:0!important;max-height:none!important;background:transparent!important;box-shadow:none!important;border:0!important;opacity:1!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important';
    const build = (into, el, stop) => {
      const r = el.getBoundingClientRect(); let cur = into;
      shellChain(el, stop).forEach(e => { const k = e.cloneNode(false); if (k.removeAttribute) k.removeAttribute('id'); if (k.style) k.style.cssText += NEUTRAL; cur.appendChild(k); cur = k; });
      const k = el.cloneNode(true); k.style.cssText += ';position:relative!important;left:auto!important;top:auto!important;right:auto!important;bottom:auto!important;width:' + r.width + 'px!important;height:' + r.height + 'px!important;transform:none!important;opacity:1!important';
      cur.appendChild(k);
      into.style.width = r.width + 'px'; into.style.height = r.height + 'px';
    };
    // the phone's cards (in the page, under the app's own stylesheet — the sampler's, the same one)
    [...L.querySelectorAll('.sqa .sqa-card')].filter(c => c.getBoundingClientRect().width > 40).forEach(c => { const box = d.createElement('div'); box.style.position = 'relative'; build(box, c, L.body); qaGrid.appendChild(box); });
    // Repeat's cards live in a shadow root of their own: each goes into a shadow root here, with that root's own styles
    m.clearSelection(); m.setRecurQA(true);
    await new Promise(r => setTimeout(r, 600));
    m.setSelectedNights(new Set([I(19), I(20), I(21)]));   // Repeat's cards are built for a pick made while it is on
    await until(() => { const h = L.querySelector('.recur-host'); return h && h.shadowRoot && h.shadowRoot.querySelector('.halves2'); }, 6000);
    await new Promise(r => setTimeout(r, 900));
    const host = L.querySelector('.recur-host'), root = host && host.shadowRoot;
    if (root) {
      const css = [...root.querySelectorAll('style')].map(x => x.textContent).join('\n') + [...(root.adoptedStyleSheets || [])].map(sh => [...sh.cssRules].map(r => r.cssText).join('\n')).join('\n');
      // only what is Repeat's own: the Settings | Repeat card and its round button — its availability and price cards are the
      // phone's, already here — wherever they stand (the cards can sit below the frame's edge)
      [...root.querySelectorAll('.card, .disc')].filter(c => { const r = c.getBoundingClientRect(); return r.width > 16 && r.height > 16 && (c.classList.contains('disc') || c.querySelector('.halves2')); }).forEach(c => {
        const h = d.createElement('div'), sr = h.attachShadow({ mode: 'open' }), st = d.createElement('style'); st.textContent = css; sr.appendChild(st);
        const box = d.createElement('div'); box.style.position = 'relative'; sr.appendChild(box);
        build(box, c, null); h.style.width = box.style.width; h.style.height = box.style.height; qaGrid.appendChild(h);
      });
    }
    live.remove();
  }
})();
</script>
</body>
</html>
