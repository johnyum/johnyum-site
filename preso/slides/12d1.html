<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12d1</title>
<!-- THE COMPONENTS — one sheet of every piece the two calendars are built from, web and native (rethought, John, 2026-10-03).

     Straight after the multi calendar's two-up (12c) and before Lesson 3. No words on it but the two halves' names: the
     components are the page (John: "remove all the tiny grey type, just have the components"). Selection is the stroked
     kind throughout, never the black fill, and so are the guests' stays; the requests to book wear their coloured discs and
     the Repeat rules their coloured cells; the homes are real photos.

     LIFTED, NOT DRAWN. Nothing here is a picture or a copy of the markup. The slide runs the builds themselves, unseen
     behind the sheet — the web one (/multi/), the native one (/multical/, single and multi) and the native cell sampler
     (/multical/?sampler=1) — steps each into the state a piece needs (a selection for the quick actions, a rule for the
     coloured cells, a tip for the green rings...), and lifts the real element out: a deep clone, wrapped in shallow clones of
     the ancestors it hangs from so every selector and inherited variable still lands, set into the sheet. Each build's half
     is its own shadow root carrying that build's own stylesheet — the two apps share class names (.cell, .pill, .phone) and
     must never see each other's rules. A build that changes changes the sheet; nothing can drift.

     The sheet lays itself out at its natural size; the slide measures it and scales it to the band between the deck's
     kicker and its nav. No build of its own: the deck pushes straight through. -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  /* the builds, running unseen: full size (they lay out as they would on a screen), under the sheet, never touched */
  .src { position: fixed; left: 0; top: 0; border: 0; opacity: 0; pointer-events: none; z-index: -1; }
  .stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #fff; }
  .sheet { position: relative; flex: none; transform: scale(var(--s, 1)); transform-origin: center; opacity: 0; transition: opacity .45s; }
  .sheet.ready { opacity: 1; }
  .ds { display: flex; gap: 120px; align-items: flex-start; padding: 0; }
  .half { display: flex; flex-direction: column; gap: 32px; }
  .half > h2 { margin: 0; font: 500 28px/1 "IBM Plex Mono", ui-monospace, Menlo, monospace; color: #111; letter-spacing: 0; }
  @font-face { font-family: "IBM Plex Mono"; src: url("../fonts/IBMPlexMono-Regular.woff2") format("woff2"); font-weight: 400 500; font-display: block; }
</style>
</head>
<body>
  <div class="stage"><div class="sheet" id="sheet"><div class="ds">
    <div class="half"><h2>Web</h2><div id="web" style="width:1620px"></div></div>
    <div class="half"><h2>Native</h2><div id="nat" style="width:1560px"></div></div>
  </div></div></div>
<script>
(() => {
  const v = new URLSearchParams(location.search).get('v'), V = v ? '&v=' + v : '';
  const sheet = document.getElementById('sheet');
  const wait = ms => new Promise(r => setTimeout(r, ms));
  // A WAIT IS TIME AND FRAMES. The builds draw on animation frames (the board renders the nights in view on one, a curve rises
  // on them, a pill lands on them); a timer alone can run out while a page is not being painted and capture a half-drawn
  // state. So every pause also waits for three real frames — it simply takes longer if the slide is not on screen yet.
  const frames = (n = 3) => new Promise(r => { let k = 0; const f = () => (++k >= n ? r() : requestAnimationFrame(f)); requestAnimationFrame(f); });
  const settle = async ms => { await wait(ms); await frames(); await wait(60); };
  const until = async (fn, ms = 15000) => { const t = Date.now(); while (Date.now() - t < ms) { try { const x = fn(); if (x) return x; } catch (_) {} await wait(80); } return null; };

  // ── THE BUILDS, unseen ───────────────────────────────────────────────────────────────────────────────────────────────
  const open = (url, w, h) => new Promise(res => {
    const f = document.createElement('iframe'); f.className = 'src'; f.setAttribute('aria-hidden', 'true'); f.tabIndex = -1;
    f.style.width = w + 'px'; f.style.height = h + 'px';
    f.addEventListener('load', () => res(f), { once: true }); f.src = url; document.body.appendChild(f);
  });

  // ── A BUILD'S OWN STYLESHEET, for its shadow root ────────────────────────────────────────────────────────────────────
  // Every rule, URLs made absolute (they resolve against the build, not this slide); html / :root become :host and body
  // becomes .ds-body (the shadow has neither); a media rule is decided against the BUILD's window — the native one is a
  // 430-wide phone, the sheet is not — and kept or dropped whole. Font faces go up to this document: a face declared in a
  // shadow root is never loaded.
  const faces = new Set();
  function cssOf(doc, win) {
    const abs = (t, base) => t.replace(/url\(\s*(['"]?)([^'")]+)\1\s*\)/g, (m, q, u) => /^(data:|https?:|blob:|#)/.test(u) ? m : 'url("' + new URL(u, base).href + '")');
    const rw = sel => sel.split(',').map(s => s
      .replace(/(^|[\s>+~(])(?:html|:root)(?=$|[\s.:#\[>+~),])/g, '$1:host')
      .replace(/(^|[\s>+~(])body(?=$|[\s.:#\[>+~),])/g, '$1.ds-body')).join(',');
    // by the rule's own type: an iframe's rules are of ITS window's classes, so instanceof against ours is always false
    const kind = r => r.constructor && r.constructor.name;
    const ser = (r, base) => {
      if (kind(r) === 'CSSStyleRule') return rw(r.selectorText) + '{' + abs(r.style.cssText, base) + '}' + (r.cssRules && r.cssRules.length ? [...r.cssRules].map(x => ser(x, base)).join('') : '');
      if (kind(r) === 'CSSMediaRule') { let on = false; try { on = win.matchMedia(r.conditionText).matches; } catch (_) {} return on ? [...r.cssRules].map(x => ser(x, base)).join('') : ''; }
      if (kind(r) === 'CSSSupportsRule') return '@supports ' + r.conditionText + '{' + [...r.cssRules].map(x => ser(x, base)).join('') + '}';
      if (kind(r) === 'CSSFontFaceRule') { faces.add(abs(r.cssText, base)); return ''; }
      if (kind(r) === 'CSSImportRule') return r.styleSheet ? [...r.styleSheet.cssRules].map(x => ser(x, r.styleSheet.href || base)).join('') : '';
      return abs(r.cssText, base);
    };
    let out = '';
    for (const sh of [...doc.styleSheets, ...(doc.adoptedStyleSheets || [])]) {
      let rules; try { rules = sh.cssRules; } catch (_) { continue; }
      const base = sh.href || doc.baseURI;
      for (const r of rules) out += ser(r, base) + '\n';
    }
    return out;
  }
  const flushFaces = () => { let s = document.getElementById('faces'); if (!s) { s = document.createElement('style'); s.id = 'faces'; document.head.appendChild(s); } s.textContent = [...faces].join('\n'); };

  // a half of the sheet: a shadow root with the build's stylesheet, a stand-in for the build's <body> (its classes, none of
  // its page behaviour), and whatever the slide adds on top
  function half(host, f, extra) {
    const doc = f.contentDocument, sr = host.attachShadow({ mode: 'open' });
    const st = document.createElement('style');
    st.textContent = cssOf(doc, f.contentWindow) + '\n'
      + ':host{display:block}'
      + '.ds-body{position:static!important;inset:auto!important;width:auto!important;height:auto!important;min-height:0!important;overflow:visible!important;background:transparent!important;margin:0!important;padding:0!important;transform:none!important}'
      // the half's groups pack into its width, a group a block; inside a group its pieces wrap at the group's own measure
      + '.dsx-rows{display:flex;flex-wrap:wrap;gap:64px 72px;align-items:flex-start}.dsx-row:empty{display:none}.dsx-row{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-start}'
      + '.dsx-lift{position:relative;flex:none}'
      + (extra || '');
    sr.appendChild(st);
    const body = document.createElement('div'); body.className = 'ds-body ' + doc.body.className;
    [...doc.body.attributes].forEach(a => { if (a.name.startsWith('data-')) body.setAttribute(a.name, a.value); });
    const rows = document.createElement('div'); rows.className = 'dsx-rows'; body.appendChild(rows);
    sr.appendChild(body); flushFaces();
    return { row(max) { const r = document.createElement('div'); r.className = 'dsx-row'; if (max) r.style.maxWidth = max + 'px'; rows.appendChild(r); return r; } };   // an empty group takes no room (.dsx-row:empty)
  }

  // ── LIFTING ─────────────────────────────────────────────────────────────────────────────────────────────────────────
  // The element, deep-cloned, inside shallow clones of every ancestor up to <body> — so `.board .cell` and `#gridRows
  // .booking-pill` still match and inherited custom properties still arrive — with the ancestors' own layout neutralised
  // and the element held at the size it had in the build. Canvases are copied pixel for pixel; an open shadow root is
  // carried across with its contents and its styles.
  const NEUTRAL = { position: 'static', inset: 'auto', transform: 'none', translate: 'none', scale: 'none', rotate: 'none', width: 'auto', height: 'auto', 'min-width': '0', 'min-height': '0', 'max-width': 'none', 'max-height': 'none', margin: '0', padding: '0', overflow: 'visible', opacity: '1', visibility: 'visible', display: 'block', filter: 'none', 'clip-path': 'none', mask: 'none', contain: 'none', 'pointer-events': 'none', animation: 'none', transition: 'none', 'box-shadow': 'none', border: '0', background: 'transparent' };
  const setAll = (el, props) => { for (const k in props) el.style.setProperty(k, props[k], 'important'); };
  // URLs made absolute against the build: a relative src in a clone would resolve against this slide
  const URLATTR = ['src', 'href', 'poster', 'xlink:href'];
  function carry(src, dst) {   // canvases, shadow roots and URLs, walked in step
    for (const a of URLATTR) { const val = src.getAttribute && src.getAttribute(a); if (val && !/^(data:|https?:|blob:|#|javascript:)/.test(val)) { try { dst.setAttribute(a, new URL(val, src.ownerDocument.baseURI).href); } catch (_) {} } }
    if (src.getAttribute && src.getAttribute('srcset')) dst.removeAttribute('srcset');
    if (src.style && /url\(/.test(src.getAttribute('style') || '')) dst.setAttribute('style', src.getAttribute('style').replace(/url\(\s*(['"]?)([^'")]+)\1\s*\)/g, (m, q, u) => /^(data:|https?:|blob:)/.test(u) ? m : 'url("' + new URL(u, src.ownerDocument.baseURI).href + '")'));
    if (src.tagName === 'CANVAS') { try { dst.width = src.width; dst.height = src.height; dst.getContext('2d').drawImage(src, 0, 0); } catch (_) {} }
    if (src.shadowRoot) {
      const sr = dst.shadowRoot || dst.attachShadow({ mode: 'open' });
      sr.innerHTML = src.shadowRoot.innerHTML;
      const css = [...(src.shadowRoot.adoptedStyleSheets || [])].map(s => [...s.cssRules].map(r => r.cssText).join('\n')).join('\n');
      if (css) { const st = document.createElement('style'); st.textContent = css; sr.prepend(st); }
    }
    const a = src.children, b = dst.children;
    for (let i = 0; i < a.length && i < b.length; i++) carry(a[i], b[i]);
  }
  function lift(el, { w, h, keep } = {}) {
    const doc = el.ownerDocument, r = el.getBoundingClientRect();
    const outer = document.createElement('div'); outer.className = 'dsx-lift';
    outer.style.transform = 'translateZ(0)';   // a containing block: anything inside pinned to the build's screen (position:fixed) lands where it stood
    let cur = outer;
    const chain = []; for (let p = el.parentElement; p && p !== doc.body && p !== doc.documentElement; p = p.parentElement) chain.unshift(p);
    for (const p of chain) { const s = p.cloneNode(false); setAll(s, NEUTRAL); cur.appendChild(s); cur = s; }
    const c = el.cloneNode(true);
    carry(el, c);
    setAll(c, Object.assign({ position: 'relative', inset: 'auto', margin: '0', translate: 'none', 'pointer-events': 'none' }, keep ? {} : { transform: 'none' }));
    c.style.setProperty('width', (w || r.width) + 'px', 'important'); c.style.setProperty('height', (h || r.height) + 'px', 'important');
    c.removeAttribute('id');
    cur.appendChild(c);
    outer.style.width = (w || r.width) + 'px'; outer.style.height = (h || r.height) + 'px';
    return outer;
  }
  // several elements kept where they stood relative to each other, cropped to a rectangle (build coordinates) — a stretch of
  // board or month with its pills, its photos and its dates, as one piece
  function crop(els, rect) {
    const box = document.createElement('div'); box.className = 'dsx-lift';
    Object.assign(box.style, { width: rect.width + 'px', height: rect.height + 'px', overflow: 'hidden' });
    els.forEach(el => {
      const r = el.getBoundingClientRect();
      if (r.right <= rect.left || r.left >= rect.right || r.bottom <= rect.top || r.top >= rect.bottom || !r.width || !r.height) return;
      const n = lift(el); n.style.position = 'absolute'; n.style.left = (r.left - rect.left) + 'px'; n.style.top = (r.top - rect.top) + 'px';
      box.appendChild(n);
    });
    return box;
  }
  const R = (l, t, r, b) => ({ left: l, top: t, right: r, bottom: b, width: r - l, height: b - t });

  window.__ds = { open, half, lift, crop, R, wait, until };   // for a look from the console

  // ── SCALE TO THE BAND ───────────────────────────────────────────────────────────────────────────────────────────────
  // 40 under the kicker ("John Yum · Work") and 40 above the section nav, as before
  const band = () => {
    let top = 0, bottom = innerHeight;
    try { const pd = window.parent.document, k = pd.getElementById('kicker'), c = pd.getElementById('counter');
          if (k) top = k.getBoundingClientRect().bottom + 40; if (c) bottom = c.getBoundingClientRect().top - 40; } catch (_) {}
    return Math.max(200, bottom - top);
  };
  const fit = () => { const W = sheet.offsetWidth, H = sheet.offsetHeight; if (!W || !H) return; const s = Math.min((innerWidth - 64) / W, band() / H); sheet.style.setProperty('--s', s.toFixed(4)); };
  addEventListener('resize', fit);
  new ResizeObserver(fit).observe(sheet);   // photos and faces land after the lift and can grow a group: refit as they do

  // ── THE PIECES ──────────────────────────────────────────────────────────────────────────────────────────────────────
  const WEB_CSS =
      // the guests' stays STROKED, not black (John, 2026-10-03) — white, a 1.5 #222 line, the name in #222
      '.booking-pill:not(.preso-req):not(.past){background:#fff!important;border:1.5px solid #222!important;box-sizing:border-box}'
    + '.booking-pill:not(.preso-req):not(.past) .booking-name{color:#222!important}'
      // the request to book, as 12c dresses it: dashed, its disc in a label colour with the guest's initials
    + '.booking-pill.preso-req{background:#fff!important;border:1.5px dashed #222!important;box-sizing:border-box}'
    + '.booking-pill.preso-req .booking-name{color:#222!important}'
    + '.booking-pill.preso-req .booking-avatar{background:var(--req-bg)!important;display:grid;place-items:center}'
    + '.booking-pill.preso-req .booking-avatar img{display:none}'
    + '.booking-pill.preso-req .booking-avatar::after{content:attr(data-ini);color:var(--req-ink);font:700 11px/1 Cereal,sans-serif;letter-spacing:.02em}'
      // a guest's message rides on its pill in the build; on the sheet it would only be cut off at a crop's edge
    + '.bp-ask{display:none!important}';
  const NAT_CSS =
      // stays STROKED (John, 2026-10-03): the month's and the board's — white, a 1.5 #222 line, the name in #222
      '.spill.glass-dark,.pill.glass-dark{background:#fff!important;border:1.5px solid #222!important;box-sizing:border-box;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;box-shadow:none!important}'
    + '.spill.glass-dark::before,.spill.glass-dark::after,.pill.glass-dark::before,.pill.glass-dark::after{display:none!important}'
    + '.spill.glass-dark .name,.pill.glass-dark .name{color:#222!important}'
      // the board's requests to book, as 12d dresses them
    + '.board .pill.preso-req{background:#fff!important;border:1.5px dashed #222!important;box-sizing:border-box;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;box-shadow:none!important}'
    + '.board .pill.preso-req::before,.board .pill.preso-req::after{display:none!important}'
    + '.board .pill.preso-req .name{color:#222!important}'
    + '.board .pill.preso-req>span:first-child{background:var(--req-bg)!important;display:grid!important;place-items:center}'
    + '.board .pill.preso-req>span:first-child img{display:none}'
    + '.board .pill.preso-req>span:first-child::after{content:attr(data-ini);color:var(--req-ink);font:700 11px/1 Cereal,sans-serif;letter-spacing:.02em}'
    + '.ds-label{display:none!important}.askwrap,.bar.askonly{display:none!important}';

  async function web() {
    const f = await open('/multi/?' + V.slice(1), 1720, 1000), w = f.contentWindow, d = f.contentDocument;
    const ev = c => { try { return w.eval(c); } catch (e) { console.warn('[12d1 web]', e); } };
    await until(() => d.querySelectorAll('#gridRows .price-row').length > 5 && d.querySelector('#gridRows .price-card'));
    d.body.classList.remove('no-header');
    // as the deck shows it (12c): the pro tier — 32 homes, the demand curve on — at the deck's own 48px rows, guests in,
    // real prices, the homes gathered into their cities
    const den = d.createElement('style');
    den.textContent = 'body.host-pro:not(.settings-mode):not(.avail-mode):not(.super-collapse-2) .price-row{height:48px}'
      + 'body.host-pro:not(.super-collapse-2) .thumb-row{height:48px}body.host-pro .settings-row{height:48px}body.host-pro{--thumb:40px}'
      + '#devBar{display:none!important}';
    d.head.appendChild(den);
    try { w.switchHost('pro', true); } catch (e) { console.warn(e); }
    try { w.setDataMode('none', true); } catch (e) { console.warn(e); }   // off Busy Host: its mode draws no demand curve
    await settle(600);
    ['devBookings', 'devVariance'].forEach(id => { const b = d.getElementById(id); if (b && !b.checked) { b.checked = true; b.dispatchEvent(new w.Event('change')); } });
    await settle(600);
    ev('groups.length = 0; smartGroups().forEach(g => groups.push(g)); saveGroups(); renderGroups(); applyGroupsToCalendar();');
    ev('gridWrap.scrollLeft = Math.max(0, (rowOffsets[calStartDi()] || 0) - GRID_GUTTER); gridWrap.scrollTop = 0; gridWrap.dispatchEvent(new Event("scroll"));');
    await settle(1200);
    const H = half(document.getElementById('web'), f, WEB_CSS);
    // the groups in the order they pack — the offer beside the board, where the board leaves room — filled as each is lifted
    const slot = {}; ['head', 'tools', 'board', 'offer', 'pick', 'menus', 'tips', 'tip'].forEach(k => { slot[k] = H.row(k === 'menus' ? 1560 : 0); });

    // 1 · the chrome: the logo, the nav, the account; the month, the toggle, the arrows and Today, search, Group
    const r1 = slot.head, hdr = d.querySelector('.app-header');
    if (hdr) [...hdr.children].forEach(c => { if (c.getBoundingClientRect().width) r1.appendChild(lift(c)); });
    const r2 = slot.tools;
    ['monthTitle', 'segToggle', 'calNavGroup', 'searchPill', 'tbGroupBtn'].forEach(id => { const e = d.getElementById(id); if (e) r2.appendChild(lift(e)); });

    // 2 · the board: a fortnight of San Diego from today — the homes' photos, the dates, the nights at their own prices (struck
    //     where closed), the guests' stays (stroked), two of them requests to book in their coloured discs
    const visPills = () => [...d.querySelectorAll('#gridRows .booking-pill:not(.past)')].filter(p => { const r = p.getBoundingClientRect(); return r.right > 120 && r.left < 900 && r.top > 0 && r.top < 760; })
      .sort((a, z) => a.getBoundingClientRect().top - z.getBoundingClientRect().top);
    const REQ = [['#D7EAFB', '#2E80E0'], ['#E6E2FB', '#7A6CE8'], ['#FBE5CC', '#DD6B0E']];   // Blue, Purple, Orange: the build's own label colours
    visPills().filter((p, k) => k % 2 === 1).slice(0, 3).forEach((p, k) => {
      p.classList.add('preso-req'); const av = p.querySelector('.booking-avatar'), g = p.dataset.guest || 'G';
      if (av) { av.dataset.ini = (g[0] + 'RMKLTS'[k]).toUpperCase(); av.style.setProperty('--req-bg', REQ[k][0]); av.style.setProperty('--req-ink', REQ[k][1]); }
    });
    const board = (rows, x1) => {
      const th = d.getElementById('listingThumbs').getBoundingClientRect(), dh = d.getElementById('dateHeader').getBoundingClientRect();
      const rr = [...d.querySelectorAll('#gridRows > .price-row')], last = rr[Math.min(rows, rr.length) - 1].getBoundingClientRect();
      const box = R(th.left, dh.top - 8, x1, last.bottom + 6);
      const wrap = document.createElement('div'); wrap.className = 'dsx-lift'; Object.assign(wrap.style, { width: box.width + 'px', height: box.height + 'px', position: 'relative' });
      // the nights under the photo column are clipped off at its edge, as the build's own column covers them; the photos on top
      const right = crop([...d.querySelectorAll('#dateHeader > *, #gridRows .price-card, #gridRows .booking-pill, #gridRows .group-divider, .ribbon-master-dot, .ribbon-svg, .cal-ribbon, [class*=ribbon]')], R(th.right, box.top, box.right, box.bottom));
      Object.assign(right.style, { position: 'absolute', left: (th.right - box.left) + 'px', top: '0' });
      const left = crop([...d.querySelectorAll('#listingThumbsInner > .thumb-row, .cal-group-label')], box);
      Object.assign(left.style, { position: 'absolute', left: '0', top: '0', overflow: 'visible' });
      wrap.appendChild(right); wrap.appendChild(left); return wrap;
    };
    slot.board.appendChild(board(7, 1040));

    // 3 · picking: three nights selected (the stroked cells), their quick actions, and each menu they open
    const order = () => [...d.querySelectorAll('#gridRows .price-row')].map(r => +r.dataset.li);
    ev(`selectRange({ li: ${order()[0]}, di: todayDi + 1 }, { li: ${order()[0]}, di: todayDi + 3 })`);
    await settle(900);
    const r3 = slot.pick;
    const sel = [...d.querySelectorAll('#gridRows .price-card.selected')];
    if (sel.length) { const a = sel[0].getBoundingClientRect(), z = sel[sel.length - 1].getBoundingClientRect(); r3.appendChild(crop(sel, R(a.left - 4, a.top - 4, z.right + 4, z.bottom + 4))); }
    const ma = d.getElementById('maPill'); if (ma) r3.appendChild(lift(ma));
    const r4 = slot.menus;
    for (const [fn, id] of [['openAvailMenu', 'availMenu'], ['openPriceMenu', 'priceMenu'], ['openDiscountsMenu', 'discountsMenu'], ['openMinNightsMenu', 'minNightsMenu']]) {
      if (typeof w[fn] !== 'function') continue;
      ev(fn + '()'); await settle(700);
      const m = d.getElementById(id) || [...d.querySelectorAll('.avail-menu.show, [id$=Menu].show')].pop();
      if (m && m.getBoundingClientRect().width) r4.appendChild(lift(m));
    }
    ev('clearSelection()'); await settle(500);

    // 4 · tips: the Show tips button; then a tip in focus — Del Mar's racing — its rings and its curve on the board, and
    //     the pill that carries it; then its Apply and the offer that follows
    const r5 = slot.tips;
    const mp = d.getElementById('magicPill'); if (mp && mp.getBoundingClientRect().width) r5.appendChild(lift(mp));
    ev('startOptimize()');
    await until(() => w.__opt && w.__opt.suggs && w.__opt.suggs.length && !d.body.classList.contains('opt-scanning'), 12000); await settle(1200);
    ev("(() => { const o = window.__opt; const i = o.suggs.findIndex(s => /Del Mar/.test(s.title || s.name || '')); if (i >= 0) { o.cur = i; renderMagicPill(); focusOpportunity(); } })()");
    await settle(3200);
    if (mp) r5.appendChild(lift(mp));
    const foc = [...d.querySelectorAll('#gridRows .price-card.opt-focus')];
    if (foc.length) {
      const xs = foc.map(c => c.getBoundingClientRect()), l = Math.min(...xs.map(r => r.left)), r = Math.max(...xs.map(r => r.right)), b = Math.max(...xs.map(r => r.bottom));
      const lab = [...d.querySelectorAll('.cal-group-label')].map(e => e.getBoundingClientRect()).filter(q => q.top < Math.min(...xs.map(r => r.top))).pop();
      const top = lab ? lab.top - 8 : Math.min(...xs.map(r => r.top)) - 140;
      const curve = [...d.querySelectorAll('body *')].filter(e => { const c = typeof e.className === 'string' ? e.className : ''; return /ribbon|season-band|demand/.test(c) && !e.closest('[class*=ribbon] [class*=ribbon]'); });
      slot.tip.appendChild(crop([...d.querySelectorAll('#dateHeader > *, #gridRows .price-card, #gridRows .booking-pill, #gridRows .group-divider'), ...curve], R(l - 168, top, r + 168, b + 6)));
    }
    const ap = d.querySelector('#magicPill [data-magic="apply"]');
    if (ap) { ap.click(); const ov = await until(() => { const o = d.getElementById('lmUpsellOverlay'); return o && o.classList.contains('visible') && o; }, 6000);
      if (ov) { await settle(700); const card = ov.querySelector('[class*=card], [class*=modal], [class*=sheet]') || ov.firstElementChild; if (card) slot.offer.appendChild(lift(card)); } }

    window.__ds.web = { f, w, d, ev, H };
  }

  async function nat() {
    const base = '/multical/?preso=1&today=2026-09-09' + V;
    const [fS, fM, fX] = await Promise.all([open(base, 430, 932), open(base + '&multi=1', 430, 932), open('/multical/?sampler=1&preso=1&today=2026-09-09' + V, 2400, 1800)]);
    const mS = await until(() => fS.contentWindow.__model), mM = await until(() => fM.contentWindow.__model);
    await until(() => fX.contentDocument.querySelector('.ds .sampler-item'));
    await settle(1200);
    const H = half(document.getElementById('nat'), fS, NAT_CSS);
    const S = fS.contentDocument, M = fM.contentDocument, X = fX.contentDocument;
    const I = (m, d, mo = 9) => m.fx.index({ y: 2026, m: mo, d });

    // 1 · the chrome, from the sampler: the month title through its collapse, the weekday row, Today, the circles, the host
    const r1 = H.row(1560);
    X.querySelectorAll('.ds-chrome .ds-art').forEach(a => r1.appendChild(lift(a)));

    // 2 · the month, lived in: a guest's stay (stroked), a request to book (its coloured initials), a stay the host cancelled,
    //     and two Repeat rules wearing their colours — weekends +20% in purple, Tuesdays and Wednesdays a 3-night minimum in orange
    const rule = (id, days, ci, extra) => ({ id, weekly: true, days: new Set(days), start: I(mS, 10), end: I(mS, 30), mdays: new Set(), listings: [0], price: null, pricePct: null, blocked: null, minNights: null, maxNights: null, checkInDays: new Set(), checkOutDays: new Set(), cancellation: null, name: id, colorIndex: ci, enabled: true, ...extra });
    try { mS.applyRepeat(rule('Weekends', [6, 7], 0, { pricePct: 20 })); mS.applyRepeat(rule('Midweek', [3, 4], 6, { minNights: 3 })); } catch (e) { console.warn(e); }
    const stay = { listing: 0, extraGuests: 1, checkIn: '3:00 PM', checkOut: '11:00 AM', nightly: [], earnings: 0 };
    const faces = mS.bookings.filter(b => b.avatarURL).map(b => b.avatarURL);
    mS.addStay({ ...stay, startIndex: I(mS, 13), nights: 3, guest: 'Maya', avatarURL: faces[0] || '' });
    mS.addStay({ ...stay, startIndex: I(mS, 20), nights: 3, guest: 'Daniel', avatarURL: '', kind: 'request', initials: 'DR', extraGuests: 0 });
    mS.addStay({ ...stay, startIndex: I(mS, 27), nights: 3, guest: 'Priya', avatarURL: faces[1] || '', kind: 'cancelled', extraGuests: 0 });
    mS.setRecurQA(true);
    await settle(1400);
    const grids = [...S.querySelectorAll('.grid')].map(g => [g, g.getBoundingClientRect()]).filter(([, r]) => r.bottom > 100 && r.top < 700);
    const r2 = H.row();
    if (grids.length) { const r = grids[0][1]; r2.appendChild(crop([...S.querySelectorAll('.grid > *, .spill, .grid .pill')], R(r.left - 4, r.top - 4, r.right + 4, r.bottom + 4))); }

    // 3 · picking: three nights (the stroked pick, never the black), and the quick actions they raise — the cards, then the
    //     Repeat quick actions that go with a rule
    mS.setRecurQA(false); mS.setOrigSel(true);
    mS.setSelectedNights(new Set([I(mS, 16), I(mS, 17), I(mS, 18)]));
    await settle(1300);
    const r3 = H.row();
    const pick = [...S.querySelectorAll('.dcell')].filter(c => /\bsel|picked|selected/.test(c.className));
    if (pick.length) { const a = pick[0].getBoundingClientRect(), z = pick[pick.length - 1].getBoundingClientRect(); r3.appendChild(crop(pick, R(a.left - 4, a.top - 4, z.right + 4, z.bottom + 4))); }
    const sqa = S.querySelector('.sqa'); if (sqa) { const cards = [...sqa.querySelectorAll('.sqa-card')]; if (cards.length) { const rs = cards.map(c => c.getBoundingClientRect()); r3.appendChild(crop(cards, R(Math.min(...rs.map(r => r.left)) - 2, Math.min(...rs.map(r => r.top)) - 2, Math.max(...rs.map(r => r.right)) + 2, Math.max(...rs.map(r => r.bottom)) + 2))); } }
    mS.setRecurQA(true); await settle(1300);
    // the Repeat quick actions live in their own shadow root: the whole layer is lifted (its root and styles carried across)
    // and cropped to its cards
    const host = S.querySelector('.recur-host');
    if (host && host.shadowRoot) {
      const cards = [...host.shadowRoot.querySelectorAll('.card')].map(c => c.getBoundingClientRect()).filter(r => r.width > 40 && r.height > 40 && r.bottom > 0 && r.top < 932);
      if (cards.length) r3.appendChild(crop([host], R(Math.min(...cards.map(r => r.left)) - 2, Math.min(...cards.map(r => r.top)) - 2, Math.max(...cards.map(r => r.right)) + 2, Math.max(...cards.map(r => r.bottom)) + 2)));
    }

    // 4 · the multi board, its homes in real photos, two of its stays requests to book
    const REQ = { Mara: ['MK', '#D7EAFB', '#2E80E0'], Britt: ['BH', '#E6E2FB', '#7A6CE8'] };
    M.querySelectorAll('.board .pill').forEach(p => { const n = (p.querySelector('.name') || {}).textContent || '', k = Object.keys(REQ).find(g => n.startsWith(g)); if (!k) return; p.classList.add('preso-req'); const disc = p.firstElementChild; if (disc) { disc.dataset.ini = REQ[k][0]; disc.style.setProperty('--req-bg', REQ[k][1]); disc.style.setProperty('--req-ink', REQ[k][2]); } });
    const bd = M.querySelector('.board'); if (bd) { const r = bd.getBoundingClientRect(); H.row().appendChild(crop([...M.querySelectorAll('.board *')].filter(e => e.matches('.daycell, .cell, .pill, img, [class*=thumb], .wd, .num, .ldot, .lphoto') && !e.closest('.pill *')), R(0, Math.max(0, r.top), 430, Math.min(r.bottom, Math.max(0, r.top) + 790)))); }

    // 5 · every state of the month's date cell, from the sampler — the picks stroked (each black one given the original,
    //     stroked selection), the one that only showed the stroked version dropped as a duplicate
    const r5 = H.row(760);
    X.querySelectorAll('.ds-grid.cells > .sampler-item').forEach(it => {
      const label = (it.querySelector('.ds-label') || {}).textContent || '';
      if (/original/.test(label)) return;
      it.classList.add('origsel'); const ph = it.querySelector('.phone'); if (ph) ph.classList.add('origsel');
    });
    await settle(400);
    X.querySelectorAll('.ds-grid.cells > .sampler-item > .phone').forEach(ph => { if (/original/.test((ph.parentElement.querySelector('.ds-label') || {}).textContent || '')) return; r5.appendChild(lift(ph)); });

    // 6 · the guests' pills on the month, the views at their own size (month, list, year, day), the drawn events and holidays
    const r6 = H.row(760); X.querySelectorAll('.ds-grid.pills .ds-art').forEach(a => r6.appendChild(lift(a)));
    const r7 = H.row(); [...X.querySelectorAll('.ds-views .ds-art')].filter(a => !a.querySelector('.ds-multi')).forEach(a => r7.appendChild(lift(a)));
    const r8 = H.row(); X.querySelectorAll('.ds-grid.marks .ds-art').forEach(a => r8.appendChild(lift(a)));

    window.__ds.nat = { fS, fM, fX, mS, mM, H };
  }

  async function run() {
    await Promise.all([web().catch(e => console.error('[12d1 web]', e)), nat().catch(e => console.error('[12d1 native]', e))]);
    fit(); sheet.classList.add('ready');
  }
  run();
})();
</script>
</body>
