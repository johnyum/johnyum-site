<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12d1</title>
<!-- THE DESIGN SYSTEM — one sheet of every piece the calendars are built from.

     Straight after the multi calendar's two-up (12c; the native phone alone, 12d, came out of the running order 2026-10-03 — it
     still plays inside 12c's duo) and before Lesson 3: the pieces come out of the product and stand on a white
     sheet, numbered — the date cells in every state (the moving ones looping), the guest pills on both calendars, the
     drawn events and holidays, one specimen from each view at its true size, and the chrome.

     They are the app's OWN components under the app's OWN stylesheet: the sheet is the calendar served at
     /multical/?sampler=1, which renders the real DayCell, the real .spill, the real .lrow — framed here and scaled to
     fill the stage. Nothing is redrawn, so nothing can drift from the build.

     No build of its own: the deck pushes straight through. -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  /* flex, not grid: the sheet is taller than the frame before its scale, and a grid row grows to hold it — flex keeps its centre on the frame's */
  .stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  /* the sheet lays itself out at its own size; JS below reads that size and scales the box to the stage */
  .sheet { position: relative; flex: none; width: 2280px; height: 1380px; transform: scale(var(--s, 1)); transform-origin: center; opacity: 0; transition: opacity .35s; }
  .sheet.ready { opacity: 1; }
  .sheet iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
</style>
</head>
<body>
  <div class="stage"><div class="sheet" id="sheet"><iframe id="cells" title="The design system"></iframe></div></div>
<script>
(() => {
  const v = new URLSearchParams(location.search).get('v');
  const frame = document.getElementById('cells'), sheet = document.getElementById('sheet');
  frame.src = '/multical/?sampler=1&preso=1&today=2026-09-09' + (v ? '&v=' + v : '');
  let W = 2280, H = 1380;
  // THE SHEET KEEPS ITS DISTANCE from the deck's own type: 40 under the kicker ("John Yum · Work") and 40 above the
  // section nav, the same clearance the web build's box keeps (12c).
  const band = () => {
    let top = 0, bottom = innerHeight;
    try { const pd = window.parent.document, k = pd.getElementById('kicker'), c = pd.getElementById('counter');
          if (k) top = k.getBoundingClientRect().bottom + 40; if (c) bottom = c.getBoundingClientRect().top - 40; } catch (_) {}
    return Math.max(200, bottom - top);
  };
  const fit = () => { const s = Math.min((innerWidth - 64) / W, band() / H); if (s > 0) sheet.style.setProperty('--s', s.toFixed(4)); };
  fit(); addEventListener('resize', fit);
  // THE SHEET SIZES ITSELF. Its width comes from the sections' own content, so rather than hold a number here that
  // would drift the moment a specimen is added, the box takes the size the sheet reports and re-takes it while the
  // drawn marks and the guests' faces land (they can widen a row). Measured for two seconds, then left alone.
  const measure = () => {
    let d; try { d = frame.contentDocument; } catch (_) { return false; }
    const el = d && d.querySelector('.ds'); if (!el) return false;
    const r = el.getBoundingClientRect(); if (!r.width || !r.height) return false;
    if (Math.abs(r.width - W) > 1 || Math.abs(r.height - H) > 1) {
      W = Math.round(r.width); H = Math.round(r.height);
      sheet.style.width = W + 'px'; sheet.style.height = H + 'px'; fit();
    }
    return true;
  };
  const t0 = Date.now();
  const tick = () => { const got = measure(); if (got) sheet.classList.add('ready'); if (Date.now() - t0 < 2400) setTimeout(tick, 120); };
  frame.addEventListener('load', tick); setTimeout(tick, 300);
  // UPDATED TO TODAY'S COMPONENTS (John, 2026-10-03: "go back to that one but update it with newer components… remove the
  // secondary type everywhere"). The sheet is the app's own sampler, so it is dressed from here rather than rebuilt:
  //  · no labels — only the components and their section titles;
  //  · every pick STROKED, the selection the product ships, never the black fill: each phone is given the sampler's own
  //    `origsel` (the black is only drawn on a phone without it), and the cell that existed only to show the stroked pick
  //    beside the black one goes, now that every pick is stroked;
  //  · the guests' stays stroked — white, a 1.5 #222 line, the name in #222 — on the month and on the board;
  //  · the multi board's homes in real photos rather than grey squares.
  frame.addEventListener('load', () => {
    const d = frame.contentDocument;
    const st = d.createElement('style');
    const HOMES = ['1564013799919-ab600027ffc6', '1600596542815-ffad4c1539a9', '1568605114967-8130f3a36994'];
    st.textContent = '.ds-label{display:none!important}'
      + '.spill.glass-dark,.pill.glass-dark{background:#fff!important;border:1.5px solid #222!important;box-sizing:border-box;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;box-shadow:none!important}'
      + '.spill.glass-dark::before,.spill.glass-dark::after,.pill.glass-dark::before,.pill.glass-dark::after{display:none!important}'
      + '.spill.glass-dark .name,.pill.glass-dark .name{color:#222!important}'
      + '.lpill,.ypill{background:#fff!important;border:1.5px solid #222!important;box-sizing:border-box;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}'   // the list's and the year's stays too
      + '.sampler-item[data-dup]{display:none!important}'
      + HOMES.map((h, i) => `.ds-thumbrow .ds-thumb:nth-child(${i + 1}){background:url("https://images.unsplash.com/photo-${h}?w=120&h=120&fit=crop&q=80") center/cover!important}`).join('');
    d.head.appendChild(st);
    const stroke = () => d.querySelectorAll('.sampler-item').forEach(it => {
      if (/original/.test((it.querySelector('.ds-label') || {}).textContent || '')) { it.dataset.dup = 1; return; }
      if (!it.classList.contains('origsel')) it.classList.add('origsel');
      const ph = it.querySelector('.phone'); if (ph && !ph.classList.contains('origsel')) ph.classList.add('origsel');
    });
    stroke(); new frame.contentWindow.MutationObserver(stroke).observe(d.body, { childList: true, subtree: true });
  });
})();
</script>
</body>
</html>
