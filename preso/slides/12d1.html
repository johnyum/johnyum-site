<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12d1</title>
<!-- THE COMPONENT LIBRARY — the primitives the calendars are built from, by component, not by platform (John, 2026-10-03:
     "I only want the primitives… this is a component library"). Straight after the multi calendar's two-up (12c).

     DATE CELLS first and biggest: every state of the phone's cell (the most of it, as the mobile version is the most of the
     product); every Repeat variation, one cell per colour of the rule palette, each carrying a different rule (price up and
     down, a minimum, a maximum, closed, a check-in rule, a fixed price); then the cell at its other sizes — the web board's in
     its states, the phone's multi board's. Then the PILLS: stays (stroked, never black), requests to book in every colour
     their discs come in, cancelled, past. Then the CONTROLS, the EVENTS AND HOLIDAYS, the HOMES' PHOTOS. ALL THE QUICK ACTIONS
     stand together down the right: the web bar and its menus, Show tips and a tip, the phone's cards and Repeat's. No boards,
     no months, no modals: nothing assembled, only the pieces.

     LIFTED, NOT DRAWN. The slide runs the builds themselves unseen behind the sheet — the web one (/multi/), the native one
     (/multical/, single and multi) and its cell sampler (/multical/?sampler=1) — steps each into the state a piece needs, and
     lifts the real element out: a deep clone inside shallow clones of the ancestors it hangs from, so every selector and
     inherited variable still lands. EVERY PIECE IS ITS OWN SHADOW ROOT, adopting its build's stylesheet (one constructed
     sheet per build, shared by all its pieces): web and native share class names (.cell, .pill, .phone) and must never see
     each other's rules, yet here they stand side by side in one group. A build that changes changes the sheet.

     The deck builds one slide ahead, so the sheet assembles while 12c is up (about 40s from cold). It lays itself out at its
     natural size and is scaled to the band between the deck's kicker and its nav. No build of its own. -->
<style>
  @font-face { font-family: "IBM Plex Mono"; src: url("../fonts/IBMPlexMono-Regular.woff2") format("woff2"); font-weight: 400 500; font-display: block; }
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  /* the builds, running unseen: full size (they lay out as they would on a screen), under the sheet, never touched */
  .src { position: fixed; left: 0; top: 0; border: 0; opacity: 0; pointer-events: none; z-index: -1; }
  .stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #fff; }
  .sheet { position: relative; flex: none; transform: scale(var(--s, 1)); transform-origin: center; opacity: 0; transition: opacity .45s; }
  .sheet.ready { opacity: 1; }
  /* the library: the primitives on the left, every quick action in one column on the right */
  .lib { display: flex; gap: 120px; align-items: flex-start; }
  .main { width: 1700px; display: flex; flex-direction: column; gap: 72px; }
  .qa { width: 880px; display: flex; flex-direction: column; gap: 40px; }
  .sec { display: flex; flex-direction: column; gap: 28px; }
  .sec > h2 { margin: 0; font: 400 26px/1 "IBM Plex Mono", ui-monospace, Menlo, monospace; color: #111; }
  .grp { display: flex; flex-wrap: wrap; gap: 20px 20px; align-items: flex-start; }
  .grp.wide { gap: 24px 40px; align-items: center; }
  .cols { display: flex; gap: 72px; align-items: flex-start; }
  .pc { flex: none; }
</style>
</head>
<body>
  <div class="stage"><div class="sheet" id="sheet"><div class="lib">
    <div class="main">
      <section class="sec"><h2>Date cells</h2>
        <div class="grp" id="cells"></div>
        <div class="grp" id="repeat"></div>
        <div class="grp wide" id="sizes"></div>
      </section>
      <section class="sec"><h2>Stays</h2><div class="grp wide" id="pills"></div></section>
      <div class="cols">
        <section class="sec"><h2>Controls</h2><div class="grp wide" id="controls" style="max-width:1000px"></div></section>
        <section class="sec"><h2>Homes</h2><div class="grp" id="homes" style="max-width:520px"></div></section>
      </div>
      <section class="sec"><h2>Events and holidays</h2><div class="grp" id="events"></div></section>
    </div>
    <div class="qa"><section class="sec"><h2>Quick actions</h2><div class="grp wide" id="qa"></div></section></div>
  </div></div></div>
<script>
(() => {
  const v = new URLSearchParams(location.search).get('v'), V = v ? '&v=' + v : '';
  const sheet = document.getElementById('sheet'), $ = id => document.getElementById(id);
  const wait = ms => new Promise(r => setTimeout(r, ms));
  // A WAIT IS TIME AND FRAMES: the builds draw on animation frames, so every pause also waits for three real ones — a timer
  // alone could run out while the page is not being painted and capture a half-drawn state
  const frames = (n = 3) => new Promise(r => { let k = 0; const f = () => (++k >= n ? r() : requestAnimationFrame(f)); requestAnimationFrame(f); });
  const settle = async ms => { await wait(ms); await frames(); await wait(60); };
  const until = async (fn, ms = 15000) => { const t = Date.now(); while (Date.now() - t < ms) { try { const x = fn(); if (x) return x; } catch (_) {} await wait(80); } return null; };
  const open = (url, w, h) => new Promise(res => {
    const f = document.createElement('iframe'); f.className = 'src'; f.setAttribute('aria-hidden', 'true'); f.tabIndex = -1;
    f.style.width = w + 'px'; f.style.height = h + 'px';
    f.addEventListener('load', () => res(f), { once: true }); f.src = url; document.body.appendChild(f);
  });

  // ── A BUILD'S OWN STYLESHEET ─────────────────────────────────────────────────────────────────────────────────────────
  // Every rule, URLs made absolute; html / :root become :host and body .ds-body; a media rule decided against the BUILD's
  // window (the phone is 430 wide, the sheet is not); font faces up to this document, where they load.
  const faces = new Set();
  function cssOf(doc, win) {
    const abs = (t, base) => t.replace(/url\(\s*(['"]?)([^'")]+)\1\s*\)/g, (m, q, u) => /^(data:|https?:|blob:|#)/.test(u) ? m : 'url("' + new URL(u, base).href + '")');
    const rw = sel => sel.split(',').map(s => s
      .replace(/(^|[\s>+~(])(?:html|:root)(?=$|[\s.:#\[>+~),])/g, '$1:host')
      .replace(/(^|[\s>+~(])body(?=$|[\s.:#\[>+~),])/g, '$1.ds-body')).join(',');
    // by the rule's own type: an iframe's rules are of ITS window's classes, so instanceof against ours is always false
    const kind = r => r.constructor && r.constructor.name;
    const ser = (r, base) => {
      if (kind(r) === 'CSSStyleRule') return rw(r.selectorText) + '{' + abs(r.style.cssText, base) + '}' + (r.cssRules && r.cssRules.length ? [...r.cssRules].map(x => ser(x, base)).join('') : '');
      if (kind(r) === 'CSSMediaRule') { let on = false; try { on = win.matchMedia(r.conditionText).matches; } catch (_) {} return on ? [...r.cssRules].map(x => ser(x, base)).join('') : ''; }
      if (kind(r) === 'CSSSupportsRule') return '@supports ' + r.conditionText + '{' + [...r.cssRules].map(x => ser(x, base)).join('') + '}';
      if (kind(r) === 'CSSFontFaceRule') { faces.add(abs(r.cssText, base)); return ''; }
      if (kind(r) === 'CSSImportRule') return r.styleSheet ? [...r.styleSheet.cssRules].map(x => ser(x, r.styleSheet.href || base)).join('') : '';
      return abs(r.cssText, base);
    };
    let out = '';
    for (const sh of [...doc.styleSheets, ...(doc.adoptedStyleSheets || [])]) {
      let rules; try { rules = sh.cssRules; } catch (_) { continue; }
      const base = sh.href || doc.baseURI;
      for (const r of rules) out += ser(r, base) + '\n';
    }
    return out;
  }
  const flushFaces = () => { let s = document.getElementById('faces'); if (!s) { s = document.createElement('style'); s.id = 'faces'; document.head.appendChild(s); } s.textContent = [...faces].join('\n'); };
  // one constructed sheet per build, adopted by every piece of it
  const BASE = ':host{display:block}.ds-body{position:static!important;inset:auto!important;width:auto!important;height:auto!important;min-height:0!important;overflow:visible!important;background:transparent!important;margin:0!important;padding:0!important;transform:none!important}.dsx-lift{position:relative;flex:none}';
  const SHEETS = {};
  function register(key, f, extra) {
    const sh = new CSSStyleSheet();
    sh.replaceSync(cssOf(f.contentDocument, f.contentWindow) + '\n' + BASE + (extra || ''));
    SHEETS[key] = { sh, body: 'ds-body ' + f.contentDocument.body.className };
    flushFaces();
  }
  function piece(key, node) {
    const host = document.createElement('div'); host.className = 'pc';
    const sr = host.attachShadow({ mode: 'open' }); sr.adoptedStyleSheets = [SHEETS[key].sh];
    const b = document.createElement('div'); b.className = SHEETS[key].body; b.appendChild(node); sr.appendChild(b);
    return host;
  }
  // ── LIFTING ─────────────────────────────────────────────────────────────────────────────────────────────────────────
  // The element, deep-cloned, inside shallow clones of every ancestor up to <body> — so `.board .cell` and `#gridRows
  // .booking-pill` still match and inherited custom properties still arrive — with the ancestors' own layout neutralised
  // and the element held at the size it had in the build. Canvases are copied pixel for pixel; an open shadow root is
  // carried across with its contents and its styles.
  const NEUTRAL = { position: 'static', inset: 'auto', transform: 'none', translate: 'none', scale: 'none', rotate: 'none', width: 'auto', height: 'auto', 'min-width': '0', 'min-height': '0', 'max-width': 'none', 'max-height': 'none', margin: '0', padding: '0', overflow: 'visible', opacity: '1', visibility: 'visible', display: 'block', filter: 'none', 'clip-path': 'none', mask: 'none', contain: 'none', 'pointer-events': 'none', animation: 'none', transition: 'none', 'box-shadow': 'none', border: '0', background: 'transparent' };
  const setAll = (el, props) => { for (const k in props) el.style.setProperty(k, props[k], 'important'); };
  // URLs made absolute against the build: a relative src in a clone would resolve against this slide
  const URLATTR = ['src', 'href', 'poster', 'xlink:href'];
  function carry(src, dst) {   // canvases, shadow roots and URLs, walked in step
    for (const a of URLATTR) { const val = src.getAttribute && src.getAttribute(a); if (val && !/^(data:|https?:|blob:|#|javascript:)/.test(val)) { try { dst.setAttribute(a, new URL(val, src.ownerDocument.baseURI).href); } catch (_) {} } }
    if (src.getAttribute && src.getAttribute('srcset')) dst.removeAttribute('srcset');
    if (src.style && /url\(/.test(src.getAttribute('style') || '')) dst.setAttribute('style', src.getAttribute('style').replace(/url\(\s*(['"]?)([^'")]+)\1\s*\)/g, (m, q, u) => /^(data:|https?:|blob:)/.test(u) ? m : 'url("' + new URL(u, src.ownerDocument.baseURI).href + '")'));
    if (src.tagName === 'CANVAS') { try { dst.width = src.width; dst.height = src.height; dst.getContext('2d').drawImage(src, 0, 0); } catch (_) {} }
    if (src.shadowRoot) {
      const sr = dst.shadowRoot || dst.attachShadow({ mode: 'open' });
      sr.innerHTML = src.shadowRoot.innerHTML;
      const css = [...(src.shadowRoot.adoptedStyleSheets || [])].map(s => [...s.cssRules].map(r => r.cssText).join('\n')).join('\n');
      if (css) { const st = document.createElement('style'); st.textContent = css; sr.prepend(st); }
    }
    const a = src.children, b = dst.children;
    for (let i = 0; i < a.length && i < b.length; i++) carry(a[i], b[i]);
  }
  function lift(el, { w, h, keep } = {}) {
    const doc = el.ownerDocument, r = el.getBoundingClientRect();
    const outer = document.createElement('div'); outer.className = 'dsx-lift';
    outer.style.transform = 'translateZ(0)';   // a containing block: anything inside pinned to the build's screen (position:fixed) lands where it stood
    let cur = outer;
    const chain = []; for (let p = el.parentElement; p && p !== doc.body && p !== doc.documentElement; p = p.parentElement) chain.unshift(p);
    for (const p of chain) { const s = p.cloneNode(false); setAll(s, NEUTRAL); cur.appendChild(s); cur = s; }
    const c = el.cloneNode(true);
    carry(el, c);
    setAll(c, Object.assign({ position: 'relative', inset: 'auto', margin: '0', translate: 'none', 'pointer-events': 'none' }, keep ? {} : { transform: 'none' }));
    c.style.setProperty('width', (w || r.width) + 'px', 'important'); c.style.setProperty('height', (h || r.height) + 'px', 'important');
    c.removeAttribute('id');
    cur.appendChild(c);
    outer.style.width = (w || r.width) + 'px'; outer.style.height = (h || r.height) + 'px';
    return outer;
  }
  // several elements kept where they stood relative to each other, cropped to a rectangle (build coordinates) — a stretch of
  // board or month with its pills, its photos and its dates, as one piece
  function crop(els, rect) {
    const box = document.createElement('div'); box.className = 'dsx-lift';
    Object.assign(box.style, { width: rect.width + 'px', height: rect.height + 'px', overflow: 'hidden' });
    els.forEach(el => {
      const r = el.getBoundingClientRect();
      if (r.right <= rect.left || r.left >= rect.right || r.bottom <= rect.top || r.top >= rect.bottom || !r.width || !r.height) return;
      const n = lift(el); n.style.position = 'absolute'; n.style.left = (r.left - rect.left) + 'px'; n.style.top = (r.top - rect.top) + 'px';
      box.appendChild(n);
    });
    return box;
  }
  const R = (l, t, r, b) => ({ left: l, top: t, right: r, bottom: b, width: r - l, height: b - t });
  const box = els => { const rs = els.map(e => e.getBoundingClientRect()); return R(Math.min(...rs.map(r => r.left)) - 2, Math.min(...rs.map(r => r.top)) - 2, Math.max(...rs.map(r => r.right)) + 2, Math.max(...rs.map(r => r.bottom)) + 2); };
  // within a group the phone's pieces come first and the web's after, whichever build is ready first
  const slot = (id, key) => { const g = $(id); let s = g.querySelector(':scope > [data-k="' + key + '"]');
    if (!s) { ['nat', 'web'].forEach(k => { if (!g.querySelector(':scope > [data-k="' + k + '"]')) { const d = document.createElement('div'); d.dataset.k = k; d.style.display = 'contents'; g.appendChild(d); } }); s = g.querySelector(':scope > [data-k="' + key + '"]'); }
    return s; };
  const put = (id, key, node) => { if (node) slot(id, key).appendChild(piece(key, node)); };
  window.__ds = { open, lift, crop, R, wait, until };

  // ── SCALE TO THE BAND: 40 under the kicker ("John Yum · Work"), 40 above the section nav ────────────────────────────
  const band = () => {
    let top = 0, bottom = innerHeight;
    try { const pd = window.parent.document, k = pd.getElementById('kicker'), c = pd.getElementById('counter');
          if (k) top = k.getBoundingClientRect().bottom + 40; if (c) bottom = c.getBoundingClientRect().top - 40; } catch (_) {}
    return Math.max(200, bottom - top);
  };
  const fit = () => { const W = sheet.offsetWidth, H = sheet.offsetHeight; if (!W || !H) return; const s = Math.min((innerWidth - 64) / W, band() / H); sheet.style.setProperty('--s', s.toFixed(4)); };
  addEventListener('resize', fit); new ResizeObserver(fit).observe(sheet);

  // stays STROKED, never black (John, 2026-10-03); requests to book in their coloured discs
  const REQ = [['#D7EAFB', '#2E80E0'], ['#FCE7E3', '#F4513C'], ['#E6E2FB', '#7A6CE8'], ['#FBE5CC', '#DD6B0E'], ['#FBE3F1', '#E63FA0']];   // Blue, Coral, Purple, Orange, Pink: the build's own label colours
  const WEB_CSS =
      '.booking-pill:not(.preso-req):not(.past){background:#fff!important;border:1.5px solid #222!important;box-sizing:border-box}'
    + '.booking-pill:not(.preso-req):not(.past) .booking-name{color:#222!important}'
    + '.booking-pill.preso-req{background:#fff!important;border:1.5px dashed #222!important;box-sizing:border-box}'
    + '.booking-pill.preso-req .booking-name{color:#222!important}'
    + '.booking-pill.preso-req .booking-avatar{background:var(--req-bg)!important;display:grid;place-items:center}'
    + '.booking-pill.preso-req .booking-avatar img{display:none}'
    + '.booking-pill.preso-req .booking-avatar::after{content:attr(data-ini);color:var(--req-ink);font:700 11px/1 Cereal,sans-serif;letter-spacing:.02em}'
    + '.bp-ask{display:none!important}';
  const NAT_CSS =
      '.spill.glass-dark,.pill.glass-dark{background:#fff!important;border:1.5px solid #222!important;box-sizing:border-box;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;box-shadow:none!important}'
    + '.spill.glass-dark::before,.spill.glass-dark::after,.pill.glass-dark::before,.pill.glass-dark::after{display:none!important}'
    + '.spill.glass-dark .name,.pill.glass-dark .name{color:#222!important}'
    + '.pill.preso-req{background:#fff!important;border:1.5px dashed #222!important;box-sizing:border-box;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;box-shadow:none!important}'
    + '.pill.preso-req::before,.pill.preso-req::after{display:none!important}.pill.preso-req .name{color:#222!important}'
    + '.pill.preso-req>span:first-child{background:var(--req-bg)!important;display:grid!important;place-items:center}'
    + '.pill.preso-req>span:first-child img{display:none}'
    + '.pill.preso-req>span:first-child::after{content:attr(data-ini);color:var(--req-ink);font:700 11px/1 Cereal,sans-serif;letter-spacing:.02em}'
    + '.ds-label{display:none!important}';

  // ── WEB (/multi/) ───────────────────────────────────────────────────────────────────────────────────────────────────
  async function web() {
    const f = await open('/multi/?' + V.slice(1), 1720, 1000), w = f.contentWindow, d = f.contentDocument;
    const ev = c => { try { return w.eval(c); } catch (e) { console.warn('[12d1 web]', e); } };
    await until(() => d.querySelectorAll('#gridRows .price-row').length > 5 && d.querySelector('#gridRows .price-card'));
    d.body.classList.remove('no-header');
    // as the deck shows it (12c): the pro tier at 48px rows, guests in, real prices, on today
    const den = d.createElement('style');
    den.textContent = 'body.host-pro:not(.settings-mode):not(.avail-mode):not(.super-collapse-2) .price-row{height:48px}body.host-pro:not(.super-collapse-2) .thumb-row{height:48px}body.host-pro{--thumb:40px}#devBar{display:none!important}';
    d.head.appendChild(den);
    try { w.switchHost('pro', true); w.setDataMode('none', true); } catch (e) { console.warn(e); }
    await settle(600);
    ['devBookings', 'devVariance'].forEach(id => { const b = d.getElementById(id); if (b && !b.checked) { b.checked = true; b.dispatchEvent(new w.Event('change')); } });
    ev('gridWrap.scrollLeft = Math.max(0, (rowOffsets[calStartDi()] || 0) - GRID_GUTTER); gridWrap.scrollTop = 0; gridWrap.dispatchEvent(new Event("scroll"));');
    await settle(1200);
    register('web', f, WEB_CSS);
    const vis = el => { const r = el.getBoundingClientRect(); return r.width > 0 && r.left > 100 && r.right < 1700 && r.top > 150 && r.bottom < 980; };

    // controls: the view toggle, the arrows and Today, search, Group
    ['segToggle', 'calNavGroup', 'searchPill', 'tbGroupBtn'].forEach(id => { const e = d.getElementById(id); if (e && e.getBoundingClientRect().width) put('controls', 'web', lift(e)); });
    // the homes' photos
    [...d.querySelectorAll('#listingThumbsInner .thumb-img')].slice(0, 12).forEach(t => put('homes', 'web', lift(t)));

    // the web cell in each of its states, by its own classes (never one under a stay): open, past, closed, closed for a
    // minimum stay — then, below, picked, and a tip's: resting, in focus, applied
    const cardsOf = sel => [...d.querySelectorAll('#gridRows .price-card' + sel)].filter(c => { const r = c.getBoundingClientRect(); return r.width > 0 && r.top > 0 && r.left > 92; });
    const one = (sel, not) => { const c = cardsOf(sel).find(x => !x.classList.contains('booked') && !(not && x.matches(not))); if (c) put('sizes', 'web', lift(c)); };
    one(':not(.past):not(.unavailable):not(.opt-flag):not(.selected)');
    one('.past');
    one('.closed-rule.unavailable');
    one('.min-closed.unavailable', '.opt-flag');

    // stays: one stroked, one past, and a request to book in each colour its disc comes in
    const pills = [...d.querySelectorAll('#gridRows .booking-pill')].filter(p => { const r = p.getBoundingClientRect(); return r.width > 0 && r.left > 92 && r.top > 0 && r.top < 1000 && !p.classList.contains('past'); });
    if (pills[0]) put('pills', 'web', lift(pills[0], { w: 240 }));
    const past = d.querySelector('#gridRows .booking-pill.past'); if (past) put('pills', 'web', lift(past, { w: 240 }));
    pills.slice(1, 1 + REQ.length).forEach((p, k) => {
      p.classList.add('preso-req'); const av = p.querySelector('.booking-avatar'), g = p.dataset.guest || 'G';
      if (av) { av.dataset.ini = (g[0] + 'RMKLT'[k]).toUpperCase(); av.style.setProperty('--req-bg', REQ[k][0]); av.style.setProperty('--req-ink', REQ[k][1]); }
      put('pills', 'web', lift(p, { w: 240 }));
    });

    // picking: the picked cell, the quick actions bar and every menu it opens
    const order = [...d.querySelectorAll('#gridRows .price-row')].map(r => +r.dataset.li);
    ev(`selectRange({ li: ${order[0]}, di: todayDi + 1 }, { li: ${order[0]}, di: todayDi + 3 })`);
    await settle(900);
    one('.selected');
    const ma = d.getElementById('maPill'); if (ma) put('qa', 'web', lift(ma));
    for (const [fn, id] of [['openAvailMenu', 'availMenu'], ['openPriceMenu', 'priceMenu'], ['openDiscountsMenu', 'discountsMenu'], ['openMinNightsMenu', 'minNightsMenu']]) {
      if (typeof w[fn] !== 'function') continue;
      ev(fn + '()'); await settle(700);
      const m = d.getElementById(id); if (m && m.getBoundingClientRect().width) put('qa', 'web', lift(m));
    }
    ev('clearSelection()'); await settle(500);

    // tips: the button, a tip (Del Mar) and its cells in focus, then applied
    const mp = d.getElementById('magicPill'); if (mp && mp.getBoundingClientRect().width) put('qa', 'web', lift(mp));
    ev('startOptimize()');
    await until(() => w.__opt && w.__opt.suggs && w.__opt.suggs.length && !d.body.classList.contains('opt-scanning'), 12000); await settle(1200);
    ev("(() => { const o = window.__opt; const i = o.suggs.findIndex(s => /Del Mar/.test(s.title || s.name || '')); if (i >= 0) { o.cur = i; renderMagicPill(); focusOpportunity(); } })()");
    await settle(3200);
    if (mp) put('qa', 'web', lift(mp));
    one('.opt-flag.is-settled.opt-fill:not(.opt-focus)'); one('.opt-flag.opt-focus');
    const ap = d.querySelector('#magicPill [data-magic="apply"]');
    if (ap) { ap.click(); await settle(2600); one('.opt-applied'); }
  }

  // ── NATIVE (/multical/) ─────────────────────────────────────────────────────────────────────────────────────────────
  async function nat() {
    const base = '/multical/?preso=1&today=2026-09-09' + V;
    const [fS, fM, fX] = await Promise.all([open(base, 430, 932), open(base + '&multi=1', 430, 932), open('/multical/?sampler=1&preso=1&today=2026-09-09' + V, 2400, 1800)]);
    const mS = await until(() => fS.contentWindow.__model), mM = await until(() => fM.contentWindow.__model);
    await until(() => fX.contentDocument.querySelector('.ds .sampler-item'));
    await settle(1200);
    register('nat', fS, NAT_CSS);
    const S = fS.contentDocument, M = fM.contentDocument, X = fX.contentDocument;
    const I = (m, d) => m.fx.index({ y: 2026, m: 9, d });
    const sept = () => [...S.querySelectorAll('.grid')].find(g => { const r = g.getBoundingClientRect(); return r.bottom > 100 && r.top < 700; });
    const dayCell = d => { const g = sept(); return g && [...g.querySelectorAll('.dcell')].find(c => (c.querySelector('.date') || {}).textContent === String(d)); };

    // 1 · the phone's date cell, every state: the sampler's, each pick given the stroked selection (the duplicate that only
    //     ever showed the stroked one dropped)
    X.querySelectorAll('.ds-grid.cells > .sampler-item').forEach(it => { if (/original/.test((it.querySelector('.ds-label') || {}).textContent || '')) { it.dataset.skip = 1; return; } it.classList.add('origsel'); const ph = it.querySelector('.phone'); if (ph) ph.classList.add('origsel'); });
    await settle(400);
    X.querySelectorAll('.ds-grid.cells > .sampler-item:not([data-skip]) > .phone').forEach(ph => put('cells', 'nat', lift(ph)));

    // 2 · REPEAT: a rule in every colour of its palette, a night each, each carrying a different setting
    const SET = [{ pricePct: 20 }, { pricePct: -15 }, { minNights: 3 }, { maxNights: 7 }, { blocked: true }, { checkInDays: new Set([1, 2, 3, 4, 5, 6, 7]) }, { price: 650 }, { pricePct: 35, minNights: 2 }];
    // a YEARLY rule on a one-night range (a weekly one ignores its range and would repeat on its weekdays all year)
    SET.forEach((x, i) => { const n = I(mS, 14 + i); try { mS.applyRepeat({ id: 'r' + i, weekly: false, days: new Set(), start: n, end: n, mdays: new Set(), listings: [0], price: null, pricePct: null, blocked: null, minNights: null, maxNights: null, checkInDays: new Set(), checkOutDays: new Set(), cancellation: null, name: 'r' + i, colorIndex: i, enabled: true, ...x }); } catch (e) { console.warn(e); } });
    mS.setRecurQA(true);
    await settle(1400);
    for (let i = 0; i < SET.length; i++) { const c = dayCell(14 + i); if (c) put('repeat', 'nat', lift(c)); }

    // 3 · stays on the month: a request to book (its initials on the disc), and one the host cancelled
    const stay = { listing: 0, extraGuests: 0, checkIn: '3:00 PM', checkOut: '11:00 AM', nightly: [], earnings: 0 };
    mS.addStay({ ...stay, startIndex: I(mS, 23), nights: 2, guest: 'Daniel', avatarURL: '', kind: 'request', initials: 'DR' });
    mS.addStay({ ...stay, startIndex: I(mS, 27), nights: 2, guest: 'Priya', avatarURL: '', kind: 'cancelled' });
    await settle(1200);
    X.querySelectorAll('.ds-grid.pills .ds-art').forEach(a => put('pills', 'nat', lift(a)));
    S.querySelectorAll('.spill').forEach(p => { if (p.getBoundingClientRect().width) put('pills', 'nat', lift(p)); });

    // 4 · the phone's quick actions: the cards a pick raises, then Repeat's
    mS.setRecurQA(false); mS.setOrigSel(true);
    mS.setSelectedNights(new Set([I(mS, 9), I(mS, 10), I(mS, 11)]));
    await settle(1300);
    const cards = [...S.querySelectorAll('.sqa .sqa-card')]; if (cards.length) put('qa', 'nat', crop(cards, box(cards)));
    mS.setRecurQA(true); await settle(1300);
    const host = S.querySelector('.recur-host');
    if (host && host.shadowRoot) { const rc = [...host.shadowRoot.querySelectorAll('.card')].filter(c => { const r = c.getBoundingClientRect(); return r.width > 40 && r.height > 40 && r.bottom > 0 && r.top < 932; }); if (rc.length) put('qa', 'nat', crop([host], box(rc))); }

    // 5 · the multi board's cell (plain, picked) and its stays (stroked, requests)
    const bc = [...M.querySelectorAll('.board .cell')].filter(c => { const r = c.getBoundingClientRect(); return r.width && r.top > 150 && r.bottom < 900 && r.left > 60; });
    if (bc[0]) put('sizes', 'nat', lift(bc[0]));
    const BREQ = { Mara: ['MK', REQ[0]], Britt: ['BH', REQ[2]] };
    M.querySelectorAll('.board .pill').forEach(p => { const n = (p.querySelector('.name') || {}).textContent || '', k = Object.keys(BREQ).find(g => n.startsWith(g)); if (!k) return; p.classList.add('preso-req'); const disc = p.firstElementChild; if (disc) { disc.dataset.ini = BREQ[k][0]; disc.style.setProperty('--req-bg', BREQ[k][1][0]); disc.style.setProperty('--req-ink', BREQ[k][1][1]); } });
    const bp = [...M.querySelectorAll('.board .pill')].filter(p => { const r = p.getBoundingClientRect(); return r.width > 100 && r.left > 60 && !p.classList.contains('snapped'); });   // whole pills only: one clipped at the board's edge draws snapped
    const plain = bp.find(p => !p.classList.contains('preso-req')); if (plain) put('pills', 'nat', lift(plain, { w: 200 }));
    bp.filter(p => p.classList.contains('preso-req')).forEach(p => put('pills', 'nat', lift(p, { w: 200 })));

    // 6 · the phone's controls and the drawn events and holidays, from the sampler
    X.querySelectorAll('.ds-chrome .ds-art').forEach(a => put('controls', 'nat', lift(a)));
    X.querySelectorAll('.ds-grid.marks .ds-art').forEach(a => put('events', 'nat', lift(a)));
  }

  (async () => {
    await Promise.all([web().catch(e => console.error('[12d1 web]', e)), nat().catch(e => console.error('[12d1 native]', e))]);
    fit(); sheet.classList.add('ready');
  })();
})();
</script>
</body>
</html>
