<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>08a</title>
<!-- THE BRIEF — what opens the Luxé chapter, the way 10c opens Host setup and
     12a opens the Calendar.

     The line is set in the SAME type as the work list on slide 07: Special
     Gothic Condensed One at clamp(16px, 6.1vh, 62px), one clause per line and
     no line much past the mid-thirties in characters, so every statement slide
     in the deck reads as the same voice at the same scale and breaks on the
     same rhythm. Named 08a so the manifest drops it between the Luxé card (08)
     and Villa Mayana (09). No build.

     It does not name Plus and Luxe. The chapter title card already said Luxé,
     and the names are the presenter's to say — the slide only has to state the
     ambition the chapter is measured against.

     Rag 309 / 467 / 290: middle longest, top and bottom within 19px. -->
<style>
  @font-face {
    font-family: "Special Gothic Condensed One";
    src: url("../fonts/SpecialGothicCondensedOne.woff2") format("woff2");
    font-weight: 400;
    font-display: block;
  }
  html, body {
    margin: 0; height: 100%;
    background: #fff; color: #111;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .slide { height: 100%; display: grid; place-items: center; }
  .pm { text-align: center; }
  h1 {
    margin: 0;
    font-family: "Special Gothic Condensed One", "Helvetica Neue", sans-serif;
    font-weight: 400;
    font-size: clamp(16px, 6.1vh, 62px);   /* slide 07's list, exactly */
    line-height: 1.06;
    letter-spacing: -0.01em;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="pm">
      <h1>Airbnb wanted its<br>top luxury homes set apart<br>in their own tier.</h1>
    </div>
  </div>
</body>
</html>
