<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12d</title>
<!-- THE LIVE BUILD, RETURNED — after the cells slide (12c), the Host Calendar phone comes back exactly where 12b left it,
     at Zoe's ⨉ (beat 24), and steps on: the wand folds away, the AI pills, the gaps, the tips, the Ask… This is 13.html
     again, opened at ?start=24, filling the viewport as it did grown in 12b. The taps forward to its beats; the slide is
     interactive (the phone is tappable) so the deck's rails and the keys drive the build. -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .live { position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0; display: block; background: transparent; }
</style>
</head>
<body>
  <iframe class="live" id="live" title="Host Calendar"></iframe>
<script>
(() => {
  window.presoInteractive = true;
  const live = document.getElementById('live');
  const STAMP = new URLSearchParams(location.search).get('v') || Date.now().toString(36);
  live.src = '13.html?embed=1&start=24&v=' + STAMP;
  const inner = fn => { try { const f = live.contentWindow[fn]; return f ? f() : false; } catch (_) { return false; } };
  window.presoNext = () => inner('presoNext');
  window.presoPrev = () => inner('presoPrev');
  window.presoEnd = () => { const go = () => { let f = null; try { f = live.contentWindow && live.contentWindow.presoEnd; } catch (_) {} if (f) f(); else setTimeout(go, 100); }; go(); };
})();
</script>
</body>
</html>
