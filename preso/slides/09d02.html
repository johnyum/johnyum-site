<script>
  // one line per phone but the last (the stacked bar — the graph, which is where the flow went: John, 2026-10-03), laid on the phone's own diagonal (top-right → bottom-left), 16px past each corner, in screen pixels
  (() => {
    const phones = [...document.querySelectorAll('.ph')].slice(0, -1), OVER = 16, NS = 'http://www.w3.org/2000/svg';
    const lines = phones.map(ph => { const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('class', 'x');
      const ln = document.createElementNS(NS, 'line'); svg.appendChild(ln); ph.appendChild(svg); return { ph, svg, ln }; });
    const fit = () => lines.forEach(({ ph, svg, ln }) => {
      const w = ph.offsetWidth, h = ph.offsetHeight, d = Math.hypot(w, h), ux = -w / d, uy = h / d;   // unit step, top-right → bottom-left
      svg.setAttribute('width', w); svg.setAttribute('height', h);
      ln.setAttribute('x1', w - ux * OVER); ln.setAttribute('y1', 0 - uy * OVER);
      ln.setAttribute('x2', 0 + ux * OVER); ln.setAttribute('y2', h + uy * OVER);
      ln.style.setProperty('--len', d + 2 * OVER);
    });
    fit(); addEventListener('resize', fit); if (window.ResizeObserver) new ResizeObserver(fit).observe(document.querySelector('.row'));
    let n = 0;
    const set = (k, instant) => { n = k; const row = document.querySelector('.row'); if (instant) row.classList.add('snap');
      phones.forEach((ph, i) => ph.classList.toggle('on', i < n));
      if (instant) { void row.offsetWidth; setTimeout(() => row.classList.remove('snap'), 50); } };
    window.presoNext = () => { if (n >= phones.length) return false; set(n + 1); return true; };
    window.presoPrev = () => { if (n <= 0) return false; set(n - 1, true); return true; };
    window.presoEnd = () => set(phones.length, true);
    window.presoState = () => n;
    window.presoRestore = k => set(Math.max(0, Math.min(phones.length, k | 0)), true);
  })();
</script>
