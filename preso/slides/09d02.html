<!-- WHAT WE TRIED (John, 2026-10-03) — between "We had to tell 5 million hosts" and the service-fee flow (09d): the ways we tried
     to explain the change before the flow that shipped. Five phones: first an email, as it reads in Gmail (a mock service-fee
     explanation in the Gmail iOS wrapper — its source is tools/fee-email.html), then the four explorations from the Yum Portfolio
     file (frame 5618:16781): the story with a fee breakdown card, the listing card, the host and the guest with their two prices,
     and the stacked bar. Each is a 393 x 852 screen in the deck's drawn iPhone (09d's, 12a1's), with the deck's 8:08 status bar
     laid over the Figma frames, which have none.

     THE SIZE: five phones and four 48px gaps fill 86% of the width — h * 0.4891 * 5 + 192px = 86vw — capped, like 09d's, at the
     unscaled phone.

     CROSSED OUT, ONE PER TAP (John, 2026-10-03): each tap stamps a big red X on the next phone, left to right, all but the last —
     the stacked bar is the graph the shipped flow grew from, so it stands. A plain red X, 8px, no keyline or shadow, poking out
     past the phone's sides (a square 116% of its width, centred). Back takes the last one off; arriving backwards, all four are on.
     (It was a 4px diagonal first, then a 12px horizontal strike, then a thick keylined X.) -->

          --phone-h: min(80vh, 1080px, calc((86vw - 192px) / 2.4457)); }
  .ph { position: relative; height: var(--phone-h); aspect-ratio: 900 / 1840; flex: none; }
  .ph .scr { position: absolute; left: 5.4444%; top: 2.5543%; width: 89.1111%; height: 94.8913%; border-radius: 15.9601% / 7.3310%; overflow: hidden; background: #fff; z-index: 1; }
  .ph .scr img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; user-select: none; -webkit-user-drag: none; }
  /* the X: plain red #e1251b, 8px (in screen pixels, whatever the phone's size — non-scaling stroke), no keyline, no shadow;
     a square 116% of the phone's width, centred, its arms running corner to corner of that square — so it pokes out past the
     phone's sides. It stamps on: in from 1.25x, settling with a small overshoot. */
  .ph .x { position: absolute; left: -8%; top: 50%; width: 116%; aspect-ratio: 1; transform: translateY(-50%) scale(1.25); opacity: 0;
           z-index: 3; pointer-events: none; overflow: visible; }
  .ph .x path { fill: none; stroke: #e1251b; stroke-width: 8; stroke-linecap: square; vector-effect: non-scaling-stroke; }
  .ph.on .x { opacity: 1; transform: translateY(-50%) scale(1); transition: opacity .12s ease, transform .32s cubic-bezier(.3,1.6,.5,1); }
  .snap .ph .x { transition: none !important; }
  .ph .chrome { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

<script>
  // a safety X on every phone but the last (the stacked bar — the graph, which is where the flow went: John, 2026-10-03)
  (() => {
    const phones = [...document.querySelectorAll('.ph')].slice(0, -1);
    phones.forEach(ph => ph.insertAdjacentHTML('beforeend',
      '<svg class="x" viewBox="0 0 100 100" aria-hidden="true"><path d="M0 0 100 100M100 0 0 100"/></svg>'));
    let n = 0;
    const set = (k, instant) => { n = k; const row = document.querySelector('.row'); if (instant) row.classList.add('snap');
      phones.forEach((ph, i) => ph.classList.toggle('on', i < n));
      if (instant) { void row.offsetWidth; setTimeout(() => row.classList.remove('snap'), 50); } };
    window.presoNext = () => { if (n >= phones.length) return false; set(n + 1); return true; };
    window.presoPrev = () => { if (n <= 0) return false; set(n - 1, true); return true; };
    window.presoEnd = () => set(phones.length, true);
    window.presoState = () => n;
    window.presoRestore = k => set(Math.max(0, Math.min(phones.length, k | 0)), true);
  })();
</script>
