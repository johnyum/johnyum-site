<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09bz</title>
<!-- THE OTHER THING (John, 2026-10-06) — one mono card straight after the flights screens, before the trip creator (09c), to
     introduce it: John built the flight search as asked (the APIs, the designs) but wasn't satisfied selling plane tickets, and on
     his own time built a way for transportation to fit Airbnb's ethos — go anywhere, somewhere unique, somewhere adventurous; a
     gateway to interesting places, by foot, by bike or by train. A colon at the end points at the trip creator on the next tap. Set as the
     spoiler card (09b0z) is: IBM Plex Mono at 40, centred, broken by hand — short over long, 18 / 25. Punched up from John's
     "Secretly, I built what my vision was for transportation:" (2026-10-06). Before it: "Plane tickets get you to an airport. / Airbnb gets you somewhere you've never been. / So, on my own
     time, I built that." No build. -->
<style>
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../fonts/IBMPlexMono-Regular.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: block;
  }
  html, body { margin: 0; height: 100%; background: #fff; color: #111; overflow: hidden; }
  .slide { height: 100%; display: grid; place-items: center; padding: 0 48px; box-sizing: border-box; }
  .copy { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 40px; line-height: 1.3; }
  .one { margin: 0; text-align: center; white-space: nowrap; }
</style>
</head>
<body>
  <div class="slide">
    <div class="copy">
      <p class="one">In secret, I built<br>what it should have been:</p>
    </div>
  </div>
<script>
  window.presoNext = () => false;   // one line, no builds
  window.presoPrev = () => false;
  window.presoState = () => 0;
  window.presoRestore = () => {};
</script>
</body>
</html>
