<!-- WHY THE HOST-ONLY FEE (John, 2026-09-30) — straight after the wall of tweets, the reason for the change in John's
     own words, in five beats (the problem, the fix, the tool, the backlash, the math — John, 2026-10-01) for a room that does not know the fees — the 14% and the
     15.5% are said aloud, not shown: what guests hated, what it meant for hosts, and the turn into the screens that follow. It replaced a
     ledger of the same $100 night under both fees (in git history, if the sums are ever wanted back).

     IBM Plex Mono at 18, left-aligned, the block centred on the stage — the mono that labels 12a1 and the verdict on
     the calendar. The measure is held near 60 characters, which is what a paragraph of mono can be read at from the
     back of a room. No build. -->
<style>
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../fonts/IBMPlexMono-Regular.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: block;
  }
  html, body {
    margin: 0; height: 100%;
    background: #fff; color: #111;
    overflow: hidden;
  }
  .slide { height: 100%; display: grid; place-items: center; padding: 0 24px; box-sizing: border-box; }
  .copy {
    max-width: 60ch;
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-size: 18px; line-height: 1.5; text-align: left;
    text-wrap: pretty;
  }
  /* the three beats, numbered, 16 between them; the number hangs so a wrapped line starts under the words */
  .beats { margin: 0; padding: 0; list-style: none; counter-reset: beat; display: flex; flex-direction: column; gap: 16px; }
  .beats li { counter-increment: beat; display: grid; grid-template-columns: 3ch 1fr; }
  .beats li::before { content: counter(beat) "."; }
  /* the sum under the three lines, for anyone who wants it: one $100 night under each fee, the host-only side re-priced
     to $115 so the host keeps what they made. Same mono, same size; spaces line the columns up, which only a mono can. */
  /* the sums sit under the words, not under the numbers: the outer box keeps the list's 18px so its 3ch matches the
     list's number column exactly, and the sums inside are set at 12 */
  .math { margin-top: 32px; padding-left: 3ch; }
  .math > div { white-space: pre; color: #8C8C8C; font-size: 12px; line-height: 1.5; }
  /* 8 between each fee's name and its sums (John, 2026-10-01); the blank line that parted the two fees stays, as 18 */
  .math > .h { margin-bottom: 8px; }
  .math > .h ~ .h { margin-top: 18px; }
  /* 4 and 5 swapped (John, 2026-10-01): the math is the fourth beat, its sums hang under it, and the backlash comes
     last, 32 under the sums — the list carries on its count from 5 */
  .beats.after { margin-top: 32px; counter-reset: beat 4; }
  /* ONE SENTENCE (John, 2026-10-03), as the lesson slide is set: 40, centred, broken by hand for the rag. The five points and the
     fee sums it replaced live in preso/SCRIPT.md, said rather than shown. */
  .copy:has(.one) { max-width: none; }   /* the old list's 60ch column would wrap the 40 into five lines */
  .one { margin: 0; white-space: nowrap; font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 40px; line-height: 1.3; text-align: center; }
</style>
</head>
<body>
  <div class="slide">
    <div class="copy">
      <p class="one">To stop the guest hate, we had to move<br>all service fees to be paid by the host.<br>All 5&nbsp;million of them.</p>
    </div>
  </div>
