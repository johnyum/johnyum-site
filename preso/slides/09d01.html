<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09d01</title>
<!-- THE FEE MATH (John, 2026-09-30) — straight after the wall of tweets, the same $100 night under both fees, so the
     switch is a sum anybody in the room can check rather than a policy to take on trust.

       split fee       guest $100 + $14 (≈14% guest service fee) = $114     host $100 − $3 (3%) = $97
       host-only fee   guest $100, every fee inside it                       host $100 − $15.50 (15.5%) = $84.50

     15.5% is the fee the next slide's flow (09d) moves hosts onto. The split side uses Airbnb's usual 3% host fee and a
     round 14% for the guest's, which varied by booking; John's sketch had $11, and 14 is nearer what guests actually saw.

     The lines are in 12a's type at 12a's size, so the setup slides and this one read as one voice; the labels are the
     mono that names the inspirations on 12a1. Each line is an equation, aligned on its "=" so the two sides of the
     ledger stack. No build: the deck pushes it in and on. -->
<style>
  @font-face {
    font-family: "Special Gothic Condensed One";
    src: url("../fonts/SpecialGothicCondensedOne.woff2") format("woff2");
    font-weight: 400; font-display: block;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../fonts/IBMPlexMono-Regular.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: block;
  }
  html, body {
    margin: 0; height: 100%;
    background: #fff; color: #111;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .slide { height: 100%; display: grid; place-items: center; }
  .ledger {
    display: grid;
    grid-template-columns: auto auto;
    column-gap: 9vw;
    /* 12a's size, held down on narrow screens so two equations still fit side by side */
    --fs: min(clamp(16px, 6.1vh, 62px), 3.1vw);
  }
  .side { display: grid; grid-template-columns: auto auto auto; column-gap: 0.32em; row-gap: 0.18em; align-items: baseline; font-size: var(--fs); }
  .lab {
    grid-column: 1 / -1; margin-bottom: 0.9em;
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-size: 16px; line-height: 1; color: #8C8C8C;
  }
  .who, .sum, .tot {
    font-family: "Special Gothic Condensed One", "Helvetica Neue", sans-serif;
    font-weight: 400; line-height: 1.06; letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .who { color: #8C8C8C; }
  .sum { text-align: right; }
  .fee { color: #C13515; }   /* what Airbnb takes, in the verdict's red */
</style>
</head>
<body>
  <div class="slide">
    <div class="ledger">
      <div class="side">
        <div class="lab">Split fee</div>
        <div class="who">Guest pays</div><div class="sum">$100 + <span class="fee">$14</span> =</div><div class="tot">$114</div>
        <div class="who">Host earns</div><div class="sum">$100 &minus; <span class="fee">$3</span> =</div><div class="tot">$97</div>
      </div>
      <div class="side">
        <div class="lab">Host-only fee</div>
        <div class="who">Guest pays</div><div class="sum">$100 =</div><div class="tot">$100</div>
        <div class="who">Host earns</div><div class="sum">$100 &minus; <span class="fee">$15.50</span> =</div><div class="tot">$84.50</div>
      </div>
    </div>
  </div>
<script>
  window.presoNext = () => false;   // no builds
  window.presoPrev = () => false;
  window.presoState = () => 0;
  window.presoRestore = () => {};
</script>
</body>
</html>
