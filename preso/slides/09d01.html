<!-- WHY THE HOST-ONLY FEE (John, 2026-09-30) — straight after the wall of tweets, the reason for the change in John's
     own words, cut to three beats (problem, fix, tension) for a room that does not know the fees — the 14% and the
     15.5% are said aloud, not shown: what guests hated, what it meant for hosts, and the turn into the screens that follow. It replaced a
     ledger of the same $100 night under both fees (in git history, if the sums are ever wanted back).

     IBM Plex Mono at 18, left-aligned, the block centred on the stage — the mono that labels 12a1 and the verdict on
     the calendar. The measure is held near 60 characters, which is what a paragraph of mono can be read at from the
     back of a room. No build. -->

<body>
  <div class="slide">
    <div class="copy">
      <p>Guests hated surprise fees.</p>
      <p>So hosts pay the whole fee, and we raise their prices for them.</p>
