<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>02a</title>
<!-- A HEADER CARD (John, 2026-10-01), straight after I. Love. Design. and the family: from here on, every
     piece in the deck was made on Claude. 40pt IBM Plex Mono, centred — the chapter cards' voice. No build. -->
<style>
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../fonts/IBMPlexMono-Regular.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: block;
  }
  html, body { margin: 0; height: 100%; background: #fff; color: #111; overflow: hidden; }
  .slide { height: 100%; display: grid; place-items: center; }
  h1 {
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-weight: 400;
    font-size: 40px;   /* header cards are 40 (John, 2026-10-01) */
    line-height: 1.4;
    text-align: center;
    margin: 0;
    text-wrap: balance; padding: 0 80px;   /* a long line: it wraps, evenly, rather than running off a narrow stage */
  }
</style>
</head>
<body>
  <div class="slide">
    <h1>Everything you&rsquo;ll see from here was made on Claude.</h1>
  </div>
</body>
</html>
