<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12h</title>
<!-- THANKS! — the last slide, at the size Hello! opens on (John, 2026-09-30).

     It was "Thank you" in Anton on a width-driven clamp, which put it at the
     size of a chapter title. The deck now opens and closes on the same
     gesture: one word, filling the stage, measured off its own ink. Hello! on
     the way in, Thanks! on the way out, A.I. in between.

     THE FIT IS THE SAME CODE AS 01 AND 12F. The word's ink is measured on a
     canvas — actualBoundingBox reports the painted extent, not the line box,
     and the read works while the deck has the slide parked — and that box
     becomes the viewBox, so preserveAspectRatio does the fitting. "Thanks!"
     has no descender, so a font-size sized to its em box would sit high with a
     band of nothing under it; this does not. 76px clear at each end, which is
     32px of air either side of the kicker and the section nav.

     No build. The last slide. -->
<style>
  @font-face {
    font-family: "Anton";
    src: url("../fonts/Anton.woff2") format("woff2");
    font-weight: 400;
    font-display: block;
  }
  html, body {
    margin: 0; height: 100%;
    background: #000; color: #fff;   /* INVERSE, like Hello! and AI (John, 2026-10-03); presoDark turns the deck's chrome white */
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .slide { height: 100%; display: grid; place-items: center; }
  /* THANKS! FILLS THE STAGE, and stops at the deck's chrome. index.html puts
     #kicker at top:32px and #counter at bottom:32px, both 12px on a
     line-height of 1, so the chrome owns the first and last 44px. 76px of
     clearance leaves 32px of air between the word and each of them — enough
     that they read as separate things rather than a near miss. */
  h1 {
    margin: 0;
    display: block;
    width: 92vw;
    height: calc(100vh - 152px);
  }
  h1 svg { display: block; width: 100%; height: 100%; }
  h1 text {
    font-family: "Anton", "Helvetica Neue", sans-serif;
    font-weight: 400;
    letter-spacing: -0.02em;   /* -2% */
    fill: #fff;
  }
</style>
</head>
<body>
  <div class="slide">
    <h1><svg id="hello" role="img" aria-label="Thank you"
             preserveAspectRatio="xMidYMid meet" viewBox="0 0 100 100">
      <text id="l1" x="0" y="0" font-size="100" text-anchor="middle">Thank</text>
      <text id="l2" x="0" y="0" font-size="100" text-anchor="middle">you</text>
    </svg></h1>
  </div>
<script>
  window.presoDark = true;   // the deck's kicker and section names go white over this slide
(() => {
  // THE VIEWBOX IS THE WORD'S INK, MEASURED. A font-size cannot fill a box on
  // its own: the em box carries ascender and descender room this word does not
  // use — "Thanks!" has no descender at all — so type sized to the box always
  // sits high in it with a band of nothing underneath. Measuring the actual
  // ink and making THAT the viewBox hands the fitting to preserveAspectRatio,
  // which lands it exactly, centred, at any stage size, with no magic number
  // for the cap height and no second guess about the baseline.
  //
  // canvas rather than a DOM measurement because it reports the ink box
  // directly — actualBoundingBox* is the painted extent, not the line box —
  // and because it works while the deck has the slide PARKED, where a layout
  // read measures zero and requestAnimationFrame never runs.
  // THANK / YOU (John, 2026-10-08: "instead of Thanks!, make it 'Thank you' — but let the words stack"): two lines, each centred,
  // the second's cap top a small gap under the first's baseline; both inks measured and the viewBox set round the pair, so the
  // stack fills the stage the way the one word did.
  const svg = document.getElementById('hello');
  const L1 = document.getElementById('l1'), L2 = document.getElementById('l2');
  const GAP = 0.09;   // of the first line's cap height

  function fit() {
    const c = document.createElement('canvas').getContext('2d');
    c.font = '400 100px Anton, sans-serif'; c.textAlign = 'center';
    try { c.letterSpacing = '-0.02em'; } catch (_) {}   // match the CSS; ignored where unsupported
    const m1 = c.measureText('Thank'), m2 = c.measureText('you');
    const a1 = m1.actualBoundingBoxAscent, d1 = m1.actualBoundingBoxDescent, a2 = m2.actualBoundingBoxAscent, d2 = m2.actualBoundingBoxDescent;
    if (!(a1 > 0 && a2 > 0)) return false;
    const y2 = d1 + GAP * a1 + a2;   // the second baseline, measured from the first
    L2.setAttribute('y', y2);
    const left = Math.max(m1.actualBoundingBoxLeft, m2.actualBoundingBoxLeft), right = Math.max(m1.actualBoundingBoxRight, m2.actualBoundingBoxRight);
    svg.setAttribute('viewBox', (-left) + ' ' + (-a1) + ' ' + (left + right) + ' ' + (a1 + y2 + d2));
    return true;
  }

  fit();
  // Anton is font-display: block, so the first read can land on nothing.
  if (document.fonts && document.fonts.ready) {
    document.fonts.load('400 100px Anton').catch(() => {}).then(() => fit());
    document.fonts.ready.then(fit).catch(() => {});
  }
})();
</script>
</body>
</html>
