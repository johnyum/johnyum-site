<!-- WHERE THE CALENDAR CAME FROM — six references (John, 2026-09-30).

     Straight after "Airbnb hosts manage pricing, availability, and bookings all on the calendar" and straight before the
     sheet of every calendar study John drew (12b): what he looked at, then what he made of it.

     ONE BEAT. All six arrive together with the deck's own push (John: "show me all 6 at the same time, not three
     then six") — the three calendars he lives in, Google, Apple and Amie, then the three that are not calendars at all,
     Candy Crush, the camera and the iOS widgets. The next tap goes on to the drawings. Each is named 16px under its
     phone in the deck's own mono — the kicker's face, size and grey. (Tetris was here; John swapped it for the widgets
     and the camera.)

     IN THE SAME PHONE as the live build: 13's own device, number for number — the 900 x 1840 frame, the photographed
     rail, the bezel, the Dynamic Island, the screen hole at 13's percentages. The screenshots are 921 x 2000 against a
     hole of 0.4593 — 0.4605 — so object-fit barely trims them, and their status bars sit under the drawn island.

     PLACED BY SCRIPT, six across. A phone is 0.489 of its height wide and a gap 0.12 of a phone, so six across is 3.228
     phone-heights. The height is the smallest of 13's own phone (80vh), the 1080 cap, and what the width allows; the
     phone and its label are centred as one block. -->
<style>

  .ref { position: absolute; aspect-ratio: 900 / 1840; }
  .scr {
    position: absolute;

    border-radius: 15.9601% / 7.3310%;

  .scr img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; user-select: none; }
  .chrome { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

     others come in. */

    font-family: "IBM Plex Mono";
    src: url("../fonts/IBMPlexMono-Regular.woff2") format("woff2");

    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-size: 12px; line-height: 1; color: #8C8C8C;
  }
</style>

<script>
(() => {
  const b = document.body, refs = [...document.querySelectorAll('.ref')];
  const PW = 0.48913, GAP = PW * 0.12;            // a phone's width, and a gap, as fractions of its height
  const LABEL = 16 + 12;                          // the gap under a phone, and the label's line
  // n across, centred: the height they can have and where each one goes
  const row = (n, W, H) => {
    const h = Math.min(H * 0.8, 1080, W * 0.92 / (n * PW + (n - 1) * GAP));
    const w = h * PW, g = h * GAP, x0 = (W - (n * w + (n - 1) * g)) / 2;
    return { h, top: (H - h) / 2 - LABEL / 2, left: i => x0 + i * (w + g) };   // the phone and its label centred as one
  };
  function layout() {
    const W = innerWidth, H = innerHeight;
    if (!(W > 0 && H > 0)) return;                // parked by the deck: nothing to measure yet
    const six = row(6, W, H);
    refs.forEach((r, i) => { r.style.height = six.h + 'px'; r.style.top = six.top + 'px'; r.style.left = six.left(i) + 'px'; });
  }
  layout();
  new ResizeObserver(layout).observe(document.documentElement);

  window.presoNext = () => false;                 // no builds: all six arrive with the push
  window.presoPrev = () => false;
  window.presoState = () => 0;
  window.presoRestore = () => {};
})();
</script>
