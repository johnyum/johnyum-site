<!-- WHERE THE CALENDAR CAME FROM — five references, five up (John, 2026-09-30).

     Straight after "Airbnb hosts manage pricing, availability, and bookings all on the calendar" and straight before the
     sheet of every calendar study John drew (12b): the three calendars he lives in — Google, Apple, Amie — and the two
     games whose feel he borrowed — Candy Crush, Tetris. What he looked at, then what he made of it.

     It used to be an interlude inside 12b — the live phone shrinking to the first of six, the five arriving beside it,
     then all of it reversing. It is its own slide now, so the five arrive together with the deck's own push and the
     drawings follow on the next tap. Nothing animates here but the push.

     IN THE SAME PHONE as the live build: 13's own device, number for number — the 900 x 1840 frame, the photographed
     rail, the bezel, the Dynamic Island, the screen hole at 13's percentages. The screenshots are 921 x 2000 against a
     hole of 0.4593 — 0.4605, so object-fit barely trims them, and their own status bars sit under the drawn island.

     SIZED IN CSS, no script. A phone is 0.489 of its height wide and a gap 0.12 of a phone, so five across is 2.68
     phone-heights; the height is the smallest of 13's own phone, the 1080 cap, and what that width allows. -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .slide { height: 100%; display: grid; place-items: center; }
  .row {
    --h: min(80vh, 1080px, calc(92vw / 2.6805));
    display: flex; align-items: center; justify-content: center;
    gap: calc(var(--h) * 0.48913 * 0.12);
  }
  .ref { position: relative; flex: none; height: var(--h); aspect-ratio: 900 / 1840; }
  .scr {
    position: absolute;
    left: 5.4444%; top: 2.5543%; width: 89.1111%; height: 94.8913%;
    border-radius: 15.9601% / 7.3310%;
    overflow: hidden; background: #0b0b0b; z-index: 1;
  }
  .scr img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; user-select: none; }
  .chrome { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
</style>
</head>
