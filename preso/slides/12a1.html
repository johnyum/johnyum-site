<!-- WHERE THE CALENDAR CAME FROM — six references (John, 2026-09-30).

     Straight after "Airbnb hosts manage pricing, availability, and bookings all on the calendar" and straight before the
     sheet of every calendar study John drew (12b): what he looked at, then what he made of it.

     ONE BEAT. All six arrive together with the deck's own push (John: "show me all 6 at the same time, not three
     then six") — the three calendars he lives in, Google, Apple and Amie, then the three that are not calendars at all,
     Candy Crush, the camera and the iOS widgets. The next tap goes on to the drawings. Each is named 16px under its
     phone in the deck's own mono — the kicker's face, size and grey. (Tetris was here; John swapped it for the widgets
     and the camera.)

     IN THE SAME PHONE as the live build: 13's own device, number for number — the 900 x 1840 frame, the photographed
     rail, the bezel, the Dynamic Island, the screen hole at 13's percentages. The screenshots are 921 x 2000 against a
     hole of 0.4593 — 0.4605 — so object-fit barely trims them, and their status bars sit under the drawn island.

     PLACED BY SCRIPT, six across. A phone is 0.489 of its height wide and a gap 0.12 of a phone, so six across is 3.228
     phone-heights. The height is the smallest of 13's own phone (80vh), the 1080 cap, and what the width allows; the
     phone and its label are centred as one block. -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .ref { position: absolute; aspect-ratio: 900 / 1840; transform-origin: 50% 60%; filter: drop-shadow(0 10px 24px rgba(0,0,0,.16)); }
  .scr {
    position: absolute;
    left: 5.4444%; top: 2.5543%; width: 89.1111%; height: 94.8913%;
    border-radius: 15.9601% / 7.3310%;
    overflow: hidden; background: #0b0b0b; z-index: 1;
  }
  .scr img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; user-select: none; }
  /* the fan: out from the stack, the outer phones travelling furthest in the same time, so the hand opens as one */
  body.fanning .ref { transition: transform 900ms cubic-bezier(0.2, 0.8, 0.2, 1); }
  .chrome { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

  /* THE LABELS: the deck's own voice — the kicker's ("John Yum · Work") face, size and grey — 16px under each phone
     (John). Inside the phone's box, so each one travels with its phone as the calendars shrink and slide and the
     others come in. */
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../fonts/IBMPlexMono-Regular.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: block;
  }
  .lab {
    position: absolute; left: -40px; right: -40px; top: calc(100% + 16px);
    text-align: center; white-space: nowrap;
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-size: 12px; line-height: 1; color: #8C8C8C;
  }
</style>

<script>
(() => {
  const b = document.body, refs = [...document.querySelectorAll('.ref')];
  const PW = 0.48913;                             // a phone's width, as a fraction of its height
  // THE FAN (John, 2026-10-02): the six held like a hand of cards — a little smaller, overlapping in the middle, each
  // tipped a step further out (−22.5° … +22.5°) and dropping on an arc toward the ends, left under right. The labels are gone.
  // Then (same day) smaller, more fanned, less overlap: 0.52 of the height, 9° a step, 0.8 of a phone apart.
  const N = 6, STEP = 9, OVER = 0.8, DROP = 0.02;
  // ARRIVE CLOSED, THEN FAN (John, 2026-10-02): the six come in with the push squared up in one stack at the centre, and
  // only once the push has landed (the deck's presoshown) do they spread into the fan. Every phone is laid out at its
  // fanned spot; the stack is a transform pulling it back to the centre, so the fan is one transition on transform alone.
  let fanned = false;
  function layout() {
    const W = innerWidth, H = innerHeight;
    if (!(W > 0 && H > 0)) return;                // parked by the deck: nothing to measure yet
    const h = Math.min(H * 0.52, 760, W * 0.9 / (PW * (1 + (N - 1) * OVER) + 0.25)), w = h * PW;
    refs.forEach((r, i) => {
      const t = i - (N - 1) / 2, dx = t * w * OVER, dy = t * t * h * DROP;
      r.style.height = h + 'px';
      r.style.left = (W / 2 + dx - w / 2) + 'px';
      r.style.top = ((H - h) / 2 + dy) + 'px';
      r.style.transform = fanned ? `rotate(${t * STEP}deg)` : `translate(${-dx}px, ${-dy}px) rotate(${t * 0.8}deg)`;
      r.style.zIndex = String(i + 1);
    });
  }
  layout();
  new ResizeObserver(layout).observe(document.documentElement);

  function fan() {
    if (fanned) return;
    fanned = true;
    b.classList.add('fanning');
    requestAnimationFrame(() => requestAnimationFrame(layout));
  }
  addEventListener('presoshown', () => setTimeout(fan, 120));
  if (window.parent === window) setTimeout(fan, 400);   // opened on its own, outside the deck

  window.presoNext = () => false;                 // no builds: all six arrive with the push
  window.presoPrev = () => false;
  window.presoState = () => 0;
  window.presoRestore = () => {};
})();
</script>
