<!-- WHERE THE CALENDAR CAME FROM — six references (John, 2026-09-30).

     Straight after "Airbnb hosts manage pricing, availability, and bookings all on the calendar" and straight before the
     sheet of every calendar study John drew (12b): what he looked at, then what he made of it.

     TWO BEATS. The three calendars he lives in — Google, Apple, Amie — arrive with the deck's own push, large and
     centred. The tap brings in the three that are not calendars at all — the iOS widgets, the camera, Candy Crush —
     from the right, and the calendars SHRINK AND SLIDE LEFT to make room, so the six land as one row. The tap after that
     goes on to the drawings. (Tetris was here; John swapped it for the widgets and the camera.)

     IN THE SAME PHONE as the live build: 13's own device, number for number — the 900 x 1840 frame, the photographed
     rail, the bezel, the Dynamic Island, the screen hole at 13's percentages. The screenshots are 921 x 2000 against a
     hole of 0.4593 — 0.4605 — so object-fit barely trims them, and their status bars sit under the drawn island.

     PLACED BY SCRIPT, MOVED BY CSS. Each phone is positioned absolutely for the state it is in — three across or six —
     and the transition does the travelling between the two, so the calendars can change size and place in one move,
     which a flex row cannot animate. A phone is 0.489 of its height wide and a gap 0.12 of a phone: three across is
     1.585 phone-heights, six is 3.228. The height is the smallest of 13's own phone (80vh), the 1080 cap, and what the
     width allows. -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .ref {
    position: absolute; aspect-ratio: 900 / 1840;
    transition: left 720ms cubic-bezier(0.16, 1, 0.3, 1), top 720ms cubic-bezier(0.16, 1, 0.3, 1),
                height 720ms cubic-bezier(0.16, 1, 0.3, 1), transform 720ms cubic-bezier(0.16, 1, 0.3, 1),
                opacity 360ms ease;
  }
  .ref.late { transform: translateX(100vw); opacity: 0; }
  body.more .ref.late { transform: none; opacity: 1; }
  body.snap .ref { transition: none; }
  .scr {
    position: absolute;
    left: 5.4444%; top: 2.5543%; width: 89.1111%; height: 94.8913%;
    border-radius: 15.9601% / 7.3310%;
    overflow: hidden; background: #0b0b0b; z-index: 1;
  }
  .scr img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; user-select: none; }
  .chrome { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
</style>

<script>
(() => {
  const b = document.body, refs = [...document.querySelectorAll('.ref')];
  const PW = 0.48913, GAP = PW * 0.12;            // a phone's width, and a gap, as fractions of its height
  // n across, centred: the height they can have and where each one goes
  const row = (n, W, H) => {
    const h = Math.min(H * 0.8, 1080, W * 0.92 / (n * PW + (n - 1) * GAP));
    const w = h * PW, g = h * GAP, x0 = (W - (n * w + (n - 1) * g)) / 2;
    return { h, top: (H - h) / 2, left: i => x0 + i * (w + g) };
  };
  function layout() {
    const W = innerWidth, H = innerHeight;
    if (!(W > 0 && H > 0)) return;                // parked by the deck: nothing to measure yet
    const more = b.classList.contains('more');
    const six = row(6, W, H), three = row(3, W, H);
    refs.forEach((r, i) => {
      // the late three always sit in their six-up places; they are off to the right until the tap
      const s = (more || i >= 3) ? six : three, k = (more || i >= 3) ? i : i;
      r.style.height = s.h + 'px'; r.style.top = s.top + 'px'; r.style.left = s.left(k) + 'px';
    });
  }
  const snap = f => { b.classList.add('snap'); f(); layout(); void b.offsetWidth; b.classList.remove('snap'); };
  snap(() => {});
  new ResizeObserver(() => snap(() => {})).observe(document.documentElement);

  window.presoNext = () => { if (b.classList.contains('more')) return false; b.classList.add('more'); layout(); return true; };
  window.presoPrev = () => { if (!b.classList.contains('more')) return false; b.classList.remove('more'); layout(); return true; };
  window.presoState = () => b.classList.contains('more') ? 1 : 0;
  window.presoRestore = n => snap(() => b.classList.toggle('more', n > 0));
})();
</script>
