<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09cy</title>
<!-- UP THE CHAIN (John, 2026-10-08: the COVID card split in two — "I shared this with my PM, we took it to the head of
     transportation, and we showed it to our CEO, and he approved it to build it", made punchier). One sentence a line, each a rung
     higher, the last the yes. Set as the COVID card after it: IBM Plex Mono at 40, centred, 60 leading. No build. -->
<style>
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../fonts/IBMPlexMono-Regular.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: block;
  }
  html, body { margin: 0; height: 100%; background: #fff; color: #111; overflow: hidden; }
  .slide { height: 100%; display: grid; place-items: center; padding: 0 48px; box-sizing: border-box; }
  .copy { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 40px; line-height: 1.5;   /* 60 on 40 (John, 2026-10-07: 1.3 was too tight) */ }
  .one { margin: 0; text-align: center; white-space: nowrap; }
</style>
</head>
<body>
  <div class="slide">
    <div class="copy">
      <p class="one">I showed my PM, then<br>the head of transportation, then<br>the CEO. Green light.</p>   <!-- haiku rag, 20 / 32 / 21 (John, 2026-10-08: "a better rag"); was a sentence a line, 15 / 32 / 26 -->
    </div>
  </div>
<script>
  window.presoNext = () => false;   // one line, no builds
  window.presoPrev = () => false;
  window.presoState = () => 0;
  window.presoRestore = () => {};
</script>
</body>
</html>
