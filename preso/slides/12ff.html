<!DOCTYPE html>

<!-- THE BOTS (John, 2026-10-05) — after the ego card, before "High conviction": three characters in a row, each a
     transparent PNG cut from its picture (assets/bots/): the cream yeti, ChatGPT's four dots (the orange robot beside
     them left out), and the Grok bot (Benji Taylor's icon). All one height, 48 apart, centred on the page. No build. -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .slide { height: 100%; display: flex; align-items: center; justify-content: center; gap: 48px; padding: 0 24px; box-sizing: border-box; }
  .slide img { height: min(300px, 32vh); width: auto; display: block; }
</style>
</head>
<body>
  <div class="slide">
    <img src="assets/bots/yeti.png" alt="A cream furry yeti">
    <img src="assets/bots/dots.png" alt="ChatGPT's four coloured dots">
    <img src="assets/bots/grok.png" alt="The Grok bot">
  </div>
</body>
</html>
