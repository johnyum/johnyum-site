<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09b0</title>
<!-- THE PRESS, BEFORE THE WORK. Forbes, February 2019: Airbnb says it isn't
     building an airline, but it hired Virgin America's CEO to run
     transportation. It sits in front of the flights screens so the room knows
     the work that follows was a real bet the company was publicly making, not
     a designer's side exploration.

     THE PAGE AS JOHN CAPTURED IT, WHOLE. An earlier pass worked from a
     browser-window grab and had to cut it about — the window chrome off the
     top, the share icons and the "Add Us On Google" box lifted out of the
     middle, the two halves rejoined over a strip of the page's own white. That
     capture also carried a longer headline ("...To Lead Transportation
     Experiments") and a Subscribe button in the masthead. This one is the
     article on its own, so nothing is cut and nothing is rejoined: Forbes'
     type, Forbes' photograph, Forbes' byline, in Forbes' order. A citation,
     not a mock-up.

     NO ANIMATION OF ITS OWN. The deck pushes it in from the right and off to
     the left, the same as the flights screens it introduces. Nothing to
     reveal, so there is no script here at all and nothing that can fail to
     reveal — the same reason 09b and 09d have none.

     The three-drop shadow and 12px corners are the deck's, as on the receipt,
     09's window and the price-display video. overflow:hidden on the frame is
     what makes the radius clip; a radius on the <img> alone is ignored by some
     engines while it paints. -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .slide { height: 100%; display: grid; place-items: center; }

  .frame {
    position: relative;
    display: block;
    line-height: 0;                  /* no descender gap under the image */
    border-radius: 12px;
    overflow: hidden;                /* clips the image to the radius */
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, 0.02),
      0 4px 8px rgba(0, 0, 0, 0.08),
      0 12px 30px rgba(0, 0, 0, 0.18);
  }
  img {
    display: block;
    max-height: 84vh;
    max-width: 88vw;
    width: auto; height: auto;
    user-select: none;
    -webkit-user-drag: none;
  }
  /* THE WORD (John, 2026-10-08: "when I tap next on the Forbes article, give me a red underline on the word experiment"): one
     tap draws a red line under "Experiments", the headline's last word, left to right — the word the next card quotes, and the
     one after takes back. Placed in the picture's own pixels (1712 x 2044): the E at 768, the s ending 1268, the baseline 615 and
     the p's descender to 630, so the line runs at 640, 9 thick — percentages of the frame, which is the image's size. */
  .ul { position: absolute; left: 44.86%; width: 29.21%; top: 31.31%; height: 0.48%; background: #e3261b; border-radius: 999px;
        transform: scaleX(0); transform-origin: left center; transition: transform 520ms cubic-bezier(0.65, 0, 0.35, 1); pointer-events: none; }
  body.on .ul { transform: scaleX(1); }
  body.snap .ul { transition: none; }
</style>
</head>
<body>
  <div class="slide">
    <div class="frame">
      <img src="assets/forbes-transportation.webp" width="1712" height="2044"
           alt="Forbes, February 2019: Airbnb says it isn't building an airline, but it hired ex-Virgin America CEO to lead transportation">
      <div class="ul" aria-hidden="true"></div>
    </div>
  </div>
<script>
(() => {
  const b = document.body; let step = 0;
  const set = (n, snap) => { step = n; if (snap) b.classList.add('snap'); b.classList.toggle('on', n > 0); if (snap) { void b.offsetWidth; b.classList.remove('snap'); } };
  window.presoNext = () => { if (step >= 1) return false; set(1); return true; };
  window.presoPrev = () => { if (step === 0) return false; set(0); return true; };
  window.presoState = () => step;
  window.presoRestore = n => set(n > 0 ? 1 : 0, true);
})();
</script>
</body>
</html>
