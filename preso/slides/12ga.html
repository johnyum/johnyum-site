<!-- WHY ANTHROPIC, THE RUN (John, 2026-10-06) — after the Why Anthropic? card: one line a card, the mono at 40 on white, as the
     one-line cards are. No build.
     ONE CARD FOR TWO (John, 2026-10-07: "combine the next two — 4 months ago I had my first session with Claude Code, then I
     understood"): "I picked up Claude Code four months ago." and "One session, and everything I'd spent years mastering
     disappeared overnight." (12gb, now in _parked) became one line; then, later that night, it ends at "Then I understood." — the
     loss is said over it, not written. Then 12gc, the turn: the most joyous time of my career. -->
<style>
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../fonts/IBMPlexMono-Regular.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: block;
  }
  html, body { margin: 0; height: 100%; background: #fff; color: #111; overflow: hidden; }
  .slide { height: 100%; display: grid; place-items: center; padding: 0 24px; box-sizing: border-box; }
  /* THE RAG (2026-10-07, John: "three lines with haiku spacing"): short, long, short, but evenly — 20 / 33 / 18 (15 / 40 / 18 made the middle too long: "haiku
     is just the shape"). The loss ("everything I'd spent years mastering had disappeared overnight") is said over it, not written. */
  .one { margin: 0; white-space: normal; max-width: 1100px; text-wrap: wrap; font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-weight: 400; font-size: 40px; line-height: 1.5; text-align: center; }
</style>
</head>
<body>
  <div class="slide">
    <p class="one">Four months ago I had<br>my first session with Claude Code.<br>Then I understood.</p>
  </div>
</body>
