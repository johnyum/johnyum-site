<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12dq</title>
<!-- THE FIGMA (John, 2026-10-06) — after the Process card: his grab of the Multi Calendar file's Yum page, the grid of frames, shown
     whole with 16 rounded corners, fitted to the stage with the deck's own clearances (40 under the kicker, 40 above the nav).
     assets/process-figma.webp. ONE BUILD (John, 2026-10-07): a tap strikes it — the host-fee studies' red line (8px, rausch,
     16px past each corner, 0.35s) on the grab's diagonal, drawn from the top-right corner down to the bottom-left. Back lifts it. -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  .shot { flex: none; position: relative; border-radius: 16px; box-shadow: 0 0 0 1px rgba(0,0,0,.06); }
  .shot img { display: block; width: 100%; height: 100%; border-radius: 16px; }
  /* THE STRIKE AS A BAR, NOT AN SVG DASH (John, 2026-10-07: the dash animation was glitchy): an 8px red bar laid from the top-right
     corner (16 past it) down the diagonal, scaled open along its length on a transform — composited, so it draws smooth */
  .shot .bar { position: absolute; height: 8px; background: #ff385c; transform-origin: 0 50%; transform: rotate(var(--ang)) scaleX(0); will-change: transform; pointer-events: none; z-index: 2; }
  .shot.on .bar { transform: rotate(var(--ang)) scaleX(1); transition: transform .35s cubic-bezier(.4,0,.2,1); }
  /* "I'll miss you." (John, 2026-10-07): 40px mono in the strike's red, centred on the grab, UNDER the bar — struck through as it
     comes in, fading up with the line */
  /* THE PILL (John, 2026-10-07, after sticker type): "I'll miss you." as a pill in the strike's red — white 40px mono, 24 above and
     below, 28 left and right, fully rounded — centred on the grab, ABOVE the bar this time, fading in with it */
  .shot .line { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); margin: 0; padding: 20px 32px; border-radius: 100px; background: #ff385c; color: #fff;
                font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 40px; line-height: 1.5; white-space: nowrap; opacity: 0; z-index: 3; }
  .shot.on .line { opacity: 1; transition: opacity .35s ease; }
  .snap .shot .bar, .snap .shot .line { transition: none !important; }
</style>
</head>
<body>
  <div class="stage"><div class="shot" id="shot"><img src="assets/process-figma.webp" alt="The Multi Calendar file in Figma"><div class="bar" id="bar"></div><p class="line">I’ll miss you.</p></div></div>
<script>
(() => {
  const W = 2000, H = 1255, shot = document.getElementById('shot');
  const band = () => {
    let top = 0, bottom = innerHeight;
    try { const pd = window.parent.document, k = pd.getElementById('kicker'), c = pd.getElementById('counter');
          if (k) top = k.getBoundingClientRect().bottom + 40; if (c) bottom = c.getBoundingClientRect().top - 40; } catch (_) {}
    return Math.max(200, bottom - top);
  };
  // the strike: from 16px past the top-right corner, down the diagonal to 16px past the bottom-left — the bar's length and angle
  const bar = document.getElementById('bar'), OVER = 48;   // 16, then 32 more past each corner (John, 2026-10-07)
  const strike = (w, h) => { const d = Math.hypot(w, h), ux = w / d, uy = h / d, ang = Math.atan2(h, -w) * 180 / Math.PI;
    bar.style.left = (w + ux * OVER) + 'px'; bar.style.top = (-uy * OVER - 4) + 'px'; bar.style.width = (d + 2 * OVER) + 'px'; bar.style.setProperty('--ang', ang + 'deg'); };
  const fit = () => { const s = Math.min((innerWidth - 64) / W, band() / H) * .8, w = Math.round(W * s), h = Math.round(H * s); shot.style.width = w + 'px'; shot.style.height = h + 'px'; strike(w, h); };
  fit(); addEventListener('resize', fit);
  // the grab decoded ahead of the strike (John, 2026-10-07: "maybe it's a loading thing") — a 2000-wide webp painting mid-stroke would stutter it
  const img = shot.querySelector('img'); if (img.decode) img.decode().catch(() => {});
  let step = 0;
  const show = (n, instant) => { step = n; if (instant) document.body.classList.add('snap'); shot.classList.toggle('on', n > 0); if (instant) requestAnimationFrame(() => document.body.classList.remove('snap')); };
  window.presoNext = () => { if (step >= 1) return false; show(1); return true; };
  window.presoPrev = () => { if (step <= 0) return false; show(0); return true; };
  window.presoState = () => step;
  window.presoRestore = n => show(Math.max(0, Math.min(1, n | 0)), true);
  window.presoEnd = () => show(1, true);
})();
</script>
</body>
</html>
