<!DOCTYPE html>

<head>

<title>09bz1</title>
<!-- THE PROBLEM (John, 2026-10-09) — one mono card straight after "Secretly, I had something more 'experimental' in mind." (09bz),
     before the trip creator (09c): what the experiment was for. John's pick from a punchier round (his first cut: "we were good at
     finding you a home but bad at finding you a destination."): "Airbnb had a problem: we could find you a home, not a destination."
     Broken by hand where the sense breaks, the last line landing alone: 21 / 25 / 18. Set as the cards round it are: IBM Plex Mono at 40, centred. -->
<style>
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../fonts/IBMPlexMono-Regular.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: block;
  }
  html, body { margin: 0; height: 100%; background: #fff; color: #111; overflow: hidden; }
  .slide { height: 100%; display: grid; place-items: center; padding: 0 48px; box-sizing: border-box; }
  .copy { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 40px; line-height: 1.5;   /* 60 on 40 (John, 2026-10-07: 1.3 was too tight) */ }
  .one { margin: 0; text-align: center; white-space: nowrap; }
</style>
</head>
<body>
  <div class="slide">
    <div class="copy">
      <p class="one">Airbnb had a problem:<br>we could find you a home,<br>not a destination.</p>
    </div>
  </div>
<script>
  window.presoNext = () => false;   // one line, no builds
  window.presoPrev = () => false;
  window.presoState = () => 0;
  window.presoRestore = () => {};
</script>
</body>
