<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09f</title>
<!-- HOST SETUP, EVERY STEP AT ONCE — the whole flow in one row, straight
     before the host-only fee screens.

     TWELVE INSTANCES OF SLIDE 11, ONE PER STEP. Slide 11 is a single phone
     whose steps are toggled by a body class — every step's content is already
     in its DOM, hidden — so there is no set of step elements to lay out. The
     only faithful way to show them side by side is to load the slide once per
     step and set that class. Nothing is re-drawn or re-exported: each cell is
     the real screen.

       step 0    the splash            step 6    photos
       step 1    place type  (no class, it is the default)
       step 1b   home type            step 7    name
       step 2    space type           step 8    describe
       step 3    address              step 8b   price
       step 4    guests               step 10   preview
       step 5    amenities

     step 9, "Just a few last questions", is left out — twelve cells, not
     thirteen.

     ?nomap=1 ON TWELVE OF THEM. Slide 11 builds a live Mapbox map at load, and
     twelve of those is twelve WebGL contexts — at the browser's cap, where
     they start getting dropped. Only the address cell asks for one.

     ONE ROW, THREE PARTS. The intro on the left, then a gap, then the ten
     steps fanned so each covers the one before it by 20%, then the same gap,
     then the listing it all ends on. Was a 6x2 grid.

     THE CELL IS CROPPED TO THE PHONE. Slide 11 sizes its phone at 80vh of its
     own viewport, so a cell showing the whole viewport carries 20% dead
     margin — and on two rows that waste is what decides the size. Each cell is
     therefore 800 of the 1000pt viewport tall, with the frame pulled up by the
     100pt above the phone. The 391.3 width is chosen so the phone spans the
     cell exactly: 800 x 900/1840 = 391.3.

     THE SCALE IS COMPUTED, NOT GUESSED. It is the smaller of what the width
     allows and what the height allows, so the row never overflows either way.
     CSS cannot divide a length by a length, so this cannot be a calc(); a
     ResizeObserver also fires when the deck un-parks the slide, which a
     load-time read would miss — it measures zero while parked.

     ONE BUILD, A LEAD-IN. The slide arrives showing only the first screen, at
     the size slide 11 gives its phone on its own — min(80vh, 1080px) — parked
     in the middle of the stage, its intro film playing once. The tap sends it
     to its place at the far left of the row, and the other eleven arrive one
     after another, 90ms apart.

     THE FILM PLAYS ONCE. Slide 11's video carries a loop attribute; it is
     turned off on arrival, so the intro runs a single pass and holds its last
     frame. It does not loop, and it does not restart when the row opens. -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .slide { height: 100%; display: grid; place-items: center; }

  .row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--gap, 60px);
  }
  /* the ten middle steps, fanned. Each sits 80% of a width further along, so
     it covers the one before it by 20%. Later ones ride on top. */
  .stack {
    position: relative;
    flex: none;
    width: var(--stackw, 0px);
    height: calc(800px * var(--k, 0.3));
  }
  .stack .cell { position: absolute; top: 0; }

  .cell {
    position: relative;
    flex: none;
    /* 391.3 x 800 of slide 11's viewport — the phone alone, not the 1000 the
       viewport is tall. The 100pt of margin above it is cropped out below. */
    width: calc(391.3px * var(--k, 0.3));
    height: calc(800px * var(--k, 0.3));
    overflow: hidden;
    opacity: 1;
    transition: transform 820ms cubic-bezier(0.22, 1, 0.36, 1),
                opacity 380ms ease;
    will-change: transform, opacity;
  }

  /* the eleven that are not the lead, before they arrive */
  .cell.waiting { opacity: 0; transform: scale(0.94); }
  /* the lead sits above them while it is large */
  .cell.lead { z-index: 2; }

  .cell iframe {
    position: absolute; left: 0;
    top: calc(-100px * var(--k, 0.3));      /* lift the phone's top margin out */
    width: 391.3px; height: 1000px;
    border: 0; display: block;
    transform: scale(var(--k, 0.3));
    transform-origin: top left;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="row" id="row"></div>
  </div>
<script>
(() => {
  // step -> the body class slide 11 uses. Step 1 is the default and carries no
  // class at all, which is why one entry is empty rather than 'step1'.
  // step9 — "Just a few last questions…" — is deliberately not here. Twelve
  // cells, not thirteen.
  const STEPS = ['step0', '', 'step1b', 'step2', 'step3', 'step4', 'step5',
                 'step6', 'step7', 'step8', 'step8b', 'step10'];
  const MAP_STEP = 'step3';                 // the only one that gets a real map
  // the slide-11 viewport each cell renders: 391.3 wide so the phone spans the
  // cell exactly (800 x 900/1840), 1000 tall of which the phone is the middle
  // 800 — the rest is cropped.
  const VW = 391.3, VH = 1000, PH = 800;

  const row = document.getElementById('row');
  // the deck's per-load stamp, passed down so a cell is never a stale copy
  const v = new URLSearchParams(location.search).get('v');

  function cellFor(cls) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const f = document.createElement('iframe');
    f.title = 'Host setup — ' + (cls || 'step 1');
    f.setAttribute('scrolling', 'no');
    f.src = '11.html?' + (cls === MAP_STEP ? '' : 'nomap=1&') + 'still=1' + (v ? '&v=' + v : '');
    f.addEventListener('load', () => {
      const d = f.contentDocument; if (!d) return;
      const set = () => { d.body.className = cls; };
      set();
      // Slide 11 runs its own opening beat on load, which would put every cell
      // back on step 1. Re-assert after it has had its go.
      setTimeout(set, 120); setTimeout(set, 600); setTimeout(set, 1400);
    });
    cell.appendChild(f);
    return cell;
  }

  // THREE PARTS, LEFT TO RIGHT: the intro, the ten steps fanned, the listing.
  const first = cellFor(STEPS[0]);
  const stack = document.createElement('div');
  stack.className = 'stack';
  const middle = STEPS.slice(1, -1).map((cls, i) => {
    const c = cellFor(cls);
    c.style.zIndex = i + 1;               // each rides on the one before it
    stack.appendChild(c);
    return c;
  });
  const last = cellFor(STEPS[STEPS.length - 1]);
  row.append(first, stack, last);

  const slide = document.querySelector('.slide');
  let K = 0;                               // the scale fit() last set

  // ── the lead-in ───────────────────────────────────────────────────────
  // Beat 0 shows ONLY the first screen, at the size slide 11 gives its phone
  // on its own — min(80vh, 1080px) — parked in the middle of the stage. Its
  // intro film plays once there. The tap sends it to its own cell, the top
  // left of the row, and brings the other eleven in one after another.
  let step = 0;
  const cells = [first, ...middle, last];
  const lead = first;

  function filmOf() {                      // the intro video inside the lead cell
    try { return lead.querySelector('iframe').contentDocument.getElementById('film'); }
    catch (_) { return null; }
  }

  function placeLead() {
    if (step !== 0 || !K) return;
    // Measure UNTRANSFORMED, or the offset compounds every time this runs.
    lead.style.transform = 'none';
    void lead.offsetWidth;
    const s = slide.getBoundingClientRect(), c = lead.getBoundingClientRect();
    const full = Math.min(s.height * 0.8, 1080);        // slide 11's own phone height
    const S = full / (PH * K);
    const dx = (s.left + s.width / 2) - (c.left + c.width / 2);
    const dy = (s.top + s.height / 2) - (c.top + c.height / 2);
    lead.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + S + ')';
  }

  function setLead() {                     // beat 0
    step = 0;
    lead.classList.add('lead');
    cells.forEach((c, i) => { if (i) { c.classList.add('waiting'); c.style.transitionDelay = '0ms'; } });
    // ONCE, THEN REST. Slide 11's film carries a loop attribute; it is turned
    // off here so the intro plays a single pass and holds its last frame.
    const f = filmOf(); if (f) { f.loop = false; f.currentTime = 0; f.play().catch(() => {}); }
    placeLead();
  }

  function openGrid() {                    // the tap
    step = 1;
    lead.style.transform = 'none';         // back to its own cell: the top left
    lead.classList.remove('lead');
    cells.forEach((c, i) => {
      if (!i) return;
      c.style.transitionDelay = (60 + (i - 1) * 90) + 'ms';   // one after another
      c.classList.remove('waiting');
    });
  }

  // THE ARITHMETIC. Left to right the row is: one cell, a gap, the fan, a gap,
  // one cell. The fan of ten at 80% pitch is 1 + 9 x 0.8 = 8.2 cells wide, so
  // the row is 10.2 cells plus two gaps. With the gap set at half a cell that
  // is 11.2 cells across, and the cell width falls out of the space available.
  const PITCH = 0.8, FAN = 1 + (middle.length - 1) * PITCH, GAPC = 0.5;
  const fit = (w, h) => {
    if (!(w > 0 && h > 0)) return;
    const kW = (w * 0.94 / (2 + FAN + 2 * GAPC)) / VW;
    const kH = (h * 0.84) / PH;
    K = Math.min(kW, kH);
    const cw = VW * K;
    row.style.setProperty('--k', K);
    row.style.setProperty('--gap', cw * GAPC + 'px');
    row.style.setProperty('--stackw', cw * FAN + 'px');
    middle.forEach((c, i) => { c.style.left = (cw * PITCH * i) + 'px'; });
    placeLead();                           // the lead's offset is in screen px
  };
  new ResizeObserver(([e]) => fit(e.contentRect.width, e.contentRect.height)).observe(slide);
  const r0 = slide.getBoundingClientRect(); fit(r0.width, r0.height);
  setLead();

  window.presoNext = () => {
    if (step) return false;                // out of builds — on to the fee screens
    openGrid();
    return true;
  };
  window.presoPrev = () => {
    if (!step) return false;               // on the lead — the deck goes back a slide
    setLead();
    return true;
  };
  window.presoState = () => step;
  window.presoRestore = n => { if (n > 0) openGrid(); };
})();
</script>
</body>
</html>
