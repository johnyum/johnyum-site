<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09f</title>
<!-- HOST SETUP, FIVE UP — one screen, straight after the transportation screens
     (John, 2026-10-01). No lead-in, no five-then-five, no pull back to the full
     row: the five phones are the slide, and the deck pushes them in as one.

       1  the splash      "Become a Host in 10 easy steps" — the film and the header
       2  place type      What kind of place will you host?
       3  address         Where's your place located?
       4  amenities       Let guests know what your place has to offer
       5  name            Let's give your place a name

     The price was the sixth and came out the same day — five up.

     ONE BUILD. The five land as questions; one tap answers the four that have
     an answer — House is chosen, the address types and the map flies to it,
     the amenities pick themselves (the short form: four cards and a stop), and the
     name types — all together, never left to right: a
     stagger is a wave the eye follows and reads as a queue. The next tap moves
     on.

     FIVE INSTANCES OF SLIDE 11, ONE PER SCREEN. Slide 11 is a single phone whose
     steps are beats; each cell loads it and parks on its beat with presoPark(),
     and the tap is presoAct(), which answers in place and never presses Next.
     The answers are slide 11's own BEATS — nothing here is a second copy.

     ?nomap=1 on all but the address cell: each live map is a WebGL context.

     THE CELL IS CROPPED TO THE PHONE. Slide 11 sizes its phone at 80vh of its
     own viewport, so each cell is 800 of the 1000pt viewport tall with the
     frame lifted by the 100 above the phone; 391.3 wide = 800 x 900/1840, so
     the phone spans the cell exactly. The scale is the smaller of what the
     width and height allow, set by a ResizeObserver — it also fires when the
     deck un-parks the slide, which a load-time read misses (it measures zero).

     THE FILM PLAYS ONCE PER VISIT. Slide 11's video carries `loop`; it is
     cleared here. The deck loads a slide ahead of time, so the play slide 11
     starts at load can be over before anyone arrives — the film is therefore
     started again from 0 every time the slide is shown (the deck's
     `presoshown`) and every time the page comes back from another tab or app
     (John, 2026-10-01). It is seeked and played directly, never re-parked: a
     re-park re-commits beat 0, and slide 11 leaves a running film alone there.
     Every cell opens standing on its beat (?park=) and is never re-parked.

     NOTHING HOVERS, and there is no presoInteractive — the deck's tap rails
     cover the stage and tapping anywhere advances. -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .slide { position: relative; height: 100%; display: grid; place-items: center; }

  .row { display: flex; align-items: center; gap: var(--gap, 24px); }

  .cell {
    position: relative;
    flex: none;
    width: calc(391.3px * var(--k, 0.3));
    height: calc(800px * var(--k, 0.3));
    overflow: hidden;
  }
  .cell iframe {
    position: absolute; left: 0;
    top: calc(-100px * var(--k, 0.3));      /* lift the phone's top margin out */
    width: 391.3px; height: 1000px;
    border: 0; display: block;
    transform: scale(var(--k, 0.3));
    transform-origin: top left;
  }
</style>
</head>
<body>
  <div class="slide" id="slide"><div class="row" id="row"></div></div>
<script>
(() => {
  // [the body class it shows, the slide-11 BEAT it parks on — the screen
  // ARRIVED and not yet answered]. Read off the BEATS table in 11.html; if a
  // beat is inserted there, these move.
  const SCREENS = [
    ['step0',  0],                          // the splash: film + header
    ['',       1],                          // place type (step 1 has no class)
    ['step3',  7],                          // address — the one live map
    ['step5', 10],                          // amenities
    ['step7', 13],                          // name
  ];
  const MAP_STEP = 'step3', FILM_STEP = 'step0';
  const VW = 391.3, PH = 800, GAPC = 0.1;

  const slide = document.getElementById('slide');
  const row = document.getElementById('row');
  const v = new URLSearchParams(location.search).get('v');   // the deck's per-load stamp

  const park = c => { try { c._w.presoPark(c._beat); } catch (_) {} };
  const act  = c => { try { c._w.presoAct(); } catch (_) {} };

  const cells = SCREENS.map(([cls, beat]) => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell._beat = beat;
    const f = document.createElement('iframe');
    f.title = 'Host setup — ' + (cls || 'step1');
    f.setAttribute('scrolling', 'no');
    // LOCKED TO ITS SCREEN FROM THE FIRST PAINT (John, 2026-10-01): ?park= opens slide 11 standing on the beat,
    // transitions off. It used to load on the splash and be parked afterwards — at load and three more times — so
    // every arrival was five phones visibly re-animating into place. Nothing re-parks it now.
    f.src = '11.html?' + (cls === MAP_STEP ? '' : 'nomap=1&') + 'park=' + beat + (v ? '&v=' + v : '');
    f.addEventListener('load', () => {
      cell._w = f.contentWindow;
      if (cls === FILM_STEP) unloop(f);
    });
    cell.appendChild(f);
    row.append(cell);
    return cell;
  });

  // clears the film's `loop`; the frame may not be up yet, so it keeps asking
  function unloop(f) {
    const t0 = Date.now();
    (function ask() {
      let film = null;
      try { film = f.contentDocument.getElementById('film'); } catch (_) {}
      if (film) { film.loop = false; return; }
      if (Date.now() - t0 < 4000) setTimeout(ask, 120);
    })();
  }

  // THE FILM AGAIN, FROM THE TOP — on every arrival and every return to the page
  function replay() {
    let doc = null;
    try { doc = cells[0].querySelector('iframe').contentDocument; } catch (_) {}
    const film = doc && doc.getElementById('film');
    if (!film) return;
    film.loop = false;
    const ctl = doc.getElementById('filmctl'); if (ctl) ctl.classList.remove('ended');
    const start = () => { try { film.currentTime = 0; } catch (_) {} film.play().catch(() => {}); };
    if (film.readyState >= 2) start(); else film.addEventListener('loadeddata', start, { once: true });
  }
  addEventListener('presoshown', replay);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) replay(); });

  // AS TALL AS THE HOST-ONLY-FEE FOUR-UP (09d), to the pixel (John, 2026-10-01). 09d's
  // image is min(80vh, 1080px, (76vw - 144px) / 1.958) tall, and its phone's ink is
  // 1970 of the image's 2000 rows; a cell here is all phone. The width cap stays, so
  // five never overflow a narrow stage.
  const HOF = (w, h) => Math.min(0.8 * h, 1080, (0.76 * w - 144) / 1.958) * 1970 / 2000;
  const fit = (w, h) => {
    if (!(w > 0 && h > 0)) return;
    const n = cells.length;
    const k = Math.min((w * 0.94 / (n + GAPC * (n - 1))) / VW, HOF(w, h) / PH);
    slide.style.setProperty('--k', k);
    slide.style.setProperty('--gap', VW * k * GAPC + 'px');
  };
  new ResizeObserver(([e]) => fit(e.contentRect.width, e.contentRect.height)).observe(slide);
  const r0 = slide.getBoundingClientRect(); fit(r0.width, r0.height);

  let step = 0;                             // 0 five questions, 1 four answered
  const answer = () => cells.slice(1).forEach(act);          // the splash has no answer

  window.presoNext = () => {
    if (step >= 1) return false;            // out of builds — the deck moves on
    step = 1; answer(); return true;
  };
  window.presoPrev = () => {
    if (step === 0) return false;
    step = 0; cells.slice(1).forEach(park); return true;
  };
  window.presoState = () => step;
  // Landing on the beat from the hash: the frames may still be loading, so retry.
  // Once, when every frame is up — answering twice re-runs the fill-ins.
  window.presoRestore = n => {
    if (!(n > 0)) return;
    step = 1;
    const t0 = Date.now();
    (function when() {
      if (step !== 1) return;
      if (cells.every(c => c._w && c._w.presoAct)) { answer(); return; }
      if (Date.now() - t0 < 8000) setTimeout(when, 100);
    })();
  };
})();
</script>
</body>
</html>
