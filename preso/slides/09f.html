<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09f</title>
<!-- HOST SETUP, EVERY STEP AT ONCE — the ten steps in one row, straight before
     the cleaning-fee tweet and the host-only fee screens.

     ELEVEN INSTANCES OF SLIDE 11, ONE PER SCREEN. Slide 11 is a single phone
     whose steps are toggled by a body class — every step's content is already
     in its DOM, hidden — so there is no set of step elements to lay out. The
     only faithful way to show them side by side is to load the slide once per
     step and set that class. Nothing is re-drawn or re-exported: each cell is
     the real screen.

       the intro the splash            step 5    amenities
       step 1    place type  (no class, it is the default)
       step 1b   home type            step 6    photos
       step 2    space type           step 7    name
       step 3    address              step 8    describe
       step 4    guests               step 8b   price

     step 9 ("Just a few last questions") and step 10 (the listing preview) are
     both left out — the row ends on the price, so the flow lands on the money.

     THE INTRO IS NOT ONE OF THE TEN. It is the lead-in, and it leaves before
     the row arrives — so it is not in the row at all, it is its own element
     centred on the stage. The row is the ten actual steps and nothing else.
     Putting the splash at the head of the row was the earlier shape and it
     read as eleven steps, which is one more than there are.

     ?nomap=1 ON TEN OF THEM. Slide 11 builds a live Mapbox map at load, and
     eleven of those is eleven WebGL contexts — at the browser's cap, where
     they start getting dropped. Only the address cell asks for one.

     ONE ROW, EVENLY SPACED, NOTHING OVERLAPPING. Ten cells with a tenth of a
     cell between them, which is 10 + 0.9 = 10.9 cells across; the cell width
     falls out of the space rather than being chosen.

     TWO MOVES, NOT TEN. The tap sends the intro DOWN, LEFT and OUT on one
     curve: it shrinks from the size slide 11 gives its phone on its own to the
     size the ten are, travels off toward where the row begins, and fades as it
     goes — so the splash leaves WITH the movement rather than standing at full
     strength until it is cut, and crosses the row coming the other way. Then, a
     beat later, the whole row is pushed in from the right in one piece — the
     deck's own push, to the millisecond, lifted from index.html: DUR 520 on
     EASE cubic-bezier(0.16, 1, 0.3, 1). Nothing staggers, nothing deals.

     TAP TWO ANSWERS THE WHOLE ROW AT ONCE. Every screen makes its own choice
     in the same moment — House is chosen, the address types itself in and the
     map flies to it, the counts count up, the amenities pick themselves, the
     name types, the price ticks to $500 — all of it together. This was a 420ms
     stagger left to right, and the stagger was the thing you watched: the eye
     tracked the wave and read the row as a queue being worked through. Fired
     together there is no wave to follow, and ten screens answering at once
     reads as one flow working.

     The amenities screen runs a SHORT form here — four cards and a stop, no
     scrolling. At full length it travels down its list, and among nine still
     screens the one that moves is the only one anybody watches.

     IT NEVER PRESSES A PHONE'S NEXT BUTTON. The row has to stay on the ten
     screens it is showing, so the sweep uses slide 11's presoAct(), which
     answers in place and stops. Those answers come out of slide 11's own BEATS
     table — the same choices it makes when you tap through it on its own — so
     nothing here is a second copy of what the flow does.

     HOVER MAGNIFIES, AND THE ROW HOLDS ITS WIDTH. Three sizes, the way a dock
     has them: the phone under the pointer full size, the two either side of it
     at a middle size, everything else smaller than it was. The ten scales are
     solved to sum to ten whichever one is hot, so whatever the big one takes
     is exactly what the others give up and the row pushes rather than spills.
     An iframe swallows the pointer, so each cell carries a transparent pane
     over its frame and that is what is hovered.

     THE CELL IS CROPPED TO THE PHONE. Slide 11 sizes its phone at 80vh of its
     own viewport, so a cell showing the whole viewport carries 20% dead
     margin. Each cell is therefore 800 of the 1000pt viewport tall, with the
     frame pulled up by the 100pt above the phone. The 391.3 width is chosen so
     the phone spans the cell exactly: 800 x 900/1840 = 391.3.

     THE SCALE IS COMPUTED, NOT GUESSED. It is the smaller of what the width
     allows and what the height allows, so the row never overflows either way.
     CSS cannot divide a length by a length, so this cannot be a calc(); a
     ResizeObserver also fires when the deck un-parks the slide, which a
     load-time read would miss — it measures zero while parked.

     NOTHING IS MEASURED ANY MORE. The intro is centred by the stage itself
     (left/top 50%, translate -50%) and grows by a --s the fit sets, so there
     is no getBoundingClientRect and no transition to pin off around it. The
     old version measured mid-transition and settled the phone 122px left of
     centre; there is nothing left to get wrong.

     THE FILM PLAYS ONCE. Slide 11's video carries a loop attribute; it is
     turned off on arrival, so the intro runs a single pass and holds its last
     frame. It does not loop, and it does not restart when the row opens. -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .slide { position: relative; height: 100%; display: grid; place-items: center; }

  .row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--gap, 60px);
    /* THE DECK'S OWN PUSH, to the millisecond: index.html pushes a slide with
       DUR 520 on EASE cubic-bezier(0.16, 1, 0.3, 1). The row arrives the way a
       slide arrives, because that is what it is meant to read as. */
    transition: transform 520ms cubic-bezier(0.16, 1, 0.3, 1);
    will-change: transform;
  }
  .row.offstage { transform: translateX(100vw); }
  /* WAITING IS NOT THE SAME AS OFFSTAGE. While the intro holds the stage the
     row sits exactly where it belongs and is merely invisible, so its ten
     iframes lay out and RASTERISE. Parked off the right instead, they are
     outside the viewport, the engine does not paint them, and the push
     delivered ten blank phones that filled in a second later. It is moved off
     the right for a single frame at the tap — too short to be throttled — and
     released from there. */
  .row.waiting { opacity: 0; }

  .cell {
    position: relative;
    flex: none;
    /* 391.3 x 800 of slide 11's viewport — the phone alone, not the 1000 the
       viewport is tall. The 100pt of margin above it is cropped out below.
       A cell carries its OWN --k when the row is magnified, which resizes the
       box, rescales the frame inside it and moves the crop in one go. */
    width: calc(391.3px * var(--k, 0.3));
    height: calc(800px * var(--k, 0.3));
    overflow: hidden;
    transition: width var(--mag, 0ms) var(--spring),
                height var(--mag, 0ms) var(--spring);
  }
  /* A LITTLE OVERSHOOT, then it settles — a phone that arrives dead on the
     number reads as a value being set, and one that carries a touch past and
     comes back reads as a thing being moved. Not a real spring: one back-out
     curve on every cell at once stays in step, where ten independent springs
     drift apart and the row stops looking like a row. */
  .row { --spring: cubic-bezier(0.34, 1.4, 0.64, 1); }

  /* AN IFRAME SWALLOWS THE POINTER. Hover never reaches this document through
     one, so each cell carries a transparent pane over its frame and that is
     what is actually hovered. It takes the clicks too, which is right: a cell
     is a picture of a screen here, not a screen. */
  .hit { position: absolute; inset: 0; z-index: 2; }
  .row.waiting { pointer-events: none; }        /* not while the intro holds */

  /* The lead-in, centred on the stage by the stage. --s is how much bigger
     than a row cell it is; the tap takes it to 1 and to nothing. */
  .cell.intro {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%) scale(var(--s, 1));
    z-index: 2;
    transition: transform 460ms cubic-bezier(0.16, 1, 0.3, 1),
                opacity   460ms cubic-bezier(0.16, 1, 0.3, 1);
    will-change: transform, opacity;
  }
  /* It goes DOWN, LEFT and OUT on one curve — shrinking to the size the ten
     are while travelling off toward where the row begins, rather than
     collapsing on the spot. The row it hands over to arrives from the right,
     so the two moves cross and the stage never sits empty. */
  .cell.intro.gone {
    transform: translate(calc(-50% - 22vw), -50%) scale(1);
    opacity: 0;
  }

  .cell iframe {
    position: absolute; left: 0;
    top: calc(-100px * var(--k, 0.3));      /* lift the phone's top margin out */
    width: 391.3px; height: 1000px;
    border: 0; display: block;
    transform: scale(var(--k, 0.3));
    transform-origin: top left;
    transition: transform var(--mag, 0ms) var(--spring),
                top var(--mag, 0ms) var(--spring);
  }
</style>
</head>
<body>
  <div class="slide" id="slide">
    <div class="row" id="row"></div>
  </div>
<script>
(() => {
  // step -> the body class slide 11 uses. Step 1 is the default and carries no
  // class at all, which is why one entry is empty rather than 'step1'.
  const INTRO = 'step0';                    // the splash — the lead-in, not a step
  const STEPS = ['', 'step1b', 'step2', 'step3', 'step4', 'step5',
                 'step6', 'step7', 'step8', 'step8b'];
  // Which of slide 11's BEATS each cell is parked on — the beat where that
  // screen has ARRIVED and has not yet answered. presoAct() is what answers
  // it. Read straight off the BEATS table in 11.html; if a beat is inserted
  // there, these move.
  //        step1  1b  2   3   4   5   6   7   8   8b
  const PARK = [1,  3,  5,  7,  9, 10, 11, 13, 15, 16];
  const INTRO_BEAT = 0;
  const MAP_STEP = 'step3';                 // the only one that gets a real map
  // the slide-11 viewport each cell renders: 391.3 wide so the phone spans the
  // cell exactly (800 x 900/1840), 1000 tall of which the phone is the middle
  // 800 — the rest is cropped.
  const VW = 391.3, PH = 800;

  const slide = document.getElementById('slide');
  const row = document.getElementById('row');
  // the deck's per-load stamp, passed down so a cell is never a stale copy
  const v = new URLSearchParams(location.search).get('v');

  // THROUGH THE BEAT SYSTEM, NOT THE BODY CLASS. This used to write
  // body.className straight into the frame, which put the right screen up and
  // skipped slide 11's beats entirely — so the counts, the amenities, the
  // chips and the price had no animation left in them to play. presoPark()
  // lands the frame on the beat properly and holds it there: the screen as a
  // question, waiting.
  function park(cell) {
    try { cell._w.presoPark(cell._beat); return true; } catch (_) { return false; }
  }
  function act(cell) {
    try { return !!cell._w.presoAct(); } catch (_) { return false; }
  }

  function cellFor(cls, beat) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell._beat = beat;
    const f = document.createElement('iframe');
    f.title = 'Host setup — ' + (cls || 'step 1');
    f.setAttribute('scrolling', 'no');
    f.src = '11.html?' + (cls === MAP_STEP ? '' : 'nomap=1&') + 'still=1' + (v ? '&v=' + v : '');
    f.addEventListener('load', () => {
      cell._w = f.contentWindow;
      park(cell);
      // Slide 11 runs its own opening beat on load, which would put every cell
      // back on step 1. Re-assert after it has had its go. Parking is
      // idempotent, and all of this is long finished before the tap.
      setTimeout(() => park(cell), 120);
      setTimeout(() => park(cell), 600);
      setTimeout(() => park(cell), 1400);
    });
    cell.appendChild(f);
    const hit = document.createElement('i');    // the pointer's surface, over the frame
    hit.className = 'hit';
    cell.appendChild(hit);
    return cell;
  }

  const cells = STEPS.map((cls, i) => cellFor(cls, PARK[i]));   // the ten
  cells.forEach(c => row.append(c));

  const intro = cellFor(INTRO, INTRO_BEAT); // the lead-in, outside the row
  intro.classList.add('intro');
  slide.append(intro);

  let step = 0;
  let K = 0;                                // the scale fit() last set
  let hot = -1;                             // the magnified cell, or -1

  function filmOf() {                       // the intro video inside the lead-in
    try { return intro.querySelector('iframe').contentDocument.getElementById('film'); }
    catch (_) { return null; }
  }

  // Change something without animating it.
  function hold(el, f) {
    const t = el.style.transition;
    el.style.transition = 'none';
    f();
    void el.offsetWidth;
    el.style.transition = t;
  }

  function setLead() {                      // beat 0
    step = 0;
    clearTimeout(nextT);
    row.style.setProperty('--mag', '0ms');
    hot = -1; magnify();
    cells.forEach(park);                   // back to ten unanswered questions
    hold(row, () => {
      row.classList.add('waiting');        // in place, invisible, rendering
      row.classList.remove('offstage');
    });
    hold(intro, () => { intro.classList.remove('gone'); });
    // ONCE, THEN REST. Slide 11's film carries a loop attribute; it is turned
    // off here so the intro plays a single pass and holds its last frame.
    const f = filmOf(); if (f) { f.loop = false; f.currentTime = 0; f.play().catch(() => {}); }
  }

  const DOWN = 460, BEAT = 60;
  // ALL TEN AT ONCE. This ran left to right, 420ms apart, and the stagger was
  // the thing you watched — the eye tracked the wave and read the row as a
  // queue being worked through. Fired together there is no wave to follow, and
  // the row reads as one flow answering itself, which is what it is. Nothing
  // is scheduled any more, so there is nothing to cancel either.
  let nextT = 0;

  function openRow() {                      // tap 1 — the row arrives
    step = 1;
    clearTimeout(nextT);
    cells.forEach(park);
    intro.classList.add('gone');            // down to the size of the ten, and out
    nextT = setTimeout(() => {
      // One frame off the right, visible, then let go: the push, from content
      // that is already drawn.
      hold(row, () => {
        row.classList.add('offstage');
        row.classList.remove('waiting');
      });
      row.classList.remove('offstage');
      // The spring is armed only once the push has landed. Left on, a resize,
      // a park or the push itself would each spring the ten for no reason.
      setTimeout(() => row.style.setProperty('--mag', MAG + 'ms'), 560);
    }, DOWN + BEAT);
  }

  // THE MAGNIFIER. Three sizes, the way a dock has them: the one under the
  // pointer at full size, the two either side of it at a middle size, and
  // everything else smaller than it was.
  //
  // THE ROW NEVER CHANGES WIDTH, which is what makes it push rather than
  // spill. The ten scales are solved to sum to ten whichever cell is hot, so
  // whatever the big one takes is exactly what the small ones give up — the
  // small size is worked out rather than chosen. An end cell has one
  // neighbour instead of two, so the arithmetic is done per hover.
  const BIG = 1.6, MID = 1.25, MAG = 320;
  function magnify() {
    if (!K) return;
    const n = cells.length;
    // A short stage would let the big one grow past the top and bottom, so it
    // is capped by what the height allows before anything else is solved.
    const big = Math.min(BIG, (slide.clientHeight * 0.94) / (PH * K));
    const near = hot < 0 ? [] : [hot - 1, hot + 1].filter(i => i >= 0 && i < n);
    const small = (n - big - near.length * MID) / (n - 1 - near.length);
    cells.forEach((c, i) => {
      const f = hot < 0 ? 1 : i === hot ? big : near.indexOf(i) >= 0 ? MID : small;
      c.style.setProperty('--k', K * f);
    });
  }

  // ONE LISTENER ON THE ROW, and the cell is worked out from where the pointer
  // is — not a mouseenter per cell. Crossing from one cell to the next would
  // fire a leave and then an enter, dropping the whole row back to rest for a
  // frame on every crossing, and the gaps between cells belong to whichever
  // cell is nearest rather than to nobody.
  row.addEventListener('mousemove', e => {
    let best = -1, d = Infinity;
    cells.forEach((c, i) => {
      const r = c.getBoundingClientRect();
      const gap = e.clientX < r.left ? r.left - e.clientX
                : e.clientX > r.right ? e.clientX - r.right : 0;
      if (gap < d) { d = gap; best = i; }
    });
    if (best !== hot) { hot = best; magnify(); }
  });
  row.addEventListener('mouseleave', () => { hot = -1; magnify(); });

  // THE ARITHMETIC. Ten cells in a row with a tenth of a cell between them is
  // 10 + 0.9 = 10.9 cells across, and the cell width falls out of the space.
  const GAPC = 0.1;
  const fit = (w, h) => {
    if (!(w > 0 && h > 0)) return;
    const n = cells.length;
    const kW = (w * 0.94 / (n + GAPC * (n - 1))) / VW;
    const kH = (h * 0.84) / PH;
    K = Math.min(kW, kH);
    slide.style.setProperty('--k', K);        // the lead-in reads this one
    slide.style.setProperty('--gap', VW * K * GAPC + 'px');
    magnify();                                // the cells carry their own
    // how much bigger the lead-in is than a row cell: slide 11's own phone
    // height over the height a cell gives it.
    slide.style.setProperty('--s', Math.min(h * 0.8, 1080) / (PH * K));
  };
  new ResizeObserver(([e]) => fit(e.contentRect.width, e.contentRect.height)).observe(slide);
  const r0 = slide.getBoundingClientRect(); fit(r0.width, r0.height);
  setLead();

  // tap 2 — every screen answers itself, together. It NEVER presses a phone's
  // Next button: the row stays on the ten screens it is showing.
  function sweep() {
    step = 2;
    cells.forEach(act);
  }

  // THE DECK'S TAP RAILS COVER THE WHOLE STAGE — #tapback 30% and #tapnext 70%
  // at z-index 10 — so nothing here ever saw the pointer and the magnifier
  // looked broken while working perfectly. Declaring this shrinks them to 32px
  // strips at the edges, the deck's own provision for a slide whose surface is
  // live (13, 12b, 12c and 12d all take it). Tapping the middle of this slide
  // no longer advances it; the arrows, the clicker and the edge rails do.
  window.presoInteractive = true;

  window.presoNext = () => {
    if (step === 0) { openRow(); return true; }
    if (step === 1) { sweep();   return true; }
    return false;                           // out of builds — on to the tweet
  };
  window.presoPrev = () => {
    if (step === 2) { openRow(); return true; }   // ten unanswered again
    if (step === 1) { setLead(); return true; }
    return false;                           // on the lead-in — the deck goes back
  };
  window.presoState = () => step;
  // Landing on the beat from the hash gets the end state, not the move.
  window.presoRestore = n => {
    if (!(n > 0)) return;
    step = n > 1 ? 2 : 1;
    clearTimeout(nextT);
    hold(intro, () => intro.classList.add('gone'));
    hold(row, () => { row.classList.remove('offstage'); row.classList.remove('waiting'); });
    // Landing on the hash gets the end state, so the sweep runs at once rather
    // than 420ms apart. The frames may still be loading, so it is retried.
    if (n > 1) [0, 400, 1200, 2000].forEach(t => setTimeout(() => cells.forEach(act), t));
  };
})();
</script>
</body>
</html>
