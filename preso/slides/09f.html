<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09f</title>
<!-- HOST SETUP, EVERY STEP AT ONCE — the whole flow in one row, straight
     before the host-only fee screens.

     ELEVEN INSTANCES OF SLIDE 11, ONE PER STEP. Slide 11 is a single phone
     whose steps are toggled by a body class — every step's content is already
     in its DOM, hidden — so there is no set of step elements to lay out. The
     only faithful way to show them side by side is to load the slide once per
     step and set that class. Nothing is re-drawn or re-exported: each cell is
     the real screen.

       step 0    the splash            step 6    photos
       step 1    place type  (no class, it is the default)
       step 1b   home type            step 7    name
       step 2    space type           step 8    describe
       step 3    address              step 8b   price
       step 4    guests
       step 5    amenities

     step 9 ("Just a few last questions") and step 10 (the listing preview) are
     both left out — the row ends on the price. Eleven cells, not thirteen.

     ?nomap=1 ON TEN OF THEM. Slide 11 builds a live Mapbox map at load, and
     eleven of those is eleven WebGL contexts — at the browser's cap, where
     they start getting dropped. Only the address cell asks for one.

     ONE ROW, EVENLY SPACED, NOTHING OVERLAPPING. Eleven screens: the intro,
     then the flow, ending on the price. The last two screens of slide 11 — the
     questions and the listing preview — are left out, so it lands on the money.

     THEY DEAL OUT FROM UNDER THE FIRST PHONE. Before the tap every cell but
     the first is parked exactly one slot to its left, which puts it behind the
     cell before it; earlier cells carry the higher z-index. The tap sends each
     one home, 90ms apart, so a phone slides out from BENEATH its neighbour
     rather than fading in over the top. Nothing uses opacity — a phone is
     hidden because another phone is in front of it.

     THE CELL IS CROPPED TO THE PHONE. Slide 11 sizes its phone at 80vh of its
     own viewport, so a cell showing the whole viewport carries 20% dead
     margin — and on two rows that waste is what decides the size. Each cell is
     therefore 800 of the 1000pt viewport tall, with the frame pulled up by the
     100pt above the phone. The 391.3 width is chosen so the phone spans the
     cell exactly: 800 x 900/1840 = 391.3.

     THE SCALE IS COMPUTED, NOT GUESSED. It is the smaller of what the width
     allows and what the height allows, so the row never overflows either way.
     CSS cannot divide a length by a length, so this cannot be a calc(); a
     ResizeObserver also fires when the deck un-parks the slide, which a
     load-time read would miss — it measures zero while parked.

     ONE BUILD, A LEAD-IN. The slide arrives showing only the first screen, at
     the size slide 11 gives its phone on its own — min(80vh, 1080px) — parked
     in the middle of the stage, its intro film playing once. The tap sends it
     to its place at the far left of the row, and the other ten deal out from
     under it, 90ms apart.

     THE FILM PLAYS ONCE. Slide 11's video carries a loop attribute; it is
     turned off on arrival, so the intro runs a single pass and holds its last
     frame. It does not loop, and it does not restart when the row opens. -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .slide { height: 100%; display: grid; place-items: center; }

  .row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--gap, 60px);
    /* THE DECK'S OWN PUSH, to the millisecond: index.html pushes a slide with
       DUR 520 on EASE cubic-bezier(0.16, 1, 0.3, 1). The row arrives the way a
       slide arrives, because that is what it is meant to read as. */
    transition: transform 520ms cubic-bezier(0.16, 1, 0.3, 1);
    will-change: transform;
  }
  .row.offstage { transform: translateX(100vw); }
  .cell {
    position: relative;
    flex: none;
    /* 391.3 x 800 of slide 11's viewport — the phone alone, not the 1000 the
       viewport is tall. The 100pt of margin above it is cropped out below. */
    width: calc(391.3px * var(--k, 0.3));
    height: calc(800px * var(--k, 0.3));
    overflow: hidden;
    transition: transform 820ms cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform;
  }
  /* Opacity is NOT transitioned. It flips in one frame, underneath the lead,
     and a fade would be visible through the 820ms the deal takes. */
  .cell.tucked { opacity: 0; }

  /* While the lead is out in the middle the rest are simply not there. They
     never travel on their own — the row brings all eleven in at once. */
  .cell.lead { z-index: 99; }

  .cell iframe {
    position: absolute; left: 0;
    top: calc(-100px * var(--k, 0.3));      /* lift the phone's top margin out */
    width: 391.3px; height: 1000px;
    border: 0; display: block;
    transform: scale(var(--k, 0.3));
    transform-origin: top left;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="row" id="row"></div>
  </div>
<script>
(() => {
  // step -> the body class slide 11 uses. Step 1 is the default and carries no
  // class at all, which is why one entry is empty rather than 'step1'.
  // Ends on the price screen. step9 ("a few last questions") and step10 ("check
  // out your listing") are both left out — the flow lands on the money.
  const STEPS = ['step0', '', 'step1b', 'step2', 'step3', 'step4', 'step5',
                 'step6', 'step7', 'step8', 'step8b'];
  const MAP_STEP = 'step3';                 // the only one that gets a real map
  // the slide-11 viewport each cell renders: 391.3 wide so the phone spans the
  // cell exactly (800 x 900/1840), 1000 tall of which the phone is the middle
  // 800 — the rest is cropped.
  const VW = 391.3, VH = 1000, PH = 800;

  const row = document.getElementById('row');
  // the deck's per-load stamp, passed down so a cell is never a stale copy
  const v = new URLSearchParams(location.search).get('v');

  function cellFor(cls) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const f = document.createElement('iframe');
    f.title = 'Host setup — ' + (cls || 'step 1');
    f.setAttribute('scrolling', 'no');
    f.src = '11.html?' + (cls === MAP_STEP ? '' : 'nomap=1&') + 'still=1' + (v ? '&v=' + v : '');
    f.addEventListener('load', () => {
      const d = f.contentDocument; if (!d) return;
      const set = () => { d.body.className = cls; };
      set();
      // Slide 11 runs its own opening beat on load, which would put every cell
      // back on step 1. Re-assert after it has had its go.
      setTimeout(set, 120); setTimeout(set, 600); setTimeout(set, 1400);
    });
    cell.appendChild(f);
    return cell;
  }

  const slide = document.querySelector('.slide');
  let K = 0;                               // the scale fit() last set

  // A PLAIN ROW, evenly spaced, nothing overlapping.
  const made = STEPS.map(cellFor);
  made.forEach((c, i) => { c.style.zIndex = STEPS.length - i; row.append(c); });

  let step = 0;
  const cells = made;
  const lead = made[0];

  function filmOf() {                      // the intro video inside the lead cell
    try { return lead.querySelector('iframe').contentDocument.getElementById('film'); }
    catch (_) { return null; }
  }

  function placeLead() {
    if (step !== 0 || !K) return;
    // Measure UNTRANSFORMED, or the offset compounds every time this runs —
    // and kill the transition first. Without that, `transform = 'none'` only
    // STARTS an 820ms journey towards none, and the rect read on the next line
    // is wherever the cell happens to be part-way through it. That read landed
    // the lead 122px left of the stage centre.
    const keep = lead.style.transition;
    lead.style.transition = 'none';
    lead.style.transform = 'none';
    void lead.offsetWidth;
    const s = slide.getBoundingClientRect(), c = lead.getBoundingClientRect();
    const full = Math.min(s.height * 0.8, 1080);        // slide 11's own phone height
    const S = full / (PH * K);
    const dx = (s.left + s.width / 2) - (c.left + c.width / 2);
    const dy = (s.top + s.height / 2) - (c.top + c.height / 2);
    lead.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + S + ')';
    void lead.offsetWidth;               // land it before the transition is back
    lead.style.transition = keep;
  }

  function setLead() {                     // beat 0
    step = 0;
    lead.classList.add('lead');
    lead.style.opacity = '';
    row.classList.remove('offstage');
    cells.forEach((c, i) => { if (i) c.classList.add('tucked'); });
    clearTimeout(dealT);
    // ONCE, THEN REST. Slide 11's film carries a loop attribute; it is turned
    // off here so the intro plays a single pass and holds its last frame.
    const f = filmOf(); if (f) { f.loop = false; f.currentTime = 0; f.play().catch(() => {}); }
    placeLead();
  }

  // TWO MOVES, NOT ELEVEN. The lead goes DOWN and OUT together: it shrinks
  // from the middle of the stage to the size the other phones are and fades
  // as it goes, so the splash leaves with the movement rather than sitting
  // there at full strength until it is cut. Then, a beat later, the whole row
  // is pushed in from the right in one piece — the deck's own 520ms push, on
  // the deck's own easing. Nothing staggers and nothing deals.
  const DOWN = 460, BEAT = 60;
  let dealT = 0;

  function openGrid() {                    // the tap
    step = 1;
    clearTimeout(dealT);
    lead.style.transition =
      'transform ' + DOWN + 'ms cubic-bezier(0.16, 1, 0.3, 1), ' +
      'opacity '   + DOWN + 'ms cubic-bezier(0.16, 1, 0.3, 1)';
    lead.style.transform = 'none';         // down to the size of the other ten
    lead.style.opacity = '0';              // and out, on the same curve
    dealT = setTimeout(showRow, DOWN + BEAT);
  }

  // Everything in place, off to the right, in a single frame — then released.
  function showRow() {
    const hold = (el, f) => {              // change it without animating it
      const t = el.style.transition;
      el.style.transition = 'none';
      f();
      void el.offsetWidth;
      el.style.transition = t === 'none' ? '' : t;
    };
    hold(row, () => {
      row.classList.add('offstage');
      lead.classList.remove('lead');
      cells.forEach(c => {
        c.style.transition = 'none';
        c.classList.remove('tucked');
        c.style.transform = 'none';
        c.style.opacity = '';
      });
      lead.style.transition = '';
    });
    cells.forEach(c => { c.style.transition = ''; });
    row.classList.remove('offstage');      // in from the right, all of it
  }

  const GAPC = 0.1;
  const fit = (w, h) => {
    if (!(w > 0 && h > 0)) return;
    const n = cells.length;
    const kW = (w * 0.94 / (n + GAPC * (n - 1))) / VW;
    const kH = (h * 0.84) / PH;
    K = Math.min(kW, kH);
    const cw = VW * K;
    row.style.setProperty('--k', K);
    row.style.setProperty('--gap', cw * GAPC + 'px');
    placeLead();
  };
  new ResizeObserver(([e]) => fit(e.contentRect.width, e.contentRect.height)).observe(slide);
  const r0 = slide.getBoundingClientRect(); fit(r0.width, r0.height);
  setLead();

  window.presoNext = () => {
    if (step) return false;                // out of builds — on to the fee screens
    openGrid();
    return true;
  };
  window.presoPrev = () => {
    if (!step) return false;               // on the lead — the deck goes back a slide
    setLead();
    return true;
  };
  window.presoState = () => step;
  // Landing on the beat from the hash gets the end state, not the deal.
  window.presoRestore = n => {
    if (!(n > 0)) return;
    step = 1;
    clearTimeout(dealT);
    lead.style.transform = 'none';
    lead.classList.remove('lead');
    lead.style.opacity = '';
    row.classList.remove('offstage');
    cells.forEach(c => { c.classList.remove('tucked'); c.style.transform = 'none'; });
  };
})();
</script>
</body>
</html>
