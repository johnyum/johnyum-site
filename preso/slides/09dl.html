<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09dl</title>
<!-- WHAT IT TAUGHT (John, 2026-10-02) — three lessons from the host-only fee, straight after the Reddit thread, before the airbnb.com one-price modal (09e). Set as the
     fee's own beats (09d01) are: IBM Plex Mono at 18, numbered, the number hanging; each lesson's lead in black, the why
     under it in the fee sums' grey. A first draft, to be refined. No build. -->
<style>
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../fonts/IBMPlexMono-Regular.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: block;
  }
  html, body { margin: 0; height: 100%; background: #fff; color: #111; overflow: hidden; }
  .slide { height: 100%; display: grid; place-items: center; padding: 0 48px; box-sizing: border-box; }
  /* AT 40, ONE AT A TIME (John, 2026-10-02): lesson 1 stands alone, centred; each tap opens the next one's room and it rises in, so
     the block is centred at every step — 1, then 1 and 2, then all three. A lesson not yet in takes no height and no gap (its width
     still counts, so the block never shifts sideways as they arrive). A long lesson breaks between its sentences, never inside one. */
  .copy { max-width: min(1500px, 100%);   /* the block is as wide as its longest lesson and centres on the page; a lesson too long for the line breaks between its sentences */ font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 40px; line-height: 1.5;   /* 60 on 40 (John, 2026-10-07: 1.3 was too tight) */ text-align: left; }
  .beats { margin: 0; padding: 0; list-style: none; counter-reset: beat; display: flex; flex-direction: column; }
  .beats li { counter-increment: beat; display: grid; grid-template-columns: 3ch 1fr; max-height: 3.9em; overflow: hidden;
    transition: max-height .55s cubic-bezier(.2,.8,.2,1), margin-top .55s cubic-bezier(.2,.8,.2,1), opacity .4s ease .12s, transform .55s cubic-bezier(.2,.8,.2,1) .06s; }
  .beats li + li { margin-top: 40px; }
  .beats li::before { content: counter(beat) "."; }
  .beats li.off { max-height: 0; margin-top: 0; opacity: 0; transform: translateY(16px); transition: max-height .45s cubic-bezier(.4,0,.2,1), margin-top .45s cubic-bezier(.4,0,.2,1), opacity .2s ease, transform .3s ease; }
  .beats .s { white-space: nowrap; }   /* a sentence stays on its line */
  body.snap .beats li { transition: none !important; }
  /* ONE LESSON (John, 2026-10-03): the three became one line, said as it stands — centred, on two lines broken by hand for the rag
     ("because" ends the first line, "your" gone — 28 over 19, a long line over a short, John, 2026-10-03) */
  .one { margin: 0; text-align: center; text-wrap: balance; }
</style>
</head>
<body>
  <div class="slide">
    <div class="copy">
      <p class="one">Be honest and own it because<br>users can smell BS.</p>
    </div>
  </div>
<script>
  window.presoNext = () => false;   // one line, no builds
  window.presoPrev = () => false;
  window.presoState = () => 0;
  window.presoRestore = () => {};
</script>
</body>
</html>
