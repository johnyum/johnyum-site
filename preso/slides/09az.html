<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09az</title>
<!-- TRANSPORTATION — the title card for the transportation work that follows, set as the fee case's card is. The fee and the
     calendar move to 2 and 3. "Transportation: What to do when the brief is wrong" (John, 2026-10-06) — it names the design
     problem the way the other two cards do (the fee's "What to do in a lose-lose situation", the calendar's "Simplifying
     Airbnb's most complex surface"): the brief was plane tickets, the spoiler card two taps on says so, and the trip creator is
     what he built past it. Before it: "having a dream and getting it crushed", "Designing the dream Airbnb cancelled" (the plot,
     not the problem), and "Going rogue…" (what he did, not the problem — John: it didn't fit the narrative like the others).
     "when&nbsp;the&nbsp;brief" is bound so the two lines break do / when the brief is wrong. -->
<style>
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../fonts/IBMPlexMono-Regular.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: block;
  }
  html, body { margin: 0; height: 100%; background: #fff; color: #111; overflow: hidden; }
  .slide { height: 100%; display: grid; place-items: center; }
  h1 {
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-weight: 400;
    font-size: 40px;
    line-height: 1.5;
    text-align: center;
    margin: 0;
    white-space: normal;
    max-width: 30ch; margin-left: auto; margin-right: auto; text-wrap: balance;   /* two even lines, broken where the sense allows — never at the colon or inside lose-lose (John, 2026-10-02) */
  }
  /* the secondary line under the title (John, 2026-10-02): 18pt mono in grey 700, centred under it */
  .card { text-align: center; }
  /* (John, 2026-10-02) the case number on its own line, 18pt grey 700, over the title at 40 on two lines */
  .eyebrow { margin: 0 0 12px; font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 18px; line-height: 1.4; color: #6A6A6A; }
</style>
</head>
<body>
  <div class="slide">
    <div class="card">
      <p class="eyebrow">Case Study 1</p>
      <h1>Transportation: When&nbsp;the&nbsp;brief is too small</h1>   <!-- was "What to do when the brief is wrong" — John, 2026-10-07: "is wrong". The case shows a brief (sell plane tickets) smaller than the opportunity, not an answer to a wrong one -->
    </div>
  </div>
</body>
</html>
