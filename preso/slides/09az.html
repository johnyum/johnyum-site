<!DOCTYPE html>

<title>09az</title>
<!-- TRANSPORTATION — the title card for the transportation work that follows, set as the fee case's card is. The fee and the
     calendar move to 2 and 3. "Transportation: Designing the dream Airbnb cancelled" (2026-10-06) — crafted from John's
     "having a dream and getting it crushed" to sit in the family with the other two cards: the fee's "lose-lose situation",
     the calendar's "Airbnb's most complex surface" — a gerund, Airbnb named, the fall in the flattest word for it. "the&nbsp;dream"
     is bound so the two lines break Designing / the dream Airbnb cancelled, never Designing the / dream.

     Case Study 1 · Host only fee, 32pt IBM Plex Mono, centred (John, 2026-10-01; it was 18pt
     "Host only fee" alone first) — set as 02's "I. Love.
     Design." is, small and quiet. It was Anton at Hello!'s size for an hour;
     before that Special Gothic Condensed at 12.2vh. No script. -->
<style>
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../fonts/IBMPlexMono-Regular.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: block;
  }
  html, body { margin: 0; height: 100%; background: #fff; color: #111; overflow: hidden; }
  .slide { height: 100%; display: grid; place-items: center; }
  h1 {
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-weight: 400;
    font-size: 40px;
    line-height: 1.4;
    text-align: center;
    margin: 0;
    white-space: normal;
    max-width: 30ch; margin-left: auto; margin-right: auto; text-wrap: balance;   /* two even lines, broken where the sense allows — never at the colon or inside lose-lose (John, 2026-10-02) */
  }
  /* the secondary line under the title (John, 2026-10-02): 18pt mono in grey 700, centred under it */
  .card { text-align: center; }
  /* (John, 2026-10-02) the case number on its own line, 18pt grey 700, over the title at 40 on two lines */
  .eyebrow { margin: 0 0 12px; font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 18px; line-height: 1.4; color: #6A6A6A; }
</style>
</head>
<body>
  <div class="slide">
    <div class="card">
      <p class="eyebrow">Case Study 1</p>
      <h1>Transportation: Designing the&nbsp;dream Airbnb cancelled</h1>
    </div>
  </div>
</body>
</html>
