<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12dr</title>
<!-- THE WEB CALENDAR (John, 2026-10-06) — after the Figma: his grab of the multi calendar web build, two weeks of October with the guests across the rows, shown
     whole with 16 rounded corners, fitted to the stage with the deck's own clearances (40 under the kicker, 40 above the nav).
     assets/process-multical.webp. No build. -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  .shot { flex: none; border-radius: 16px; overflow: hidden; border: 1px solid #e5e7eb; }
  .shot img { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
  <div class="stage"><div class="shot" id="shot"><img src="assets/process-multical.webp" alt="The multi calendar, two weeks of October"></div></div>
<script>
(() => {
  const W = 2000, H = 1250, shot = document.getElementById('shot');
  const band = () => {
    let top = 0, bottom = innerHeight;
    try { const pd = window.parent.document, k = pd.getElementById('kicker'), c = pd.getElementById('counter');
          if (k) top = k.getBoundingClientRect().bottom + 40; if (c) bottom = c.getBoundingClientRect().top - 40; } catch (_) {}
    return Math.max(200, bottom - top);
  };
  const fit = () => { const s = Math.min((innerWidth - 64) / W, band() / H) * .8; shot.style.width = Math.round(W * s) + 'px'; shot.style.height = Math.round(H * s) + 'px'; };
  fit(); addEventListener('resize', fit);
})();
</script>
</body>
</html>
