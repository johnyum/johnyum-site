<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12dq1</title>
<!-- THE SIDE STUDIES (John, 2026-10-06/07) — after the Figma, before the board: everything built on the side to work a question
     out — "different models, the deck, graph charts, iterations of quick actions" — on ONE page (assets/studies/all.html), rows
     and rows of the live pages, neatly by section: the calendar studies, the Repeat mock's five screens, the July prototype's
     review pages, the iOS walkthrough, the estimator tries, the Moby Dick layer tests, the EOB and the fee email, the Claude icons
     compare, and the option sheets. Every study is the page itself, scaled into its window and live. The slide is that one page in
     a window fitted to the stage (16 corners, the deck's clearances), scrolled with the wheel. Interactive (window.presoInteractive):
     the deck's taps keep to its 32px rails. No steps. Two earlier takes the same evening: a masonry wall of thumbnails (John: "not
     masonry — I wanna see that work"), then the seven calendar studies one to a tap (John: "put ALL the side things into one huge
     HTML file"). -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .win { position: absolute; border-radius: 16px; overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 24px 60px -24px rgba(0,0,0,.18); background: #fff; }
  .win iframe { display: block; border: 0; width: 100%; height: 100%; background: #fff; }
</style>
</head>
<body>
  <div class="win" id="win"><iframe src="assets/studies/all.html" title="The side studies" loading="eager"></iframe></div>
<script>
(() => {
  const win = document.getElementById('win');
  const band = () => {
    let top = 0, bottom = innerHeight;
    try { const pd = window.parent.document, k = pd.getElementById('kicker'), c = pd.getElementById('counter');
          if (k) top = k.getBoundingClientRect().bottom + 40; if (c) bottom = c.getBoundingClientRect().top - 40; } catch (_) {}
    return { top, h: Math.max(200, bottom - top) };
  };
  const fit = () => { const b = band(), w = innerWidth - 64; win.style.width = w + 'px'; win.style.height = b.h + 'px'; win.style.left = '32px'; win.style.top = Math.round(b.top) + 'px'; };
  fit(); addEventListener('resize', fit); new ResizeObserver(fit).observe(document.documentElement);   // the deck sizes its frames after they load, and not always with a resize event
  window.presoInteractive = true;   // the studies are worked with the pointer: the deck's taps keep to its rails
})();
</script>
</body>
</html>
