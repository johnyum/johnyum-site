<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12dq1</title>
<!-- THE EXPERIMENTS (John, 2026-10-06/07) — after the Figma, before the board: a collage of the side studies, live, on one board
     (assets/studies/collage.html): the calendar cell animations big on the left, replaying on a loop; to their right the fluid
     graph studies, the Repeat settings screens and the demand-driving event icons — the pieces themselves, pulled close, each page
     given a compact stylesheet on load. The slide is that board fitted to the stage within the deck's clearances — no border round it.
     Interactive (window.presoInteractive): the deck's taps keep to its 32px rails. No steps. Earlier takes the same two days, all
     rejected: a masonry wall of thumbnails ("not masonry — I wanna see that work"), the seven calendar studies one to a tap, then
     every side thing in rows by section (assets/studies/all.html, kept) — "a single page like a collage". -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .win { position: absolute; overflow: hidden; background: #fff; }   /* no border, no corners, no shadow (John, 2026-10-07): the board sits on the stage */
  .win iframe { display: block; border: 0; width: 100%; height: 100%; background: #fff; }
</style>
</head>
<body>
  <div class="win" id="win"><iframe src="assets/studies/collage.html" title="The experiments" loading="eager"></iframe></div>
<script>
(() => {
  const win = document.getElementById('win');
  const band = () => {
    let top = 0, bottom = innerHeight;
    try { const pd = window.parent.document, k = pd.getElementById('kicker'), c = pd.getElementById('counter');
          if (k) top = k.getBoundingClientRect().bottom + 40; if (c) bottom = c.getBoundingClientRect().top - 40; } catch (_) {}
    return { top, h: Math.max(200, bottom - top) };
  };
  // top-aligned under the kicker; the bottom runs under the deck's nav (John, 2026-10-07: "the bottom can bleed or go as long as the design is"), so the nav takes its pill
  const fit = () => { const b = band(), w = innerWidth - 64; win.style.width = w + 'px'; win.style.height = (innerHeight - b.top) + 'px'; win.style.left = '32px'; win.style.top = Math.round(b.top) + 'px'; };
  fit(); addEventListener('resize', fit); new ResizeObserver(fit).observe(document.documentElement);   // the deck sizes its frames after they load, and not always with a resize event
  window.presoInteractive = true;   // the studies are worked with the pointer: the deck's taps keep to its rails
  window.presoBleed = true;   // the board runs under the nav: it takes its pill
})();
</script>
</body>
</html>
