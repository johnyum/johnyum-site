<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09b</title>
<!-- BUSINESS TRAVEL — flight search on web and on the phone, straight after
     the Villa Mayana wall. One image, no build, held while the story is told.

     The export is used EXACTLY as given: alpha kept, nothing flattened,
     nothing cropped. It carries its own rounded corners and drop shadow, so
     any crop or white matte would clip them and any box-shadow here would sit
     under a shadow it already has.

     Landscape, so width leads and the height cap only guards a short window. -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .slide { height: 100%; display: grid; place-items: center; }
  .slide img {
    max-width: 92vw;
    max-height: 82vh;
    width: auto; height: auto;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }
</style>
</head>
<body>
  <div class="slide">
    <img src="assets/business-travel.webp" width="2000" height="1257"
         alt="Airbnb flight search: SFO to Tokyo roundtrip results on web, with the departing-flights list on iPhone alongside">
  </div>
</body>
</html>
