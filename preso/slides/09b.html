<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09b</title>
<!-- BUSINESS TRAVEL — flight search on web, with the departing-flights list on
     the phone beside it. Straight after the Villa Mayana wall.

     NO ANIMATION OF ITS OWN. The deck pushes it in from the right and off to
     the left, and that is the whole movement. Earlier passes had the two
     layers rise and fade, first with the phone lagging and then together; both
     were noise on top of a slide that is simply a picture being shown.

     STILL TWO LAYERS, NOT A COMPOSITE — and worth keeping that way. The
     flattened export could not be taken apart: the phone was baked into it,
     covering the web design's "Includes $150 Airbnb credit" and its Book
     button, so cutting the phone out left a phone-shaped hole.

     THE GEOMETRY IS MEASURED, NOT EYEBALLED. The composite John supplied
     (4668x2935) was diffed against the web export placed at the origin; the
     difference is exactly the phone, at (3605, 686). The phone's own artwork
     starts (11, 16) inside its 1075x2198 canvas, so the canvas sits at
     (3594, 670). Everything below is that, as a percentage of the 4668x2935
     stage, which is why the two land in John's composition at any size:

       web    left 0        top 0        width 94.687%   (4420 / 4668)
       phone  left 76.993%  top 22.828%  width 23.029%   (3594, 670, 1075)

     No script at all. Nothing to reveal means nothing that can fail to reveal —
     which, given how many ways a parked iframe breaks an entrance, is the
     point. -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .slide { height: 100%; display: grid; place-items: center; }

  /* The stage carries the composite's own aspect, so both layers can be placed
     in percentages and never need re-measuring at a different size. */
  .stage {
    position: relative;
    aspect-ratio: 4668 / 2935;
    width: min(92vw, calc(82vh * 4668 / 2935));
  }
  .stage img {
    position: absolute;
    display: block;
    height: auto;
    user-select: none;
    -webkit-user-drag: none;
  }
  .web   { left: 0;       top: 0;       width: 94.687%; }
  .phone { left: 76.993%; top: 22.828%; width: 23.029%; }
</style>
</head>
<body>
  <div class="slide">
    <div class="stage">
      <img class="web" src="assets/flights-web.webp" width="3200" height="2125"
           alt="Airbnb flight search on web: San Francisco to Tokyo, roundtrip results with a Japan Airlines itinerary expanded">
      <img class="phone" src="assets/flights-phone.webp" width="1075" height="2198"
           alt="The same search on iPhone: departing flights with fare details and a Select button">
    </div>
  </div>
</body>
</html>
