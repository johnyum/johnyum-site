<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09b</title>
<!-- BUSINESS TRAVEL — flight search on web, with the departing-flights list on
     the phone beside it. Straight after the Forbes piece.

     NO ANIMATION OF ITS OWN. The deck pushes it in from the right and off to
     the left, and that is the whole movement. Earlier passes had the two
     layers rise and fade, first with the phone lagging and then together; both
     were noise on top of a slide that is simply a picture being shown.

     STILL TWO LAYERS, NOT A COMPOSITE — and worth keeping that way. The
     flattened export could not be taken apart: the phone was baked into it,
     covering the web design's "Includes $150 Airbnb credit" and its Book
     button, so cutting the phone out left a phone-shaped hole.

     THE FRAME IS DRAWN HERE, NOT EXPORTED. The design arrives as bare artwork,
     so the browser round it is CSS: the 32px stroke and 112px radius measured
     off trip-creator.webp on the slide after this one, carried as fractions of
     the same --canvas so the two devices are the SAME SIZE on the stage and
     the same weight of line. Change one and change both.

       --canvas   min(92vw, 82vh x 1.59046)     the composition's own width
       device     0.91901 --canvas, 3106 : 2031 outer, 0.009468 stroke,
                  0.035 radius — every number 09c's

     THE CROP COMES OFF THE TOP. The Figma export is 5184x3351 and the
     device's screen is 3041 : 1965, so one row had to go; it came off the top,
     where the search bar has air above it, rather than the bottom, where the
     next result is already cut. Resampled to 2600 wide, which is still over 2x
     the device's ~1079 CSS px on a 1600-wide stage. object-position: bottom keeps that true if the
     artwork is ever re-exported at a different height.

     THE PHONE SITS ON THE BOTTOM OF THE STROKE. Its across-and-wide numbers
     come from John's original composite (4668x2935), which put the phone at
     3594 across at 1075 wide — fractions OF THE BIG DESIGN rather than of the
     stage, so the pair holds its relationship now the design is the trip
     creator's size rather than the export's.

     THE ASSET IS CROPPED TO THE PHONE, which is what makes `bottom: 0` true.
     The export was a 1075x2198 canvas with the phone drawn at (11, 16) inside
     it and 18 transparent rows under it, so aligning the IMAGE's bottom edge
     left the phone itself hanging short of the stroke — about 4px on a
     1600-wide stage, enough to read as a mistake rather than a join. The file
     is now its own ink, 1053x2164, and the two percentages above are the old
     ones re-based on it (24.322 x 1053/1075, and the left shifted by the 11
     columns that went). Same phone, same size, same place; the edge now means
     the edge.

     Its vertical is `bottom: 0`, not a percentage down. The two bottom edges
     are meant to be flush, and a percentage only lands that at one aspect: the
     phone's height is set by its own ratio off a width that is a fraction of
     the design's width, while the top it would be measured from moves with the
     design's height.

     No script at all. Nothing to reveal means nothing that can fail to reveal —
     which, given how many ways a parked iframe breaks an entrance, is the
     point. -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .slide { height: 100%; display: grid; place-items: center; }

  /* The stage IS the device's outer box, so the phone can be placed against
     the big design directly and the two slides measure the same. */
  .stage {
    --canvas: min(92vw, calc(82vh * 1.59046));
    position: relative;
    width: calc(var(--canvas) * 0.91901);
    aspect-ratio: 3106 / 2031;
  }

  /* 09c's device, number for number. */
  .device {
    position: absolute; inset: 0;
    box-sizing: border-box;
    border: calc(var(--canvas) * 0.009468) solid #000;   /* the 32px stroke */
    border-radius: calc(var(--canvas) * 0.035);          /* the 112px radius */
    overflow: hidden;
    background: #fff;
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, 0.02),
      0 4px 8px rgba(0, 0, 0, 0.08),
      0 12px 30px rgba(0, 0, 0, 0.18);
  }
  .device img {
    display: block;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: bottom;        /* anything over height comes off the TOP */
  }

  .phone {
    position: absolute;
    left: 81.5619%; bottom: 0; width: 23.8242%;
    height: auto;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="stage">
      <div class="device">
        <img src="assets/flights-web.webp" width="2600" height="1680"
             alt="Airbnb flight search on web: San Francisco to Tokyo, roundtrip, with a Japan Airlines itinerary expanded through Honolulu">
      </div>
      <img class="phone" src="assets/flights-phone.webp" width="1053" height="2164"
           alt="The same search on iPhone: departing flights with fare details and a Select button">
    </div>
  </div>
</body>
</html>
