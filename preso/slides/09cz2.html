<!-- WHAT IT WOULD HAVE BECOME (John, 2026-10-07) — the last card of the transportation case, straight after the AI build (09cz1),
     before the fee case's card. Not a lesson, as the other two cases end on: a what-if, and sad. John's point of view: transportation
     had a chance to fundamentally change how we search for where to go, before AI was a thing; given the chance they'd have kept
     pushing, and with AI built something truly inventive. The line keeps the claim on the problem, not on him — "a shot", "we" — and
     the last line is what keeps it humble: unfinished, and his to carry. The middle line was "Before AI." and came out (John,
     2026-10-07: "I wasn't early. I built the AI version after AI came out") — it read as foresight; "Then AI arrived." is only the
     sequence, and the build just shown says the rest. Then John cut it to the one line (2026-10-07: "I just want the same line") — the
     build has just said the rest. Set as the COVID card is: IBM Plex Mono at 40 on 60, centred, one line, 44. No build. -->
