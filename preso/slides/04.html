<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>04</title>
<!-- Nike running posters, street mockup — FULL SIZE: covers the whole
     viewport edge to edge (object-fit: cover; crops to fill, never letterboxes). -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }
</style>
</head>
<body>
  <img src="assets/nike-posters.webp" alt="Nike running posters — Slow Down For What?, Short Shorts Long Strides, Mo Miles Mo Medals — pasted on a boarded-up storefront">
</body>
</html>
