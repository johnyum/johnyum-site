<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09b00</title>
<!-- TRANSPORTATION — the title card for the flights and Explore work that follows.

     THE EXPLAINER SIZE, the same as Luxe (090), Host Setup (09f0) and Host
     Calendar (12): Special Gothic Condensed One at clamp(16px, 6.1vh, 62px),
     the face and clamp 10c set its copy in. All four chapter titles read the
     same, which is the point — they name the thing and get out of the way.
     Height-driven, so a title holds its proportion against the stage rather
     than the window's width and a two-word one needs no sizing argument of
     its own.

     EVERY PROJECT OPENS THE SAME WAY NOW. The card first, then whatever the
     project opens on — here, the Forbes piece. The two with an artefact to open
     on used to go straight to it, which made them look like a continuation of
     the project before rather than the start of a new one.

     No script, nothing to reveal. The deck pushes it in from the right. -->
<style>
  @font-face {
    font-family: "Special Gothic Condensed One";
    src: url("../fonts/SpecialGothicCondensedOne.woff2") format("woff2");
    font-weight: 400;
    font-display: block;
  }
  html, body {
    margin: 0; height: 100%;
    background: #fff; color: #111;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .slide { height: 100%; display: grid; place-items: center; }
  .pm { text-align: center; }
  h1 {
    margin: 0;
    font-family: "Special Gothic Condensed One", "Helvetica Neue", sans-serif;
    font-weight: 400;
    font-size: clamp(16px, 6.1vh, 62px);   /* 10c's copy, exactly */
    line-height: 1.06;
    letter-spacing: -0.01em;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="pm">
      <h1>Transportation</h1>
    </div>
  </div>
</body>
</html>
