<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09d0</title>
<!-- WHAT IT LOOKED LIKE FROM THE OUTSIDE. A wall of tweets about the cleaning fee, straight before the host-only fee
     screens, packed past every edge of the stage and cropped by it — a wall that carries on beyond the frame. The
     screens that follow are the answer; this is the thing being answered, in strangers' words.

     THEY ARE REAL EMBEDS, NOT PICTURES OF TWEETS. Each is X's own card,
     rendered by X from the tweet id. That matters beyond fidelity: these are
     real people saying real things under their own names, and a hand-built
     look-alike carrying someone's handle and like count is a fabricated
     record, however carefully it is copied. If X will not serve one, it does
     not appear — which is the correct failure.

     THE PICTURES STAY. data-cards="hidden" was set to keep the cards short,
     and it broke the best one: @luinalaska's is "$1,300 for two nights with a
     cleaning fee and I get this before 9:00 am", and THIS is the photograph
     the card was hiding — the tweet is a caption without it. Anything whose
     joke is the attachment has to carry the attachment. data-conversation
     stays off: that only drops the tweet being replied to, which is context
     nobody needs here, and it is never the punchline.

     IT NEEDS THE NETWORK, and the venue may not give it. So there is a
     fallback, and it is the slide this replaced: John's own capture of the
     $3,245 tweet, which is a file on this server and cannot fail. If nothing
     has rendered after FALLBACK ms, the wall is dropped and the picture is
     shown instead. A slide that quietly shows one real tweet is a slide; one
     showing twelve empty boxes is a fault everybody in the room can see.

     THE WALL IS PACKED AND SCALED IN JS. The embeds decide their own heights, so nothing is known until they render;
     a ResizeObserver on every card re-packs as each one lands — and a load-time read would measure zero while the
     deck has the slide parked.

     No builds. The deck pushes it in from the right and off to the left. -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .slide { height: 100%; display: grid; place-items: center; }

  /* THE WALL OVERFILLS THE STAGE (John, 2026-09-30: "fill the entire screen … it can spill over and crop out. that's
     actually what I want"). The cards are packed into columns by JS, each column centred on the stage's middle line, and
     the whole wall scaled until every column runs past the top and the bottom and the outer columns past the sides. */
  .wall {
    position: absolute; left: 50%; top: 50%; width: 0; height: 0;
    transform: scale(var(--s, 1)); transform-origin: 0 0;
  }
  .wall .t { position: absolute; left: 0; top: 0; width: 330px; margin: 0; }
  /* X sets its own margins on the rendered iframe; these put it back. */
  .wall .twitter-tweet { margin: 0 !important; }
  .fit { position: absolute; inset: 0; overflow: hidden; }

  /* the fallback — the slide this replaced */
  .shot { display: none; }
  .fell .wall { display: none; }
  .fell .shot { display: block; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
  .shot img {
    display: block;
    width: min(980px, 88vw, calc(84vh * 700 / 532));
    height: auto;
    border-radius: 12px;
    user-select: none;
    -webkit-user-drag: none;
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, 0.02),
      0 4px 8px rgba(0, 0, 0, 0.08),
      0 12px 30px rgba(0, 0, 0, 0.18);
  }
</style>
</head>
<body>
  <div class="slide" id="slide">
    <div class="fit" id="fit">
      <div class="wall" id="wall"></div>
      <div class="shot">
        <img src="assets/cleaning-fee-tweet.webp" width="700" height="532"
             alt="A tweet: Airbnb be like, $120 a night, $3,245 total, cleaning fee $1,600 — but please be sure to dust, vacuum, take out garbage, wash linens, steam clean carpet, apply fresh paint and install new appliances">
      </div>
    </div>
  </div>
<script>
(() => {
  // Twelve of the twenty John collected — the ones about the PRICE rather than about Airbnb generally, spread across
  // six years so the wall reads as a long-running complaint and not one bad week. It went from a wall of twelve to a row
  // of five (one row is what anybody reads standing up), and back to a wall, this time one that overfills the screen:
  // the point now is the sheer amount of it, not any one sentence.
  //
  // platform.twitter.com does not resolve from where this was built, so they were picked on John's own like counts
  // rather than by anybody having read them here.
  // ALL TWELVE (John, 2026-09-30: "add as many as you can"). Everything on hand that is about the fee: the five, the
  // bench, and the two outlets — Morning Brew and More Perfect Union — that were held back for not being customers; a
  // wall that has to fill the screen wants the volume more than it wants that line. @chasedownleads and the Babylon Bee
  // stay out: John cut those. Ordered so one handle never sits next to itself.
  const TWEETS = [
    '1801431302652235780',   // @luinalaska      ~93K
    '2084133602967658692',   // @omgsidewalks    ~68K
    '2072319333448204349',   // @OrevaZSN        ~38K
    '2082277812841685193',   // @amelia_tweetz   ~25K
    '1469015392483872772',   // @Cokedupoptions  ~6.2K
    '1801634945992904788',   // @itsBillyGtho
    '1337059225936277504',   // @MorningBrew
    '2103023560490885318',   // @AbakpaJob
    '1625849400714223619',   // @buccocapital
    '2078940466469359691',   // @OrevaZSN
    '1691130465648889887',   // @MorePerfectUS
    '1708512064220893293'    // @rohindhar
  ];
  const FALLBACK = 6000;     // nothing rendered by now -> show the capture

  const slide = document.getElementById('slide');
  const fit = document.getElementById('fit');
  const wall = document.getElementById('wall');

  // SMALLER, AND MORE OF THEM (John, 2026-09-30: "too big. I need them smaller and more"). Twelve real tweets cannot
  // fill a screen at a size that reads as a crowd, so the twelve come round again — each pass rotated by five so no
  // tweet lands beside its own copy — as many passes as the screen needs. Repeating a real embed is still a real
  // embed: nothing here is made up, there is just more of it.
  let passes = 0;
  function addPass() {
    const made = [];
    TWEETS.forEach((_, i) => {
      const id = TWEETS[(i + passes * 5) % TWEETS.length];
      const d = document.createElement('div');
      d.className = 't';
      d.innerHTML =
        '<blockquote class="twitter-tweet" data-dnt="true" ' +
        'data-conversation="none" data-width="330">' +
        '<a href="https://twitter.com/i/status/' + id + '"></a></blockquote>';
      wall.appendChild(d); made.push(d);
    });
    passes++;
    return made;
  }
  addPass(); addPass(); addPass(); addPass();   // four: a 1080 stage takes about 38 at this size

  const s = document.createElement('script');
  s.async = true;
  s.src = 'https://platform.twitter.com/widgets.js';
  s.charset = 'utf-8';
  document.head.appendChild(s);

  // THE FIT. The size is FIXED — a tweet 0.72 of its own 330 on a 1080-tall stage, scaling with the stage's height —
  // and the wall is built out to it: enough columns to run past both sides, and cards dealt one by one into the
  // shortest column until every column runs past the top and the bottom. Cards that are not needed are put away; if
  // the passes run out first, another is added. Each column is centred on the middle line on its own, so the tops and
  // bottoms crop unevenly, like a wall that carries on. A card whose embed never filled (under 40 tall) is skipped.
  const COL = 330, GAP = 20, OVER = 1.08, SIZE = 0.72, MAX_PASSES = 6;
  function refit() {
    if (slide.classList.contains('fell')) return;   // the wall is gone; leave the box alone
    const w = slide.clientWidth, h = slide.clientHeight;
    if (!(w > 0 && h > 0)) return;
    const k = SIZE * h / 1080;
    const n = Math.ceil((w * OVER / k + GAP) / (COL + GAP));
    const need = h * OVER / k;
    const ww = n * COL + (n - 1) * GAP;
    const cols = Array.from({ length: n }, () => ({ h: -GAP, items: [] }));
    let short = true;
    [...wall.children].forEach(c => {
      const ch = c.offsetHeight;
      const col = cols.reduce((a, b) => (b.h < a.h ? b : a));
      if (ch < 40 || col.h >= need) { c.style.visibility = 'hidden'; c.style.transform = 'translate(-99999px,0)'; return; }
      c.style.visibility = '';
      col.items.push([c, col.h + GAP]); col.h += GAP + ch;
    });
    short = cols.some(c => c.h < need);
    cols.forEach((col, j) => col.items.forEach(([c, y]) => {
      c.style.transform = 'translate(' + (j * (COL + GAP) - ww / 2) + 'px,' + (y - col.h / 2) + 'px)';
    }));
    wall.style.setProperty('--s', k.toFixed(4));
    // out of cards with a gap still showing — but only once the embeds have had their chance to render
    if (short && rendered() && passes < MAX_PASSES) {
      const made = addPass(); made.forEach(c => ro.observe(c));
      try { window.twttr.widgets.load(wall); } catch (_) {}
    }
  }
  const rendered = () => [...wall.querySelectorAll('iframe')].filter(f => f.offsetHeight > 40).length >= TWEETS.length;
  new ResizeObserver(refit).observe(slide);
  const ro = new ResizeObserver(refit);
  const watch = () => [...wall.children].forEach(c => ro.observe(c));
  watch();
  refit();

  // DID ANYTHING ACTUALLY RENDER? X replaces each blockquote with an iframe;
  // an iframe it could not fill is left at zero height, which is exactly what
  // a blocked network looks like. Height, not presence, is the test.
  setTimeout(() => {
    const up = [...wall.querySelectorAll('iframe')]
      .filter(f => f.getBoundingClientRect().height > 40).length;
    if (!up) {
      slide.classList.add('fell');
      return;
    }
    refit();
  }, FALLBACK);

  window.presoNext = () => false;             // no builds
  window.presoPrev = () => false;
  window.presoState = () => 0;
  window.presoRestore = () => {};
})();
</script>
</body>
</html>
