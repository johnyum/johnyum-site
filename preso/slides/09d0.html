<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09d0</title>
<!-- WHAT IT LOOKED LIKE FROM THE OUTSIDE. One tweet, on its own, straight
     before the host-only fee screens: $120 a night, $3,245 total, $1,600 of it
     cleaning — and a chore list on top of that. 4.8K likes.

     IT IS HERE TO DO THE ARGUING. The four fee screens that follow are the
     answer; this is the thing being answered, in a stranger's words rather
     than a bullet on a problem slide. It earns its own screen because it is
     read, not glanced at — the joke is in the last four lines.

     THE SOURCE IS 700x532 AND IS NOT UPSCALED PAST WHAT IT CAN CARRY. Capped
     at 980 wide, about 1.4x, where the type still holds; pushed to fill the
     stage it goes soft and the small print under the punchline is what breaks
     first. The white around it is the slide, not a shortfall.

     Left exactly as captured — the handle, the timestamp and the like count
     included. It is a quotation, so it keeps its attribution.

     NO ANIMATION OF ITS OWN. The deck pushes it in from the right and off to
     the left, as it does 09b, 09b0 and 09d. No script: nothing to reveal means
     nothing that can fail to reveal. -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .slide { height: 100%; display: grid; place-items: center; }

  .frame {
    position: relative;
    display: block;
    line-height: 0;                  /* no descender gap under the image */
    border-radius: 12px;
    overflow: hidden;                /* clips the image to the radius */
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, 0.02),
      0 4px 8px rgba(0, 0, 0, 0.08),
      0 12px 30px rgba(0, 0, 0, 0.18);
  }
  img {
    display: block;
    width: min(980px, 88vw, calc(84vh * 700 / 532));
    height: auto;
    user-select: none;
    -webkit-user-drag: none;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="frame">
      <img src="assets/cleaning-fee-tweet.webp" width="700" height="532"
           alt="A tweet: Airbnb be like, $120 a night, $3,245 total, cleaning fee $1,600 — but please be sure to dust, vacuum, take out garbage, wash linens, steam clean carpet, apply fresh paint and install new appliances">
    </div>
  </div>
</body>
</html>
