<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09d0</title>
<!-- WHAT IT LOOKED LIKE FROM THE OUTSIDE. A wall of tweets about the cleaning fee, straight before the host-only fee
     screens, packed past every edge of the stage and cropped by it — a wall that carries on beyond the frame. The
     screens that follow are the answer; this is the thing being answered, in strangers' words.

     ONE FIXED WALL, HARD-CODED (John, 2026-10-01: "just hard code one good collection of tweets"). It was twelve live
     X embeds, dealt round again in rotated passes until the screen was full and re-packed by a ResizeObserver every
     time one finished rendering — so the same tweet turned up twice on one screen, and the wall jittered as it built.

     Now each of the twelve is X's OWN render of the real tweet, captured once at 2x from the embed (headless Chrome
     at data-width 330, the card clipped to its iframe) into assets/tweets/<id>.webp. Nothing is retyped or rebuilt:
     these are the cards X drew, the way 09d1's thread is Reddit's own screenshots. No network, no script from X,
     nothing that lands late.

     TWELVE, ONCE EACH, IN FIVE COLUMNS — the split that keeps the shortest column longest (841 of 330-wide units; the
     tallest 990), @luinalaska in the middle, the two @OrevaZSN never side by side. Each column is centred on the
     middle line on its own, so the tops and bottoms crop unevenly, like a wall that carries on.

     THE SCALE IS THE ONLY THING COMPUTED: the larger of what makes the SHORTEST column run past the top and bottom
     and what makes the wall run past both sides — so nothing ever repeats to fill a gap; a wider or shorter stage
     just sees the same twelve a little larger. To change the collection, re-capture and re-balance (the numbers
     above are the cards' own heights at 330).

     No builds. The deck pushes it in from the right and off to the left. -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .slide { position: relative; height: 100%; overflow: hidden; }
  .wall {
    position: absolute; left: 50%; top: 50%; width: 0; height: 0;
    transform: scale(var(--s, 1)); transform-origin: 0 0;
  }
  .wall img { position: absolute; display: block; user-select: none; -webkit-user-drag: none; }
</style>
</head>
<body>
  <div class="slide" id="slide">
    <div class="wall" id="wall">
      <img src="assets/tweets/1691130465648889887.webp" width="330" height="594" style="left:-865px;top:-468.5px" alt="Tweet by @MorePerfectUS">
      <img src="assets/tweets/2078940466469359691.webp" width="330" height="323" style="left:-865px;top:145.5px" alt="Tweet by @OrevaZSN">
      <img src="assets/tweets/1801634945992904788.webp" width="330" height="460" style="left:-515px;top:-420.5px" alt="Tweet by @itsBillyGtho">
      <img src="assets/tweets/1708512064220893293.webp" width="330" height="361" style="left:-515px;top:59.5px" alt="Tweet by @rohindhar">
      <img src="assets/tweets/1801431302652235780.webp" width="330" height="441" style="left:-165px;top:-475.5px" alt="Tweet by @luinalaska">
      <img src="assets/tweets/2084133602967658692.webp" width="330" height="490" style="left:-165px;top:-14.5px" alt="Tweet by @omgsidewalks">
      <img src="assets/tweets/2072319333448204349.webp" width="330" height="342" style="left:185px;top:-466.5px" alt="Tweet by @OrevaZSN">
      <img src="assets/tweets/1625849400714223619.webp" width="330" height="266" style="left:185px;top:-104.5px" alt="Tweet by @buccocapital">
      <img src="assets/tweets/2103023560490885318.webp" width="330" height="285" style="left:185px;top:181.5px" alt="Tweet by @AbakpaJob">
      <img src="assets/tweets/2082277812841685193.webp" width="330" height="380" style="left:535px;top:-495px" alt="Tweet by @amelia_tweetz">
      <img src="assets/tweets/1469015392483872772.webp" width="330" height="247" style="left:535px;top:-95px" alt="Tweet by @Cokedupoptions">
      <img src="assets/tweets/1337059225936277504.webp" width="330" height="323" style="left:535px;top:172px" alt="Tweet by @MorningBrew">
    </div>
  </div>
<script>
(() => {
  const WALL_W = 1730, SHORTEST = 841, OVER = 1.04;
  const slide = document.getElementById('slide');
  const wall = document.getElementById('wall');
  const fit = () => {
    const w = slide.clientWidth, h = slide.clientHeight;
    if (!(w > 0 && h > 0)) return;
    wall.style.setProperty('--s', Math.max(h * OVER / SHORTEST, w * OVER / WALL_W).toFixed(4));
  };
  new ResizeObserver(fit).observe(slide);
  fit();

  window.presoNext = () => false;             // no builds
  window.presoPrev = () => false;
  window.presoState = () => 0;
  window.presoRestore = () => {};
})();
</script>
</body>
</html>
