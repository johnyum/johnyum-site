<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09d0</title>
<!-- WHAT IT LOOKED LIKE FROM THE OUTSIDE. A wall of tweets about the cleaning fee, straight before the host-only fee
     screens, packed past every edge of the stage and cropped by it — a wall that carries on beyond the frame. The
     screens that follow are the answer; this is the thing being answered, in strangers' words.

     ONE FIXED WALL, HARD-CODED (John, 2026-10-01: "just hard code one good collection of tweets"). It was twelve live
     X embeds, dealt round again in rotated passes until the screen was full and re-packed by a ResizeObserver every
     time one finished rendering — so the same tweet turned up twice on one screen, and the wall jittered as it built.

     Now each of the twelve is X's OWN render of the real tweet, captured once at 2x from the embed (headless Chrome
     at data-width 330, the card clipped to its iframe) into assets/tweets/<id>.webp. Nothing is retyped or rebuilt:
     these are the cards X drew, the way 09d1's thread is Reddit's own screenshots. No network, no script from X,
     nothing that lands late.

     AT THE SIZE IT HAD (a tweet at its own 330 on a 1080 stage), so a screen takes more than twelve and some come
     round again — never in the same column or the one beside it. Laid out once, when the slide opens, from the
     cards' known heights: no re-pack, no movement. (For an hour it was the twelve once each in five columns, scaled
     up to cover the stage; too cropped in, John said.)

     No builds. The deck pushes it in from the right and off to the left. -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .slide { position: relative; height: 100%; overflow: hidden; }
  .wall {
    position: absolute; left: 50%; top: 50%; width: 0; height: 0;
    transform: scale(var(--s, 1)); transform-origin: 0 0;
  }
  /* THE MOOD (John, 2026-10-02): one tap and every face on the wall turns angry — 😡 over each tweet's avatar, at its size
     (see MEASURED below), popping on in a quick ripple across the wall */
  /* MEASURED (2026-10-02): every avatar is a 45.8 circle centred at 39,35 on its card; Apple's 😡 fills its own box but sits
     3.75% of its size high in it. So the face is 50 — over the round avatars entirely, the square ones may show at their
     corners — and dropped 2.5 and nudged 0.5 right — measured off the glyph's own ink (it sits 2.5 high and 0.5 left in its 50 box) — so
     each lands dead centre on its avatar (2026-10-03) */
  .wall .face { position: absolute; width: 54px; height: 54px; display: grid; place-items: center; z-index: 2; pointer-events: none;
                font: 54px/1 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
                opacity: 0; transform: scale(.3); transition: opacity .2s ease, transform .45s cubic-bezier(.34, 1.56, .64, 1); }
  body.mad .wall .face { opacity: 1; transform: none; transition-delay: var(--d, 0ms); }
  body.snap .wall .face { transition: none !important; }
  /* 4 BIGGER, AND ONLY WHOLE (John, 2026-10-03): the faces are 54 now (the offsets below scale with them), and a face whose
     avatar would be cut by the stage's edge — or sit under the deck's section names along the foot — is not drawn at all */
  .wall .face.cut { display: none; }
  .wall img { position: absolute; display: block; user-select: none; -webkit-user-drag: none; }
  /* ONE, THEN ALL (John, 2026-10-03): the slide opens on aaron's tweet alone, in the middle; a tap brings the rest of the wall
     in around it, rippling out from the centre — each card rising a little as it fades in, in order of its distance from him */
  .wall .rest { opacity: 0; transform: translateY(24px) scale(.96); transition: opacity .45s ease, transform .6s cubic-bezier(.2,.8,.2,1); }
  body.all .wall .rest { opacity: 1; transform: none; transition-delay: var(--r, 0ms); }
  body.snap .wall .rest { transition: none !important; }
  /* aaron's tweet opens 50% bigger, alone; as the rest come in it settles back to the wall's size, on its own centre */
  .wall .centre { transform: scale(1.5); transform-origin: 50% 50%; transition: transform .7s cubic-bezier(.3,0,.15,1); }
  body.all .wall .centre { transform: none; }
  body.snap .wall .centre { transition: none !important; }
</style>
</head>
<body>
  <div class="slide" id="slide">
    <div class="wall" id="wall"></div>
  </div>
<script>
(() => {
  // [id, height at 330 wide, handle] — X's own renders, captured once; the order is the strongest first, the one the
  // layout reaches for when everything else is equal.
  const TWEETS = [
    ['1394991663894908931', 285, 'camjordan94'],    // added, and first so it lands whole (John, 2026-10-03), captured the same way: X's embed at 330, Chrome at 4x
    ['1801431302652235780', 441, 'luinalaska'],
    ['2084133602967658692', 490, 'omgsidewalks'],
    ['2072319333448204349', 342, 'OrevaZSN'],
    ['2082277812841685193', 380, 'amelia_tweetz'],
    ['1469015392483872772', 247, 'Cokedupoptions'],
    ['1767906208726335955', 228, 'stockxsucks'],    // added with Cam Jordan's (John, 2026-10-03)
    ['1801634945992904788', 460, 'itsBillyGtho'],
    ['1337059225936277504', 323, 'MorningBrew'],
    ['2103023560490885318', 285, 'AbakpaJob'],
    ['1625849400714223619', 266, 'buccocapital'],
    ['2078940466469359691', 323, 'OrevaZSN'],
    ['1691130465648889887', 594, 'MorePerfectUS'],
    ['1708512064220893293', 361, 'rohindhar']
  ];
  // THE SIZE IS THE ONE JOHN LIKED (John, 2026-10-01: "too cropped in … what you had before was perfect"): a tweet at
  // its own 330 on a 1080-tall stage, scaling with the stage's height, the wall run past every edge.
  const COL = 330, GAP = 20, OVER = 1.08;
  // a tweet with a video in it is never shown twice — the same film playing in two places gives the repeat away
  const ONCE = new Set(['1691130465648889887', '1767906208726335955']);   // More Perfect Union's video; aaron's, the centre
  const slide = document.getElementById('slide');
  const wall = document.getElementById('wall');

  // THE LAYOUT IS WORKED OUT ONCE, NOT GROWN. The heights are known, so the wall is laid out in one go — nothing
  // renders late, nothing re-packs, nothing moves after it is drawn. Columns are filled left to right, top to bottom,
  // the shortest column first. A screen this size wants more than twelve, so some come round again, but never
  // beside themselves: a tweet already in this column or either neighbour is not a candidate, and among the rest
  // the one used least — then the one furthest from where it last appeared — goes next.
  // AARON'S IN THE MIDDLE (John, 2026-10-03: "put aaron's tweet smack in the middle and build all the tweets around that
  // tweet"). The wall takes an odd number of columns so one stands on the centre line; aaron's tweet is centred in it, on
  // the stage's centre, and that column grows up and down from it as two halves while the others fill as before.
  const CENTRE = '1767906208726335955';
  let laidFor = '';
  function layout(w, h) {
    const k = h / 1080;
    let n = Math.ceil((w * OVER / k + GAP) / (COL + GAP)); if (n % 2 === 0) n += 1;
    const mid = (n - 1) / 2;
    const need = h * OVER / k;
    const key = n + 'x' + Math.ceil(need / 50);
    wall.style.setProperty('--s', k.toFixed(4));
    if (key === laidFor) return;                          // same columns, same reach: the wall stands as it is
    laidFor = key;
    const centre = TWEETS.find(([id]) => id === CENTRE);
    // a column per index, but the middle one is two halves — up from aaron and down from him — each to half the reach
    const cols = Array.from({ length: n }, (_, j) => j === mid ? null : ({ j, h: -GAP, items: [], reach: need }));
    const up = { j: mid, h: centre[1] / 2, items: [], reach: need / 2, dir: -1 }, down = { j: mid, h: centre[1] / 2, items: [], reach: need / 2, dir: 1 };
    const lanes = [...cols.filter(Boolean), up, down];
    const used = new Map([[CENTRE, [mid]]]);             // id -> [columns it is in]
    for (let guard = 0; guard < 200; guard++) {
      const open = lanes.filter(c => c.h < c.reach);
      if (!open.length) break;
      const col = open.reduce((a, b) => (b.h / b.reach < a.h / a.reach ? b : a)), j = col.j;
      const fresh = TWEETS.filter(([id]) => !(ONCE.has(id) && used.has(id)));   // a video, or aaron, is seen once
      const ok = fresh.filter(([id]) => !(used.get(id) || []).some(c => Math.abs(c - j) <= 1));
      const pool = ok.length ? ok : fresh;
      const pick = pool.reduce((best, t) => {
        const ub = (used.get(best[0]) || []), ut = (used.get(t[0]) || []);
        if (ut.length !== ub.length) return ut.length < ub.length ? t : best;
        const fb = Math.min(99, ...ub.map(c => Math.abs(c - j))), ft = Math.min(99, ...ut.map(c => Math.abs(c - j)));
        return ft > fb ? t : best;
      });
      used.set(pick[0], [...(used.get(pick[0]) || []), j]);
      col.items.push([pick, col.h + GAP]); col.h += GAP + pick[1];
    }
    const ww = n * COL + (n - 1) * GAP;
    const html = [];
    const put = ([id, ht, hd], x, top, isCentre) => {
      const dist = Math.hypot(x + COL / 2, top + ht / 2);                          // from the stage's centre, where aaron is
      html.push(`<img src="assets/tweets/${id}.webp" width="330" height="${ht}" alt="Tweet by @${hd}" ` +
                `class="${isCentre ? 'centre' : 'rest'}" style="left:${x}px;top:${top}px;--r:${Math.round(dist * 0.42)}ms">`);
      html.push(`<span class="face" aria-hidden="true" style="left:${x + 38.9 - 26.5}px;top:${top + 34.9 - 27 + 2.7}px;--d:${Math.round(Math.random() * 380)}ms">&#x1F621;</span>`);
    };
    cols.forEach((col, j) => { if (!col) return; const x = j * (COL + GAP) - ww / 2; col.items.forEach(([t, y]) => put(t, x, y - col.h / 2)); });
    const xm = mid * (COL + GAP) - ww / 2;
    put(centre, xm, -centre[1] / 2, true);                                      // on the stage's centre
    down.items.forEach(([t, y]) => put(t, xm, y));                              // y runs down from aaron's foot
    up.items.forEach(([t, y]) => put(t, xm, -y - t[1]));                        // ...and up from his head
    wall.innerHTML = html.join('');
  }
  // a face is drawn only where its avatar is whole on the stage, clear of the deck's section names along the foot (56px)
  const FOOT = 56;
  const trim = () => { const W = innerWidth, H = innerHeight;
    wall.querySelectorAll('img').forEach(im => { const f = im.nextElementSibling; if (!f || !f.classList.contains('face')) return;
      const k = parseFloat(wall.style.getPropertyValue('--s')) || 1, sr = slide.getBoundingClientRect();   // from the layout's own numbers, not the drawn box (the
      const ox = sr.left + sr.width / 2, oy = sr.top + sr.height / 2;                                       // cards still waiting to come in sit nudged and shrunk)
      const cx = ox + (parseFloat(im.style.left) + 38.9) * k, cy = oy + (parseFloat(im.style.top) + 34.9) * k, rad = 27 * k;
      f.classList.toggle('cut', cx - rad < 0 || cx + rad > W || cy - rad < 0 || cy + rad > H - FOOT); }); };
  const fit = () => { const w = slide.clientWidth, h = slide.clientHeight; if (w > 0 && h > 0) { layout(w, h); trim(); } };
  new ResizeObserver(fit).observe(slide);
  fit();

  // TWO BUILDS: aaron's tweet alone; a tap brings the wall in around it; the next turns every face angry. Back undoes each.
  let n = 0;
  const set = (k, snap) => { n = k; const b = document.body; if (snap) b.classList.add('snap');
    b.classList.toggle('all', n >= 1); b.classList.toggle('mad', n >= 2);
    if (snap) requestAnimationFrame(() => requestAnimationFrame(() => b.classList.remove('snap'))); };
  window.presoNext = () => { if (n >= 2) return false; set(n + 1); return true; };
  window.presoPrev = () => { if (n <= 0) return false; set(n - 1, true); return true; };
  window.presoEnd = () => set(2, true);
  window.presoState = () => n;
  window.presoRestore = k => set(Math.max(0, Math.min(2, k | 0)), true);
})();
</script>
</body>
</html>
