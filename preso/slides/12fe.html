<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12fe</title>
<!-- WHERE TO? (John, 2026-10-07) — the ego card became a question. With the process cards (12dp–12dr) carrying the AI
     story, "The complete and utter deconstruction of my ego." had nothing left to do — the loss beat is 12gb's, in John's own
     words — so this is the second of three questions the back half runs on: What changed? (12dp) → Where to? → Why Anthropic?
     (12gz). A travel word, on purpose. The tap is unchanged: Roma and the Claude tile spring in under it — the answer, not a
     punchline (for her, with this). The ego line is in git history.

     A LINE (John, 2026-10-05) — after AI, before "High conviction, held loosely." (12g), set exactly as that one is.
     Below is 12g's own history, which this card inherits.

     A LINE (John, 2026-09-22) — after AI, in the voice of the work list.

     The line is set in the SAME type as the work list on slide 07: Special
     Gothic Condensed One at clamp(16px, 6.1vh, 62px), so the two read as the
     same voice at the same scale, one clause per line. Named 12a so the sorted
     manifest drops it between the Host Calendar card (12) and the build (13).
     No build. -->
<style>
  /* IN THE MONO (John, 2026-10-03): set as the one-line slides are (09d01, 09dl, 12a) — IBM Plex Mono at 40, centred — and
     moved to straight after the A.I. card. Its first setting, in slide 07's Special Gothic Condensed, is in git history. */
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../fonts/IBMPlexMono-Regular.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: block;
  }
  html, body { margin: 0; height: 100%; background: #fff; color: #111; overflow: hidden; }
  .slide { height: 100%; display: grid; place-items: center; padding: 0 24px; box-sizing: border-box; }
  .one { margin: 0; white-space: nowrap; font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-weight: 400; font-size: 40px; line-height: 1.5; text-align: center; }
  /* ONE BUILD (John, 2026-10-05): the tap brings Roma's picture back, and beside it a tile the same size with the Claude
     symbol in it — the two dancing as the family photos do on 02 (120, 16 corners, a 4px white stroke, the shadow, overlapping by 26, tipped
     −8° and 8°, sprung in one after the other), under the line. The row opens from nothing, so the block re-centres as it
     grows rather than jumping. The line is two (John, 2026-10-05: "two lines with a good rag"): broken by hand before
     "deconstruction", so the longer line is the second. The symbol is the one off Claude's site (assets/claude-symbol.svg), in its own clay. */
  .card { text-align: center; }
  .pair { display: flex; justify-content: center; align-items: center;
          max-height: 0; overflow: hidden; opacity: 0; padding: 0 24px;
          transition: max-height 600ms cubic-bezier(0.16, 1, 0.3, 1), opacity 200ms ease, padding 600ms cubic-bezier(0.16, 1, 0.3, 1); }
  body.on .pair { max-height: 200px; opacity: 1; padding: 36px 24px 16px; }   /* 36 under the line; room for the tilt and the shadow inside the clip */
  .pair .tile { width: 120px; height: 120px; border-radius: 16px; box-sizing: border-box; flex: none; display: block; position: relative;
                border: 4px solid #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18); background: #fff;
                opacity: 0; transform: rotate(0deg) scale(0.6);
                transition: opacity 260ms ease, transform 420ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  .pair .tile + .tile { margin-left: -26px; }   /* overlapping, as the family photos do (02: −26) */
  .pair .tile:first-child { z-index: 1; }       /* Roma on top of the Claude tile (John, 2026-10-05) */
  .pair img.tile { object-fit: cover; }
  .pair .tile.claude { display: grid; place-items: center; background: hsl(14.8, 63.1%, 59.6%); }   /* inverted (John, 2026-10-05): the symbol's own clay as the fill, the symbol white, the same white stroke round it */
  .pair .tile.claude img { width: 68px; height: 68px; display: block; filter: brightness(0) invert(1); }
  body.on .pair .tile { opacity: 1; }
  body.on .pair .tile:nth-child(1) { transform: rotate(-8deg) scale(1); transition-delay: 260ms; }
  body.on .pair .tile:nth-child(2) { transform: rotate(8deg) scale(1); transition-delay: 360ms; }
  body.snap .pair, body.snap .pair .tile { transition: none !important; }
</style>
</head>
<body>
  <div class="slide">
    <div class="card">
      <p class="one">Where to?</p>
      <div class="pair" aria-hidden="true">
        <img class="tile" src="assets/family/daughter.jpg" alt="">
        <div class="tile claude"><img src="assets/claude-symbol.svg" alt=""></div>
      </div>
    </div>
  </div>
<script>
(() => {
  let step = 0;
  const set = (n, snap) => { step = n; if (snap) document.body.classList.add('snap'); document.body.classList.toggle('on', n > 0); if (snap) { void document.body.offsetWidth; document.body.classList.remove('snap'); } };
  window.presoNext = () => { if (step >= 1) return false; set(1); return true; };
  window.presoPrev = () => { if (step === 0) return false; set(0); return true; };
  window.presoState = () => step;
  window.presoRestore = n => set(n > 0 ? 1 : 0, true);
})();
</script>
</body>
</html>
