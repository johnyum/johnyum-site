<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>06</title>
<!-- The Airbnb chapter opens: "2015 → Airbnb", centred, in 32pt IBM Plex Mono — the deck's chapter-card voice, as on
     Host only fee and Host calendar (John, 2026-10-01). It was the Bélo lockup at up to 80px tall. -->
<style>
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../fonts/IBMPlexMono-Regular.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: block;
  }
  html, body { margin: 0; height: 100%; background: #fff; color: #111; overflow: hidden; }
  .slide { height: 100%; display: grid; place-items: center; }
  h1 {
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-weight: 400;
    font-size: 40px;   /* chapter cards are 32 (John, 2026-10-01) */
    line-height: 1.4;
    text-align: center;
    margin: 0;
    white-space: nowrap;
    display: flex; align-items: center; justify-content: center;
  }
  /* 2015 → Airbnb (John, 2026-10-02): his arrow_forward, 24 square, in the type's ink, a space either side */
  .arrow { width: 24px; height: 24px; flex: none; fill: currentColor; margin: 0 0.6ch; }
</style>
</head>
<body>
  <div class="slide">
    <h1>2015<svg class="arrow" width="24" height="24" viewBox="0 -960 960 960" aria-label="to"><path d="M647-440H160v-80h487L423-744l57-56 320 320-320 320-57-56 224-224Z"/></svg>Airbnb</h1>
  </div>
</body>
</html>
