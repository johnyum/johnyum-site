<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>06</title>
<!-- The Airbnb chapter opens: the lockup alone, centred, capped at 80px tall
     (its native height — it never renders larger than drawn). -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .slide {
    height: 100%;
    display: grid;
    place-items: center;
  }
  img {
    height: clamp(40px, 6vw, 80px);
    width: auto;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }
</style>
</head>
<body>
  <div class="slide">
    <img src="assets/airbnb-logo.svg" alt="Airbnb">
  </div>
</body>
</html>
