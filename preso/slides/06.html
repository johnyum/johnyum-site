<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>06</title>
<!-- The Airbnb chapter opens: the word alone, centred, in 32pt IBM Plex Mono — the deck's chapter-card voice, as on
     Host only fee and Host calendar (John, 2026-10-01). It was the Bélo lockup at up to 80px tall. -->
<style>
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../fonts/IBMPlexMono-Regular.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: block;
  }
  html, body { margin: 0; height: 100%; background: #fff; color: #111; overflow: hidden; }
  .slide { height: 100%; display: grid; place-items: center; }
  h1 {
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-weight: 400;
    font-size: 32px;   /* chapter cards are 32 (John, 2026-10-01) */
    line-height: 1.4;
    text-align: center;
    margin: 0;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="slide">
    <h1>Airbnb</h1>
  </div>
</body>
</html>
