<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09f0</title>
<!-- HOST SETUP — the title card for the ten-step flow that follows.

     THE EXPLAINER SIZE, NOT A HEADLINE SIZE. Special Gothic Condensed One at
     clamp(16px, 6.1vh, 62px) — the same face and the same clamp 10c and 11cut
     set their copy in, which is the size the deck explains itself at. A
     section title in Anton at 18vw (10b) announces; this one just names the
     thing and gets out of the way, which is what the work either side of it
     needs. Height-driven, so it holds its proportion against the stage rather
     than the window's width.

     THE OTHER TWO PROJECTS DO NOT GET ONE. Transportation opens on the Forbes
     piece and the fee work opens on the cleaning-fee tweet — a real page and a
     real tweet do the naming better than a word on white, so they are the
     headers there. Only the two without an artefact to open on get a card.

     No script, nothing to reveal. The deck pushes it in from the right and off
     to the left. -->
<style>
  @font-face {
    font-family: "Special Gothic Condensed One";
    src: url("../fonts/SpecialGothicCondensedOne.woff2") format("woff2");
    font-weight: 400;
    font-display: block;
  }
  html, body {
    margin: 0; height: 100%;
    background: #fff; color: #111;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .slide { height: 100%; display: grid; place-items: center; }
  .pm { text-align: center; }
  h1 {
    margin: 0;
    font-family: "Special Gothic Condensed One", "Helvetica Neue", sans-serif;
    font-weight: 400;
    font-size: clamp(16px, 6.1vh, 62px);   /* 10c's copy, exactly */
    line-height: 1.06;
    letter-spacing: -0.01em;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="pm">
      <h1>Host Setup</h1>
    </div>
  </div>
</body>
</html>
