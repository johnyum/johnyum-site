<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12gt</title>
<!-- THE TOOLS (John, 2026-10-08) — at the end, in place of "High conviction, held loosely." (12g, kept, out of the running
     order): the tiles of "Where to?" (12fe — 120 square, 16 corners, a 4px white stroke, the shadow, overlapping by 26, tipped
     and sprung in one after the other), five across: a plain pencil in the calendar's clay (gpt-image-1, after the ev-*.png
     renders), then Photoshop, InDesign, Sketch and Figma — the tools of the eleven years. They come in as the slide lands.
     ONE TAP: five more under them, in black and white — a code icon in the same clay, Blender, Final Cut Pro, then three that
     would have helped greatly and were too hard to learn: Xcode and After Effects (Unity, Origami Studio, Houdini and Ableton Live
     came and went, 2026-10-08 — John: "get rid of ableton"; five now, as the row above). Hover any tile and its name comes up above it. A SECOND TAP gathers all ten into the middle and brings up the Claude spark, and then its name slides out
     beside it (see THE GATHER and THEN THE NAME).
     Photoshop, Figma and Xcode are the apps' own icons, read off this Mac (sips from each .icns) and cropped to their squircle;
     the Adobe three are cut at full size (459px) from the Creative Cloud icon sheet John gave, each laid on a solid square of its
     own colour so the icon's rounded corner never shows as an edge inside the tile; Blender and
     Sketch are their official SVGs off Wikimedia Commons, set whole in a white tile; Final Cut Pro is Apple's App Store icon; The code icon is centred on its body,
     not its faint shadow. -->
<style>
  @font-face { font-family: "IBM Plex Mono"; src: url("../fonts/IBMPlexMono-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .slide { height: 100%; display: grid; place-items: center; }
  .rows { display: flex; flex-direction: column; align-items: center; }
  .row { display: flex; justify-content: center; align-items: center; padding: 16px 32px; }
  /* the second row opens from nothing, so the whole block re-centres as it grows (12fe's way) */
  .row.two { max-height: 0; overflow: hidden; opacity: 0; padding: 0 32px;
             transition: max-height 600ms cubic-bezier(0.16, 1, 0.3, 1), opacity 200ms ease, padding 600ms cubic-bezier(0.16, 1, 0.3, 1); }
  body.more .row.two { max-height: 200px; opacity: 1; padding: 16px 32px 24px; }
  .tile { width: 120px; height: 120px; border-radius: 16px; box-sizing: border-box; flex: none; position: relative; overflow: hidden;
          border: 4px solid #fff; box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.14), 0 2px 8px rgba(0, 0, 0, 0.18); background: #fff;   /* the hairline is so a white tile laid over a dark one reads as a card on top, not a bite out of it (John, 2026-10-08) */
          opacity: 0; transform: rotate(0deg) scale(0.6);
          transition: opacity 260ms ease, transform 420ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  .tile + .tile { margin-left: -26px; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile.clay img { width: 80%; height: 80%; margin: 10%; object-fit: contain; }
  .tile.ps { background: #001e36; }
  .tile.figma { background: #f2f2f2; }
  .tile.figma img, .tile.xcode img { transform: scale(1.18); }   /* past each app icon's own rounded corner, so the tile's is the only edge (John, 2026-10-08: "a weird edge") */   /* past the icon's own rim, so the tile is the only edge */
  .tile.xcode { background: linear-gradient(#1bb8ff, #1d63f5); }
  /* the first on top, each after it tucked under the one before, as the family photos lap */
  .row .tile:nth-child(1) { z-index: 6; } .row .tile:nth-child(2) { z-index: 5; } .row .tile:nth-child(3) { z-index: 4; }
  .row .tile:nth-child(4) { z-index: 3; } .row .tile:nth-child(5) { z-index: 2; } .row .tile:nth-child(6) { z-index: 1; }
  .tile.fcp { background: #1c1c1e; }
  .tile.id { background: #49021f; } .tile.ae { background: #00005b; }   /* each Adobe tile filled with its own icon's colour, so the icon's rounded corners vanish */
  .row.two .tile { filter: grayscale(1); }
  /* THE NAMES (John, 2026-10-08: "when I hover over any of these I want the names of it pop up above it"): one label, laid
     over the page (not in the tile — the tile is tipped and clips), its centre on the tile's, 10 above its top; the hovered
     tile comes up over its neighbours. The pill is Peek's name pill: white, a hairline ring, a two-layer soft shadow. */
  .tile:hover { z-index: 20 !important; }
  /* THE GATHER (John, 2026-10-08: "when I tap next animate it all into itself, the whole 10 icons into the center; when it goes
     full white, slowly bring in the Anthropic icon in the center — no bounding, just the icon — and let it sit there"): every tile
     flies to the middle, straightening and shrinking as it goes, and fades out as it arrives; on the white, the Claude mark comes
     up slowly where they met, in its own clay, no tile round it, and holds. It was Anthropic's A\ for an hour; John took the
     Claude mark instead — after 'Then I understood', what he understood is that all of these now run through one tool, and
     ending on the panel's own logo read as flattery. The same symbol as the Claude tile on 'Where to?'. */
  body.gather .rows { pointer-events: none; }
  body.gather .tile { opacity: 0 !important; transition: transform 760ms cubic-bezier(0.55, 0, 0.3, 1), opacity 320ms ease 470ms !important; }
  .mark { position: fixed; left: 50%; top: 50%; display: flex; align-items: center; pointer-events: none;
          opacity: 0; transform: translate(-50%, -50%) scale(0.97); transition: opacity 280ms ease, transform 280ms ease; }
  body.gather .mark { opacity: 1; transform: translate(-50%, -50%) scale(1);
                      transition: opacity 1800ms cubic-bezier(0.4, 0, 0.2, 1) 1050ms, transform 2400ms cubic-bezier(0.2, 0.8, 0.2, 1) 1050ms; }
  /* THEN THE NAME (John, 2026-10-08: "do the spark then Claude slides out"): the spark lands alone, centred; once it has settled
     the wordmark slides out from behind it to the right, the pair re-centring as it opens — Claude's own lockup, at its own gap
     (29.67 of the spark's 148.18, so 19 at 96). */
  .mark .spark { height: 96px; width: auto; display: block; }
  .mark .clip { display: block; width: 0; overflow: hidden; transition: width 260ms ease; }
  .mark .word { display: block; height: 96px; width: auto; margin-left: 19px; opacity: 0; transform: translateX(-28px); transition: opacity 200ms ease, transform 260ms ease; }
  body.gather .mark .clip { width: 351px; transition: width 1000ms cubic-bezier(0.2, 0.8, 0.2, 1) 2900ms; }
  body.gather .mark .word { opacity: 1; transform: none; transition: opacity 700ms ease 3000ms, transform 1000ms cubic-bezier(0.2, 0.8, 0.2, 1) 2900ms; }
  #name { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 50; white-space: nowrap;
          font: 400 15px/1 "IBM Plex Mono", ui-monospace, Menlo, monospace; color: #111; background: #fff; padding: 9px 14px; border-radius: 999px;
          box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.12), 0 2px 6px rgba(0, 0, 0, 0.08), 0 8px 24px rgba(0, 0, 0, 0.10);
          opacity: 0; transform: translate(-50%, calc(-100% + 6px)); transition: opacity 160ms ease, transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1); }
  #name.on { opacity: 1; transform: translate(-50%, -100%); }
  /* in: each one sprung to its own tilt, one after the other */
  body.in .row.one .tile, body.more .row.two .tile { opacity: 1; transform: translate(var(--x, 0px), var(--y, 0px)) rotate(var(--r)) scale(var(--s, 1)); }
  /* HOVER (John, 2026-10-08: "push the icons away that's not hovering and make the cell not on an angle; when I dehover it goes
     back to the stacked"): the hovered tile straightens and lifts a touch, every other tile in its row slides away from it — left
     of it to the left, right of it to the right — far enough that it stands clear; off it, all settle back into the stack. A row
     that has been hovered drops the entrance's stagger (.live), so the move is at once. */
  .row.live .tile { transition-delay: 0ms !important; transition: opacity 260ms ease, transform 360ms cubic-bezier(0.34, 1.4, 0.64, 1); }
  body.in .row.one .tile:nth-child(1) { --r: -8deg; transition-delay: 120ms; }
  body.in .row.one .tile:nth-child(2) { --r: 6deg; transition-delay: 220ms; }
  body.in .row.one .tile:nth-child(3) { --r: -4deg; transition-delay: 320ms; }
  body.in .row.one .tile:nth-child(4) { --r: 7deg; transition-delay: 420ms; }
  body.in .row.one .tile:nth-child(5) { --r: -6deg; transition-delay: 520ms; }
  body.more .row.two .tile:nth-child(1) { --r: 6deg; transition-delay: 260ms; }
  body.more .row.two .tile:nth-child(2) { --r: -7deg; transition-delay: 360ms; }
  body.more .row.two .tile:nth-child(3) { --r: 4deg; transition-delay: 460ms; }
  body.more .row.two .tile:nth-child(4) { --r: -5deg; transition-delay: 560ms; }
  body.more .row.two .tile:nth-child(5) { --r: 8deg; transition-delay: 660ms; }
  body.more .row.two .tile:nth-child(6) { --r: -6deg; transition-delay: 760ms; }
  body.snap .row, body.snap .tile { transition: none !important; }
</style>
</head>
<body>
  <div class="slide">
    <div class="rows" aria-label="Design tools">
      <div class="row one">
        <div class="tile clay"><img src="assets/tools/pencil.webp" alt="Hand drawn"></div>
        <div class="tile ps"><img src="assets/tools/photoshop.webp" alt="Photoshop"></div>
        <div class="tile id"><img src="assets/tools/indesign.webp" alt="InDesign"></div>
        <div class="tile"><img src="assets/tools/sketch.svg" alt="Sketch"></div>
        <div class="tile figma"><img src="assets/tools/figma.webp" alt="Figma"></div>
      </div>
      <div class="row two">
        <div class="tile clay"><img src="assets/tools/code.webp" alt="Code"></div>
        <div class="tile"><img src="assets/tools/blender.svg" alt="Blender"></div>
        <div class="tile fcp"><img src="assets/tools/finalcut.webp" alt="Final Cut Pro"></div>
        <div class="tile xcode"><img src="assets/tools/xcode.webp" alt="Xcode"></div>
        <div class="tile ae"><img src="assets/tools/aftereffects.webp" alt="After Effects"></div>
      </div>
    </div>
  </div>
  <div class="mark" aria-label="Claude"><img class="spark" src="assets/claude-spark.svg" alt=""><span class="clip"><img class="word" src="assets/claude-word.svg" alt=""></span></div>
  <div id="name" aria-hidden="true"></div>
<script>
(() => {
  const b = document.body;
  let step = 0;
  const name = document.getElementById('name');
  const snap = fn => { b.classList.add('snap'); fn(); void b.offsetWidth; b.classList.remove('snap'); };
  const tiles = [...document.querySelectorAll('.tile')];
  const clear = t => ['--x', '--y', '--r', '--s'].forEach(k => t.style.removeProperty(k));
  // each tile's way to the middle, from where it stands now (its centre: a tilt or a lift turns about it)
  const gather = on => {
    tiles.forEach(clear);
    document.querySelectorAll('.row').forEach(r => r.classList.add('live'));
    if (!on) return;
    const cx = innerWidth / 2, cy = innerHeight / 2;
    tiles.forEach((t, i) => { const r = t.getBoundingClientRect();
      t.style.setProperty('--x', (cx - (r.left + r.width / 2)) + 'px'); t.style.setProperty('--y', (cy - (r.top + r.height / 2)) + 'px');
      t.style.setProperty('--r', '0deg'); t.style.setProperty('--s', '0.3'); });   // all ten together
  };
  const set = (n, instant) => { step = n; name.classList.remove('on');
    const go = () => { b.classList.add('in'); b.classList.toggle('more', n > 0); const was = b.classList.contains('gather'); b.classList.toggle('gather', n > 1); if (n > 1 || was) { void b.offsetWidth; gather(n > 1); } };   // the class first, so the flight takes the gather's own timing
    instant ? snap(go) : go(); };
  // the first five come in as the slide lands (not while it is being built ahead, hidden)
  addEventListener('presoshown', () => { if (!b.classList.contains('in')) set(step); });
  if (window.parent === window) addEventListener('load', () => set(0));
  // the slide keeps the pointer so the names can follow it (the deck's taps shrink to its 32px edge rails; the arrows and the clicker still step)
  window.presoInteractive = true;
  // (the name over whichever tile the pointer is on is read off its picture's alt — below)
  const PUSH = 30, LIFT = 1.08;
  document.querySelectorAll('.tile').forEach(t => {
    const row = t.parentElement, all = [...row.children], i = all.indexOf(t);
    t.addEventListener('mouseenter', () => {
      if (step > 1) return;
      row.classList.add('live');
      all.forEach((o, j) => { o.style.setProperty('--x', j === i ? '0px' : (j < i ? -PUSH : PUSH) + 'px'); o.style.removeProperty('--r'); o.style.removeProperty('--s'); });
      t.style.setProperty('--r', '0deg'); t.style.setProperty('--s', LIFT);
      // the name over the straightened tile: its centre doesn't move, its top is half its lifted height above that
      const r = t.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      name.textContent = t.querySelector('img').alt;
      name.style.left = cx + 'px'; name.style.top = (cy - t.offsetHeight * LIFT / 2 - 10) + 'px'; name.classList.add('on');
    });
    t.addEventListener('mouseleave', () => {
      name.classList.remove('on'); if (step > 1) return;
      all.forEach(o => { o.style.removeProperty('--x'); o.style.removeProperty('--r'); o.style.removeProperty('--s'); });
    });
  });
  window.presoNext = () => { if (step >= 2) return false; set(step + 1); return true; };
  window.presoPrev = () => { if (step === 0) return false; set(step - 1); return true; };
  window.presoState = () => step;
  window.presoRestore = n => set(Math.max(0, Math.min(2, n | 0)), true);
})();
</script>
</body>
</html>
