<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12gt</title>
<!-- THE TOOLS (John, 2026-10-08) — at the end, in place of "High conviction, held loosely." (12g, kept, out of the running
     order): the tiles of "Where to?" (12fe — 120 square, 16 corners, a 4px white stroke, the shadow, overlapping by 26, tipped
     and sprung in one after the other), five across: a plain pencil in the calendar's clay (gpt-image-1, after the ev-*.png
     renders), then Photoshop, InDesign, Sketch and Figma — the tools of the eleven years. They come in as the slide lands.
     ONE TAP: five more under them, in black and white — a code icon in the same clay, Blender, Final Cut Pro, then three that
     would have helped greatly and were too hard to learn: Xcode and After Effects (Unity, Origami Studio, Houdini and Ableton Live
     came and went, 2026-10-08 — John: "get rid of ableton"; five now, as the row above). Hover any tile and its name comes up above it.
     Photoshop, Figma and Xcode are the apps' own icons, read off this Mac (sips from each .icns) and cropped to their squircle;
     the Adobe three are Adobe's own vector icons (Wikimedia Commons, the CC set) with the rounded background squared off, so
     the tile's corner is the only edge and the letters are sharp at any size; Blender and
     Sketch are their official SVGs off Wikimedia Commons, set whole in a white tile; Final Cut Pro is Apple's App Store icon; The code icon is centred on its body,
     not its faint shadow. -->
<style>
  @font-face { font-family: "IBM Plex Mono"; src: url("../fonts/IBMPlexMono-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .slide { height: 100%; display: grid; place-items: center; }
  .rows { display: flex; flex-direction: column; align-items: center; }
  .row { display: flex; justify-content: center; align-items: center; padding: 16px 32px; }
  /* the second row opens from nothing, so the whole block re-centres as it grows (12fe's way) */
  .row.two { max-height: 0; overflow: hidden; opacity: 0; padding: 0 32px;
             transition: max-height 600ms cubic-bezier(0.16, 1, 0.3, 1), opacity 200ms ease, padding 600ms cubic-bezier(0.16, 1, 0.3, 1); }
  body.more .row.two { max-height: 200px; opacity: 1; padding: 16px 32px 24px; }
  .tile { width: 120px; height: 120px; border-radius: 16px; box-sizing: border-box; flex: none; position: relative; overflow: hidden;
          border: 4px solid #fff; box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.14), 0 2px 8px rgba(0, 0, 0, 0.18); background: #fff;   /* the hairline is so a white tile laid over a dark one reads as a card on top, not a bite out of it (John, 2026-10-08) */
          opacity: 0; transform: rotate(0deg) scale(0.6);
          transition: opacity 260ms ease, transform 420ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  .tile + .tile { margin-left: -26px; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile.clay img { width: 80%; height: 80%; margin: 10%; object-fit: contain; }
  .tile.ps { background: #001e36; }
  .tile.figma { background: #f2f2f2; }
  .tile.figma img, .tile.xcode img { transform: scale(1.18); }   /* past each app icon's own rounded corner, so the tile's is the only edge (John, 2026-10-08: "a weird edge") */   /* past the icon's own rim, so the tile is the only edge */
  .tile.xcode { background: linear-gradient(#1bb8ff, #1d63f5); }
  /* the first on top, each after it tucked under the one before, as the family photos lap */
  .row .tile:nth-child(1) { z-index: 6; } .row .tile:nth-child(2) { z-index: 5; } .row .tile:nth-child(3) { z-index: 4; }
  .row .tile:nth-child(4) { z-index: 3; } .row .tile:nth-child(5) { z-index: 2; } .row .tile:nth-child(6) { z-index: 1; }
  .tile.fcp { background: #1c1c1e; }
  .tile.id { background: #49021f; } .tile.ae { background: #00005b; }   /* each Adobe tile filled with its own icon's colour, so the icon's rounded corners vanish */
  .row.two .tile { filter: grayscale(1); }
  /* THE NAMES (John, 2026-10-08: "when I hover over any of these I want the names of it pop up above it"): one label, laid
     over the page (not in the tile — the tile is tipped and clips), its centre on the tile's, 10 above its top; the hovered
     tile comes up over its neighbours. The pill is Peek's name pill: white, a hairline ring, a two-layer soft shadow. */
  .tile:hover { z-index: 20 !important; }
  #name { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 50; white-space: nowrap;
          font: 400 15px/1 "IBM Plex Mono", ui-monospace, Menlo, monospace; color: #111; background: #fff; padding: 9px 14px; border-radius: 999px;
          box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.12), 0 2px 6px rgba(0, 0, 0, 0.08), 0 8px 24px rgba(0, 0, 0, 0.10);
          opacity: 0; transform: translate(-50%, calc(-100% + 6px)); transition: opacity 160ms ease, transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1); }
  #name.on { opacity: 1; transform: translate(-50%, -100%); }
  /* in: each one sprung to its own tilt, one after the other */
  body.in .row.one .tile, body.more .row.two .tile { opacity: 1; }
  body.in .row.one .tile:nth-child(1) { transform: rotate(-8deg) scale(1); transition-delay: 120ms; }
  body.in .row.one .tile:nth-child(2) { transform: rotate(6deg) scale(1); transition-delay: 220ms; }
  body.in .row.one .tile:nth-child(3) { transform: rotate(-4deg) scale(1); transition-delay: 320ms; }
  body.in .row.one .tile:nth-child(4) { transform: rotate(7deg) scale(1); transition-delay: 420ms; }
  body.in .row.one .tile:nth-child(5) { transform: rotate(-6deg) scale(1); transition-delay: 520ms; }
  body.more .row.two .tile:nth-child(1) { transform: rotate(6deg) scale(1); transition-delay: 260ms; }
  body.more .row.two .tile:nth-child(2) { transform: rotate(-7deg) scale(1); transition-delay: 360ms; }
  body.more .row.two .tile:nth-child(3) { transform: rotate(4deg) scale(1); transition-delay: 460ms; }
  body.more .row.two .tile:nth-child(4) { transform: rotate(-5deg) scale(1); transition-delay: 560ms; }
  body.more .row.two .tile:nth-child(5) { transform: rotate(8deg) scale(1); transition-delay: 660ms; }
  body.more .row.two .tile:nth-child(6) { transform: rotate(-6deg) scale(1); transition-delay: 760ms; }
  body.snap .row, body.snap .tile { transition: none !important; }
</style>
</head>
<body>
  <div class="slide">
    <div class="rows" aria-label="Design tools">
      <div class="row one">
        <div class="tile clay"><img src="assets/tools/pencil.webp" alt="A pencil"></div>
        <div class="tile ps"><img src="assets/tools/photoshop.svg" alt="Photoshop"></div>
        <div class="tile id"><img src="assets/tools/indesign.svg" alt="InDesign"></div>
        <div class="tile"><img src="assets/tools/sketch.svg" alt="Sketch"></div>
        <div class="tile figma"><img src="assets/tools/figma.webp" alt="Figma"></div>
      </div>
      <div class="row two">
        <div class="tile clay"><img src="assets/tools/code.webp" alt="Code"></div>
        <div class="tile"><img src="assets/tools/blender.svg" alt="Blender"></div>
        <div class="tile fcp"><img src="assets/tools/finalcut.webp" alt="Final Cut Pro"></div>
        <div class="tile xcode"><img src="assets/tools/xcode.webp" alt="Xcode"></div>
        <div class="tile ae"><img src="assets/tools/aftereffects.svg" alt="After Effects"></div>
      </div>
    </div>
  </div>
  <div id="name" aria-hidden="true"></div>
<script>
(() => {
  const b = document.body;
  let step = 0;
  const snap = fn => { b.classList.add('snap'); fn(); void b.offsetWidth; b.classList.remove('snap'); };
  const set = (n, instant) => { step = n; const go = () => { b.classList.add('in'); b.classList.toggle('more', n > 0); }; instant ? snap(go) : go(); };
  // the first five come in as the slide lands (not while it is being built ahead, hidden)
  addEventListener('presoshown', () => { if (!b.classList.contains('in')) set(step); });
  if (window.parent === window) addEventListener('load', () => set(0));
  // the slide keeps the pointer so the names can follow it (the deck's taps shrink to its 32px edge rails; the arrows and the clicker still step)
  window.presoInteractive = true;
  // the name over whichever tile the pointer is on, read off its picture's alt
  const name = document.getElementById('name');
  document.querySelectorAll('.tile').forEach(t => {
    t.addEventListener('mouseenter', () => { const r = t.getBoundingClientRect(); name.textContent = t.querySelector('img').alt;
      name.style.left = (r.left + r.width / 2) + 'px'; name.style.top = (r.top - 10) + 'px'; name.classList.add('on'); });
    t.addEventListener('mouseleave', () => name.classList.remove('on'));
  });
  window.presoNext = () => { if (step >= 1) return false; set(1); return true; };
  window.presoPrev = () => { if (step === 0) return false; set(0); return true; };
  window.presoState = () => step;
  window.presoRestore = n => set(n > 0 ? 1 : 0, true);
})();
</script>
</body>
</html>
