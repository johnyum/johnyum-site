<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09d1</title>
<!-- THE BACKLASH (John, 2026-09-30) — straight after the host-only fee screens, what hosts said about them: a thread on
     r/airbnb_hosts, "Rant on Airbnb fee structure change", the post and its comments down to Future_Different.

     assets/reddit-thread.png is John's own screenshots of the public thread, stitched into one strip (they overlapped
     exactly) with the three ads, the header and both sidebars cut out. Re-taken at retina 2x (John, 2026-10-01) — six
     screenshots, joined where they overlap to the pixel, 1476 wide: sharp at the 655 it shows at. Nothing in it is
     retyped: these are the hosts' own words as Reddit showed them.

     The strip is far taller than the stage, and that is the point — it runs on off the bottom, the way the tweets run
     off every edge. It hangs from just under the deck's kicker and is cropped by the frame. (The first capture was 570
     wide and went soft at this size.) One tap pulls back from the top to the whole — see .view. -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  /* ONE TAP, ZOOMED THEN WHOLE (John, 2026-09-30). The thread lives in the band between the deck's chrome — the kicker
     owns the top 44px and the section names the bottom 44 — with the same 32 of air above and below it: 76 to 76.
     It opens zoomed in on the top, at 1.15 of the capture's own size (any more and the type goes soft), running on
     into a soft fade at the foot of the band; the tap pulls back until the whole thread fills the band exactly. */
  .view { position: absolute; left: 0; right: 0; top: 76px; bottom: 76px; overflow: hidden; }
  body:not(.whole) .view {
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 64px), transparent);
            mask-image: linear-gradient(to bottom, #000 calc(100% - 64px), transparent);
  }
  .wrap {
    position: absolute; left: 50%; top: 0;
    width: min(655px, 86vw);                    /* the size it has always shown at; the capture is 1476, 2.25x of it */
    transform: translateX(-50%) scale(var(--s, 1));
    transform-origin: 50% 0;
    transition: transform 900ms cubic-bezier(0.65, 0, 0.35, 1), top 900ms cubic-bezier(0.65, 0, 0.35, 1);
  }
  body.snap .wrap, body.snap .mark { transition: none; }
  .thread { width: 100%; height: auto; display: block; user-select: none; -webkit-user-drag: none; }
  /* THE MARKS (John, 2026-09-30): ⨉ beside the naysayers, ✓ beside the ones who understood the host-only fee — in a
     gutter to the left of the thread, each on its comment's username row. Rows are in the strip's own pixels (of 7114),
     so they hold at any size. Same icons and colours as the verdict on the calendar. The OP's own replies carry none
     (John) — the post is marked once, and the replies are the same person saying it again. */
  /* the marks keep their size on screen as the thread shrinks under them: they are scaled back up by 1/s, about their
     right edge, and kept 10 screen-px off the thread */
  .mark {
    position: absolute; right: 100%; width: 28px; height: 28px;   /* 28 (John: "a bit bigger"; 20 first) */
    transform-origin: 100% 50%;
    transform: translate(calc(-10px * var(--inv, 1)), -50%) scale(var(--inv, 1));
    transition: transform 900ms cubic-bezier(0.65, 0, 0.35, 1);
  }
  /* the marks are faces now (John, 2026-10-02): 😡 for the naysayers, 🤗 for the ones who got it (🤔 at first) — the emoji fills
     its 28 box, set 3.75% low to sit on its row as the icons did */
  .mark { display: grid; place-items: center; font: 28px/1 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif; padding-top: 1px; box-sizing: border-box; }
  /* A THIRD TAP (John, 2026-10-07): the angry faces turn to 🤨 (the raised eyebrow, 2026-10-08; it was 🤔) — each pops as it changes, in a quick ripple down the thread */
  .mark.hmm { animation: hmm .5s cubic-bezier(.34,1.56,.64,1) both; animation-delay: var(--d, 0ms); }
  @keyframes hmm { 0% { transform: translate(calc(-10px * var(--inv, 1)), -50%) scale(calc(var(--inv, 1) * .6)); } 100% { transform: translate(calc(-10px * var(--inv, 1)), -50%) scale(var(--inv, 1)); } }
  body.snap .mark { animation: none !important; }
</style>
</head>
<body>
  <div class="view"><div class="wrap" id="wrap">
  <img class="thread" src="assets/reddit-thread.png" width="1476" height="7114"
       alt="A Reddit thread on r/airbnb_hosts, 'Rant on Airbnb fee structure change': a long-time host says the migration tool only offers a 15% price increase that still leaves take-home below the old fee, and commenters argue over whether hosts come out behind">
    <span class="mark no" style="top:0.808%" role="img" aria-label="naysayer" title="the post">&#x1F621;</span>
    <span class="mark no" style="top:16.327%" role="img" aria-label="naysayer" title="Chance-Repeat8446: greedy">&#x1F621;</span>
    <span class="mark no" style="top:24.824%" role="img" aria-label="naysayer" title="fumbling_artisan: slimy">&#x1F621;</span>
    <span class="mark ok" style="top:52.130%" role="img" aria-label="understood" title="According-Data8773: the guest sees the same price">&#x1F642;</span>
    <span class="mark ok" style="top:66.601%" role="img" aria-label="understood" title="DashiellHammett: silly hyperbole">&#x1F642;</span>
    <span class="mark ok" style="top:76.834%" role="img" aria-label="understood" title="PeteeWheatStraw: nothing makes anything higher">&#x1F642;</span>
    <span class="mark ok" style="top:93.759%" role="img" aria-label="understood" title="Future_Different: a global increase, thirty seconds">&#x1F642;</span>
  </div></div>
<script>
  // 0: zoomed in on the top · 1: the whole thread, scaled to fill the band between the chrome · 2: the angry faces turn to 🤨
  const wrap = document.getElementById('wrap'), view = document.querySelector('.view'), H = 7114, W = 1476;
  let at = 0;
  function place() {
    // ZOOMED OUT, 16 of air above the thread (John, 2026-10-02): the first face rides the post's top line, half of it above the
    // thread — set flush to the frame it was cut in half
    const PAD = 16;
    const s = at ? Math.min(1, (view.clientHeight - PAD) / (wrap.offsetWidth * H / W)) : 1;
    wrap.style.top = (at ? PAD : 0) + 'px';
    wrap.style.setProperty('--s', s.toFixed(5));
    document.body.style.setProperty('--inv', (1 / s).toFixed(5));
    document.body.classList.toggle('whole', at >= 1);
    document.querySelectorAll('.mark.no').forEach((m, i) => { m.textContent = at === 2 ? '\u{1F928}' : '\u{1F621}'; m.style.setProperty('--d', (i * 90) + 'ms'); m.classList.toggle('hmm', at === 2); });
  }
  place();
  addEventListener('resize', place);
  window.presoNext = () => { if (at >= 2) return false; at++; place(); return true; };
  window.presoPrev = () => { if (!at) return false; at--; place(); return true; };
  window.presoState = () => at;
  window.presoRestore = n => {
    document.body.classList.add('snap'); at = Math.max(0, Math.min(2, n | 0)); place();
    void wrap.offsetWidth; requestAnimationFrame(() => document.body.classList.remove('snap'));
    setTimeout(() => document.body.classList.remove('snap'), 60);
  };
</script>
</body>
</html>
