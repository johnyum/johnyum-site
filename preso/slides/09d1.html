<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09d1</title>
<!-- THE BACKLASH (John, 2026-09-30) — straight after the host-only fee screens, what hosts said about them: a thread on
     r/airbnb_hosts, "Rant on Airbnb fee structure change", the post and its comments down to Future_Different.

     assets/reddit-thread.png is John's own screenshots of the public thread, stitched into one strip (they overlapped
     exactly, 799 and 867 rows apart) with the three ads, the header and both sidebars cut out. Nothing in it is
     retyped: these are the hosts' own words as Reddit showed them.

     The strip is far taller than the stage, and that is the point — it runs on off the bottom, the way the tweets run
     off every edge. It hangs from just under the deck's kicker and is cropped by the frame. The capture came in at
     570 wide, so it is never shown much past that, or the type goes soft. One tap pulls back from the top to the whole — see .view. -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  /* ONE TAP, ZOOMED THEN WHOLE (John, 2026-09-30). The thread lives in the band between the deck's chrome — the kicker
     owns the top 44px and the section names the bottom 44 — with the same 32 of air above and below it: 76 to 76.
     It opens zoomed in on the top, at 1.15 of the capture's own size (any more and the type goes soft), running on
     into a soft fade at the foot of the band; the tap pulls back until the whole thread fills the band exactly. */
  .view { position: absolute; left: 0; right: 0; top: 76px; bottom: 76px; overflow: hidden; }
  body:not(.whole) .view {
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 64px), transparent);
            mask-image: linear-gradient(to bottom, #000 calc(100% - 64px), transparent);
  }
  .wrap {
    position: absolute; left: 50%; top: 0;
    width: min(655px, 86vw);                    /* 570 x 1.15 */
    transform: translateX(-50%) scale(var(--s, 1));
    transform-origin: 50% 0;
    transition: transform 900ms cubic-bezier(0.65, 0, 0.35, 1);
  }
  body.snap .wrap, body.snap .mark { transition: none; }
  .thread { width: 100%; height: auto; display: block; user-select: none; -webkit-user-drag: none; }
  /* THE MARKS (John, 2026-09-30): ⨉ beside the naysayers, ✓ beside the ones who understood the host-only fee — in a
     gutter to the left of the thread, each on its comment's username row. Rows are in the strip's own pixels (of 2153),
     so they hold at any size. Same icons and colours as the verdict on the calendar. The OP's own replies carry none
     (John) — the post is marked once, and the replies are the same person saying it again. */
  /* the marks keep their size on screen as the thread shrinks under them: they are scaled back up by 1/s, about their
     right edge, and kept 10 screen-px off the thread */
  .mark {
    position: absolute; right: 100%; width: 20px; height: 20px;
    transform-origin: 100% 50%;
    transform: translate(calc(-10px * var(--inv, 1)), -50%) scale(var(--inv, 1));
    transition: transform 900ms cubic-bezier(0.65, 0, 0.35, 1);
  }
  .mark.ok { fill: #008A05; }
  .mark.no { fill: #C13515; }
</style>
</head>
<body>
  <div class="view"><div class="wrap" id="wrap">
  <img class="thread" src="assets/reddit-thread.png" width="570" height="2153"
       alt="A Reddit thread on r/airbnb_hosts, 'Rant on Airbnb fee structure change': a long-time host says the migration tool only offers a 15% price increase that still leaves take-home below the old fee, and commenters argue over whether hosts come out behind">
    <svg class="mark no" style="top:1.951%" viewBox="0 -960 960 960" aria-label="naysayer"><title>the post</title><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>
    <svg class="mark no" style="top:18.439%" viewBox="0 -960 960 960" aria-label="naysayer"><title>Chance-Repeat8446: greedy</title><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>
    <svg class="mark no" style="top:28.518%" viewBox="0 -960 960 960" aria-label="naysayer"><title>fumbling_artisan: slimy</title><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>
    <svg class="mark ok" style="top:44.821%" viewBox="0 -960 960 960" aria-label="understood"><title>According-Data8773: the guest sees the same price</title><path d="M382-240 154-468l57-57 171 171 367-367 57 57-424 424Z"/></svg>
    <svg class="mark ok" style="top:61.728%" viewBox="0 -960 960 960" aria-label="understood"><title>DashiellHammett: silly hyperbole</title><path d="M382-240 154-468l57-57 171 171 367-367 57 57-424 424Z"/></svg>
    <svg class="mark ok" style="top:73.572%" viewBox="0 -960 960 960" aria-label="understood"><title>PeteeWheatStraw: nothing makes anything higher</title><path d="M382-240 154-468l57-57 171 171 367-367 57 57-424 424Z"/></svg>
    <svg class="mark ok" style="top:92.987%" viewBox="0 -960 960 960" aria-label="understood"><title>Future_Different: a global increase, thirty seconds</title><path d="M382-240 154-468l57-57 171 171 367-367 57 57-424 424Z"/></svg>
  </div></div>
<script>
  // 0: zoomed in on the top · 1: the whole thread, scaled to fill the band between the chrome
  const wrap = document.getElementById('wrap'), view = document.querySelector('.view'), H = 2153, W = 570;
  let at = 0;
  function place() {
    const s = at ? Math.min(1, view.clientHeight / (wrap.offsetWidth * H / W)) : 1;
    wrap.style.setProperty('--s', s.toFixed(5));
    document.body.style.setProperty('--inv', (1 / s).toFixed(5));
    document.body.classList.toggle('whole', at === 1);
  }
  place();
  addEventListener('resize', place);
  window.presoNext = () => { if (at) return false; at = 1; place(); return true; };
  window.presoPrev = () => { if (!at) return false; at = 0; place(); return true; };
  window.presoState = () => at;
  window.presoRestore = n => {
    document.body.classList.add('snap'); at = n > 0 ? 1 : 0; place();
    void wrap.offsetWidth; requestAnimationFrame(() => document.body.classList.remove('snap'));
    setTimeout(() => document.body.classList.remove('snap'), 60);
  };
</script>
</body>
