<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>05</title>
<!-- Mohawk Carnival + Via swatch books — FULL SIZE: covers the whole viewport
     edge to edge (object-fit: cover; crops to fill, never letterboxes). -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }
</style>
</head>
<body>
  <img src="assets/mohawk-swatchbooks.webp" alt="Mohawk Carnival + Via paper system — Felt swatch wheel, cover, and Quick Spec color index">
</body>
