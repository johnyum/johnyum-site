<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12f1</title>
<!-- TRIPS, LIVE — straight after the A.I. card. OUT OF THE RUNNING ORDER since 2026-10-05 (John: "remove the trip creator
     globe… I don't think it's relevant anymore"); the file stays, off the manifest.

     IT IS THE BUILD, NOT A PICTURE OF IT. The frame loads /trips/, which
     vercel.json rewrites to the Trip Creator's own deployment, so what is on
     the stage is the app running: its globe is a real canvas, its map is the
     same Mapbox the Explore concept borrowed its recipe from. Nothing here is
     exported, so nothing here can go stale.

     THAT MEANS IT NEEDS THE NETWORK, and more of it than the other slides —
     this is a whole application on another origin, not a file on this server.
     It is also the one thing in the deck that cannot be made to fall back to a
     still, because a still of it would be the picture this deliberately is not.

     LOCALLY IT IS BLANK. The rewrite lives in vercel.json, so /trips/ only
     resolves in production; a local run of the deck shows an empty device.
     That is expected, and is not a fault to go chasing.

     NO FRAME. It had the device 09b and 09c use — the 32px stroke, the 112px
     radius, the drop shadow — and the frame was the thing you saw: a picture
     of a browser with an app inside it, rather than the app. The page's own
     background is white and so is the stage, so with the stroke gone the two
     are the same surface and the globe is simply floating in the middle of
     the screen (John, 2026-09-30).

     IT RUNS AT THE STAGE'S OWN SIZE, not at a design viewport scaled down.
     The other live slides pin a 1512 x 977 page and scale it, which is right
     when the frame around it has to measure the same as its neighbours'; with
     no frame there is nothing to match, and letting the app lay itself out to
     the real viewport keeps its type at native resolution instead of
     resampled. It is responsive, so it takes whatever the stage gives it.

     THE SIGN-IN FURNITURE IS HIDDEN. The Airbnb mark on the left and the Trips
     button and avatar on the right are the parts of the page that are about
     having an account rather than about the work; they come off, and the
     search pills and city tabs stay, because those are the product. /trips/ is
     a rewrite rather than a redirect, so the app is served from this origin
     and a stylesheet can be put into it from here without touching its own
     deployment.

     IT IS LIVE, AND MEANT TO BE TOUCHED: the search can be tapped and typed
     into. That needs presoInteractive, which costs the full-stage tap — see
     the note by it in the script.

     No builds of its own. The deck pushes it in from the right and off to the
     left. -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .slide { height: 100%; }
  /* No border, no radius, no shadow: the app's white and the stage's white
     are one surface, and the globe floats on it. */
  /* CLEAR OF THE CHROME. Full-bleed, the app's search pills landed directly
     under the deck's own kicker at top centre, one piece of type printed over
     another. The frame is inset by the band Hello! and A.I. keep — 76px top
     and bottom, which is 32px of air past the kicker and the section nav — and
     since the app's white and the stage's white are one surface, the inset is
     invisible: the globe still floats, it just no longer collides. */
  .page {
    display: block;
    width: 100%;
    height: calc(100% - 152px);
    margin-top: 76px;
    border: 0;
    background: #fff;
  }
</style>
</head>
<body>
  <div class="slide">
    <iframe class="page" id="page" title="Trip Creator, running"
            src="/trips/" scrolling="no"></iframe>
  </div>
<script>
(() => {
  const page = document.getElementById('page');

  // THE SIGN-IN FURNITURE COMES OFF. /trips/ is a rewrite, not a redirect, so
  // the app is served from this origin and its document is reachable from
  // here — a stylesheet can be put into it without touching its deployment,
  // which is a separate project this repo only proxies.
  //
  // VISIBILITY, NOT DISPLAY. The header is a flex row and those two are its
  // outer children; taking them out of flow would let the search pills and
  // the city tabs slide outward and re-centre, which is a different header
  // from the one that was designed. Hidden in place, every remaining piece
  // stays exactly where it belongs.
  //
  // .ah-mid and .ah-pills are deliberately left alone: the search pills are
  // the thing to be tapped, and the tabs are the product.
  const CHROME = '.app-header .ah-lead, .app-header .ah-right' +
                 ' { visibility: hidden !important; }';
  function strip() {
    try {
      const d = page.contentDocument; if (!d || !d.head) return false;
      if (d.getElementById('preso-strip')) return true;
      const st = d.createElement('style');
      st.id = 'preso-strip';
      st.textContent = CHROME;
      d.head.appendChild(st);
      return true;
    } catch (_) { return false; }   // cross-origin one day: leave the app alone
  }
  page.addEventListener('load', strip);
  // The app paints its header after its own boot, so this is asked for a few
  // times rather than once. A style tag survives re-renders, so once is enough
  // — the retries are only about being early.
  const t0 = Date.now();
  (function ask() { if (strip()) return; if (Date.now() - t0 < 8000) setTimeout(ask, 150); })();

  // THE SEARCH IS MEANT TO BE USED. The deck's tap rails are fixed across the
  // whole stage at z-index 10, so without this nothing here ever sees a
  // pointer — the pills could not be tapped and the field could not be typed
  // into. This shrinks them to 32px strips at the edges, the deck's own
  // provision for a slide whose surface is live (13, 12b, 12c and 12d take it
  // too). Tapping the middle of this slide no longer advances it; the arrows,
  // the clicker and the edge rails do.
  window.presoInteractive = true;

  window.presoNext = () => false;             // no builds
  window.presoPrev = () => false;
  window.presoState = () => 0;
  window.presoRestore = () => {};
})();
</script>
</body>
</html>
