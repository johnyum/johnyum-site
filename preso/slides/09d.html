<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09d</title>
<!-- THE SERVICE FEE CHANGE — four screens of the flow that moved hosts onto a
     single 15.5% fee: the required action, the fee explained, the price
     adjustment offered, and the confirmation on the calendar.

     NO ANIMATION OF ITS OWN. The deck pushes it in from the right and off to
     the left, and that is the whole movement. This used to rise and fade as it
     arrived, which ran at the same time as the push and read as a diagonal —
     the slide coming in from the bottom right rather than the side. Gone, and
     with it the script that drove it: nothing to reveal means nothing that can
     fail to reveal.

     THE SIZE AND THE SPACING ARE THE FOUR-UP CALENDAR'S. Slide 13 stands its
     single, list, year and day phones on 76% of the width with 48px between
     them, scaled down from a base of min(80vh, 1080px). Matching both means a
     phone here is the same size as a phone there, and the gaps are the same
     gaps — measured side by side, 268x548 against 268x547. -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .slide { height: 100%; display: grid; place-items: center; }

  .row {
    display: flex;
    align-items: center;
    justify-content: center;
    /* THE FOUR-UP CALENDAR'S SIZING, EXACTLY. Slide 13 lays its four phones with
         GAP[4] = 48        SHARE[4] = 0.76
         s4 = min(1, (innerWidth * 0.76 - 3 * 48) / (4 * W))
       off a base phone of min(80vh, 1080px), where W is that phone's width.

       CSS cannot divide by a length, so a unitless s4 is not expressible here.
       Solving for the final height instead is the same arithmetic: four phones
       plus three 48px gaps fill 76vw, so

         h * 0.4895 * 4 + 144px = 76vw   ->   h = (76vw - 144px) / 1.958

       and min() caps it at the unscaled phone, which is what s4's min(1, ...)
       does. 0.4895 is this export's aspect; 1.958 is 4 x that. */
    gap: 48px;
    --phone-h: min(80vh, 1080px, calc((76vw - 144px) / 1.958));
  }
  /* THE FEE, ANIMATED (John, 2026-10-03): the second phone is live — it opens on "2 of 7" (both bars grey) and one tap plays it to
     "3 of 7": the dotted line draws across the left bar, "Service fee $3" comes in above it, the bar fills from the bottom up to
     the line in the pink gradient, and "You earn $97" arrives. Built off John's two frames: the 2-of-7 frame underneath, and each
     part that differs in the 3-of-7 frame laid over it, clipped to that part, and revealed in turn (the fill from a clean plate of
     the pink, its words rebuilt from the rows above and below, so "You earn $97" can come in after the fill). In the deck's drawn
     iPhone (12a1's / 13's), sized to the export phones beside it. */
  .hof { position: relative; height: var(--phone-h); aspect-ratio: 900 / 1840; flex: none; }
  .hof .scr { position: absolute; left: 5.4444%; top: 2.5543%; width: 89.1111%; height: 94.8913%; border-radius: 15.9601% / 7.3310%; overflow: hidden; background: #fff; z-index: 1; }
  .hof .scr img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .hof .chrome { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
  /* each piece of the 3-of-7 frame, clipped to itself (percentages of the 393 x 852 frame), kept inside the bar's edge (x 48–184) so
     no pink edge pixel ever shows on the grey. Forward and back have their own timings: forward the line, the label, the fill, then
     the words; back the words leave first, then the fill drains, then the line and the label go. */
  .hof .head  { clip-path: inset(21.4% 0 71.6% 0); opacity: 0; transition: opacity .35s ease .55s; }
  .hof .step  { clip-path: inset(9.5% 40% 88.5% 40%); opacity: 0; transition: opacity .3s ease .55s; }
  /* the label comes in with the bar's whole top cap (its rounded top down to the dotted line), not a box round the words: the two
     frames' cap greys differ by a shade, and a box showed as a band */
  .hof .label { clip-path: inset(45.54% 52.6% 47.30% 11.6%); opacity: 0; transition: opacity .25s ease .45s; }
  .hof .fill  { clip-path: inset(77.7% 52.6% 22.3% 11.6%); transition: clip-path .5s cubic-bezier(.4,0,.2,1) .15s; }
  .hof .earn  { clip-path: inset(64.4% 53.2% 33.6% 12.3%); opacity: 0; transform: translateY(2%); transition: opacity .15s ease, transform .2s ease; }
  /* the dotted line, drawn: 1px of #2b2b2b in 4px dashes and 4px gaps, as the frame draws it (8/138 of the bar's width per dash) */
  .hof .dash  { position: absolute; left: 11.96%; right: 52.93%; top: 52.70%; height: .2%; z-index: 3;
                background: linear-gradient(90deg, #2b2b2b 50%, transparent 50%) left / 5.797% 100% repeat-x;
                clip-path: inset(0 100% 0 0); transition: clip-path .3s ease .4s; }
  .hof.on .head  { opacity: 1; transition: opacity .45s ease; }
  .hof.on .step  { opacity: 1; transition: opacity .3s ease; }
  .hof.on .label { opacity: 1; transition: opacity .4s ease .35s; }
  .hof.on .dash  { clip-path: inset(0 0 0 0); transition: clip-path .5s cubic-bezier(.4,0,.2,1) .25s; }
  .hof.on .fill  { clip-path: inset(52.93% 52.6% 22.3% 11.6%); transition: clip-path .75s cubic-bezier(.3,0,.2,1) .8s; }
  .hof.on .earn  { opacity: 1; transform: none; transition: opacity .4s ease 1.55s, transform .5s cubic-bezier(.2,.8,.2,1) 1.55s; }
  .hof.snap * { transition: none !important; }
  /* THE TAG, ANIMATED (John, 2026-10-03): the third phone's price tag is the closing slide's own tag (09e: price-modal.mp4, the
     still tag its first and last frame), laid exactly over the still one — its ink 136 x 141 at 421,468 on the 979 x 2000 export,
     the video's 629 x 660 at 181,173 in its 1000 square, so 0.2149 of it — on the screen's white, which is the video's own. It
     plays once the fee's graph has finished, never before. */
  .adj { position: relative; height: var(--phone-h); aspect-ratio: 979 / 2000; flex: none; }
  .adj img { height: 100%; width: 100%; }
  .adj video { position: absolute; left: 39.030%; top: 21.541%; width: 21.951%; height: 10.745%; display: block; }
  .row img {
    height: var(--phone-h);
    width: auto;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="rail" x1="16" y1="0" x2="884" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#8f8f8c"/><stop offset="0.035" stop-color="#ececea"/>
        <stop offset="0.10" stop-color="#bfbfbc"/><stop offset="0.50" stop-color="#f2f2f0"/>
        <stop offset="0.90" stop-color="#bfbfbc"/><stop offset="0.965" stop-color="#ececea"/>
        <stop offset="1" stop-color="#8f8f8c"/>
      </linearGradient>
      <clipPath id="outsideBezel" clipPathUnits="userSpaceOnUse">
        <path clip-rule="evenodd" d="M-60,-60 H960 V1900 H-60 Z M177,28 H723 A147,147 0 0 1 870,175 V1665 A147,147 0 0 1 723,1812 H177 A147,147 0 0 1 30,1665 V175 A147,147 0 0 1 177,28 Z"/>
      </clipPath>
    </defs>
  </svg>
  <div class="slide">
    <div class="row">
      <img src="assets/fee-required.webp" width="979" height="2000"
           alt="Required actions: we're simplifying service fees, action required by January 17">
      <div class="hof" id="hof" aria-label="Step 2 to 3 of 7: guests pay a service fee on top; a host service fee is deducted, you earn $97">
        <div class="scr">
          <img src="assets/hof-2of7.webp" alt="" draggable="false">
          <img class="head"  src="assets/hof-3of7.webp" alt="" draggable="false">
          <img class="step"  src="assets/hof-3of7.webp" alt="" draggable="false">
          <img class="label" src="assets/hof-3of7.webp" alt="" draggable="false">
          <img class="fill"  src="assets/hof-3of7-plate.webp" alt="" draggable="false">
          <div class="dash"></div>
          <img class="earn"  src="assets/hof-3of7.webp" alt="" draggable="false">
        </div>
        <svg class="chrome" viewBox="0 0 900 1840" fill="none" aria-hidden="true"><path fill="url(#rail)" fill-rule="evenodd" d="M177,14 H723 A161,161 0 0 1 884,175 V1665 A161,161 0 0 1 723,1826 H177 A161,161 0 0 1 16,1665 V175 A161,161 0 0 1 177,14 Z M177,28 H723 A147,147 0 0 1 870,175 V1665 A147,147 0 0 1 723,1812 H177 A147,147 0 0 1 30,1665 V175 A147,147 0 0 1 177,28 Z"/><image href="assets/device/iphone-frame.png" x="0" y="0" width="900" height="1840" clip-path="url(#outsideBezel)" preserveAspectRatio="none"/><path fill="#0b0b0b" fill-rule="evenodd" d="M177,27 H723 A148,148 0 0 1 871,175 V1665 A148,148 0 0 1 723,1813 H177 A148,148 0 0 1 29,1665 V175 A148,148 0 0 1 177,27 Z M177,47 H723 A128,128 0 0 1 851,175 V1665 A128,128 0 0 1 723,1793 H177 A128,128 0 0 1 49,1665 V175 A128,128 0 0 1 177,47 Z"/><rect x="322" y="69" width="256" height="74" rx="37" fill="#000"/><circle cx="529" cy="106" r="12.7" fill="#0f1420"/><circle cx="529" cy="106" r="5.3" fill="#243046"/></svg>
      </div>
      <div class="adj">
        <img src="assets/fee-adjust.webp" width="979" height="2000"
           alt="Step 6 of 7: let's adjust your prices, so earnings stay the same">
        <video id="adjTag" muted playsinline preload="auto" poster="assets/price-tag.webp" src="assets/price-modal.mp4" aria-hidden="true"></video>
      </div>
      <img src="assets/fee-complete.webp" width="979" height="2000"
           alt="Price adjustment complete, confirmed on the host calendar">
    </div>
  </div>
<script>
  // the tag plays only once the fee's graph has finished (John, 2026-10-03) — not as the slide lands: the tap starts the graph, the
  // You earn line is the last of it to arrive (1.55s in, .5s to settle), and the tag goes a beat after that. Back stops it on its first
  // frame, which is the still tag, ready to play again.
  const tag = (() => {
    const v = document.getElementById('adjTag'); let t = 0;
    const play = () => { try { v.currentTime = 0; const p = v.play(); if (p && p.catch) p.catch(() => { try { v.currentTime = v.duration - 0.01; } catch (_) {} }); } catch (_) {} };
    return { after: ms => { clearTimeout(t); t = setTimeout(play, ms); }, reset: () => { clearTimeout(t); try { v.pause(); v.currentTime = 0; } catch (_) {} } };
  })();
  // one build: the tap plays the fee from 2 of 7 to 3 of 7; Back plays it back; arriving backwards it stands at 3 of 7
  (() => {
    const h = document.getElementById('hof'); let on = false;
    const set = (v, instant) => { on = v; if (instant) h.classList.add('snap'); h.classList.toggle('on', v); if (instant) { void h.offsetWidth; requestAnimationFrame(() => h.classList.remove('snap')); } };
    window.presoNext = () => { if (on) return false; set(true); tag.after(2200); return true; };
    window.presoPrev = () => { if (!on) return false; set(false); tag.reset(); return true; };
    window.presoEnd = () => set(true, true);
    window.presoState = () => on ? 1 : 0;
    window.presoRestore = n => set(n > 0, true);
  })();
</script>
</body>
</html>
