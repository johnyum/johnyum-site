<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09d</title>
<!-- THE SERVICE FEE CHANGE — four screens of the flow that moved hosts onto a
     single 15.5% fee: the required action, the fee explained, the price
     adjustment offered, and the confirmation on the calendar.

     ALL FOUR AT ONCE. No stagger, no build: they are one flow, so they arrive
     as one thing and the story is told over them.

     THE PHONE HEIGHT IS THE CALENDAR BUILD'S. 12d sizes its device with
     --phone-h: min(80vh, 1080px); this uses the same expression, so a phone is
     the same height here as it is when the live calendar comes up later in the
     deck. Four of them at 0.4895 aspect need 4 x 0.4895 x that height plus the
     gaps, so on a short, wide window the width cap takes over and they shrink
     together rather than overflowing.

     The reveal is set INLINE and SYNCHRONOUSLY, and waits on a stage check that
     asks the DECK's window for computed style. All three matter — see 09b:
     a class added while the deck has the slide parked is never recalculated,
     requestAnimationFrame does not run in a parked iframe, and the child
     frame's getComputedStyle reports a parent node hidden forever. Any one of
     them leaves this slide blank on stage. -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .slide { height: 100%; display: grid; place-items: center; }

  .row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 1.5vw, 28px);
    /* The height the calendar build gives its phone, capped so four of them
       never run past the sides. 0.4895 is the export's aspect. */
    --phone-h: min(80vh, 1080px, calc((94vw - 3 * clamp(8px, 1.5vw, 28px)) / 4 / 0.4895));
  }
  .row img {
    height: var(--phone-h);
    width: auto;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
    opacity: 0;
    transform: translateY(32px);
    transition: opacity 660ms ease, transform 820ms cubic-bezier(0.16, 1, 0.3, 1);
    will-change: opacity, transform;
  }
  @media (prefers-reduced-motion: reduce) {
    .row img { transition: opacity 240ms linear; transform: none !important; }
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="row">
      <img src="assets/fee-required.webp" width="979" height="2000"
           alt="Required actions: we're simplifying service fees, action required by January 17">
      <img src="assets/fee-single.webp" width="979" height="2000"
           alt="Step 4 of 7: combining both fees into a single 15.5% fee paid by hosts, with a bar comparison">
      <img src="assets/fee-adjust.webp" width="979" height="2000"
           alt="Step 6 of 7: let's adjust your prices, so earnings stay the same">
      <img src="assets/fee-complete.webp" width="979" height="2000"
           alt="Price adjustment complete, confirmed on the host calendar">
    </div>
  </div>
<script>
(() => {
  const shots = [...document.querySelectorAll('.row img')];
  let armed = false;

  // Inline and synchronous. rAF does not run in a parked iframe, so scheduling
  // the change inside one means a reveal reached while parked sets armed and
  // then applies nothing — blank for good.
  function reveal() {
    if (armed) return;
    armed = true;
    shots.forEach(el => {
      el.style.opacity = '1';
      el.style.transform = 'translateY(0)';
    });
  }

  function shown() {
    try {
      const fe = window.frameElement;
      if (!fe) return true;                       // opened on its own
      const deck = fe.ownerDocument.defaultView;  // the DECK's window, not this one
      for (let n = fe; n && n.nodeType === 1; n = n.parentElement) {
        const cs = deck.getComputedStyle(n);
        // prepare() parks at visibility:hidden, a kept slide at display:none;
        // both still report a box, so width alone says yes far too early.
        if (cs.display === 'none' || cs.visibility === 'hidden') return false;
      }
      return fe.getBoundingClientRect().width > 0;
    } catch (_) { return true; }
  }
  addEventListener('presoshown', reveal);
  const t0 = Date.now();
  (function watch() {
    if (armed) return;
    if (shown() || Date.now() - t0 > 10000) { reveal(); return; }
    setTimeout(watch, 100);
  })();

  window.presoNext = () => false;                 // no builds
  window.presoPrev = () => false;
  window.presoState = () => 0;
  window.presoRestore = () => {};
})();
</script>
</body>
</html>
