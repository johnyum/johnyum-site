<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10</title>
<!-- The Transportation chapter title. Same card as Luxé (08) — one word,
     sentence case, Anton, centred — but thirteen letters instead of four, so
     the size is driven by WIDTH rather than by slide 01's 'Hello!'. The word
     holds a 6vw gutter each side at every viewport; the 320px ceiling is the
     same ceiling the other titles carry, it just never gets reached here.
     No build: the deck pushes it in from the right. -->
<style>
  @font-face {
    font-family: "Anton";
    src: url("../fonts/Anton.woff2") format("woff2");
    font-weight: 400;
    font-display: block;
  }
  html, body {
    margin: 0; height: 100%;
    background: #fff; color: #111;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .slide { height: 100%; display: grid; place-items: center; }
  h1 {
    font-family: "Anton", "Helvetica Neue", sans-serif;
    font-weight: 400;
    font-size: clamp(40px, 13.2vw, 320px);
    line-height: 1;
    letter-spacing: -0.02em;   /* -2% */
    margin: 0;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="slide">
    <h1>Transportation</h1>
  </div>
</body>
</html>
