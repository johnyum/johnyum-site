<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>02</title>
<!-- I'm John Yum and / I love to design. — after a beat the o in love keeps getting
     added on, accelerating: Love → Loove → Looove → … Loooooooooove.
     Type is sized so the fully-grown line still fits on one line. -->
<style>
  @font-face {
    font-family: "Anton";
    src: url("../fonts/Anton.woff2") format("woff2");
    font-weight: 400;
    font-display: block;
  }
  html, body {
    margin: 0; height: 100%;
    background: #fff; color: #111;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .slide {
    height: 100%;
    display: grid;
    place-items: center;
  }
  /* the growing Love — starts black; the script walks it to #FF0000,
     one shade per added o, and it stays red after the rewind */
  .rl { color: #111; }
  h1 {
    font-family: "Anton", "Helvetica Neue", sans-serif;
    font-weight: 400;
    font-size: clamp(56px, 9vw, 120px);
    line-height: 1.1;
    text-align: center;
    letter-spacing: -0.02em;   /* -2% */
    margin: 0;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="slide">
    <h1>I&rsquo;m John Yum and<br>I <span class="rl">L<span id="o">o</span>ve</span> to design.</h1>
  </div>
<script>
(() => {
  const o = document.getElementById('o');
  const rl = document.querySelector('.rl');
  const MAX = 10;                 // Love -> Loooooooooove
  // black #111 -> red #FF0000, one shade per added o
  const shade = n => {
    const t = (n - 1) / (MAX - 1);
    const r = Math.round(17 + (255 - 17) * t);
    const g = Math.round(17 * (1 - t));
    return 'rgb(' + r + ',' + g + ',' + g + ')';
  };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    rl.style.color = shade(MAX);          // ends: 'Love', red
    return;
  }
  let n = 1, delay = 240;
  setTimeout(function grow() {
    n++;
    o.textContent = 'o'.repeat(n);
    rl.style.color = shade(n);
    if (n < MAX) {
      delay = Math.max(80, delay * 0.86);
      setTimeout(grow, delay);
    } else {
      // fully red. take a beat, then rewind QUICK — the red stays.
      setTimeout(function shrink() {
        n--;
        o.textContent = 'o'.repeat(n);
        if (n > 1) setTimeout(shrink, 40);
      }, 800);
    }
  }, 1100);
})();
</script>
</body>
</html>
