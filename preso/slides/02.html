<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>02</title>
<!-- I'm John Yum and / I love to design. — after a beat the o in love keeps getting
     added on, accelerating: Love → Loove → Looove → … Loooooooooove.
     Type is sized so the fully-grown line still fits on one line. -->
<style>
  @font-face {
    font-family: "Anton";
    src: url("../fonts/Anton.woff2") format("woff2");
    font-weight: 400;
    font-display: block;
  }
  html, body {
    margin: 0; height: 100%;
    background: #fff; color: #111;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .slide {
    height: 100%;
    display: grid;
    place-items: center;
  }
  /* an arriving love: the slot widens while the word rises in — then the DOM
     is flattened back to plain text so the settled line is pixel-perfect */
  .lvwrap {
    display: inline-block;
    overflow: hidden;
    max-width: 0;
    white-space: pre;
    vertical-align: text-bottom;
  }
  .lvword {
    display: inline-block;
    opacity: 0;
    transform: translateY(0.28em);
  }
  /* the Loves — rausch: vibrant love-red against the black type */
  #l { color: #FF385C; }
  h1 {
    font-family: "Anton", "Helvetica Neue", sans-serif;
    font-weight: 400;
    font-size: clamp(56px, 9vw, 144px);
    line-height: 1.1;
    text-align: center;
    letter-spacing: -0.02em;   /* -2% */
    margin: 0;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="slide">
    <h1>I&rsquo;m John Yum and<br>I <span id="l">Love</span> to design.</h1>
  </div>
<script>
(() => {
  const l = document.getElementById('l');
  const MAX = 3;                  // Love -> Love Love -> Love Love Love
  const EASE = 'cubic-bezier(0.16, 1, 0.3, 1)';   // same landing feel as the deck
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    l.textContent = Array(MAX).fill('Love').join(' ');
    return;
  }
  let n = 1;
  function drop() {
    n++;
    // measure the slot the new word needs, in place, invisibly
    const probe = document.createElement('span');
    probe.style.visibility = 'hidden';
    probe.style.whiteSpace = 'pre';
    probe.textContent = ' Love';
    l.appendChild(probe);
    const w = probe.getBoundingClientRect().width;
    probe.remove();
    // the slot widens while the word rises in
    const wrap = document.createElement('span');
    wrap.className = 'lvwrap';
    const word = document.createElement('span');
    word.className = 'lvword';
    word.textContent = ' Love';
    wrap.appendChild(word);
    l.appendChild(wrap);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      wrap.style.transition = 'max-width 480ms ' + EASE;
      wrap.style.maxWidth = Math.ceil(w) + 'px';
      word.style.transition = 'opacity 360ms ease-out 80ms, transform 480ms ' + EASE + ' 80ms';
      word.style.opacity = '1';
      word.style.transform = 'translateY(0)';
    }));
    setTimeout(() => {
      // flatten: the settled line is plain text again, baselines exact
      l.textContent = Array(n).fill('Love').join(' ');
      if (n < MAX) setTimeout(drop, 200);
    }, 620);
  }
  setTimeout(drop, 1100);
})();
</script>
</body>
</html>
