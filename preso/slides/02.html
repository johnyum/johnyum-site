<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>02</title>
<!-- I'm John Yum and / I love to design. — after a beat the o in love keeps getting
     added on, accelerating: Love → Loove → Looove → … Loooooooooove.
     Type is sized so the fully-grown line still fits on one line. -->
<style>
  @font-face {
    font-family: "Anton";
    src: url("../fonts/Anton.woff2") format("woff2");
    font-weight: 400;
    font-display: block;
  }
  html, body {
    margin: 0; height: 100%;
    background: #fff; color: #111;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .slide {
    height: 100%;
    display: grid;
    place-items: center;
  }
  /* the I + Loves — a true vibrant red, and the 2nd/3rd Love fade in, in place */
  .rl { color: #FF1E1E; }
  .lv { opacity: 0; transition: opacity 480ms ease; }
  .lv.in { opacity: 1; }
  h1 {
    font-family: "Anton", "Helvetica Neue", sans-serif;
    font-weight: 400;
    font-size: clamp(56px, 9vw, 144px);
    line-height: 1.1;
    text-align: center;
    letter-spacing: -0.02em;   /* -2% */
    margin: 0;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="slide">
    <h1>I&rsquo;m John Yum and<br><span class="rl">I Love</span><span class="rl lv"> Love</span><span class="rl lv"> Love</span> to design.</h1>
  </div>
<script>
(() => {
  const loves = [...document.querySelectorAll('.lv')];
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    loves.forEach(el => el.classList.add('in'));
    return;
  }
  // land, hold the beat, then each Love dissolves in
  setTimeout(() => loves[0].classList.add('in'), 1100);
  setTimeout(() => loves[1].classList.add('in'), 1660);
})();
</script>
</body>
</html>
