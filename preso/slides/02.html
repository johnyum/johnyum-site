<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>02</title>
<!-- I'm John Yum and / I love design — after a beat the o in love keeps getting
     added on, accelerating: Love → Loove → Looove → … Loooooooooove.
     Type is sized so the fully-grown line still fits on one line. -->
<style>
  @font-face {
    font-family: "Anton";
    src: url("../fonts/Anton.woff2") format("woff2");
    font-weight: 400;
    font-display: block;
  }
  html, body {
    margin: 0; height: 100%;
    background: #fff; color: #111;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .slide {
    height: 100%;
    display: grid;
    place-items: center;
  }
  h1 {
    font-family: "Anton", "Helvetica Neue", sans-serif;
    font-weight: 400;
    font-size: clamp(56px, 9vw, 144px);
    line-height: 1.1;
    text-align: center;
    letter-spacing: -0.02em;   /* -2% */
    margin: 0;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="slide">
    <h1>I&rsquo;m John Yum and<br>I <span id="l">love</span> design</h1>
  </div>
<script>
(() => {
  const l = document.getElementById('l');
  const MAX = 3;                  // love -> love love -> love love love
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    l.textContent = Array(MAX).fill('love').join(' ');
    return;
  }
  // the deck pushes this slide in over ~640ms after load — hold the beat,
  // then drop the second and third love in
  let n = 1;
  setTimeout(function tick() {
    n++;
    l.textContent = Array(n).fill('love').join(' ');
    if (n < MAX) setTimeout(tick, 560);
  }, 1100);
})();
</script>
</body>
</html>
