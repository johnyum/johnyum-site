<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>02</title>
<!-- I / Love / design — three stacked lines; after a beat the o in Love keeps getting
     added on, accelerating: Love → Loove → Looove → … Loooooooooove.
     Type is sized so the fully-grown line still fits on one line. -->
<style>
  @font-face {
    font-family: "Anton";
    src: url("../fonts/Anton.woff2") format("woff2");
    font-weight: 400;
    font-display: block;
  }
  html, body {
    margin: 0; height: 100%;
    background: #fff; color: #111;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .slide {
    height: 100%;
    display: grid;
    place-items: center;
  }
  h1 {
    font-family: "Anton", "Helvetica Neue", sans-serif;
    font-weight: 400;
    font-size: clamp(80px, 14vw, 220px);
    line-height: 1.05;
    text-align: center;
    letter-spacing: -0.02em;   /* -2% */
    margin: 0;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="slide">
    <h1>I<br>L<span id="o">o</span>ve<br>design</h1>
  </div>
<script>
(() => {
  const o = document.getElementById('o');
  const MAX = 10;                 // love -> loooooooooove
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    o.textContent = 'o'.repeat(MAX);
    return;
  }
  // the deck pushes this slide in over ~640ms after load — hold the beat,
  // then grow, each o landing a little sooner than the last
  let n = 1, delay = 240;
  setTimeout(function tick() {
    n++;
    o.textContent = 'o'.repeat(n);
    if (n < MAX) {
      delay = Math.max(80, delay * 0.86);
      setTimeout(tick, delay);
    }
  }, 1100);
})();
</script>
</body>
</html>
