<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>02</title>
<!-- I. Love. Design.

     Three sentences, three full stops, one line. It said "I'm John Yum and I
     Love to design" with the o in Love growing out to Loooooooooove on a
     timer; the name went (the kicker carries it on every slide) and so did the
     stretch. Stated flat, it lands harder than it did animated.

     Set small and quiet now (John, 2026-10-01): 18pt IBM Plex Mono, centred —
     the deck's mono, as on 01. No script. -->
<style>
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../fonts/IBMPlexMono-Regular.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: block;
  }
  html, body {
    margin: 0; height: 100%;
    background: #fff; color: #111;
    overflow: hidden;
  }
  .slide {
    height: 100%;
    display: grid;
    place-items: center;
  }
  h1 {
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-weight: 400;
    font-size: 18px;
    line-height: 1.4;
    text-align: center;
    margin: 0;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="slide">
    <h1>I. Love. Design.</h1>
  </div>
</body>
</html>
