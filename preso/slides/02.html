<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>02</title>
<!-- I'm John Yum and / I love to design. — after a beat the o in love keeps getting
     added on, accelerating: Love → Loove → Looove → … Loooooooooove.
     Type is sized so the fully-grown line still fits on one line. -->
<style>
  @font-face {
    font-family: "Anton";
    src: url("../fonts/Anton.woff2") format("woff2");
    font-weight: 400;
    font-display: block;
  }
  html, body {
    margin: 0; height: 100%;
    background: #fff; color: #111;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .slide {
    height: 100%;
    display: grid;
    place-items: center;
  }
  h1 {
    font-family: "Anton", "Helvetica Neue", sans-serif;
    font-weight: 400;
    font-size: clamp(56px, 9vw, 120px);
    line-height: 1.1;
    text-align: center;
    letter-spacing: -0.02em;   /* -2% */
    margin: 0;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="slide">
    <h1>I&rsquo;m John Yum and<br>I L<span id="o">o</span>ve to design.</h1>
  </div>
<script>
(() => {
  const o = document.getElementById('o');
  const MAX = 10;                 // Love -> Loooooooooove
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;   // rests as 'Love'
  let n = 1;
  setTimeout(function grow() {
    n++;
    o.textContent = 'o'.repeat(n);
    if (n < MAX) {
      setTimeout(grow, 40);       // grows as fast as it collapses
    } else {
      // full stretch. take a beat, then rewind QUICK.
      setTimeout(function shrink() {
        n--;
        o.textContent = 'o'.repeat(n);
        if (n > 1) setTimeout(shrink, 40);
      }, 800);
    }
  }, 1100);
})();
</script>
</body>
</html>
