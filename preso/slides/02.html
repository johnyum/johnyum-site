<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>02</title>
<!-- I. Love. Design.

     Three sentences, three full stops, one line. It said "I'm John Yum and I
     Love to design" with the o in Love growing out to Loooooooooove on a
     timer; the name went (the kicker carries it on every slide) and so did the
     stretch. Stated flat, it lands harder than it did animated.

     Set small and quiet now (John, 2026-10-01): 32pt IBM Plex Mono, centred (18 at first) —
     the deck's mono, as on 01. One tap adds the family: see .more. -->
<style>
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../fonts/IBMPlexMono-Regular.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: block;
  }
  html, body { margin: 0; height: 100%; background: #fff; color: #111; overflow: hidden; }
  .slide { height: 100%; display: grid; place-items: center; }
  h1 {
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-weight: 400; font-size: 40px; line-height: 1.4;
    margin: 0; white-space: nowrap;
    display: flex; align-items: center;
  }
  /* ONE BUILD (John, 2026-10-01): the tap adds "&" and the three of them, wife, daughter and dog, as 56px avatars with
     8px corners, on the line. The tail opens from nothing, so the centred line slides left to make room rather than
     jumping; then the faces come up one after another. */
  .more {
    display: flex; align-items: center;
    max-width: 0; overflow: hidden; opacity: 0; padding: 16px 0;   /* room for the tilt and the shadow inside the clip */
    transition: max-width 600ms cubic-bezier(0.16, 1, 0.3, 1), opacity 200ms ease;
  }
  body.more-on .more { max-width: 600px; opacity: 1; }
  .more .amp { margin: 0 36px 0 0.6ch; }   /* 36 after the & (John, 2026-10-01) */
  /* DANCING (John, 2026-10-01): a white stroke round each, overlapping, tipped 8° one way and −8° the next — photos
     on a fridge, mid-step. A soft shadow so the white stroke reads on the white page. */
  .more img {
    width: 64px; height: 64px; border-radius: 8px;   /* 64 (John; 56, then 80) */ display: block; flex: none; box-sizing: border-box;
    border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
    margin-left: -14px; position: relative;
    opacity: 0; transform: rotate(0deg) scale(0.6);
    transition: opacity 260ms ease, transform 420ms cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .more img:first-of-type { margin-left: 0; }
  body.more-on .more img { opacity: 1; }
  body.more-on .more img:nth-of-type(odd)  { transform: rotate(-8deg) scale(1); }
  body.more-on .more img:nth-of-type(even) { transform: rotate(8deg) scale(1); }
  body.more-on .more img:nth-of-type(1) { transition-delay: 260ms; }
  body.more-on .more img:nth-of-type(2) { transition-delay: 360ms; }
  body.more-on .more img:nth-of-type(3) { transition-delay: 460ms; }
</style>
</head>
<body>
  <div class="slide">
    <h1><span>I. Love. Design.</span><span class="more"><span class="amp">&amp;</span><img src="assets/family/wife.jpg" alt="John's wife"><img src="assets/family/daughter.jpg" alt="John's daughter, Roma"><img src="assets/family/dog.jpg" alt="John's dog"></span></h1>
  </div>
<script>
  let step = 0;
  const set = n => { step = n; document.body.classList.toggle('more-on', n > 0); };
  window.presoNext = () => { if (step >= 1) return false; set(1); return true; };
  window.presoPrev = () => { if (step === 0) return false; set(0); return true; };
  window.presoState = () => step;
  window.presoRestore = n => { if (n > 0) set(1); };
</script>
</body>
</html>
