<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12a</title>
<!-- WHY THE CALENDAR (John, 2026-10-01) — straight after the Host calendar card, the context a room that has never
     hosted needs before the studies and the build: what the calendar is, what one night on it carries, why the old one
     could not keep up, and what the rebuild had to do. It replaced the line "Airbnb hosts manage pricing, availability,
     and bookings all on the calendar."

     Set exactly as the host-only-fee beats (09d01): IBM Plex Mono at 18, numbered, the number hanging; the grey 12pt
     breakdown under the second beat plays the part the fee sums play there: everything a host sets, as the calendar's
     own Settings sheet groups it (Pricing, Fees, Discounts, Availability, Rules, Cancellations — read off
     multi-host-calendar-web's Settings.tsx), then what is done to the dates themselves. Four beats, John's (2026-10-01).
     No build. -->
<style>
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../fonts/IBMPlexMono-Regular.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: block;
  }
  html, body {
    margin: 0; height: 100%;
    background: #fff; color: #111;
    overflow: hidden;
  }
  .slide { height: 100%; display: grid; place-items: center; padding: 0 24px; box-sizing: border-box; }
  .copy {
    max-width: 60ch;
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-size: 18px; line-height: 1.5; text-align: left;
    text-wrap: pretty;
  }
  /* the beats, numbered, 16 between them; the number hangs so a wrapped line starts under the words */
  .beats { margin: 0; padding: 0; list-style: none; counter-reset: beat; display: flex; flex-direction: column; gap: 16px; }
  .beats li { counter-increment: beat; display: grid; grid-template-columns: 3ch 1fr; }
  .beats li::before { content: counter(beat) "."; }
  /* one night, taken apart: under the words, not the numbers, in the fee sums' grey 12 */
  .night { margin-top: 32px; padding-left: 3ch; }
  .night > div { white-space: pre; color: #8C8C8C; font-size: 12px; line-height: 1.5; }
  .night > .h { margin-bottom: 8px; }
  /* ONE RUN OF WORDS (John, 2026-10-01: "just a simple list of words with interpuncts"): every setting once, min and
     max together, promotions folded into discounts, cancellation as one word. Each · is bound to the word before it,
     so a line ends on a · and never starts with one. */
  .night .list { margin: 0; color: #8C8C8C; font-size: 12px; line-height: 1.7; text-wrap: pretty; }
  .beats.after { margin-top: 32px; counter-reset: beat 2; }
  /* THE OLD CALENDAR (John, 2026-10-02): three of its screens, 120 wide, 8 apart, under the line that says it was too
     simple — under the words, not the number — with a little rounding and a soft shadow so they read as screens */
  .old { display: flex; gap: 8px; margin-top: 16px; padding-left: 3ch; }
  .old img { width: 120px; height: auto; display: block; border-radius: 6px;
             box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.06), 0 4px 12px rgba(0, 0, 0, 0.12); }
  .beats.last { margin-top: 32px; counter-reset: beat 3; }
  /* ONE SENTENCE (John, 2026-10-03), set as the why and lesson slides are: 40, centred, broken by hand for the rag (22 / 31 / 24, the long line in the middle — "Airbnb hosts run their business on the calendar…", John, 2026-10-03 — "where every night has a price" in place of "selling nights", John, 2026-10-03).
     The four beats, the settings list and the old calendar's three screens it replaced live in preso/SCRIPT.md, said rather than
     shown; the styles above are theirs, kept for the day they come back. */
  .copy:has(.one) { max-width: none; }
  .one { margin: 0; white-space: nowrap; font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 40px; line-height: 1.3; text-align: center; }
</style>
</head>
<body>
  <div class="slide">
    <div class="copy">
      <p class="one">Airbnb hosts run their<br>business on the calendar, where<br>every night has a price.</p>
    </div>
  </div>
<script>
  window.presoNext = () => false;   // no builds
  window.presoPrev = () => false;
  window.presoState = () => 0;
  window.presoRestore = () => {};
</script>
</body>
</html>
