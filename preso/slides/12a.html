<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12a</title>
<!-- CONTEXT — the three-line setup that opens the Calendar chapter.

     The line is set in the SAME type as the work list on slide 07: Special
     Gothic Condensed One at clamp(16px, 6.1vh, 62px), so the two read as the
     same voice at the same scale, one clause per line. Named 12a so the sorted
     manifest drops it between the Host Calendar card (12) and the build (13).
     No build. -->
<style>
  @font-face {
    font-family: "Special Gothic Condensed One";
    src: url("../fonts/SpecialGothicCondensedOne.woff2") format("woff2");
    font-weight: 400;
    font-display: block;
  }
  html, body {
    margin: 0; height: 100%;
    background: #fff; color: #111;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .slide { height: 100%; display: grid; place-items: center; }
  .pm { text-align: center; }
  h1 {
    margin: 0;
    font-family: "Special Gothic Condensed One", "Helvetica Neue", sans-serif;
    font-weight: 400;
    font-size: clamp(16px, 6.1vh, 62px);   /* slide 07's list, exactly */
    line-height: 1.06;
    letter-spacing: -0.01em;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="pm">
      <h1>Airbnb hosts manage<br>pricing, availability, and bookings<br>all on the calendar.</h1>
    </div>
  </div>
</body>
</html>
