<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12a</title>
<!-- WHY THE CALENDAR (John, 2026-10-01) — straight after the Host calendar card, the context a room that has never
     hosted needs before the studies and the build: what the calendar is, what one night on it carries, why the old one
     could not keep up, and what the rebuild had to do. It replaced the line "Airbnb hosts manage pricing, availability,
     and bookings all on the calendar."

     Set exactly as the host-only-fee beats (09d01): IBM Plex Mono at 18, numbered, the number hanging; the grey 12pt
     breakdown under the second beat plays the part the fee sums play there: everything a host sets, as the calendar's
     own Settings sheet groups it (Pricing, Fees, Discounts, Availability, Rules, Cancellations — read off
     multi-host-calendar-web's Settings.tsx), then what is done to the dates themselves. Four beats, John's (2026-10-01).
     One build since 2026-10-04: "Me included." and John's own place, under the sentence (see .me). -->
<style>
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../fonts/IBMPlexMono-Regular.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: block;
  }
  html, body {
    margin: 0; height: 100%;
    background: #fff; color: #111;
    overflow: hidden;
  }
  .slide { height: 100%; display: grid; place-items: center; padding: 0 24px; box-sizing: border-box; }
  .copy {
    max-width: 60ch;
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-size: 18px; line-height: 1.5; text-align: left;
    text-wrap: pretty;
  }
  /* the beats, numbered, 16 between them; the number hangs so a wrapped line starts under the words */
  .beats { margin: 0; padding: 0; list-style: none; counter-reset: beat; display: flex; flex-direction: column; gap: 16px; }
  .beats li { counter-increment: beat; display: grid; grid-template-columns: 3ch 1fr; }
  .beats li::before { content: counter(beat) "."; }
  /* one night, taken apart: under the words, not the numbers, in the fee sums' grey 12 */
  .night { margin-top: 32px; padding-left: 3ch; }
  .night > div { white-space: pre; color: #8C8C8C; font-size: 12px; line-height: 1.5; }
  .night > .h { margin-bottom: 8px; }
  /* ONE RUN OF WORDS (John, 2026-10-01: "just a simple list of words with interpuncts"): every setting once, min and
     max together, promotions folded into discounts, cancellation as one word. Each · is bound to the word before it,
     so a line ends on a · and never starts with one. */
  .night .list { margin: 0; color: #8C8C8C; font-size: 12px; line-height: 1.7; text-wrap: pretty; }
  .beats.after { margin-top: 32px; counter-reset: beat 2; }
  /* THE OLD CALENDAR (John, 2026-10-02): three of its screens, 120 wide, 8 apart, under the line that says it was too
     simple — under the words, not the number — with a little rounding and a soft shadow so they read as screens */
  .old { display: flex; gap: 8px; margin-top: 16px; padding-left: 3ch; }
  .old img { width: 120px; height: auto; display: block; border-radius: 6px;
             box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.06), 0 4px 12px rgba(0, 0, 0, 0.12); }
  .beats.last { margin-top: 32px; counter-reset: beat 3; }
  /* ONE SENTENCE (John, 2026-10-03), set as the why and lesson slides are: 40, centred, broken by hand for the rag (22 / 31 / 24, the long line in the middle — "Airbnb hosts run their business on the calendar…", John, 2026-10-03 — "where every night has a price" in place of "selling nights", John, 2026-10-03).
     The four beats, the settings list and the old calendar's three screens it replaced live in preso/SCRIPT.md, said rather than
     shown; the styles above are theirs, kept for the day they come back. */
  .copy:has(.one) { max-width: none; }
  .one { margin: 0; white-space: nowrap; font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 40px; line-height: 1.3; text-align: center; }
  /* "ME INCLUDED." (John, 2026-10-04 — after "& me" set inside the line didn't work): the sentence stays exactly as it was, and
     one tap pops in a section of its own under it — "Me included." and John's own place beside it (the pool with the flamingo,
     assets/family/listing.webp, the middle of host-setup/listing-photo.webp cut square, clear of its baked corners), 120 square
     with 16 corners (12, then 4 more, John, 2026-10-04), a 4px white stroke (3 before, John, 2026-10-04) and a soft shadow, as the family photos on 02, standing straight. The section opens its room as it
     comes in, so the sentence and it stay centred together on the page — the sentence eases up to make room (John, 2026-10-04). */
  .me { display: flex; justify-content: center; align-items: center; white-space: nowrap;
        font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 40px; line-height: 1.3;
        height: 0; margin-top: 0;
        transition: height 600ms cubic-bezier(0.16, 1, 0.3, 1), margin-top 600ms cubic-bezier(0.16, 1, 0.3, 1); }
  body.me-on .me { height: 120px; margin-top: 56px; }   /* the section takes its room, and the whole block eases up to stay centred */
  .me span { margin-right: 36px; opacity: 0; transform: translateY(16px);
             transition: opacity 320ms ease, transform 520ms cubic-bezier(0.16, 1, 0.3, 1); }
  /* THREE OF THEM, DANCING (John, 2026-10-04: "three pictures of my home … make them dance like the family one"): the pool,
     the living room, the bath — overlapping, tipped −8° and 8° in turn, coming up one after another, as on 02 */
  .me img { width: 120px; height: 120px; border-radius: 16px; display: block; flex: none; box-sizing: border-box;
            border: 4px solid #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
            margin-left: -26px; position: relative;
            opacity: 0; transform: rotate(0deg) scale(0.6);
            transition: opacity 260ms ease, transform 420ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  .me span + img { margin-left: 0; }
  body.me-on .me span { opacity: 1; transform: none; }
  body.me-on .me img { opacity: 1; }
  body.me-on .me img:nth-of-type(odd)  { transform: rotate(-8deg) scale(1); }
  body.me-on .me img:nth-of-type(even) { transform: rotate(8deg) scale(1); }
  body.me-on .me img:nth-of-type(1) { transition-delay: 180ms; }
  body.me-on .me img:nth-of-type(2) { transition-delay: 280ms; }
  body.me-on .me img:nth-of-type(3) { transition-delay: 380ms; }
  body.snap .me, body.snap .me span, body.snap .me img { transition: none !important; }
</style>
</head>
<body>
  <div class="slide">
    <div class="copy">
      <p class="one">Airbnb hosts run their<br>business on the calendar, where<br>every night has a price.</p>
      <div class="me"><span>Me included.</span><img src="assets/family/listing.webp" alt="John's place: the pool, with the flamingo"><img src="assets/family/listing-2.webp" alt="John's place: the living room, out to the pool"><img src="assets/family/listing-3.webp" alt="John's place: the bath and the cactus garden"></div>
    </div>
  </div>
<script>
  // one build: "Me included." (see .me)
  let step = 0;
  const set = (n, instant) => { step = n;
    if (instant) document.body.classList.add('snap');
    document.body.classList.toggle('me-on', n > 0);
    if (instant) { void document.body.offsetWidth; requestAnimationFrame(() => document.body.classList.remove('snap')); } };
  window.presoNext = () => { if (step >= 1) return false; set(1); return true; };
  window.presoPrev = () => { if (step === 0) return false; set(0); return true; };
  window.presoState = () => step;
  window.presoRestore = n => set(n > 0 ? 1 : 0, true);
</script>
</body>
</html>
