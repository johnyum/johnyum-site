<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>13</title>
<!-- HOST CALENDAR — played live inside the same drawn iPhone as Host Setup (11).

     Sits after the Host Calendar card (12). The chrome, the screen hole, the
     375x812 UI scaling and the status bar are lifted from 11 verbatim — see the
     long note at the top of that file for the 900x1840 grid and why --k comes
     from JS. The only difference: the screen's ground is white, so the status
     bar is set in black ink.

     THE CALENDAR IS THE REAL APP, STEPPED THROUGH A BUILD. /multical/ is the
     React build of the native replica (multi-host-calendar-web.zip), built with
     base=/multical/ so its fixtures, icons and fonts rebase off the site root.
     It is same-origin, which is what lets the beats reach its model and the
     clicker relay reach back into the deck.

     The taps step BEATS (see the script) by calling the app's own model, so each
     one is a real state change that animates as the product does. The phone
     stays live underneath for anything the room asks to see. -->
<style>
  @font-face {
    font-family: 'Cereal';
    src: url('../../multi/Font_Cereal/AirbnbCerealVF_Wght.ttf') format('truetype');
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }

  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  /* embedded in the studies sheet (12b) the page ground must not paint over the neighbours */
  html.embed, html.embed body { background: transparent; }
  .slide { height: 100%; display: grid; place-items: center; }

  .phone {
    /* the one number the assembly scales off. 80vh keeps it from crowding the
       deck's chrome, and the 1080 cap stops it ballooning on a 4K panel — that
       cap starts biting above a 1350px-tall viewport. */
    --phone-h: min(80vh, 1080px);

    /* the screen hole, as % of the 900x1840 viewBox */
    --sx: 5.4444%;
    --sy: 2.5543%;
    --sw: 89.1111%;
    --sh: 94.8913%;
    --sr: 15.9601%;      /* 128 over the hole's own width  */
    --sry: 7.3310%;      /* 128 over the hole's own height */

    position: relative;
    height: var(--phone-h);
    aspect-ratio: 900 / 1840;
  }
  .chrome {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    pointer-events: none;
    z-index: 2;
  }
  .screen {
    position: absolute;
    left: var(--sx); top: var(--sy);
    width: var(--sw); height: var(--sh);
    border-radius: var(--sr) / var(--sry);
    overflow: hidden;
    /* bezel black, not white: any sub-pixel seam between the UI and the hole's
       rounded edge then reads as bezel instead of a bright hairline */
    background: #0b0b0b;
    z-index: 1;
  }

  /* ---- the UI, in Airbnb's own points ---- */
  .ui {
    position: absolute;
    top: 0; left: 50%;
    width: 375px; height: 812px;
    /* Centre on the 50% line with a HALF-WIDTH margin, not `margin: 0 auto`.
       Auto margins silently collapse to 0 once the box is wider than its
       containing block — which is exactly what happens on smaller screens —
       and the scale then pulls everything off to one side. margin-left is
       unconditional, so it centres at every size. */
    margin-left: -187.5px;
    transform: scale(var(--k, 1));
    transform-origin: top center;
    font-family: 'Cereal', -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 500;
    color: #222;
    background: #fff;
    user-select: none;
  }
  .ui img { display: block; -webkit-user-drag: none; }
  /* THE APP IS A 430pt DESIGN, not 375. Its month grid is built from fixed
     metrics — 48px cells on a 52px stride, 7 across, inside 10px of padding —
     which comes to 384pt and clips its right-hand column in a 375pt box. So the
     frame is given its own 430 and scaled by 375/430 to land back on the .ui
     box, which then carries it to the hole with --k. Net: 430pt of UI across the
     full screen width, which is what the phone it was drawn for shows.

     THE STATUS BAND IS THIS SLIDE'S TO GIVE. The app draws from its own y=0 —
     --safe-top is declared in its base.css and never used — and its first
     control, the Today pill, sits only 8pt below that. So the frame starts at
     56, the full height of .status above, and NOT a point less: at 47 the pill's
     top edge landed 2pt inside the status bar and a hair under the island, which
     is the crowding you see if you change this number back. 56 down leaves the
     pill 21pt clear of the island.

     Height is the rest of the hole — 812 less 56 is 756, which is 867 of the
     app's own points — so its white ground still reaches the bezel and the
     scroller runs to the bottom edge under the floating bar, as it does on the
     phone.

     DO NOT hand the app a bottom safe-area inset to lift its bar off the bezel.
     Only .bar reads --safe-bottom; the quick-actions puck beside it hard-codes a
     32pt gap in JS, so raising one slides it off the other and the puck's tip
     card comes out from behind the bar. 21pt off the glass is the app's own
     design, tuned against that 32. */
  .app {
    position: absolute; left: 0; top: 56px;
    width: 430px; height: 867px;
    border: 0; display: block;
    transform: scale(0.8720930);       /* 375 / 430 */
    transform-origin: top left;
  }

  /* ---- status bar, hung off the island's centreline (27.64pt in UI space) ---- */
  .status { position: absolute; left: 0; top: 0; width: 375px; height: 56px; color: #000; z-index: 1; pointer-events: none; }
  .status .time {
    position: absolute; left: 24.6px; top: 17.14px;
    width: 80px; height: 21px;       /* centre 64, against the left ear's 63.9 */
    display: grid; place-items: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: -0.3px;
  }
  /* the icon cluster is centred in the RIGHT EAR, not right-aligned as the mock
     had it. the island is 125 of 393pt, so in this 375pt space it spans
     127.85..247.15; the ear is 247.15..375, centre 311.1. the cluster measures
     66.67 wide, so nominally it starts at 277.76 — less 0.67, because the UI
     runs a hair proud of the hole and is clipped, moving the true right edge
     in. Measured against the rendered box, not the spec: equal air each side. */
  .status .signal  { position: absolute; left: 277.09px; top: 22.30px; width: 17px;    height: 10.67px; }
  .status .wifi    { position: absolute; left: 299.13px; top: 22.15px; width: 15.27px; height: 10.97px; }
  .status .battery { position: absolute; left: 319.43px; top: 21.97px; width: 24.33px; height: 11.33px; }
</style>
</head>
<body>
  <div class="slide">
    <div class="phone">
      <div class="screen">
        <div class="ui" id="ui">
          <div class="status">
            <div class="time">9:41</div>
            <svg class="signal" viewBox="0 0 17 11" fill="#000" aria-hidden="true">
              <rect x="0"   y="7.5" width="3" height="3.5" rx="1"/>
              <rect x="4.7" y="5"   width="3" height="6"   rx="1"/>
              <rect x="9.3" y="2.5" width="3" height="8.5" rx="1"/>
              <rect x="14"  y="0"   width="3" height="11"  rx="1"/>
            </svg>
            <svg class="wifi" viewBox="0 0 15.3 11" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
              <path d="M1 3.6a10 10 0 0 1 13.3 0"/>
              <path d="M3.5 6.5a6.3 6.3 0 0 1 8.3 0"/>
              <path d="M6 9.3a2.6 2.6 0 0 1 3.3 0"/>
            </svg>
            <svg class="battery" viewBox="0 0 24.3 11.3" fill="none" aria-hidden="true">
              <rect x="0.6" y="0.6" width="20.5" height="10.1" rx="3" stroke="#000" stroke-opacity="0.45" stroke-width="1.1"/>
              <rect x="2.1" y="2.1" width="17.5" height="7.1" rx="1.9" fill="#000"/>
              <path d="M22.7 4.1c.9.35.9 2.75 0 3.1z" fill="#000" fill-opacity="0.45"/>
            </svg>
          </div>

          <!-- THE CALENDAR, live. /multical/ is the React build of the native
               replica, intaken 1:1 (multi-host-calendar-web.zip) and built with
               base=/multical/, so its own fixture, icon and font URLs rebase.
               Its shell is .phone { height: 100dvh; max-width: 430px }, so at
               375x812 it fills the hole exactly — nothing is scaled twice. The
               app leaves env(safe-area-inset-top, 47px) clear, which is the
               band the drawn status bar above sits in. Same origin, so the
               deck's key handler reaches it and the clicker still drives the
               deck from inside the frame. -->
          <!-- ?today pins the app's clock at Sept 9 — the deck must never drift with the
               real date. ?preso=1 opens it PRISTINE: no stays, no event or holiday marks,
               no AI entries, no Ask, no nav, no gear or avatar, every night open at a flat
               $500. The app's Model exposes setLayers() on window.__model, so the builds
               that follow switch each layer back on live — no reload, the product's own
               animation. -->
          <iframe class="app" src="/multical/?today=2026-09-09&preso=1" title="Multi-Host Calendar"></iframe>
        </div>
      </div>

      <!-- HYBRID CHROME. Everything is drawn on the PHOTO's own 900x1840 grid,
           so the two cannot drift: the rail band is the real photograph, and
           the screen edge, the black bezel and the island are vector.

             body      16,14  868x1812  r161
             bezel out 30,28  840x1784  r147
             hole      49,47  802x1746  r128
             island   322,69  256x74    r37   (125x36pt, centred, 11pt down)

           The photo is clipped to everything OUTSIDE the bezel boundary, so it
           supplies the metal and the side buttons and never touches the screen
           edge — which is the edge that has to be exact. A vector rail sits
           under it in the same band, so the phone still reads as metal in the
           instant before the photograph decodes. -->
      <svg class="chrome" viewBox="0 0 900 1840" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="rail" x1="16" y1="0" x2="884" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0"     stop-color="#8f8f8c"/>
            <stop offset="0.035" stop-color="#ececea"/>
            <stop offset="0.10"  stop-color="#bfbfbc"/>
            <stop offset="0.50"  stop-color="#f2f2f0"/>
            <stop offset="0.90"  stop-color="#bfbfbc"/>
            <stop offset="0.965" stop-color="#ececea"/>
            <stop offset="1"     stop-color="#8f8f8c"/>
          </linearGradient>
          <clipPath id="outsideBezel" clipPathUnits="userSpaceOnUse">
            <path clip-rule="evenodd" d="
              M-60,-60 H960 V1900 H-60 Z
              M177,28 H723 A147,147 0 0 1 870,175 V1665 A147,147 0 0 1 723,1812 H177 A147,147 0 0 1 30,1665 V175 A147,147 0 0 1 177,28 Z"/>
          </clipPath>
        </defs>

        <!-- vector rail: body minus bezel. the fallback the photo paints over -->
        <path fill="url(#rail)" fill-rule="evenodd" d="
          M177,14 H723 A161,161 0 0 1 884,175 V1665 A161,161 0 0 1 723,1826 H177 A161,161 0 0 1 16,1665 V175 A161,161 0 0 1 177,14 Z
          M177,28 H723 A147,147 0 0 1 870,175 V1665 A147,147 0 0 1 723,1812 H177 A147,147 0 0 1 30,1665 V175 A147,147 0 0 1 177,28 Z"/>

        <!-- the photograph, kept off the screen edge -->
        <image href="assets/device/iphone-frame.png" x="0" y="0" width="900" height="1840"
               clip-path="url(#outsideBezel)" preserveAspectRatio="none"/>

        <!-- bezel: overlaps the clip boundary by 1 so no sliver of photo survives -->
        <path fill="#0b0b0b" fill-rule="evenodd" d="
          M177,27 H723 A148,148 0 0 1 871,175 V1665 A148,148 0 0 1 723,1813 H177 A148,148 0 0 1 29,1665 V175 A148,148 0 0 1 177,27 Z
          M177,47 H723 A128,128 0 0 1 851,175 V1665 A128,128 0 0 1 723,1793 H177 A128,128 0 0 1 49,1665 V175 A128,128 0 0 1 177,47 Z"/>

        <!-- Dynamic Island, drawn over the UI -->
        <rect x="322" y="69" width="256" height="74" rx="37" fill="#000"/>
        <circle cx="529" cy="106" r="12.7" fill="#0f1420"/>
        <circle cx="529" cy="106" r="5.3" fill="#243046"/>
      </svg>
    </div>
  </div>

<script>
// Loaded inside the studies sheet (12b, ?embed=1): transparent ground, and the
// build below is driven through 12b's presoNext/presoPrev, which forward here.
if (/[?&]embed=1/.test(location.search)) document.documentElement.classList.add('embed');
// HYBRID: SCRIPTED SPINE, LIVE SURFACE.
// The taps step a Keynote-style build (BEATS below), and the phone stays a real
// app underneath — so when someone asks "what happens if you tap that", you tap
// it. That is why the slide still declares itself interactive: the deck's
// navigation shrinks to a 32px rail down each edge and the rest of the surface
// belongs to the calendar. Drive the build with the clicker or the arrows.
window.presoInteractive = true;

// ---- THE BUILD -------------------------------------------------------------
//
// A beat is a plain function handed the app's own model. It calls the SAME
// public methods the UI calls, so a step is a real state change and animates
// exactly as the product does — nothing here re-implements a mechanic.
//
// GOING BACK REPLAYS rather than undoes. Stepping to beat n resets the model
// with its own clearAll() and re-runs beats 1..n from the top. That is what lets
// a beat be a one-way function you can write without also writing its inverse,
// and the reverse still animates: the replay lands synchronously, React renders
// once, and CSS interpolates from whatever was on screen. The cost is that a
// beat must be a pure function of the seeded calendar — do not write one that
// depends on the beat before it having run.
//
// TO ADD A STEP: add a function. That is the whole ceremony.
//
// The model surface worth knowing (all of it is in the app's data/model.ts):
//   set({ showSettings, tipsShown, askDocked, openThread, tourMode, ... })
//   setPrice(p, li, nights) · adjustPrice(frac, li, nights) · setPromo(f, li, nights)
//   setMin(n, li, nights) · setBlocked(on, li, nights)
//   applyWeeklyDiscount(li) · fillGapNights(li) · messageGuest(booking)
//   reveal(first, last, inset, duration) — the calendar's own spotlight
//   gapNights(li) · openNights(nights, li) · upcomingStays · staysFor(li)
//
// REVEAL BEFORE YOU CHANGE ANYTHING. The calendar runs months deep in a scroller
// and the interesting nights are usually below the fold — a beat that only
// mutates fires perfectly and shows nothing. m.reveal(first, last, inset, ms) is
// the app's own spotlight: it brings the run into view and marks it, and the
// mutation then lands where the room is looking. Reveal, then change.

/// The next `days` of nights that are actually the host's to price — no past, no
/// stay, no block. The calendar's open runs start in October; September is let.
const openRun = (m, days) => {
  const ns = [];
  for (let d = m.fx.todayIndex + 1; d < m.fx.todayIndex + days; d++) ns.push(d);
  return m.openNights(ns, 0);
};

// The two below are REAL — they drive the product, not a mock-up — but they are
// placeholders for a story. Replace them with the mechanics this section argues.
const BEATS = [
  // 1 — October comes into view and a 15% promotion lands across every open
  //     night in the run at once: each price strikes and restrikes in place.
  m => { const ns = openRun(m, 45); m.reveal(ns[0], ns.at(-1), 24, 700); m.setPromo(0.15, 0, ns); },

  // 2 — the gap nights open up: the min-night walls that were closing them drop.
  m => { const gaps = m.gapNights(0); if (gaps.length) m.reveal(gaps[0], gaps.at(-1), 24, 700); m.fillGapNights(0); },
];

// THE CLICKER HAS TO SURVIVE A TAP INTO THE PHONE. The deck injects its key
// handler into each SLIDE frame on load, but it knows nothing about a frame
// nested inside one — so the first tap on the calendar moves focus into the app
// and every arrow and clicker press after that dies there. This relays them up.
// Typing is left alone: with a text field focused (the Ask chat) the app keeps
// every key, which is why the guard tests the app's own activeElement rather
// than the key.
(() => {
  const NAV = new Set(['ArrowRight', 'ArrowLeft', 'ArrowUp', 'ArrowDown', ' ', 'Enter', 'PageUp', 'PageDown', 'Home', 'End', 'f', 'F']);
  const app = document.querySelector('.app');
  app.addEventListener('load', () => {
    const w = app.contentWindow;
    // NOTHING SHOWS THROUGH THE HEADER. The app hides the month scrolling under
    // its title with a white .cover strip, but the strip's edges land on
    // fractional pixels here (two scales deep, 0.815 in all) and antialias to
    // hairlines — the grey cell tops behind read as dashed lines above the
    // title and above the weekday rule. Overlapping the strip by a pixel each
    // way closes both seams; the extra pixel under .weekdays is white on white.
    // Set from the slide so the build stays untouched.
    const seal = w.document.createElement('style');
    seal.textContent = '.single .cover{top:calc(var(--pin-top) - 1px);height:calc(var(--travel) - var(--rel) + 2px)}';
    w.document.head.appendChild(seal);

    w.addEventListener('keydown', e => {
      if (!NAV.has(e.key)) return;
      const el = w.document.activeElement;
      if (el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName))) return;
      e.preventDefault();
      parent.dispatchEvent(new KeyboardEvent('keydown', { key: e.key, code: e.code, bubbles: true }));
    });
  });
})();

// ---- the build's driver ----------------------------------------------------
// The deck rebuilds this slide's frame on every visit, so arriving at the slide
// is what puts the build back at the start — there is no state to clear here.
(() => {
  const app = document.querySelector('.app');
  let at = 0;                                  // beats applied, 0..BEATS.length

  const model = () => { try { return app.contentWindow.__model; } catch (_) { return null; } };

  // Reset, then replay — see the note on BEATS. Returns false while the app is
  // still loading, which hands the step back to the DECK rather than swallowing
  // it and stranding the presenter on a phone that will not move.
  function apply(n) {
    const m = model();
    if (!m) return false;
    m.clearAll();
    m.set({ showSettings: false, openThread: null });
    m.tab = 'calendar';                        // not part of clearAll's remit
    for (let i = 0; i < n; i++) BEATS[i](m);
    m.notify();
    at = n;
    return true;
  }

  window.presoNext = () => at >= BEATS.length ? false : apply(at + 1);
  window.presoPrev = () => at <= 0 ? false : apply(at - 1);
})();

(() => {
  const screen = document.querySelector('.screen');
  const ui     = document.getElementById('ui');
  function fit() { ui.style.setProperty('--k', (screen.clientHeight + 1) / 812); }
  new ResizeObserver(fit).observe(screen);
  fit();
})();
</script>
</body>
</html>
