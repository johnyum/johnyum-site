<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>13</title>
<!-- HOST CALENDAR — played live inside the same drawn iPhone as Host Setup (11).

     Sits after the Host Calendar card (12). The chrome, the screen hole, the
     375x812 UI scaling and the status bar are lifted from 11 verbatim — see the
     long note at the top of that file for the 900x1840 grid and why --k comes
     from JS. The only difference: the screen's ground is white, so the status
     bar is set in black ink.

     THE CALENDAR IS THE REAL APP, STEPPED THROUGH A BUILD. /multical/ is the
     React build of the native replica (multi-host-calendar-web.zip), built with
     base=/multical/ so its fixtures, icons and fonts rebase off the site root.
     It is same-origin, which is what lets the beats reach its model and the
     clicker relay reach back into the deck.

     The taps step BEATS (see the script) by calling the app's own model, so each
     one is a real state change that animates as the product does. The phone
     stays live underneath for anything the room asks to see. -->
<style>
  @font-face {
    font-family: 'Cereal';
    src: url('../../multi/Font_Cereal/AirbnbCerealVF_Wght.ttf') format('truetype');
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }

  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  /* embedded in the studies sheet (12b) the page ground must not paint over the neighbours */
  html.embed, html.embed body { background: transparent; }
  .slide { height: 100%; display: grid; place-items: center; }


  .phone {
    /* the one number the assembly scales off. 80vh keeps it from crowding the
       deck's chrome, and the 1080 cap stops it ballooning on a 4K panel — that
       cap starts biting above a 1350px-tall viewport. */
    --phone-h: min(80vh, 1080px);

    /* the screen hole, as % of the 900x1840 viewBox */
    --sx: 5.4444%;
    --sy: 2.5543%;
    --sw: 89.1111%;
    --sh: 94.8913%;
    --sr: 15.9601%;      /* 128 over the hole's own width  */
    --sry: 7.3310%;      /* 128 over the hole's own height */

    position: relative;
    height: var(--phone-h);
    aspect-ratio: 900 / 1840;
  }
  .chrome {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    pointer-events: none;
    z-index: 2;
  }
  .screen {
    position: absolute;
    left: var(--sx); top: var(--sy);
    width: var(--sw); height: var(--sh);
    border-radius: var(--sr) / var(--sry);
    overflow: hidden;
    /* bezel black, not white: any sub-pixel seam between the UI and the hole's
       rounded edge then reads as bezel instead of a bright hairline */
    background: #0b0b0b;
    z-index: 1;
  }

  /* ---- the UI, in Airbnb's own points ---- */
  .ui {
    position: absolute;
    top: 0; left: 50%;
    width: 375px; height: 812px;
    /* Centre on the 50% line with a HALF-WIDTH margin, not `margin: 0 auto`.
       Auto margins silently collapse to 0 once the box is wider than its
       containing block — which is exactly what happens on smaller screens —
       and the scale then pulls everything off to one side. margin-left is
       unconditional, so it centres at every size. */
    margin-left: -187.5px;
    transform: scale(var(--k, 1));
    transform-origin: top center;
    font-family: 'Cereal', -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 500;
    color: #222;
    background: #fff;
    user-select: none;
  }
  .ui img { display: block; -webkit-user-drag: none; }
  /* THE APP IS A 430pt DESIGN, not 375. Its month grid is built from fixed
     metrics — 48px cells on a 52px stride, 7 across, inside 10px of padding —
     which comes to 384pt and clips its right-hand column in a 375pt box. So the
     frame is given its own 430 and scaled by 375/430 to land back on the .ui
     box, which then carries it to the hole with --k. Net: 430pt of UI across the
     full screen width, which is what the phone it was drawn for shows.

     THE STATUS BAND IS THIS SLIDE'S TO GIVE. The app draws from its own y=0 —
     --safe-top is declared in its base.css and never used — and its first
     control, the Today pill, sits only 8pt below that. So the frame starts at
     56, the full height of .status above, and NOT a point less: at 47 the pill's
     top edge landed 2pt inside the status bar and a hair under the island, which
     is the crowding you see if you change this number back. 56 down leaves the
     pill 21pt clear of the island.

     Height is the rest of the hole — 812 less 56 is 756, which is 867 of the
     app's own points — so its white ground still reaches the bezel and the
     scroller runs to the bottom edge under the floating bar, as it does on the
     phone.

     DO NOT hand the app a bottom safe-area inset to lift its bar off the bezel.
     Only .bar reads --safe-bottom; the quick-actions puck beside it hard-codes a
     32pt gap in JS, so raising one slides it off the other and the puck's tip
     card comes out from behind the bar. 21pt off the glass is the app's own
     design, tuned against that 32. */
  .app {
    position: absolute; left: 0; top: 56px;
    width: 430px; height: 867px;
    border: 0; display: block;
    transform: scale(0.8720930);       /* 375 / 430 */
    transform-origin: top left;
  }

  /* the price-tips sheet's grey-400 scrim continues over the status band, which is this slide's, not the app's: multiplied,
     as the app's own is, so 9:41 and the glyphs stay black. Its bottom edge is SNAPPED to the app frame's top (see fit()):
     the browser rounds an iframe to whole device pixels while a div's edge stays fractional, and the sliver between the
     two edges read as a hairline. body.scrim follows the app's wandSheet. */
  .band-scrim { position: absolute; left: 0; top: 0; width: 375px; height: 56px; background: #C1C1C1; mix-blend-mode: multiply; z-index: 2; pointer-events: none; opacity: 0; transition: opacity .4s; }
  body.scrim .band-scrim { opacity: 1; transition-delay: 60ms; }
  /* ---- status bar, hung off the island's centreline (27.64pt in UI space) ---- */
  .status { position: absolute; left: 0; top: 0; width: 375px; height: 56px; color: #000; z-index: 1; pointer-events: none; }
  .status .time {
    position: absolute; left: 24.6px; top: 17.14px;
    width: 80px; height: 21px;       /* centre 64, against the left ear's 63.9 */
    display: grid; place-items: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: -0.3px;
  }
  /* the icon cluster is centred in the RIGHT EAR, not right-aligned as the mock
     had it. the island is 125 of 393pt, so in this 375pt space it spans
     127.85..247.15; the ear is 247.15..375, centre 311.1. the cluster measures
     66.67 wide, so nominally it starts at 277.76 — less 0.67, because the UI
     runs a hair proud of the hole and is clipped, moving the true right edge
     in. Measured against the rendered box, not the spec: equal air each side. */
  .status .signal  { position: absolute; left: 277.09px; top: 22.30px; width: 17px;    height: 10.67px; }
  .status .wifi    { position: absolute; left: 299.13px; top: 22.15px; width: 15.27px; height: 10.97px; }
  .status .battery { position: absolute; left: 319.43px; top: 21.97px; width: 24.33px; height: 11.33px; }
</style>
</head>
<body>
  <div class="slide">
    <div class="phone">
      <div class="screen">
        <div class="ui" id="ui">
          <div class="band-scrim"></div>
          <div class="status">
            <div class="time">9:41</div>
            <svg class="signal" viewBox="0 0 17 11" fill="#000" aria-hidden="true">
              <rect x="0"   y="7.5" width="3" height="3.5" rx="1"/>
              <rect x="4.7" y="5"   width="3" height="6"   rx="1"/>
              <rect x="9.3" y="2.5" width="3" height="8.5" rx="1"/>
              <rect x="14"  y="0"   width="3" height="11"  rx="1"/>
            </svg>
            <svg class="wifi" viewBox="0 0 15.3 11" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
              <path d="M1 3.6a10 10 0 0 1 13.3 0"/>
              <path d="M3.5 6.5a6.3 6.3 0 0 1 8.3 0"/>
              <path d="M6 9.3a2.6 2.6 0 0 1 3.3 0"/>
            </svg>
            <svg class="battery" viewBox="0 0 24.3 11.3" fill="none" aria-hidden="true">
              <rect x="0.6" y="0.6" width="20.5" height="10.1" rx="3" stroke="#000" stroke-opacity="0.45" stroke-width="1.1"/>
              <rect x="2.1" y="2.1" width="17.5" height="7.1" rx="1.9" fill="#000"/>
              <path d="M22.7 4.1c.9.35.9 2.75 0 3.1z" fill="#000" fill-opacity="0.45"/>
            </svg>
          </div>

          <!-- THE CALENDAR, live. /multical/ is the React build of the native
               replica, intaken 1:1 (multi-host-calendar-web.zip) and built with
               base=/multical/, so its own fixture, icon and font URLs rebase.
               Its shell is .phone { height: 100dvh; max-width: 430px }, so at
               375x812 it fills the hole exactly — nothing is scaled twice. The
               app leaves env(safe-area-inset-top, 47px) clear, which is the
               band the drawn status bar above sits in. Same origin, so the
               deck's key handler reaches it and the clicker still drives the
               deck from inside the frame. -->
          <!-- ?today pins the app's clock at Sept 9 — the deck must never drift with the
               real date. ?preso=1 opens it PRISTINE: no stays, no event or holiday marks,
               no AI entries, no Ask, no nav, no gear or avatar, every night open at a flat
               $500. The app's Model exposes setLayers() on window.__model, so the builds
               that follow switch each layer back on live — no reload, the product's own
               animation. -->
          <iframe class="app" title="Multi-Host Calendar"></iframe>
          <script>
            // src set here, not in the markup, so it loads once: the deck's per-load stamp rides down to the app's
            // document too — its bundles are content-hashed, only index.html could ever be stale
            (() => { const v = new URLSearchParams(location.search).get('v'); document.querySelector('.app').src = '/multical/?today=2026-09-09&preso=1' + (v ? '&v=' + v : ''); })();
          </script>
        </div>
      </div>

      <!-- HYBRID CHROME. Everything is drawn on the PHOTO's own 900x1840 grid,
           so the two cannot drift: the rail band is the real photograph, and
           the screen edge, the black bezel and the island are vector.

             body      16,14  868x1812  r161
             bezel out 30,28  840x1784  r147
             hole      49,47  802x1746  r128
             island   322,69  256x74    r37   (125x36pt, centred, 11pt down)

           The photo is clipped to everything OUTSIDE the bezel boundary, so it
           supplies the metal and the side buttons and never touches the screen
           edge — which is the edge that has to be exact. A vector rail sits
           under it in the same band, so the phone still reads as metal in the
           instant before the photograph decodes. -->
      <svg class="chrome" viewBox="0 0 900 1840" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="rail" x1="16" y1="0" x2="884" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0"     stop-color="#8f8f8c"/>
            <stop offset="0.035" stop-color="#ececea"/>
            <stop offset="0.10"  stop-color="#bfbfbc"/>
            <stop offset="0.50"  stop-color="#f2f2f0"/>
            <stop offset="0.90"  stop-color="#bfbfbc"/>
            <stop offset="0.965" stop-color="#ececea"/>
            <stop offset="1"     stop-color="#8f8f8c"/>
          </linearGradient>
          <clipPath id="outsideBezel" clipPathUnits="userSpaceOnUse">
            <path clip-rule="evenodd" d="
              M-60,-60 H960 V1900 H-60 Z
              M177,28 H723 A147,147 0 0 1 870,175 V1665 A147,147 0 0 1 723,1812 H177 A147,147 0 0 1 30,1665 V175 A147,147 0 0 1 177,28 Z"/>
          </clipPath>
        </defs>

        <!-- vector rail: body minus bezel. the fallback the photo paints over -->
        <path fill="url(#rail)" fill-rule="evenodd" d="
          M177,14 H723 A161,161 0 0 1 884,175 V1665 A161,161 0 0 1 723,1826 H177 A161,161 0 0 1 16,1665 V175 A161,161 0 0 1 177,14 Z
          M177,28 H723 A147,147 0 0 1 870,175 V1665 A147,147 0 0 1 723,1812 H177 A147,147 0 0 1 30,1665 V175 A147,147 0 0 1 177,28 Z"/>

        <!-- the photograph, kept off the screen edge -->
        <image href="assets/device/iphone-frame.png" x="0" y="0" width="900" height="1840"
               clip-path="url(#outsideBezel)" preserveAspectRatio="none"/>

        <!-- bezel: overlaps the clip boundary by 1 so no sliver of photo survives -->
        <path fill="#0b0b0b" fill-rule="evenodd" d="
          M177,27 H723 A148,148 0 0 1 871,175 V1665 A148,148 0 0 1 723,1813 H177 A148,148 0 0 1 29,1665 V175 A148,148 0 0 1 177,27 Z
          M177,47 H723 A128,128 0 0 1 851,175 V1665 A128,128 0 0 1 723,1793 H177 A128,128 0 0 1 49,1665 V175 A128,128 0 0 1 177,47 Z"/>

        <!-- Dynamic Island, drawn over the UI -->
        <rect x="322" y="69" width="256" height="74" rx="37" fill="#000"/>
        <circle cx="529" cy="106" r="12.7" fill="#0f1420"/>
        <circle cx="529" cy="106" r="5.3" fill="#243046"/>
      </svg>
    </div>
  </div>

<script>
// Loaded inside the studies sheet (12b, ?embed=1): transparent ground, and the
// build below is driven through 12b's presoNext/presoPrev, which forward here.
if (/[?&]embed=1/.test(location.search)) document.documentElement.classList.add('embed');
// HYBRID: SCRIPTED SPINE, LIVE SURFACE.
// The taps step a Keynote-style build (BEATS below), and the phone stays a real
// app underneath — so when someone asks "what happens if you tap that", you tap
// it. That is why the slide still declares itself interactive: the deck's
// navigation shrinks to a 32px rail down each edge and the rest of the surface
// belongs to the calendar. Drive the build with the clicker or the arrows.
window.presoInteractive = true;

// ---- THE BUILD -------------------------------------------------------------
//
// A beat is a plain function handed the app's own model. It calls the SAME
// public methods the UI calls, so a step is a real state change and animates
// exactly as the product does — nothing here re-implements a mechanic.
//
// GOING BACK REPLAYS rather than undoes. Stepping to beat n resets the model
// with its own clearAll() and re-runs beats 1..n from the top, instantly. That
// is what lets a beat be a one-way function you can write without also writing
// its inverse, and the reverse still animates: the replay lands synchronously,
// React renders once, and CSS interpolates from whatever was on screen. Stepping
// FORWARD by one runs just that beat, live, with its own timing.
//
// TO ADD A STEP: add a function. That is the whole ceremony.
//
// The model surface worth knowing (all of it is in the app's data/model.ts):
//   set({ showSettings, tipsShown, askDocked, openThread, tourMode, ... })
//   setPrice(p, li, nights) · adjustPrice(frac, li, nights) · setPromo(f, li, nights)
//   setMin(n, li, nights) · setBlocked(on, li, nights)
//   applyWeeklyDiscount(li) · fillGapNights(li) · messageGuest(booking)
//   reveal(first, last, inset, duration) — the calendar's own spotlight
//   gapNights(li) · openNights(nights, li) · upcomingStays · staysFor(li)
//
// REVEAL BEFORE YOU CHANGE ANYTHING. The calendar runs months deep in a scroller
// and the interesting nights are usually below the fold — a beat that only
// mutates fires perfectly and shows nothing. m.reveal(first, last, inset, ms) is
// the app's own spotlight: it brings the run into view and marks it, and the
// mutation then lands where the room is looking. Reveal, then change.

/// The next `days` of nights that are actually the host's to price — no past, no
/// stay, no block. The calendar's open runs start in October; September is let.
const openRun = (m, days) => {
  const ns = [];
  for (let d = m.fx.todayIndex + 1; d < m.fx.todayIndex + days; d++) ns.push(d);
  return m.openNights(ns, 0);
};

// Beats are added here one at a time, as John calls them (2026-09-20); the
// calendar does nothing he has not asked for.

// A run of nights tapped one after another, each tap landing BEFORE the one
// before has finished animating (the cell's fill takes 200ms). The quick
// actions are HELD BACK while the run taps and rise once, after the last one.
// `gen` lets a replay or a step back kill a cascade still in flight — the
// timers check it before every tap.
let gen = 0;
let pendingRun = null;   // a cascade still tapping; a forward tap finishes it before the next beat, a back tap drops it
let pendingTail = null;  // the rest of a live beat still on a timer (the $480, the min 5, the 20%): a forward tap lands it whole first, a back tap drops it
const tail = (g, fn) => { pendingTail = fn; return () => { if (g !== gen) return; pendingTail = null; fn(); }; };   // fn runs on time — or early, whole, on the next tap
const TAP = 480;   // a scripted tap on a row or a button: its pressed look plays out (.pressing, 440ms) before what it does happens
const press = find => { const d = appDoc(), el = d && find(d); if (!el) return null; el.classList.add('pressing'); setTimeout(() => el.classList.remove('pressing'), 440); return el; };
const cascade = (m, first, last, every) => {
  const g = ++gen;
  pendingRun = { first, last };
  m.setHoldQuick(true);
  for (let di = first, i = 0; di <= last; di++, i++) setTimeout(() => { if (g === gen && !m.selectedNights.has(di)) m.toggleNight(di); }, i * every);
  const land = tail(g, () => { pendingRun = null; m.setHoldQuick(false); m.setHeaderLock(true); });   // the last cell has filled: now the sheet — and the header locks small, the grid riding up with it
  setTimeout(land, (last - first) * every + 260);
};

// Each beat takes (model, instant). Stepping FORWARD runs the beat live, with
// its timing. A replay (stepping back, or a jump) runs the beats up to the
// target with instant = true: the same end state, no animation, no timers.
const RUN = m => [m.fx.todayIndex, m.fx.todayIndex + 12];   // the 9th through the 21st
const MARK_GROUPS = 9;   // events and holidays shown, through Indian Wells 2027 (Feb 28 – Mar 14); Presidents' Day falls inside Modernism Week and carries no icon of its own
const BEATS = [
  // 1 — every cell from this month on grows: 48 more UNDER the price, nothing
  //     above it — it can grow out — and STAYS out
  m => m.setCellPad(48),
  // 2 — they let go: snap back with a little elasticity
  m => m.setCellPad(0),
  // 3 — every cell in view, Sep 1 through the second week of October, turns over
  //     like a card one after another and lands back where it was
  (m, instant) => { if (instant) return; const a = m.fx.todayIndex - 8, z = m.fx.todayIndex + 31; m.flipCells(a, z); setTimeout(() => m.clearFlip(), (z - a) * 55 + 1200); },   // the class comes off regardless — a later beat must not leave it on
  // 4 — the price wave: every price in view lifts and brightens in turn, along
  //     the rows, and settles
  (m, instant) => { if (instant) return; const a = m.fx.todayIndex - 8, z = m.fx.todayIndex + 31; m.waveCells(a, z); setTimeout(() => m.clearWave(), (z - a) * 45 + 1100); },   // likewise
  // 5 — the run gets tapped, 90ms apart; then the quick actions rise
  (m, instant) => { const [a, z] = RUN(m); if (instant) { const s = new Set(); for (let di = a; di <= z; di++) s.add(di); m.setSelectedNights(s); m.setHeaderLock(true, false); } else cascade(m, a, z, 90); },
  // 6 — availability goes off, and stays off
  m => m.setBlocked(true, 0, [...m.selectedNights]),
  // 7 — the nights open again
  m => m.setBlocked(false, 0, [...m.selectedNights]),
  // 8 — the Price per night card grows into the price sheet, the $500 riding up to the centre
  m => m.setPriceSheet(true),
  // 9 — on the keypad: ⌫ three times, then 4 8 0 — each key visibly pressed
  (m, instant) => typeKeys(['⌫', '⌫', '⌫', '4', '8', '0'], instant),
  // 10 — Done: the sheet runs back into its card; the quick actions STAY UP (John, 2026-09-21) with the nights
  //      still picked, the calendar still reading $500 — then, a beat later, the picked nights odometer down to $480
  (m, instant) => {
    const ns = [...m.selectedNights];
    if (instant) { m.setPriceSheet(false); m.setPrice(480, 0, ns, false); return; }
    const g = ++gen;
    const d = appDoc(), btn = d && d.querySelector('.sqa-price.open .ps-done');
    if (btn) { btn.classList.add('pressing'); setTimeout(() => btn.classList.remove('pressing'), 440); }   // Done, visibly tapped
    setTimeout(() => { if (g === gen) m.setPriceSheet(false); }, 200);          // ...but nothing applied yet
    setTimeout(tail(g, () => m.setPrice(480, 0, ns, false)), 750);   // the moment the sheet is home (200 to let go + its 550 drop): the odometer
  },
  // 11 — the Custom settings card grows into the settings sheet, the ⨉ riding up with it
  m => m.setSettingsSheet(true),
  // 12 — Minimum nights, visibly tapped: the settings sheet re-dresses as the minimum-nights editor, 7 by default
  (m, instant) => {
    if (instant) { m.setMinSheet(true); return; }
    const g = ++gen;
    press(d => d.querySelector('.sqa-custom.open .ss-row'));
    setTimeout(tail(g, () => m.setMinSheet(true)), TAP);   // the tap plays out, then the sheet re-dresses
  },
  // 13 — the − ring tapped twice: 7 → 6 → 5, and under each picked night's $480 the "min 6" line arrives, then reads "min 5"
  (m, instant) => {
    const ns = [...m.selectedNights];
    if (instant) { m.setMinSheetNights(5); m.setMin(5, 0, ns); return; }
    const g = ++gen;
    pendingTail = () => { m.setMinSheetNights(5); m.setMin(5, 0, ns); };
    [6, 5].forEach((n, i) => setTimeout(() => {
      if (g !== gen) return;
      const d = appDoc(), btn = d && d.querySelector('.sqa-custom.min .mn-btn');
      if (btn) { btn.classList.remove('pressing'); void btn.offsetWidth; btn.classList.add('pressing'); setTimeout(() => btn.classList.remove('pressing'), 440); }
      setTimeout(() => { if (g === gen) { m.setMinSheetNights(n); m.setMin(n, 0, ns); if (n === 5) pendingTail = null; } }, 130);   // the figure and the cells move at the bottom of the squash
    }, i * 320));   // one thumb, twice, quick
  },
  // 14 — Done, visibly tapped: the editor runs back to the three rows, and Minimum nights now reads 5 where its + was
  (m, instant) => {
    if (instant) { m.setMinSheet(false); return; }
    const g = ++gen;
    const d = appDoc(), btn = d && d.querySelector('.sqa-custom.min .mn-done');
    if (btn) { btn.classList.add('pressing'); setTimeout(() => btn.classList.remove('pressing'), 440); }
    setTimeout(() => { if (g === gen) m.setMinSheet(false); }, 200);
  },
  // 15 — Custom promotion, visibly tapped: the sheet re-dresses as the promotion editor and rests a beat on 0%; then a
  //      finger drags the knob to 20% — the figure counting, the three ✓ popping in — and −20% lands on the picked nights,
  //      their $480 rolling to $384
  (m, instant) => {
    const ns = [...m.selectedNights];
    if (instant) { m.setPromoSheet(true); m.setPromoPct(20); m.setPromo(0.2, 0, ns); return; }
    const g = ++gen;
    pendingTail = () => { m.setPromoSheet(true); m.setPromoDrag(false); m.setPromoPct(20); m.setPromo(0.2, 0, ns); };
    press(d => d.querySelectorAll('.sqa-custom.open .ss-row')[1]);
    setTimeout(() => { if (g === gen) m.setPromoSheet(true); }, TAP);
    const T0 = performance.now() + TAP + 600 + 700 + 250;   // the tap, the re-dress, a beat on 0%, the finger down; then the drag, expo-out
    const DRAG = 700; let knob = null;
    setTimeout(() => { if (g !== gen) return; const d = appDoc(); knob = d && d.querySelector('.cp-knob'); if (knob) knob.classList.add('pressing'); }, TAP + 600 + 700);
    const step = () => {
      if (g !== gen) return;
      const t = Math.min(1, Math.max(0, (performance.now() - T0) / DRAG)), e = 1 - Math.pow(2, -10 * t);
      if (t > 0) { m.setPromoDrag(true); m.setPromoPct(20 * (t >= 1 ? 1 : e)); }
      if (t < 1) requestAnimationFrame(step); else { m.setPromoDrag(false); if (knob) knob.classList.remove('pressing'); setTimeout(tail(g, () => m.setPromo(0.2, 0, ns)), 500); }   // lifted; a beat; the nights
    };
    requestAnimationFrame(step);
  },
  // 16 — ⨉, straight from the promotion page: the whole quick actions drop away and September rides back up to the big
  //      header; the 9th–21st keep their $384, −20% and min 5, untapped, on the default calendar
  (m, instant) => { if (instant) { m.clearSelection(); m.setHeaderLock(false, false); return; } const g = ++gen; press(d => d.querySelector('.sqa-close')); setTimeout(tail(g, () => { m.clearSelection(); m.setHeaderLock(false); }), TAP); },
  // 17 — the events and holidays, in one run of five stops, out to Indian Wells in March 2027: the calendar scrolls to
  //      each stop, its icons pop in one group after another, a beat, and on. The marks layer comes on empty and fills.
  (m, instant) => {
    m.setLayers({ marks: true }); m.setShownMarks(new Set()); m.revealOffset = MARK_PARK;
    const groups = m.nextMarkGroups(16);
    const scenes = MARK_SCENES.map(names => names.map(n => groups.find(g => g.name === n)).filter(Boolean)).filter(sc => sc.length);
    const lastScene = scenes[scenes.length - 1];
    // ...and at the end, a beat after Indian Wells is in, its first week — Feb 28 through Mar 5 — gets tapped, 90ms apart, and
    // the quick actions rise over it, naming the tournament; the run rests there (John, 2026-09-21)
    const iw = lastScene[0].dis[0], week = Array.from({ length: 6 }, (_, k) => iw + k);
    const landAll = () => { for (const sc of scenes) for (const grp of sc) m.showMarkGroup(grp.dis); m.setHoldQuick(false); m.setSelectedNights(new Set(week)); setTimeout(() => m.reveal(iw, null, 0, 0), 40); };   // the reveal a tick later: on a replay the reset has just scrolled home in the same tick, and the later smooth scroll would lose to it
    if (instant) { landAll(); return; }
    const g = ++gen;
    pendingTail = landAll;   // a tap before the run is through lands the rest whole
    const tapWeek = () => {   // the cascade, but without the header lock: the calendar is parked on March, not September
      if (g !== gen) return;
      m.setHoldQuick(true);
      week.forEach((di, k) => setTimeout(() => { if (g === gen && !m.selectedNights.has(di)) m.toggleNight(di); }, k * 90));
      setTimeout(() => { if (g === gen) { m.setHoldQuick(false); pendingTail = null; } }, (week.length - 1) * 90 + 260);
    };
    const go = i => {
      if (g !== gen) return;
      const sc = scenes[i]; if (!sc) { tapWeek(); return; }   // the last stop's hold has already run: one beat, not two
      m.reveal(sc[0].dis[0], null, 0, 0);
      settled(g, () => {
        if (g !== gen) return;
        sc.forEach((grp, k) => setTimeout(() => { if (g === gen) m.showMarkGroup(grp.dis); }, k * MARK_STAGGER));   // landed: the icons, one group after another
        setTimeout(() => go(i + 1), (sc.length - 1) * MARK_STAGGER + MARK_HOLD);                                   // a beat after the last; the next stop
      });
    };
    go(0);
  },
  // 18 — ⨉ closes the quick actions; a beat; Today is tapped and the calendar flies home to September — and on the way the
  //      host's edits come off the 9th–21st (the $480, the −20%, the min 5), so it lands on the default it started from.
  //      Landed, a beat: Today slides left to make room and a magic-wand tile pops in beside the gear; a beat, and the wand is tapped —
  //      the calendar frosts and the price-tips sheet rises (Figma 5248:641877)
  (m, instant) => {
    const [a, z] = RUN(m), ns = []; for (let di = a; di <= z; di++) ns.push(di);
    const undo = () => { m.setPrice(null, 0, ns); m.setPromo(null, 0, ns); m.setMin(null, 0, ns); };
    if (instant) { m.clearSelection(); undo(); m.setWandTile(true); m.setWandSheet(true); setTimeout(() => m.goToday(), 80); return; }   // after 17's own deferred reveal (40ms), so home wins
    const g = ++gen;
    pendingTail = () => { m.clearSelection(); undo(); m.goToday(); m.setWandTile(true); m.setWandSheet(true); };   // a tap before it is through lands it all
    press(d => d.querySelector('.sqa-close'));
    setTimeout(() => { if (g === gen) m.clearSelection(); }, TAP);
    setTimeout(() => { if (g === gen) press(d => d.querySelector('.today-pill')); }, TAP + 700);   // the cards are down: Today, visibly tapped
    setTimeout(() => { if (g !== gen) return; undo(); setTimeout(() => { if (g !== gen) return; m.goToday(); settled(g, () => setTimeout(() => {
      if (g !== gen) return; m.setWandTile(true);                                                                   // landed, a beat: the wand
      setTimeout(() => { if (g === gen) press(d => d.querySelector('.wand-tile')); }, 800 + 900);                    // it has popped in, a beat: tapped
      setTimeout(tail(g, () => m.setWandSheet(true)), 800 + 900 + TAP);                                            // ...and the price-tips sheet rises (Figma 5248:641877)
    }, 900)); }, 60); }, TAP + 700 + 200);   // the edits come off, the rows settle, THEN the flight home (a reflow mid-flight can stall a smooth scroll)
  },
  // 19 — Try now, visibly tapped: the sheet drops, the top bar's tiles slip away for a Close tips pill, and the tips wash
  //      over the weeks ahead one night after another — weekdays down to $480, weekends up to $535 — each with its $500 struck
  (m, instant) => {
    const tips = TIPS(m);
    if (instant) { m.setWandSheet(false); m.setTipsMode(true); m.setHeaderLock(true, false); for (const [di, p] of tips) m.addTip(di, p); return; }
    const g = ++gen;
    pendingTail = () => { m.setWandSheet(false); m.setTipsMode(true); m.setHeaderLock(true, false); for (const [di, p] of tips) if (!m.tipCells.has(di)) m.addTip(di, p); };
    press(d => d.querySelector('.ws-cta'));
    setTimeout(() => { if (g === gen) m.setWandSheet(false); }, TAP);
    setTimeout(() => { if (g === gen) { m.setTipsMode(true); m.setHeaderLock(true); } }, TAP + 500);   // the pill comes, and the header locks small with the grid riding up
    tips.forEach(([di, p], k) => setTimeout(() => { if (g === gen) { m.addTip(di, p); if (k === tips.length - 1) pendingTail = null; } }, TAP + 900 + k * 45));
  },
  // 20 — every tipped September night gets tapped, in date order, and the Price tip sheet rises — and rests there
  (m, instant) => {
    const t = m.fx.todayIndex, picks = TIPS(m).map(([di]) => di).filter(di => m.fx.date(di).m === m.fx.date(t).m);   // September's tips, in date order
    const land = () => { m.setSelectedNights(new Set(picks)); m.setTipSheet(true); };
    if (instant) { land(); return; }
    const g = ++gen;
    pendingTail = land;
    picks.forEach((di, k) => setTimeout(() => { if (g === gen && !m.selectedNights.has(di)) m.toggleNight(di); }, k * 90));
    setTimeout(tail(g, land), (picks.length - 1) * 90 + 400);   // the picks are in: the sheet (land is the whole beat, so a tap mid-cascade picks them all too — tail() replaces pendingTail)
  },
  // 21 — Apply tips, visibly tapped: the sheet drops and IN THE CELLS the old price folds away and a ✓ comes in (the cells' own
  //      raise scene) and stays; an Undo pill joins Close (Figma 5248:641867)
  (m, instant) => {
    const land = () => { const ns = [...m.selectedNights]; m.setTipSheet(false); m.applyTips(ns); m.clearSelection(); m.setUndoTile(true); };
    if (instant) { land(); return; }
    const g = ++gen; pendingTail = land;
    press(d => d.querySelector('.pt-cta'));
    setTimeout(tail(g, land), TAP);
  },
  // 22 — Close, visibly tapped: the tips still on offer come off, the applied ones stay as the nights' prices (plain, ✓ gone), the
  //      bar's tiles return and the header lets go — the default calendar, with the host's new prices honoured. A beat, and the
  //      guests arrive: the stays layer comes on and the pills pop in one after another, laid OVER the prices
  (m, instant) => {
    const guests = () => { m.setLayers({ stays: true }); setTimeout(() => { const d = appDoc(); if (!d) return; [...d.querySelectorAll('.spill')].forEach((el, i) => el.style.setProperty('--pill-delay', (i * 70) + 'ms')); }, 0); };
    const close = () => { m.clearTips(); m.setHeaderLock(false, !instant); };
    if (instant) { close(); m.setLayers({ stays: true }); return; }
    const g = ++gen;
    pendingTail = () => { close(); m.setLayers({ stays: true }); };
    press(d => d.querySelector('.close-tips'));
    setTimeout(() => { if (g === gen) close(); }, TAP);
    setTimeout(tail(g, guests), TAP + 900);   // closed, a beat: the guests
  },
];
// THE TIPS: the five weeks after today. Tuesdays to Thursdays in the second and third weeks come down to $480; Fridays and
// Saturdays in the first, third and fifth go up to $535 — a spread that reads as an advisor's, not a rule's, and one that
// gives September ten tipped nights (the 11th, 12th, 16th, 17th, 22nd–26th, 29th), which beat 21 picks.
const TIPS = m => { const out = []; for (let di = m.fx.todayIndex + 1; di <= m.fx.todayIndex + 35; di++) { const x = m.fx.date(di), dow = new Date(x.y, x.m - 1, x.d).getDay(), wk = Math.floor((di - m.fx.todayIndex) / 7); if (dow >= 2 && dow <= 4 && (wk === 1 || wk === 2)) out.push([di, 480]); else if ((dow === 5 || dow === 6) && wk % 2 === 0) out.push([di, 535]); } return out; };
const MARK_PARK = 120;   // an event's row parks this far under the header, with its week above for context
const MARK_HOLD = 1100;  // the beat the last icon of a stop gets before the run scrolls on
const MARK_STAGGER = 220; // within a stop, one group's icons after another's
const MARK_SCENES = [     // the stops (John, 2026-09-21)
  ['Halloween', 'Palm Springs Pride', 'Veterans Day', 'Thanksgiving'],
  ['Christmas', "New Year's Day"],
  ['MLK Jr. Day', 'AMEX Cup'],
  ['Modernism Week'],
  ['Indian Wells 2027'],
];
// The calendar's smooth scroll takes as long as it takes (a jump of months, longer): fn runs once the scroll has
// been still for two reads, 400ms in at the soonest, 2s at the latest.
const settled = (g, fn) => {
  const d = appDoc(), v = d && d.querySelector('.vscroll'); if (!v) { setTimeout(fn, 650); return; }
  const t0 = performance.now(); let last = v.scrollTop, still = 0;
  const tick = () => { if (g !== gen) return; const y = v.scrollTop; still = y === last ? still + 1 : 0; last = y; const dt = performance.now() - t0; if ((still >= 2 && dt >= 400) || dt >= 2000) fn(); else setTimeout(tick, 80); };
  setTimeout(tick, 200);
};

// A scripted finger on the price sheet's keypad. Each key pops (sqa.css key-tap) and its click lands mid-squash,
// Done included, 460ms apart. Instant: the clicks, at once, no look.
const appDoc = () => { try { return document.querySelector('.app').contentDocument; } catch (_) { return null; } };
// CADENCE: a finger moving to a new key takes 460ms; the same key tapped again (⌫ ⌫ ⌫) comes 200ms after the last —
// a thumb drumming one button, not three considered presses (John, 2026-09-21).
const KEY_GAP = 460, REPEAT_GAP = 200;
function typeKeys(keys, instant) {
  const g = ++gen;
  const at = keys.map((k, i) => 0); for (let i = 1; i < keys.length; i++) at[i] = at[i - 1] + (keys[i] === keys[i - 1] ? REPEAT_GAP : KEY_GAP);
  keys.forEach((k, i) => {
    const go = () => {
      if (g !== gen) return;
      const d = appDoc(); if (!d) return;
      const el = k === 'Done' ? d.querySelector('.sqa-price.open .ps-done') : [...d.querySelectorAll('.sqa-price.open .ps-key')].find(b => b.getAttribute('aria-label') === k);
      if (!el) return;
      if (instant) { el.click(); return; }
      const tap = el.__tap = (el.__tap || 0) + 1;                    // a repeat on the same key restarts its pop...
      el.classList.remove('pressing'); void el.offsetWidth;
      el.classList.add('pressing');                                  // the key pops, a disc blooms (sqa.css key-tap, 420ms)
      setTimeout(() => { el.click(); }, 130);                        // the digit lands at the bottom of the squash
      setTimeout(() => { if (el.__tap === tap) el.classList.remove('pressing'); }, 440);   // ...and only the last one lets go
    };
    setTimeout(go, instant ? 30 : at[i]);   // instant still waits a tick: a replayed beat 8 has only just mounted the keypad
  });
}

// THE CLICKER HAS TO SURVIVE A TAP INTO THE PHONE. The deck injects its key
// handler into each SLIDE frame on load, but it knows nothing about a frame
// nested inside one — so the first tap on the calendar moves focus into the app
// and every arrow and clicker press after that dies there. This relays them up.
// Typing is left alone: with a text field focused (the Ask chat) the app keeps
// every key, which is why the guard tests the app's own activeElement rather
// than the key.
(() => {
  const NAV = new Set(['ArrowRight', 'ArrowLeft', 'ArrowUp', 'ArrowDown', ' ', 'Enter', 'PageUp', 'PageDown', 'Home', 'End', 'f', 'F']);
  const app = document.querySelector('.app');
  app.addEventListener('load', () => {
    const w = app.contentWindow;
    // NOTHING SHOWS THROUGH THE HEADER. The app hides the month scrolling under
    // its title with a white .cover strip, but the strip's edges land on
    // fractional pixels here (two scales deep, 0.815 in all) and antialias to
    // hairlines — the grey cell tops behind read as dashed lines above the
    // title and above the weekday rule. Overlapping the strip by a pixel each
    // way closes both seams; the extra pixel under .weekdays is white on white.
    // Set from the slide so the build stays untouched.
    // the band's scrim follows the app's price-tips sheet, however it opens or closes (a beat, or a finger on ⨉ / Try now)
    const follow = () => { const mm = w.__model; if (mm) document.body.classList.toggle('scrim', !!mm.wandSheet); };
    const hook = setInterval(() => { const mm = w.__model; if (!mm) return; clearInterval(hook); mm.subscribe(follow); follow(); }, 50);
    const seal = w.document.createElement('style');
    seal.textContent = '.single .cover{top:calc(var(--pin-top) - 1px);height:calc(var(--travel) - var(--rel) + 2px)}';
    w.document.head.appendChild(seal);

    w.addEventListener('keydown', e => {
      if (!NAV.has(e.key)) return;
      const el = w.document.activeElement;
      if (el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName))) return;
      e.preventDefault();
      // to the DECK itself (window.top), not just the parent: this slide now lives inside 12b, and only the deck
      // and its top-level slide frame carry the key handler — a key relayed one level up would die here
      window.top.dispatchEvent(new KeyboardEvent('keydown', { key: e.key, code: e.code, bubbles: true }));
    });
  });
})();

// ---- the build's driver ----------------------------------------------------
// The deck rebuilds this slide's frame on every visit, so arriving at the slide
// is what puts the build back at the start — there is no state to clear here.
(() => {
  const app = document.querySelector('.app');
  let at = 0;                                  // beats applied, 0..BEATS.length

  const model = () => { try { return app.contentWindow.__model; } catch (_) { return null; } };

  // Reset, then replay — see the note on BEATS. Returns false while the app is
  // still loading, which hands the step back to the DECK rather than swallowing
  // it and stranding the presenter on a phone that will not move.
  function apply(n) {
    const m = model();
    if (!m) return false;
    gen++;                                     // any beat still animating stops here
    m.setHoldQuick(false);
    if (n === at + 1) {                        // FORWARD: a cascade cut short lands whole, then the next beat plays live
      if (pendingRun) { const s = new Set(m.selectedNights); for (let di = pendingRun.first; di <= pendingRun.last; di++) s.add(di); m.setSelectedNights(s); pendingRun = null; }
      if (pendingTail) { const fn = pendingTail; pendingTail = null; fn(); }
      BEATS[n - 1](m, false); m.notify(); at = n; return true;
    }
    pendingRun = null; pendingTail = null;     // BACK or a jump: reset everything, replay to the target instantly
    m.setHeaderLock(false, false); m.setLayers({ stays: false }); m.undoTips(); m.clearTips(); m.setTipSheet(false); m.setUndoTile(false); m.setWandSheet(false); m.setWandTile(false); m.setShownMarks(null); m.setLayers({ marks: false }); m.revealOffset = 0; m.setPriceSheet(false); m.setMinSheet(false); m.setMinSheetNights(7); m.setPromoSheet(false); m.setPromoDrag(false); m.setPromoPct(0); m.setSettingsSheet(false); m.setCellPad(0); m.clearFlip(); m.clearWave();
    m.clearAll();
    m.set({ showSettings: false, openThread: null });
    m.tab = 'calendar';                        // not part of clearAll's remit
    for (let i = 0; i < n; i++) BEATS[i](m, true);
    m.notify();
    at = n;
    return true;
  }

  window.presoNext = () => at >= BEATS.length ? false : apply(at + 1);
  window.presoPrev = () => at <= 0 ? false : apply(at - 1);
})();

(() => {
  const screen = document.querySelector('.screen');
  const ui     = document.getElementById('ui');
  function fit() {
    ui.style.setProperty('--k', (screen.clientHeight + 1) / 812);
    // the band scrim's bottom edge lands exactly where the app frame's top edge is painted — measured, not computed
    const band = document.querySelector('.band-scrim'), app = document.querySelector('.app'); if (!band || !app) return;
    band.style.height = '';
    const k = (screen.clientHeight + 1) / 812, dpr = devicePixelRatio || 1;
    const painted = Math.round(app.getBoundingClientRect().top * dpr) / dpr;   // an iframe is painted on a whole device pixel; a rect only says where layout put it
    band.style.height = ((painted - band.getBoundingClientRect().top) / k) + 'px';
  }
  new ResizeObserver(fit).observe(screen);
  fit();
})();
</script>
</body>
</html>
