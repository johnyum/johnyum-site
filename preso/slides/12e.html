<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12e</title>
<!-- LESSON — the one-line verdict that closes the Calendar chapter.

     The line is set in the SAME type as the work list on slide 07: Special
     Gothic Condensed One at clamp(16px, 6.1vh, 62px), so the two read as the
     same voice at the same scale. "Lesson 3." sits on its own line above the verdict, so
     the deck's byline stays put and every slide's chrome is identical.
     No build. -->
<style>
  @font-face {
    font-family: "Special Gothic Condensed One";
    src: url("../fonts/SpecialGothicCondensedOne.woff2") format("woff2");
    font-weight: 400;
    font-display: block;
  }
  html, body {
    margin: 0; height: 100%;
    background: #fff; color: #111;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .slide { height: 100%; display: grid; place-items: center; }
  .pm { text-align: center; }
  h1 {
    margin: 0;
    font-family: "Special Gothic Condensed One", "Helvetica Neue", sans-serif;
    font-weight: 400;
    font-size: clamp(16px, 6.1vh, 62px);   /* slide 07's list, exactly */
    line-height: 1.06;
    letter-spacing: -0.01em;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="pm">
      <h1>Lesson 3.<br>Every new scale is a new user.</h1>
    </div>
  </div>
</body>
</html>
