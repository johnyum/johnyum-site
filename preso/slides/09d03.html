<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09d03</title>
<!-- THE ARTICLE (John, 2026-10-03) — straight after the fee flow (09d): Airbnb's own Resource Center page, "Simplifying service
     fees on Airbnb", on web, in the flights slide's device (09b, which is 09c's: the same --canvas, 32px stroke and 112px radius,
     so the three browsers are one size on the stage), without its phone.

     THE PICTURE IS THE LIVE PAGE, rendered here rather than screenshotted from a window: headless Chrome at 1880 x 1215 CSS px
     (the window John's own screenshot was taken in, cut to the device's 3041 : 1965 screen), at 2x, with the cookie dialog taken
     off before the shot — no browser chrome, no window shadow. Resampled to 2600 wide, as 09b's design is. Re-shoot with tools/capture-page.mjs at 1880 1215. The film's YouTube
     poster is whatever frame YouTube is showing that day. No build. -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .slide { height: 100%; display: grid; place-items: center; }

  /* The stage IS the device's outer box, so the phone can be placed against
     the big design directly and the two slides measure the same. */
  .stage {
    --canvas: min(92vw, calc(82vh * 1.59046));
    position: relative;
    width: calc(var(--canvas) * 0.91901);
    aspect-ratio: 3106 / 2031;
  }

  /* 09c's device, number for number. */
  .device {
    position: absolute; inset: 0;
    box-sizing: border-box;
    border: calc(var(--canvas) * 0.009468) solid #000;   /* the 32px stroke */
    border-radius: calc(var(--canvas) * 0.035);          /* the 112px radius */
    overflow: hidden;
    background: #fff;
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, 0.02),
      0 4px 8px rgba(0, 0, 0, 0.08),
      0 12px 30px rgba(0, 0, 0, 0.18);
  }
  .device img {
    display: block;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: bottom;        /* anything over height comes off the TOP */
  }

</style>
</head>
<body>
  <div class="slide">
    <div class="stage">
      <div class="device">
        <img src="assets/fee-article.webp" width="2600" height="1680"
             alt="Airbnb Resource Center: Simplifying service fees on Airbnb — what to know about switching to a single fee, with the film">
      </div>
    </div>
  </div>
</body>
</html>
