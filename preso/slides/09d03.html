<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09d03</title>
<!-- THE ARTICLE (John, 2026-10-03) — straight after the fee flow (09d): Airbnb's own Resource Center page, "Simplifying service
     fees on Airbnb", on web, in the flights slide's device (09b, which is 09c's: the same --canvas, 32px stroke and 112px radius,
     so the three browsers are one size on the stage), without its phone.

     THE PICTURE IS THE LIVE PAGE, rendered here rather than screenshotted from a window: headless Chrome at 1880 x 1215 CSS px
     (the window John's own screenshot was taken in, cut to the device's 3041 : 1965 screen), at 2x, with the cookie dialog taken
     off before the shot — no browser chrome, no window shadow. Resampled to 2600 wide, as 09b's design is. Re-shoot with tools/capture-page.mjs at 1880 1215. The film's YouTube
     poster is whatever frame YouTube is showing that day. No build. -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .slide { height: 100%; display: grid; place-items: center; }

  /* The stage IS the device's outer box, so the phone can be placed against
     the big design directly and the two slides measure the same. */
  .stage {
    --canvas: min(92vw, calc(82vh * 1.59046));
    position: relative;
    width: calc(var(--canvas) * 0.91901);
    aspect-ratio: 3106 / 2031;
  }

  /* 09c's device, number for number. */
  .device {
    position: absolute; inset: 0;
    box-sizing: border-box;
    border: calc(var(--canvas) * 0.009468) solid #000;   /* the 32px stroke */
    border-radius: calc(var(--canvas) * 0.035);          /* the 112px radius */
    overflow: hidden;
    background: #fff;
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, 0.02),
      0 4px 8px rgba(0, 0, 0, 0.08),
      0 12px 30px rgba(0, 0, 0, 0.18);
  }
  .device img {
    display: block;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: bottom;        /* anything over height comes off the TOP */
  }

  /* THE FILM PLAYS (John, 2026-10-03: "auto play from the start until I tap away"): YouTube's own player, muted and bare (no
     controls, no captions, no related films), laid exactly over the film's poster in the picture — 1606 x 902 at 497,130 on
     the 2600 x 1680 page, so 19.115% / 7.738% and 61.769% x 53.690% of the screen. It is only loaded once the slide is on
     stage (presoshown), so it starts from the top every time; the slide is built fresh on each arrival (presoNoKeep). It
     fades in over the poster once YouTube says it is playing, so a slow load shows the picture rather than a black box. */
  .film { position: absolute; left: 19.115%; top: 7.738%; width: 61.769%; height: 53.690%; border: 0; display: block;
          opacity: 0; transition: opacity .4s ease; pointer-events: none; background: transparent; }
  .film.on { opacity: 1; }
</style>
</head>
<body>
  <div class="slide">
    <div class="stage">
      <div class="device">
        <img src="assets/fee-article.webp" width="2600" height="1680"
             alt="Airbnb Resource Center: Simplifying service fees on Airbnb — what to know about switching to a single fee, with the film">
        <iframe class="film" id="film" title="Simplifying service fees | Airbnb" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin" tabindex="-1"></iframe>
      </div>
    </div>
  </div>
<script>
  (() => {
    const f = document.getElementById('film');
    const ID = '0UfCNna5llE';   // Airbnb's "Simplifying service fees" — the film the page itself embeds
    const start = () => {
      if (f.src) return;
      f.src = `https://www.youtube.com/embed/${ID}?autoplay=1&mute=1&controls=0&rel=0&modestbranding=1&iv_load_policy=3&cc_load_policy=0&playsinline=1&disablekb=1&fs=0&enablejsapi=1&origin=${encodeURIComponent(location.origin)}`;
      // once the player is up: listen to it (YouTube's 'widget' channel) and tell it to play — again every half second until it
      // reports playing, since autoplay alone is not always honoured (a muted embed usually is, but not in every case)
      f.addEventListener('load', () => {
        const say = o => { try { f.contentWindow.postMessage(JSON.stringify({ ...o, id: 1, channel: 'widget' }), '*'); } catch (_) {} };
        say({ event: 'listening' });
        const t0 = Date.now();
        (function nudge() { if (playing || Date.now() - t0 > 15000) return; say({ event: 'command', func: 'mute', args: [] }); say({ event: 'command', func: 'playVideo', args: [] }); setTimeout(nudge, 500); })();
      });
      setTimeout(() => f.classList.add('on'), 2500);   // ...shown after a beat regardless
    };
    let playing = false, lastT = -1;
    addEventListener('message', e => {
      let host = ''; try { host = new URL(e.origin).hostname; } catch (_) {}
      if (!/(^|\.)youtube\.com$/.test(host)) return;
      try { const d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data, info = d && d.info; if (!info) return;
        if (info.playerState === 1 || (typeof info.currentTime === 'number' && lastT >= 0 && info.currentTime > lastT)) { playing = true; f.classList.add('on'); }
        if (typeof info.currentTime === 'number') lastT = info.currentTime; } catch (_) {}
    });
    addEventListener('presoshown', start);
    if (window.top === window) addEventListener('load', start);
    window.presoNoKeep = true;   // leaving and coming back plays it from the start again
  })();
</script>
</body>
</html>
