<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09d03</title>
<!-- THE ARTICLE (John, 2026-10-03) — straight after the fee flow (09d): Airbnb's own Resource Center page, "Simplifying service
     fees on Airbnb", on web, in the flights slide's device (09b, which is 09c's: the same --canvas, 32px stroke and 112px radius,
     so the three browsers are one size on the stage), without its phone.

     THE PICTURE IS THE LIVE PAGE, rendered here rather than screenshotted from a window: headless Chrome at 1880 x 1215 CSS px
     (the window John's own screenshot was taken in, cut to the device's 3041 : 1965 screen), at 2x, with the cookie dialog taken
     off before the shot — no browser chrome, no window shadow. Resampled to 2600 wide, as 09b's design is. Re-shoot with tools/capture-page.mjs at 1880 1215. The film's YouTube
     poster is whatever frame YouTube is showing that day. No build. -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .slide { height: 100%; display: grid; place-items: center; }

  /* The stage IS the device's outer box, so the phone can be placed against
     the big design directly and the two slides measure the same. */
  .stage {
    --canvas: min(92vw, calc(82vh * 1.59046));
    position: relative;
    width: calc(var(--canvas) * 0.91901);
    aspect-ratio: 3106 / 2031;
  }

  /* 09c's device, number for number. */
  .device {
    position: absolute; inset: 0;
    box-sizing: border-box;
    border: calc(var(--canvas) * 0.009468) solid #000;   /* the 32px stroke */
    border-radius: calc(var(--canvas) * 0.035);          /* the 112px radius */
    overflow: hidden;
    background: #fff;
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, 0.02),
      0 4px 8px rgba(0, 0, 0, 0.08),
      0 12px 30px rgba(0, 0, 0, 0.18);
  }
  .device img {
    display: block;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: bottom;        /* anything over height comes off the TOP */
  }

  /* THE FILM PLAYS, CLEAN (John, 2026-10-03: "auto play from the start until I tap away … go straight into the video without
     all the UI … start even quicker and shorten the time between the header and the graph"). The film is a plain file
     (assets/fee-film.mp4) in a bare <video>, so there is no player and no chrome, laid exactly over the film's poster in the
     picture — 1606 x 902 at 497,130 on the 2600 x 1680 page, so 19.115% / 7.738% and 61.769% x 53.690% of the screen.
     THE RECUT is in the file, made from John's 1080p download of Airbnb's "Simplifying service fees" (no sound — it plays muted):
     1.2s–3.1s of the original (the tag already in, the title fading up and held a beat) and then 6.3s on (the title fading out
     and the first bar rising) — the bar is up 2.6s in, against 6.9s in the original. With ffmpeg:
       -filter_complex "[0:v]trim=start=1.2:end=3.1,setpts=PTS-STARTPTS[a];[0:v]trim=start=6.3,setpts=PTS-STARTPTS[b];
                        [a][b]concat=n=2:v=1:a=0[v]" -map "[v]" -c:v libx264 -crf 20 -preset slow -pix_fmt yuv420p
                        -movflags +faststart -an
     It starts as the slide lands (presoshown); the slide is built fresh on each arrival (presoNoKeep). */
  .film { position: absolute; left: 19.115%; top: 7.738%; width: 61.769%; height: 53.690%; display: block; object-fit: cover;
          background: #fff; pointer-events: none; }
  /* INSET (John, 2026-10-03: "a tiny shadow into the video above and below … max 8px … medium grey to white, multiplied"): an
     8px gradient along the film's top and bottom edges, #ebebeb at the edge to white, laid over it in multiply — white
     multiplies to nothing, so only the edges darken and the film reads a touch set in. */
  .inset { position: absolute; left: 19.115%; top: 7.738%; width: 61.769%; height: 53.690%; pointer-events: none; mix-blend-mode: multiply;
           background: linear-gradient(to bottom, #ebebeb, #fff) top / 100% 8px no-repeat,
                       linear-gradient(to top, #ebebeb, #fff) bottom / 100% 8px no-repeat; }
</style>
</head>
<body>
  <div class="slide">
    <div class="stage">
      <div class="device">
        <img src="assets/fee-article.webp" width="2600" height="1680"
             alt="Airbnb Resource Center: Simplifying service fees on Airbnb — what to know about switching to a single fee, with the film">
        <video class="film" id="film" src="assets/fee-film.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
        <div class="inset" aria-hidden="true"></div>
      </div>
    </div>
  </div>
<script>
  (() => {
    const v = document.getElementById('film');
    // it plays from the top as the slide lands, and on until the slide is left; built fresh on each arrival, so it always starts over
    const play = () => { try { v.currentTime = 0; } catch (_) {} const p = v.play(); if (p && p.catch) p.catch(() => {}); };
    addEventListener('presoshown', play);
    if (window.top === window) addEventListener('load', play);
    window.presoNoKeep = true;
  })();
</script>
</body>
</html>
