<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12dl</title>
<!-- WHAT IT TAUGHT (John, 2026-10-04) — the calendar's lesson, straight after the library of components (12d1), before the AI section.
     Set as the host-only fee's (09dl) is: one line, IBM Plex Mono at 40, centred, broken by hand after "complexity" (its comma gone, John, 2026-10-04). No build. -->
<style>
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../fonts/IBMPlexMono-Regular.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: block;
  }
  html, body { margin: 0; height: 100%; background: #fff; color: #111; overflow: hidden; }
  .slide { height: 100%; display: grid; place-items: center; padding: 0 48px; box-sizing: border-box; }
  .copy { max-width: min(1500px, 100%); font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 40px; line-height: 1.3; }
  .one { margin: 0; text-align: center; text-wrap: balance; }
</style>
</head>
<body>
  <div class="slide">
    <div class="copy">
      <p class="one">Users can handle complexity<br>when it's built the way they think.</p>
    </div>
  </div>
<script>
  window.presoNext = () => false;   // one line, no builds
  window.presoPrev = () => false;
  window.presoState = () => 0;
  window.presoRestore = () => {};
</script>
</body>
</html>
