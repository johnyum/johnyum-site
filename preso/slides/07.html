<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>07</title>
<!-- The work list, and the three projects it narrows down to.

     The deck pushes this slide in from the right in the usual way, and pushes
     it off left to the Luxé title — no morph, no shared element.

       beat 0  all thirteen lines, condensed and all black, sized off the
               viewport height so they always fit
       beat 1  a two-part move on ONE tap: the nine that aren't the story fade
               out where they stand, and only once they are gone do the
               remaining three close the gaps and settle as a block of three in
               the middle of the screen.
       beat 2  out of builds; the deck moves on to Luxé.

     The keepers' travel is MEASURED against the list's own line box, not
     hard-coded, because the type size comes from the viewport. Tapping back
     sends them home and brings the other nine with them. -->
<style>
  @font-face {
    font-family: "Special Gothic Condensed One";
    src: url("../fonts/SpecialGothicCondensedOne.woff2") format("woff2");
    font-weight: 400;
    font-display: block;
  }
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .slide { height: 100%; display: grid; place-items: center; }

  .list {
    position: relative;          /* so li.offsetTop is measured against the list */
    margin: 0; padding: 0; list-style: none;
    font-family: "Special Gothic Condensed One", "Helvetica Neue", sans-serif;
    font-weight: 400;
    font-size: clamp(16px, 6.1vh, 62px);
    line-height: 1.06;
    letter-spacing: -0.01em;
    color: #111;
    text-align: center;
  }
  .list li {
    transition: opacity 420ms ease, transform 760ms cubic-bezier(0.16, 1, 0.3, 1);
    will-change: opacity, transform;
  }
  /* the nine go first ... */
  body.four .list li:not(.keep) { opacity: 0; }
  /* ... and only then do the keepers close up, which is what the delay buys */
  body.four .list li.keep { transform: translateY(var(--ty, 0px)); transition-delay: 0ms, 430ms; }

  @media (prefers-reduced-motion: reduce) { .list li { transition: none; } }
</style>
</head>
<body>
  <div class="slide">
    <ul class="list" id="list">
      <li class="keep">Lux&eacute;</li>
      <li>Business travel</li>
      <li>Design systems</li>
      <li>Search</li>
      <li>Transportation</li>                      <!-- parked for now — fades with the nine -->
      <li>Host tools</li>
      <li>Earnings</li>
      <li>Gift cards</li>
      <li class="keep">Host setup</li>
      <li>Payments</li>
      <li>Photography</li>
      <li>Pricing</li>
      <li class="keep">Host calendar</li>
    </ul>
  </div>
<script>
(() => {
  const list = document.getElementById('list');
  const keep = [...list.querySelectorAll('.keep')];
  let closed = false;

  // Where each keeper has to travel to sit as a centred block (of however many keep).
  // Measured off the real line box, since the type is sized from the viewport.
  function measure() {
    if (closed) return;                       // don't move the goalposts mid-flight
    const rows = [...list.children];
    const lh = rows[1].offsetTop - rows[0].offsetTop;
    if (!lh) return;                          // not laid out yet
    const mid = list.offsetHeight / 2;
    keep.forEach((el, i) => {
      const target = mid - (keep.length / 2 - i) * lh;   // block of keep.length, centred
      el.style.setProperty('--ty', (target - el.offsetTop) + 'px');
    });
  }

  (document.fonts ? document.fonts.ready : Promise.resolve()).then(measure);
  setTimeout(measure, 1200);                  // backstop if fonts never settle
  addEventListener('resize', measure);

  window.presoNext = () => {
    if (closed) return false;                 // out of builds — on to Luxé
    measure();
    closed = true;
    document.body.classList.add('four');
    return true;
  };
  window.presoPrev = () => {
    if (!closed) return false;                // the deck goes back to the lockup
    closed = false;
    document.body.classList.remove('four');
    measure();
    return true;
  };
})();
</script>
</body>
</html>
