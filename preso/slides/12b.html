<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12b</title>
<!-- THE CALENDAR STUDIES — every calendar style tried, in three neat rows.

     Sits between the "Airbnb hosts manage…" line (12a) and the live build (13).
     The 28 phones in assets/Calendar/ stand in three rows of 9 / 10 / 9, in
     the order of John's reference board. The deck pushes the whole sheet in
     from the right like any slide.

     THE LAST PHONE IS THE REAL THING. The middle row's tenth slot is not a
     picture: it is slide 13 — the live Host Calendar in its drawn iPhone —
     loaded here in an iframe the size of the whole viewport and scaled down
     until its phone sits exactly in the slot. So it comes in with the sheet,
     already running.

     THE BUILD — one tap, two movements
       1  the whole rigid sheet slides LEFT until the live phone is smack in
          the centre of the frame (it is already on the centre row, so this is
          a pure horizontal shift), and the other 27 fade to nothing over the
          same slide — gone by the time the live phone lands;
       2  THEN the live phone grows to full size where it stands — its
          transform simply animates back to none, which IS slide 13's layout.
       From then on this slide is the live build: the deck's 13.html is not in
       the manifest, it only lives here, and the taps forward to its beats.
       presoInteractive so the phone keeps its surface; the app's own key
       relay reaches the deck through this window.

     SIZING: the sheet is taller than the frame ON PURPOSE. The rows are sized
     so that three of them plus their gutters come to 100vh + 20% of a phone,
     and the sheet is centred — so the top row loses its top 10% above the
     frame and the bottom row its bottom 10% below it, and the studies fill
     the space instead of floating in it. HEIGHT alone sets the size: on a
     wide screen the ten-phone middle row runs a little past both edges, which
     is the reference board's edge-to-edge look, not a bug. -->
<style>
  :root {
    --gap: 1vw;                                   /* gutter between phones */
    --rowgap: 1.6vh;
    --crop: 0.1;                                  /* of a phone, off the top row's top and the bottom row's bottom */
    /* three rows + two gutters = 100vh + 2·crop·h  →  h = (100vh − 2·gutter) / (3 − 2·crop) */
    --h-fill: calc((100vh - 2 * var(--rowgap)) / (3 - 2 * var(--crop)));
    --h: var(--h-fill);
    --w: calc(var(--h) * 450 / 920);
  }
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  #sheet {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    gap: var(--rowgap);
    --dx: 0px;                                    /* set by JS: how far left puts the live phone on centre */
    transform-origin: 50% 50%;
    transition: transform 900ms cubic-bezier(0.16, 1, 0.3, 1), opacity 900ms ease;
  }
  /* 1: the sheet slides as one rigid thing and fades out on the way — the
     other 27 are gone by the time the live phone lands on centre. (The live
     phone is not in the sheet, so it rides the slide at full opacity.) */
  body.shift #sheet { transform: translateX(var(--dx)); opacity: 0; }
  .row { display: flex; gap: var(--gap); justify-content: center; flex: none; }
  .phone { width: var(--w); height: var(--h); flex: none; }
  .phone img { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }

  /* the live build: a whole-viewport iframe of 13.html, scaled down so its
     centred phone lands in the last slot; on the tap the transform goes to
     none and it is simply slide 13 */
  .live {
    position: fixed; left: 0; top: 0;
    width: 100vw; height: 100vh;
    border: 0; display: block;
    background: transparent;
    transform-origin: 50% 50%;
    z-index: 5;
  }
  body.shift .live, body.grown .live { transition: transform 900ms cubic-bezier(0.16, 1, 0.3, 1); }
  @media (prefers-reduced-motion: reduce) {
    #sheet, body.shift .live, body.grown .live { transition: none; }
  }
</style>
</head>
<body>
  <div id="sheet">
    <div class="row">
      <div class="phone"><img src="assets/Calendar/Component 102.png" alt=""></div>
      <div class="phone"><img src="assets/Calendar/Component 92.png" alt=""></div>
      <div class="phone"><img src="assets/Calendar/Component 92-10.png" alt=""></div>
      <div class="phone"><img src="assets/Calendar/Component 92-11.png" alt=""></div>
      <div class="phone"><img src="assets/Calendar/Component 99.png" alt=""></div>
      <div class="phone"><img src="assets/Calendar/Component 92-12.png" alt=""></div>
      <div class="phone"><img src="assets/Calendar/Component 92-13.png" alt=""></div>
      <div class="phone"><img src="assets/Calendar/Component 92-14.png" alt=""></div>
      <div class="phone"><img src="assets/Calendar/Component 101-1.png" alt=""></div>
    </div>
    <div class="row">
      <div class="phone"><img src="assets/Calendar/Component 93.png" alt=""></div>
      <div class="phone"><img src="assets/Calendar/Component 92-2.png" alt=""></div>
      <div class="phone"><img src="assets/Calendar/Component 92-3.png" alt=""></div>
      <div class="phone"><img src="assets/Calendar/Component 92-4.png" alt=""></div>
      <div class="phone"><img src="assets/Calendar/Component 100-1.png" alt=""></div>
      <div class="phone"><img src="assets/Calendar/Component 92-5.png" alt=""></div>
      <div class="phone"><img src="assets/Calendar/Component 92-6.png" alt=""></div>
      <div class="phone"><img src="assets/Calendar/Component 92-7.png" alt=""></div>
      <div class="phone"><img src="assets/Calendar/Component 92-8.png" alt=""></div>
      <div class="phone" id="slot"></div>
    </div>
    <div class="row">
      <div class="phone"><img src="assets/Calendar/Component 94.png" alt=""></div>
      <div class="phone"><img src="assets/Calendar/Component 95.png" alt=""></div>
      <div class="phone"><img src="assets/Calendar/Component 96.png" alt=""></div>
      <div class="phone"><img src="assets/Calendar/Component 97.png" alt=""></div>
      <div class="phone"><img src="assets/Calendar/Component 98.png" alt=""></div>
      <div class="phone"><img src="assets/Calendar/Component 100.png" alt=""></div>
      <div class="phone"><img src="assets/Calendar/Component 92-9.png" alt=""></div>
      <div class="phone"><img src="assets/Calendar/Component 92-1.png" alt=""></div>
      <div class="phone"><img src="assets/Calendar/Component 101.png" alt=""></div>
    </div>
  </div>

  <iframe class="live" id="live" src="13.html?embed=1" title="Host Calendar"></iframe>

<script>
(() => {
  window.presoInteractive = true;   // the live phone keeps its surface; the clicker and the edge rails drive
  const live = document.getElementById('live'), slot = document.getElementById('slot'), sheet = document.getElementById('sheet');
  const SHIFT_MS = 900;                      // movement 1's length; movement 2 starts as it lands
  let state = 0, timer = 0;                  // 0 in the sheet · 1 sliding to centre · 2 grown (13 drives)
  const grown = () => state === 2;
  // 13's phone is min(80vh, 1080px) tall, centred in its viewport — which is
  // this one. In the sheet the live frame is translated so that centre lands
  // on the slot; sliding puts the slot's column on the frame's centre line,
  // so the live frame's translate loses its x and the sheet gains --dx.
  // The slot is measured with the sheet's transform switched OFF for the read
  // (no transition, restored at once, the browser never paints it): once the
  // sheet is sliding or shrinking, a rect read through it is scaled and shifted
  // and every number below goes wrong.
  let geo = null;
  function measure() {
    const t = sheet.style.transform, tr = sheet.style.transition;
    sheet.style.transition = 'none'; sheet.style.transform = 'none';
    const r = slot.getBoundingClientRect();
    sheet.style.transform = t; void sheet.offsetWidth; sheet.style.transition = tr;
    geo = { cx: r.left + r.width / 2, cy: r.top + r.height / 2, s: r.height / Math.min(innerHeight * 0.8, 1080) };
    sheet.style.setProperty('--dx', (innerWidth / 2 - geo.cx).toFixed(2) + 'px');
  }
  function place() {
    if (!geo) measure();
    const { cx, cy, s } = geo;
    if (state === 0) live.style.transform = `translate(${(cx - innerWidth / 2).toFixed(2)}px, ${(cy - innerHeight / 2).toFixed(2)}px) scale(${s.toFixed(5)})`;
    else if (state === 1) live.style.transform = `translate(0px, ${(cy - innerHeight / 2).toFixed(2)}px) scale(${s.toFixed(5)})`;
    else live.style.transform = 'none';
  }
  place();
  addEventListener('resize', () => { measure(); place(); });
  // once grown, the taps are 13's: its own build steps until it says it is out
  const inner = fn => { try { const f = live.contentWindow[fn]; return f ? f() : false; } catch (_) { return false; } };
  function grow() { state = 2; document.body.classList.add('grown'); place(); }
  window.presoNext = () => {
    if (grown()) return inner('presoNext');
    if (state === 1) return true;            // still sliding: movement 2 is already scheduled
    state = 1; document.body.classList.add('shift'); place();
    timer = setTimeout(grow, SHIFT_MS + 40);
    return true;
  };
  window.presoPrev = () => {
    if (state === 0) return false;
    if (grown() && inner('presoPrev')) return true;   // 13 stepped back a beat
    clearTimeout(timer);                     // 13 is at its start (or we never got there): back into the sheet
    state = 0; document.body.classList.remove('grown', 'shift'); place();
    return true;
  };
})();
</script>
</body>
</html>
