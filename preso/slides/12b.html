<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12b</title>
<!-- THE CALENDAR STUDIES — every calendar style tried, raining in as a pile.

     Sits between the "Airbnb hosts manage…" line (12a) and the live build (13).
     The deck pushes it in, and the 27 phones in assets/Calendar/ rain down and
     pile up, using the SAME rigid-body pile as johnyum.com's front page (the
     retired work pile in /index.html): Matter.js, one material for every
     card, a gently wavy floor so they lean on each other, sleeping bodies so
     the settled pile is dead still. Trimmed to what a slide needs — no hover,
     no drag, no open — and with the physics constants kept as they were,
     because that pile's feel took a long time to find.

     THE BUILD
       land    the phones start falling ~a beat after the slide lands
       tap 1   the whole pile slides off LEFT (the deck's own push easing);
               physics freezes the instant it goes so nothing shifts in flight
       tap 2   out of builds — the deck moves on to the live calendar

     The PNGs are 450x920 with the iPhone chrome baked in and transparent
     corners, so a card IS a phone. Sized by viewport area, like the pile:
     the phones cover the same fraction of the screen at every size. -->
<script src="../../js/matter.min.js"></script>
<style>
  :root { --ease: cubic-bezier(0.16, 1, 0.3, 1); --slide-ms: 1000ms; }
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  #pile {
    position: fixed; inset: 0;
    overflow: hidden;
    pointer-events: none;
    transition: transform var(--slide-ms) var(--ease);
  }
  /* the build: the pile leaves as one object, the way 09's walls do */
  body.gone #pile { transform: translateX(calc(-100vw - 48px)); }
  .card {
    position: absolute; left: 0; top: 0;
    will-change: transform;
    transform: translateZ(0);
  }
  .card img {
    display: block;
    width: 100%; height: 100%;
    user-select: none;
    -webkit-user-drag: none;
  }
  @media (prefers-reduced-motion: reduce) {
    #pile { transition: none; }
  }
</style>
</head>
<body>
  <div id="pile"></div>

<script>
(() => {
  const { Engine, World, Bodies, Body, Sleeping } = Matter;
  const DIR = 'assets/Calendar/';
  const FILES = ["Component 100-1.png", "Component 100.png", "Component 101-1.png", "Component 101.png", "Component 102.png", "Component 92-1.png", "Component 92-10.png", "Component 92-11.png", "Component 92-12.png", "Component 92-13.png", "Component 92-14.png", "Component 92-2.png", "Component 92-3.png", "Component 92-4.png", "Component 92-5.png", "Component 92-6.png", "Component 92-7.png", "Component 92-8.png", "Component 92-9.png", "Component 92.png", "Component 93.png", "Component 94.png", "Component 95.png", "Component 96.png", "Component 97.png", "Component 98.png", "Component 99.png"];
  const NAT = { w: 450, h: 920 };            // every study is the same phone export
  const PAD = 2.5;                           // half the ~5px force field, on every side
  const MAX_TILT = Math.PI * 0.306;          // 55° max lean either side
  const COVER = 0.62;                        // fraction of the screen the pile fills: as big as the phones can be while the pile still fits under the top
  const CADENCE = 9;                         // frames between drops — even, no burst
  const LAND_HOLD = 700;                     // the deck's push is 640ms; the first phone falls after it lands
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const pile = document.getElementById('pile');
  let engine = null, walls = [], cards = [], pendingCards = [];
  let frames = 0, nextDrop = 0, leak = 0;
  let pileAsleep = false, calmFrames = 0, gone = false;
  function wakePile() { pileAsleep = false; calmFrames = 0; }

  function makeWalls(W, H) {
    const t = 400, reach = leak;
    for (const w of walls) World.remove(engine.world, w);
    walls = [
      Bodies.rectangle(-reach - t / 2, H / 2 - H, t, H * 4, { isStatic: true }),
      Bodies.rectangle(W + reach + t / 2, H / 2 - H, t, H * 4, { isStatic: true })
    ];
    // wavy floor: sine-wave segments so phones come to rest at gentle angles
    const totalW = W + reach * 2, N = 20, segW = totalW / N;
    const amp = 9, freq = 2.5, k = (freq * 2 * Math.PI) / totalW;
    for (let i = 0; i < N; i++) {
      const cx = -reach + (i + 0.5) * segW;
      const cy = H + amp * Math.sin(k * cx) + t / 2;
      const angle = Math.atan(amp * k * Math.cos(k * cx));
      walls.push(Bodies.rectangle(cx, cy, segW + 2, t, { isStatic: true, angle, friction: 0.4, frictionStatic: 0.5, restitution: 0 }));
    }
    World.add(engine.world, walls);
  }

  function start() {
    const W = innerWidth, H = innerHeight;
    engine = Engine.create({ enableSleeping: true, positionIterations: 16, velocityIterations: 10 });
    engine.gravity.y = 1.0;
    // sized by area so the pile covers the same fraction of any screen
    const targetArea = (W * H * COVER) / FILES.length;
    const w = Math.max(40, Math.sqrt(targetArea * NAT.w / NAT.h)), h = w * (NAT.h / NAT.w);
    leak = w * 0.55;                         // cards can poke out but ≥40% stays visible
    makeWalls(W, H);
    const order = [...FILES].sort(() => Math.random() - 0.5);
    pendingCards = order.map(f => {
      const el = document.createElement('div');
      el.className = 'card';
      el.style.width = w + 'px'; el.style.height = h + 'px';
      el.style.transform = `translate(${W / 2 - w / 2}px, ${-2 * h}px)`;
      const img = document.createElement('img');
      img.src = DIR + encodeURIComponent(f); img.alt = '';
      el.appendChild(img); pile.appendChild(el);
      return { el, w, h };
    });
    if (REDUCED) {                            // hard cut: the pile is simply there
      while (pendingCards.length) spawnNext();
      for (let i = 0; i < 600; i++) Engine.update(engine, 1000 / 60);
      render(); return;
    }
    requestAnimationFrame(step);
  }

  function spawnNext() {
    const def = pendingCards.shift();
    const spawnX = innerWidth * (0.14 + 0.72 * Math.random());
    const body = Bodies.rectangle(spawnX, -def.h * 0.6, def.w + PAD * 2, def.h + PAD * 2, {
      restitution: 0, friction: 0.18, frictionStatic: 0.25, frictionAir: 0.008, density: 0.0012,
      angle: (Math.random() - 0.5) * 0.28,
      chamfer: { radius: Math.min(10, def.w * 0.08) }
    });
    body.slop = 1.2; body.sleepThreshold = 20;
    Body.setVelocity(body, { x: (Math.random() - 0.5) * 1.4, y: 1.2 });
    Body.setAngularVelocity(body, (Math.random() - 0.5) * 0.05);
    World.add(engine.world, body);
    cards.push({ ...def, body });
    nextDrop = frames + CADENCE;
    wakePile();
  }

  function render() {
    for (const c of cards) {
      const b = c.body;
      c.el.style.transform = `translate(${(b.position.x - c.w / 2).toFixed(2)}px, ${(b.position.y - c.h / 2).toFixed(2)}px) rotate(${b.angle.toFixed(4)}rad)`;
    }
  }

  function step() {
    frames++;
    if (gone) return;                        // the pile left as one object; nothing may shift in flight
    if (pendingCards.length && frames >= nextDrop) spawnNext();
    if (!pileAsleep) {
      Engine.update(engine, 1000 / 120);
      Engine.update(engine, 1000 / 120);
      let maxMotion = 0;
      for (const c of cards) {
        const b = c.body;
        if (b.isSleeping) continue;
        const v = b.velocity, sp = Math.hypot(v.x, v.y);
        if (sp > 11) Body.setVelocity(b, { x: v.x / sp * 11, y: v.y / sp * 11 });
        let a = b.angle % (2 * Math.PI);
        if (a > Math.PI) a -= 2 * Math.PI; else if (a < -Math.PI) a += 2 * Math.PI;
        if (Math.abs(a) > MAX_TILT) { Body.setAngle(b, Math.sign(a) * MAX_TILT); Body.setAngularVelocity(b, b.angularVelocity * 0.25); }
        maxMotion = Math.max(maxMotion, sp, Math.abs(b.angularVelocity) * 40);
      }
      if (pendingCards.length === 0) {
        calmFrames++;
        if (maxMotion < 0.12 ? calmFrames > 35 : calmFrames > 480) pileAsleep = true;
      } else calmFrames = 0;
      render();
    }
    requestAnimationFrame(step);
  }

  // the deck pushes this slide in over 640ms; the first phone falls once it has landed
  setTimeout(start, LAND_HOLD);

  // THE BUILD: one tap sends the pile off left; the next lets the deck move on
  window.presoNext = () => { if (gone) return false; gone = true; document.body.classList.add('gone'); return true; };
  window.presoPrev = () => { if (!gone) return false; gone = false; document.body.classList.remove('gone'); wakePile(); requestAnimationFrame(step); return true; };
})();
</script>
</body>
</html>
