<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09c</title>
<!-- THE TRIP CREATOR — New York on the map, with flights, homes and
     experiences priced into one plan. Straight after the flights slide.

     NO ANIMATION OF ITS OWN. The deck pushes it in from the right and off to
     the left, and that is all. An earlier pass had it rise and fade on arrival,
     which read as a second, competing move on top of the push.

     SAME SIZE AS THE FLIGHTS WEB LAYER, CENTRED. 09b lays its web design out
     as 94.687% of a stage sized min(92vw, 82vh * 4668/2935); this is the same
     artwork at the same 4420x2935, so repeating that expression lands it at
     exactly the same width — it just sits in the middle of the slide, because
     there is no phone beside it here.

       4668 / 2935 = 1.59046   the flights stage's aspect
       0.94687                 the web layer's share of that stage

     No script. -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .slide { height: 100%; display: grid; place-items: center; }
  img {
    display: block;
    width: calc(min(92vw, 82vh * 1.59046) * 0.94687);
    height: auto;
    user-select: none;
    -webkit-user-drag: none;
  }
</style>
</head>
<body>
  <div class="slide">
    <img src="assets/trip-creator.webp" width="3200" height="2125"
         alt="Airbnb trip creator: a map of New York with airport and borough prices, and a panel offering flights, homes and experiences">
  </div>
</body>
</html>
