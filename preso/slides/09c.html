<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09c</title>
<!-- EXPLORE — the mini trip creator, LIVE. Straight after the flights slide.

     This replaces the flat trip-creator export that stood here as a
     placeholder. The device around it is that export's own device, measured
     off it rather than guessed, so the slide keeps the same silhouette and
     the same height it had — only now there is a real page inside.

     MEASURED OFF assets/trip-creator.webp (3200x2125 canvas):
       device outer   3106 x 2031      -> aspect 3106/2031
       stroke            32            -> 32/3200  = 0.009468 of the canvas
       corner radius    112            -> 112/3200 = 0.035    of the canvas
       screen inner   3041 x 1965      -> aspect 3041/1965

     The canvas width is the expression 09c used before — the flights web
     layer's own — so the device lands at exactly the height the export did:
     1078 x 705 on a 1600x900 stage, against the export's 1078 x 705.

     THE PAGE IS SCALED, NOT REFLOWED. /explore/ has a fixed 88px header and a
     fixed 380px card; letting it lay out at the screen's own ~1040px would
     make that chrome proportionally huge and stop it looking like the design.
     So it renders at a 1512pt viewport — the width slide 09's PDP is built to
     — and is scaled down to fit. 1512 x 977 keeps the screen's 3041/1965.

     A ResizeObserver sets the scale, deliberately: it fires when the element
     first gets a box, which is what happens when the deck un-parks the slide.
     rAF does not run while parked and a load-time measurement reads zero, so
     both of those leave the page at the wrong scale. See 09b for the full set
     of ways a parked iframe breaks this.

     NOTE: this is a live page and it fetches Mapbox tiles, so unlike every
     other slide in the deck it needs the network to look right.

     No entrance of its own — the deck pushes it in from the right.

     TWO BUILDS, AND IT HOVERS BEFORE EACH ONE. The hover is not part of the
     tap: it happens on its own so the line it draws can be talked over, and
     the tap is what John does when he is ready.

       on arrival   a pause, then New York hovers by itself — mouseenter,
                    which is what draws the dotted flight leg. It stays.
       tap 1        New York is clicked. The page flies there, and once it has
                    landed and held a beat, Brooklyn hovers by itself — which
                    draws the drives from all three airports.
       tap 2        Brooklyn is clicked.
       tap 3        out of builds; the deck moves on.

     No mouseleave is ever sent, which is deliberate: the leg stays drawn for
     as long as the hover is meant to be read.

     THE ARRIVAL HOVER IS GATED the way 09e's video is — presoshown first, then
     a poll that asks the DECK's window for computed style. The deck parks
     slides ahead of time, and a hover fired while parked would spend the whole
     pause where nobody can see it and land with the line already drawn.

     It drives the PAGE'S OWN handlers rather than faking anything — the pins
     are real elements and go() is the page's own state machine, so what the
     room sees is the build behaving, not a recording of it.

     THE POINTER IS A 40x40 WHITE DOT that fades in on hover and presses in and
     out on the tap. An earlier pass drew a stroked ring that rippled outward;
     it read as a black outline ballooning over the map and took the eye off
     the thing being clicked. The dot is injected into the page so it scales
     with it — drawn in the slide it would need the --k scale applied by hand.

     Tapping back walks it out through the page's own back buttons, so the
     slide can be replayed. -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .slide { height: 100%; display: grid; place-items: center; }

  .device {
    /* the export's own canvas width, so the device matches its height exactly */
    --canvas: min(92vw, calc(82vh * 1.59046));
    box-sizing: border-box;
    width: calc(var(--canvas) * 0.91901);     /* 3106/3200 of the canvas, x 0.94687 */
    aspect-ratio: 3106 / 2031;
    border: calc(var(--canvas) * 0.009468) solid #000;   /* the 32px stroke */
    border-radius: calc(var(--canvas) * 0.035);          /* the 112px radius */
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, 0.02),
      0 4px 8px rgba(0, 0, 0, 0.08),
      0 12px 30px rgba(0, 0, 0, 0.18);
  }
  .screen { position: relative; width: 100%; height: 100%; overflow: hidden; background: #fff; }
  .page {
    position: absolute; left: 0; top: 0;
    width: 1512px; height: 977px;            /* 1512 : 977 is the screen's 3041 : 1965 */
    border: 0; display: block;
    transform: scale(var(--k, 1));
    transform-origin: top left;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="device">
      <div class="screen" id="screen">
        <iframe class="page" id="page" title="Explore — trip creator" src="/explore/"></iframe>
      </div>
    </div>
  </div>
<script>
(() => {
  const screen = document.getElementById('screen');
  const page = document.getElementById('page');
  const fit = w => { if (w > 0) screen.style.setProperty('--k', w / 1512); };
  // ResizeObserver, not rAF and not a load-time read: it fires when the element
  // first gets a box, which is exactly when the deck un-parks this slide. A
  // measurement taken while parked reads zero and would stick.
  new ResizeObserver(([e]) => fit(e.contentRect.width)).observe(screen);
  fit(screen.getBoundingClientRect().width);   // if it is already on stage

  // ── the flow-through ──────────────────────────────────────────────────
  const LAND_PAUSE = 900;    // the slide lands, holds, then hovers New York
  const FLY        = 2400;   // the page's own flyTo, going deeper
  const SETTLE     = 520;    // after the camera lands, before the next hover

  const doc = () => { try { return page.contentDocument; } catch (_) { return null; } };
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // The hood markers are only added once the city beat opens, so Brooklyn is
  // not in the document when the flow starts. Wait for it rather than assume.
  async function find(sel, ms = 3000) {
    const t0 = Date.now();
    for (;;) {
      const d = doc(); const el = d && d.querySelector(sel);
      if (el) return el;
      if (Date.now() - t0 > ms) return null;
      await sleep(80);
    }
  }

  let styled = false;
  function paint() {
    const d = doc(); if (!d || styled) return; styled = true;
    const st = d.createElement('style');
    st.textContent =
      // A 40x40 white dot, and nothing else. It reads as a fingertip on a light
      // map, which a stroked ring did not — that came out as a black outline
      // ballooning across the screen and pulled the eye off what was clicked.
      // The shadow is only there so it does not vanish over pale tiles.
      '.preso-cur{position:fixed;z-index:9999;pointer-events:none;' +
      'width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;' +
      'background:rgba(255,255,255,.55);box-shadow:0 1px 4px rgba(0,0,0,.22);' +
      'opacity:0;transform:scale(.85);' +
      'transition:opacity .18s ease,transform .22s cubic-bezier(.16,1,.3,1)}' +
      '.preso-cur.on{opacity:1;transform:scale(1)}' +
      // the click: a short press in and out, the way a fingertip lands
      '.preso-cur.tap{transform:scale(.78);background:rgba(255,255,255,.8);' +
      'transition:transform .09s ease,background .09s ease}';
    d.head.appendChild(st);
  }

  function at(el) {                       // the pin head if there is one, else the marker
    const d = doc();
    const t = el.querySelector('.pin') || el;
    const r = t.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2, d };
  }

  let cur = null;
  function hover(el) {
    const d = doc(); if (!d) return;
    paint();
    const { x, y } = at(el);
    if (!cur || !cur.isConnected) { cur = d.createElement('div'); cur.className = 'preso-cur'; d.body.appendChild(cur); }
    cur.style.left = x + 'px'; cur.style.top = y + 'px';
    // Force a reflow IN THE PAGE'S OWN DOCUMENT, then add the class. A
    // requestAnimationFrame scheduled from this slide's window did not get the
    // ring painted at all — the class went on, but the transition never ran and
    // it stayed at opacity 0 through every hover. Reading offsetWidth commits
    // the from-state where the element actually lives.
    void cur.offsetWidth;
    cur.classList.add('on');
    el.dispatchEvent(new MouseEvent('mouseenter', { bubbles: false }));
    el.dispatchEvent(new MouseEvent('mouseover', { bubbles: true }));
  }

  function tap(el) {
    const d = doc(); if (!d) return;
    if (cur) {
      cur.classList.add('tap');            // press in
      setTimeout(() => cur && cur.classList.remove('tap'), 130);   // and out
      setTimeout(() => cur && cur.classList.remove('on'), 320);    // then away
    }
    el.click();                            // the page's own handler, not a fake
  }

  let step = 0;            // 0 = New York hovered, 1 = Brooklyn hovered, 2 = done
  let busy = false;

  async function hoverNY() {
    const ny = await find('.mk-city.hero');
    if (ny) hover(ny);
  }
  async function hoverBK() {
    const bk = await find('.mk-hood.hero');
    if (bk) hover(bk);
  }

  async function clickNY() {               // tap 1
    busy = true;
    const ny = await find('.mk-city.hero');
    if (ny) { tap(ny); await sleep(FLY + SETTLE); }
    await hoverBK();                       // land, hold, then hover the borough
    busy = false;
  }
  async function clickBK() {               // tap 2
    busy = true;
    const bk = await find('.mk-hood.hero');
    if (bk) tap(bk);
    busy = false;
  }

  async function rewind() {                // back out through the page's own buttons
    const d = doc(); if (!d) return;
    if (cur) cur.classList.remove('on');
    const bh = d.getElementById('backHood'); if (bh) { bh.click(); await sleep(FLY); }
    const b = d.getElementById('back'); if (b) { b.click(); await sleep(FLY); }
    step = 0; busy = false;
    hoverNY();
  }

  // THE ARRIVAL. Gated, not fired on load: the deck parks slides ahead of time
  // and a hover spent while parked would land with the line already drawn.
  let arrived = false;
  function land() {
    if (arrived) return;
    arrived = true;
    setTimeout(hoverNY, LAND_PAUSE);
  }
  function onStage() {
    try {
      const fe = window.frameElement;
      if (!fe) return true;
      const deck = fe.ownerDocument.defaultView;   // the DECK's window, not this one
      for (let n = fe; n && n.nodeType === 1; n = n.parentElement) {
        const cs = deck.getComputedStyle(n);
        if (cs.display === 'none' || cs.visibility === 'hidden') return false;
      }
      return fe.getBoundingClientRect().width > 0;
    } catch (_) { return true; }
  }
  addEventListener('presoshown', land);
  const t0 = Date.now();
  (function watch() {
    if (arrived) return;
    if (onStage() || Date.now() - t0 > 10000) { land(); return; }
    setTimeout(watch, 100);
  })();

  window.presoNext = () => {
    if (busy) return true;                 // mid-fly: swallow rather than skip a beat
    if (step === 0) { step = 1; clickNY(); return true; }
    if (step === 1) { step = 2; clickBK(); return true; }
    return false;                          // out of builds — on to Host setup
  };
  window.presoPrev = () => {
    if (step === 0) return false;          // on the arrival hover — back a slide
    rewind();
    return true;
  };
  window.presoState = () => step;
  window.presoRestore = n => {
    if (!(n > 0)) return;
    arrived = true;                        // do not also run the arrival hover
    (async () => { step = 1; await clickNY(); if (n > 1) { step = 2; await clickBK(); } })();
  };
})();
</script>
</body>
</html>
