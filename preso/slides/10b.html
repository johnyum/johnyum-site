<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10b</title>
<!-- The Host Setup chapter title, in the same treatment as Luxé on slide 08 —
     sentence case Anton, centred. Two words, so it is sized off the viewport
     WIDTH like Transportation (10) rather than off 'Hello!'. No build: the
     deck just pushes it in from the right, then on to the host-setup flow.

     Named 10b so the sorted manifest drops it between transportation (10a)
     and the flow (11) without renaming either. -->
<style>
  @font-face {
    font-family: "Anton";
    src: url("../fonts/Anton.woff2") format("woff2");
    font-weight: 400;
    font-display: block;
  }
  html, body {
    margin: 0; height: 100%;
    background: #fff; color: #111;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .slide { height: 100%; display: grid; place-items: center; }
  h1 {
    font-family: "Anton", "Helvetica Neue", sans-serif;
    font-weight: 400;
    /* two words, so WIDTH drives the size (the way Transportation on 10 does),
       not slide 01's single-word 'Hello!'. 18vw fits "Host Setup" with the
       same side air the other cards have; nowrap so it can never break.
       The floor is 40px, as on Transportation, NOT the single-word cards'
       128px: a width-driven size with a high floor overflows narrow
       viewports instead of shrinking to fit. At any presentation width
       (900px+) 18vw is already past 160px, so the floor never bites there. */
    font-size: clamp(40px, 18vw, 320px);
    line-height: 1;
    letter-spacing: -0.02em;   /* -2% */
    white-space: nowrap;
    margin: 0;
  }
</style>
</head>
<body>
  <div class="slide">
    <h1>Host Setup</h1>
  </div>
</body>
</html>
