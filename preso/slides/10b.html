<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10b</title>
<!-- The Setup chapter title, in the same treatment as Luxé on slide 08 —
     one word, sentence case, clamp(128px, 24vw, 320px) Anton. No build: the
     deck just pushes it in from the right, then on to the host-setup flow.

     Named 10b so the sorted manifest drops it between transportation (10a)
     and the flow (11) without renaming either. -->
<style>
  @font-face {
    font-family: "Anton";
    src: url("../fonts/Anton.woff2") format("woff2");
    font-weight: 400;
    font-display: block;
  }
  html, body {
    margin: 0; height: 100%;
    background: #fff; color: #111;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .slide { height: 100%; display: grid; place-items: center; }
  h1 {
    font-family: "Anton", "Helvetica Neue", sans-serif;
    font-weight: 400;
    font-size: clamp(128px, 24vw, 320px);
    line-height: 1;
    letter-spacing: -0.02em;   /* -2% */
    margin: 0;
  }
</style>
</head>
<body>
  <div class="slide">
    <h1>Setup</h1>
  </div>
</body>
</html>
