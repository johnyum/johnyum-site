<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10c</title>
<!-- THE PROBLEM — the setup that opens the Host setup chapter, the way 12a
     opens the Calendar one.

     The line is set in the SAME type as the work list on slide 07: Special
     Gothic Condensed One at clamp(16px, 6.1vh, 62px), one clause per line, so
     every statement slide in the deck reads as the same voice at the same
     scale. Named 10c so the manifest drops it between the Host Setup card
     (10b) and the flow (11). No build.

     ONE sentence, broken at its phrase boundaries, the way 12a is one
     sentence. Two earlier passes put a definition and a problem in the same
     three lines, which meant a full stop landing mid-line and the whole thing
     reading as two clunks instead of one thought.

     It never says "host setup" — the title card just did. It says what the
     thing IS by describing it, so anyone outside Airbnb follows without
     knowing the vocabulary, and it names the cause (too many steps) that the
     next slides answer by cutting eleven of them.

     THE RAG: three lines, the middle one the longest, so the block reads as a
     lozenge rather than a wedge or a flag. Centred type shows a bad break far
     more plainly than ragged-left does — the first draft put a 36-character
     line over a 12-character stub and came out as a staircase.

     Plain words on purpose. An earlier pass read "Host setup turns a home into
     a listing", which is how a system describes itself, not how a person says
     it. "How you get your home onto Airbnb" is the same fact in the room's own
     language, and the room is the point — the chapter title is two words of
     Airbnb vocabulary and anyone outside the company has to guess at them.

     "Many hosts gave up", NOT "never finished". Plenty of hosts did finish;
     the failure was how many fell out along the way, and a line claiming
     nobody got through is both wrong and trivially challenged from the room.

     Measured 456 / 649 / 422 — the middle 42% over the longer of its
     neighbours, top and bottom within 34px. Picked on that shape against
     twelve other phrasings, not by eye. -->
<style>
  @font-face {
    font-family: "Special Gothic Condensed One";
    src: url("../fonts/SpecialGothicCondensedOne.woff2") format("woff2");
    font-weight: 400;
    font-display: block;
  }
  html, body {
    margin: 0; height: 100%;
    background: #fff; color: #111;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .slide { height: 100%; display: grid; place-items: center; }
  .pm { text-align: center; }
  h1 {
    margin: 0;
    font-family: "Special Gothic Condensed One", "Helvetica Neue", sans-serif;
    font-weight: 400;
    font-size: clamp(16px, 6.1vh, 62px);   /* slide 07's list, exactly */
    line-height: 1.06;
    letter-spacing: -0.01em;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="pm">
      <h1>Putting a home on Airbnb<br>took so many steps that many hosts<br>gave up before the end.</h1>
    </div>
  </div>
</body>
</html>
