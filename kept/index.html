<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0..1,0&display=block" rel="stylesheet">
<!--
  Kept, the surface: projects on the left, the chat on the right, and in between a canvas where every
  screen the chat is building floats as its own window, at its own size: a phone as a phone, a website
  as a browser window (John: "projects on the left, chat on the right, and all the things I'm building
  floating as movable screens").

  - A project is one ongoing chat (underneath: a thread on its own branch and folder, Claude Code headless).
    "New chat" starts another; earlier ones stay in the chat's menu.
  - The canvas shows each page the chat has touched, live from the chat's own folder. Drag a window by its
    bar, resize it from its corner (it keeps its device's shape), switch its device on the bar. Where you put
    them is remembered per browser.
  - The canvas shows the whole project at once: what's live and every open branch, each labelled. Click a screen
    to talk to its branch. Option-drag a screen's bar to pull off a copy: a new branch from exactly what it showed.
  - Push puts the chat into Main and sends it live; a clash, or sorting a free session, opens over the canvas.

  The page polls every 1.5s. Each region redraws only when its own HTML changed; a screen's iframe is only
  ever pointed somewhere new, never rebuilt, or the page inside would reload under you.
-->
<style>
:root {
  --bg: #fff; --soft: #f5f5f5; --line: #ebebeb; --line-2: #d9d9d9;
  --ink: #111; --ink-2: #555; --ink-3: #8a8a8a; --blue: #2a6fdb;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
  --sans: 'IBM Plex Sans', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; position: fixed; inset: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
p { margin: 0; }
img { display: block; }
.app { display: grid; height: 100vh; grid-template-rows: minmax(0, 1fr); grid-template-columns: var(--nw) minmax(0, 1fr); grid-template-areas: "nav work"; }
nav { grid-area: nav; } .work { grid-area: work; position: relative; overflow: hidden; }

.hide { display: none !important; }
.sp { flex: 1; }
.btn { border: 1px solid var(--line-2); border-radius: 6px; padding: 4px 10px; font-size: 12px; white-space: nowrap; background: var(--bg); }
.btn:hover { border-color: var(--ink-3); }
.btn.dark { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.quiet { border-color: transparent; color: var(--ink-3); background: transparent; }
.btn.quiet:hover { color: var(--ink); }
.v { font-family: var(--mono); font-size: 11px; color: var(--ink-3); white-space: nowrap; }
.dot { flex: 0 0 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--blue); display: inline-block; }
.dot.pulse { animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.err { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 12px; border-radius: 6px; font-size: 12px; z-index: 9; max-width: 80vw; }

/* Projects */
nav { border-right: 1px solid var(--line); overflow-y: auto; padding: 10px 8px 40px; }
:root { --nw: 208px; }
.app.slim { --nw: 52px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; padding: 4px 8px 12px; }
.brand .ms { color: var(--ink); }
.ms.fill { font-variation-settings: 'opsz' 20, 'wght' 400, 'FILL' 1, 'GRAD' 0; }
.dotmark { font-size: 12px !important; color: var(--ink) !important; text-align: center; }   /* the black dot: Kept, and any project without its own icon */
.fold { margin-left: auto; width: 24px; height: 24px; border-radius: 5px; display: grid; place-items: center; color: var(--ink-3); }
.fold:hover { background: var(--soft); color: var(--ink); }
.fold .ms { color: inherit; }
/* Collapsed: icons only, names on hover */
.slim nav { padding: 10px 6px 40px; overflow-x: hidden; }
.slim .brand { flex-direction: column; gap: 10px; padding: 4px 0 12px; }
.slim .brand .name { display: none; }
.slim .fold { margin: 0; }
.slim .proj, .slim .plus { justify-content: center; padding: 8px 0; }
.slim .proj .t, .slim .proj .dot { display: none; }
.slim .proj { position: relative; }
.proj { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border-radius: 6px; }
.proj:hover { background: var(--soft); }
.proj.on { background: var(--ink); color: var(--bg); }
.proj .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj input { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--ink-3); border-radius: 4px; padding: 1px 5px; margin: -2px 0; outline: none; }
.ms { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 18px; line-height: 1; letter-spacing: normal;
      text-transform: none; white-space: nowrap; direction: ltr; -webkit-font-smoothing: antialiased; font-feature-settings: 'liga';
      font-variation-settings: 'opsz' 20, 'wght' 400, 'FILL' 0, 'GRAD' 0; flex: 0 0 18px; width: 18px; overflow: hidden; color: var(--ink-2); }
.proj.on .ms { color: inherit; }
/* The + is an icon like the others: no box round it */
.plus { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; margin-top: 4px; border-radius: 6px; color: var(--ink-3); }
.plus .ms { color: inherit; font-size: 20px; flex-basis: 18px; }
.plus:hover { background: var(--soft); color: var(--ink); }
.plus.on { background: var(--ink); color: var(--bg); }

/* The canvas: every screen the chat is building, floating */
.canvas { position: absolute; inset: 0; overflow: auto; background-color: #fafafa;
          background-image: radial-gradient(circle, #dcdcdc 1px, transparent 1.2px); background-size: 20px 20px; }
.tools { position: absolute; top: 10px; left: 12px; z-index: 5; display: flex; gap: 8px; align-items: center; pointer-events: none; }
.tools > * { pointer-events: auto; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 7px; padding: 2px; gap: 2px; background: var(--bg); }
.seg button { padding: 2px 10px; border-radius: 5px; font-size: 12px; color: var(--ink-2); }
.seg button.on { background: var(--ink); color: var(--bg); }
.chip { background: var(--ink); color: var(--bg); font-size: 11px; padding: 3px 8px; border-radius: 5px; display: inline-flex; gap: 8px; align-items: center; }
.chip button { color: var(--bg); text-decoration: underline; }
.wins { position: absolute; left: 0; top: 0; }
.empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-3); text-align: center; padding: 40px; pointer-events: none; }
.empty h1 { font-size: 26px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 6px; color: var(--ink); }

.win { position: absolute; display: flex; flex-direction: column; }
.win .wbar { height: 26px; flex: 0 0 26px; display: flex; align-items: center; gap: 6px; padding: 0 8px; font-size: 11px; color: var(--ink-2);
             cursor: grab; user-select: none; white-space: nowrap; overflow: hidden; }
.win .wbar:active { cursor: grabbing; }
.win .wbar b { font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; }
.win .dev { margin-left: auto; font-size: 10px; border: 1px solid var(--line-2); border-radius: 4px; padding: 0 5px; color: var(--ink-2); background: var(--bg); }
.win .dev:hover { border-color: var(--ink-3); }
.win .view { position: relative; overflow: hidden; background: #fff; flex: 1; }
.win iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; background: #fff; }
.win .grip { position: absolute; right: -4px; bottom: -4px; width: 18px; height: 18px; cursor: nwse-resize; z-index: 2; }
.win .grip::after { content: ''; position: absolute; right: 6px; bottom: 6px; width: 8px; height: 8px; border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3); border-radius: 0 0 3px 0; opacity: .6; }
.win:hover .grip::after { opacity: 1; }
.win.top { z-index: 3; }
/* A website: a browser window */
.win.desktop, .win.tablet { background: var(--bg); border: 1px solid var(--line-2); border-radius: 10px; overflow: visible; box-shadow: 0 10px 30px rgba(0,0,0,.10); }
.win.desktop .wbar, .win.tablet .wbar { background: var(--soft); border-bottom: 1px solid var(--line); border-radius: 10px 10px 0 0; }
.win.desktop .view, .win.tablet .view { border-radius: 0 0 10px 10px; }
.win.desktop .wbar::before { content: ''; flex: 0 0 34px; height: 8px; background: radial-gradient(circle at 4px 4px, #e0e0e0 3.5px, transparent 4px) 0 0 / 12px 8px repeat-x; }
/* A phone: a phone */
.win.phone .wbar { background: transparent; padding: 0 4px; }
.win.phone .view { border: 7px solid #111; border-radius: 34px; box-shadow: 0 14px 36px rgba(0,0,0,.18); }
.win.live .wbar b::before { content: 'Live · '; font-weight: 400; color: var(--ink-3); }
.win.sel .view { outline: 2px solid var(--blue); outline-offset: 2px; }
.win.phone.sel .view { outline-offset: 3px; }
.copyghost { position: absolute; z-index: 9; border: 2px dashed var(--blue); border-radius: 10px; background: rgba(42,111,219,.06); pointer-events: none;
             display: flex; align-items: flex-start; padding: 6px 8px; font-size: 11px; color: var(--blue); font-weight: 600; }
.dragging iframe { pointer-events: none; }

/* A clash, or sorting a session: over the canvas */
.clash { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; padding: 16px 16px 150px; gap: 12px; z-index: 6; }
.clash h3 { margin: 0; font-size: 16px; font-weight: 600; }
.clash .sub { color: var(--ink-3); }
.clash .three { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 12px; }
.clash .pane { display: flex; flex-direction: column; gap: 6px; min-height: 0; }
.clash .pane b { font-weight: 600; font-size: 12px; }
.clash .pane b span { color: var(--ink-3); font-weight: 400; }
.clash .frame { flex: 1; position: relative; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; background: var(--soft); }
.clash .frame iframe { position: absolute; left: 0; top: 0; width: 200%; height: 200%; border: 0; transform: scale(.5); transform-origin: 0 0; background: #fff; }
.clash .pane.big .frame { border: 2px solid var(--ink); }
.clash .acts { display: flex; gap: 8px; align-items: center; }
.piles { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; align-content: start; }
.pile { border: 1px solid var(--line-2); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.pile.off { opacity: .4; }
.pile .frame { height: 140px; flex: none; }
.pile input[type=text] { font: inherit; font-weight: 600; border: 0; border-bottom: 1px solid var(--line); padding: 2px 0; outline: none; }
.pile select { font: inherit; font-size: 12px; border: 1px solid var(--line-2); border-radius: 6px; padding: 3px 6px; background: var(--bg); }
.pile .why { color: var(--ink-3); font-size: 12px; }
.pile .files { font-family: var(--mono); font-size: 10px; color: var(--ink-3); }
.pile label { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--ink-2); }
.reading { flex: 1; display: grid; place-items: center; color: var(--ink-3); }

/* The chat, floating over the work: its controls top right, its messages as bubbles, the composer bottom centre */
.chatbar { position: absolute; top: 10px; right: 12px; z-index: 7; display: flex; align-items: center; gap: 6px; max-width: 46%;
           background: var(--bg); border: 1px solid var(--line-2); border-radius: 10px; padding: 3px 4px 3px 10px; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
.chatbar:empty { display: none; }
.chatbar select { min-width: 0; max-width: 260px; font: inherit; font-weight: 600; border: 0; background: transparent; color: var(--ink); text-overflow: ellipsis; cursor: pointer; padding: 0; }
.chatbar .title { min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.newchat { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; color: var(--ink-2); flex: none; }
.newchat:hover { background: var(--soft); color: var(--ink); }
.moved { position: absolute; top: 54px; right: 12px; z-index: 7; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--ink-2);
         background: var(--bg); border: 1px solid var(--line-2); border-radius: 10px; padding: 4px 4px 4px 10px; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
.bubbles { position: absolute; left: 50%; transform: translateX(-50%); bottom: var(--above, 132px); z-index: 7; width: min(680px, calc(100% - 48px));
           max-height: 52%; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 2px; pointer-events: none;
           -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 28px); mask-image: linear-gradient(to bottom, transparent 0, #000 28px); }
.bubbles.all { max-height: calc(100% - 200px); pointer-events: auto; }
.bubbles > * { pointer-events: auto; }
.msg { max-width: 84%; padding: 9px 13px; border-radius: 16px; font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
       box-shadow: 0 4px 16px rgba(0,0,0,.08); }
.msg.you { align-self: flex-end; background: var(--ink); color: var(--bg); border-bottom-right-radius: 6px; }
.msg.claude { align-self: flex-start; background: var(--bg); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
.msg .steps { color: var(--ink-3); font-size: 12px; margin-top: 2px; }
.msg .steps.live::after { content: '…'; }
.msg .vchip { display: inline-block; margin-top: 6px; font-family: var(--mono); font-size: 10px; border: 1px solid var(--line-2); border-radius: 4px; padding: 0 6px; color: var(--ink-2); background: var(--bg); }
.msg .vchip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.msg .blocked { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line-2); display: flex; gap: 10px; align-items: center; color: var(--ink-2); font-size: 12px; }
.msg.nudge { align-self: stretch; max-width: none; background: var(--bg); border: 1px dashed var(--line-2); color: var(--ink-2); font-size: 12px; box-shadow: none; }
.showall { align-self: center; font-size: 11px; color: var(--ink-3); background: var(--bg); border: 1px solid var(--line-2); border-radius: 999px; padding: 2px 10px; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
.showall:hover { color: var(--ink); }
/* Claude's composer: the text on top, a row of controls under it, the clay send button */
.composer { position: absolute; left: 50%; transform: translateX(-50%); bottom: 20px; z-index: 8; width: min(680px, calc(100% - 48px));
            background: var(--bg); border: 1px solid var(--line-2); border-radius: 20px; padding: 14px 12px 10px 16px;
            box-shadow: 0 6px 28px rgba(0,0,0,.10); display: flex; flex-direction: column; gap: 8px; }
.composer:focus-within { border-color: var(--ink-3); }
.composer textarea { border: 0; outline: none; resize: none; font: inherit; font-size: 15px; line-height: 1.5; max-height: 200px; min-height: 24px; padding: 0; background: transparent; color: var(--ink); }
.composer .crow { display: flex; align-items: center; gap: 8px; }
.composer .side { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line-2); display: grid; place-items: center; color: var(--ink-2); }
.composer .side:hover { color: var(--ink); border-color: var(--ink-3); }
.composer .model { margin-left: auto; color: var(--ink-3); font-size: 12.5px; }
.send { flex: 0 0 32px; width: 32px; height: 32px; border-radius: 8px; background: #c6613f; color: #fff; display: grid; place-items: center; }
.send:hover { background: #b5562f; }
.send.stop { background: var(--ink); }
</style>
</head>
<body>
<div class="app" id="app">
  <nav id="nav"></nav>
  <section class="work">
    <div class="canvas" id="canvas">
      <div class="wins" id="wins"></div>
      <div class="empty hide" id="empty"></div>
    </div>
    <div class="tools" id="tools"></div>
    <div class="chatbar" id="chead"></div>
    <div class="moved hide" id="moved"></div>
    <div class="clash hide" id="clash"></div>
    <div class="bubbles" id="msgs"></div>
    <form class="composer" id="box">
      <textarea id="q" rows="1" aria-label="Message"></textarea>
      <div class="crow"><button type="button" class="side" id="fresh" title="New chat" aria-label="New chat"></button><span class="model">Claude Code</span>
        <button class="send" id="send" aria-label="Send"></button></div>
    </form>
  </section>
</div>


<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const day = t => t ? new Date(t * 1000).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';
const short = (s, n) => { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n).replace(/\s+\S*$/, '') + '…' : s; };
const api = (p, body) => fetch('api/' + p, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
  .then(r => r.json()).then(j => { if (j.error) { oops(j.error); throw new Error(j.error); } return j; });
function oops(msg) { const e = document.createElement('div'); e.className = 'err'; e.textContent = msg; document.body.appendChild(e); setTimeout(() => e.remove(), 6000); }
const UP = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5"/></svg>';
const STOP = '<svg width="10" height="10" viewBox="0 0 10 10"><rect width="10" height="10" rx="2" fill="currentColor"/></svg>';
const PEN = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2.5l2.5 2.5L6 12.5H3.5V10z"/><path d="M2.5 14.5h11"/></svg>';
const ICONS = {          // Material Symbols names, one per project; a project made here gets a blank page
  preso: 'slideshow',      // the deck
  peek: 'animation',       // AI chat animations
  explore: 'travel_explore', // the trip creator
  site: 'language',        // johnyum.com
  multi: 'calendar_month', // the multi calendar
  icons: 'interests',      // icon systems
  sessions: 'forum',       // free sessions
};                         // anything else gets the black dot
const icon = name => `<span class="ms" aria-hidden="true">${name}</span>`;
const dotIcon = () => `<span class="ms fill dotmark" aria-hidden="true">circle</span>`;   // Material Symbols' circle, filled: a black dot
const navW = () => $('#nav').getBoundingClientRect().width;

let S = null;            // server state
let viewing = null;      // a version shown on every screen, or null for now
let creating = false;    // the + : a free session, not inside any project yet
let show = 'yours';      // yours | live | both
let lastCount = -1, showAll = false;

const cur = () => S.current || {};
const proj = () => S.projects.find(p => p.key === cur().project) || S.projects[0];
const chatOf = () => { const d = cur().direction; return d ? [...proj().branches, ...proj().closed].find(b => b.id === d) || null : null; };

function put(el, html, wire) { if (el.dataset.h !== html) { el.innerHTML = html; el.dataset.h = html; wire && wire(el); } }

async function refresh() {
  S = await api('state');
  const t = chatOf(), n = t ? t.versions.length : 0;
  if (lastCount >= 0 && n > lastCount && !viewing) reloadScreens();   // a reply changed the work: show it
  lastCount = n;
  render();
}
/* Opening a project opens its chat: the one you were last in there, or a fresh one. */
async function go(project, direction) {
  creating = false; viewing = null;
  if (direction === undefined) {
    const p = S.projects.find(x => x.key === project);
    direction = (p && p.branches[0] && p.branches[0].id) || null;
  }
  S = await api('current', { project, direction });
  lastCount = chatOf()?.versions.length ?? 0;
  render();
}
function render() { nav(); tools(); screens(); clash(); chead(); msgs(); box(); }

/* ---------------------------------------------------------------- projects */
function nav() {
  if (document.activeElement && document.activeElement.closest && document.activeElement.closest('#nav input')) return;   // renaming: hold still
  const slim = $('#app').classList.contains('slim');
  put($('#nav'), `<div class="brand">${dotIcon()}<span class="name">Kept</span><button class="fold" id="fold" title="${slim ? 'Expand' : 'Collapse'} the sidebar" aria-label="${slim ? 'Expand' : 'Collapse'} the sidebar">${icon(slim ? 'left_panel_open' : 'left_panel_close')}</button></div>` + S.projects.filter(p => p.key !== 'sessions' || p.branches.length).map(p => {
    const busy = p.branches.some(b => b.building);
    return `<button class="proj${p.key === cur().project && !creating ? ' on' : ''}" data-p="${p.key}" title="${esc(p.name)} · double-click to rename">${ICONS[p.key] ? icon(ICONS[p.key]) : dotIcon()}<span class="t">${esc(p.name)}</span>${busy ? '<span class="dot pulse" title="Claude is working"></span>' : ''}</button>`;
  }).join('') + `<button class="plus${creating ? ' on' : ''}" id="plus" title="Start something new" aria-label="Start something new">${icon('add')}</button>`,
  el => {
    el.querySelectorAll('[data-p]').forEach(b => {
      b.onclick = () => { if (!b.querySelector('input')) go(b.dataset.p); };
      b.ondblclick = e => {   // rename, the way you rename a layer in Figma
        e.preventDefault();
        const t = b.querySelector('.t'), was = t.textContent, inp = document.createElement('input');
        inp.value = was; inp.setAttribute('aria-label', 'Project name');
        t.replaceWith(inp); inp.focus(); inp.select();
        let done = false;
        const finish = async save => {
          if (done) return; done = true;
          const name = inp.value.trim(); inp.blur();
          if (save && name !== was) { try { S = await api('rename', { project: b.dataset.p, name }); } catch (err) {} }
          $('#nav').dataset.h = ''; render();
        };
        inp.onkeydown = k => { if (k.key === 'Enter') finish(true); if (k.key === 'Escape') finish(false); k.stopPropagation(); };
        inp.onclick = k => k.stopPropagation();
        inp.onblur = () => finish(true);
      };
    });
    el.querySelector('#plus').onclick = () => { creating = true; viewing = null; render(); $('#q').focus(); };
    el.querySelector('#fold').onclick = () => setSlim(!$('#app').classList.contains('slim'));
  });
}

/* ---------------------------------------------------------------- the canvas */
const DEV = { phone: [393, 852], tablet: [834, 1194], desktop: [1440, 900] };
const DEV_W = { phone: 270, tablet: 380, desktop: 640 };          // a new window's width on the canvas
let lay = {};   // window key -> {x, y, w, dev}: yours to keep, per browser
try { lay = JSON.parse(localStorage.getItem('kept-canvas') || '{}'); } catch (e) {}
const saveLay = () => { try { localStorage.setItem('kept-canvas', JSON.stringify(lay)); } catch (e) {} };
const guessDev = page => /phone|mobile|ios|iphone|android|app\b/i.test(page) ? 'phone' : 'desktop';
const pageName = page => !page ? 'Home' : page.replace(/\/$/, '').replace(/\.html$/, '').replace(/\/index$/, '') || 'Home';

/* The screens a chat has built: every page its versions touched, oldest first; else the project's own page. */
function pagesOf(t, p) {
  const out = [];
  const add = pg => { if (pg != null && !out.includes(pg)) out.push(pg); };
  (t && t.pages || []).forEach(add);
  for (const v of (t ? t.versions : [])) {
    (v.files || []).filter(f => /\.html$/.test(f) && !f.startsWith('kept/')).forEach(f => add(f.endsWith('/index.html') ? f.slice(0, -10) : f === 'index.html' ? '' : f));
    if (v.page !== undefined && v.page !== null) add(v.page);
  }
  if (!out.length) add(p.page);
  return out;
}
function srcOf(page, from) {
  const p = proj();
  if (from === 'live') return p.main.length ? `/kept/v/${S.main_sha}/${page}` : 'about:blank';
  const b = p.branches.find(x => x.id === from);
  if (viewing && from === cur().direction) return `/kept/v/${viewing}/${page}`;
  if (b && b.folder) return `/kept/w/${b.id}/${page}`;
  return p.main.length ? `/kept/v/${S.main_sha}/${page}` : 'about:blank';
}
/* The canvas holds the whole project at once: what's live, and every branch open on it, each labelled.
   Click a screen to talk to its branch; click a live one to start something new. */
function screens() {
  const p = proj(), wins = $('#wins');
  const list = [];
  if (!creating) {
    if (p.main.length) list.push({ key: `${p.key}|live|${p.page}`, page: p.page, from: 'live', label: p.name });   // the project's own page goes by the project's name
    for (const b of p.branches) {
      const pgs = pagesOf(b, p);
      for (const pg of pgs) list.push({ key: `${p.key}|${b.id}|${pg}`, page: pg, from: b.id, label: pgs.length > 1 ? `${b.title} · ${pageName(pg)}` : b.title, building: b.building });
    }
  }
  const empty = creating || !list.length;
  $('#empty').classList.toggle('hide', !empty);
  put($('#empty'), creating ? `<div><h1>What do you want to work on?</h1><p>Talk across anything on the right. When you're done, Sort it, and Kept files what you made into the right projects.</p></div>`
    : `<div><h1>${esc(p.name)}</h1><p>Nothing here yet. Say what you want to make in the chat.</p></div>`);
  // Place new windows left to right; keep the ones you've moved where you put them.
  // New ones start below everything already on the canvas, so nothing lands on top of a screen you can see.
  let bottom = 0;
  for (const s2 of list) { const L2 = lay[s2.key]; if (L2) { const [dw, dh] = DEV[L2.dev]; bottom = Math.max(bottom, L2.y + L2.w * dh / dw + 26); } }
  let x = 40, y = bottom ? bottom + 40 : 64, rowH = 0;
  const W = $('#canvas').clientWidth;
  for (const s of list) {
    let L = lay[s.key];
    if (!L) {
      const base = null;
      const dev = base ? base.dev : guessDev(s.page), w = base ? base.w : DEV_W[dev];
      const h = w * DEV[dev][1] / DEV[dev][0] + 26;
      if (base) L = { x: base.x + base.w + 28, y: base.y, w, dev };
      else { if (x + w > W - 20 && x > 40) { x = 40; y += rowH + 40; rowH = 0; } L = { x, y, w, dev }; x += w + 40; rowH = Math.max(rowH, h); }
      lay[s.key] = L;
    }
  }
  // Add, keep or drop windows without rebuilding the ones that stay.
  const keys = new Set(list.map(s => s.key));
  wins.querySelectorAll('.win').forEach(el => { if (!keys.has(el.dataset.key)) el.remove(); });
  for (const s of list) {
    let el = wins.querySelector(`.win[data-key="${CSS.escape(s.key)}"]`);
    if (!el) {
      el = document.createElement('div');
      el.className = 'win'; el.dataset.key = s.key;
      el.innerHTML = `<div class="wbar"><b></b><button class="dev" title="Phone, tablet or desktop"></button></div><div class="view"><iframe></iframe></div><div class="grip" title="Drag to resize"></div>`;
      el.querySelector('iframe').title = pageName(s.page);
      el.querySelector('.wbar').onpointerdown = e => { if (e.target.closest('.dev')) return; e.altKey ? copyDrag(e, el) : drag(e, el, false); };
      el.querySelector('.grip').onpointerdown = e => drag(e, el, true);
      el.querySelector('.dev').onclick = () => { const L = lay[s.key], order = ['phone', 'tablet', 'desktop']; L.dev = order[(order.indexOf(L.dev) + 1) % 3]; L.w = DEV_W[L.dev]; saveLay(); place(el); };
      el.onpointerdown = () => { wins.querySelectorAll('.win.top').forEach(w => w.classList.remove('top')); el.classList.add('top'); };
      el.onclick = e => { if (e.target.closest('.dev, .grip') || el.dataset.moved) return; pickScreen(el.dataset.from); };
      wins.appendChild(el);
    }
    el.dataset.from = s.from; el.dataset.page = s.page; el.dataset.label = s.label;
    el.classList.toggle('live', s.from === 'live');
    el.classList.toggle('sel', s.from === (cur().direction || 'live'));
    el.querySelector('b').textContent = s.label + (s.building ? ' · working…' : '');
    el.title = s.from === 'live' ? 'Live. Option-drag the bar to copy it into a new branch.' : 'Option-drag the bar to copy this branch.';
    const f = el.querySelector('iframe'), src = srcOf(s.page, s.from);
    if (f.dataset.src !== src) { f.dataset.src = src; f.src = src; }
    place(el);
  }
  // The canvas grows to hold whatever you've spread out.
  let mx = 0, my = 0;
  wins.querySelectorAll('.win').forEach(el => { mx = Math.max(mx, el.offsetLeft + el.offsetWidth); my = Math.max(my, el.offsetTop + el.offsetHeight); });
  Object.assign(wins.style, { width: (mx + 200) + 'px', height: (my + 200) + 'px' });
  saveLay();
}
/* A window keeps its device's shape: the page renders at the device's size and scales to the window. */
function place(el) {
  const L = lay[el.dataset.key], [dw, dh] = DEV[L.dev];
  el.className = el.className.replace(/\b(phone|tablet|desktop)\b/g, '').trim() + ' ' + L.dev;
  el.querySelector('.dev').textContent = L.dev[0].toUpperCase() + L.dev.slice(1);
  const pad = L.dev === 'phone' ? 14 : 0, vw = L.w - pad, k = vw / dw;
  Object.assign(el.style, { left: L.x + 'px', top: L.y + 'px', width: L.w + 'px', height: (dh * k + pad + 26) + 'px' });
  Object.assign(el.querySelector('iframe').style, { width: dw + 'px', height: dh + 'px', transform: `scale(${k})` });
}
function drag(e, el, resize) {
  e.preventDefault();
  const L = lay[el.dataset.key], sx = e.clientX, sy = e.clientY, b0 = { ...L };
  document.body.classList.add('dragging');
  el.dataset.moved = '';
  const move = m => {
    if (Math.hypot(m.clientX - sx, m.clientY - sy) > 4) el.dataset.moved = '1';
    if (resize) L.w = Math.max(160, b0.w + (m.clientX - sx));
    else { L.x = Math.max(0, b0.x + m.clientX - sx); L.y = Math.max(44, b0.y + m.clientY - sy); }
    place(el);
  };
  const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); document.body.classList.remove('dragging'); saveLay(); screens(); setTimeout(() => el.dataset.moved = '', 0); };
  addEventListener('pointermove', move); addEventListener('pointerup', up);
}

/* Click a screen: its branch's chat comes up on the right. A live screen: the chat is fresh, ready to start a branch. */
function pickScreen(from) {
  const want = from === 'live' ? null : from;
  if ((cur().direction || null) === want) return;
  go(proj().key, want);
}

/* Option-drag a screen's bar: pull off a copy, and where you drop it a new branch starts from exactly what it showed. */
function copyDrag(e, el) {
  e.preventDefault();
  const p = proj(), from = el.dataset.from, page = el.dataset.page, L = lay[el.dataset.key];
  const wr = $('#wins').getBoundingClientRect(), r = el.getBoundingClientRect();
  const ox = e.clientX - r.left, oy = e.clientY - r.top;
  const ghost = document.createElement('div');
  ghost.className = 'copyghost';
  ghost.textContent = 'Copy of ' + el.dataset.label;
  Object.assign(ghost.style, { width: r.width + 'px', height: r.height + 'px', left: (r.left - wr.left) + 'px', top: (r.top - wr.top) + 'px' });
  $('#wins').appendChild(ghost);
  document.body.classList.add('dragging');
  const move = m => { ghost.style.left = (m.clientX - wr.left - ox) + 'px'; ghost.style.top = (m.clientY - wr.top - oy) + 'px'; };
  const up = async m => {
    removeEventListener('pointermove', move); removeEventListener('pointerup', up);
    document.body.classList.remove('dragging');
    const x = Math.max(0, m.clientX - wr.left - ox), y = Math.max(44, m.clientY - wr.top - oy);
    if (Math.hypot(x - (r.left - wr.left), y - (r.top - wr.top)) < 20) { ghost.remove(); return; }   // let go where it started: no copy
    ghost.textContent = 'Copying…';
    try {
      const res = await api('direction', { project: p.key, title: 'Copy of ' + el.dataset.label, pages: [page],
                                           from_direction: from === 'live' ? null : from, from: from === 'live' ? S.main_sha : null });
      lay[`${p.key}|${res.direction}|${page}`] = { x, y, w: L.w, dev: L.dev };
      saveLay();
      S = res; viewing = null; lastCount = 0;
    } catch (err) {}
    ghost.remove();
    render();
  };
  addEventListener('pointermove', move); addEventListener('pointerup', up);
}
function reloadScreens() { $('#wins').querySelectorAll('.win:not(.live) iframe').forEach(f => { try { f.contentWindow.location.reload(); } catch (e) { f.src = f.src; } }); }

function tools() {
  const t = chatOf(), v = viewing && t && t.versions.findIndex(x => x.sha === viewing);
  put($('#tools'), creating ? '' : `${viewing ? `<span class="chip">Showing v${v + 1} · as it was<button id="now">Back to now</button></span>` : ''}
    <span class="v" style="pointer-events:none">⌥-drag a screen's bar to copy it into a new branch</span>
    <span class="sp"></span><button class="btn" id="tidy" title="Put the screens back in a row">Tidy</button>`,
  el => {
    el.querySelector('#now') && (el.querySelector('#now').onclick = () => { viewing = null; render(); });
    el.querySelector('#tidy') && (el.querySelector('#tidy').onclick = () => {
      const pre = proj().key + '|';
      Object.keys(lay).forEach(k => { if (k.startsWith(pre)) delete lay[k]; });
      saveLay(); $('#wins').innerHTML = ''; screens();
    });
  });
}

/* ---------------------------------------------------------------- the chat */
function chead() {
  const p = proj(), t = chatOf();
  if (creating) { $('#moved').classList.add('hide'); return put($('#chead'), ''); }
  const open = t && t.status === 'active';
  const chats = p.branches;
  put($('#chead'), `${chats.length > 1 || (t && !open) ? `<select id="pick" aria-label="Chats in ${esc(p.name)}">${chats.map(b => `<option value="${b.id}"${t && b.id === t.id ? ' selected' : ''}>${esc(b.title)}</option>`).join('')}${t && !open ? `<option selected>${esc(t.title)} (closed)</option>` : ''}</select>`
      : t ? `<span class="title">${esc(t.title)}</span>` : ''}
    ${t && t.building ? '<span class="v">working…</span>' : ''}
    ${open ? `<button class="btn quiet" id="close">Close</button>` : ''}
    ${open && t.project === 'sessions' ? `<button class="btn dark" id="sortit" title="Kept reads the session and files what you made into the right projects">Sort it</button>` : ''}
    ${open && t.project !== 'sessions' && t.folder && t.versions.length ? `<button class="btn dark" id="push" title="Put this into Main and send it live">Push</button>` : ''}
    ${t ? `<button class="newchat" id="newchat" title="New chat in ${esc(p.name)}" aria-label="New chat">${PEN}</button>` : ''}`.trim(),
  el => {
    el.querySelector('#pick') && (el.querySelector('#pick').onchange = e => go(p.key, e.target.value));
    el.querySelector('#newchat') && (el.querySelector('#newchat').onclick = () => go(p.key, null));
    el.querySelector('#close') && (el.querySelector('#close').onclick = async () => {
      const why = prompt(`Close "${t.title}"? Why, in a line (Kept remembers it if you try this again):`); if (why === null) return;
      S = await api('close', { direction: t.id, why }); go(p.key, null);
    });
    el.querySelector('#sortit') && (el.querySelector('#sortit').onclick = async () => { S = await api('sort', { direction: t.id }); render(); });
    el.querySelector('#push') && (el.querySelector('#push').onclick = async () => {
      if (!confirm(`Push "${t.title}" into Main? It merges and goes live.`)) return;
      el.querySelector('#push').textContent = 'Pushing…';
      try { S = await api('push', { direction: t.id }); go(p.key, null); } catch (e) { S = await api('state'); render(); }
    });
  });
  const m = $('#moved');
  m.classList.toggle('hide', !(open && t.behind && !t.conflict));
  put(m, open && t.behind ? `Live has moved · ${t.behind} change${t.behind === 1 ? '' : 's'}<span class="sp"></span><button class="btn" id="bringin">Bring in</button>` : '',
    el => el.querySelector('#bringin') && (el.querySelector('#bringin').onclick = async () => {
      el.querySelector('#bringin').textContent = 'Bringing in…';
      try { S = await api('bringin', { direction: t.id }); lastCount = -1; render(); } catch (e) { render(); }
    }));
}

function msgs() {
  const p = proj(), t = creating ? null : chatOf();
  const chat = t ? t.chat || [] : [], nudge = t && S.nudges[t.id];
  const msg = m => m.role === 'you' ? `<div class="msg you">${esc(m.text)}</div>`
    : `<div class="msg claude">${m.text ? esc(m.text) : ''}${m.busy || (!m.text && m.steps.length) ? `<p class="steps${m.busy ? ' live' : ''}">${esc(m.steps.at(-1) || 'Thinking')}</p>` : ''}${
        m.version ? `<br><button class="vchip${viewing === m.version ? ' on' : ''}" data-ver="${m.version}" title="Show every screen as it was here">v${t.versions.findIndex(v => v.sha === m.version) + 1}</button>` : ''}${
        m.blocked ? `<div class="blocked"><span>Claude wants to: ${esc(m.blocked.what)}</span><button class="btn dark" data-allow="${esc(m.blocked.allow)}">Allow</button></div>` : ''}</div>`;
  const shown = showAll ? chat : chat.slice(-4);

    + (nudge ? `<div class="msg nudge">${esc(nudge.text)}</div>` : '') + shown.map(msg).join(''),
  el => {

    el.querySelectorAll('[data-allow]').forEach(b => b.onclick = async () => { S = await api('allow', { direction: t.id, allow: b.dataset.allow }); render(); });

}

function box() {
  const t = creating ? null : chatOf(), q = $('#q'), busy = t && t.building;
  q.placeholder = creating ? 'Tighten the deck opening, then try a softer dial on the timer' : t && t.status !== 'active' ? 'This chat is closed. Start a new one with the pen above.'
    : t && t.conflict ? 'How should they combine? e.g. keep their colours, my layout' : t ? 'Reply to Claude…' : `How can I help with ${proj().name} today?`;

}
const fitAbove = () => $('.work').style.setProperty('--above', ($('#box').offsetHeight + 32) + 'px');
$('#q').addEventListener('input', e => { e.target.style.height = 'auto'; e.target.style.height = Math.min(200, e.target.scrollHeight) + 'px'; fitAbove(); });
addEventListener('resize', fitAbove);
$('#fresh').innerHTML = icon('add');
$('#fresh').onclick = () => { if (creating) return; showAll = false; go(proj().key, null); };
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#box').requestSubmit(); } });
$('#box').onsubmit = async e => {
  e.preventDefault();

  if (t && t.building) { S = await api('stop', { direction: t.id }); return render(); }
  const text = q.value.trim(); if (!text) return;
  try {
    S = creating ? await api('talk', { text })
      : t && t.conflict ? await api('resolve', { direction: t.id, text })
      : await api('say', { project: proj().key, direction: t && t.status === 'active' ? t.id : null, text });
    creating = false; q.value = ''; q.style.height = 'auto'; viewing = null; fitAbove();

};

/* ---------------------------------------------------------------- a clash, or sorting a session, over the canvas */
function sortScreen(t, el) {
  const pl = t.plan, P = S.projects.filter(p => p.key !== 'sessions');
  if (t.planning) return put(el, `<h3>Sorting the session</h3><p class="sub">Reading what you asked and what changed…</p><div class="reading">One moment</div>`);
  if (!pl.piles.length) return put(el, `<h3>Nothing to sort</h3><p class="sub">${esc(pl.note || '')}</p><div class="acts"><button class="btn" id="cancel">Back</button></div>`,
    e => e.querySelector('#cancel').onclick = async () => { S = await api('cancelsort', { direction: t.id }); render(); });
  const opts = c => P.map(p => `<option value="${p.key}"${p.key === c ? ' selected' : ''}>${esc(p.name)}</option>`).join('')
    + (c.startsWith('new:') ? `<option value="${esc(c)}" selected>New project: ${esc(c.slice(4))}</option>` : '')
    + `<option value="sessions"${c === 'other' || c === 'sessions' ? ' selected' : ''}>Not a project (keep as a session)</option>`;
  put(el, `<h3>This session splits into ${pl.piles.length} chat${pl.piles.length === 1 ? '' : 's'}</h3>
    <p class="sub">Each becomes its own chat in its project, with only its own changes. Rename one, move it, or leave it out.</p>
    <div class="piles">${pl.piles.map((x, i) => `<div class="pile" data-i="${i}">
      <div class="frame"><iframe src="${x.page !== undefined ? `/kept/v/${pl.head}/${x.page}` : 'about:blank'}" title="${esc(x.title)}"></iframe></div>
      <input type="text" value="${esc(x.title)}" aria-label="Chat name">
      <select aria-label="Project">${opts(x.project)}</select>
      <p class="why">${esc(x.why)}</p><p class="files">${x.files.map(esc).join('<br>')}</p>
      <label><input type="checkbox" checked> Make this chat</label></div>`).join('')}</div>
    <div class="acts"><button class="btn dark" id="make">Make these chats</button><button class="btn quiet" id="cancel">Not yet</button></div>`,
  e => {
    e.querySelectorAll('.pile input[type=checkbox]').forEach(c => c.onchange = () => c.closest('.pile').classList.toggle('off', !c.checked));
    e.querySelector('#cancel').onclick = async () => { S = await api('cancelsort', { direction: t.id }); render(); };
    e.querySelector('#make').onclick = async () => {
      const piles = [...e.querySelectorAll('.pile')].filter(d => d.querySelector('input[type=checkbox]').checked).map(d => {
        const x = pl.piles[+d.dataset.i];
        return { ...x, title: d.querySelector('input[type=text]').value.trim() || x.title, project: d.querySelector('select').value };
      });
      if (!piles.length) return oops('Pick at least one to make, or choose Not yet.');
      e.querySelector('#make').textContent = 'Making chats…';
      try { S = await api('applysort', { direction: t.id, piles }); creating = false; await go(cur().project); } catch (err) { render(); }
    };
  });
}
function clash() {
  const t = creating ? null : chatOf(), el = $('#clash');
  if (t && (t.planning || t.plan)) { el.classList.remove('hide'); return sortScreen(t, el); }
  const c = t && (t.conflict || t.resolved);
  el.classList.toggle('hide', !c);
  if (!c) return put(el, '');
  const pane = (label, note, src, big) => `<div class="pane${big ? ' big' : ''}"><b>${label} <span>${note}</span></b><div class="frame"><iframe src="${src}" title="${label}"></iframe></div></div>`;
  const pg = c.page || '';
  put(el, t.conflict
    ? `<h3>Live changed the same part you did</h3>
       <p class="sub">${esc(c.files.join(', '))} · someone pushed while you were working. Say in the chat how to combine them; nothing goes live until you Push.</p>
       <div class="three">${pane('When you started', 'live then', `/kept/v/${c.base}/${pg}`)}${pane('Live now', 'with what was pushed', `/kept/v/${c.theirs}/${pg}`)}${pane('Yours', 'your version', `/kept/v/${c.mine}/${pg}`)}</div>
       <div class="acts"><button class="btn quiet" id="abort">Cancel, keep mine as it was</button></div>`
    : `<h3>Combined</h3><p class="sub">You said “${esc(c.said || '')}”. ${esc((t.chat || []).filter(m => m.role === 'claude').slice(-1)[0]?.text || '')}</p>
       <div class="three">${pane('Live now', '', `/kept/v/${c.theirs}/${pg}`)}${pane('Yours before', '', `/kept/v/${c.mine}/${pg}`)}${pane('Combined', 'new', c.sha ? `/kept/v/${c.sha}/${pg}` : `/kept/w/${t.id}/${pg}`, true)}</div>
       <div class="acts"><button class="btn dark" id="keepit">Keep it</button><button class="btn" id="undo">Undo</button></div>`,
  e => {
    e.querySelector('#abort') && (e.querySelector('#abort').onclick = async () => { if (!confirm('Cancel bringing in Live? Your version stays exactly as it was.')) return; S = await api('abortmerge', { direction: t.id }); render(); });
    e.querySelector('#keepit') && (e.querySelector('#keepit').onclick = async () => { S = await api('keepmerge', { direction: t.id }); render(); });
    e.querySelector('#undo') && (e.querySelector('#undo').onclick = async () => { S = await api('undomerge', { direction: t.id }); render(); });
  });
}

/* The sidebar folds to a strip of icons; per browser. */
function setSlim(on) {
  $('#app').classList.toggle('slim', on);
  try { localStorage.setItem('kept-slim', on ? '1' : ''); } catch (e) {}
  $('#nav').dataset.h = ''; nav();
  requestAnimationFrame(() => screens());
}
try { if (localStorage.getItem('kept-slim')) $('#app').classList.add('slim'); } catch (e) {}

refresh().then(async () => {
  const c = cur();
  if (c.project && !c.direction) await go(c.project);   // land in the project's chat
});
setInterval(refresh, 1500);
</script>
