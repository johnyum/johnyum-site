<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  Kept, the surface. The work, big, and one box to say what you want (John: "natural language, just like
  Anthropic or Codex"; "I don't want to see terminal").

  - The sidebar is your projects, most recently touched first.
  - A project's home is Main, live and big, with the threads open on it listed under it. Say what you
    want to try in the box and it becomes a thread: its own branch and folder, named from your words.
  - A thread is the work, live from its own folder, with its conversation floating over it. Claude Code
    does the work underneath, headless, one session per thread; each reply that changed something is a
    version. Push puts a thread into Main and sends it live.

  The page polls every 1.5s. Each region redraws only when its own HTML changed, and the preview iframe
  is only ever pointed somewhere new, never rebuilt.
-->
<style>
:root {
  --bg: #fff; --soft: #f5f5f5; --line: #ebebeb; --line-2: #d9d9d9;
  --ink: #111; --ink-2: #555; --ink-3: #8a8a8a; --blue: #2a6fdb;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
  --sans: 'IBM Plex Sans', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; position: fixed; inset: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
p { margin: 0; }
img { display: block; }
.app { display: grid; grid-template-columns: 208px minmax(0, 1fr); height: 100vh; }

/* Projects */
nav { border-right: 1px solid var(--line); overflow-y: auto; padding: 10px 8px 40px; }
.brand { font-weight: 600; padding: 4px 8px 12px; }
.proj { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border-radius: 6px; }
.proj:hover { background: var(--soft); }
.proj.on { background: var(--ink); color: var(--bg); }
.proj .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj .n { font-family: var(--mono); font-size: 10px; color: var(--ink-3); }
.proj.on .n { color: inherit; opacity: .6; }
.plus { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; margin: 8px 0 0 4px; border-radius: 6px; color: var(--ink-2); border: 1px solid var(--line-2); }
.plus:hover { color: var(--ink); border-color: var(--ink-3); }
.plus.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.fresh { position: absolute; inset: 48px 0 0 0; display: grid; place-items: center; padding-bottom: 120px; z-index: 1; background: var(--bg); }
.fresh h1 { font-size: 26px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 6px; text-align: center; }
.fresh p { color: var(--ink-3); text-align: center; }
.fresh.hide + * {}
.dot { flex: 0 0 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--blue); display: inline-block; }
.dot.pulse { animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }

/* The work */
.work { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; overflow: hidden; }
.bar { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
.crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; }
.crumbs button { color: var(--ink-3); }
.crumbs button:hover { color: var(--ink); }
.crumbs b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.crumbs i { color: var(--line-2); font-style: normal; }
.v { font-family: var(--mono); font-size: 11px; color: var(--ink-3); white-space: nowrap; }
.sp { flex: 1; }
.btn { border: 1px solid var(--line-2); border-radius: 6px; padding: 4px 10px; font-size: 12px; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn.dark { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.quiet { border-color: transparent; color: var(--ink-3); }
.btn.quiet:hover { color: var(--ink); }

.stage { position: relative; background: var(--soft); min-height: 0; }
.stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
.home .stage { flex: 0 0 56%; border-bottom: 1px solid var(--line); }
.thread .stage { flex: 1; }
.stage.split iframe#stage { left: 50%; width: 50%; border-left: 1px solid var(--line-2); }
.stage iframe#stage2 { position: absolute; left: 0; top: 0; width: 50%; height: 100%; border: 0; background: #fff; }
.stage:not(.split) iframe#stage2, .stage:not(.split) .tag2 { display: none; }
.stage.split .tag { left: calc(50% + 12px); }
.tag2 { position: absolute; left: 12px; top: 12px; background: var(--bg); color: var(--ink); border: 1px solid var(--line-2); font-size: 11px; padding: 2px 8px; border-radius: 4px; z-index: 1; }
.tag { z-index: 1; }
.tag { position: absolute; left: 12px; top: 12px; background: var(--ink); color: var(--bg); font-size: 11px; padding: 3px 8px; border-radius: 4px; }

/* Home: Main's history, the threads, Closed */
.below { flex: 1; overflow-y: auto; padding: 12px 16px 140px; }
.thread .below { display: none; }
.hist { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 10px; }
.mini { flex: 0 0 72px; }
.mini .pic { border-radius: 3px; }
.mini.on .pic { outline: 2px solid var(--ink); outline-offset: 1px; }
.pic { aspect-ratio: 16 / 10; border-radius: 6px; overflow: hidden; background: var(--soft); border: 1px solid var(--line); position: relative; }
.pic img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
.noimg { width: 100%; height: 100%; display: grid; place-items: center; color: var(--ink-3); font-family: var(--mono); font-size: 9px; }
h2 { font-size: 12px; font-weight: 600; margin: 14px 0 8px; display: flex; gap: 8px; align-items: baseline; }
h2 span { color: var(--ink-3); font-weight: 400; }
.trow { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--line); margin-bottom: 6px; }
.trow:hover { border-color: var(--line-2); }
.trow .pic { flex: 0 0 80px; border-radius: 4px; }
.trow .m { flex: 1; min-width: 0; }
.trow .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .s { color: var(--ink-3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.closedrow { opacity: .55; }
.closedrow .pic img { filter: grayscale(1); }
.ctog { color: var(--ink-3); font-size: 12px; margin-top: 10px; }
.ctog:hover { color: var(--ink); }

/* A thread: its conversation floats over the work, its versions in the corner */
.convo { position: absolute; left: 50%; transform: translateX(-50%); bottom: 92px; width: min(640px, calc(100% - 32px)); display: flex; flex-direction: column; gap: 6px; max-height: 46%; overflow-y: auto; padding: 4px; }
.convo.all { max-height: calc(100% - 160px); background: rgba(255,255,255,.94); border: 1px solid var(--line); border-radius: 12px; padding: 12px; backdrop-filter: blur(8px); }
.msg { max-width: 88%; padding: 8px 12px; border-radius: 12px; font-size: 13px; line-height: 1.45; box-shadow: 0 2px 10px rgba(0,0,0,.06); white-space: pre-wrap; word-break: break-word; }
.msg.you { align-self: flex-end; background: var(--ink); color: var(--bg); }
.msg.claude { align-self: flex-start; background: var(--bg); border: 1px solid var(--line); }
.msg .steps { color: var(--ink-3); font-size: 12px; margin-top: 2px; }
.msg .steps.live::after { content: '…'; }
.msg .vchip { display: inline-block; margin-top: 6px; font-family: var(--mono); font-size: 10px; border: 1px solid var(--line-2); border-radius: 4px; padding: 0 6px; color: var(--ink-2); }
.msg .vchip:hover { border-color: var(--ink-3); }
.msg .blocked { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; color: var(--ink-2); font-size: 12px; }
.msg.nudge { align-self: stretch; max-width: none; background: var(--soft); border: 0; box-shadow: none; color: var(--ink-2); font-size: 12px; }
.more { align-self: center; font-size: 11px; color: var(--ink-3); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.more:hover { color: var(--ink); }
.versions { position: absolute; right: 12px; top: 12px; display: flex; gap: 4px; max-width: 60%; overflow-x: auto; padding: 3px; background: rgba(255,255,255,.9); border: 1px solid var(--line); border-radius: 8px; }
.versions:empty { display: none; }
.versions .mini { flex-basis: 52px; }
.versions .now .pic { display: grid; place-items: center; font-size: 9px; color: var(--ink-2); background: var(--bg); border-style: dashed; }

/* The box */
.box { position: absolute; left: 50%; transform: translateX(-50%); bottom: 16px; width: min(640px, calc(100% - 32px)); display: flex; align-items: flex-end; gap: 8px; background: var(--bg); border: 1px solid var(--line-2); border-radius: 16px; padding: 10px 10px 10px 14px; box-shadow: 0 8px 28px rgba(0,0,0,.10); }
.box textarea { flex: 1; border: 0; outline: none; resize: none; font: inherit; font-size: 14px; line-height: 1.45; max-height: 160px; min-height: 22px; padding: 2px 0; background: transparent; color: var(--ink); }
.send { flex: 0 0 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; }
.send:disabled { opacity: .3; cursor: default; }
.send.stop { background: var(--bg); color: var(--ink); border: 1px solid var(--line-2); }
.hide { display: none !important; }
.box, .convo { z-index: 3; }
.home .below .hist { display: none; }
.home.hist .below .hist { display: flex; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 7px; padding: 2px; gap: 2px; }
.seg button { padding: 2px 10px; border-radius: 5px; font-size: 12px; color: var(--ink-2); }
.seg button.on { background: var(--ink); color: var(--bg); }
.moved { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); background: var(--soft); border-radius: 7px; padding: 3px 4px 3px 10px; white-space: nowrap; }
.moved .btn { background: var(--bg); }

/* A clash: the three pictures, and a sentence to combine them */
.clash { position: absolute; left: 0; right: 0; bottom: 0; top: 48px; background: var(--bg); display: flex; flex-direction: column; padding: 16px 16px 92px; gap: 12px; z-index: 2; }
.clash h3 { margin: 0; font-size: 16px; font-weight: 600; }
.clash .sub { color: var(--ink-3); }
.clash .three { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 12px; }
.clash .pane { display: flex; flex-direction: column; gap: 6px; min-height: 0; }
.clash .pane b { font-weight: 600; font-size: 12px; }
.clash .pane b span { color: var(--ink-3); font-weight: 400; }
.clash .frame { flex: 1; position: relative; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; background: var(--soft); }
.clash .frame iframe { position: absolute; left: 0; top: 0; width: 200%; height: 200%; border: 0; transform: scale(.5); transform-origin: 0 0; background: #fff; }
.clash .pane.big .frame { border: 2px solid var(--ink); }
.clash .acts { display: flex; gap: 8px; align-items: center; }
.clash.with-convo { padding-bottom: 200px; }
.err { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 12px; border-radius: 6px; font-size: 12px; z-index: 9; max-width: 80vw; }
</style>
</head>
<body>
<div class="app">
  <nav id="nav"></nav>
  <section class="work home" id="work">
    <div class="bar" id="bar"></div>
    <div class="stage" id="stagebox"><iframe id="stage2" title="Main"></iframe><span class="tag2" id="tag2">Main · live</span><iframe id="stage" title="The work"></iframe><span class="tag hide" id="tag"></span>
      <div class="versions" id="versions"></div></div>
    <div class="clash hide" id="clash"></div>
    <div class="fresh hide" id="fresh"><div><h1>What do you want to make?</h1><p>It starts as a new project, with Claude building the first version. Nothing is live until you Push.</p></div></div>
    <div class="below" id="below"></div>
    <div class="convo" id="convo"></div>
    <form class="box" id="box"><textarea id="q" rows="1" aria-label="Message"></textarea>
      <button class="send" id="send" aria-label="Send"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5"/></svg></button></form>
  </section>
</div>

<script>
const MAIN = '__main';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const day = t => t ? new Date(t * 1000).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';
const ago = t => { const s = Date.now() / 1000 - t; return s < 90 ? 'just now' : s < 3600 ? Math.round(s / 60) + 'm ago' : s < 86400 ? Math.round(s / 3600) + 'h ago' : day(t); };
const short = (s, n) => { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n).replace(/\s+\S*$/, '') + '…' : s; };
const api = (p, body) => fetch('api/' + p, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
  .then(r => r.json()).then(j => { if (j.error) { oops(j.error); throw new Error(j.error); } return j; });
function oops(msg) { const e = document.createElement('div'); e.className = 'err'; e.textContent = msg; document.body.appendChild(e); setTimeout(() => e.remove(), 6000); }
const thumb = v => v && v.shot ? `data/thumbs/${v.shot}` : null;
const img = src => src ? `<img src="${src}" loading="lazy" alt="">` : '<div class="noimg">no picture</div>';
const lastPic = vs => { const r = [...vs].reverse(); return thumb(r.find(v => v.shot && v.shot.includes('-')) || r.find(v => v.shot)); };
const UP = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5"/></svg>';
const STOP = '<svg width="10" height="10" viewBox="0 0 10 10"><rect width="10" height="10" rx="2" fill="currentColor"/></svg>';

let S = null;            // server state
let viewing = null;      // a version on the stage, or null for now
let creating = false;   // the + : a blank start, not inside any project
let lastCount = -1, showAll = false, showClosed = false, showHist = false, compare = false;   // compare: false (yours), 'main', 'both'

const cur = () => S.current || {};
const proj = () => S.projects.find(p => p.key === cur().project) || S.projects[0];
const threadOf = () => { const d = cur().direction; return d && d !== MAIN ? [...proj().branches, ...proj().closed].find(b => b.id === d) || null : null; };

function put(el, html, wire) { if (el.dataset.h !== html) { el.innerHTML = html; el.dataset.h = html; wire && wire(el); } }

async function refresh() {
  S = await api('state');
  const t = threadOf(), n = t ? t.versions.length : 0;
  if (lastCount >= 0 && n > lastCount && !viewing) stage(true);   // a reply changed the work: show it
  lastCount = n;
  render();
}
async function go(project, direction = null) {
  creating = false;
  S = await api('current', { project, direction });
  viewing = null; showAll = false; compare = false; lastCount = threadOf()?.versions.length ?? 0;
  render(); stage(true);
}
function render() {
  const t = threadOf();
  $('#work').className = 'work ' + (t ? 'thread' : 'home') + (showHist && !t ? ' hist' : '');
  $('#fresh').classList.toggle('hide', !creating);
  nav(); bar(); below(); convo(); versions(); clash(); box(); stage();
}

function nav() {
  put($('#nav'), `<div class="brand">Kept</div>` + S.projects.map(p => {
    const busy = p.branches.some(b => b.building);
    return `<button class="proj${p.key === cur().project && !creating ? ' on' : ''}" data-p="${p.key}">${busy ? '<span class="dot pulse" title="Claude is working"></span>' : ''}<span class="t">${esc(p.name)}</span><span class="n">${p.branches.length || ''}</span></button>`;
  }).join('') + `<button class="plus${creating ? ' on' : ''}" id="plus" title="Start something new" aria-label="Start something new"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg></button>`,
  el => {
    el.querySelectorAll('[data-p]').forEach(b => b.onclick = () => go(b.dataset.p));
    el.querySelector('#plus').onclick = () => { creating = true; viewing = null; render(); $('#q').focus(); };
  });
}

function bar() {
  if (creating) return put($('#bar'), `<div class="crumbs"><b>New</b></div>`);
  const p = proj(), t = threadOf();
  const vs = t ? t.versions : p.main, at = viewing ? vs.findIndex(v => v.sha === viewing) : -1, v = vs[at];
  const open = t && t.status === 'active';
  put($('#bar'), `<div class="crumbs">${t ? `<button data-home>${esc(p.name)}</button><i>/</i><b>${esc(t.title)}</b>` : `<b>${esc(p.name)}</b>`}</div>
    <span class="v">${viewing ? `as it was ${day(v?.t)}` : t ? (t.building ? 'working…' : `${t.versions.length} version${t.versions.length === 1 ? '' : 's'}`) : 'live now'}</span>
    ${open && !t.conflict ? `<span class="seg" title="Your version, what's live, or both side by side"><button id="mine" class="${compare ? '' : 'on'}">Yours</button><button id="vsmain" class="${compare === 'main' ? 'on' : ''}">Main</button><button id="both" class="${compare === 'both' ? 'on' : ''}">Both</button></span>` : ''}
    <span class="sp"></span>
    ${open && t.behind && !t.conflict ? `<span class="moved">Main has moved · ${t.behind} change${t.behind === 1 ? '' : 's'}<button class="btn" id="bringin" title="Bring what others pushed into your version">Bring in</button></span>` : ''}
    ${!t ? `<button class="btn quiet" id="hist">${showHist ? 'Hide history' : 'History'}</button>` : ''}
    ${viewing ? `<button class="btn quiet" id="back">Back to now</button>` : ''}
    ${open ? `<button class="btn quiet" id="close">Close</button>${t.folder && t.versions.length ? `<button class="btn dark" id="push" title="Put this thread into Main and send it live">Push</button>` : ''}` : ''}`,
  el => {
    el.querySelector('[data-home]') && (el.querySelector('[data-home]').onclick = () => go(p.key));
    el.querySelector('#back') && (el.querySelector('#back').onclick = () => { viewing = null; render(); stage(true); });
    el.querySelector('#hist') && (el.querySelector('#hist').onclick = () => { showHist = !showHist; if (!showHist) viewing = null; render(); stage(true); });
    el.querySelector('#mine') && (el.querySelector('#mine').onclick = () => { compare = false; viewing = null; render(); stage(true); });
    el.querySelector('#vsmain') && (el.querySelector('#vsmain').onclick = () => { compare = 'main'; viewing = null; render(); stage(true); });
    el.querySelector('#both') && (el.querySelector('#both').onclick = () => { compare = 'both'; viewing = null; render(); stage(true); });
    el.querySelector('#bringin') && (el.querySelector('#bringin').onclick = async () => {
      el.querySelector('#bringin').textContent = 'Bringing in…';
      try { S = await api('bringin', { direction: t.id }); lastCount = -1; render(); stage(true); } catch (e) { render(); }
    });
    el.querySelector('#close') && (el.querySelector('#close').onclick = async () => {
      const why = prompt(`Close "${t.title}"? Why, in a line (Kept remembers it if you try this again):`); if (why === null) return;
      S = await api('close', { direction: t.id, why }); go(p.key);
    });
    el.querySelector('#push') && (el.querySelector('#push').onclick = async () => {
      if (!confirm(`Push "${t.title}" into Main? It merges and goes live.`)) return;
      el.querySelector('#push').textContent = 'Pushing…';
      try { S = await api('push', { direction: t.id }); go(p.key); } catch (e) { S = await api('state'); render(); }
    });
  });
}

/* Home: Main's past under the big picture, then the threads, then Closed. */
function below() {
  const p = proj(); if (threadOf()) return;
  const row = (b, closed) => `<button class="trow${closed ? ' closedrow' : ''}" data-t="${b.id}"><div class="pic">${img(lastPic(b.versions))}</div>
      <div class="m"><p class="t">${b.building ? '<span class="dot pulse"></span> ' : ''}${esc(b.title)}</p>
      <p class="s">${closed ? esc(short(b.why, 120)) : `${b.building ? 'working · ' : ''}${b.versions.length} version${b.versions.length === 1 ? '' : 's'} · ${ago(Math.max(b.t || 0, ...b.versions.map(v => v.t)))}`}</p></div></button>`;
  put($('#below'), `<div class="hist">${p.main.map(v => `<button class="mini${v.sha === viewing ? ' on' : ''}" data-mv="${v.sha}" title="${esc(v.note)}"><div class="pic">${img(thumb(v))}</div></button>`).join('')}</div>
    <h2>Threads <span>${p.branches.length ? p.branches.length + ' open' : 'none yet: say what you want to try below'}</span></h2>
    ${p.branches.map(b => row(b)).join('')}
    ${p.closed.length ? `<button class="ctog" id="ctog">Closed · ${p.closed.length} ${showClosed ? '▾' : '▸'}</button>${showClosed ? p.closed.map(b => row(b, true)).join('') : ''}` : ''}`,
  el => {
    el.querySelectorAll('[data-t]').forEach(b => b.onclick = () => go(p.key, b.dataset.t));
    el.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => { viewing = viewing === b.dataset.mv ? null : b.dataset.mv; render(); stage(true); });
    el.querySelector('#ctog') && (el.querySelector('#ctog').onclick = () => { showClosed = !showClosed; below(); });
    el.querySelector('.hist').scrollLeft = 1e6;
  });
}

/* A thread's conversation, over the work: the last exchange, or all of it. */
function convo() {
  const t = threadOf();
  if (!t) return put($('#convo'), '');
  const last = (t.chat || []).slice(-1)[0];
  if ((t.conflict || t.resolved) && !t.building && !last?.error) return put($('#convo'), '');
  const chat = t.chat || [], nudge = S.nudges[t.id];
  const shown = showAll ? chat : chat.slice(-2);
  const msg = m => m.role === 'you' ? `<div class="msg you">${esc(m.text)}</div>`
    : `<div class="msg claude">${m.text ? esc(m.text) : ''}${m.busy || (!m.text && m.steps.length) ? `<p class="steps${m.busy ? ' live' : ''}">${esc(m.steps.at(-1) || 'Thinking')}</p>` : ''}${
        m.version ? `<br><button class="vchip" data-ver="${m.version}">v${t.versions.findIndex(v => v.sha === m.version) + 1}</button>` : ''}${
        m.blocked ? `<div class="blocked"><span>Claude wants to: ${esc(m.blocked.what)}</span><button class="btn dark" data-allow="${esc(m.blocked.allow)}">Allow</button></div>` : ''}</div>`;
  put($('#convo'), (chat.length > 2 ? `<button class="more" id="all">${showAll ? 'Show less' : `Whole thread · ${chat.length}`}</button>` : '')
    + (nudge && showAll === false ? `<div class="msg nudge">${esc(nudge.text)}</div>` : '')
    + shown.map(msg).join(''),
  el => {
    el.classList.toggle('all', showAll);
    el.querySelector('#all') && (el.querySelector('#all').onclick = () => { showAll = !showAll; convo(); });
    el.querySelectorAll('[data-ver]').forEach(b => b.onclick = () => { viewing = b.dataset.ver; render(); stage(true); });
    el.querySelectorAll('[data-allow]').forEach(b => b.onclick = async () => { S = await api('allow', { direction: t.id, allow: b.dataset.allow }); render(); });
    el.scrollTop = 1e6;
  });
}

/* Main changed the same part you did: Main now, yours, and how it started, side by side; then the combined one. */
function clash() {
  const t = threadOf(), c = t && (t.conflict || t.resolved), el = $('#clash');
  el.classList.toggle('hide', !c);
  if (!c) return put(el, '');
  const pane = (label, note, src, big) => `<div class="pane${big ? ' big' : ''}"><b>${label} <span>${note}</span></b><div class="frame"><iframe src="${src}" title="${label}"></iframe></div></div>`;
  const pg = c.page || '';
  const busy = t.building;
  el.classList.toggle('with-convo', busy || (t.chat || []).slice(-1)[0]?.error);
  put(el, t.conflict
    ? `<h3>Main changed the same part you did</h3>
       <p class="sub">${esc(c.files.join(', '))} · someone pushed while you were working. Say below how to combine them; nothing goes live until you Push.</p>
       <div class="three" style="--n:3">${pane('When you started', 'Main then', `/kept/v/${c.base}/${pg}`)}${pane('Main now', 'with what was pushed', `/kept/v/${c.theirs}/${pg}`)}${pane('Yours', 'your version', `/kept/v/${c.mine}/${pg}`)}</div>
       <div class="acts"><button class="btn quiet" id="abort">Cancel, keep mine as it was</button></div>`
    : `<h3>Combined</h3><p class="sub">You said “${esc(c.said || '')}”. ${esc((t.chat || []).filter(m => m.role === 'claude').slice(-1)[0]?.text || '')}</p>
       <div class="three" style="--n:3">${pane('Main now', '', `/kept/v/${c.theirs}/${pg}`)}${pane('Yours before', '', `/kept/v/${c.mine}/${pg}`)}${pane('Combined', 'new', c.sha ? `/kept/v/${c.sha}/${pg}` : `/kept/w/${t.id}/${pg}`, true)}</div>
       <div class="acts"><button class="btn dark" id="keepit">Keep it</button><button class="btn" id="undo">Undo</button></div>`,
  el => {
    el.querySelector('#abort') && (el.querySelector('#abort').onclick = async () => { if (!confirm('Cancel bringing in Main? Your version stays exactly as it was.')) return; S = await api('abortmerge', { direction: t.id }); render(); stage(true); });
    el.querySelector('#keepit') && (el.querySelector('#keepit').onclick = async () => { S = await api('keepmerge', { direction: t.id }); render(); stage(true); });
    el.querySelector('#undo') && (el.querySelector('#undo').onclick = async () => { S = await api('undomerge', { direction: t.id }); render(); stage(true); });
  });
}

function versions() {
  const t = threadOf();
  if (!t) return put($('#versions'), '');
  put($('#versions'), t.versions.map((v, i) => `<button class="mini${v.sha === viewing ? ' on' : ''}" data-v="${v.sha}" title="v${i + 1} · ${esc(v.note || '')}"><div class="pic">${img(thumb(v))}</div></button>`).join('')
    + (t.versions.length ? `<button class="mini now${!viewing ? ' on' : ''}" data-v=""><div class="pic">now</div></button>` : ''),
  el => { el.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { viewing = b.dataset.v || null; render(); stage(true); }); el.scrollLeft = 1e6; });
}

/* The box: one place to say what you want. */
function box() {
  const t = creating ? null : threadOf(), q = $('#q'), busy = t && t.building;
  q.placeholder = creating ? 'A guestbook page where visitors leave a doodle' : t ? (t.status !== 'active' ? 'This thread is closed' : t.conflict ? 'How should they combine? e.g. keep their colours, my layout' : `What next for “${short(t.title, 40)}”?`) : `What do you want to try in ${proj().name}?`;
  q.disabled = !!(t && t.status !== 'active');
  const send = $('#send');
  send.classList.toggle('stop', !!busy);
  send.innerHTML = busy ? STOP : UP;
  send.setAttribute('aria-label', busy ? 'Stop' : 'Send');
}
$('#q').addEventListener('input', e => { e.target.style.height = 'auto'; e.target.style.height = Math.min(160, e.target.scrollHeight) + 'px'; });
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#box').requestSubmit(); } });
$('#box').onsubmit = async e => {
  e.preventDefault();
  const t = threadOf(), q = $('#q');
  if (t && t.building && !creating) { S = await api('stop', { direction: t.id }); return render(); }
  const text = q.value.trim(); if (!text) return;
  if (creating) {
    try { S = await api('newproject', { text }); creating = false; q.value = ''; q.style.height = 'auto'; viewing = null; lastCount = 0; render(); stage(true); } catch (err) {}
    return;
  }
  try {
    S = t && t.conflict ? await api('resolve', { direction: t.id, text }) : await api('say', { project: proj().key, direction: t?.id, text });
    q.value = ''; q.style.height = 'auto'; viewing = null; showAll = false;
    lastCount = threadOf()?.versions.length ?? 0;
    render(); stage(true);
  } catch (err) {}
};

/* The stage: Main live from the main folder, a thread live from its own folder, or any version out of git. */
function pageOf() {
  const p = proj(), t = threadOf(), vs = t ? t.versions : p.main;
  const v = viewing && vs.find(v => v.sha === viewing);
  const page = (v && v.page) || (t && [...t.versions].reverse().find(v => v.page)?.page) || p.page;
  if (t && compare === 'main' && !viewing) return mainPage();
  if (!t && !viewing && !p.main.length) return 'about:blank';   // a new project: nothing live until it's pushed
  return viewing ? `/kept/v/${viewing}/${page}` : t && t.folder ? `/kept/w/${t.id}/${page}` : '/' + page;
}
function mainPage() {
  const p = proj(), t = threadOf();
  const page = (t && [...t.versions].reverse().find(v => v.page)?.page) || p.page;
  return p.main.length ? `/kept/v/${S.main_sha}/${page}` : 'about:blank';   // a new project: nothing on Main yet
}
function stage(force) {
  const f = $('#stage'), src = pageOf(), both = !!threadOf() && compare === 'both';
  if (force || f.dataset.src !== src) { f.dataset.src = src; f.src = src; }
  $('#stagebox').classList.toggle('split', both);
  const g = $('#stage2'), m = both ? mainPage() : 'about:blank';
  if (g.dataset.src !== m) { g.dataset.src = m; g.src = m; }
  $('#tag2').textContent = proj().main.length ? 'Main · live' : 'Main · nothing live yet';
  const tag = $('#tag');
  const t = threadOf();
  tag.classList.toggle('hide', !viewing && !!t && compare !== 'main' && compare !== 'both');
  tag.textContent = !t && !viewing && !proj().main.length ? 'Nothing live yet · it goes live when you Push' : viewing ? 'As it was' : t && compare === 'both' ? 'Yours' : t && compare === 'main' ? (proj().main.length ? 'Main · live' : 'Main · nothing live yet') : 'Main · live now';
}

refresh().then(() => stage(true));
setInterval(refresh, 1500);
</script>
</body>
