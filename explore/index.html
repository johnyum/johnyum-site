<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Explore — map drill-in</title>
<meta name="description" content="Airbnb Explore concept: the continent-wide map of priced cities, and the flight into one of them.">

<!-- Mapbox GL JS 3.13 — the same version and the same Standard/faded basemap recipe the Trips
     build uses, so this concept reads as the same map even though it ships on its own. -->
<link href="https://api.mapbox.com/mapbox-gl-js/v3.13.0/mapbox-gl.css" rel="stylesheet">

<style>
/* ── Type ───────────────────────────────────────────────────────────────────
   Airbnb Cereal VF, one variable file covering Book 400 → Bold 700. Same face
   the multi/ and multical/ concepts in this repo already carry. */
@font-face {
  font-family: 'Cereal';
  src: url('fonts/AirbnbCerealVF_Wght.ttf') format('truetype');
  font-weight: 100 900; font-style: normal; font-display: swap;
}

/* ── Tokens ─────────────────────────────────────────────────────────────────
   Airbnb DLS values as they came out of the Figma frame — grey ramp, rausch,
   the blue the airport cards are painted in, and the three elevations. */
:root {
  --grey0:#ffffff; --grey300:#ebebeb; --grey400:#dddddd; --grey500:#c1c1c1;
  --grey700:#6c6c6c; --grey1000:#222222;
  --rausch600:#ff385c; --blue1:#2f80ed; --orange600:#eb6100;

  --elev1: 0 0 0 1px rgba(0,0,0,.05), 0 2px 4px rgba(0,0,0,.16);
  --elev2: 0 0 0 1px rgba(0,0,0,.02), 0 2px 6px rgba(0,0,0,.04), 0 4px 8px rgba(0,0,0,.1);
  --elev3: 0 0 0 1px rgba(0,0,0,.02), 0 2px 16px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.1);
  --elev4: 0 0 0 1px rgba(0,0,0,.02), 0 4px 8px rgba(0,0,0,.08), 0 12px 30px rgba(0,0,0,.18);

  /* The one easing everything in this file moves on. Slow out of the gate,
     long tail — the camera and the chrome have to look like one gesture. */
  --ease: cubic-bezier(.22,.61,.24,1);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: #e9e5de; overflow: hidden;
  font-family: 'Cereal', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
  color: var(--grey1000); -webkit-font-smoothing: antialiased;
}
img { display: block; }
p { margin: 0; }   /* the default 1em is what pushed the title's two lines apart */
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

/* ── Map ────────────────────────────────────────────────────────────────── */
#map { position: fixed; inset: 88px 0 0 0; }
.mapboxgl-ctrl-logo, .mapboxgl-ctrl-attrib { opacity: .45; }
.mapboxgl-ctrl-bottom-left { left: 428px; }   /* clear of the panel */

/* ── Header ─────────────────────────────────────────────────────────────────
   1512×88 in the frame: logo at 32, the three tabs centred, profile + menu
   right. Flat px — this bar does not scale with the viewport. */
.hdr {
  position: fixed; top: 0; left: 0; right: 0; height: 88px; z-index: 30;
  background: #fff; display: flex; align-items: center; padding: 0 32px;
}
.hdr-logo { width: 102px; height: 32px; flex: none; }
.hdr-nav { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 40px; height: 40px; }
.hdr-tab { display: flex; align-items: center; gap: 12px; height: 40px; position: relative; }
.hdr-tab img { width: 32px; height: 32px; border-radius: 6px; }
.hdr-tab span { font-size: 16px; line-height: 20px; font-weight: 500; }
.hdr-tab.is-on span { font-weight: 600; }
/* The rule sits ON the bottom edge of the bar, not floating 2px above it: the
   tab is 40 tall centred in an 88 header, so its own bottom is at 64 and the
   bar's is at 88 — that is the -24, and anything less leaves a white strip
   under the rule that reads as a mistake. The extra 4 on the right is optical:
   the 3D icons carry transparent padding on their left, so the mark the eye
   sees sits right of the box, and a rule spanning the box alone reads short. */
.hdr-tab.is-on::after {
  content: ''; position: absolute; left: 0; right: -4px; bottom: -24px; height: 2px;
  background: var(--grey1000); border-radius: 2px;
}
.hdr-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
.hdr-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
.hdr-menu {
  width: 40px; height: 40px; border-radius: 50%; background: #f2f2f2;
  display: flex; align-items: center; justify-content: center;
}
.hdr-menu img { width: 14px; }

/* ── The card ───────────────────────────────────────────────────────────────
   One shell, two content layers. The shell's height is what animates; the
   layers cross-fade inside it. That is the whole morph. */
.card {
  position: fixed; left: 24px; top: 112px; width: 380px; z-index: 20;
  background: #fff; border-radius: 24px; box-shadow: var(--elev1);
  overflow: hidden; height: 504px; max-height: calc(100vh - 136px);
  transition: height 700ms var(--ease), width 700ms var(--ease);
}
.card.is-city { height: 576px; }
.layer {
  position: absolute; inset: 0; padding: 20px 24px 48px;
  display: flex; flex-direction: column; align-items: center; gap: 32px;
  transition: opacity 280ms var(--ease), transform 480ms var(--ease);
}
.layer[data-hidden] { opacity: 0; pointer-events: none; }
#layerUsa[data-hidden]  { transform: translateY(-14px); }
#layerCity, #layerHood  { transform: translateY(14px); }
#layerCity:not([data-hidden]),
#layerHood:not([data-hidden]) { transform: none; transition-delay: 160ms; }

/* Search pill — 340×56, radius 100 */
.search {
  width: 340px; height: 56px; flex: none; border: 1px solid var(--grey400);
  border-radius: 100px; background: #fff; box-shadow: 0 8px 12px rgba(0,0,0,.1);
  display: flex; align-items: center; justify-content: space-between; padding: 13px 12px;
}
.search-btn { padding: 8px; border-radius: 100px; display: flex; align-items: center; }
.search-btn img { width: 16px; height: 16px; }
.search-mid { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.search-mid .t { font-size: 14px; line-height: 18px; font-weight: 600; white-space: nowrap; }
.search-mid .s { font-size: 12px; line-height: 16px; font-weight: 400; color: var(--grey700); white-space: nowrap; }

/* The listings beat's title is three parts on one line, so its pill runs the
   full content width of the (much wider) card rather than the frames' 340 —
   at 340 the title and the filter icon simply run out past the white. */
#layerHood .search { width: 668px; }
/* The listings run to the bottom edge of the card. The shell's 48 bottom
   padding sits OUTSIDE the scroll box, so it reads as a permanent white band
   under a list that is visibly still going — a scrim, not breathing room. The
   padding moves inside the scroller, where it is only spent once you have
   actually reached the end. The card's own overflow clips the last row to the
   rounded corner. */
#layerHood { padding-bottom: 0; }
#layerHood .grid { padding-bottom: 24px; }

/* Vibe cards */
.vibes { display: flex; align-items: center; gap: 4px; flex: none; }
.vibe { position: relative; height: 100px; width: 80px; }
.vibe .thumb {
  position: absolute; top: 4px; left: 4px; width: 72px; height: 72px;
  border-radius: 8px; object-fit: cover;
}
.vibe .lbl {
  position: absolute; top: 84px; left: 4px; width: 72px;
  font-size: 12px; line-height: 16px; font-weight: 600; text-align: center;
}
.vibe .ring {
  position: absolute; top: 0; left: 0; width: 80px; height: 80px;
  border: 2px solid #000; border-radius: 12px; opacity: 0;
  transition: opacity 200ms var(--ease);
}
.vibe.is-on .ring { opacity: 1; }
/* the city layer's cards are wider */
#layerCity .vibe { width: 108px; }
#layerCity .vibe .thumb { width: 100px; }
#layerCity .vibe .lbl { width: 100px; }
#layerCity .vibe .ring { width: 108px; }

/* Divider + transport + slider (USA layer only) */
.stack { display: flex; flex-direction: column; align-items: center; gap: 24px; flex: none; }
.rule { width: 380px; height: 1px; background: var(--grey300); flex: none; }
.modes { display: flex; align-items: center; justify-content: center; gap: 20px; width: 332px; height: 80px; padding: 8px; }
.mode {
  width: 64px; height: 64px; border-radius: 100px; background: #fff;
  border: 1px solid var(--grey500); display: flex; align-items: center; justify-content: center;
  transition: background 200ms var(--ease), border-color 200ms var(--ease);
}
.mode img { width: 20px; height: 20px; }
/* Every glyph ships dark, and the selected one is knocked out white against the
   black circle. Swapping in a white file for the selected mode is how the
   unselected plane ended up white-on-white and invisible — there was no dark
   plane in the set at all. brightness(0) flattens the art to black, invert(1)
   takes it to pure white; #222 inverted alone would only reach #ddd. */
.mode.is-on img { filter: brightness(0) invert(1); }
.mode.is-on { background: var(--grey1000); border-color: var(--grey1000); }
.dur { width: 324px; display: flex; flex-direction: column; gap: 16px; flex: none; }
.dur-row { display: flex; align-items: center; justify-content: space-between; font-size: 14px; line-height: 18px; white-space: nowrap; }
.dur-row .k { font-weight: 600; }
.dur-row .v { font-weight: 400; color: var(--grey700); }
/* Built rather than dropped in as the exported SVG, because the knob has to
   move: rail is any duration, so it sits hard right, where flights and driving
   sit at the frame's 62%. --pos is the one number that says where. */
.dur-track { position: relative; height: 20px; --pos: 62%; cursor: pointer; touch-action: none; }
.dur-track.dragging .fill, .dur-track.dragging .knob { transition: none; }
.dur-track .rail { position: absolute; left: 0; right: 0; top: 9px; height: 2px; border-radius: 2px; background: var(--grey400); }
.dur-track .fill { position: absolute; left: 0; top: 9px; height: 2px; border-radius: 2px; background: var(--grey1000); width: var(--pos); transition: width 420ms var(--ease); }
.dur-track .knob { position: absolute; top: 0; left: var(--pos); width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: var(--grey1000); transition: left 420ms var(--ease); }

/* City layer rows */
.rows { display: flex; flex-direction: column; gap: 12px; flex: none; }
.row {
  width: 332px; height: 88px; border: 1px solid var(--grey400); border-radius: 16px;
  background: #fff; display: flex; align-items: center; justify-content: space-between;
  padding: 24px 20px; transition: box-shadow 200ms var(--ease), transform 200ms var(--ease);
}
.row:hover { box-shadow: var(--elev2); transform: translateY(-1px); }
.row .rt { font-size: 14px; line-height: 18px; font-weight: 600; white-space: nowrap; }
.row .rs { font-size: 12px; line-height: 16px; font-weight: 400; color: var(--grey700); white-space: nowrap; }
.row .rc { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.badge { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 8px; flex: none; }
.badge img.p { width: 12px; height: 12px; }
.badge img.i { width: 16px; height: 16px; }

/* ── Neighbourhood layer ────────────────────────────────────────────────────
   The card nearly doubles in width for the listings. Same shell, same 32 gap;
   only the grid is new. */
.card.is-hood { width: 716px; height: 822px; }
.search-inline { flex-direction: row; align-items: baseline; gap: 4px; }
.search-inline .t, .search-inline .s { font-size: 14px; line-height: 16px; }
.grid {
  display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 16px; row-gap: 32px;
  width: 668px; flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
  scrollbar-width: none; align-content: start;
}
.grid::-webkit-scrollbar { display: none; }
.home { display: flex; flex-direction: column; gap: 12px; }
.home .shot { position: relative; }
.home .shot img.ph { width: 100%; aspect-ratio: 219.33 / 210; object-fit: cover; border-radius: 16.55px; }
/* The like button is the Trips one, inline rather than an <img>, because the
   fill has to change when it is saved. The Figma export could not be used as
   drawn: it is a 22.5x19.66 viewBox carrying preserveAspectRatio="none", so
   asking for the design's 24x24 box stretched the heart 22% tall. */
.home .heart { position: absolute; right: 12px; top: 12px; width: 24px; height: 24px; }
.home .heart svg { width: 24px; height: 24px; display: block; transition: transform 150ms cubic-bezier(.2,.9,.3,1.3); }
.home .heart:active svg { transform: scale(.86); }
.home .heart path { fill: rgba(0,0,0,.45); stroke: #fff; stroke-width: 2; transition: fill 180ms var(--ease); }
.home .heart.saved path { fill: var(--rausch600); }
.home .meta { padding: 0 4px; display: flex; flex-direction: column; gap: 2px; }
.home .ht { font-size: 13px; line-height: 16px; font-weight: 500; }
.home .hp { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12px; line-height: 16px; color: #6a6a6a; }
.home .hp .sep { color: var(--grey500); }
.home .hp .star { width: 11px; height: 10.5px; }   /* its viewBox is 7.88x7.52, not square */

/* price pills at neighbourhood depth — the number is the whole label */
.mk-price { cursor: default; }
.mk-price .pill {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  height: 32px; padding: 7px 12px; background: #fff; border-radius: 100px;
  box-shadow: var(--elev2); font-size: 14px; line-height: 18px; font-weight: 600;
  white-space: nowrap;
}

/* The duration chip that rides the hovered route — black pill, 12 clock, 10/14
   bold white, exactly as the Traffic component in the frames. It sits above
   every marker because it is the thing the hover is there to say. */
.mk-chip { z-index: 5; pointer-events: none; }
.mk-chip .chip {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  display: flex; align-items: center; gap: 6px; padding: 4px 8px 4px 4px;
  background: var(--grey1000); border-radius: 100px; white-space: nowrap;
  font-size: 10px; line-height: 14px; font-weight: 700; color: #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,.24);
}
.mk-chip .chip img { width: 12px; height: 12px; }

/* ── Zoom control ───────────────────────────────────────────────────────── */
.zoom {
  position: fixed; right: 32px; bottom: 24px; z-index: 20;
  width: 40px; background: #fff; border-radius: 8px; box-shadow: var(--elev3);
  display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px 0;
}
.zoom button { width: 20px; height: 20px; display: flex; }
.zoom img { width: 20px; height: 20px; }
.zoom .hr { width: 40px; height: 1px; background: var(--grey300); }

/* ── Markers ────────────────────────────────────────────────────────────────
   Every marker is an outer box Mapbox owns (it writes the transform) wrapping
   an .mi that this file animates. Touching the outer one fights the map. */
/* absolute, not relative: this rule sits after mapbox-gl.css and has the same
   specificity as `.mapboxgl-marker`, so `position: relative` here quietly wins
   and every marker falls back into document flow — pins stack down the page
   and drift further from their coordinate the further down the list they are. */
.mk { position: absolute; }
/* Anything carrying a name outranks anything that does not, so a stray pin can
   never come down on top of LaGuardia. Markers are DOM siblings in the order
   they were added, so without this the set added last simply wins. */
.mk-dot  { z-index: 1; }
.mk-city, .mk-hood { z-index: 2; }
.mk-air  { z-index: 3; }
.mk-me   { z-index: 4; }
.mi {
  position: absolute; inset: 0;
  opacity: 0; transform: translateY(8px) scale(.9); transform-origin: 50% 100%;
  transition: opacity 220ms var(--ease), transform 300ms var(--ease);
}
.mk.in .mi { opacity: 1; transform: none; }

/* The bare pin: a 20 round head on a 1.5 metal stem. On a labelled marker the
   head is not a separate thing sitting beside the pill — it sits ON the pill,
   in the inset the pill's own left padding leaves for it, with only the stem
   carrying on out the bottom. Hence the z-index and the markup order: the pin
   is written after the pill, so the white never lands over the red. */
.pin { position: absolute; width: 20px; z-index: 1; }
.pin .stem { position: absolute; left: 9.25px; top: 12px; width: 1.5px; border-radius: 100px; background: var(--grey700); }
.pin .head { position: absolute; left: 0; top: 0; width: 20px; height: 20px; border-radius: 50%; background: var(--rausch600); }
/* The head carries the mode: rausch for a flight, Blue 1 for a drive, amber
   for the train. Same pin, same pill — only the colour and the glyph move. */
.mk-drive .pin .head, .mk-drive .pin-sm .head { background: var(--blue1); }
.mk-rail  .pin .head, .mk-rail  .pin-sm .head { background: #ffa513; }
.mk-walk  .pin .head, .mk-walk  .pin-sm .head { background: #1f8f4e; }   /* on foot: green, a white walker (John, 2026-10-06) */
.pin .head::after {
  content: ''; position: absolute; left: 1px; top: .5px; width: 9px; height: 5.5px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255,255,255,.55), rgba(220,180,180,0));
  transform: rotate(-30deg);
}
.pin .head img { position: absolute; left: 4px; top: 4px; width: 12px; height: 12px; }

/* An unnamed pin is NOT the labelled pin with the label taken off — it is its
   own smaller component: a 10 head on a 1px stem, 15 tall, centred in a 28×36
   box, and no icon in the head — a 6px plane inside a 10px circle is a smudge,
   not a plane. Shrinking the 20px one instead gives a fat dot with a thick stem
   that competes with the pills it is supposed to sit quietly behind. */
.mk-dot { width: 28px; height: 36px; }
.pin-sm { position: absolute; left: 9px; bottom: 0; width: 10px; height: 15px; z-index: 1; }
.pin-sm .stem { position: absolute; left: 4.5px; top: 5px; width: 1px; height: 10px; border-radius: 100px; background: var(--grey700); }
.pin-sm .head { position: absolute; left: 0; top: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--rausch600); }

/* city price pill — 142×36, pill 28 tall, pin hung at x=4 */
.mk-city { height: 36px; cursor: pointer; }
.mk-city .pill {
  position: absolute; left: 0; top: 0; height: 28px; background: #fff; border-radius: 100px;
  box-shadow: var(--elev2); padding: 4px 12px 4px 32px; display: flex; gap: 2px;
  font-size: 12px; line-height: 20px; white-space: nowrap;
  transition: box-shadow 200ms var(--ease);
}
.mk-city .pill b { font-weight: 700; }
.mk-city .pill span { font-weight: 400; }
.mk-city .pin { left: 4px; top: 4px; height: 32px; }
.mk-city .pin .stem { height: 20px; }
.mk-city:hover .pill, .mk-hood.hero:hover .pill { box-shadow: 0 0 0 1px rgba(0,0,0,.02), 0 4px 10px rgba(0,0,0,.08), 0 10px 20px rgba(0,0,0,.14); }

/* TWO FORMS ON ONE MARKER (John, 2026-10-06): the pill and its 20 pin, and the small 10 pin, share one element with their points
   on one spot. `sm` is the place at rest — a dot. Hover a dot and the pill grows out of its point (the big pin inflating from the
   small one's head) and the dot gives way; let go and it settles back. Only the pin and the pill take the pointer: the 142-wide
   box is air, so a marker over the sea never hides the one beside it. A hovered marker rises over its neighbours. */
.mk-city { pointer-events: none; }
.mk-city:hover { z-index: 3; }
.mk-city .pill, .mk-city .pin, .mk-city .pin-sm { pointer-events: auto; }
.mk-city .pill, .mk-city .pin { transition: opacity 240ms var(--ease), transform 380ms var(--ease), box-shadow 200ms var(--ease); }
.mk-city .pill { transform-origin: 14px 36px; }
.mk-city .pin  { transform-origin: 10px 32px; }
.mk-city.sm .pill, .mk-city.sm .pin { opacity: 0; transform: scale(.3); pointer-events: none; }
.mk-city .pin-sm { left: 9px; bottom: 0; opacity: 0; transform: scale(2); transform-origin: 5px 15px; transition: opacity 200ms var(--ease), transform 380ms var(--ease); pointer-events: none; }
.mk-city.sm .pin-sm { opacity: 1; transform: none; pointer-events: auto; }
/* a dot stands under every pill (John, 2026-10-06: small dots were landing on top of the big ones), and a dot whose head would
   sit on a pill is not drawn at all — the pill has that spot */
.mk-city.sm { z-index: 1; }
.mk-city.sm.under .pin-sm { opacity: 0; pointer-events: none; }
.mk-city.sm.under:hover .pin-sm { opacity: 0; }
.mk-city.sm:hover .pill, .mk-city.sm:hover .pin { opacity: 1; transform: none; pointer-events: auto; }
.mk-city.sm:hover .pin-sm { opacity: 0; transform: scale(2); }

/* the pulsing ring that marked the way down is gone (John, 2026-10-07: "that red glow. kill it") */
  70%  { box-shadow: 0 0 0 14px rgba(255,56,92,0); }
  100% { box-shadow: 0 0 0 0 rgba(255,56,92,0); }
}

/* borough pill — 139×48, two lines, pin at x=11 */
.mk-hood { width: 139px; height: 48px; pointer-events: none; }
.mk-hood:hover { z-index: 3; }
.mk-hood .pill, .mk-hood .pin, .mk-hood .pin-sm { pointer-events: auto; }
.mk-hood .pill {
  position: absolute; left: 0; top: 1px; height: 42px;
  min-width: 135px; width: max-content; background: #fff; border-radius: 100px; box-shadow: var(--elev2);   /* as wide as its name — "Racquet Club Es" was cut off (John, 2026-10-07) */
  padding: 8px 20px 8px 40px; white-space: nowrap;
  transition: opacity 240ms var(--ease), transform 380ms var(--ease), box-shadow 200ms var(--ease); transform-origin: 21px 48px;
}
.mk-hood .pin { transition: opacity 240ms var(--ease), transform 380ms var(--ease); transform-origin: 10px 36px; }
.mk-hood.sm .pill, .mk-hood.sm .pin { opacity: 0; transform: scale(.3); pointer-events: none; }
.mk-hood .pin-sm { left: 16px; bottom: 0; opacity: 0; transform: scale(2); transform-origin: 5px 15px; transition: opacity 200ms var(--ease), transform 380ms var(--ease); pointer-events: none; }
.mk-hood.sm .pin-sm { opacity: 1; transform: none; pointer-events: auto; }
.mk-hood.sm:hover .pill, .mk-hood.sm:hover .pin { opacity: 1; transform: none; pointer-events: auto; }
.mk-hood.sm:hover .pin-sm { opacity: 0; transform: scale(2); }
.mk-hood.sm { z-index: 1; }
.mk-hood.sm.under .pin-sm { opacity: 0; pointer-events: none; }
.mk-hood .pill b { display: block; font-size: 12px; line-height: 14px; font-weight: 700; }
.mk-hood .pill span { display: block; font-size: 10px; line-height: 12px; font-weight: 400; }
.mk-hood .pin { left: 11px; bottom: 0; top: 12px; height: 36px; }
.mk-hood .pin .stem { height: 24px; }

/* airport card — 160×97, blue, tail at the bottom centre */
.mk-air { width: 160px; height: 97px; }
.mk-air .card-a {
  position: absolute; left: 0; top: 0; width: 160px; height: 86px; background: var(--blue1);
  border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px;
  filter: drop-shadow(0 8px 12px rgba(0,0,0,.18));
}

   and it is tucked high enough that its left and right corners fall INSIDE the

      return '<button class="vibe' + (i === 0 ? ' is-on' : '') + '"><img class="thumb" src="assets/img/' + v[1] + '" alt=""><span class="lbl">' + v[0] + '</span><i class="ring"></i></button>';
    }).join('');
    var rows = L.querySelectorAll('.row'); c.rows.forEach(function (r, i) { rows[i].querySelector('.rt').textContent = r[0]; rows[i].querySelector('.rs').textContent = r[1]; });
  }
  function dressHood(key) {
    var h = HOODZ[key], L = document.getElementById('layerHood');
    L.querySelector('.search-mid .t').textContent = 'Homes in ' + h.name;
    document.getElementById('homeGrid').innerHTML = h.homes.map(function (m, i) { return homeCard(m, 'assets/img/' + h.photo + (i + 1) + (h.photo === 'home-' ? '.jpg' : '.png')); }).join('');
  }
  function enterCity(key, opts) {
    if (busy) return;
    var c = CITY[key]; cityKey = key; cityVibe = c.first; cityFrom = BEATS[state].depth === 0 ? state : cityFrom;
    BEATS.nyc.cam = c.cam; BEATS.nyc.set = c.sets[c.first]; dressCity(key);
    go('nyc', opts);
  }
  function enterHood(key) {
    if (busy) return;
    var h = HOODZ[key]; hoodKey = key;
    BEATS.hood.cam = h.cam; BEATS.hood.set = h.set; dressHood(key); setHoodMask(h.poly);
    go('hood');
  }
  // a city's vibe re-pins the city (Palm Springs); New York's three are a ring only, as they were
  function setCityVibe(k) {
    var c = CITY[cityKey], sets = c.sets; if (!sets[k] || k === cityVibe || state !== 'nyc') return;
    var was = BEATS.nyc.set; cityVibe = k; BEATS.nyc.set = sets[k];
    busy = true; hideRoute();
    hide(was, 18, function () { show(sets[k], 32); busy = false; fitVisible(); });
  }
  document.getElementById('zin').addEventListener('click', function () { byHand = true; map.zoomIn({ duration: 400 }); });
  document.getElementById('zout').addEventListener('click', function () { byHand = true; map.zoomOut({ duration: 400 }); });

  // The nine listings, written once from the data rather than nine times in
  // the markup — they differ only by photo, title, price and rating.
  function homeCard(h, src) {
    return '<article class="home">' +
      '<div class="shot">' +
        '<img class="ph" src="' + src + '" alt="">' +
        '<button class="heart" type="button" aria-label="Save"><svg viewBox="0 0 32 32">' +
        '<path d="M16 28C9 23.4 3 18.7 3 11.9 3 8.1 6 5 9.8 5c2.5 0 4.8 1.3 6.2 3.5C17.4 6.3 19.7 5 22.2 5 26 5 29 8.1 29 11.9c0 6.8-6 11.5-13 16.1z"/>' +
        '</svg></button>' +
      '</div>' +
      '<div class="meta"><p class="ht">' + h.t + '</p>' +
      '<p class="hp"><span>' + h.p + ' for 1 week</span><span class="sep">·</span>' +
      '<img class="star" src="assets/icons/star.svg" alt="">' + h.r + '</p></div>' +
    '</article>';
  }
  document.getElementById('homeGrid').innerHTML = HOMES.map(function (h, i) { return homeCard(h, 'assets/img/home-' + (i + 1) + '.jpg'); }).join('');

  document.getElementById('homeGrid').addEventListener('click', function (e) {
    var h = e.target.closest('.heart'); if (!h) return;
    h.classList.toggle('saved');
  });

  // Vibe cards are a one-of-four ring, per layer.
  // A TAP WAITS ITS TURN (John, 2026-10-06: the train button lit over the flights' pins — the tap had landed while the map was
  // busy and been dropped): a mode or a vibe chosen mid-move runs as soon as the move is done, so what's lit is what's shown
  function whenFree(fn) { if (!busy) fn(); else setTimeout(function () { whenFree(fn); }, 80); }
  document.querySelectorAll('.vibes').forEach(function (row) {
    row.addEventListener('click', function (e) {
      var v = e.target.closest('.vibe'); if (!v) return;
      whenFree(function () {
        row.querySelectorAll('.vibe').forEach(function (x) { x.classList.remove('is-on'); });
        v.classList.add('is-on');
        var lbl = v.querySelector('.lbl'); if (row.closest('#layerUsa') && lbl) setVibe(lbl.textContent.trim().toLowerCase());
        if (row.closest('#layerCity') && lbl) setCityVibe(lbl.textContent.trim().toLowerCase());
      });
    });
  });
  // THE VIBE'S PINS: the field clears and the vibe's own cities come in, New York (the hero) among them each time
  var vibe = 'popular', FIT_MAX = { drive: 7.2, usa: 4.6, rail: 7.2, walk: 13.4, nyc: 13.2 };
  function setVibe(k) {
    var sets = vibeSets[state]; if (!sets || !sets[k] || k === vibe) return;
    var was = BEATS[state].set; vibe = k;
    var next = sets[k]; Object.keys(vibeSets).forEach(function (m) { if (vibeSets[m][k]) BEATS[m].set = vibeSets[m][k]; });   // the vibe holds across modes
    busy = true; hideRoute();
    // the camera fits the vibe's pins (John, 2026-10-06: zoom to fit if necessary) — Popular goes back to the mode's own camera
    hide(was, 18, function () { show(next, 32); busy = false; fitVisible(); });   // then the camera fits the pins the hours allow
  }
  // The picker is four beats now: walking got its own map on 2026-10-06 — the city on foot.
  var modeBtns = document.querySelectorAll('.modes .mode');
  var durTrack = document.querySelector('.dur-track');
  var durValue = document.querySelector('.dur-row .v');
  function syncModes(beat) {
    if (beat.mode === undefined) return;
    modeBtns.forEach(function (x, i) { x.classList.toggle('is-on', i === beat.mode); });
    // Two days on a train is not "under 8 hours" — the filter has to say so.
    // the knob stays where you left it across modes (John, 2026-10-06); the hours follow the mode's own range
    if (durPos == null) durPos = parseFloat(beat.dur ? beat.dur[0] : '30.4') / 100;
    applyPos(durPos, true);
  }
  var durPos = null;
  function applyPos(pos, quiet) {
    var rng = DUR, h = rng[0] + (rng[1] - rng[0]) * pos * pos;
    maxH[state] = pos >= 0.995 ? Infinity : h;
    durTrack.style.setProperty('--pos', (pos * 100).toFixed(1) + '%'); durValue.textContent = durLabel(h, pos);
    if (!quiet) applyDur();
  }
  // the slider: drag the knob (or tap the track) — the fill follows the finger, the label says the hours, the pins come and go
  (function () {
    var drag = false;
    var at = function (e) { var r = durTrack.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); };
    var setPos = function (pos) { durPos = pos; applyPos(pos, false); };
    durTrack.addEventListener('pointerdown', function (e) { if (!BEATS[state].dur) return; drag = true; durTrack.classList.add('dragging'); durTrack.setPointerCapture(e.pointerId); setPos(at(e)); e.preventDefault(); });
    durTrack.addEventListener('pointermove', function (e) { if (drag) setPos(at(e)); });
    var up = function () { drag = false; durTrack.classList.remove('dragging'); };
    durTrack.addEventListener('pointerup', up); durTrack.addEventListener('pointercancel', up);
  })();
  document.querySelector('.modes').addEventListener('click', function (e) {
    var m = e.target.closest('.mode'); if (!m) return;
    whenFree(function () {
      modeBtns.forEach(function (x) { x.classList.remove('is-on'); });
      m.classList.add('is-on');
      if (m.dataset.beat) go(m.dataset.beat);
    });
  });

  // Deep link for a deck: ?state=nyc / ?state=hood opens straight on that
  // beat. Decided BEFORE the load handler, so only one set is ever revealed.
  var m0 = /[?&]state=(usa|nyc|hood|drive|rail)\b/.exec(location.search);
  if (m0) {
    state = m0[1];
  }

  // Whatever beat we open on, the camera, the card and the picker start on it.
  var b0 = BEATS[state];
  map.jumpTo({ center: cam(b0.cam).center, zoom: cam(b0.cam).zoom, padding: PAD() });
  card.classList.remove('is-city', 'is-hood');
  if (b0.cls) card.classList.add(b0.cls);
  ['layerUsa', 'layerCity', 'layerHood'].forEach(function (id) {
    document.getElementById(id).toggleAttribute('data-hidden', id !== b0.layer);
  });
  tabs.forEach(function (t, i) { t.classList.toggle('is-on', i === b0.tab); });
  syncModes(b0);

  // The markers wait on nothing. They are DOM over the canvas, and hanging
  // them off `load` (the first full tile set) or `style.load` means that on a
  // slow style — or one whose imports never settle — the card sits there over
  // an empty map forever. They come up now; the tiles arrive under them.
  show(BEATS[state].set, 45); meOn(BEATS[state].depth === 0);

  // The mask is the one thing that genuinely needs the style, because it adds
  // a source and two layers. Rather than trust an event, try until it takes.
  (function armMask(tries) {
    try {
      addHoodMask();
      paintHoodMask(state === 'hood');
      showModeRoute(state);
    } catch (e) {
      if (tries < 100) setTimeout(function () { armMask(tries + 1); }, 150);
    }
  })(0);
})();
</script>
</body>
</html>
