<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Explore — map drill-in</title>
<meta name="description" content="Airbnb Explore concept: the continent-wide map of priced cities, and the flight into one of them.">

<!-- Mapbox GL JS 3.13 — the same version and the same Standard/faded basemap recipe the Trips
     build uses, so this concept reads as the same map even though it ships on its own. -->
<link href="https://api.mapbox.com/mapbox-gl-js/v3.13.0/mapbox-gl.css" rel="stylesheet">

<style>
/* ── Type ───────────────────────────────────────────────────────────────────
   Airbnb Cereal VF, one variable file covering Book 400 → Bold 700. Same face
   the multi/ and multical/ concepts in this repo already carry. */
@font-face {
  font-family: 'Cereal';
  src: url('fonts/AirbnbCerealVF_Wght.ttf') format('truetype');
  font-weight: 100 900; font-style: normal; font-display: swap;
}

/* ── Tokens ─────────────────────────────────────────────────────────────────
   Airbnb DLS values as they came out of the Figma frame — grey ramp, rausch,
   the blue the airport cards are painted in, and the three elevations. */
:root {
  --grey0:#ffffff; --grey300:#ebebeb; --grey400:#dddddd; --grey500:#c1c1c1;
  --grey700:#6c6c6c; --grey1000:#222222;
  --rausch600:#ff385c; --blue1:#2f80ed; --orange600:#eb6100;

  --elev1: 0 0 0 1px rgba(0,0,0,.05), 0 2px 4px rgba(0,0,0,.16);
  --elev2: 0 0 0 1px rgba(0,0,0,.02), 0 2px 6px rgba(0,0,0,.04), 0 4px 8px rgba(0,0,0,.1);
  --elev3: 0 0 0 1px rgba(0,0,0,.02), 0 2px 16px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.1);
  --elev4: 0 0 0 1px rgba(0,0,0,.02), 0 4px 8px rgba(0,0,0,.08), 0 12px 30px rgba(0,0,0,.18);

  /* The one easing everything in this file moves on. Slow out of the gate,
     long tail — the camera and the chrome have to look like one gesture. */
  --ease: cubic-bezier(.22,.61,.24,1);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: #e9e5de; overflow: hidden;
  font-family: 'Cereal', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
  color: var(--grey1000); -webkit-font-smoothing: antialiased;
}
img { display: block; }
p { margin: 0; }   /* the default 1em is what pushed the title's two lines apart */
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

/* ── Map ────────────────────────────────────────────────────────────────── */
#map { position: fixed; inset: 88px 0 0 0; }
.mapboxgl-ctrl-logo, .mapboxgl-ctrl-attrib { opacity: .45; }
.mapboxgl-ctrl-bottom-left { left: 428px; }   /* clear of the panel */

/* ── Header ─────────────────────────────────────────────────────────────────
   1512×88 in the frame: logo at 32, the three tabs centred, profile + menu
   right. Flat px — this bar does not scale with the viewport. */
.hdr {
  position: fixed; top: 0; left: 0; right: 0; height: 88px; z-index: 30;
  background: #fff; display: flex; align-items: center; padding: 0 32px;
}
.hdr-logo { width: 102px; height: 32px; flex: none; }
.hdr-nav { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 40px; height: 40px; }
.hdr-tab { display: flex; align-items: center; gap: 12px; height: 40px; position: relative; }
.hdr-tab img { width: 32px; height: 32px; border-radius: 6px; }
.hdr-tab span { font-size: 16px; line-height: 20px; font-weight: 500; }
.hdr-tab.is-on span { font-weight: 600; }
/* The rule sits ON the bottom edge of the bar, not floating 2px above it: the
   tab is 40 tall centred in an 88 header, so its own bottom is at 64 and the
   bar's is at 88 — that is the -24, and anything less leaves a white strip
   under the rule that reads as a mistake. The extra 4 on the right is optical:
   the 3D icons carry transparent padding on their left, so the mark the eye
   sees sits right of the box, and a rule spanning the box alone reads short. */
.hdr-tab.is-on::after {
  content: ''; position: absolute; left: 0; right: -4px; bottom: -24px; height: 2px;
  background: var(--grey1000); border-radius: 2px;
}
.hdr-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
.hdr-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
.hdr-menu {
  width: 40px; height: 40px; border-radius: 50%; background: #f2f2f2;
  display: flex; align-items: center; justify-content: center;
}
.hdr-menu img { width: 14px; }

/* ── The card ───────────────────────────────────────────────────────────────
   One shell, two content layers. The shell's height is what animates; the
   layers cross-fade inside it. That is the whole morph. */
.card {
  position: fixed; left: 24px; top: 112px; width: 380px; z-index: 20;
  background: #fff; border-radius: 24px; box-shadow: var(--elev1);
  overflow: hidden; height: 504px; max-height: calc(100vh - 136px);
  transition: height 700ms var(--ease), width 700ms var(--ease);
}
.card.is-city { height: 576px; }
.layer {
  position: absolute; inset: 0; padding: 20px 24px 48px;
  display: flex; flex-direction: column; align-items: center; gap: 32px;
  transition: opacity 280ms var(--ease), transform 480ms var(--ease);
}
.layer[data-hidden] { opacity: 0; pointer-events: none; }
#layerUsa[data-hidden]  { transform: translateY(-14px); }
#layerCity, #layerHood  { transform: translateY(14px); }
#layerCity:not([data-hidden]),
#layerHood:not([data-hidden]) { transform: none; transition-delay: 160ms; }

/* Search pill — 340×56, radius 100 */
.search {
  width: 340px; height: 56px; flex: none; border: 1px solid var(--grey400);
  border-radius: 100px; background: #fff; box-shadow: 0 8px 12px rgba(0,0,0,.1);
  display: flex; align-items: center; justify-content: space-between; padding: 13px 12px;
}
.search-btn { padding: 8px; border-radius: 100px; display: flex; align-items: center; }
.search-btn img { width: 16px; height: 16px; }
.search-mid { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.search-mid .t { font-size: 14px; line-height: 18px; font-weight: 600; white-space: nowrap; }
.search-mid .s { font-size: 12px; line-height: 16px; font-weight: 400; color: var(--grey700); white-space: nowrap; }

/* The listings beat's title is three parts on one line, so its pill runs the
   full content width of the (much wider) card rather than the frames' 340 —
   at 340 the title and the filter icon simply run out past the white. */
#layerHood .search { width: 668px; }
/* The listings run to the bottom edge of the card. The shell's 48 bottom
   padding sits OUTSIDE the scroll box, so it reads as a permanent white band
   under a list that is visibly still going — a scrim, not breathing room. The
   padding moves inside the scroller, where it is only spent once you have
   actually reached the end. The card's own overflow clips the last row to the
   rounded corner. */
#layerHood { padding-bottom: 0; }
#layerHood .grid { padding-bottom: 24px; }

/* Vibe cards */
.vibes { display: flex; align-items: center; gap: 4px; flex: none; }
.vibe { position: relative; height: 100px; width: 80px; }
.vibe .thumb {
  position: absolute; top: 4px; left: 4px; width: 72px; height: 72px;
  border-radius: 8px; object-fit: cover;
}
.vibe .lbl {
  position: absolute; top: 84px; left: 4px; width: 72px;
  font-size: 12px; line-height: 16px; font-weight: 600; text-align: center;
}
.vibe .ring {
  position: absolute; top: 0; left: 0; width: 80px; height: 80px;
  border: 2px solid #000; border-radius: 12px; opacity: 0;
  transition: opacity 200ms var(--ease);
}
.vibe.is-on .ring { opacity: 1; }
/* the city layer's cards are wider */
#layerCity .vibe { width: 108px; }
#layerCity .vibe .thumb { width: 100px; }
#layerCity .vibe .lbl { width: 100px; }
#layerCity .vibe .ring { width: 108px; }

/* Divider + transport + slider (USA layer only) */
.stack { display: flex; flex-direction: column; align-items: center; gap: 24px; flex: none; }
.rule { width: 380px; height: 1px; background: var(--grey300); flex: none; }
.modes { display: flex; align-items: center; justify-content: center; gap: 20px; width: 332px; height: 80px; padding: 8px; }
.mode {
  width: 64px; height: 64px; border-radius: 100px; background: #fff;
  border: 1px solid var(--grey500); display: flex; align-items: center; justify-content: center;
  transition: background 200ms var(--ease), border-color 200ms var(--ease);
}
.mode img { width: 20px; height: 20px; }
/* Every glyph ships dark, and the selected one is knocked out white against the
   black circle. Swapping in a white file for the selected mode is how the
   unselected plane ended up white-on-white and invisible — there was no dark
   plane in the set at all. brightness(0) flattens the art to black, invert(1)
   takes it to pure white; #222 inverted alone would only reach #ddd. */
.mode.is-on img { filter: brightness(0) invert(1); }
.mode.is-on { background: var(--grey1000); border-color: var(--grey1000); }
.dur { width: 324px; display: flex; flex-direction: column; gap: 16px; flex: none; }
.dur-row { display: flex; align-items: center; justify-content: space-between; font-size: 14px; line-height: 18px; white-space: nowrap; }
.dur-row .k { font-weight: 600; }
.dur-row .v { font-weight: 400; color: var(--grey700); }
/* Built rather than dropped in as the exported SVG, because the knob has to
   move: rail is any duration, so it sits hard right, where flights and driving
   sit at the frame's 62%. --pos is the one number that says where. */
.dur-track { position: relative; height: 20px; --pos: 62%; }
.dur-track .rail { position: absolute; left: 0; right: 0; top: 9px; height: 2px; border-radius: 2px; background: var(--grey400); }
.dur-track .fill { position: absolute; left: 0; top: 9px; height: 2px; border-radius: 2px; background: var(--grey1000); width: var(--pos); transition: width 420ms var(--ease); }
.dur-track .knob { position: absolute; top: 0; left: var(--pos); width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: var(--grey1000); transition: left 420ms var(--ease); }

/* City layer rows */
.rows { display: flex; flex-direction: column; gap: 12px; flex: none; }
.row {
  width: 332px; height: 88px; border: 1px solid var(--grey400); border-radius: 16px;
  background: #fff; display: flex; align-items: center; justify-content: space-between;
  padding: 24px 20px; transition: box-shadow 200ms var(--ease), transform 200ms var(--ease);
}
.row:hover { box-shadow: var(--elev2); transform: translateY(-1px); }
.row .rt { font-size: 14px; line-height: 18px; font-weight: 600; white-space: nowrap; }
.row .rs { font-size: 12px; line-height: 16px; font-weight: 400; color: var(--grey700); white-space: nowrap; }
.row .rc { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.badge { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 8px; flex: none; }
.badge img.p { width: 12px; height: 12px; }
.badge img.i { width: 16px; height: 16px; }

/* ── Neighbourhood layer ────────────────────────────────────────────────────
   The card nearly doubles in width for the listings. Same shell, same 32 gap;
   only the grid is new. */
.card.is-hood { width: 716px; height: 822px; }
.search-inline { flex-direction: row; align-items: baseline; gap: 4px; }
.search-inline .t, .search-inline .s { font-size: 14px; line-height: 16px; }
.grid {
  display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 16px; row-gap: 32px;
  width: 668px; flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
  scrollbar-width: none; align-content: start;
}
.grid::-webkit-scrollbar { display: none; }
.home { display: flex; flex-direction: column; gap: 12px; }
.home .shot { position: relative; }
.home .shot img.ph { width: 100%; aspect-ratio: 219.33 / 210; object-fit: cover; border-radius: 16.55px; }
/* The like button is the Trips one, inline rather than an <img>, because the
   fill has to change when it is saved. The Figma export could not be used as
   drawn: it is a 22.5x19.66 viewBox carrying preserveAspectRatio="none", so
   asking for the design's 24x24 box stretched the heart 22% tall. */
.home .heart { position: absolute; right: 12px; top: 12px; width: 24px; height: 24px; }
.home .heart svg { width: 24px; height: 24px; display: block; transition: transform 150ms cubic-bezier(.2,.9,.3,1.3); }
.home .heart:active svg { transform: scale(.86); }
.home .heart path { fill: rgba(0,0,0,.45); stroke: #fff; stroke-width: 2; transition: fill 180ms var(--ease); }
.home .heart.saved path { fill: var(--rausch600); }
.home .meta { padding: 0 4px; display: flex; flex-direction: column; gap: 2px; }
.home .ht { font-size: 13px; line-height: 16px; font-weight: 500; }
.home .hp { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12px; line-height: 16px; color: #6a6a6a; }
.home .hp .sep { color: var(--grey500); }
.home .hp .star { width: 11px; height: 10.5px; }   /* its viewBox is 7.88x7.52, not square */

/* price pills at neighbourhood depth — the number is the whole label */
.mk-price { cursor: default; }
.mk-price .pill {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  height: 32px; padding: 7px 12px; background: #fff; border-radius: 100px;
  box-shadow: var(--elev2); font-size: 14px; line-height: 18px; font-weight: 600;
  white-space: nowrap;
}

/* The duration chip that rides the hovered route — black pill, 12 clock, 10/14
   bold white, exactly as the Traffic component in the frames. It sits above
   every marker because it is the thing the hover is there to say. */
.mk-chip { z-index: 5; pointer-events: none; }
.mk-chip .chip {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  display: flex; align-items: center; gap: 6px; padding: 4px 8px 4px 4px;
  background: var(--grey1000); border-radius: 100px; white-space: nowrap;
  font-size: 10px; line-height: 14px; font-weight: 700; color: #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,.24);
}
.mk-chip .chip img { width: 12px; height: 12px; }

/* ── Zoom control ───────────────────────────────────────────────────────── */
.zoom {
  position: fixed; right: 32px; bottom: 24px; z-index: 20;
  width: 40px; background: #fff; border-radius: 8px; box-shadow: var(--elev3);
  display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px 0;
}
.zoom button { width: 20px; height: 20px; display: flex; }
.zoom img { width: 20px; height: 20px; }
.zoom .hr { width: 40px; height: 1px; background: var(--grey300); }

/* ── Markers ────────────────────────────────────────────────────────────────
   Every marker is an outer box Mapbox owns (it writes the transform) wrapping
   an .mi that this file animates. Touching the outer one fights the map. */
/* absolute, not relative: this rule sits after mapbox-gl.css and has the same
   specificity as `.mapboxgl-marker`, so `position: relative` here quietly wins
   and every marker falls back into document flow — pins stack down the page
   and drift further from their coordinate the further down the list they are. */
.mk { position: absolute; }
/* Anything carrying a name outranks anything that does not, so a stray pin can
   never come down on top of LaGuardia. Markers are DOM siblings in the order
   they were added, so without this the set added last simply wins. */
.mk-dot  { z-index: 1; }
.mk-city, .mk-hood { z-index: 2; }
.mk-air  { z-index: 3; }
.mk-me   { z-index: 4; }
.mi {
  position: absolute; inset: 0;
  opacity: 0; transform: translateY(8px) scale(.9); transform-origin: 50% 100%;
  transition: opacity 320ms var(--ease), transform 420ms var(--ease);
}
.mk.in .mi { opacity: 1; transform: none; }

/* The bare pin: a 20 round head on a 1.5 metal stem. On a labelled marker the
   head is not a separate thing sitting beside the pill — it sits ON the pill,
   in the inset the pill's own left padding leaves for it, with only the stem
   carrying on out the bottom. Hence the z-index and the markup order: the pin
   is written after the pill, so the white never lands over the red. */
.pin { position: absolute; width: 20px; z-index: 1; }
.pin .stem { position: absolute; left: 9.25px; top: 12px; width: 1.5px; border-radius: 100px; background: var(--grey700); }
.pin .head { position: absolute; left: 0; top: 0; width: 20px; height: 20px; border-radius: 50%; background: var(--rausch600); }
/* The head carries the mode: rausch for a flight, Blue 1 for a drive, amber
   for the train. Same pin, same pill — only the colour and the glyph move. */
.mk-drive .pin .head, .mk-drive .pin-sm .head { background: var(--blue1); }
.mk-rail  .pin .head, .mk-rail  .pin-sm .head { background: #ffa513; }
.pin .head::after {
  content: ''; position: absolute; left: 1px; top: .5px; width: 9px; height: 5.5px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255,255,255,.55), rgba(220,180,180,0));
  transform: rotate(-30deg);
}
.pin .head img { position: absolute; left: 4px; top: 4px; width: 12px; height: 12px; }

/* An unnamed pin is NOT the labelled pin with the label taken off — it is its
   own smaller component: a 10 head on a 1px stem, 15 tall, centred in a 28×36
   box, and no icon in the head — a 6px plane inside a 10px circle is a smudge,
   not a plane. Shrinking the 20px one instead gives a fat dot with a thick stem
   that competes with the pills it is supposed to sit quietly behind. */
.mk-dot { width: 28px; height: 36px; }
.pin-sm { position: absolute; left: 9px; bottom: 0; width: 10px; height: 15px; z-index: 1; }
.pin-sm .stem { position: absolute; left: 4.5px; top: 5px; width: 1px; height: 10px; border-radius: 100px; background: var(--grey700); }
.pin-sm .head { position: absolute; left: 0; top: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--rausch600); }

/* city price pill — 142×36, pill 28 tall, pin hung at x=4 */
.mk-city { height: 36px; cursor: pointer; }
.mk-city .pill {
  position: absolute; left: 0; top: 0; height: 28px; background: #fff; border-radius: 100px;
  box-shadow: var(--elev2); padding: 4px 12px 4px 32px; display: flex; gap: 2px;
  font-size: 12px; line-height: 20px; white-space: nowrap;
  transition: box-shadow 200ms var(--ease);
}
.mk-city .pill b { font-weight: 700; }
.mk-city .pill span { font-weight: 400; }
.mk-city .pin { left: 4px; top: 4px; height: 32px; }
.mk-city .pin .stem { height: 20px; }
.mk-city:hover .pill, .mk-hood.hero:hover .pill { box-shadow: 0 0 0 1px rgba(0,0,0,.02), 0 4px 10px rgba(0,0,0,.08), 0 10px 20px rgba(0,0,0,.14); }

/* whichever marker is the way down keeps a slow ring going */
.mk.hero .pin .head::before {
  content: ''; position: absolute; inset: 0; border-radius: 50%;
  box-shadow: 0 0 0 0 rgba(255,56,92,.5); animation: ring 2.6s var(--ease) infinite;
}
@keyframes ring {
  0%   { box-shadow: 0 0 0 0 rgba(255,56,92,.45); }
  70%  { box-shadow: 0 0 0 14px rgba(255,56,92,0); }
  100% { box-shadow: 0 0 0 0 rgba(255,56,92,0); }
}

/* borough pill — 139×48, two lines, pin at x=11 */
.mk-hood { width: 139px; height: 48px; }
.mk-hood .pill {
  position: absolute; left: calc(50% - 2px); transform: translateX(-50%); top: 1px; height: 42px;
  width: 135px; background: #fff; border-radius: 100px; box-shadow: var(--elev2);
  padding: 8px 20px 8px 40px; overflow: hidden; white-space: nowrap;
}
.mk-hood .pill b { display: block; font-size: 12px; line-height: 14px; font-weight: 700; }
.mk-hood .pill span { display: block; font-size: 10px; line-height: 12px; font-weight: 400; }
.mk-hood .pin { left: 11px; bottom: 0; top: 12px; height: 36px; }
.mk-hood .pin .stem { height: 24px; }

/* airport card — 160×97, blue, tail at the bottom centre */
.mk-air { width: 160px; height: 97px; }
.mk-air .card-a {
  position: absolute; left: 0; top: 0; width: 160px; height: 86px; background: var(--blue1);
  border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px;
  filter: drop-shadow(0 8px 12px rgba(0,0,0,.18));
}
.mk-air .top { display: flex; align-items: center; justify-content: space-between; }
.mk-air .top img.pl { width: 16px; height: 16px; }
.mk-air .top img.cb { width: 20px; height: 20px; }
.mk-air .ct { color: #fff; }
.mk-air .ct b { display: block; font-size: 12px; line-height: 16px; font-weight: 600; white-space: nowrap; }
.mk-air .ct span { display: block; font-size: 12px; line-height: 16px; font-weight: 400; white-space: nowrap; }
.mk-air .tail {
  position: absolute; left: 50%; bottom: 1px; width: 17px; height: 17px;
  background: var(--blue1); transform: translateX(-50%) rotate(45deg); border-radius: 2px;
}

/* The traveller's own pin — 40×48, black, face inside.
   The tail is a square stood on its corner, and the only corner of it anyone
   should ever see is the bottom one. Two things keep it that way: it is drawn
   BEFORE the disc, so the black circle paints over it rather than under it,
   and it is tucked high enough that its left and right corners fall INSIDE the
   circle's edge — at y 36.7 the disc is 13.4 wide either side of centre and the
   square only reaches 11.3, so they are covered with 2px to spare. Sit it any
   lower and those two corners flare out past the disc and the whole thing
   reads as a diamond hanging off a circle instead of a pin with a point. */
.mk-me { width: 40px; height: 48px; filter: drop-shadow(0 12px 15px rgba(0,0,0,.18)); }
.mk-me .tail {
  position: absolute; left: 50%; top: 28.7px; width: 16px; height: 16px; background: var(--grey1000);
  transform: translateX(-50%) rotate(45deg); border-radius: 1.5px;
}
.mk-me .body { position: absolute; left: 0; top: 1px; width: 40px; height: 41px; border-radius: 100px; background: var(--grey1000); }
.mk-me img { position: absolute; left: 2px; top: 3px; width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }

/* ── Narrow ─────────────────────────────────────────────────────────────────
   Below the frame's own width the card comes off its 380 column and sits
   across the bottom, because a 380 panel on a phone is the whole screen. */
@media (max-width: 900px) {
  .hdr-nav { display: none; }
  .mapboxgl-ctrl-bottom-left { left: 0; }
  .card { left: 12px; right: 12px; width: auto; top: auto; bottom: 12px; }
  .layer { padding: 16px 16px 24px; gap: 20px; overflow: auto; }
  .search { width: 100%; }
  .rule { width: 100%; }
  .card { height: 470px; } .card.is-city { height: 520px; }
  .zoom { display: none; }   /* it lands on top of the card down here */
  .card.is-hood { width: auto; height: 60vh; }
  .grid { width: 100%; grid-template-columns: repeat(2, 1fr); row-gap: 20px; }
  .search-inline { flex-wrap: wrap; justify-content: center; }
}
@media (prefers-reduced-motion: reduce) {
  .card, .layer, .mi { transition-duration: 1ms !important; }
  .mk.hero .pin .head::before { animation: none; }
}
</style>
</head>

<header class="hdr">
  <img class="hdr-logo" src="assets/icons/logo.svg" alt="Airbnb">
  <nav class="hdr-nav">
    <div class="hdr-tab is-on"><img src="assets/img/nav-explore.jpg" alt=""><span>Explore</span></div>
    <div class="hdr-tab"><img src="assets/img/nav-homes.png" alt=""><span>Homes</span></div>
    <div class="hdr-tab"><img src="assets/img/nav-experiences.png" alt=""><span>Experiences</span></div>
  </nav>
  <div class="hdr-right">
    <img class="hdr-avatar" src="assets/img/avatar.png" alt="">
    <div class="hdr-menu"><img src="assets/icons/menu.svg" alt="Menu"></div>
  </div>
</header>

<div id="map"></div>

<section class="card" id="card">

  <!-- ── Continent: plan a trip ───────────────────────────────────────── -->
  <div class="layer" id="layerUsa">
    <div class="search">
      <div class="search-btn"><img src="assets/icons/search.svg" alt=""></div>
      <div class="search-mid"><p class="t">Plan a trip</p></div>
      <div class="search-btn"><img src="assets/icons/filter.svg" alt=""></div>
    </div>

    <div class="vibes">
      <button class="vibe is-on"><img class="thumb" src="assets/img/vibe-popular.png" alt=""><span class="lbl">Popular</span><i class="ring"></i></button>
      <button class="vibe"><img class="thumb" src="assets/img/vibe-unique.png" alt=""><span class="lbl">Unique</span><i class="ring"></i></button>
      <button class="vibe"><img class="thumb" src="assets/img/vibe-relax.png" alt=""><span class="lbl">Relax</span><i class="ring"></i></button>
      <button class="vibe"><img class="thumb" src="assets/img/vibe-adventure.png" alt=""><span class="lbl">Adventure</span><i class="ring"></i></button>
    </div>

    <div class="stack">
      <div class="rule"></div>
      <div class="modes">
        <button class="mode is-on" data-beat="drive"><img src="assets/icons/car.svg" alt="Cars"></button>
        <button class="mode" data-beat="usa"><img src="assets/icons/mode-plane.svg" alt="Flights"></button>
        <button class="mode" data-beat="rail"><img src="assets/icons/train.svg" alt="Trains"></button>
        <button class="mode"><img src="assets/icons/walk.svg" alt="Walking"></button>
      </div>
      <div class="rule"></div>
    </div>

    <div class="dur">
      <div class="dur-row"><p class="k">Travel time</p><p class="v">Under 8 hours</p></div>
      <div class="dur-track"><i class="rail"></i><i class="fill"></i><i class="knob"></i></div>
    </div>
  </div>

  <!-- ── City: New York ───────────────────────────────────────────────── -->
  <div class="layer" id="layerCity" data-hidden>
    <div class="search">
      <button class="search-btn" id="back"><img src="assets/icons/chevron-back.svg" alt="Back"></button>
      <div class="search-mid">
        <p class="t">New York, New York</p>
        <p class="s">Week in Nov-Feb · Add guests</p>
      </div>
      <div class="search-btn"><img src="assets/icons/filter.svg" alt=""></div>
    </div>

    <div class="vibes">
      <button class="vibe is-on"><img class="thumb" src="assets/img/nyc-iconic.png" alt=""><span class="lbl">Iconic</span><i class="ring"></i></button>
      <button class="vibe"><img class="thumb" src="assets/img/nyc-trendy.png" alt=""><span class="lbl">Trendy</span><i class="ring"></i></button>
      <button class="vibe"><img class="thumb" src="assets/img/nyc-relaxing.png" alt=""><span class="lbl">Relaxing</span><i class="ring"></i></button>
    </div>

    <div class="rows">
      <button class="row">
        <span class="rc"><span class="rt">Flights to New York</span><span class="rs">From $678</span></span>
        <span class="badge" style="background:var(--blue1)"><img class="p" src="assets/icons/add.svg" alt=""><img class="i" src="assets/icons/plane16.svg" alt=""></span>
      </button>
      <button class="row" id="toHomes">
        <span class="rc"><span class="rt">Homes in New York</span><span class="rs">$498 night average</span></span>
        <span class="badge" style="background:var(--rausch600)"><img class="p" src="assets/icons/add.svg" alt=""><img class="i" src="assets/icons/house16.svg" alt=""></span>
      </button>
      <button class="row">
        <span class="rc"><span class="rt">Experiences nearby</span><span class="rs">237 available</span></span>
        <span class="badge" style="background:var(--orange600)"><img class="p" src="assets/icons/add.svg" alt=""><img class="i" src="assets/icons/ticket16.svg" alt=""></span>
      </button>
    </div>
  </div>

  <!-- ── Neighbourhood: homes in Williamsburg ─────────────────────────── -->
  <div class="layer" id="layerHood" data-hidden>
    <div class="search">

      </div>

    </div>
    <div class="grid" id="homeGrid"></div>
  </div>

</section>

      center: [c.center[0] + back, c.center[1]],
      zoom: c.zoom - Math.min(Math.log(1512 / w) / Math.LN2, 2.1)
    };
  }

  var USA_CAM  = { center: [-95.5, 36.8], zoom: 3.42, narrow: 6 };
  var NYC_CAM  = { center: [-73.95, 40.72], zoom: 10.05, narrow: 0.1 };
  var HOOD_CAM = { center: [-73.9560, 40.7117], zoom: 13.8, narrow: 0.01 };
  var DRIVE_CAM = { center: [-119.0, 38.2], zoom: 5.75, narrow: 2 };
  var RAIL_CAM  = { center: [-95.5, 37.4],  zoom: 3.4,  narrow: 6 };

  // ── Map ─────────────────────────────────────────────────────────────────
  var map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/standard',
    // Flat, not the globe Standard defaults to — the frame is a Mercator
    // continent, and a curved limb behind the pins is a different drawing.
    projection: 'mercator',
    center: cam(USA_CAM).center, zoom: cam(USA_CAM).zoom,
    pitch: 0, bearing: 0, minZoom: 2.4, maxZoom: 16,
    dragRotate: false, pitchWithRotate: false, attributionControl: true
  });

  // The Standard style, dressed the way the frame shows it: day light, faded
  // theme, place labels and roads but nothing else competing with the pins.
  map.on('style.load', function () {
    var cfg = function (k, v) { try { map.setConfigProperty('basemap', k, v); } catch (e) {} };
    cfg('lightPreset', 'day');
    cfg('theme', 'faded');
    cfg('colorPlaceLabels', '#8a8a8a');
    cfg('showPointOfInterestLabels', false);
    cfg('showLandmarkIcons', false);
    cfg('showLandmarkIconLabels', false);
    cfg('showTransitLabels', false);
    cfg('show3dObjects', false);
    // The constructor drops `padding`, so it is set once the style is up —
    // this is what keeps the field of pins clear of the 380 card.
    map.setPadding(PAD());
  });

  // A resize changes both the padding and, below the frame's width, the zoom
  // the camera needs to show the same ground.
  window.addEventListener('resize', function () {
    map.setPadding(PAD());
    if (!busy) { var c = cam(BEATS[state].cam); map.easeTo({ center: c.center, zoom: c.zoom, duration: 300 }); }
  });

  // Handed out the way multical hands out its model: a deck (or the console)
  // can drive the camera and the two states without faking clicks.
  window.__explore = { map: map, go: function (b) { go(b); }, at: function () { return state; } };

  // ── Marker plumbing ─────────────────────────────────────────────────────
  // Every marker is built as {outer, inner}. Mapbox writes the transform on
  // the outer; `.in` on the outer is what fades the inner in and out, so the
  // two never fight over the same property.
  function mk(cls, w, h, html, anchor, offset) {
    var el = document.createElement('div');
    el.className = 'mk ' + cls;
    el.style.width = w + 'px';
    el.style.height = h + 'px';
    var inner = document.createElement('div');
    inner.className = 'mi';
    inner.innerHTML = html;
    el.appendChild(inner);
    var m = new mapboxgl.Marker({ element: el, anchor: anchor, offset: offset || [0, 0] });
    return { el: el, marker: m };
  }

  var PIN = '<div class="pin"><i class="stem"></i><i class="head"><img src="assets/icons/pin-plane.svg" alt=""></i></div>';
  var PIN_SM = '<div class="pin-sm"><i class="stem"></i><i class="head"></i></div>';

  function makeCity(c) {
    var o = mk('mk-city' + (c.hero ? ' hero' : ''), 142, 36,
      '<div class="pill"><b>' + c.n + ' ·</b><span>$' + c.p + '</span></div>' + PIN,
      'bottom-left', [-14, 0]);
    o.marker.setLngLat(c.ll);
    if (c.hero) {
      // Hovering the city you can fly to draws the leg you would fly.
      o.el.addEventListener('click', function () { go('nyc'); });
      o.el.addEventListener('mouseenter', function () { showFlight(ME, c.ll, '5h 30m', 0.24); });
      o.el.addEventListener('mouseleave', hideRoute);
    } else {
      o.el.style.cursor = 'default';
    }
    return o;
  }
  function makeDot(ll, cls) {
    var o = mk('mk-dot' + (cls ? ' ' + cls : ''), 28, 36, PIN_SM, 'bottom');
    o.marker.setLngLat(ll);
    return o;
  }
  function makeHood(h) {
    var o = mk('mk-hood' + (h.hero ? ' hero' : ''), 139, 48,
      '<div class="pill"><b>' + h.n + '</b><span>$' + h.p + ' night avg</span></div>' + PIN,
      'bottom-left', [-21, 0]);
    o.marker.setLngLat(h.ll);
    if (h.hero) {
      o.el.style.cursor = 'pointer';
      o.el.addEventListener('click', function () { go('hood'); });
      // At city depth the question is not which airport the card quotes, it is
      // how far this borough is from each of them — so all three draw at once,
      // along the roads, with the durations traffic is giving them now.
      o.el.addEventListener('mouseenter', function () { showDrives(AIRPORTS, h.ll); });
      o.el.addEventListener('mouseleave', hideRoute);
    } else {
      o.el.style.cursor = 'default';
    }
    return o;
  }
  function makeAir(a) {
    var o = mk('mk-air', 160, 97,
      '<div class="card-a">' +
        '<div class="top"><img class="pl" src="assets/icons/plane16.svg" alt="">' +
        '<img class="cb" src="assets/icons/checkbox.svg" alt=""></div>' +
        '<div class="ct"><b>' + a.n + '</b><span>From $' + a.p + '</span></div>' +
      '</div><i class="tail"></i>', 'bottom');
    o.marker.setLngLat(a.ll);
    return o;
  }
  function makeMe() {
    var o = mk('mk-me', 40, 48,
      '<i class="tail"></i><i class="body"></i><img src="assets/img/avatar.png" alt="">', 'bottom');
    o.marker.setLngLat(ME);
    return o;
  }

  // A drive and a rail leg are the same pill as a city price — bold name, the
  // interpunct, then the value in Book. Only the value is hours, not dollars.
  function makeTimed(cls, glyph, d, hover) {
    var pin = '<div class="pin"><i class="stem"></i><i class="head">' +
              '<img src="assets/icons/' + glyph + '" alt=""></i></div>';
    var o = mk('mk-city ' + cls, 142, 36,
      '<div class="pill"><b>' + d.n + ' ·</b><span>' + d.t + '</span></div>' + pin,
      'bottom-left', [-14, 0]);
    o.marker.setLngLat(d.ll);
    o.el.style.cursor = 'default';
    if (hover) {
      // The road, and only the road. The pill is already carrying the hours,
      // so a chip sitting on the line just says the same thing twice.
      o.el.addEventListener('mouseenter', function () {
        showDrives([{ ll: ME, fallback: null }], d.ll);
      });
      o.el.addEventListener('mouseleave', hideRoute);
    }
    return o;
  }

  function makePrice(d) {
    var o = mk('mk-price', 57, 32, '<div class="pill">$' + d[0] + '</div>', 'center');
    o.marker.setLngLat([d[1], d[2]]);
    return o;
  }

  // Build all three sets up front. Only one is ever on the map.
  var usaSet  = CITIES.map(makeCity).concat(DOTS.map(makeDot), [makeMe()]);
  var citySet = HOODS.map(makeHood).concat(AIRPORTS.map(makeAir), NYC_DOTS.map(makeDot));
  var hoodSet = PRICES.map(makePrice);
  var driveSet = DRIVES.map(function (d) { return makeTimed('mk-drive', 'pin-car.svg', d, true); })
    .concat(DRIVE_DOTS.map(function (ll) { return makeDot(ll, 'mk-drive'); }), [makeMe()]);
  var railSet = RAILS.map(function (d) { return makeTimed('mk-rail', 'pin-train.svg', d); })
    .concat(RAIL_DOTS.map(function (ll) { return makeDot(ll, 'mk-rail'); }), [makeMe()]);

  // ── The neighbourhood mask ──────────────────────────────────────────────
  // A world-sized polygon with Williamsburg punched out of it dims everything
  // that is not the neighbourhood; a thin rausch line draws the edge itself.
  // Both layers live under `top` so Mapbox's own labels still read through.
  function addHoodMask() {
    if (map.getSource('wburg')) return;
    map.addSource('wburg', { type: 'geojson', data: {
      type: 'Feature', geometry: { type: 'Polygon', coordinates: [
        [[-180, -85], [180, -85], [180, 85], [-180, 85], [-180, -85]], WBURG
      ] } } });
    map.addSource('wburg-line', { type: 'geojson', data: {
      type: 'Feature', geometry: { type: 'LineString', coordinates: WBURG } } });
    map.addLayer({ id: 'wburg-dim', type: 'fill', source: 'wburg', slot: 'top',
      paint: { 'fill-color': '#6c6c6c', 'fill-opacity': 0 } });
    map.addSource('route', { type: 'geojson', data: {
      type: 'Feature', geometry: { type: 'LineString', coordinates: [] } } });
    map.addLayer({ id: 'route-line', type: 'line', source: 'route', slot: 'top',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': '#222222', 'line-width': 2, 'line-dasharray': [2, 2],
               'line-opacity': 0, 'line-emissive-strength': 1,
               'line-opacity-transition': { duration: 220 } } });
    map.addSource('mode-route', { type: 'geojson', data: {
      type: 'Feature', geometry: { type: 'MultiLineString', coordinates: [] } } });
    map.addLayer({ id: 'mode-route-line', type: 'line', source: 'mode-route', slot: 'top',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': '#222222', 'line-width': 2, 'line-dasharray': [2, 2],
               'line-opacity': 0, 'line-emissive-strength': 1,
               'line-opacity-transition': { duration: 260 } } });
    map.addLayer({ id: 'wburg-edge', type: 'line', source: 'wburg-line', slot: 'top',
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': '#ff385c', 'line-width': 1, 'line-opacity': 0 } });
  }
  // ── The hovered route ───────────────────────────────────────────────────
  // Two kinds of leg, and they are drawn differently because they ARE
  // different. A flight has no road under it, so it is a quadratic bezier —
  // a straight segment between two pins reads as a ruler, and the bow is what
  // makes it read as a journey. A drive does have a road under it, on a map
  // that is drawing that road, so guessing its shape is not an option: those
  // come back from the Directions API on the driving-traffic profile, which
  // also gives the duration the chip shows — a real number under real traffic,
  // not one typed in here.
  function arc(a, b, k) {
    var dx = b[0] - a[0], dy = b[1] - a[1];
    var len = Math.sqrt(dx * dx + dy * dy) || 1e-6;
    var cx = (a[0] + b[0]) / 2 + (-dy / len) * len * k;
    var cy = (a[1] + b[1]) / 2 + ( dx / len) * len * k;
    var pts = [], n = 64;
    for (var i = 0; i <= n; i++) {
      var t = i / n, u = 1 - t;
      pts.push([u * u * a[0] + 2 * u * t * cx + t * t * b[0],
                u * u * a[1] + 2 * u * t * cy + t * t * b[1]]);
    }
    return pts;
  }

  // The chip rides the HALFWAY POINT BY LENGTH, not the middle of the point
  // list: a road route is densely sampled through turns and sparsely sampled
  // down a straight, so the middle index can sit a long way from the middle of
  // the drive.
  function midpoint(line) {
    var d = [0], i;
    for (i = 1; i < line.length; i++) {
      var dx = line[i][0] - line[i - 1][0], dy = (line[i][1] - line[i - 1][1]) * 1.32;
      d.push(d[i - 1] + Math.sqrt(dx * dx + dy * dy));
    }
    var half = d[d.length - 1] / 2;
    for (i = 1; i < d.length; i++) if (d[i] >= half) {
      var t = (half - d[i - 1]) / (d[i] - d[i - 1] || 1);
      return [line[i - 1][0] + (line[i][0] - line[i - 1][0]) * t,
              line[i - 1][1] + (line[i][1] - line[i - 1][1]) * t];
    }
    return line[Math.floor(line.length / 2)];
  }

  function mins(sec) {
    var m = Math.round(sec / 60);
    return m < 60 ? m + ' min' : Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
  }

  // One chip per leg, pooled — three airports means three at once.
  var chips = [];
  function chipAt(i) {
    if (!chips[i]) { chips[i] = mk('mk-chip', 0, 0, '', 'center'); chips[i].added = false; }
    return chips[i];
  }

  var hoverGen = 0;              // a hover that ended must not paint when its fetch lands
  var driveCache = {};           // the Directions answer, kept for the session

  function paint(legs) {
    if (!map.getSource('route')) return;
    map.getSource('route').setData({
      type: 'FeatureCollection',
      features: legs.map(function (l) {
        return { type: 'Feature', geometry: { type: 'LineString', coordinates: l.line } };
      })
    });
    map.setPaintProperty('route-line', 'line-opacity', 0.9);
    var shown = 0;
    legs.forEach(function (l) {
      if (!l.label) return;               // the pill already says how long it takes
      var c = chipAt(shown++);
      c.el.querySelector('.mi').innerHTML =
        '<div class="chip"><img src="assets/icons/clock.svg" alt="">' + l.label + '</div>';
      c.marker.setLngLat(midpoint(l.line));
      if (!c.added) { c.marker.addTo(map); c.added = true; }
      requestAnimationFrame(function () { c.el.classList.add('in'); });
    });
    for (var j = shown; j < chips.length; j++) chips[j].el.classList.remove('in');
  }

  function hideRoute() {
    hoverGen++;
    if (map.getLayer('route-line')) map.setPaintProperty('route-line', 'line-opacity', 0);
    chips.forEach(function (c) { c.el.classList.remove('in'); });
  }

  // A flight: one bezier, one typed duration, nothing to ask a server about.
  function showFlight(from, to, label, k) {
    hoverGen++;
    paint([{ line: arc(from, to, k), label: label }]);
  }

  // Drives: every airport to the destination, along the actual roads, with the
  // duration traffic is giving them right now. The bezier is drawn immediately
  // as a stand-in so the hover is never dead while the network works, and each
  // leg is replaced by its real road the moment that leg comes back.
  function showDrives(from, to) {
    var gen = ++hoverGen;
    var legs = from.map(function (o) {
      return { line: arc(o.ll, to, 0.14), label: o.fallback };
    });
    paint(legs);

    from.forEach(function (o, i) {
      var key = o.ll.join(',') + ';' + to.join(',');
      var done = function (r) {
        if (gen !== hoverGen || !r) return;
        // A leg that asked for no chip keeps none when its road lands.
        legs[i] = { line: r.line, label: o.fallback === null ? null : mins(r.dur) };
        paint(legs);
      };
      if (driveCache[key]) { done(driveCache[key]); return; }
      var url = 'https://api.mapbox.com/directions/v5/mapbox/driving-traffic/' +
        o.ll.join(',') + ';' + to.join(',') +
        '?geometries=geojson&overview=full&access_token=' + mapboxgl.accessToken;
      fetch(url).then(function (res) { return res.json(); }).then(function (j) {
        var rt = j && j.routes && j.routes[0];
        if (!rt) return;
        driveCache[key] = { line: rt.geometry.coordinates, dur: rt.duration };
        done(driveCache[key]);
      }).catch(function () {
        // no network, or the Directions endpoint said no — the bezier stand-in
        // and its typical-traffic label are already on screen, so nothing to do.
      });
    });
  }

  // A transport beat draws its own line and keeps it for as long as the beat
  // lasts — unlike a hover leg, which belongs to the pointer. Rail is the
  // real Amtrak long-distance network; driving draws nothing until you hover.
  function showModeRoute(beat) {
    if (!map.getLayer('mode-route-line')) return;
    var src = map.getSource('mode-route');
    if (beat === 'rail') {
      src.setData({ type: 'Feature', geometry: { type: 'MultiLineString', coordinates: window.RAIL_LINES || [] } });
      map.setPaintProperty('mode-route-line', 'line-opacity', 0.9);
      return;
    }
    // Driving draws nothing by itself. One road standing on the map says Tahoe
    // is the trip, when the whole point of the beat is the eight places you
    // could pick — so the road is the answer to a hover, not the opening state.
    map.setPaintProperty('mode-route-line', 'line-opacity', 0);
  }

  function paintHoodMask(on) {
    if (!map.getLayer('wburg-dim')) return;
    map.setPaintProperty('wburg-dim', 'fill-opacity', on ? 0.22 : 0);
    map.setPaintProperty('wburg-edge', 'line-opacity', on ? 0.9 : 0);
  }

  // Adding a marker and revealing it are two beats: add it invisible, then let
  // a frame pass so the transition actually has something to run from.
  function show(set, stagger) {
    set.forEach(function (o, i) {
      o.marker.addTo(map);
      setTimeout(function () { o.el.classList.add('in'); }, 40 + i * (stagger || 40));
    });
  }
  function hide(set, stagger, done) {
    set.forEach(function (o, i) {
      setTimeout(function () { o.el.classList.remove('in'); }, i * (stagger || 24));
    });
    setTimeout(function () {
      set.forEach(function (o) { o.marker.remove(); });
      if (done) done();
    }, set.length * (stagger || 24) + 420);
  }

  // ── The drill-in ────────────────────────────────────────────────────────
  // Three beats — continent, city, neighbourhood — and one move between any
  // two of them. Three things travel together: the field of markers clears,
  // the camera flies, and the card morphs. The card starts a beat AFTER the
  // camera, so the eye is already moving by the time the panel changes under
  // it; start them together and it reads as two separate cuts.
  // The three transport beats share the one card — the picker is the only
  // thing that changes on it — so `depth` rather than the key order is what
  // says which way a move is going. Same depth means a sideways move: the whole
  // field leaves together and the new one arrives, no marker held back.
  var BEATS = {
    drive: { cam: DRIVE_CAM, set: driveSet, layer: 'layerUsa',  cls: '',        tab: 0, depth: 0, mode: 0, dur: ['62%', 'Under 8 hours'] },
    usa:   { cam: USA_CAM,   set: usaSet,   layer: 'layerUsa',  cls: '',        tab: 0, depth: 0, mode: 1, dur: ['62%', 'Under 8 hours'] },
    rail:  { cam: RAIL_CAM,  set: railSet,  layer: 'layerUsa',  cls: '',        tab: 0, depth: 0, mode: 2, dur: ['100%', 'Any duration'] },
    nyc:   { cam: NYC_CAM,   set: citySet,  layer: 'layerCity', cls: 'is-city', tab: 0, depth: 1 },
    hood:  { cam: HOOD_CAM,  set: hoodSet,  layer: 'layerHood', cls: 'is-hood', tab: 1, depth: 2 }
  };

  var state = 'drive', busy = false;   // the car is where this opens
  var card = document.getElementById('card');
  var tabs = document.querySelectorAll('.hdr-tab');

  function go(next) {
    if (busy || next === state) return;
    var from = BEATS[state], to = BEATS[next];
    var deeper = to.depth > from.depth;
    busy = true;
    var prev = state; state = next;
    hideRoute();   // a leg belongs to the beat that drew it

    // Going deeper, the marker you aimed at holds its ground while the field
    // around it clears — it is the thing the camera is travelling toward, so
    // it is the last to let go. Coming back out, everything leaves together.
    from.set.forEach(function (o, i) {
      if (deeper && o.el.classList.contains('hero')) return;
      setTimeout(function () { o.el.classList.remove('in'); }, i * (deeper ? 18 : 20));
    });

    map.flyTo({
      center: cam(to.cam).center, zoom: cam(to.cam).zoom, padding: PAD(),
      duration: deeper ? 1500 : 1250, curve: 1.5, speed: 0.9, essential: true
    });

    setTimeout(function () {
      card.classList.remove('is-city', 'is-hood');
      if (to.cls) card.classList.add(to.cls);
      // Only cross-fade the layers when they actually differ — the transport
      // beats share one, and hiding then showing the same element would flash it.
      if (from.layer !== to.layer) {
        document.getElementById(from.layer).setAttribute('data-hidden', '');
        document.getElementById(to.layer).removeAttribute('data-hidden');
      }
      tabs.forEach(function (t, i) { t.classList.toggle('is-on', i === to.tab); });
      syncModes(to);
    }, deeper ? 180 : 160);

    if (deeper) setTimeout(function () {
      from.set.forEach(function (o) { o.el.classList.remove('in'); });
    }, 1150);

    setTimeout(function () {
      from.set.forEach(function (o) { o.marker.remove(); });
      paintHoodMask(next === 'hood');
      showModeRoute(next);
      show(to.set, deeper ? 55 : 32);
      busy = false;
    }, deeper ? 1650 : 1400);

    if (!deeper && prev === 'hood') paintHoodMask(false);
  }

  document.getElementById('back').addEventListener('click', function () { go('usa'); });
  document.getElementById('backHood').addEventListener('click', function () { go('nyc'); });
  document.getElementById('toHomes').addEventListener('click', function () { go('hood'); });
  document.getElementById('zin').addEventListener('click', function () { map.zoomIn({ duration: 400 }); });
  document.getElementById('zout').addEventListener('click', function () { map.zoomOut({ duration: 400 }); });

  // The nine listings, written once from the data rather than nine times in
  // the markup — they differ only by photo, title, price and rating.
  document.getElementById('homeGrid').innerHTML = HOMES.map(function (h, i) {
    return '<article class="home">' +
      '<div class="shot">' +
        '<img class="ph" src="assets/img/home-' + (i + 1) + '.jpg" alt="">' +
        '<button class="heart" type="button" aria-label="Save"><svg viewBox="0 0 32 32">' +
        '<path d="M16 28C9 23.4 3 18.7 3 11.9 3 8.1 6 5 9.8 5c2.5 0 4.8 1.3 6.2 3.5C17.4 6.3 19.7 5 22.2 5 26 5 29 8.1 29 11.9c0 6.8-6 11.5-13 16.1z"/>' +
        '</svg></button>' +
      '</div>' +
      '<div class="meta"><p class="ht">' + h.t + '</p>' +
      '<p class="hp"><span>' + h.p + ' for 1 week</span><span class="sep">·</span>' +
      '<img class="star" src="assets/icons/star.svg" alt="">' + h.r + '</p></div>' +
    '</article>';
  }).join('');

  document.getElementById('homeGrid').addEventListener('click', function (e) {
    var h = e.target.closest('.heart'); if (!h) return;
    h.classList.toggle('saved');
  });

  // Vibe cards are a one-of-four ring, per layer.
  document.querySelectorAll('.vibes').forEach(function (row) {
    row.addEventListener('click', function (e) {
      var v = e.target.closest('.vibe'); if (!v) return;
      row.querySelectorAll('.vibe').forEach(function (x) { x.classList.remove('is-on'); });
      v.classList.add('is-on');
    });
  });
  // The picker is three beats and a fourth chip. Walking has no map of its own
  // in the frames, so it highlights and stops there rather than inventing one.
  var modeBtns = document.querySelectorAll('.modes .mode');
  var durTrack = document.querySelector('.dur-track');
  var durValue = document.querySelector('.dur-row .v');
  function syncModes(beat) {
    if (beat.mode === undefined) return;
    modeBtns.forEach(function (x, i) { x.classList.toggle('is-on', i === beat.mode); });
    // Two days on a train is not "under 8 hours" — the filter has to say so.
    if (beat.dur) { durTrack.style.setProperty('--pos', beat.dur[0]); durValue.textContent = beat.dur[1]; }
  }
  document.querySelector('.modes').addEventListener('click', function (e) {
    var m = e.target.closest('.mode'); if (!m) return;
    modeBtns.forEach(function (x) { x.classList.remove('is-on'); });
    m.classList.add('is-on');
    if (m.dataset.beat) go(m.dataset.beat);
  });

  // Deep link for a deck: ?state=nyc / ?state=hood opens straight on that
  // beat. Decided BEFORE the load handler, so only one set is ever revealed.
  var m0 = /[?&]state=(usa|nyc|hood|drive|rail)\b/.exec(location.search);
  if (m0) {
    state = m0[1];
  }

  // Whatever beat we open on, the camera, the card and the picker start on it.
  var b0 = BEATS[state];
  map.jumpTo({ center: cam(b0.cam).center, zoom: cam(b0.cam).zoom, padding: PAD() });
  card.classList.remove('is-city', 'is-hood');
  if (b0.cls) card.classList.add(b0.cls);
  ['layerUsa', 'layerCity', 'layerHood'].forEach(function (id) {
    document.getElementById(id).toggleAttribute('data-hidden', id !== b0.layer);
  });
  tabs.forEach(function (t, i) { t.classList.toggle('is-on', i === b0.tab); });
  syncModes(b0);

  // The markers wait on nothing. They are DOM over the canvas, and hanging
  // them off `load` (the first full tile set) or `style.load` means that on a
  // slow style — or one whose imports never settle — the card sits there over
  // an empty map forever. They come up now; the tiles arrive under them.
  show(BEATS[state].set, 45);

  // The mask is the one thing that genuinely needs the style, because it adds
  // a source and two layers. Rather than trust an event, try until it takes.
  (function armMask(tries) {
    try {
      addHoodMask();
      paintHoodMask(state === 'hood');
      showModeRoute(state);
    } catch (e) {
      if (tries < 100) setTimeout(function () { armMask(tries + 1); }, 150);
    }
  })(0);
})();
</script>
</body>
</html>
